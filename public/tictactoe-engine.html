<!doctype html>
<html>
<head>
    <link rel="icon" href="/favicon.ico?v=4" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=4" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=4" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=4" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=4" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#7C5CFC" />

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Buildable Tic-Tac-Toe</title>
<style>
  html,body{margin:0;height:100%;background:#0b1030;overflow:hidden;touch-action:manipulation;font-family:'Fredoka',-apple-system,sans-serif;color:#fff}
  #wrap{position:fixed;inset:0;z-index:1;display:flex;align-items:center;justify-content:center}
  #world-bg{position:fixed;inset:0;z-index:0;background-size:cover;background-position:center;background-repeat:no-repeat;pointer-events:none}
  canvas{display:block;border-radius:18px;touch-action:none}
  #start{position:fixed;inset:0;z-index:10;display:none}
  #hud{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:20;font-weight:700;font-size:18px;
       background:rgba(20,16,54,.66);padding:8px 18px;border-radius:999px;pointer-events:none;white-space:nowrap}
  .corner{position:fixed;top:12px;z-index:30;font-family:inherit;font-weight:800;font-size:14px;color:#cdd0ff;
          background:rgba(26,20,64,.72);border:1px solid #3a2c6e;border-radius:12px;padding:8px 14px;cursor:pointer}
  #home{left:12px} #mute{right:12px;top:12px;bottom:auto}
  #banner{position:fixed;inset:0;z-index:40;display:none;flex-direction:column;align-items:center;justify-content:center;
          background:rgba(8,10,40,.74);backdrop-filter:blur(3px)}
  #banner.show{display:flex}
  #banner .card{background:linear-gradient(180deg,#1a1450,#2a1b6b);border:2px solid #4a36a0;border-radius:24px;
                padding:30px 40px;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.5)}
  #bTitle{font-size:40px;font-weight:700;margin:0 0 6px} #bSub{opacity:.82;margin:0 0 20px;font-size:18px}
  #again{font-family:inherit;font-weight:700;font-size:22px;color:#1a0f3a;background:#7ee0a0;border:none;border-radius:16px;
         padding:14px 40px;cursor:pointer;box-shadow:0 6px 0 #4cba74}
  #again:active{transform:translateY(3px);box-shadow:0 3px 0 #4cba74}
</style>
<style id="no-longpress">/* Buildable: disable iOS long-press magnifier + Look Up/Translate popup app-wide; keep inputs selectable */
html,body{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
input,textarea,select,[contenteditable]{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv"></canvas></div>
<div id="hud"></div>
<button id="home" class="corner">Home</button>
<button id="mute" class="corner">Sound: On</button>
<div id="start"></div>
<div id="banner"><div class="card"><h1 id="bTitle"></h1><p id="bSub"></p><button id="again">Play again</button></div></div>

<script src="buildable-renders.js"></script>
<script src="buildable-audio.js"></script>
<script src="buildable-mechanics.js"></script>
<script src="buildable-startscreen.js?v=2"></script>
<script src="buildable-gamenav.js"></script>
<script src="buildable-boardgame.js"></script>
<script>
/* Buildable: put a random painted world scene (ocean/jungle/space/...) behind the board */
(function(){ if(typeof document==="undefined") return;
  var WORLDS=["ocean","jungle","space","candy","castle","desert"];
  window.setRandomWorld=function(){ try{
    var bg=document.getElementById("world-bg");
    if(!bg){ bg=document.createElement("div"); bg.id="world-bg"; document.body.insertBefore(bg, document.body.firstChild); }
    var key=WORLDS[Math.floor(Math.random()*WORLDS.length)];
    bg.style.backgroundImage="linear-gradient(rgba(8,10,40,.40),rgba(8,10,40,.55)), url('chess-art/"+key+"_bg.jpg?v=2')";
  }catch(e){} };
  try{ WORLDS.forEach(function(k){ new Image().src="chess-art/"+k+"_bg.jpg?v=2"; }); }catch(e){}
  window.setRandomWorld();
})();
</script>
<script>
const BG = window.BuildableBoardGame, BR = window.BuildableRenders;
const COLS=3, ROWS=3, NEED=3;
const P = [{ name:"Blue", col:"#5B8CFF", glow:"rgba(91,140,255,.55)" },
           { name:"Pink", col:"#FF7DB0", glow:"rgba(255,125,176,.55)" }];

// ---- geometry (pure: works headless from W,H) ----
function geo(W,H){ const m=Math.min(W,H)*0.82; const x0=(W-m)/2, y0=(H-m)/2, cell=m/3; return {x0,y0,size:m,cell}; }
function cellCenter(W,H,idx){ const g=geo(W,H), c=idx%3, r=(idx/3|0); return { x:g.x0+(c+.5)*g.cell, y:g.y0+(r+.5)*g.cell }; }

// ---- mark art (NO emoji — drawn shapes) ----
function drawMark(ctx, player, cx, cy, s, a){
  ctx.save(); ctx.globalAlpha = a==null?1:a; const col=P[player-1].col;
  ctx.lineCap="round"; ctx.lineJoin="round";
  // soft glow
  const gg=ctx.createRadialGradient(cx,cy,2,cx,cy,s*1.1); gg.addColorStop(0,P[player-1].glow); gg.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle=gg; ctx.beginPath(); ctx.arc(cx,cy,s*1.1,0,7); ctx.fill();
  ctx.strokeStyle=col; ctx.lineWidth=Math.max(7,s*0.26);
  if(player===1){ const d=s*0.62; // rounded X
    ctx.beginPath(); ctx.moveTo(cx-d,cy-d); ctx.lineTo(cx+d,cy+d); ctx.moveTo(cx+d,cy-d); ctx.lineTo(cx-d,cy+d); ctx.stroke();
  } else { ctx.beginPath(); ctx.arc(cx,cy,s*0.66,0,7); ctx.stroke(); // ring
    ctx.globalAlpha=(a==null?1:a)*0.5; ctx.lineWidth=Math.max(3,s*0.1); ctx.beginPath(); ctx.arc(cx,cy,s*0.66,-0.6,0.9); ctx.strokeStyle="#fff"; ctx.stroke(); }
  ctx.restore();
}

const spec = {
  id:"tictactoe", title:"Tic-Tac-Toe", subtitle:"Get three in a row to win!",
  modes:["solo","two"], online:true, aiName:"Robo", players:P, aspect:1,
  sfx:{ place:"board_place", win:"board_win", draw:"board_draw" },
  sfxPlace:"place", sfxWin:"win", sfxDraw:"draw",

  init(){ try{ if(typeof window!=="undefined"&&window.setRandomWorld) window.setRandomWorld(); }catch(e){} return { cells:new Array(9).fill(0) }; },
  moves(G){ const m=[]; for(let i=0;i<9;i++) if(!G.cells[i]) m.push(i); return m; },

  move(G, idx, api){
    if(idx<0 || idx>8 || G.cells[idx]) return { moved:false };
    G.cells[idx]=api.turn;
    const c=cellCenter(api.W,api.H,idx);
    return { moved:true, sound:"place", fx:{ x:c.x, y:c.y, col:P[api.turn-1].col, n:12 } };
  },
  tap(G,x,y,api){ const g=geo(api.W,api.H); const c=Math.floor((x-g.x0)/g.cell), r=Math.floor((y-g.y0)/g.cell);
    if(c<0||r<0||c>2||r>2) return { moved:false }; return spec.move(G, r*3+c, api); },

  // EASY computer: takes an obvious win, sometimes blocks, otherwise playful/random.
  ai(G,api){ const me=2, you=1, empty=spec.moves(G);
    const winSpot=(p)=>{ for(const i of empty){ G.cells[i]=p; const w=BG.lineWinner(G.cells,3,3,3); G.cells[i]=0; if(w) return i; } return -1; };
    let pick = winSpot(me);
    if(pick<0 && api.rng()<0.55){ const b=winSpot(you); if(b>=0) pick=b; }   // only blocks ~55% (beatable)
    if(pick<0){ const corners=[0,2,6,8].filter(i=>!G.cells[i]);
      if(!G.cells[4] && api.rng()<0.5) pick=4;
      else if(corners.length && api.rng()<0.5) pick=BG.pick(corners,api.rng);
      else pick=BG.pick(empty,api.rng); }
    return spec.move(G, pick, api);
  },

  result(G){ const w=BG.lineWinner(G.cells,3,3,3);
    if(w) return { over:true, winner:w.player, line:{ cells:w.cells } };
    if(BG.boardFull(G.cells)) return { over:true, winner:0 };
    return { over:false };
  },
  hud(G,ctrl){ if(ctrl.mode==="solo") return ctrl.turn===1?"Your turn":"Robo is thinking...";
    return P[ctrl.turn-1].name+"'s turn"; },

  draw(ctx,G,R){ const {W,H,t}=R; const g=geo(W,H);
    // backdrop panel
    BR.rrect(ctx, g.x0-14, g.y0-14, g.size+28, g.size+28, 22);
    const pg=ctx.createLinearGradient(0,g.y0,0,g.y0+g.size); pg.addColorStop(0,"#16123f"); pg.addColorStop(1,"#221655");
    ctx.fillStyle=pg; ctx.fill();
    // grid lines
    ctx.strokeStyle="rgba(150,150,230,.40)"; ctx.lineWidth=Math.max(4,g.size*0.012); ctx.lineCap="round";
    for(let i=1;i<3;i++){ ctx.beginPath(); ctx.moveTo(g.x0+i*g.cell,g.y0+10); ctx.lineTo(g.x0+i*g.cell,g.y0+g.size-10); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(g.x0+10,g.y0+i*g.cell); ctx.lineTo(g.x0+g.size-10,g.y0+i*g.cell); ctx.stroke(); }
    // marks
    for(let i=0;i<9;i++) if(G.cells[i]){ const c=cellCenter(W,H,i); drawMark(ctx,G.cells[i],c.x,c.y,g.cell*0.34); }
    // win line highlight
    if(R.line && R.line.cells){ const a=cellCenter(W,H,R.line.cells[0]), b=cellCenter(W,H,R.line.cells[R.line.cells.length-1]);
      ctx.save(); ctx.strokeStyle="rgba(255,226,122,.9)"; ctx.lineWidth=g.size*0.03; ctx.lineCap="round";
      ctx.shadowColor="#ffe27a"; ctx.shadowBlur=18; ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); ctx.restore();
      for(const i of R.line.cells){ const c=cellCenter(W,H,i); BR.sparkle && (ctx.fillStyle="#ffe27a", BR.sparkle(ctx,c.x,c.y-g.cell*0.36,6, t*2)); }
    }
  },
};

const ctrl = BG.boot(spec);

// ---------- QA / picker hook ----------
function fullGame(opts){ opts=opts||{}; const mode=opts.mode||"two", cap=opts.cap||60;
  ctrl.rnd = BG.rng(opts.seed||1); ctrl.startGame(mode);
  const strat = opts.strat || ((G)=>BG.pick(spec.moves(G), ctrl.rnd));   // default random-legal
  const strat2 = opts.strat2 || strat;
  let n=0;
  while(ctrl._state()==="play" && n<cap){
    if(mode==="solo" && ctrl._turn()===2){ ctrl._ai(); }
    else { const who=ctrl._turn(); const mv=(who===1?strat:strat2)(ctrl.G, who); ctrl._play(mv); }
    n++;
  }
  const r=spec.result(ctrl.G);
  return { result: ctrl._state(), winner:r.winner, moves:n, filled:BG.boardFull(ctrl.G.cells) };
}
// perfect minimax player (used by QA to prove the easy AI is always beatable / never forces a loss)
function minimax(cells, player, me){
  const w=BG.lineWinner(cells,3,3,3);
  if(w) return { score: w.player===me?10:-10, move:-1 };
  const empty=[]; for(let i=0;i<9;i++) if(!cells[i]) empty.push(i);
  if(!empty.length) return { score:0, move:-1 };
  let best={ score: player===me?-999:999, move:empty[0] };
  for(const i of empty){ cells[i]=player; const s=minimax(cells, player===1?2:1, me).score; cells[i]=0;
    if(player===me ? s>best.score : s<best.score) best={ score:s, move:i }; }
  return best;
}
window.BUILDABLE_GAME = {
  _cfg:()=>({ title:spec.title, modes:spec.modes, cols:COLS, rows:ROWS }),
  sim: fullGame,
  // perfect player as P1 vs the easy AI as P2 — should NEVER lose (win or draw)
  simVsAI:(seed)=>fullGame({ mode:"solo", seed:seed||7, strat:(G)=>minimax(G.cells.slice(),1,1).move }),
  moves:()=>ctrl.moves(), _play:(t)=>ctrl._play(t), _ai:()=>ctrl._ai(),
  _turn:()=>ctrl._turn(), _state:()=>ctrl._state(), result:()=>spec.result(ctrl.G),
  _begin:(m)=>ctrl.startGame(m||"two"), _draw:()=>ctrl._draw(), _G:()=>ctrl.G,
};
window.TICTACTOE_GAME = window.BUILDABLE_GAME;
</script>
</body>
</html>
