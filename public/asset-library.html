<!doctype html>
<html lang="en">
<head>
    <link rel="icon" href="/favicon.ico?v=4" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=4" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=4" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=4" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=4" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#7C5CFC" />

<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<title>Asset Library — internal</title>
<style>
  :root{ --bg:#0e1120; --panel:#161a2e; --panel2:#1d2238; --line:#2b3151; --txt:#e7e9f5; --mut:#9aa0c4; --acc:#7c8cff; --accbg:#23284a; --teal:#3ddc97; --warn:#ffcf6b; --warnbg:#3a3320; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;font-size:14px;line-height:1.5}
  .wrap{max-width:1100px;margin:0 auto;padding:18px 20px 60px}
  h1{font-size:18px;font-weight:600;margin:0}
  .sub{color:var(--mut);font-size:12px}
  .bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:99px;overflow:hidden}
  .seg button{background:transparent;color:var(--mut);border:0;padding:6px 16px;font:inherit;cursor:pointer}
  .seg button+button{border-left:1px solid var(--line)}
  .seg button.on{background:var(--acc);color:#0b0e1c;font-weight:600}
  .chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  .lbl{font-size:12px;color:var(--mut);margin-right:2px}
  .chip{font-size:12px;padding:5px 12px;border-radius:99px;border:1px solid var(--line);color:var(--txt);background:transparent;cursor:pointer}
  .chip.on{background:var(--accbg);border-color:var(--acc);color:#c9d0ff}
  .chip.kind.on{background:var(--acc);color:#0b0e1c;font-weight:600;border-color:var(--acc)}
  .chip:disabled{opacity:.35;cursor:not-allowed}
  input[type=text]{background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--txt);padding:7px 10px;font:inherit;min-width:200px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:16px 0}
  .matrix{display:grid;gap:5px;align-items:center;margin-top:8px}
  .mh{font-size:11px;color:var(--mut);text-align:center}
  .cell{height:18px;border-radius:5px;width:74%;margin:0 auto;cursor:pointer}
  .cell.have{background:var(--teal)}
  .cell.gap{border:1px solid var(--line)}
  .cell.avail{border:1px solid var(--teal)}
  .seclbl{display:flex;justify-content:space-between;align-items:baseline;margin:20px 0 10px}
  .seclbl b{font-size:15px;font-weight:600}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
  .thumb{height:96px;background:var(--panel2) center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:var(--mut);position:relative}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .fxthumb{background-color:#444a6b;background-image:linear-gradient(45deg,#363b58 25%,transparent 25%),linear-gradient(-45deg,#363b58 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#363b58 75%),linear-gradient(-45deg,transparent 75%,#363b58 75%);background-size:14px 14px;background-position:0 0,0 7px,7px -7px,-7px 0}
  .ic{font-size:30px}
  .cbody{padding:8px 10px}
  .cname{font-size:13px;margin-bottom:4px;word-break:break-word}
  .badges{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
  .b{font-size:10px;padding:1px 7px;border-radius:99px;border:1px solid var(--line);color:var(--mut)}
  .b.src{background:var(--accbg);border-color:var(--acc);color:#c9d0ff}
  .b.warn{background:var(--warnbg);border-color:var(--warn);color:var(--warn)}
  .b.cc0{background:#16331f;border-color:#3ddc97;color:#7ef0bd}
  .copy{margin-left:auto;background:transparent;border:1px solid var(--line);color:var(--mut);border-radius:6px;font-size:10px;padding:1px 7px;cursor:pointer}
  .copy:active{transform:scale(.95)}
  .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:transparent;border:0;color:var(--txt);font-size:26px;cursor:pointer}
  .muted{color:var(--mut);font-size:12px}
  .note{font-size:11px;color:var(--mut);margin-top:2px}
</style>
<script src="/three.min.js?v=r128"></script>
<script src="/GLTFLoader.js?v=1"></script>
</head>
<body>
<div class="wrap">
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:4px">
    <h1>Asset Library</h1><span class="sub">internal · live from the shared library</span>
    <button id="refresh" class="chip" style="margin-left:auto">Refresh</button>
  </div>
  <div class="sub" id="counts" style="margin-bottom:14px">Loading…</div>

  <div class="bar">
    <div class="seg" id="dim">
      <button data-d="all" class="on">All</button><button data-d="2d">2D</button><button data-d="3d">3D</button>
    </div>
    <input type="text" id="search" placeholder="Search assets" />
  </div>
  <div class="chips" id="gametypes"><span class="lbl">Game type</span></div>
  <div class="chips" id="themes"><span class="lbl">Theme</span></div>
  <div class="chips" id="kinds"><span class="lbl">Kind</span></div>

  <div class="panel">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <b style="font-size:14px">Coverage</b>
      <span class="muted"><span style="display:inline-block;width:11px;height:11px;border-radius:3px;background:var(--teal);vertical-align:-1px"></span> have &nbsp; <span style="display:inline-block;width:11px;height:11px;border-radius:3px;border:1px solid var(--teal);vertical-align:-1px"></span> any theme &nbsp; <span style="display:inline-block;width:11px;height:11px;border-radius:3px;border:1px solid var(--line);vertical-align:-1px"></span> gap</span>
    </div>
    <div id="matrix" class="matrix"></div>
    <div class="note">Filled = at least one asset for that theme + kind (under the current 2D/3D filter). Click a cell to jump to it.</div>
  </div>

  <div id="sections"></div>
</div>

<div id="preview" style="display:none;position:fixed;inset:0;background:rgba(8,10,20,.88);z-index:50;align-items:center;justify-content:center;flex-direction:column;gap:12px">
  <div id="pname" style="font-size:15px"></div>
  <canvas id="pcanvas" width="380" height="380" style="background:#11152a;border:1px solid var(--line);border-radius:14px"></canvas>
  <button class="chip" onclick="closePreview()">Close</button>
</div>
<script>
const KINDS=[["character","Characters"],["world","Worlds"],["element","Elements"],["effect","Effects"],["music","Music"],["sfx","SFX"]];
const THEMES_ORDER=["space","jungle","ocean","candy","castle","desert","forest","snow"];
const GAME_TYPES=[["side-scroller","2d"],["top-down","2d"],["breakout","2d"],["survival","2d"],["3d-runner","3d"]];
const cb="?cb="+Date.now();

const MODELS_3D=["Bush_Common","Bush_Common_Flowers","CommonTree_1","CommonTree_3","CommonTree_5","Fern_1","Flower_3_Group","Flower_4_Group","Grass_Common_Tall","Mushroom_Common","Pine_1","Pine_3","Rock_Medium_1","Rock_Medium_2"]
  .map(n=>({id:"model:"+n,name:n.replace(/_/g," "),kind:"element",theme:"forest",dim:"3d",source:"quaternius",license:"CC0",url:"/models/nature/"+n+".gltf",icon:"◈"}));

const EFFECTS=[
  {id:"fx:explode",name:"Explosion",visual:"BM.explode()",sound:"boom",ready:false,icon:"✷"},
  {id:"fx:burst",name:"Particle burst",visual:"BM.burst()",sound:"pop",ready:false,icon:"✵"},
  {id:"fx:flash",name:"Screen flash",visual:"BM.flash()",sound:null,icon:"◐"},
  {id:"fx:shake",name:"Screen shake",visual:"BM.shake()",sound:null,icon:"≈"},
  {id:"fx:pop",name:"Pop text",visual:"BM.pop()",sound:null,icon:"↑"}
].map(e=>({...e,kind:"effect",theme:"",dim:"2d",source:"buildable-mechanics"}));

const PACKS=[
  {name:"Kenney City Kit",dim:"3d",license:"CC0",count:"40 models",status:"live in library",cc0:true},
  {name:"Kenney Particle Pack",dim:"2d",license:"CC0",count:"24 effects",status:"live in Effects",cc0:true},
  {name:"KayKit Platformer",dim:"3d",license:"CC0",count:"370 models",status:"downloaded · partly in /models",cc0:true,preview:"/packs/kaykit-platformer.png"},
  {name:"Quaternius Nature",dim:"3d",license:"CC0",count:"81 models",status:"live in /models/nature",cc0:true},
  {name:"Downtown City MegaKit",dim:"3d",license:"CC0",count:"100+ models",status:"downloaded · zip (Quaternius)",cc0:true,preview:"/packs/downtown-city.png"},
  {name:"Tiny Swords",dim:"2d",license:"no-republish",count:"410 sprites",status:"downloaded · needs curate",cc0:false,preview:"/packs/tiny-swords.png"},
  {name:"Mossy Cavern",dim:"2d",license:"no-republish",count:"tileset + character",status:"downloaded · needs curate",cc0:false}
];

let ALL=[],KENNEY=[]; const state={dim:"all",game:null,theme:null,kinds:new Set(KINDS.map(k=>k[0])),q:""};
let _ren,_scene,_cam,_cur,_raf,_ldr;
function ensure3d(){ if(_ren)return true; if(typeof THREE==="undefined"||!THREE.GLTFLoader)return false;
  const cv=document.getElementById("pcanvas");
  _ren=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true}); _ren.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
  _scene=new THREE.Scene(); _cam=new THREE.PerspectiveCamera(40,1,0.1,100); _cam.position.set(0,1.6,7);
  _scene.add(new THREE.AmbientLight(0xffffff,0.9)); const dl=new THREE.DirectionalLight(0xffffff,0.8); dl.position.set(5,10,7); _scene.add(dl);
  _ldr=new THREE.GLTFLoader(); return true; }
function openPreview(url,name){
  const ov=document.getElementById("preview"); ov.style.display="flex"; document.getElementById("pname").textContent=name;
  if(!ensure3d()){ document.getElementById("pname").textContent=name+" — 3D viewer unavailable"; return; }
  if(_cur){_scene.remove(_cur);_cur=null;}
  _ldr.load(url,(g)=>{ const o=g.scene;
    o.traverse(m=>{ if(m.isMesh){ const mm=m.material; o.castShadow=false;
      m.material=new THREE.MeshLambertMaterial({map:(mm&&mm.map)||null,color:(mm&&mm.color)?mm.color:0xffffff,transparent:!!(mm&&mm.transparent),alphaTest:(mm&&mm.alphaTest)||0,side:THREE.DoubleSide}); }});
    const box=new THREE.Box3().setFromObject(o),size=new THREE.Vector3(),ctr=new THREE.Vector3(); box.getSize(size); box.getCenter(ctr);
    o.position.sub(ctr); const md=Math.max(size.x,size.y,size.z)||1; o.scale.setScalar(4/md); _cur=o; _scene.add(o);
  }, undefined, ()=>{ document.getElementById("pname").textContent=name+" — failed to load"; });
  if(!_raf){ const loop=()=>{ _raf=requestAnimationFrame(loop); if(_cur)_cur.rotation.y+=0.012; _ren.render(_scene,_cam); }; loop(); }
}
function closePreview(){ document.getElementById("preview").style.display="none"; if(_raf){cancelAnimationFrame(_raf);_raf=null;} }
let _tren,_tscene,_tcam,_tldr,_tcv,_tq=[],_tbusy=false;
function ensureThumbR(){ if(_tren)return true; if(typeof THREE==="undefined"||!THREE.GLTFLoader)return false;
  _tcv=document.createElement("canvas"); _tcv.width=220; _tcv.height=220;
  _tren=new THREE.WebGLRenderer({canvas:_tcv,antialias:true,alpha:true,preserveDrawingBuffer:true}); _tren.setSize(220,220);
  _tscene=new THREE.Scene(); _tcam=new THREE.PerspectiveCamera(34,1,0.1,100);
  _tscene.add(new THREE.AmbientLight(0xffffff,0.95)); const dl=new THREE.DirectionalLight(0xffffff,0.7); dl.position.set(3,6,4); _tscene.add(dl);
  _tldr=new THREE.GLTFLoader(); return true; }
function queueThumb(url,img){ _tq.push([url,img]); pumpThumb(); }
function pumpThumb(){ if(_tbusy||!_tq.length)return; if(!ensureThumbR())return; _tbusy=true; const [url,img]=_tq.shift();
  _tldr.load(url,(g)=>{ const o=g.scene;
    o.traverse(m=>{ if(m.isMesh){ const mm=m.material; m.material=new THREE.MeshLambertMaterial({map:(mm&&mm.map)||null,color:(mm&&mm.color)?mm.color:0xffffff,transparent:!!(mm&&mm.transparent),alphaTest:(mm&&mm.alphaTest)||0,side:THREE.DoubleSide}); }});
    const box=new THREE.Box3().setFromObject(o),sz=new THREE.Vector3(),c=new THREE.Vector3(); box.getSize(sz); box.getCenter(c); o.position.sub(c);
    const md=Math.max(sz.x,sz.y,sz.z)||1; o.scale.setScalar(2.5/md);
    _tscene.add(o); _tcam.position.set(2.6,2.1,3.4); _tcam.lookAt(0,0,0); _tren.render(_tscene,_tcam);
    try{ img.src=_tcv.toDataURL("image/png"); img.style.display="block"; }catch(e){}
    _tscene.remove(o); _tbusy=false; setTimeout(pumpThumb,30);
  }, undefined, ()=>{ _tbusy=false; setTimeout(pumpThumb,30); }); }

async function getJSON(u){try{const r=await fetch(u);if(!r.ok)return null;return await r.json();}catch(e){return null;}}

async function load(){
  document.getElementById("counts").textContent="Loading…";
  const [assets,chars,audio,mf,fxm,kny]=await Promise.all([
    getJSON("/api/list-assets"+cb),
    getJSON("/api/list-characters"+cb.replace("?","?limit=60&")),
    getJSON("/api/list-audio"+cb),
    getJSON("/models/manifest.json"+cb),
    getJSON("/fx/manifest.json"+cb),
    getJSON("/kenney/manifest.json"+cb)
  ]);
  KENNEY=(kny&&kny.packs)||[];

  const models3d=(mf&&mf.models||[]).map(m=>({id:"model:"+m.pack+":"+m.file,name:m.name,kind:"element",theme:m.theme||"",dim:"3d",source:m.source||m.pack,license:m.license||"",url:m.url,thumb:m.thumb||"",icon:"◈"}));
  const fxAssets=(fxm&&fxm.fx||[]).map(f=>({id:"fx:"+f.file,name:f.name,kind:"effect",theme:"",dim:"2d",source:f.source||"kenney",license:f.license||"CC0",url:f.url,thumb:f.url}));
  const out=[];
  (assets&&assets.layers||[]).forEach(l=>out.push({id:l.id,name:(l.theme||"world")+" world",kind:"world",theme:l.theme||"",dim:"2d",source:l.source||"community",url:l.imageUrl,thumb:l.imageUrl}));
  (assets&&assets.sprites||[]).forEach(s=>out.push({id:s.id,name:s.subject||"element",kind:"element",theme:s.theme||"",dim:"2d",source:s.source||"community",url:s.imageUrl,thumb:s.imageUrl}));
  (chars&&chars.characters||[]).forEach(c=>out.push({id:c.id,name:c.name,kind:"character",theme:c.theme||"",dim:"2d",source:c.source||"community",url:c.image,thumb:(c.image&&c.image.indexOf("data:")!==0)?c.image:null}));
  (audio&&audio.music||[]).forEach(m=>out.push({id:m.id,name:m.name,kind:"music",theme:m.theme||"",dim:"any",source:m.source,url:m.url,audio:true}));
  (audio&&audio.sfx||[]).forEach(s=>out.push({id:s.id,name:s.name,kind:"sfx",theme:s.theme||"",dim:"any",source:s.source,url:s.url,audio:true}));
  ALL=out.concat(models3d.length?models3d:MODELS_3D,fxAssets,EFFECTS);
  const n2d=ALL.filter(a=>a.dim==="2d").length,n3d=ALL.filter(a=>a.dim==="3d").length;
  document.getElementById("counts").textContent=ALL.length+" assets · "+n2d+" 2D · "+n3d+" 3D · "+(audio?(audio.music.length+audio.sfx.length):0)+" audio · "+KENNEY.length+" Kenney packs";
  buildFilters(); render();
}

function passDim(a){return state.dim==="all"||a.dim===state.dim||a.dim==="any";}
function visible(a){
  if(!passDim(a))return false;
  if(!state.kinds.has(a.kind))return false;
  if(state.theme&&(a.theme||"").toLowerCase()!==state.theme)return false; // strict: pick a theme = only that theme
  if(state.q&&(a.name+" "+a.source+" "+a.theme).toLowerCase().indexOf(state.q)<0)return false;
  return true;
}

function buildFilters(){
  const gt=document.getElementById("gametypes");
  GAME_TYPES.forEach(([g,d])=>{const b=document.createElement("button");b.className="chip";b.textContent=g;b.disabled=(state.dim!=="all"&&state.dim!==d);
    b.onclick=()=>{state.game=state.game===g?null:g; if(state.game){setDim(d);} render();}; gt.appendChild(b);});
  const th=document.getElementById("themes");
  const themes=[...new Set(ALL.map(a=>a.theme).filter(Boolean))].sort((a,b)=>THEMES_ORDER.indexOf(a)-THEMES_ORDER.indexOf(b));
  themes.forEach(t=>{const b=document.createElement("button");b.className="chip";b.dataset.t=t;b.textContent=t;b.onclick=()=>{state.theme=state.theme===t?null:t;syncThemeChips();render();};th.appendChild(b);});
  const kc=document.getElementById("kinds");
  KINDS.forEach(([k,lab])=>{const b=document.createElement("button");b.className="chip kind on";b.dataset.k=k;b.textContent=lab;b.onclick=()=>{state.kinds.has(k)?state.kinds.delete(k):state.kinds.add(k);render();};kc.appendChild(b);});
}
function syncThemeChips(){document.querySelectorAll('#themes .chip').forEach(x=>x.classList.toggle('on',x.dataset.t===state.theme));}
function setDim(d){state.dim=d;document.querySelectorAll("#dim button").forEach(x=>x.classList.toggle("on",x.dataset.d===d));}

function renderMatrix(){
  const m=document.getElementById("matrix");
  const kinds=KINDS.filter(k=>state.kinds.has(k[0]));
  const themes=[...new Set(ALL.filter(a=>a.theme).map(a=>a.theme))].sort((a,b)=>THEMES_ORDER.indexOf(a)-THEMES_ORDER.indexOf(b));
  m.style.gridTemplateColumns="68px repeat("+kinds.length+",1fr)";
  let h='<span></span>'+kinds.map(k=>'<span class="mh">'+k[1].replace("Characters","Hero").replace("Elements","Elem")+'</span>').join("");
  themes.forEach(t=>{h+='<span class="muted" style="font-size:12px">'+t+'</span>';
    kinds.forEach(k=>{
      const themed=ALL.some(a=>a.theme===t&&a.kind===k[0]&&passDim(a));
      const cross=!themed&&ALL.some(a=>a.kind===k[0]&&!a.theme&&passDim(a));
      const cls=themed?"have":(cross?"avail":"gap");
      h+='<span class="cell '+cls+'" data-t="'+t+'" data-k="'+k[0]+'"></span>';});});
  m.innerHTML=h;
  m.querySelectorAll(".cell").forEach(c=>c.onclick=()=>{state.theme=c.dataset.t;syncThemeChips();render();});
}

function tile(a){
  let inner;
  if(a.kind==="effect"){
    if(a.thumb){
      inner='<div class="thumb fxthumb"><img src="'+a.thumb+'" loading="lazy" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain"></div><div class="cbody"><div class="cname">'+a.name+'</div><div class="badges"><span class="b">effect</span><span class="b cc0">'+a.source+'</span><button class="copy" data-c="'+a.url+'">copy</button></div></div>';
    } else {
      inner='<div class="thumb"><span class="ic">'+a.icon+'</span></div><div class="cbody"><div class="cname">'+a.name+'</div><div class="badges"><span class="b src">'+a.visual+'</span>'+(a.sound?(a.ready?'<span class="b">sound: '+a.sound+'</span>':'<span class="b warn">sound: create</span>'):'<span class="b">visual only</span>')+'</div></div>';
    }
  }else if(a.audio){
    inner='<div class="thumb"><button class="play" data-u="'+a.url+'">▶</button></div><div class="cbody"><div class="cname">'+a.name+'</div><div class="badges"><span class="b">'+a.kind+'</span><span class="b src">'+a.source+'</span><button class="copy" data-c="'+a.url+'">copy</button></div></div>';
  }else if(a.dim==="3d"){
    const ph=a.thumb
      ? '<img src="'+a.thumb+'" loading="lazy" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain">'
      : '<img class="modelthumb" data-u="'+a.url+'" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:none"><span class="ic">'+(a.icon||"◈")+'</span><span style="position:absolute;bottom:5px;font-size:10px;color:var(--mut)">click to view</span>';
    inner='<div class="thumb view3d" data-u="'+a.url+'" data-n="'+a.name+'" style="cursor:pointer">'+ph+'</div><div class="cbody"><div class="cname">'+a.name+'</div><div class="badges"><span class="b">3D</span><span class="b '+(a.license==="CC0"?"cc0":(a.license==="verify"?"warn":""))+'">'+(a.source||"")+(a.license==="verify"?" · verify license":"")+'</span>'+(a.theme?'<span class="b">'+a.theme+'</span>':'')+'<button class="copy" data-c="'+a.url+'">copy</button></div></div>';
  }else{
    const t=a.thumb?'<img src="'+a.thumb+'" loading="lazy" alt="" onerror="this.style.display=\'none\';this.parentNode.innerHTML=\'<span class=ic>▦</span>\'">':'<span class="ic">▦</span>';
    inner='<div class="thumb">'+t+'</div><div class="cbody"><div class="cname">'+a.name+'</div><div class="badges"><span class="b '+(a.source==="story"||a.source==="community"?"src":"")+'">'+(a.source||"")+'</span>'+(a.theme?'<span class="b">'+a.theme+'</span>':'')+'<button class="copy" data-c="'+a.id+'">copy</button></div></div>';
  }
  return '<div class="card">'+inner+'</div>';
}

function render(){
  document.querySelectorAll("#gametypes .chip").forEach(b=>{b.classList.toggle("on",b.textContent===state.game);b.disabled=(state.dim!=="all"&&GAME_TYPES.find(g=>g[0]===b.textContent)[1]!==state.dim);});
  renderMatrix();
  const sec=document.getElementById("sections");
  const shown=ALL.filter(visible);
  let html="";
  KINDS.forEach(([k,lab])=>{
    const items=shown.filter(a=>a.kind===k);
    if(!state.kinds.has(k))return;
    html+='<div class="seclbl"><b>'+lab+'</b><span class="muted">'+items.length+'</span></div>';
    html+= items.length? '<div class="grid">'+items.map(tile).join("")+'</div>' : '<div class="muted">none'+(state.theme?" for "+state.theme:"")+'</div>';
  });
  html+='<div class="seclbl"><b>Downloaded packs</b><span class="muted">source shelf · not all curated in yet</span></div>';
  html+='<div class="grid">'+PACKS.filter(p=>state.dim==="all"||p.dim===state.dim).map(p=>{
    const th=p.preview
      ? '<div class="thumb '+(p.dim==="2d"?"fxthumb":"")+'"><img src="'+p.preview+'" loading="lazy" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain"></div>'
      : '<div class="thumb"><span class="ic">'+(p.dim==="3d"?"◈":"▦")+'</span></div>';
    return '<div class="card">'+th+'<div class="cbody"><div class="cname">'+p.name+'</div><div class="badges"><span class="b">'+p.dim.toUpperCase()+'</span><span class="b '+(p.cc0?"cc0":"warn")+'">'+p.license+'</span></div><div class="note">'+p.count+' · '+p.status+'</div></div></div>';
  }).join("")+'</div>';
  const kpacks=KENNEY.filter(pk=>(state.dim==="all"||pk.dim===state.dim)&&(!state.q||(pk.name+" "+pk.category).toLowerCase().indexOf(state.q)>=0));
  html+='<div class="seclbl"><b>Kenney catalog</b><span class="muted">'+kpacks.length+' of '+KENNEY.length+' packs · CC0 source shelf · ask to pull a kit in</span></div>';
  html+='<div class="grid">'+kpacks.map(pk=>'<div class="card"><div class="thumb '+(pk.dim==="2d"?"fxthumb":"")+'">'+(pk.preview?'<img src="'+pk.preview+'" loading="lazy" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain">':'<span class="ic">▦</span>')+'</div><div class="cbody"><div class="cname">'+pk.name+'</div><div class="badges"><span class="b">'+pk.dim.toUpperCase()+'</span><span class="b cc0">CC0</span><span class="b">'+pk.count+' files</span></div></div></div>').join("")+'</div>';
  sec.innerHTML=html;
  sec.querySelectorAll(".copy").forEach(b=>b.onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(b.dataset.c);b.textContent="copied";setTimeout(()=>b.textContent="copy",900);});
  let cur=null;
  sec.querySelectorAll(".play").forEach(b=>b.onclick=()=>{if(cur)cur.pause();cur=new Audio(b.dataset.u);cur.play().catch(()=>{});b.textContent="❙❙";setTimeout(()=>b.textContent="▶",1500);});
  sec.querySelectorAll(".view3d").forEach(b=>{const card=b.closest(".card")||b;card.style.cursor="pointer";card.onclick=()=>openPreview(b.dataset.u,b.dataset.n);});
  sec.querySelectorAll(".modelthumb").forEach(img=>queueThumb(img.dataset.u,img));
}

document.querySelectorAll("#dim button").forEach(b=>b.onclick=()=>{setDim(b.dataset.d);if(state.game&&GAME_TYPES.find(g=>g[0]===state.game)[1]!==b.dataset.d)state.game=null;render();});
document.getElementById("search").oninput=e=>{state.q=e.target.value.toLowerCase().trim();render();};
document.getElementById("refresh").onclick=load;
load();
</script>
</body>
</html>
