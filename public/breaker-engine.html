<html>
<head>
    <link rel="icon" href="/favicon.ico?v=4" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=4" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=4" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=4" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=4" />
    <link rel="manifest" href="/site.webmanifest" />

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Buildable Breaker — engine</title>
<style>
  html,body{margin:0;height:100%;background:#0a1030;overflow:hidden;touch-action:none;font-family:'Fredoka',-apple-system,sans-serif}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{background:#000;max-width:100%;max-height:100%;image-rendering:auto;border-radius:14px}
  /* #start hosts the SHARED start screen (BS). #customize is the bespoke Make It Mine overlay. */
  #start{position:fixed;inset:0;z-index:10;display:none}
  .ov{position:fixed;inset:0;z-index:10;display:none;flex-direction:column;align-items:center;
      background:linear-gradient(180deg,#0b1230,#241152);color:#fff;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .ov.show{display:flex}
  .ov h1{font-size:40px;margin:30px 0 4px;letter-spacing:.5px}
  .ov .sub{opacity:.78;margin:0 0 18px;text-align:center;padding:0 20px;max-width:560px}
  .btn{font-family:inherit;font-weight:700;font-size:22px;color:#1a0f3a;background:#9b7bff;border:none;
       border-radius:16px;padding:16px 40px;margin:8px;cursor:pointer;min-width:220px;box-shadow:0 6px 0 #6a4ad6}
  .btn:active{transform:translateY(3px);box-shadow:0 3px 0 #6a4ad6}
  .btn.small{font-size:17px;min-width:0;padding:10px 18px;margin:4px}
  .tabs{display:flex;gap:8px;margin:6px 0 14px;flex-wrap:wrap;justify-content:center}
  .tab{font-family:inherit;font-weight:700;font-size:16px;color:#cdd0ff;background:#241a52;border:2px solid #3a2c6e;
       border-radius:12px;padding:9px 18px;cursor:pointer}
  .tab.on{background:#9b7bff;color:#1a0f3a;border-color:#9b7bff}
  .grid{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;max-width:760px;padding:0 14px 24px}
  .opt{width:150px;background:#1a1444;border:3px solid #2c2466;border-radius:16px;padding:12px;text-align:center;cursor:pointer}
  .opt.on{border-color:#7ee0a0;box-shadow:0 0 0 2px rgba(126,224,160,.35)}
  .opt .sw{height:54px;border-radius:12px;margin-bottom:8px;display:flex;align-items:center;justify-content:center}
  .opt .nm{font-weight:700;font-size:17px}
  .opt .ds{opacity:.7;font-size:12px;min-height:16px;margin-top:2px}
  .toggle{width:150px;background:#1a1444;border:3px solid #2c2466;border-radius:16px;padding:12px;text-align:center;cursor:pointer}
  .toggle.on{border-color:#7ee0a0;box-shadow:0 0 0 2px rgba(126,224,160,.35)}
  .toggle .pill{display:inline-block;margin-top:6px;font-weight:800;font-size:13px;padding:3px 12px;border-radius:20px;background:#3a2c6e;color:#cdd0ff}
  .toggle.on .pill{background:#7ee0a0;color:#0c2417}
  #muteBtn{position:fixed;right:12px;top:56px;z-index:30;display:none;font-family:inherit;font-weight:700;font-size:14px;
           color:#cdd0ff;background:rgba(26,20,64,.7);border:1px solid #3a2c6e;border-radius:10px;padding:7px 12px;cursor:pointer}
  #helpBtn{position:fixed;right:12px;top:100px;z-index:30;display:none;font-family:inherit;font-weight:800;font-size:18px;
           color:#1a0f3a;background:#ffd86b;border:none;border-radius:50%;width:38px;height:38px;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.3)}
  #backBtn{position:fixed;right:12px;top:12px;z-index:30;display:none;font-family:inherit;font-weight:800;font-size:14px;
           color:#fff;background:rgba(26,20,64,.78);border:1px solid #3a2c6e;border-radius:12px;padding:8px 14px;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.3)}
  .toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:20;background:#ffd86b;color:#1a0f3a;
         font-weight:700;padding:12px 22px;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.35);display:none}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="900" height="600"></canvas></div>

<!-- shared start screen mounts here -->
<div id="start"></div>

<div id="customize" class="ov">
  <h1>Make It Mine</h1>
  <div class="sub" id="custSub">Pick how your game looks and plays.</div>
  <div class="tabs" id="custTabs"></div>
  <div class="grid" id="custGrid"></div>
  <button class="btn small" id="custBack">Back</button>
</div>

<div id="toast" class="toast"></div>
<button id="backBtn" title="Back to menu">‹ Menu</button>
<button id="muteBtn">Sound: On</button>
<button id="helpBtn" title="How to play">?</button>

<script src="buildable-renders.js"></script>
<script src="buildable-audio.js"></script>
<script src="buildable-mechanics.js"></script>
<script src="buildable-startscreen.js"></script>
<script src="buildable-hud.js?v=1"></script>
<script>
// ============================================================================
//  FIXED ENGINE — never regenerated. A game = this engine + GAME_CONFIG (data).
//  Paddle-and-ball brick breaker (Solo) + a 2-player Pong mode (pass-and-play).
//  Built to the Buildable game playbook (BUILDING-A-GAME.md):
//    - data-driven levels (recipes), always-clearable, headless QA-simmed
//    - shared engine libs: BR (draw) · BA (audio) · BM (FX/juice) · BS (start screen)
//    - QA hook exposed as window.BUILDABLE_GAME (BREAKER_GAME kept as an alias)
//  Breaker is the REFERENCE ADOPTION for BM (FX) and BS (start screen).
// ============================================================================
const W=900, H=600;
const c=document.getElementById('c'), ctx=c.getContext('2d');
let hud=null; function HUD(){ return hud||(hud=BuildableHUD.mount(c)); }
const BR=(typeof window!=="undefined"&&window.BuildableRenders)||(typeof globalThis!=="undefined"&&globalThis.BuildableRenders);
const BA=(typeof window!=="undefined"&&window.BuildableAudio)||(typeof globalThis!=="undefined"&&globalThis.BuildableAudio);
const BM=(typeof window!=="undefined"&&window.BuildableMechanics)||(typeof globalThis!=="undefined"&&globalThis.BuildableMechanics);
const BS=(typeof window!=="undefined"&&window.BuildableStartScreen)||(typeof globalThis!=="undefined"&&globalThis.BuildableStartScreen);
function sfx(n,o){ if(BA)BA.sfx(n,o); }
function mkImg(src){ const im=(typeof Image!=="undefined")?new Image():{}; try{ im.crossOrigin="anonymous"; }catch(e){} if(src&&"src" in im) im.src=src; return im; }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

// shared FX bag (BM). Fallback object keeps the engine working if BM is missing.
let fx = BM ? BM.makeFx() : { parts:[], pops:[], shake:0, flash:0, flashCol:"#fff" };
function resetFx(){ fx = BM ? BM.makeFx() : { parts:[], pops:[], shake:0, flash:0, flashCol:"#fff" }; }

// ---- data: the game recipe (safe to tweak freely; no code changes needed) ----
const GAME_CONFIG = window.GAME_CONFIG || {
  name: "Buildable Breaker",
  // each level = a layout recipe (pattern + how tough + ball speed). Always clearable.
  levels: [
    { name:"First Bounce",  cols:8,  rows:3, pattern:"full",    tough:0.0,  speed:4.2 },
    { name:"Step Pyramid",  cols:9,  rows:5, pattern:"pyramid", tough:0.1,  speed:4.6 },
    { name:"Checker Castle",cols:10, rows:5, pattern:"checker", tough:0.2,  speed:5.0 },
    { name:"Secret Gaps",   cols:10, rows:6, pattern:"gaps",    tough:0.3,  speed:5.3 },
    { name:"Tall Towers",   cols:10, rows:6, pattern:"columns", tough:0.3,  speed:5.5 },
    { name:"Castle Walls",  cols:11, rows:7, pattern:"frame",   tough:0.35, speed:5.6 },
    { name:"Diamond Drop",  cols:11, rows:7, pattern:"diamond", tough:0.4,  speed:5.8 },
    { name:"Brick Boss",    cols:12, rows:8, pattern:"full",    tough:0.55, speed:6.0 },
  ],
  brickColors: ["#ff7aa8","#ffb04d","#ffd86b","#7ee0a0","#62d0ff","#9b7bff","#ff8fce"],
};
function brickColorFor(i){ const c=GAME_CONFIG.brickColors; return c[i%c.length]; }

// ---- look options kids can pick (the "Make It Mine" screen) ----
const BACKDROPS = [
  { id:"meadow", name:"Meadow",  c1:"#bff0d8", c2:"#7fd1a6" },
  { id:"space",  name:"Space",   img:"chess-art/space_bg.jpg",  c1:"#1a1546", c2:"#0a1030" },
  { id:"candy",  name:"Candy",   img:"chess-art/candy_bg.jpg",  c1:"#ffd6ec", c2:"#ff9ec4" },
  { id:"ocean",  name:"Ocean",   img:"chess-art/ocean_bg.jpg",  c1:"#a8e6ff", c2:"#3aa0d6" },
  { id:"castle", name:"Castle",  img:"chess-art/castle_bg.jpg", c1:"#e6d6ff", c2:"#9b7bff" },
  { id:"desert", name:"Desert",  img:"chess-art/desert_bg.jpg", c1:"#ffe6b0", c2:"#e6b35a" },
];
// cost = total stars needed to unlock (0 = free from the start)
const BALLS = [
  { id:"glow",    name:"Glow Ball", col:"#ffffff", glow:"#9b7bff", cost:0 },
  { id:"star",    name:"Star",      col:"#ffd86b", glow:"#ffb04d", star:true, cost:0 },
  { id:"comet",   name:"Comet",     col:"#62d0ff", glow:"#62d0ff", cost:3 },
  { id:"berry",   name:"Berry",     col:"#ff7aa8", glow:"#ff7aa8", cost:8 },
  { id:"rainbow", name:"Rainbow",   col:"#ff7aa8", glow:"#ffffff", rainbow:true, cost:16 },
  { id:"flame",   name:"Flame",     col:"#ff8a3d", glow:"#ff5a2c", flame:true,   cost:24 },
];
const PADDLES = [
  { col:"#9b7bff", cost:0 }, { col:"#62d0ff", cost:0 }, { col:"#7ee0a0", cost:0 },
  { col:"#ff7aa8", cost:4 }, { col:"#ffd86b", cost:10 }, { col:"#ff8fce", cost:16 },
];
const DIFFS = {
  easy:   { name:"Easy",   lives:5, padW:150, speedMul:0.85 },
  normal: { name:"Normal", lives:3, padW:120, speedMul:1.0  },
  hard:   { name:"Hard",   lives:2, padW:92,  speedMul:1.18 },
};
// power-ups: a brick may drop a falling capsule; catch it with the paddle to use it.
const POWERS = {
  grow:    { name:"Big Paddle", col:"#7ee0a0", desc:"Wider paddle",        apply:g=>{ g.padW=Math.min(220,g.padW+34); g.padGrowT=600; } },
  multi:   { name:"Multi Ball", col:"#62d0ff", desc:"Split into 3 balls",  apply:g=>{ splitBalls(); } },
  slow:    { name:"Slow-Mo",    col:"#9b7bff", desc:"Slows the ball",       apply:g=>{ g.slowT=420; } },
  sticky:  { name:"Catch",      col:"#ffd86b", desc:"Ball sticks, tap to fling", apply:g=>{ g.sticky=true; g.stickyT=900; } },
  life:    { name:"Extra Life", col:"#ff7aa8", desc:"+1 life",              apply:g=>{ g.lives++; } },
  laser:   { name:"Laser",      col:"#ff5da2", desc:"Paddle zaps bricks",   apply:g=>{ g.laserT=540; g.laserCd=0; } },
  fireball:{ name:"Fireball",   col:"#ff8a3d", desc:"Ball smashes through", apply:g=>{ g.fireT=480; } },
};
const POWER_IDS = Object.keys(POWERS);

// ---- saved profile: progress + stars + the kid's look/play choices ----
function defaultPrefs(){ return {
  unlocked:0, bestLevel:0, totalWins:0, stars:{},
  backdrop:"meadow", ball:"glow", paddle:"#9b7bff", difficulty:"normal",
  powers:{ grow:true, multi:true, slow:true, sticky:true, life:true, laser:true, fireball:true },
}; }
function mergePrefs(d){ const p=defaultPrefs(); if(!d||typeof d!=="object")return p;
  p.unlocked=Math.max(0,d.unlocked||0); p.bestLevel=d.bestLevel||0; p.totalWins=d.totalWins||0;
  if(d.stars&&typeof d.stars==="object")p.stars=Object.assign({},d.stars);
  if(d.backdrop)p.backdrop=d.backdrop; if(d.ball)p.ball=d.ball; if(d.paddle)p.paddle=d.paddle;
  if(d.difficulty&&DIFFS[d.difficulty])p.difficulty=d.difficulty;
  if(d.powers&&typeof d.powers==="object")for(const k of POWER_IDS) if(k in d.powers)p.powers[k]=!!d.powers[k];
  return p; }
let PREFS=defaultPrefs();
function activeKidId(){ try{ const k=JSON.parse(localStorage.getItem("bk_active_kid_v1")||"null"); return k&&k.id?k.id:null; }catch{ return null; } }
function prefsKey(){ const k=activeKidId(); return "bk_breaker_prefs"+(k?("_"+k):""); }
function loadPrefs(){ try{ const s=localStorage.getItem(prefsKey()); if(s)PREFS=mergePrefs(JSON.parse(s)); }catch{} }
function savePrefs(){ try{ localStorage.setItem(prefsKey(), JSON.stringify(PREFS)); }catch{} }

// ---- art (backdrop image, drawn fallback) ----
const bgCache={};
function backdropDef(){ return BACKDROPS.find(b=>b.id===PREFS.backdrop)||BACKDROPS[0]; }
function bgImage(){ const d=backdropDef(); if(!d.img)return null; if(!bgCache[d.id])bgCache[d.id]=mkImg(d.img); return bgCache[d.id]; }

// looping background music: warm, created (ElevenLabs) "kid spa with a heartbeat"
// track from the shared library — soft/rounded, no chiptune, no shrill tones.
// Reusable by any game via /api/library-music?name=<name>.
let _curMusic="";
    function ensureMusic(){ if(!BA||!BA.setMusic)return; const url="/api/library-music?name=spa_heartbeat_warm";
  if(url!==_curMusic){ if(BA.stopMusic)BA.stopMusic(); BA.setMusic(url); _curMusic=url; }
  if(BA.playMusic)BA.playMusic(); }

function mulberry(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

// ---- live game state ----
const PAD_Y = H-42, TOP_Y = 42, PAD_H = 18, BALL_R = 9;
let G=null, level=0, L=null, state="title", started=false, botMode=false, helpOpen=false;
let currentMode="solo";   // "solo" (brick breaker) or "two" (pong)
let stars=[]; (function(){ const r=mulberry(7); for(let i=0;i<70;i++) stars.push({x:r()*W,y:r()*H,s:0.6+r()*1.6,ph:r()*6.28,sp:0.5+r()*1.4}); })();

// ---------- SOLO: brick layout ----------
function buildBricks(L, rng){
  const cols=L.cols, rows=L.rows, top=70, marginX=40, gap=6;
  const bw=(W-marginX*2-gap*(cols-1))/cols, bh=24, cset=GAME_CONFIG.brickColors, bricks=[];
  for(let r=0;r<rows;r++){ for(let cidx=0;cidx<cols;cidx++){ if(!inPattern(L.pattern,r,cidx,rows,cols)) continue;
    const tough=rng()<L.tough, hp=tough?2:1;
    bricks.push({ x:marginX+cidx*(bw+gap), y:top+r*(bh+gap), w:bw, h:bh, hp, maxHp:hp, col:cset[r%cset.length], alive:true, power:null }); } }
  const onPowers=POWER_IDS.filter(k=>PREFS.powers[k]);
  if(onPowers.length){ const n=Math.min(bricks.length, 2+Math.floor(bricks.length*0.12));
    for(let i=0;i<n;i++){ const b=bricks[Math.floor(rng()*bricks.length)]; if(b) b.power=onPowers[Math.floor(rng()*onPowers.length)]; } }
  return bricks;
}
function inPattern(p,r,cidx,rows,cols){ const mid=(cols-1)/2;
  switch(p){
    case "pyramid": return Math.abs(cidx-mid) <= (mid*(r+1)/rows)+0.001;
    case "checker": return (r+cidx)%2===0;
    case "gaps":    return !(cidx%3===2 && r%2===1);
    case "columns": return (cidx%3)!==1;                                  // tall towers with gaps
    case "frame":   return r===0||r===rows-1||cidx===0||cidx===cols-1;     // castle walls
    case "diamond": return Math.abs(cidx-mid)+Math.abs(r-(rows-1)/2) <= Math.max(mid,(rows-1)/2)+0.5;
    default:        return true;
  }
}
function newBall(x,y,ang,speed){ return { x,y, vx:Math.cos(ang)*speed, vy:Math.sin(ang)*speed }; }

function startLevel(i, carryLives){
  currentMode="solo"; resetFx();
  level=clamp(i,0,GAME_CONFIG.levels.length-1); L=GAME_CONFIG.levels[level];
  const diff=DIFFS[PREFS.difficulty]||DIFFS.normal, rng=mulberry(4242+level*131), speed=L.speed*diff.speedMul;
  G={ mode:"solo", padW:diff.padW, padX:W/2, padGrowT:0,
    lives:(carryLives!=null?carryLives:diff.lives), startLives:diff.lives, lostLives:0,
    speed, baseSpeed:speed, bricks:buildBricks(L,rng), balls:[], caps:[], lasers:[],
    onPaddle:true, sticky:false, stickyT:0, slowT:0, laserT:0, laserCd:0, fireT:0, score:0 };
  G.balls=[ newBall(G.padX, PAD_Y-BALL_R-PAD_H/2, -Math.PI/2, speed) ]; G.onPaddle=true;
  state="play"; started=false; ensureMusic();
}
function launch(){ if(!G||G.mode!=="solo"||!G.onPaddle)return; G.onPaddle=false; started=true;
  const b=G.balls[0], ang=-Math.PI/2+(Math.random()*0.5-0.25), sp=G.speed; b.vx=Math.cos(ang)*sp; b.vy=Math.sin(ang)*sp; sfx("shoot"); }
function splitBalls(){ if(!G)return; const add=[];
  for(const b of G.balls){ const sp=Math.hypot(b.vx,b.vy)||G.speed, a0=Math.atan2(b.vy,b.vx);
    add.push(newBall(b.x,b.y,a0-0.4,sp)); add.push(newBall(b.x,b.y,a0+0.4,sp)); }
  G.balls=G.balls.concat(add).slice(0,9); }
if(G&&G.stuck)flingStuck(); else launch();// ---------- PONG: 2-player pass-and-play ----------
function startPong(){ currentMode="two"; resetFx();
  const sp=5.2;
  G={ mode:"two", padW:120, p1x:W/2, p2x:W/2, s1:0, s2:0, target:5,
      ball:newBall(W/2,H/2,(Math.random()<.5?0.6:Math.PI-0.6),sp), speed:sp, serveDelay:50, winner:0 };
  state="play"; started=true; ensureMusic();
}
function pongServe(towardBottom){ const a = towardBottom ? (Math.PI/2 + (Math.random()*0.6-0.3)) : (-Math.PI/2 + (Math.random()*0.6-0.3));
  G.ball=newBall(W/2,H/2,a,G.speed); G.serveDelay=45; }

// ---------- input ----------
function canvasPt(e){ const r=c.getBoundingClientRect(); return { x:(e.clientX-r.left)*(W/r.width), y:(e.clientY-r.top)*(H/r.height) }; }
function movePaddleTo(x){ if(!G)return; G.padX=clamp(x,G.padW/2,W-G.padW/2); if(G.onPaddle&&G.balls&&G.balls[0]){ G.balls[0].x=G.padX; } }
function movePong(which,x){ if(!G)return; const cx=clamp(x,G.padW/2,W-G.padW/2); if(which==="p1")G.p1x=cx; else G.p2x=cx; }
const pointers={}; let dragging=false;
c.addEventListener('pointerdown',e=>{ e.preventDefault(); if(BA)BA.unlock(); if(helpOpen){ helpOpen=false; return; }
  if(state==="play"){ const p=canvasPt(e);
    if(G.mode==="two"){ const which=p.y<H/2?"p2":"p1"; pointers[e.pointerId]=which; movePong(which,p.x); return; }
    dragging=true; movePaddleTo(p.x); if(G.stuck)flingStuck(); else if(G.onPaddle)launch(); return; }
  if(state==="win"||state==="lose"){ advanceAfterEnd(); return; } });
c.addEventListener('pointermove',e=>{ const p=canvasPt(e);
  if(G&&G.mode==="two"){ const which=pointers[e.pointerId]; if(which)movePong(which,p.x); return; }
  if(dragging)movePaddleTo(p.x); });
function endPtr(e){ if(e&&e.pointerId!=null)delete pointers[e.pointerId]; dragging=false; }
c.addEventListener('pointerup',endPtr); c.addEventListener('pointercancel',endPtr);

const held={};
addEventListener('keydown',e=>{ const k=e.key;
  if(k==='b'){ botMode=!botMode; started=true; return; }
  if(state==="win"||state==="lose"){ advanceAfterEnd(); return; }
  if([" ","Spacebar","ArrowUp","Up"].includes(k)){ if(G&&G.stuck)flingStuck(); else launch(); e.preventDefault(); return; }
  if(["ArrowLeft","Left"].includes(k)){ held.arL=true; e.preventDefault(); }
  if(["ArrowRight","Right"].includes(k)){ held.arR=true; e.preventDefault(); }
  if(k==='a'||k==='A'){ held.aK=true; }
  if(k==='d'||k==='D'){ held.dK=true; }
});
addEventListener('keyup',e=>{ const k=e.key;
  if(["ArrowLeft","Left"].includes(k))held.arL=false; if(["ArrowRight","Right"].includes(k))held.arR=false;
  if(k==='a'||k==='A')held.aK=false; if(k==='d'||k==='D')held.dK=false; });
function flingStuck(){ const b=G.stuck; if(!b)return; const ang=-Math.PI/2+(Math.random()*0.5-0.25), sp=G.speed; b.vx=Math.cos(ang)*sp; b.vy=Math.sin(ang)*sp; G.stuck=null; sfx("shoot"); }

// ---------- QA bots ----------
function botThinkSolo(){ if(!G)return; if(G.onPaddle){ launch(); return; } if(G.sticky&&G.stuck){ flingStuck(); return; }
  let ball=null,low=-1; for(const b of G.balls){ if(b===G.stuck)continue; if(b.vy>0&&b.y>low){low=b.y;ball=b;} }
  if(!ball){ let by=-1; for(const b of G.balls){ if(b.y>by){by=b.y;ball=b;} } } if(!ball)return;
  let tb=null,bd=1e9; for(const br of G.bricks){ if(!br.alive)continue; const cx=br.x+br.w/2,cy=br.y+br.h/2,d=(cx-ball.x)*(cx-ball.x)+(cy-ball.y)*(cy-ball.y); if(d<bd){bd=d;tb=br;} }
  let target=ball.x; if(tb){ const dir=(tb.x+tb.w/2)>ball.x?1:-1; target=ball.x-dir*G.padW*0.42; }
  movePaddleTo(target); }
function botThinkPong(){ if(!G||!G.ball)return; const b=G.ball;
  // QA bots only (botMode): P1 is a strong tracker, P2 plays loose (eases back to
  // center) so balls that top out off-center get past it -> a winner reliably emerges.
  G.p1x=clamp(G.p1x+clamp(b.x-G.p1x,-6.5,6.5), G.padW/2, W-G.padW/2);
  G.p2x=clamp(G.p2x+clamp((W/2)-G.p2x,-2.2,2.2), G.padW/2, W-G.padW/2); }

// ---------- update (pure logic; headless-safe) ----------
function update(){
  if(state!=="play"||helpOpen||!G) return;
  if(G.mode==="two") updatePong(); else updateSolo();
  if(BM) BM.update(fx);
}

function updateSolo(){
  if(botMode) botThinkSolo();
  else { const ps=10; if(held.arL||held.aK)movePaddleTo(G.padX-ps); if(held.arR||held.dK)movePaddleTo(G.padX+ps); }
  if(!started) return;
  if(G.padGrowT>0){ G.padGrowT--; if(G.padGrowT===0){ const d=DIFFS[PREFS.difficulty]||DIFFS.normal; G.padW=d.padW; } }
  if(G.stickyT>0){ G.stickyT--; if(G.stickyT===0)G.sticky=false; }
  if(G.fireT>0)G.fireT--;
  const slow=G.slowT>0?0.55:1; if(G.slowT>0)G.slowT--;
  const padL=G.padX-G.padW/2, padR=G.padX+G.padW/2;

  // laser power-up: paddle auto-zaps bricks straight up
  if(G.laserT>0){ G.laserT--; if(G.laserCd>0)G.laserCd--; if(G.laserCd<=0){ G.laserCd=14;
    G.lasers.push({x:padL+8,y:PAD_Y-12,vy:-9}); G.lasers.push({x:padR-8,y:PAD_Y-12,vy:-9}); } }   /* no per-laser beep; brick smash carries it */
  for(const lz of G.lasers){ lz.y+=lz.vy;
    for(const br of G.bricks){ if(!br.alive)continue; if(lz.x>=br.x&&lz.x<=br.x+br.w&&lz.y<=br.y+br.h&&lz.y>=br.y){ damageBrick(br,lz.x,lz.y,1); lz.dead=true; break; } } }
  G.lasers=G.lasers.filter(lz=>!lz.dead && lz.y>-10);

  for(const b of G.balls){
    if(b===G.stuck){ b.x=G.padX; b.y=PAD_Y-PAD_H/2-BALL_R; continue; }
    b.x+=b.vx*slow; b.y+=b.vy*slow;
    if(b.x<BALL_R){ b.x=BALL_R; b.vx=Math.abs(b.vx); sfx("select"); }
    if(b.x>W-BALL_R){ b.x=W-BALL_R; b.vx=-Math.abs(b.vx); sfx("select"); }
    if(b.y<BALL_R){ b.y=BALL_R; b.vy=Math.abs(b.vy); sfx("select"); }
    // paddle bounce
    if(b.vy>0 && b.y+BALL_R>=PAD_Y-PAD_H/2 && b.y-BALL_R<=PAD_Y+PAD_H/2 && b.x>=padL-BALL_R && b.x<=padR+BALL_R){
      const hit=clamp((b.x-G.padX)/(G.padW/2),-1,1); let ang=-Math.PI/2+hit*1.0+(Math.random()*0.10-0.05);
      ang=clamp(ang,-Math.PI/2-1.15,-Math.PI/2+1.15); const sp=G.speed;
      b.vx=Math.cos(ang)*sp; b.vy=Math.sin(ang)*sp; b.y=PAD_Y-PAD_H/2-BALL_R;
      const minVx=sp*0.22; if(Math.abs(b.vx)<minVx){ b.vx=(b.vx<0?-1:1)*minVx; b.vy=-Math.sqrt(Math.max(1,sp*sp-b.vx*b.vx)); }
      if(G.sticky){ G.stuck=b; } sfx("shoot");
    }
    hitBricks(b);
  }
  G.balls=G.balls.filter(b=> b===G.stuck || b.y<H+30);
  if(G.balls.length===0 && !G.stuck){ loseLife(); }

  for(const cap of G.caps){ cap.y+=2.4;
    if(cap.y>PAD_Y-PAD_H/2-10 && cap.y<PAD_Y+PAD_H && cap.x>padL-12 && cap.x<padR+12){ cap.got=true; const p=POWERS[cap.id];
      if(p){ p.apply(G); sfx("levelup"); if(BM)BM.explode(fx,cap.x,cap.y,cap.col,{n:14,pop:p.name,popCol:"#fff",shake:0.18,flash:0.1}); } } }
  G.caps=G.caps.filter(cap=>!cap.got && cap.y<H+20);

  if(!G.bricks.some(b=>b.alive)){ winLevel(); }
}

// damage a brick (used by ball and laser); spawns juice + capsule on destroy
function damageBrick(br,hx,hy,dmg){ br.hp-=dmg; const cx=br.x+br.w/2, cy=br.y+br.h/2;
  if(br.hp<=0){ br.alive=false; G.score+=10;
    if(BM){ if(br.maxHp>=2||br.power) BM.explode(fx,cx,cy,br.col,{n:14,pop:"+10",popCol:"#fff",shake:0.2,flash:0.08,sfx:()=>sfx("boom")});
            else { BM.burst(fx.parts,cx,cy,br.col,7); BM.pop(fx.pops,cx,cy,"+10",br.col); sfx("coin",{tier:1}); } }
    else sfx("coin",{tier:br.maxHp>=2?2:1});
    if(br.power){ G.caps.push({x:cx,y:cy,id:br.power,col:(POWERS[br.power]||{}).col||"#fff",got:false}); }
    return true;
  } else { if(BM)BM.burst(fx.parts,cx,cy,br.col,3); sfx("coin",{tier:1}); return false; }
}
// ball vs bricks. fireball plows through (no bounce, destroys what it touches).
function hitBricks(b){ const fire=G.fireT>0;
  for(const br of G.bricks){ if(!br.alive)continue;
    if(b.x+BALL_R<br.x || b.x-BALL_R>br.x+br.w || b.y+BALL_R<br.y || b.y-BALL_R>br.y+br.h) continue;
    if(fire){ damageBrick(br, b.x, b.y, 99); continue; }   // smash through, keep going
    const ox=Math.min(b.x+BALL_R-br.x, br.x+br.w-(b.x-BALL_R)), oy=Math.min(b.y+BALL_R-br.y, br.y+br.h-(b.y-BALL_R));
    if(ox<oy){ b.vx=-b.vx; b.x+=(b.x<br.x+br.w/2?-ox:ox); } else { b.vy=-b.vy; b.y+=(b.y<br.y+br.h/2?-oy:oy); }
    damageBrick(br, b.x, b.y, 1);
    break;
  }
}
function loseLife(){ G.lives--; G.lostLives++; if(BM){ BM.shake(fx,0.5); BM.flash(fx,"#ff4444",0.3); } sfx("hurt");
  if(G.lives<=0){ state="lose"; sfx("lose"); return; }
  G.balls=[ newBall(G.padX, PAD_Y-BALL_R-PAD_H/2, -Math.PI/2, G.speed) ]; G.onPaddle=true; G.stuck=null; started=false; }
function winLevel(){ state="win"; sfx("win"); PREFS.totalWins++;
  const earned = G.lostLives<=0?3 : (G.lostLives===1?2:1);
  PREFS.stars[level]=Math.max(PREFS.stars[level]||0, earned);
  const u=Math.min(GAME_CONFIG.levels.length-1, level+1); if(u>(PREFS.unlocked||0)){ PREFS.unlocked=u; }
  PREFS.bestLevel=Math.max(PREFS.bestLevel||0, level+1); savePrefs();
  if(BM){ for(let i=0;i<3;i++) BM.burst(fx.parts, W*(0.3+0.2*i), H*0.4, GAME_CONFIG.brickColors[i*2], 22, {gravity:18,spd:[2,6],life:[0.7,1.4]}); BM.flash(fx,"#ffffff",0.2); } }

function updatePong(){
  const b=G.ball; if(!b)return;
  if(botMode) botThinkPong();
  else { const ps=11; if(held.arL)G.p1x=clamp(G.p1x-ps,G.padW/2,W-G.padW/2); if(held.arR)G.p1x=clamp(G.p1x+ps,G.padW/2,W-G.padW/2);
         if(held.aK)G.p2x=clamp(G.p2x-ps,G.padW/2,W-G.padW/2); if(held.dK)G.p2x=clamp(G.p2x+ps,G.padW/2,W-G.padW/2); }
  if(G.serveDelay>0){ G.serveDelay--; b.x=W/2; b.y=H/2; return; }
  b.x+=b.vx; b.y+=b.vy;
  if(b.x<BALL_R){ b.x=BALL_R; b.vx=Math.abs(b.vx); if(BM)BM.burst(fx.parts,b.x,b.y,"#fff",4); sfx("select"); }
  if(b.x>W-BALL_R){ b.x=W-BALL_R; b.vx=-Math.abs(b.vx); if(BM)BM.burst(fx.parts,b.x,b.y,"#fff",4); sfx("select"); }
  pongPaddle(b, G.p1x, PAD_Y, +1);
  pongPaddle(b, G.p2x, TOP_Y, -1);
  if(b.y>H+12){ G.s2++; pongScore(2); }
  else if(b.y<-12){ G.s1++; pongScore(1); }
}
function pongPaddle(b,px,py,dir){ const padL=px-G.padW/2, padR=px+G.padW/2;
  const toward = dir>0 ? b.vy>0 : b.vy<0;
  const near = b.y+BALL_R>=py-PAD_H/2 && b.y-BALL_R<=py+PAD_H/2;
  if(toward && near && b.x>=padL-BALL_R && b.x<=padR+BALL_R){
    const hit=clamp((b.x-px)/(G.padW/2),-1,1); const sp=G.speed;
    let ang = dir>0 ? (-Math.PI/2 + hit*1.0) : (Math.PI/2 - hit*1.0);
    ang += (Math.random()*0.10-0.05);
    b.vx=Math.cos(ang)*sp; b.vy=Math.sin(ang)*sp;
    // never perfectly vertical (so the ball wanders) and never too flat (so a rally ends)
    if(Math.abs(b.vx)<sp*0.20)b.vx=(b.vx<0?-1:1||1)*sp*0.20;
    if(Math.abs(b.vy)<sp*0.45)b.vy=(dir>0?-1:1)*sp*0.45;
    const m=Math.hypot(b.vx,b.vy)||1; b.vx=b.vx/m*sp; b.vy=b.vy/m*sp;
    b.y = dir>0 ? py-PAD_H/2-BALL_R : py+PAD_H/2+BALL_R;
    if(BM)BM.burst(fx.parts,b.x,b.y,dir>0?PREFS.paddle:"#62d0ff",6); sfx("shoot");
  }
}
function pongScore(scorer){ if(BM){ BM.shake(fx,0.5); BM.flash(fx,"#ffffff",0.25); BM.explode(fx, G.ball.x, scorer===2?H-30:30, "#ffd86b", {n:18,pop:"Point!",popCol:"#fff",shake:0,flash:0}); } sfx("point");
  if(G.s1>=G.target){ G.winner=1; state="win"; sfx("win"); return; }
  if(G.s2>=G.target){ G.winner=2; state="win"; sfx("win"); return; }
  pongServe(scorer===1);   // serve toward the player who just got scored on
}

function advanceAfterEnd(){
  if(G && G.mode==="two"){ showMenu(); return; }
  if(state==="win"){ if(level<GAME_CONFIG.levels.length-1){ startLevel(level+1, G.lives); } else { showMenu(); toast("You beat every level!"); } }
  else { showMenu(); }
}

// ---------- draw ----------
function rrect(x,y,w,h,r){ BR.rrect(ctx,x,y,w,h,r); }
function drawBackdrop(){ const t=Date.now()/1000, img=bgImage();
  if(img && (img.complete||img.width) && (img.naturalWidth||img.width)){ BR.bgImage(ctx,img,W,H);
    const v=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.4,W/2,H/2,Math.max(W,H)*0.72); v.addColorStop(0,"rgba(0,0,0,0)"); v.addColorStop(1,"rgba(0,0,0,0.32)"); ctx.fillStyle=v; ctx.fillRect(0,0,W,H);
  } else { const d=backdropDef(), g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,d.c1); g.addColorStop(1,d.c2); ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    for(const st of stars){ const a=0.25*Math.abs(Math.sin(t*st.sp+st.ph)); ctx.fillStyle="rgba(255,255,255,"+a.toFixed(2)+")"; ctx.beginPath();ctx.arc(st.x,st.y,st.s,0,7);ctx.fill(); } }
}
function drawBall(b,fire){ const sk=BALLS.find(x=>x.id===PREFS.ball)||BALLS[0];
  const useFlame = fire || sk.flame;
  ctx.save(); ctx.shadowColor=useFlame?"#ff8a3d":(sk.rainbow?"#fff":sk.glow); ctx.shadowBlur=useFlame?22:16;
  if(useFlame){ const g=ctx.createRadialGradient(b.x,b.y,1,b.x,b.y,BALL_R+3); g.addColorStop(0,"#fff"); g.addColorStop(0.5,"#ffd86b"); g.addColorStop(1,"#ff5a2c"); ctx.fillStyle=g; ctx.beginPath();ctx.arc(b.x,b.y,BALL_R+2,0,7);ctx.fill(); }
  else if(sk.rainbow){ const hue=(Date.now()/12)%360, col="hsl("+hue.toFixed(0)+",90%,62%)"; const g=ctx.createRadialGradient(b.x-3,b.y-3,1,b.x,b.y,BALL_R); g.addColorStop(0,"#fff"); g.addColorStop(1,col); ctx.fillStyle=g; ctx.beginPath();ctx.arc(b.x,b.y,BALL_R,0,7);ctx.fill(); }
  else if(sk.star){ BR.sparkle(ctx,b.x,b.y,BALL_R+2,Date.now()/200); }
  else { const g=ctx.createRadialGradient(b.x-3,b.y-3,1,b.x,b.y,BALL_R); g.addColorStop(0,"#fff"); g.addColorStop(1,sk.col); ctx.fillStyle=g; ctx.beginPath();ctx.arc(b.x,b.y,BALL_R,0,7);ctx.fill(); }
  ctx.restore(); }
function drawPaddleAt(px,py,col){ const x=px-G.padW/2; ctx.save(); ctx.shadowColor=col; ctx.shadowBlur=12;
  const g=ctx.createLinearGradient(0,py-PAD_H/2,0,py+PAD_H/2); g.addColorStop(0,"#ffffff"); g.addColorStop(0.25,col); g.addColorStop(1,shade(col,-30));
  ctx.fillStyle=g; rrect(x,py-PAD_H/2,G.padW,PAD_H,9); ctx.fill(); ctx.restore(); }
function shade(hex,amt){ const n=parseInt(hex.slice(1),16); let r=(n>>16)+amt,g=((n>>8)&255)+amt,b=(n&255)+amt; r=clamp(r,0,255);g=clamp(g,0,255);b=clamp(b,0,255); return "#"+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1); }
function banner(t,s){ ctx.fillStyle="rgba(10,12,40,.66)";ctx.fillRect(0,0,W,H); ctx.textAlign="center"; ctx.fillStyle="#fff";ctx.font="bold 48px Fredoka,sans-serif";ctx.fillText(t,W/2,H/2-6); ctx.font="22px Fredoka,sans-serif";ctx.fillText(s,W/2,H/2+36); }
// a 5-point star (filled gold when earned, dim outline when not)
function star5(cx,cy,r,filled){ ctx.beginPath();
  for(let i=0;i<10;i++){ const ang=-Math.PI/2+i*Math.PI/5, rad=(i%2===0)?r:r*0.45; const x=cx+Math.cos(ang)*rad, y=cy+Math.sin(ang)*rad; i?ctx.lineTo(x,y):ctx.moveTo(x,y); }
  ctx.closePath(); if(filled){ ctx.fillStyle="#ffd54a"; ctx.fill(); ctx.strokeStyle="#caa42a"; ctx.lineWidth=2; ctx.stroke(); } else { ctx.fillStyle="rgba(255,255,255,.12)"; ctx.fill(); ctx.strokeStyle="rgba(255,255,255,.35)"; ctx.lineWidth=2; ctx.stroke(); } }
function drawEarnedStars(earned){ const r=26, gap=72, y=H/2-86; const xs=[W/2-gap,W/2,W/2+gap];
  for(let i=0;i<3;i++){ star5(xs[i], y, r, i<earned); } }

// --- Tutorial "demo hand": now uses the shared 3D hand (BR.hand) so every game

function drawTutorial(){ const tt=Date.now()/1000;

  if(G.mode==="two"){

    ctx.fillStyle=PREFS.paddle; rrect(W/2-60,H-150,120,16,8); ctx.fill();
    const by=H/2+Math.sin(tt*2)*60; ctx.save(); ctx.shadowColor="#fff"; ctx.shadowBlur=16; ctx.fillStyle="#fff"; ctx.beginPath();ctx.arc(W/2,by,9,0,7);ctx.fill(); ctx.restore();
  } else {

  ctx.fillStyle="#9b7bff"; ctx.beginPath();ctx.arc(W/2,ay,pr,0,7);ctx.fill();

}

function draw(){ if(!G){ return; }
  drawBackdrop();
  const sh = BM ? BM.shakeOffset(fx) : {x:0,y:0};
  ctx.save(); ctx.translate(sh.x, sh.y);
  if(G.mode==="two") drawPong(); else drawSolo();
  ctx.restore();
  if(BM) BM.draw(ctx, fx, { W, H, font:"bold 20px Fredoka,sans-serif" });
  // overlays (drawn unshaken)
  if(state==="play" && (!started||helpOpen) && G.mode!=="two") drawTutorial();
  if(state==="play" && helpOpen && G.mode==="two") drawTutorial();
  if(state==="play" && G.mode==="two" && G.serveDelay>30 && G.s1===0 && G.s2===0 && !botMode && !helpOpen) drawTutorial();
  if(state==="win" && G.mode==="two"){ banner("Player "+G.winner+" wins!", "Tap for the menu"); }
  else if(state==="win"){ banner(level<GAME_CONFIG.levels.length-1?"Level Clear!":"You Win!", level<GAME_CONFIG.levels.length-1?"Next level unlocked - tap to go on":"Tap to finish"); drawEarnedStars(PREFS.stars[level]||0); }
  if(state==="lose"){ banner("Out of lives!","Tap to try again"); }
  if(hud){ hud[(state==="play" && G.mode!=="two") ? "show" : "hide"](); }
}
// each backdrop gives its bricks a matching drawn style (the always-on art layer)
function drawBrick(br){ const x=br.x,y=br.y,w=br.w,h=br.h; ctx.fillStyle=br.col; rrect(x,y,w,h,6); ctx.fill();
  switch(backdropDef().id){
    case "space": // metal plate: top highlight, bottom shade, two rivets
      ctx.fillStyle="rgba(255,255,255,.22)"; rrect(x+3,y+3,w-6,h*0.32,4); ctx.fill();
      ctx.fillStyle="rgba(0,0,0,.22)";       rrect(x+3,y+h*0.62,w-6,h*0.28,4); ctx.fill();
      ctx.fillStyle="rgba(255,255,255,.55)"; ctx.beginPath();ctx.arc(x+8,y+h/2,1.5,0,7);ctx.arc(x+w-8,y+h/2,1.5,0,7);ctx.fill(); break;
    case "candy": // glossy candy: shine stripe + sprinkles
      ctx.fillStyle="rgba(255,255,255,.5)";  rrect(x+4,y+3,w-8,4,2); ctx.fill();
      ctx.fillStyle="rgba(255,255,255,.65)"; for(let i=0;i<3;i++){ ctx.beginPath();ctx.arc(x+w*(0.3+0.2*i),y+h*0.64,1.3,0,7);ctx.fill(); } break;
    case "ocean": { // bubble/jelly: vertical sheen + highlight blob
      const g=ctx.createLinearGradient(x,y,x,y+h); g.addColorStop(0,"rgba(255,255,255,.4)"); g.addColorStop(1,"rgba(255,255,255,0)"); ctx.fillStyle=g; rrect(x+2,y+2,w-4,h-4,5); ctx.fill();
      ctx.fillStyle="rgba(255,255,255,.7)"; ctx.beginPath();ctx.ellipse(x+11,y+6,5,2.4,0,0,7);ctx.fill(); break; }
    case "castle": // stone block: bevel lines + a mortar seam
      ctx.strokeStyle="rgba(255,255,255,.28)"; ctx.lineWidth=1.4; ctx.beginPath();ctx.moveTo(x+4,y+3);ctx.lineTo(x+w-4,y+3);ctx.stroke();
      ctx.strokeStyle="rgba(0,0,0,.28)";       ctx.beginPath();ctx.moveTo(x+4,y+h-3);ctx.lineTo(x+w-4,y+h-3);ctx.stroke();
      ctx.fillStyle="rgba(0,0,0,.14)"; rrect(x+w/2-1,y+5,2,h-10,1); ctx.fill(); break;
    case "desert": { // sandy: warm top sheen to darker base
      const g=ctx.createLinearGradient(x,y,x,y+h); g.addColorStop(0,"rgba(255,255,255,.28)"); g.addColorStop(1,"rgba(120,80,20,.20)"); ctx.fillStyle=g; rrect(x+2,y+2,w-4,h-4,5); ctx.fill(); break; }
    default: // meadow: soft glossy top
      ctx.fillStyle="rgba(255,255,255,.28)"; rrect(x+4,y+3,w-8,4,2); ctx.fill();
  }
  if(br.maxHp>=2){ ctx.fillStyle = br.hp>=2 ? "rgba(255,255,255,.32)" : "rgba(0,0,0,.20)"; rrect(x+4,y+h*0.5-2,w-8,4,2); ctx.fill(); }
  if(br.power){ ctx.fillStyle="rgba(255,255,255,.9)"; ctx.beginPath();ctx.arc(x+w/2,y+h/2,3.2,0,7);ctx.fill(); }
}
function drawSolo(){
  for(const br of G.bricks){ if(!br.alive)continue; drawBrick(br); }
  for(const lz of G.lasers){ ctx.strokeStyle="#ff5da2"; ctx.lineWidth=3; ctx.shadowColor="#ff5da2"; ctx.shadowBlur=8; ctx.beginPath();ctx.moveTo(lz.x,lz.y);ctx.lineTo(lz.x,lz.y+14);ctx.stroke(); ctx.shadowBlur=0; }
  for(const cap of G.caps){ ctx.save(); ctx.shadowColor=cap.col; ctx.shadowBlur=12; ctx.fillStyle=cap.col; rrect(cap.x-13,cap.y-8,26,16,8); ctx.fill(); ctx.fillStyle="rgba(255,255,255,.9)"; ctx.beginPath();ctx.arc(cap.x,cap.y,3,0,7);ctx.fill(); ctx.restore(); }
  const fire=G.fireT>0; for(const b of G.balls) drawBall(b,fire);
  drawPaddleAt(G.padX, PAD_Y, PREFS.paddle);
  // HUD — shared tinted chips (see buildable-hud.js). No longer painted on canvas.
  { const leftN=G.bricks.filter(b=>b.alive).length;
    const left=[{ text:L.name, soft:"Level "+(level+1)+"/"+GAME_CONFIG.levels.length }];
    const tags=[]; if(G.fireT>0)tags.push("Fireball"); if(G.laserT>0)tags.push("Laser"); if(G.slowT>0)tags.push("Slow-Mo");
    if(tags.length) left.push({ text:tags.join("  ") });
    HUD().set({ left:left, right:[ { text:"Bricks left: "+leftN }, { hearts:G.lives } ] }); }
}
function drawPong(){
  // center line
  ctx.strokeStyle="rgba(255,255,255,.25)"; ctx.lineWidth=3; ctx.setLineDash([14,12]); ctx.beginPath();ctx.moveTo(0,H/2);ctx.lineTo(W,H/2);ctx.stroke(); ctx.setLineDash([]);
  drawPaddleAt(G.p2x, TOP_Y, "#62d0ff");
  drawPaddleAt(G.p1x, PAD_Y, PREFS.paddle);
  drawBall(G.ball,false);
  // scores (rotated for the top player so it reads right-side-up to them)
  ctx.fillStyle="rgba(255,255,255,.9)"; ctx.font="bold 54px Fredoka,sans-serif"; ctx.textAlign="center";
  ctx.fillText(String(G.s1), W-60, H/2+70);
  ctx.save(); ctx.translate(60,H/2-70); ctx.rotate(Math.PI); ctx.fillText(String(G.s2),0,0); ctx.restore();
  ctx.font="bold 15px Fredoka,sans-serif"; ctx.fillStyle="rgba(255,255,255,.6)"; ctx.fillText("first to "+G.target, W/2, H/2-10);
}

// ---------- shared start screen (BS) + bespoke customize overlay ----------
function el(id){ const e=document.getElementById(id); return (e&&e.style)?e:null; }
function show(id,on){ const e=el(id); if(e)e.classList[on?"add":"remove"]("show"); }
function toast(msg){ const e=el("toast"); if(!e)return; e.textContent=msg; e.style.display="block"; clearTimeout(toast._t); toast._t=setTimeout(()=>{e.style.display="none";},2600); }
function showHelpBtn(on){ const hb=el("helpBtn"); if(hb)hb.style.display=on?"block":"none"; }
function showInGameMute(on){ const mb=el("muteBtn"); if(mb)mb.style.display=on?"block":"none"; }
function showInGameBack(on){ const bb=el("backBtn"); if(bb)bb.style.display=on?"block":"none"; }

let startScreen=null;
function totalStars(){ let t=0; for(const k in PREFS.stars) t+=(PREFS.stars[k]||0); return t; }
function maxStars(){ return GAME_CONFIG.levels.length*3; }
function isUnlocked(cost){ return (cost||0) <= totalStars(); }
function buildStartCfg(){
  const levels = currentMode==="two"
    ? [{ n:1, name:"Pong Match", color:"#2b4a6b", state:"next" }]
    : GAME_CONFIG.levels.map((l,i)=>{ const unlocked=PREFS.unlocked||0;
        const st = i<unlocked ? "done" : (i===unlocked ? "next" : "locked");
        return { n:i+1, name:l.name, color:brickColorFor(i), maxStars:3, stars: st==="done"?(PREFS.stars[i]||0):undefined, state:st };
      });
  const cfg = { title:"Buildable Breaker",
    subtitle: currentMode==="two" ? "Two players — knock the ball past your buddy!" : "Bounce the ball, smash every brick",
    sound: !(BA&&BA.muted), showBack:false, modes:[], mode:"solo", levels, customizeLabel:"Make It Mine" };
  if(currentMode!=="two"){ cfg.coins = totalStars(); cfg.subtitle = "Stars: "+totalStars()+" of "+maxStars(); }   // total stars earned
  return cfg;
}
function showMenu(){ state="title"; G=null; if(hud)hud.hide(); show("customize",false); showHelpBtn(false); showInGameMute(false); showInGameBack(false);
  const host=document.getElementById("start"); if(host)host.style.display="block";
  if(!BS||!host){ return; }
  const cb={
    onPlay:(n)=>{ if(currentMode==="two")startPong(); else startPlay(n-1); hideMenu(); },
    onMode:(m)=>{ currentMode=m; if(startScreen)startScreen.update(buildStartCfg()); },
    onCustomize:()=>showCustomize(),
    onSound:(on)=>{ if(BA){ BA.unlock(); BA.toggleMute(); } },
    onBack:()=>{},
  };
  if(!startScreen) startScreen=BS.mount(host, buildStartCfg(), cb);
  else startScreen.update(buildStartCfg());
}
function hideMenu(){ const host=document.getElementById("start"); if(host)host.style.display="none"; showHelpBtn(true); showInGameMute(true); showInGameBack(true); }
function startPlay(i){ if(BA)BA.unlock(); startLevel(i,null); }

// ----- Make It Mine (customize) — bespoke; opened from the BS start screen -----
let custTab="look";
function showCustomize(){ custTab="look"; const host=document.getElementById("start"); if(host)host.style.display="none"; show("customize",true); showHelpBtn(false); showInGameMute(false); showInGameBack(false); renderCustomize(); }
function renderCustomize(){ const tabs=el("custTabs"), grid=el("custGrid"); if(!tabs||!grid)return;
  const TAB_LABEL={look:"Look", power:"Power-ups", diff:"How Hard"};
  tabs.innerHTML=""; for(const s of ["look","power","diff"]){ const b=document.createElement("button"); b.className="tab"+(s===custTab?" on":""); b.textContent=TAB_LABEL[s]; b.onclick=()=>{custTab=s;renderCustomize();}; tabs.appendChild(b); }
  grid.innerHTML=""; if(custTab==="look")renderLook(grid); else if(custTab==="power")renderPowers(grid); else renderDiff(grid);
}
function optCard(swHTML,name,ds,on,onClick){ const card=document.createElement("div"); card.className="opt"+(on?" on":"");
  card.innerHTML='<div class="sw">'+swHTML+'</div><div class="nm">'+name+'</div><div class="ds">'+(ds||"")+'</div>'; card.onclick=onClick; return card; }
function renderLook(grid){
  const head=document.createElement("div"); head.style.cssText="width:100%;text-align:center;font-weight:800;opacity:.8;margin:2px 0 4px"; head.textContent="Backdrop"; grid.appendChild(head);
  for(const d of BACKDROPS){ const sw='background:linear-gradient(135deg,'+d.c1+','+d.c2+')';
    grid.appendChild(optCard('<div style="width:100%;height:100%;border-radius:10px;'+sw+'"></div>', d.name, "", PREFS.backdrop===d.id, ()=>{ PREFS.backdrop=d.id; savePrefs(); renderCustomize(); })); }
  const tip=document.createElement("div"); tip.style.cssText="width:100%;text-align:center;font-size:12px;color:#ffd86b;margin:10px 0 -2px"; tip.textContent="Earn stars in Solo to unlock more!"; grid.appendChild(tip);
  const h2=document.createElement("div"); h2.style.cssText="width:100%;text-align:center;font-weight:800;opacity:.8;margin:8px 0 4px"; h2.textContent="Ball"; grid.appendChild(h2);
  for(const b of BALLS){ const locked=!isUnlocked(b.cost);
    const dot='<div style="position:relative;width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,'+b.col+');box-shadow:0 0 12px '+b.glow+';'+(locked?'opacity:.35;':'')+'"></div>';
    const ds = locked ? ("Unlock at ★"+b.cost) : "";
    grid.appendChild(optCard(dot, b.name, ds, PREFS.ball===b.id, ()=>{ if(locked){ toast("Earn "+(b.cost-totalStars())+" more stars to unlock "+b.name); return; } PREFS.ball=b.id; savePrefs(); renderCustomize(); })); }
  const h3=document.createElement("div"); h3.style.cssText="width:100%;text-align:center;font-weight:800;opacity:.8;margin:10px 0 4px"; h3.textContent="Paddle"; grid.appendChild(h3);
  const row=document.createElement("div"); row.style.cssText="display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:flex-start;width:100%";
  for(const pd of PADDLES){ const col=pd.col, locked=!isUnlocked(pd.cost), sel=PREFS.paddle===col;
    const wrap=document.createElement("div"); wrap.style.cssText="display:flex;flex-direction:column;align-items:center;gap:3px";
    const sw=document.createElement("div");
    sw.style.cssText="width:64px;height:30px;border-radius:8px;cursor:pointer;background:linear-gradient(180deg,#fff,"+col+");border:3px solid "+(sel?"#7ee0a0":"transparent")+";box-shadow:0 0 0 2px "+(sel?"rgba(126,224,160,.4)":"transparent")+";"+(locked?"opacity:.35;":"");
    sw.onclick=()=>{ if(locked){ toast("Earn "+(pd.cost-totalStars())+" more stars to unlock this paddle"); return; } PREFS.paddle=col; savePrefs(); renderCustomize(); };
    wrap.appendChild(sw);
    if(locked){ const t=document.createElement("div"); t.style.cssText="font-size:11px;font-weight:800;color:#ffd86b"; t.textContent="★"+pd.cost; wrap.appendChild(t); }
    row.appendChild(wrap); }
  grid.appendChild(row);
}
function renderPowers(grid){
  const note=document.createElement("div"); note.style.cssText="width:100%;text-align:center;opacity:.75;margin-bottom:6px"; note.textContent="Tap to turn each power-up on or off."; grid.appendChild(note);
  for(const id of POWER_IDS){ const p=POWERS[id]; const on=!!PREFS.powers[id];
    const card=document.createElement("div"); card.className="toggle"+(on?" on":"");
    card.innerHTML='<div class="sw" style="background:'+p.col+';border-radius:12px;"></div><div class="nm">'+p.name+'</div><div class="ds">'+p.desc+'</div><div class="pill">'+(on?"ON":"OFF")+'</div>';
    card.onclick=()=>{ PREFS.powers[id]=!PREFS.powers[id]; savePrefs(); renderCustomize(); }; grid.appendChild(card); }
}
function renderDiff(grid){
  for(const id of ["easy","normal","hard"]){ const d=DIFFS[id]; const on=PREFS.difficulty===id;
    grid.appendChild(optCard('<div style="font-weight:800;font-size:22px;color:#1a0f3a;background:#ffd86b;border-radius:12px;width:100%;height:100%;display:flex;align-items:center;justify-content:center">'+d.name+'</div>',
      d.name, d.lives+" lives", on, ()=>{ PREFS.difficulty=id; savePrefs(); renderCustomize(); })); }
}

function wireMenus(){ const bk=el("custBack"); if(bk)bk.onclick=showMenu;
  const mb=el("muteBtn"); if(mb){ const upd=()=>{ mb.textContent="Sound: "+(BA&&BA.muted?"Off":"On"); }; upd(); mb.onclick=()=>{ if(BA){ BA.unlock(); BA.toggleMute(); } upd(); }; }
  const hb=el("helpBtn"); if(hb)hb.onclick=()=>{ helpOpen=true; };
  const bb=el("backBtn"); if(bb)bb.onclick=()=>{ helpOpen=false; showMenu(); }; }

function frame(){ update(); if(G)draw(); requestAnimationFrame(frame); }
// bespoke created sounds (ElevenLabs via /api/sfx) — synth stays as a silent fallback.
// Reuses tennis's paddle-game one-shots; adds Breaker-specific brick sounds.
if(BA && BA.configure){ BA.configure({ sfxBase:"/api/sfx?s=", map:{
  shoot:"tennis_hit", select:"tennis_wall", coin:"breaker_smash", boom:"breaker_break",
  levelup:"breaker_power", hurt:"breaker_miss", point:"tennis_point", win:"tennis_win", lose:"tennis_lose" } }); }
// boot
if(typeof document!=="undefined" && document.getElementById("start")){ loadPrefs(); wireMenus(); showMenu(); }
requestAnimationFrame(frame);

// ---------- QA / picker hooks (standardized name; alias kept) ----------
window.BUILDABLE_GAME = {
  startLevel:(i)=>{ startLevel(i,null); },
  startPong:()=>{ startPong(); },
  setBot:(b)=>{ botMode=b; started=true; },
  state:()=>state,
  dbg:()=>({ mode:G?G.mode:"-", level, lives:G&&G.lives, balls:G&&G.balls&&G.balls.length, bricksLeft:G&&G.bricks?G.bricks.filter(b=>b.alive).length:0, s1:G&&G.s1, s2:G&&G.s2,
    ballY:G&&G.ball?Math.round(G.ball.y):null, vx:G&&G.ball?+G.ball.vx.toFixed(2):null, vy:G&&G.ball?+G.ball.vy.toFixed(2):null, p1x:G&&Math.round(G.p1x), p2x:G&&Math.round(G.p2x), state }),
  // solo headless harness: a perfect paddle clears a level
  sim:(idx, maxFrames)=>{ startLevel(idx,null); state="play"; botMode=true; started=true; let f=0; const cap=maxFrames||30000;
    while(state!=="win" && state!=="lose" && f<cap){ update(); f++; }
    return { level:idx, result:state, frames:f, livesLeft:G?G.lives:0, bricksLeft:G&&G.bricks?G.bricks.filter(b=>b.alive).length:0, stars:PREFS.stars[idx]||0 }; },
  // full adventure
  campaign:(cap)=>{ const out=[]; cap=cap||30000;
    for(let lvl=0; lvl<GAME_CONFIG.levels.length; lvl++){ const carry=lvl===0?null:(G?G.lives:null); startLevel(lvl,carry); state="play"; botMode=true; started=true;
      let f=0; while(state!=="win" && state!=="lose" && f<cap){ update(); f++; }
      out.push({ level:lvl+1, result:state, frames:f, livesLeft:G?G.lives:0 }); if(state==="lose")break; }
    return out; },
  // pong harness: two bots play until someone wins
  simPong:(cap)=>{ startPong(); state="play"; botMode=true; started=true; let f=0; cap=cap||60000;
    while(state!=="win" && f<cap){ update(); f++; }
    return { result:state, winner:G?G.winner:0, s1:G?G.s1:0, s2:G?G.s2:0, frames:f }; },
  // render debug hooks
  _begin:(i)=>{ startLevel(i||0,null); state="play"; botMode=true; started=true; },
  _beginPong:()=>{ startPong(); state="play"; botMode=true; started=true; },
  _step:(n)=>{ for(let i=0;i<(n||1);i++) update(); }, _draw:()=>{ try{ draw(); return "ok"; }catch(e){ return "ERR: "+(e&&e.message||e); } },
  _setPref:(k,v)=>{ PREFS[k]=v; }, _prefs:()=>PREFS, _cfg:()=>GAME_CONFIG,
};
window.BREAKER_GAME = window.BUILDABLE_GAME;   // back-compat alias
</script>
