<style>
  html,body{margin:0;height:100%;background:#0a1030;overflow:hidden;touch-action:none;font-family:'Fredoka',-apple-system,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{background:#000;max-width:100%;max-height:100%;image-rendering:auto;border-radius:14px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:none}
  /* #start hosts the SHARED start screen (BS). #customize is the bespoke Make It Mine overlay. */
  #start{position:fixed;inset:0;z-index:10;display:none}
  .ov{position:fixed;inset:0;z-index:10;display:none;flex-direction:column;align-items:center;
      background:linear-gradient(180deg,#0b1230,#241152);color:#fff;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .ov.show{display:flex}
  .ov h1{font-size:40px;margin:30px 0 4px;letter-spacing:.5px}
  .ov .sub{opacity:.78;margin:0 0 18px;text-align:center;padding:0 20px;max-width:560px}
  .btn{font-family:inherit;font-weight:700;font-size:22px;color:#1a0f3a;background:#9b7bff;border:none;
       border-radius:16px;padding:16px 40px;margin:8px;cursor:pointer;min-width:220px;box-shadow:0 6px 0 #6a4ad6}
  .btn:active{transform:translateY(3px);box-shadow:0 3px 0 #6a4ad6}
  .btn.small{font-size:17px;min-width:0;padding:10px 18px;margin:4px}
  .btn.ghost{background:transparent;color:#cdd0ff;box-shadow:none;border:2px solid #4a3c86}
  .btn.ghost:active{transform:translateY(1px);box-shadow:none}
  .btn.wide{min-width:260px}
  .mkClear{font-family:inherit;font-weight:700;font-size:14px;color:#b7b3e6;background:transparent;border:none;cursor:pointer;text-decoration:underline;opacity:.8;margin:8px 0 0}
  .tabs{display:flex;gap:8px;margin:6px 0 14px;flex-wrap:wrap;justify-content:center}
  .tab{font-family:inherit;font-weight:700;font-size:16px;color:#cdd0ff;background:#241a52;border:2px solid #3a2c6e;
       border-radius:12px;padding:9px 18px;cursor:pointer}
  .tab.on{background:#9b7bff;color:#1a0f3a;border-color:#9b7bff}
  .grid{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;max-width:760px;padding:0 14px 24px}
  .opt{width:150px;background:#1a1444;border:3px solid #2c2466;border-radius:16px;padding:12px;text-align:center;cursor:pointer}
  .opt.on{border-color:#7ee0a0;box-shadow:0 0 0 2px rgba(126,224,160,.35)}
  .opt .sw{height:54px;border-radius:12px;margin-bottom:8px;display:flex;align-items:center;justify-content:center}
  .opt .nm{font-weight:700;font-size:17px}
  .opt .ds{opacity:.7;font-size:12px;min-height:16px;margin-top:2px}
  .toggle{width:150px;background:#1a1444;border:3px solid #2c2466;border-radius:16px;padding:12px;text-align:center;cursor:pointer}
  .toggle.on{border-color:#7ee0a0;box-shadow:0 0 0 2px rgba(126,224,160,.35)}
  .toggle .pill{display:inline-block;margin-top:6px;font-weight:800;font-size:13px;padding:3px 12px;border-radius:20px;background:#3a2c6e;color:#cdd0ff}
  .toggle.on .pill{background:#7ee0a0;color:#0c2417}
  #muteBtn{position:fixed;right:12px;top:56px;z-index:30;display:none;font-family:inherit;font-weight:700;font-size:14px;
           color:#cdd0ff;background:rgba(26,20,64,.7);border:1px solid #3a2c6e;border-radius:10px;padding:7px 12px;cursor:pointer}
  #helpBtn{position:fixed;right:12px;top:100px;z-index:30;display:none;font-family:inherit;font-weight:800;font-size:18px;
           color:#1a0f3a;background:#ffd86b;border:none;border-radius:50%;width:38px;height:38px;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.3)}
  #backBtn{position:fixed;right:12px;top:12px;z-index:30;display:none;font-family:inherit;font-weight:800;font-size:14px;
           color:#fff;background:rgba(26,20,64,.78);border:1px solid #3a2c6e;border-radius:12px;padding:8px 14px;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.3)}
  .toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:20;background:#ffd86b;color:#1a0f3a;
         font-weight:700;padding:12px 22px;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.35);display:none}
  /* ---- Make a level (maker) ---- */
  #mkBody{width:100%;max-width:840px;display:flex;flex-direction:column;align-items:center;padding:0 14px}
  .mkHint{opacity:.75;font-size:13px;text-align:center;margin:2px 0 10px}
  .mkGrid{display:grid;gap:5px;background:#120d33;padding:12px;border-radius:14px;margin:2px auto 0;touch-action:none;width:100%;max-width:560px;box-sizing:border-box}
  .mkCell{aspect-ratio:2/1;border-radius:5px;background:#211a4d;border:1px dashed #3a2c6e;cursor:pointer}
  .mkPal{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:12px 0}
  .mkChip{display:flex;flex-direction:column;align-items:center;gap:4px;background:#1a1444;border:3px solid #2c2466;border-radius:12px;padding:8px 10px;cursor:pointer;min-width:64px}
  .mkChip.on{border-color:#7ee0a0;box-shadow:0 0 0 2px rgba(126,224,160,.35)}
  .mkChip .box{width:34px;height:17px;border-radius:5px}
  .mkChip .lbl{font-size:12px;font-weight:700}
  .mkChip .sub{font-size:10px;opacity:.7}
  .mkFlames{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:14px 0}
  .mkFlame{background:#1a1444;border:3px solid #2c2466;border-radius:16px;padding:12px 10px;cursor:pointer;text-align:center;min-width:72px}
  .mkFlame.on{border-color:#7ee0a0;box-shadow:0 0 0 2px rgba(126,224,160,.35)}
  .mkFlame .fn{display:flex;gap:1px;justify-content:center;min-height:20px}
  .mkFlame .fl{font-weight:800;font-size:15px;margin-top:4px}
  .mkCard{background:#120d33;border:2px solid #2c2466;border-radius:16px;padding:16px;max-width:340px;margin:8px auto;width:100%;box-sizing:border-box}
  .mkList{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:10px}
  .mkLevel{width:170px;background:#1a1444;border:2px solid #2c2466;border-radius:14px;overflow:hidden;text-align:center}
  .mkLevel .thumb{height:70px}
  .mkLevel .lname{font-weight:700;font-size:14px;margin:8px 6px 2px}
  input.mkInput{font-family:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:2px solid #3a2c6e;background:#150f38;color:#fff;width:100%;box-sizing:border-box}
  .mkRowBtns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:6px 0 2px}
  /* ---- Breaker home hub (playful animated buttons) ---- */
  .hubBtns{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin:14px 0 6px}
  .hubBig{position:relative;width:232px;max-width:44vw;border:none;border-radius:22px;padding:0 0 16px;cursor:pointer;font-family:inherit;text-align:center;overflow:hidden;box-shadow:0 12px 26px rgba(0,0,0,.4),0 7px 0 rgba(0,0,0,.22);transition:transform .12s,box-shadow .12s}
  .hubBig:hover{transform:translateY(-3px)}
  .hubBig:active{transform:translateY(4px);box-shadow:0 5px 12px rgba(0,0,0,.4),0 3px 0 rgba(0,0,0,.22)}
  .hubBig .bt{font-size:26px;font-weight:800;margin-top:12px;position:relative;z-index:3}
  .hubBig .bs{font-size:12.5px;opacity:.92;margin-top:3px;font-weight:700;position:relative;z-index:3}
  .hubBig::before{content:"";position:absolute;top:0;left:-70%;width:45%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-18deg);animation:hubShine 3.4s ease-in-out infinite;z-index:2;pointer-events:none}
  .hubPlay{background:linear-gradient(165deg,#8ef0ac,#3fc47b);color:#123322}
  .hubMake{background:linear-gradient(165deg,#bda2ff,#7a54f0);color:#fff}
  .hubMake::before{animation-delay:1.6s}
  .hubField{position:relative;height:60px;overflow:hidden}
  .hubFieldPlay{background:rgba(255,255,255,.18)}
  .hubFieldMake{background:rgba(255,255,255,.15)}
  .hubBrickRow{position:absolute;top:9px;left:0;right:0;display:flex;gap:4px;justify-content:center}
  .hubBrick{width:20px;height:10px;border-radius:3px;box-shadow:0 1px 0 rgba(0,0,0,.18)}
  .hubBall{position:absolute;left:50%;margin-left:-8px;width:15px;height:15px;border-radius:50%;background:#fff;border:2px solid #17331f;box-shadow:0 2px 4px rgba(0,0,0,.3);animation:hubBounce 1s cubic-bezier(.5,0,.5,1) infinite}
  .hubPaddle{position:absolute;left:50%;margin-left:-20px;bottom:6px;width:40px;height:7px;border-radius:6px;background:#123322;opacity:.5}
  @keyframes hubBounce{0%,100%{top:34px}50%{top:20px}}
  @keyframes hubShine{0%{left:-70%}60%,100%{left:130%}}
  .hubBlk{position:absolute;left:50%;margin-left:-16px;width:32px;height:11px;border-radius:3px;background:#fff;box-shadow:0 1px 0 rgba(0,0,0,.18)}
  .hubBlk1{bottom:8px;animation:hubBuild 2.1s ease-in-out infinite}
  .hubBlk2{bottom:22px;animation:hubBuild 2.1s ease-in-out infinite .35s}
  .hubBlk3{bottom:36px;animation:hubBuild 2.1s ease-in-out infinite .7s}
  @keyframes hubBuild{0%{transform:translateY(12px);opacity:0}18%{opacity:1}30%,78%{transform:translateY(0);opacity:1}94%,100%{transform:translateY(0);opacity:0}}
  .hubShelf{width:100%;max-width:600px;margin:16px auto 30px}
  .hubShelf .hh{font-weight:800;opacity:.85;margin:0 0 8px;padding:0 4px}
  /* ---- wizard progress ---- */
  .stepno{font-size:13px;color:#c7c3f2;font-weight:700;text-align:center;margin:2px 0 6px}
  .dots{display:flex;gap:8px;justify-content:center;align-items:center;margin:0 0 14px}
  .dot{width:9px;height:9px;border-radius:50%;background:#3a2c6e;transition:background .15s}
  .dot.on{background:#9b7bff;box-shadow:0 0 0 3px rgba(155,123,255,.25)}
  .dot.done{background:#7ee0a0}
</style>
<style id="no-longpress">/* Buildable: disable iOS long-press magnifier + Look Up/Translate popup app-wide; keep inputs selectable */

<body>
<div id="wrap"><canvas id="c" width="900" height="600"></canvas></div>

<!-- shared start screen mounts here -->
<div id="start"></div>

<div id="home" class="ov">
  <h1 style="margin-bottom:2px">Breaker</h1>
  <div class="sub">Smash the bricks. Make your own.</div>
  <div id="hubBody" style="width:100%;max-width:620px;display:flex;flex-direction:column;align-items:center;padding:0 14px"></div>
</div>

<div id="maker" class="ov">
  <h1 id="mkTitle">Make a level</h1>
  <div class="sub" id="mkSub">Build your own level, then share it.</div>
  <div class="tabs" id="mkSteps"></div>
  <div id="mkBody"></div>
  <div class="mkRowBtns" style="margin:14px 0 34px">
    <button class="btn small" id="mkBack">Back</button>
    <button class="btn small" id="mkNext">Next</button>
  </div>
</div>

<div id="toast" class="toast"></div>
<button id="backBtn" title="Back to menu">‹ Menu</button>
<button id="muteBtn">Sound: On</button>
<button id="helpBtn" title="How to play">?</button>

<script src="buildable-renders.js"></script>
<script src="buildable-audio.js"></script>
<script src="buildable-mechanics.js"></script>
<script src="buildable-startscreen.js"></script>
<script src="buildable-levelthumb.js"></script>
<script src="buildable-hud.js?v=3"></script>
<script src="buildable-gamenav.js?v=1"></script>
<script>
// ============================================================================
//  FIXED ENGINE — never regenerated. A game = this engine + GAME_CONFIG (data).
//  Paddle-and-ball brick breaker (Solo) + a 2-player Pong mode (pass-and-play).
//  Built to the Buildable game playbook (BUILDING-A-GAME.md):
//    - data-driven levels (recipes), always-clearable, headless QA-simmed
//    - shared engine libs: BR (draw) · BA (audio) · BM (FX/juice) · BS (start screen)
//    - QA hook exposed as window.BUILDABLE_GAME (BREAKER_GAME kept as an alias)
//  Breaker is the REFERENCE ADOPTION for BM (FX) and BS (start screen).
// ============================================================================
let W=900, H=600;   // logical play-area size; sized to fill the screen (portrait) below
const c=document.getElementById('c'), ctx=c.getContext('2d');
// --- size the play area to the screen as a tall/portrait layout ------------
// On a real phone/tablet we fill the viewport HEIGHT and cap the WIDTH so the
// field stays nice and tall. Headless/QA (no window size) keeps the reference
// 900x600 so the "always-winnable" sim is unchanged.
function fitSize(){
  var vw=(typeof window!=="undefined"&&window.innerWidth)?window.innerWidth:0;
  var vh=(typeof window!=="undefined"&&window.innerHeight)?window.innerHeight:0;
  if(!vw||!vh) return { w:900, h:600 };
  var h=vh, w=Math.min(vw, Math.round(vh*0.72));   // never wider than ~0.72 of the height
  w=Math.max(320, w);
  return { w:Math.round(w), h:Math.round(h) };
}
function applySize(){
  var s=fitSize(); W=s.w; H=s.h;
  if(c){ c.width=W; c.height=H; if(c.style){ c.style.width=W+"px"; c.style.height=H+"px"; } }
  PAD_Y=H-42;                       // keep the paddle pinned near the bottom
  if(typeof rebuildStars==="function") rebuildStars();
}
(function(){ var s=fitSize(); W=s.w; H=s.h;
  if(c){ c.width=W; c.height=H; if(c.style){ c.style.width=W+"px"; c.style.height=H+"px"; } } })();
let hud=null; function HUD(){ if(hud) return hud;
  if(typeof BuildableHUD==="undefined"||!BuildableHUD||!BuildableHUD.mount){   // headless/QA or load failure: no-op HUD so the engine never crashes
    return (hud={ set:function(){}, show:function(){}, hide:function(){}, destroy:function(){} }); }
  return (hud=BuildableHUD.mount(c)); }
const BR=(typeof window!=="undefined"&&window.BuildableRenders)||(typeof globalThis!=="undefined"&&globalThis.BuildableRenders);
const BA=(typeof window!=="undefined"&&window.BuildableAudio)||(typeof globalThis!=="undefined"&&globalThis.BuildableAudio);
const BM=(typeof window!=="undefined"&&window.BuildableMechanics)||(typeof globalThis!=="undefined"&&globalThis.BuildableMechanics);
const BS=(typeof window!=="undefined"&&window.BuildableStartScreen)||(typeof globalThis!=="undefined"&&globalThis.BuildableStartScreen);
function sfx(n,o){ if(BA)BA.sfx(n,o); }
function mkImg(src){ const im=(typeof Image!=="undefined")?new Image():{}; try{ im.crossOrigin="anonymous"; }catch(e){} if(src&&"src" in im) im.src=src; return im; }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

// shared FX bag (BM). Fallback object keeps the engine working if BM is missing.
let fx = BM ? BM.makeFx() : { parts:[], pops:[], shake:0, flash:0, flashCol:"#fff" };
function resetFx(){ fx = BM ? BM.makeFx() : { parts:[], pops:[], shake:0, flash:0, flashCol:"#fff" }; anims=[]; fireTrail=[]; }

// ---- sprite FX: animated explosion flipbooks + a living fireball (Kenney CC0 /fx) ----
const FXI={};
function fxImg(n){ if(!FXI[n]){ const im=new Image(); try{im.crossOrigin="anonymous";}catch(e){} im.src="/fx/"+n+".png?v=1"; FXI[n]=im; } return FXI[n]; }
const EXPLODE=[]; for(let i=0;i<9;i++) EXPLODE.push(fxImg("explode"+i));
const FIREPUFF=[fxImg("fire1"),fxImg("fire2")];
function imReady(im){ return im && (im.complete||im.width) && (im.naturalWidth||im.width); }
let anims=[];              // {x,y,size,born,dur,rot}
let fireTrail=[];          // {x,y,born} — the fireball's glowing tail
function resetSpriteFx(){ anims=[]; fireTrail=[]; }
function spawnBoom(x,y,size){ anims.push({x,y,size,born:Date.now(),dur:size>90?560:430,rot:Math.random()*6.283}); }
function drawAnims(){ const now=Date.now();
  // fireball tail first (under the booms), oldest -> newest
  for(let i=fireTrail.length-1;i>=0;i--){ const p=fireTrail[i], age=now-p.born; if(age>300){ fireTrail.splice(i,1); continue; }
    const a=1-age/300, im=FIREPUFF[i%2]; if(!imReady(im))continue; const s=BALL_R*(2.2+a*1.4);
    ctx.save(); ctx.globalCompositeOperation="lighter"; ctx.globalAlpha=a*0.5; ctx.drawImage(im,p.x-s/2,p.y-s/2,s,s); ctx.restore(); }
  for(let i=anims.length-1;i>=0;i--){ const a=anims[i], pr=(now-a.born)/a.dur; if(pr>=1){ anims.splice(i,1); continue; }
    const fi=Math.min(EXPLODE.length-1, Math.floor(pr*EXPLODE.length)), im=EXPLODE[fi]; if(!imReady(im))continue;
    // solid draw (not additive) so the blast reads on light backdrops too (meadow/candy)
    ctx.save(); ctx.globalAlpha=pr<0.7?1:(1-(pr-0.7)/0.3);
    ctx.translate(a.x,a.y); ctx.rotate(a.rot); ctx.drawImage(im,-a.size/2,-a.size/2,a.size,a.size); ctx.restore(); }
}
// upgrade every particle burst to soft Kenney sprites instead of flat dots
if(BM&&BM.useTextures){ BM.useTextures({ glow:"/fx/circle_05.png", spark:"/fx/spark_01.png", star:"/fx/star_01.png", smoke:"/fx/smoke_01.png" }); }

// ---- data: the game recipe (safe to tweak freely; no code changes needed) ----
const GAME_CONFIG = window.GAME_CONFIG || {
  name: "Buildable Breaker",
  // each level = a layout recipe (pattern + how tough + ball speed). Always clearable.
  // theme = a full themed art pack (background + brick sprite sheet + ball + paddle).
  // Levels cycle jungle -> space -> ocean so the whole adventure looks hand-painted.
  levels: [
    { name:"Jungle Ruins",  cols:8,  rows:3, pattern:"full",    tough:0.0,  speed:4.2, theme:"jungle" },
    { name:"Star Pyramid",  cols:9,  rows:5, pattern:"pyramid", tough:0.1,  speed:4.6, theme:"space"  },
    { name:"Coral Castle",  cols:10, rows:5, pattern:"checker", tough:0.2,  speed:5.0, theme:"ocean"  },
    { name:"Vine Gaps",     cols:10, rows:6, pattern:"gaps",    tough:0.3,  speed:5.3, theme:"jungle" },
    { name:"Comet Towers",  cols:10, rows:6, pattern:"columns", tough:0.3,  speed:5.5, theme:"space"  },
    { name:"Reef Walls",    cols:11, rows:7, pattern:"frame",   tough:0.35, speed:5.6, theme:"ocean"  },
    { name:"Temple Drop",   cols:11, rows:7, pattern:"diamond", tough:0.4,  speed:5.8, theme:"jungle" },
    { name:"Galaxy Boss",   cols:12, rows:8, pattern:"full",    tough:0.55, speed:6.0, theme:"space"  },
  ],
  brickColors: ["#ff7aa8","#ffb04d","#ffd86b","#7ee0a0","#62d0ff","#9b7bff","#ff8fce"],
};
function brickColorFor(i){ const c=GAME_CONFIG.brickColors; return c[i%c.length]; }

// ---- look options kids can pick (the "Make It Mine" screen) ----
const BACKDROPS = [
  // real painted "worlds" (shared chess-art scenes) — rich art that contrasts the
  // bright pastel bricks. "meadow" keeps its id (saved prefs) but now shows a jungle.
  { id:"meadow", name:"Jungle",  img:"chess-art/jungle_bg.jpg", c1:"#bff0d8", c2:"#2f6d3a" },
  { id:"ocean",  name:"Ocean",   img:"chess-art/ocean_bg.jpg",  c1:"#a8e6ff", c2:"#2a6f96" },
  { id:"space",  name:"Space",   img:"chess-art/space_bg.jpg",  c1:"#1a1546", c2:"#0a1030" },
  { id:"castle", name:"Castle",  img:"chess-art/castle_bg.jpg", c1:"#e6d6ff", c2:"#6a4ad6" },
  { id:"desert", name:"Desert",  img:"chess-art/desert_bg.jpg", c1:"#ffe6b0", c2:"#c8783f" },
  { id:"candy",  name:"Candy",   img:"chess-art/candy_bg.jpg",  c1:"#ffd6ec", c2:"#ff9ec4" },
];
// cost = total stars needed to unlock (0 = free from the start)
const BALLS = [
  { id:"glow",    name:"Glow Ball", col:"#ffffff", glow:"#9b7bff", cost:0 },
  { id:"star",    name:"Star",      col:"#ffd86b", glow:"#ffb04d", star:true, cost:0 },
  { id:"comet",   name:"Comet",     col:"#62d0ff", glow:"#62d0ff", cost:3 },
  { id:"berry",   name:"Berry",     col:"#ff7aa8", glow:"#ff7aa8", cost:8 },
  { id:"rainbow", name:"Rainbow",   col:"#ff7aa8", glow:"#ffffff", rainbow:true, cost:16 },
  { id:"flame",   name:"Flame",     col:"#ff8a3d", glow:"#ff5a2c", flame:true,   cost:24 },
];
const PADDLES = [
  { col:"#9b7bff", cost:0 }, { col:"#62d0ff", cost:0 }, { col:"#7ee0a0", cost:0 },
  { col:"#ff7aa8", cost:4 }, { col:"#ffd86b", cost:10 }, { col:"#ff8fce", cost:16 },
];
const DIFFS = {
  easy:   { name:"Easy",   lives:5, padW:150, speedMul:0.85 },
  normal: { name:"Normal", lives:3, padW:120, speedMul:1.0  },

  // center) so balls that top out off-center get past it -> a winner reliably emerges.
  G.p1x=clamp(G.p1x+clamp(b.x-G.p1x,-6.5,6.5), G.padW/2, W-G.padW/2);
  G.p2x=clamp(G.p2x+clamp((W/2)-G.p2x,-2.2,2.2), G.padW/2, W-G.padW/2); }

// ---------- update (pure logic; headless-safe) ----------
function update(){
  if(state!=="play"||helpOpen||!G) return;
  if(G.mode==="two") updatePong(); else updateSolo();
  if(BM) BM.update(fx);
}

function updateSolo(){
  if(botMode) botThinkSolo();
  else { const ps=10; if(held.arL||held.aK)movePaddleTo(G.padX-ps); if(held.arR||held.dK)movePaddleTo(G.padX+ps); }
  if(!started) return;
  if(G.padGrowT>0){ G.padGrowT--; if(G.padGrowT===0){ const d=DIFFS[PREFS.difficulty]||DIFFS.normal; G.padW=d.padW; } }
  if(G.stickyT>0){ G.stickyT--; if(G.stickyT===0)G.sticky=false; }
  if(G.fireT>0)G.fireT--;
  // themed brick animation timers: hit-flash fades, shatter debris ages out
  for(const br of G.bricks){ if(br.flashT>0)br.flashT--; }
  if(G.shatters&&G.shatters.length){ for(const s of G.shatters)s.t++; G.shatters=G.shatters.filter(s=>s.t<20); }
  const slow=G.slowT>0?0.55:1; if(G.slowT>0)G.slowT--;
  const padL=G.padX-G.padW/2, padR=G.padX+G.padW/2;

  // laser power-up: paddle auto-zaps bricks straight up
  if(G.laserT>0){ G.laserT--; if(G.laserCd>0)G.laserCd--; if(G.laserCd<=0){ G.laserCd=14;
    G.lasers.push({x:padL+8,y:PAD_Y-12,vy:-9}); G.lasers.push({x:padR-8,y:PAD_Y-12,vy:-9}); } }   /* no per-laser beep; brick smash carries it */
  for(const lz of G.lasers){ lz.y+=lz.vy;
    for(const br of G.bricks){ if(!br.alive)continue; if(lz.x>=br.x&&lz.x<=br.x+br.w&&lz.y<=br.y+br.h&&lz.y>=br.y){ damageBrick(br,lz.x,lz.y,1); lz.dead=true; break; } } }
  G.lasers=G.lasers.filter(lz=>!lz.dead && lz.y>-10);

  for(const b of G.balls){
    if(b===G.stuck){ b.x=G.padX; b.y=PAD_Y-PAD_H/2-BALL_R; continue; }
    b.x+=b.vx*slow; b.y+=b.vy*slow;
    if(b.x<BALL_R){ b.x=BALL_R; b.vx=Math.abs(b.vx); sfx("select"); }
    if(b.x>W-BALL_R){ b.x=W-BALL_R; b.vx=-Math.abs(b.vx); sfx("select"); }
    if(b.y<BALL_R){ b.y=BALL_R; b.vy=Math.abs(b.vy); sfx("select"); }
    // paddle bounce
    if(b.vy>0 && b.y+BALL_R>=PAD_Y-PAD_H/2 && b.y-BALL_R<=PAD_Y+PAD_H/2 && b.x>=padL-BALL_R && b.x<=padR+BALL_R){
      const hit=clamp((b.x-G.padX)/(G.padW/2),-1,1); let ang=-Math.PI/2+hit*1.0+(Math.random()*0.10-0.05);
      ang=clamp(ang,-Math.PI/2-1.15,-Math.PI/2+1.15); const sp=G.speed;
      b.vx=Math.cos(ang)*sp; b.vy=Math.sin(ang)*sp; b.y=PAD_Y-PAD_H/2-BALL_R;
      const minVx=sp*0.22; if(Math.abs(b.vx)<minVx){ b.vx=(b.vx<0?-1:1)*minVx; b.vy=-Math.sqrt(Math.max(1,sp*sp-b.vx*b.vx)); }
      if(G.sticky){ G.stuck=b; } sfx("shoot");
    }
    hitBricks(b);
  }
  G.balls=G.balls.filter(b=> b===G.stuck || b.y<H+30);
  if(G.balls.length===0 && !G.stuck){ loseLife(); }

  for(const cap of G.caps){ cap.t=(cap.t||0)+1;
    cap.vy=Math.min(3.7,(cap.vy||2.0)+0.02); cap.y+=cap.vy;                                  // gently speeds up as it drops
    if(cap.x0==null)cap.x0=cap.x; cap.x=clamp(cap.x0+Math.sin(cap.t*0.13)*10,16,W-16);        // playful side-to-side wobble
    if(BM && cap.t%2===0) BM.burst(fx.parts,cap.x,cap.y-9,cap.col,1,{spd:[10,45],life:[0.25,0.5],r:3});  // sparkle trail
    if(cap.y>PAD_Y-PAD_H/2-10 && cap.y<PAD_Y+PAD_H && cap.x>padL-12 && cap.x<padR+12){ cap.got=true; const p=POWERS[cap.id];
      if(p){ p.apply(G); sfx("levelup"); if(BM){ BM.explode(fx,cap.x,cap.y,cap.col,{n:22,pop:p.name,popCol:"#fff",shake:0.24,flash:0.16}); BM.burst(fx.parts,cap.x,cap.y,"#ffffff",10,{tex:"star",additive:true,spd:[60,220],life:[0.3,0.6],r:6}); } } } }
  G.caps=G.caps.filter(cap=>!cap.got && cap.y<H+20);

  if(!G.bricks.some(b=>b.alive)){ winLevel(); }
}

// bomb brick: when destroyed, clears the bricks around it (chain-safe: alive is
// already false before we splash, so a bomb can trigger a neighbouring bomb once).
function bombSplash(cx,cy){ const R=78;
  spawnBoom(cx,cy,120);
  if(BM){ BM.explode(fx,cx,cy,"#ff6b6b",{n:20,pop:"BOOM",popCol:"#fff",shake:0.4,flash:0.14,sfx:()=>sfx("boom")}); }
  for(const nb of G.bricks){ if(!nb.alive)continue;
    const nx=nb.x+nb.w/2, ny=nb.y+nb.h/2; if((nx-cx)*(nx-cx)+(ny-cy)*(ny-cy) <= R*R){ damageBrick(nb,nx,ny,99); } }
}
// damage a brick (used by ball and laser); spawns juice + capsule on destroy
function damageBrick(br,hx,hy,dmg){ br.hp-=dmg; const cx=br.x+br.w/2, cy=br.y+br.h/2;
  if(br.hp<=0){ br.alive=false;
    // themed destroy: a flash->shatter flipbook plays where the brick was
    if(G.shatters && activeTheme()){ G.shatters.push({ x:br.x, y:br.y, w:br.w, h:br.h, variant:br.variant||0, t:0 }); }
    const bonus = br.type==="candy" ? 40 : 10; G.score+=bonus;
    if(br.maxHp>=2||br.power||br.type==="candy"||br.type==="star") spawnBoom(cx,cy,Math.max(br.w,br.h)*1.6);
    if(BM){ if(br.maxHp>=2||br.power||br.type==="candy") BM.explode(fx,cx,cy,br.col,{n:14,pop:"+"+bonus,popCol:"#fff",shake:0.2,flash:0.08,sfx:()=>sfx("boom")});
            else { BM.burst(fx.parts,cx,cy,br.col,7); BM.pop(fx.pops,cx,cy,"+"+bonus,"#ffffff"); sfx("coin",{tier:1}); } }
    else sfx("coin",{tier:br.maxHp>=2?2:1});
    if(br.power){ G.caps.push({x:cx,y:cy,id:br.power,col:(POWERS[br.power]||{}).col||"#fff",got:false}); }
    if(br.type==="bomb"){ bombSplash(cx,cy); }
    return true;
  } else { br.flashT=7; if(BM)BM.burst(fx.parts,cx,cy,br.col,3); sfx("coin",{tier:1}); return false; }
}
// ball vs bricks. fireball plows through (no bounce, destroys what it touches).
function hitBricks(b){ const fire=G.fireT>0;
  for(const br of G.bricks){ if(!br.alive)continue;
    if(b.x+BALL_R<br.x || b.x-BALL_R>br.x+br.w || b.y+BALL_R<br.y || b.y-BALL_R>br.y+br.h) continue;
    if(fire){ damageBrick(br, b.x, b.y, 99); continue; }   // smash through, keep going
    const ox=Math.min(b.x+BALL_R-br.x, br.x+br.w-(b.x-BALL_R)), oy=Math.min(b.y+BALL_R-br.y, br.y+br.h-(b.y-BALL_R));
    if(ox<oy){ b.vx=-b.vx; b.x+=(b.x<br.x+br.w/2?-ox:ox); } else { b.vy=-b.vy; b.y+=(b.y<br.y+br.h/2?-oy:oy); }
    damageBrick(br, b.x, b.y, 1);
    break;
  }
}
function loseLife(){ G.lives--; G.lostLives++; if(BM){ BM.shake(fx,0.5); BM.flash(fx,"#ff4444",0.3); } sfx("hurt");
  if(G.lives<=0){ state="lose"; sfx("lose"); return; }
  G.balls=[ newBall(G.padX, PAD_Y-BALL_R-PAD_H/2, -Math.PI/2, G.speed) ]; G.onPaddle=true; G.stuck=null; started=false; }
function winLevel(){ state="win"; sfx("win");
  if(G&&G.custom){ if(CUSTOM)CUSTOM.cleared=true;
    if(BM){ for(let i=0;i<3;i++) BM.burst(fx.parts, W*(0.3+0.2*i), H*0.4, GAME_CONFIG.brickColors[i*2], 22, {gravity:18,spd:[2,6],life:[0.7,1.4]}); BM.flash(fx,"#ffffff",0.2); }
    return; }
  PREFS.totalWins++;
  const earned = G.lostLives<=0?3 : (G.lostLives===1?2:1);
  PREFS.stars[level]=Math.max(PREFS.stars[level]||0, earned);
  const u=Math.min(GAME_CONFIG.levels.length-1, level+1); if(u>(PREFS.unlocked||0)){ PREFS.unlocked=u; }
  PREFS.bestLevel=Math.max(PREFS.bestLevel||0, level+1); savePrefs();
  if(BM){ for(let i=0;i<3;i++) BM.burst(fx.parts, W*(0.3+0.2*i), H*0.4, GAME_CONFIG.brickColors[i*2], 22, {gravity:18,spd:[2,6],life:[0.7,1.4]}); BM.flash(fx,"#ffffff",0.2); } }

function updatePong(){
  const b=G.ball; if(!b)return;
  if(botMode) botThinkPong();
  else { const ps=11; if(held.arL)G.p1x=clamp(G.p1x-ps,G.padW/2,W-G.padW/2); if(held.arR)G.p1x=clamp(G.p1x+ps,G.padW/2,W-G.padW/2);
         if(held.aK)G.p2x=clamp(G.p2x-ps,G.padW/2,W-G.padW/2); if(held.dK)G.p2x=clamp(G.p2x+ps,G.padW/2,W-G.padW/2); }
  if(G.serveDelay>0){ G.serveDelay--; b.x=W/2; b.y=H/2; return; }
  b.x+=b.vx; b.y+=b.vy;
  if(b.x<BALL_R){ b.x=BALL_R; b.vx=Math.abs(b.vx); if(BM)BM.burst(fx.parts,b.x,b.y,"#fff",4); sfx("select"); }
  if(b.x>W-BALL_R){ b.x=W-BALL_R; b.vx=-Math.abs(b.vx); if(BM)BM.burst(fx.parts,b.x,b.y,"#fff",4); sfx("select"); }
  pongPaddle(b, G.p1x, PAD_Y, +1);
  pongPaddle(b, G.p2x, TOP_Y, -1);
  if(b.y>H+12){ G.s2++; pongScore(2); }
  else if(b.y<-12){ G.s1++; pongScore(1); }
}
function pongPaddle(b,px,py,dir){ const padL=px-G.padW/2, padR=px+G.padW/2;
  const toward = dir>0 ? b.vy>0 : b.vy<0;
  const near = b.y+BALL_R>=py-PAD_H/2 && b.y-BALL_R<=py+PAD_H/2;
  if(toward && near && b.x>=padL-BALL_R && b.x<=padR+BALL_R){
    const hit=clamp((b.x-px)/(G.padW/2),-1,1); const sp=G.speed;
    let ang = dir>0 ? (-Math.PI/2 + hit*1.0) : (Math.PI/2 - hit*1.0);
    ang += (Math.random()*0.10-0.05);
    b.vx=Math.cos(ang)*sp; b.vy=Math.sin(ang)*sp;
    // never perfectly vertical (so the ball wanders) and never too flat (so a rally ends)
    if(Math.abs(b.vx)<sp*0.20)b.vx=(b.vx<0?-1:1||1)*sp*0.20;
    if(Math.abs(b.vy)<sp*0.45)b.vy=(dir>0?-1:1)*sp*0.45;
    const m=Math.hypot(b.vx,b.vy)||1; b.vx=b.vx/m*sp; b.vy=b.vy/m*sp;
    b.y = dir>0 ? py-PAD_H/2-BALL_R : py+PAD_H/2+BALL_R;
    if(BM)BM.burst(fx.parts,b.x,b.y,dir>0?PREFS.paddle:"#62d0ff",6); sfx("shoot");
  }
}
function pongScore(scorer){ if(BM){ BM.shake(fx,0.5); BM.flash(fx,"#ffffff",0.25); BM.explode(fx, G.ball.x, scorer===2?H-30:30, "#ffd86b", {n:18,pop:"Point!",popCol:"#fff",shake:0,flash:0}); } sfx("point");
  if(G.s1>=G.target){ G.winner=1; state="win"; sfx("win"); return; }
  if(G.s2>=G.target){ G.winner=2; state="win"; sfx("win"); return; }
  pongServe(scorer===1);   // serve toward the player who just got scored on
}

function advanceAfterEnd(){
  if(G && G.custom){ const won=(state==="win"); showMaker(won?"share":"build"); if(!won)toast("So close! Tweak it and try again."); return; }
  if(G && G.mode==="two"){ showMenu(); return; }
  if(state==="win"){ if(level<GAME_CONFIG.levels.length-1){ startLevel(level+1, G.lives); } else { showMenu(); toast("You beat every level!"); } }
  else { showMenu(); }
}

// ---------- draw ----------
function rrect(x,y,w,h,r){ BR.rrect(ctx,x,y,w,h,r); }
function drawBackdrop(){ const t=Date.now()/1000;
  // themed campaign level: full-scene hand-painted background (falls back to a
  // theme tint until the image loads so we never flash the wrong world)
  const th0=activeTheme();
  if(th0){ const A=themeAssets(th0);
    if(A && imReady(A.bg)){ BR.bgImage(ctx,A.bg,W,H);
      const v=ctx.createRadialGradient(W/2,H*0.42,Math.min(W,H)*0.35,W/2,H/2,Math.max(W,H)*0.72); v.addColorStop(0,"rgba(0,0,0,0)"); v.addColorStop(1,"rgba(0,0,0,0.26)"); ctx.fillStyle=v; ctx.fillRect(0,0,W,H);
      const sc=ctx.createLinearGradient(0,0,0,H); sc.addColorStop(0,"rgba(6,10,26,0.34)"); sc.addColorStop(0.55,"rgba(6,10,26,0.10)"); sc.addColorStop(1,"rgba(6,10,26,0.18)"); ctx.fillStyle=sc; ctx.fillRect(0,0,W,H); return; }
    ctx.fillStyle=(A&&A.def.fall)||"#122"; ctx.fillRect(0,0,W,H); return; }
  const img=bgImage();
  if(img && (img.complete||img.width) && (img.naturalWidth||img.width)){ BR.bgImage(ctx,img,W,H);
    const v=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.4,W/2,H/2,Math.max(W,H)*0.72); v.addColorStop(0,"rgba(0,0,0,0)"); v.addColorStop(1,"rgba(0,0,0,0.32)"); ctx.fillStyle=v; ctx.fillRect(0,0,W,H);
    // gentle darkening scrim (strongest at the top, where the bricks are) so the
    // bright bricks / paddle / ball always pop on any world — even bright candy.
    const sc=ctx.createLinearGradient(0,0,0,H); sc.addColorStop(0,"rgba(6,10,26,0.46)"); sc.addColorStop(0.55,"rgba(6,10,26,0.16)"); sc.addColorStop(1,"rgba(6,10,26,0.30)"); ctx.fillStyle=sc; ctx.fillRect(0,0,W,H);
  } else { const d=backdropDef(), g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,d.c1); g.addColorStop(1,d.c2); ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    for(const st of stars){ const a=0.25*Math.abs(Math.sin(t*st.sp+st.ph)); ctx.fillStyle="rgba(255,255,255,"+a.toFixed(2)+")"; ctx.beginPath();ctx.arc(st.x,st.y,st.s,0,7);ctx.fill(); } }
}
function drawBall(b,fire){
  // themed campaign ball art (unless it's the fireball power-up, which keeps its flame look)
  if(!fire){ const th0=activeTheme(); if(th0){ const A=themeAssets(th0); if(A && drawThemedBall(b,A)) return; } }
  const sk=BALLS.find(x=>x.id===PREFS.ball)||BALLS[0];
  const useFlame = fire || sk.flame;
  const outR = useFlame?BALL_R+2:BALL_R;
  ctx.save(); ctx.shadowColor=useFlame?"#ff8a3d":(sk.rainbow?"#fff":sk.glow); ctx.shadowBlur=useFlame?22:16;
  if(useFlame){ const now=Date.now();
    // animated flame body: two orange fire puffs that pulse + counter-rotate = "alive"
    const im=FIREPUFF[Math.floor(now/90)%2];
    if(imReady(im)){ const s=BALL_R*(4.4+Math.sin(now/110)*0.5); ctx.save(); ctx.globalCompositeOperation="lighter"; ctx.globalAlpha=0.9; ctx.translate(b.x,b.y); ctx.rotate(now/260); ctx.drawImage(im,-s/2,-s/2,s,s); ctx.rotate(-now/130); ctx.globalAlpha=0.7; ctx.drawImage(im,-s*0.72/2,-s*0.72/2,s*0.72,s*0.72); ctx.restore(); }
    // solid molten core
    const g=ctx.createRadialGradient(b.x,b.y,1,b.x,b.y,BALL_R+3); g.addColorStop(0,"#fff"); g.addColorStop(0.5,"#ffd86b"); g.addColorStop(1,"#ff5a2c"); ctx.fillStyle=g; ctx.beginPath();ctx.arc(b.x,b.y,BALL_R+1,0,7);ctx.fill(); }
  else if(sk.rainbow){ const hue=(Date.now()/12)%360, col="hsl("+hue.toFixed(0)+",90%,62%)"; const g=ctx.createRadialGradient(b.x-3,b.y-3,1,b.x,b.y,BALL_R); g.addColorStop(0,"#fff"); g.addColorStop(1,col); ctx.fillStyle=g; ctx.beginPath();ctx.arc(b.x,b.y,BALL_R,0,7);ctx.fill(); }
  else if(sk.star){ BR.sparkle(ctx,b.x,b.y,BALL_R+2,Date.now()/200); }
  else { const g=ctx.createRadialGradient(b.x-3,b.y-3,1,b.x,b.y,BALL_R); g.addColorStop(0,"#fff"); g.addColorStop(1,sk.col); ctx.fillStyle=g; ctx.beginPath();ctx.arc(b.x,b.y,BALL_R,0,7);ctx.fill(); }
  // dark outline so the ball stays visible on light backgrounds (candy, etc.)
  ctx.shadowBlur=0; ctx.lineWidth=2; ctx.strokeStyle="rgba(20,22,45,.55)"; ctx.beginPath(); ctx.arc(b.x,b.y,outR,0,7); ctx.stroke();
  ctx.restore(); }
function drawPaddleAt(px,py,col){

  { const th0=activeTheme(); if(th0){ const A=themeAssets(th0); if(A && drawThemedPaddle(px,py,A)) return; } }

function shade(hex,amt){ const n=parseInt(hex.slice(1),16); let r=(n>>16)+amt,g=((n>>8)&255)+amt,b=(n&255)+amt; r=clamp(r,0,255);g=clamp(g,0,255);b=clamp(b,0,255); return "#"+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1); }
function banner(t,s){ ctx.fillStyle="rgba(10,12,40,.66)";ctx.fillRect(0,0,W,H); ctx.textAlign="center"; ctx.fillStyle="#fff";ctx.font="bold 48px Fredoka,sans-serif";ctx.fillText(t,W/2,H/2-6); ctx.font="22px Fredoka,sans-serif";ctx.fillText(s,W/2,H/2+36); }

  const pr=32+Math.sin(tt*3)*3, ay=H-72; ctx.fillStyle="rgba(155,123,255,.25)"; ctx.beginPath();ctx.arc(W/2,ay,pr+10,0,7);ctx.fill();

function draw(){ if(!G){ return; }
  drawBackdrop();
  if(G.mode!=="two"){ // reserved top band: a soft fade so the score bar reads as its own strip
    const gsc=ctx.createLinearGradient(0,0,0,HUD_STRIP);
    gsc.addColorStop(0,"rgba(6,8,18,0.38)"); gsc.addColorStop(1,"rgba(6,8,18,0)");
    ctx.fillStyle=gsc; ctx.fillRect(0,0,W,HUD_STRIP); }
  const sh = BM ? BM.shakeOffset(fx) : {x:0,y:0};
  ctx.save(); ctx.translate(sh.x, sh.y);
  if(G.mode==="two") drawPong(); else drawSolo();
  ctx.restore();
  if(BM) BM.draw(ctx, fx, { W, H, font:"800 23px Fredoka,sans-serif" });
  drawAnims();   // animated explosions + fireball tail (over gameplay, under banners)
  // overlays (drawn unshaken)
  if(state==="play" && (!started||helpOpen) && G.mode!=="two") drawTutorial();
  if(state==="play" && helpOpen && G.mode==="two") drawTutorial();
  if(state==="play" && G.mode==="two" && G.serveDelay>30 && G.s1===0 && G.s2===0 && !botMode && !helpOpen) drawTutorial();
  // finger keeps pointing at the paddle for a few seconds after the first launch
  // (follows the paddle, fades out) — no dark overlay so play isn't blocked.
  if(state==="play" && G.mode==="solo" && firstHintUntil && Date.now()<firstHintUntil){
    const rem=(firstHintUntil-Date.now())/3200;      // 1 -> 0
    ctx.save(); ctx.globalAlpha=Math.min(1, rem*2);  // solid, then fades over the last ~1.6s
    if(BR && BR.hand) BR.hand(ctx, G.padX, PAD_Y+4, 0.9);  // sits on the paddle, points up (fits above the bottom edge)
    ctx.restore();
  }
  if(state==="win" && G.custom){ banner("You beat it!", "Tap to share your level"); }
  else if(state==="win" && G.mode==="two"){ banner("Player "+G.winner+" wins!", "Tap for the menu"); }
  else if(state==="win"){ banner(level<GAME_CONFIG.levels.length-1?"Level Clear!":"You Win!", level<GAME_CONFIG.levels.length-1?"Next level unlocked - tap to go on":"Tap to finish"); drawEarnedStars(PREFS.stars[level]||0); }
  if(state==="lose"){ banner("Out of lives!","Tap to try again"); }
  if(hud){ hud[(state==="play" && G.mode!=="two") ? "show" : "hide"](); }
}

function drawThemedBrick(br,A){
  if(A.lib){ const p=A.lib, mat=p.materials[(br.variant||0)%p.materials.length], set=p.bricks[mat]; if(!set) return false;
    let st="intact"; if(br.flashT>0) st="hit"; else if(br.hp<br.maxHp) st="cracked";
    const im=set[st]||set.intact; if(!imReady(im)) return false;
    const ex=br.w*0.10, ey=br.h*0.62;
    if(br.flashT>0){ ctx.save(); ctx.shadowColor="#fff"; ctx.shadowBlur=14; }
    ctx.drawImage(im, br.x-ex/2, br.y-ey/2, br.w+ex, br.h+ey);

    if(br.power){ ctx.fillStyle="rgba(255,255,255,.95)"; ctx.beginPath();ctx.arc(br.x+br.w/2,br.y+4,2.6,0,7);ctx.fill(); }
    return true; }

  let f=0; if(br.flashT>0) f=1; else if(br.hp<br.maxHp) f=2;
  const ex=br.w*0.10, ey=br.h*0.62;   // a hair larger so the painted brick reads full-bleed
  if(br.flashT>0){ ctx.save(); ctx.shadowColor="#fff"; ctx.shadowBlur=14; }
  ctx.drawImage(img, f*cw, v*ch, cw, ch, br.x-ex/2, br.y-ey/2, br.w+ex, br.h+ey);
  if(br.flashT>0) ctx.restore();
  if(br.power){ ctx.fillStyle="rgba(255,255,255,.95)"; ctx.beginPath();ctx.arc(br.x+br.w/2,br.y+4,2.6,0,7);ctx.fill(); }
  return true; }
// destroy flipbook: brief flash frame, then the shatter debris expands + fades
function drawShatters(A){ if(!G.shatters||!G.shatters.length) return;
  if(A.lib){ const p=A.lib;
    for(const s of G.shatters){ const mat=p.materials[(s.variant||0)%p.materials.length], set=p.bricks[mat]||{}; const im=set.shattered||set.cracked; if(!imReady(im))continue;
      const q=Math.min(1,s.t/18), sc=1+q*0.4; ctx.save(); ctx.globalAlpha=Math.max(0,1-q); const dw=s.w*1.2*sc, dh=s.h*1.5*sc;
      ctx.drawImage(im, s.x+s.w/2-dw/2, s.y+s.h*0.5-dh/2, dw, dh); ctx.restore(); }
    return; }
  const sh=A.shatter, br=A.bricks; const scw=imReady(sh)?sh.naturalWidth/6:0, sch=imReady(sh)?sh.naturalHeight:0;

}
function drawThemedBall(b,A){

// each backdrop gives its bricks a matching drawn style (the always-on art layer)
function drawBrick(br){ const th0=activeTheme();
  if(th0){ const A=themeAssets(th0); if(A && drawThemedBrick(br,A)) return; }
  const x=br.x,y=br.y,w=br.w,h=br.h; ctx.fillStyle=br.col; rrect(x,y,w,h,6); ctx.fill();
  switch(backdropDef().id){
    case "space": // metal plate: top highlight, bottom shade, two rivets
      ctx.fillStyle="rgba(255,255,255,.22)"; rrect(x+3,y+3,w-6,h*0.32,4); ctx.fill();
      ctx.fillStyle="rgba(0,0,0,.22)";       rrect(x+3,y+h*0.62,w-6,h*0.28,4); ctx.fill();
      ctx.fillStyle="rgba(255,255,255,.55)"; ctx.beginPath();ctx.arc(x+8,y+h/2,1.5,0,7);ctx.arc(x+w-8,y+h/2,1.5,0,7);ctx.fill(); break;
    case "candy": // glossy candy: shine stripe + sprinkles
      ctx.fillStyle="rgba(255,255,255,.5)";  rrect(x+4,y+3,w-8,4,2); ctx.fill();
      ctx.fillStyle="rgba(255,255,255,.65)"; for(let i=0;i<3;i++){ ctx.beginPath();ctx.arc(x+w*(0.3+0.2*i),y+h*0.64,1.3,0,7);ctx.fill(); } break;
    case "ocean": { // bubble/jelly: vertical sheen + highlight blob
      const g=ctx.createLinearGradient(x,y,x,y+h); g.addColorStop(0,"rgba(255,255,255,.4)"); g.addColorStop(1,"rgba(255,255,255,0)"); ctx.fillStyle=g; rrect(x+2,y+2,w-4,h-4,5); ctx.fill();
      ctx.fillStyle="rgba(255,255,255,.7)"; ctx.beginPath();ctx.ellipse(x+11,y+6,5,2.4,0,0,7);ctx.fill(); break; }
    case "castle": // stone block: bevel lines + a mortar seam
      ctx.strokeStyle="rgba(255,255,255,.28)"; ctx.lineWidth=1.4; ctx.beginPath();ctx.moveTo(x+4,y+3);ctx.lineTo(x+w-4,y+3);ctx.stroke();
      ctx.strokeStyle="rgba(0,0,0,.28)";       ctx.beginPath();ctx.moveTo(x+4,y+h-3);ctx.lineTo(x+w-4,y+h-3);ctx.stroke();
      ctx.fillStyle="rgba(0,0,0,.14)"; rrect(x+w/2-1,y+5,2,h-10,1); ctx.fill(); break;
    case "desert": { // sandy: warm top sheen to darker base
      const g=ctx.createLinearGradient(x,y,x,y+h); g.addColorStop(0,"rgba(255,255,255,.28)"); g.addColorStop(1,"rgba(120,80,20,.20)"); ctx.fillStyle=g; rrect(x+2,y+2,w-4,h-4,5); ctx.fill(); break; }
    default: // meadow: soft glossy top
      ctx.fillStyle="rgba(255,255,255,.28)"; rrect(x+4,y+3,w-8,4,2); ctx.fill();
  }
  if(br.maxHp>=2){ // show remaining toughness as pips
    for(let i=0;i<br.maxHp;i++){ ctx.fillStyle = i<br.hp ? "rgba(255,255,255,.7)" : "rgba(0,0,0,.30)"; ctx.beginPath();ctx.arc(x+8+i*8,y+h-5,2,0,7);ctx.fill(); } }
  // type accents (for kid-built levels) — a quick visual tell for each brick kind
  if(br.type==="bomb"){ ctx.fillStyle="rgba(0,0,0,.55)"; ctx.beginPath();ctx.arc(x+w/2,y+h/2,4.2,0,7);ctx.fill(); ctx.strokeStyle="#ffd86b"; ctx.lineWidth=1.4; ctx.beginPath();ctx.moveTo(x+w/2,y+h/2-4);ctx.lineTo(x+w/2+4,y+h/2-8);ctx.stroke(); }
  else if(br.type==="star"){ ctx.fillStyle="#fff8d0"; star5s(ctx, x+w/2, y+h/2, 5); }
  else if(br.type==="candy"){ ctx.fillStyle="rgba(255,255,255,.85)"; for(let i=0;i<3;i++){ ctx.beginPath();ctx.arc(x+w*(0.3+0.2*i),y+h*0.5,1.4,0,7);ctx.fill(); } }
  else if(br.type==="wood"){ ctx.strokeStyle="rgba(90,50,10,.35)"; ctx.lineWidth=1; ctx.beginPath();ctx.moveTo(x+5,y+h*0.4);ctx.bezierCurveTo(x+w*0.4,y+h*0.3,x+w*0.6,y+h*0.55,x+w-5,y+h*0.42);ctx.stroke(); }
  else if(br.type==="ice"){ ctx.fillStyle="rgba(255,255,255,.55)"; rrect(x+4,y+3,w*0.4,3,2); ctx.fill(); }
  if(br.power){ ctx.fillStyle="rgba(255,255,255,.9)"; ctx.beginPath();ctx.arc(x+w/2,y+6,2.6,0,7);ctx.fill(); }

// tiny filled 5-point star used as a brick accent
function star5s(g,cx,cy,r){ g.beginPath();

  g.closePath(); g.fill();
}
function drawSolo(){

  for(const lz of G.lasers){ ctx.strokeStyle="#ff5da2"; ctx.lineWidth=3; ctx.shadowColor="#ff5da2"; ctx.shadowBlur=8; ctx.beginPath();ctx.moveTo(lz.x,lz.y);ctx.lineTo(lz.x,lz.y+14);ctx.stroke(); ctx.shadowBlur=0; }
  for(const cap of G.caps){ const pulse=1+Math.sin(Date.now()/1000*6+(cap.t||0)*0.3)*0.14;
    ctx.save(); ctx.translate(cap.x,cap.y);
    ctx.shadowColor=cap.col; ctx.shadowBlur=20;

    ctx.rotate((cap.t||0)*0.06); ctx.fillStyle="rgba(255,255,255,.92)";                                                      // rotating twinkle spikes
    for(let i=0;i<4;i++){ ctx.rotate(Math.PI/2); ctx.beginPath();ctx.moveTo(0,-17*pulse);ctx.lineTo(3.2,-9);ctx.lineTo(-3.2,-9);ctx.closePath();ctx.fill(); }
    ctx.rotate(-(cap.t||0)*0.06); ctx.shadowBlur=0;
    const gg=ctx.createRadialGradient(-3,-3,1,0,0,12); gg.addColorStop(0,"#fff"); gg.addColorStop(1,cap.col);                 // bright gem body
    ctx.fillStyle=gg; ctx.beginPath();ctx.arc(0,0,11,0,7);ctx.fill();

// ---- level preview thumbnails: draw the real brick layout so cards aren't blank ----
const _thumbCache={};
function _rr(g,x,y,w,h,r){ r=Math.min(r,w/2,h/2); g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
function levelThumbURL(l,i){
  const key=i+"_"+l.cols+"_"+l.rows+"_"+l.pattern;
  if(_thumbCache[key]) return _thumbCache[key];
  const CW=300, CH=140, cv=document.createElement("canvas"); cv.width=CW; cv.height=CH; const g=cv.getContext("2d");
  const base=brickColorFor(i);
  const grd=g.createLinearGradient(0,0,0,CH); grd.addColorStop(0,"#171433"); grd.addColorStop(1,shade(base,-96));
  g.fillStyle=grd; g.fillRect(0,0,CW,CH);
  const cols=l.cols||10, rows=Math.min(l.rows||6,7), cset=GAME_CONFIG.brickColors;
  const padX=14, padTop=14, gap=4;
  const bw=(CW-padX*2-gap*(cols-1))/cols;
  const bh=Math.min(15,(CH-padTop-30-gap*(rows-1))/rows);
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){ if(!inPattern(l.pattern,r,c,rows,cols)) continue;
    const x=padX+c*(bw+gap), y=padTop+r*(bh+gap);
    g.fillStyle=cset[r%cset.length]; _rr(g,x,y,bw,bh,3); g.fill();
    g.fillStyle="rgba(255,255,255,.22)"; g.fillRect(x+2,y+2,Math.max(2,bw-4),2); }
  g.fillStyle="#fff"; g.beginPath(); g.arc(CW/2,CH-32,6,0,Math.PI*2); g.fill();
  g.lineWidth=2; g.strokeStyle="rgba(0,0,0,.45)"; g.stroke();
  g.fillStyle="rgba(255,255,255,.82)"; _rr(g,CW/2-26,CH-16,52,7,4); g.fill();
  const url=cv.toDataURL("image/png"); _thumbCache[key]=url; return url;
}

function renderMaker(){ const steps=el("mkSteps"), body=el("mkBody"), sub=el("mkSub"), back=el("mkBack"), next=el("mkNext");

  steps.appendChild(dots);

function mkPaletteChip(box,lbl,sub,on,onClick){ const c=document.createElement("div"); c.className="mkChip"+(on?" on":"");

function renderMkBuild(body){
  const pal=document.createElement("div"); pal.className="mkPal";
  const SUBT={ ice:"1 hit", wood:"2 hits", metal:"3 hits", candy:"bonus", star:"power-up", bomb:"boom!" };
  for(const id of BRICK_TYPE_IDS){ const t=BRICK_TYPES[id];
    pal.appendChild(mkPaletteChip("background:"+t.col, t.name, SUBT[id], mkBrush===id, ()=>{ mkBrush=id; renderMaker(); })); }
  pal.appendChild(mkPaletteChip("background:repeating-linear-gradient(45deg,#3a2c6e,#3a2c6e 4px,#211a4d 4px,#211a4d 8px)","Eraser","", mkBrush==="eraser", ()=>{ mkBrush="eraser"; renderMaker(); }));
  body.appendChild(pal);
  const grid=document.createElement("div"); grid.className="mkGrid"; grid.style.gridTemplateColumns="repeat("+mkCols+",1fr)";
  for(let r=0;r<mkRows;r++)for(let c=0;c<mkCols;c++){ const cell=document.createElement("div"); cell.className="mkCell"; cell.dataset.r=r; cell.dataset.c=c; styleCell(cell); grid.appendChild(cell); }

// ---------- QA / picker hooks (standardized name; alias kept) ----------

  // solo headless harness: a perfect paddle clears a level
  sim:(idx, maxFrames)=>{ startLevel(idx,null); state="play"; botMode=true; started=true; let f=0; const cap=maxFrames||30000;
    while(state!=="win" && state!=="lose" && f<cap){ update(); f++; }
    return { level:idx, result:state, frames:f, livesLeft:G?G.lives:0, bricksLeft:G&&G.bricks?G.bricks.filter(b=>b.alive).length:0, stars:PREFS.stars[idx]||0 }; },
  // custom-level headless harness: a perfect paddle should clear a kid's board

    while(state!=="win" && state!=="lose" && f<cap){ update(); f++; }
    return { result:state, frames:f, livesLeft:G?G.lives:0, bricksLeft:G&&G.bricks?G.bricks.filter(b=>b.alive).length:0, flames:boardFlames(board,diffN||3) }; },
  makeTestBoard:(cols,rows,type)=>{ cols=cols||8; rows=rows||4; const cells=[]; for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){ if((r+c)%2===0)continue; cells.push({r,c,type:type||"ice"}); } return { name:"QA board", cols, rows, cells }; },
  // full adventure

    return { result:state, winner:G?G.winner:0, s1:G?G.s1:0, s2:G?G.s2:0, frames:f }; },
  // render debug hooks
  _begin:(i)=>{ startLevel(i||0,null); state="play"; botMode=true; started=true; },
  _beginPong:()=>{ startPong(); state="play"; botMode=true; started=true; },
  _step:(n)=>{ for(let i=0;i<(n||1);i++) update(); }, _draw:()=>{ try{ draw(); return "ok"; }catch(e){ return "ERR: "+(e&&e.message||e); } },
  _setPref:(k,v)=>{ PREFS[k]=v; }, _prefs:()=>PREFS, _cfg:()=>GAME_CONFIG,
};
window.BREAKER_GAME = window.BUILDABLE_GAME;   // back-compat alias
</script>
