<style>
  html,body{margin:0;height:100%;overflow:hidden;touch-action:none;font-family:'Fredoka',-apple-system,sans-serif;
    background:linear-gradient(#cfeaff 0%,#dff0d6 55%,#eef6dc 100%)}   /* the sky continues past the canvas, so a portrait phone never shows black bars */
  #wrap{position:fixed;inset:0;box-sizing:border-box;display:flex;align-items:safe center;justify-content:safe center;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  canvas{display:block;background:#cfeaff;max-width:100%;max-height:100%;image-rendering:auto}
  #hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(112px + env(safe-area-inset-bottom));max-width:min(92vw,520px);text-align:center;color:#fff;font-size:14px;font-weight:600;pointer-events:none;
    background:rgba(8,10,20,.55);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:8px 16px;backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
  @media (min-width:820px){ #hint{bottom:calc(18px + env(safe-area-inset-bottom))} }

  /* on-screen controls */
  #pad{position:fixed;left:18px;bottom:20px;display:flex;gap:14px;z-index:5}
  #actions{position:fixed;right:18px;bottom:20px;display:flex;gap:14px;align-items:flex-end;z-index:5}
  .ctl{width:74px;height:74px;border-radius:50%;background:rgba(20,30,50,.30);border:2px solid rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  .ctl:active{background:rgba(20,30,50,.55)}
  .ctl.small{width:58px;height:58px}
  .ctl.jump{width:94px;height:94px;background:rgba(59,191,115,.42);border-color:rgba(255,255,255,.75)}
  .ar{display:block;width:0;height:0}
  .arL{border-top:13px solid transparent;border-bottom:13px solid transparent;border-right:20px solid #fff}
  .arR{border-top:13px solid transparent;border-bottom:13px solid transparent;border-left:20px solid #fff}
  .arU{border-left:15px solid transparent;border-right:15px solid transparent;border-bottom:22px solid #fff}
  .arD{border-left:13px solid transparent;border-right:13px solid transparent;border-top:20px solid #fff}
  .bk-inshell #bHelp,.bk-inshell #bMute,.bk-inshell #bMusic{display:none}
  #bHelp{position:fixed;right:14px;top:150px;z-index:6;width:36px;height:36px;border-radius:50%;border:2px solid rgba(255,255,255,.6);background:rgba(20,30,50,.4);color:#fff;font:700 18px Fredoka,sans-serif;cursor:pointer}
  #bMute{position:fixed;right:14px;top:62px;z-index:6;width:36px;height:36px;border-radius:50%;border:2px solid rgba(255,255,255,.6);background:rgba(20,30,50,.4);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
  #bMute svg{width:20px;height:20px;display:block}
  #bMusic{position:fixed;right:14px;top:106px;z-index:6;width:36px;height:36px;border-radius:50%;border:2px solid rgba(255,255,255,.6);background:rgba(20,30,50,.4);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
  #bMusic svg{width:20px;height:20px;display:block}
  /* the shared start screen mounts INTO this; it brings its own look */
  #menu{position:fixed;inset:0;z-index:10}
  #menu[hidden]{display:none}
  /* the hero chooser: four big faces, no reading required */
  #heroPick{position:fixed;inset:0;z-index:12;display:flex;align-items:center;justify-content:center;background:rgba(8,10,20,.72);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
  #heroPick[hidden]{display:none}
  .hpCard{background:#1d1b36;border:1px solid rgba(255,255,255,.10);border-radius:24px;padding:22px;max-width:min(92vw,540px);box-shadow:0 24px 60px rgba(0,0,0,.5)}
  .hpTtl{color:#fff;font:700 22px Fredoka,sans-serif;text-align:center;margin-bottom:16px}
  .hpRow{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
  .hpBtn{width:112px;background:#131229;border:3px solid rgba(255,255,255,.10);border-radius:20px;padding:10px 6px 12px;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .hpBtn.on{border-color:#7CF6B0;background:#1a2b28}
  .hpFace{width:74px;height:74px;border-radius:50%;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .hpFace img{width:100%;height:100%;object-fit:contain;display:block}
  .hpName{color:#fff;font:700 15px Fredoka,sans-serif;text-align:center}
</style>
<style id="no-longpress">/* Buildable: disable iOS long-press magnifier + Look Up/Translate popup app-wide; keep inputs selectable */
html,body{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
input,textarea,select,[contenteditable]{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}

<body>
<div id="wrap"><canvas id="c" width="900" height="540"></canvas>
  <button id="bHelp">?</button>
  <button id="bMute" aria-label="Sound on/off"></button>
  <button id="bMusic" aria-label="Change song"></button>
  <div id="pad">
    <div id="dleft" class="ctl"><span class="ar arL"></span></div>
    <div id="dright" class="ctl"><span class="ar arR"></span></div>
  </div>
  <div id="actions">
    <div id="ddown" class="ctl small"><span class="ar arD"></span></div>
    <div id="djump" class="ctl jump"><span class="ar arU"></span></div>
  </div>
  <div id="menu"></div>
  <div id="heroPick" hidden><div class="hpCard"><div class="hpTtl">Who is playing?</div><div class="hpRow"></div></div></div>
<div id="hint">Move with the arrows · JUMP to hop · reach the flag</div>
<script src="buildable-wincard.js"></script>
<script src="buildable-startscreen.js"></script>
<script src="buildable-renders.js"></script>
<script src="buildable-audio.js"></script>
<script src="buildable-mechanics.js"></script>
<script src="buildable-feel.js"></script>
<script src="buildable-hud.js"></script>
<script src="buildable-gamenav.js"></script>
<script>
// ============================================================================
//  FIXED ENGINE — never regenerated. A game = this engine + GAME_CONFIG (data).
//  Levels are RECIPES (difficulty knobs); the engine builds each level from them
//  so gaps are always jumpable => a level can never be unclearable.
// ============================================================================
const GAME_CONFIG = window.GAME_CONFIG || {
  name: "Hop Heroes",
  artStyle: "watercolor", musicKey: "ocean",
  artBase: "https://www.buildablekids.com/api/game-art",
  libBase: "https://www.buildablekids.com/api/story-library",
  // HH4 — THE FIXED CAST. Not the kid's own generated hero: these four, always, so the
  // game has characters a child comes back to. All four already live in the shared
  // character library, so nothing new has to be drawn.
  cast: [
    { slug:"bunny",   name:"Bramble", colour:"#b9b2a8" },
    { slug:"fox",     name:"Pip",     colour:"#e07a3c" },
    { slug:"penguin", name:"Waddle",  colour:"#3a4a63" },
    { slug:"dragon",  name:"Ember",   colour:"#6cc36a" },
  ],
  // HH4 — FOUR WORLDS. Each level names its own world, so its art set, its sky and its
  // ground colours all come from the world rather than one global setting. Difficulty
  // climbs gently across the four; the boss lives on the last one only (a level that
  // does not say either way lets the engine decide, and it only says yes for the last).
  looks: {
    "enchanted-forest": { sky:["#bcdfff","#cfeaff","#dff0d6","#eef6dc"], ground:"#6b9b4a", groundTop:"#8fc46a", dirt:"#5a4332" },
    "snowy-village":    { sky:["#a9c8ee","#c8ddf5","#e2eef8","#f2f7fb"], ground:"#cfe0ea", groundTop:"#ffffff", dirt:"#6a6f7d" },
    "desert-oasis":     { sky:["#ffd9a0","#ffe7bd","#fdf0cf","#f7ecc9"], ground:"#c9a15a", groundTop:"#e3c078", dirt:"#8a6437" },
    "candy-land":       { sky:["#ffc7e6","#ffdcf0","#ffeaf6","#fff2f8"], ground:"#e569a8", groundTop:"#ff9bcb", dirt:"#8e4470" },
  },
  palette: { ground:"#6b9b4a", groundTop:"#8fc46a", dirt:"#5a4332", coin:"#ffd23f", obstacle:"#7a4a86", enemy:"#b8477e", flag:"#ffd23f", hud:"#ffffff" },
  levels: [
    { name:"Whispering Woods", world:"enchanted-forest", speed:3.2, length:230, gapChance:0.58, gapMax:2, obstacleChance:0.26, enemyChance:0.30, lowChance:0.20, coinChance:0.34, powerupChance:0.05, platformChance:0.5, starCount:3, movingPlatChance:0.75, vineChance:0.8, bossHp:3 },
    { name:"Frostpine Hollow", world:"snowy-village",    speed:3.4, length:230, gapChance:0.60, gapMax:2, obstacleChance:0.30, enemyChance:0.32, lowChance:0.20, coinChance:0.34, powerupChance:0.05, platformChance:0.5, starCount:3, movingPlatChance:0.80, vineChance:0.4, bossHp:3 },
    { name:"Sunbaked Dunes",   world:"desert-oasis",     speed:3.6, length:235, gapChance:0.62, gapMax:2, obstacleChance:0.32, enemyChance:0.34, lowChance:0.22, coinChance:0.34, powerupChance:0.05, platformChance:0.5, starCount:3, movingPlatChance:0.85, vineChance:0.3, bossHp:3 },
    { name:"Sugarplum Peaks",  world:"candy-land",       speed:3.8, length:240, gapChance:0.64, gapMax:2, obstacleChance:0.34, enemyChance:0.36, lowChance:0.22, coinChance:0.34, powerupChance:0.05, platformChance:0.5, starCount:3, movingPlatChance:0.90, vineChance:0.5, bossHp:4 },
  ],
  powerups: ["shield","magnet","spring","star"],   // the kid's chosen set; engine only spawns from here
};
const CAST = GAME_CONFIG.cast || [{ slug:"bunny", name:"Bramble", colour:"#b9b2a8" }];
const LIB_BASE = GAME_CONFIG.libBase || "https://www.buildablekids.com/api/story-library";
function heroUrl(slug){ return LIB_BASE+"?img=character:"+slug+"&style="+(GAME_CONFIG.artStyle||"watercolor")+"&emo=happy"; }

let W=900, VH=540; const H=540, TILE=60;       // H is the WORLD height and never moves (every platform y is baked from it).
                                               // W and VH are the VIEW: both follow the screen so the canvas always fills it.
const GROUND_Y = H-110;                        // top of the ground band
const GRAV=0.58, JUMP=-13.8, RUN_BASE=3.2; // physics
// --- HH1: Mario feel. A short run-up to a faster top speed, then coyote time and a
// jump buffer so a jump is never eaten by a frame. lv.speed stays the RECIPE speed
// (buildLevel sizes gaps from it), so a faster hero only ever makes a gap EASIER. ---
const TOP_MULT   = 1.55;   // real top speed = lv.speed * this
const ACC_GROUND = 0.30, ACC_AIR = 0.20;      // low accel => a run-up you can feel
const FRIC_GROUND= 0.86, FRIC_AIR = 0.965;    // momentum when you let go
const SKID_DECEL = 0.90;                      // per-frame bite when you push against your own momentum
const COYOTE_FRAMES = 6;                      // grace frames to jump after walking off a ledge
const BUFFER_FRAMES = 8;                      // a jump pressed this early still fires on landing
const SKID_MIN = 1.6;                         // speed you must be doing for a turn-around to count as a skid
const AIR_FRAMES = 2*Math.abs(JUMP)/GRAV;  // frames a TAPPED jump stays airborne
// Frames a HELD jump stays airborne. Holding the button softens gravity on the way up
// (GRAV*0.62), so a held jump hangs far longer than the tapped figure above — and the QA
// bot holds it on every single jump. buildLevel has to space hazards by THIS number, not
// the tapped one, or the perfect player lands straight on the next hazard.
const AIR_FRAMES_HELD = (()=>{ const aUp=GRAV*0.62, rise=JUMP*JUMP/(2*aUp);
  return Math.abs(JUMP)/aUp + Math.sqrt(2*rise/GRAV); })();
const SLIDE_FRAMES=34;
const POLE_SLIDE=48, POLE_FANFARE=78;      // HH3 flag pole: slide down, short fanfare, next level
const c=document.getElementById('c'), ctx=c.getContext('2d');
// ---------------------------------------------------------------------------
//  HH2 — fill the screen the way the other engines do. The world stays 540 tall
//  FOREVER (GROUND_Y and every platform y are baked at build time, so H must never
//  move); only the WIDTH grows, which just shows more of the level. A landscape
//  screen is therefore filled edge to edge with no stretching and no black box; a
//  portrait phone keeps the full 900 width and the page's sky gradient continues
//  past the canvas, so the letterbox reads as more sky rather than as bars.
// ---------------------------------------------------------------------------
function fitCanvas(){
  if(typeof window==="undefined" || !c || !ctx || !ctx.setTransform) return;
  const vw=window.innerWidth||0, vh=window.innerHeight||0;
  if(!vw || !vh) return;                                  // headless QA — keep the 900x540 defaults
  // Pick how much world WIDTH to show: a wide screen shows more of the level, a phone
  // shows less so everything is bigger. Then make the view exactly the screen's shape,
  // which on a tall screen simply means more SKY above the same 540-tall world.
  W  = Math.round(Math.max(560, Math.min(1600, H*(vw/vh))));
  VH = Math.max(H, Math.round(W*vh/vw));
  const scale=vw/W, dpr=Math.min(2, window.devicePixelRatio||1);
  c.width=Math.round(W*dpr); c.height=Math.round(VH*dpr);
  c.style.width=Math.round(W*scale)+"px"; c.style.height=Math.round(VH*scale)+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);                      // draw in logical W x VH units, sharp on retina
}
function skyPad(){ return VH-H; }                          // sky added ABOVE the world so the ground stays on the floor
try{ fitCanvas(); addEventListener('resize',fitCanvas); addEventListener('orientationchange',fitCanvas); }catch(e){}
// --- sound (Web Audio; resumes on first tap, so it works on iPad) ---
let AX=null, soundOn=true, musicOn=true;
function actx(){ if(!AX){ try{ const AC=window.AudioContext||window.webkitAudioContext; if(AC)AX=new AC(); }catch{} } if(AX&&AX.state==='suspended'){ try{AX.resume();}catch{} } return AX; }
function blip(f,dur,type,vol,glide){ const a=actx(); if(!a||!soundOn)return; try{ const o=a.createOscillator(),g=a.createGain(); o.type=type||'sine'; o.frequency.setValueAtTime(f,a.currentTime); if(glide)o.frequency.exponentialRampToValueAtTime(glide,a.currentTime+dur); g.gain.setValueAtTime(0.0001,a.currentTime); g.gain.exponentialRampToValueAtTime(vol||0.14,a.currentTime+0.01); g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+dur); o.connect(g);g.connect(a.destination); o.start(); o.stop(a.currentTime+dur+0.03);}catch{} }
// HH5 — the built-in synth is now the OFFLINE FALLBACK ONLY (GAME-FEEL law 6). Every
// sound the game actually makes goes out as a palette NAME through the shared Feel Kit,
// so a Buildable coin sounds like a Buildable coin here and in every other game. When
// the Kit is not loaded (headless QA, a cold offline page) these tones stand in.
const SFX={
  jump:()=>blip(420,0.16,'sine',0.12,760),
  land:()=>blip(190,0.07,'sine',0.06,120),
  coin:()=>blip(900,0.09,'square',0.09,1340),
  star:()=>{blip(880,0.12,'triangle',0.13,1320); setTimeout(()=>blip(1320,0.18,'triangle',0.13,1760),90);},
  power:()=>{blip(660,0.10,'triangle',0.12,990); setTimeout(()=>blip(990,0.14,'triangle',0.12,1320),80);},
  bounce:()=>blip(280,0.18,'sine',0.13,920),
  hurt:()=>blip(320,0.22,'sawtooth',0.12,120),
  win:()=>{[523,659,784,1047].forEach((f,i)=>setTimeout(()=>blip(f,0.2,'triangle',0.14),i*130));}
};
const FEEL=(typeof window!=="undefined" && window.BuildableFeel)||null;
const BM  =(typeof window!=="undefined" && window.BuildableMechanics)||null;
let fx = BM ? BM.makeFx() : { parts:[], pops:[], shake:0, flash:0, flashCol:"#fff", rings:[] };
try{ if(FEEL){ FEEL.setFx(fx); FEEL.configure({ accent:"#8fc46a", feel:{ pace:"normal", celebration:"big", haptics:"on" }, sfxBase:"/api/sfx?s=" }); } }catch(e){}
// name -> the shared palette. A name with no good match in the palette simply keeps its
// fallback tone rather than borrowing a sound that means something else.
const PALETTE={ jump:"select", coin:"coin", star:"levelup", power:"levelup", bounce:"shoot", hurt:"hurt", win:"win", land:null };
function S(name, opt){
  if(!soundOn) return;
  const pal=PALETTE[name];
  if(FEEL && pal){ try{ FEEL.sfx(pal, opt); return; }catch(e){} }
  if(SFX[name]) SFX[name]();
}
// world x,y -> where it is on screen right now, so a burst lands on the thing it came from
function sx_(wx){ return wx-camX; }
function sy_(wy){ return wy+skyPad()+camY; }
// --- background music: REAL ElevenLabs tracks (the chess music library), streamed + looped ---
const MUSIC_BASE = GAME_CONFIG.musicBase || "https://www.buildablekids.com/api/chess-music";
const MUSIC_LIB = [   // a small library kids can cycle through by ear (no emoji; names are for grown-ups)
  {key:"ocean",  name:"Dreamy"},
  {key:"space",  name:"Starlight"},
  {key:"castle", name:"Fairytale"},
  {key:"jungle", name:"Sunny"},
  {key:"candy",  name:"Music box"},
  {key:"desert", name:"Mellow"},
];
let musicIdx = Math.max(0, MUSIC_LIB.findIndex(m=>m.key===(GAME_CONFIG.musicKey||"ocean")));
if(musicIdx<0) musicIdx=0;
let musicToast=0;                                  // frames to show the current track name
const Music=(()=>{
  let el=null;
  function ensure(){ if(!el && typeof Audio!=='undefined'){ el=new Audio(); el.loop=true; el.volume=0.34; el.preload="auto"; try{ if(window.registerAudio) window.registerAudio(el); }catch{} } return el; }
  function load(){ const m=ensure(); if(!m) return null; const src=MUSIC_BASE+"?world="+encodeURIComponent(MUSIC_LIB[musicIdx].key); if(m.dataset.src!==src){ m.src=src; m.dataset.src=src; } return m; }
  return {
    start(){ if(!soundOn||!musicOn) return; const m=load(); if(m) m.play().catch(()=>{}); },
    stop(){ if(el) el.pause(); },
    next(){ musicIdx=(musicIdx+1)%MUSIC_LIB.length; musicToast=140; const m=load(); if(m && soundOn && musicOn) m.play().catch(()=>{}); return MUSIC_LIB[musicIdx].name; },
    current(){ return MUSIC_LIB[musicIdx].name; }
  };
})();

// --- assets ---
const ARTSTYLE=GAME_CONFIG.artStyle||"watercolor", ART_BASE=GAME_CONFIG.artBase||"https://www.buildablekids.com/api/game-art";
// The hero picture follows whoever the kid chose. Swapping it is one assignment, and a
// failure just leaves the drawn fallback body in place — never a broken image.
const hero=new Image(); hero.crossOrigin="anonymous";
let heroSlug=CAST[0].slug;
function setHero(slug){ if(!CAST.some(c=>c.slug===slug)) slug=CAST[0].slug; heroSlug=slug; hero.src=heroUrl(slug); }
function heroInfo(){ return CAST.find(c=>c.slug===heroSlug) || CAST[0]; }
setHero(heroSlug);
const bg=new Image(); bg.crossOrigin="anonymous";
// HH4 — one art set PER WORLD, built the first time that world is played and kept after.
// Four worlds used to be impossible here because the piece images were one global set
// baked from GAME_CONFIG.world at load.
const PIECE_NAMES=["far","tree_a","tree_b","bush_a","bush_b","fern","mushroom","canopy"];
const WORLD_PROP_NAMES=["coin","gem","critter","boss"];
const PROP_NAMES=["coin","gem","critter","vines","spring","flag"];
const PR={}; for(const nm of PROP_NAMES){ const im=new Image(); im.crossOrigin="anonymous"; im.src=ART_BASE+"?img=props:"+nm+"&style="+ARTSTYLE; PR[nm]=im; }
const ART_SETS={};
function artSet(world){
  world = world || "enchanted-forest";
  if(ART_SETS[world]) return ART_SETS[world];
  const set={ world, pc:{}, wp:{} };
  for(const nm of PIECE_NAMES){ const im=new Image(); im.crossOrigin="anonymous"; im.src=ART_BASE+"?img="+world+":"+nm+"&style="+ARTSTYLE; set.pc[nm]=im; }
  for(const nm of WORLD_PROP_NAMES){ const im=new Image(); im.crossOrigin="anonymous"; im.src=ART_BASE+"?img="+world+":"+nm+"&style="+ARTSTYLE; set.wp[nm]=im; }
  ART_SETS[world]=set; return set;
}
let ART=artSet((GAME_CONFIG.levels[0]||{}).world);
// per-world themed gameplay props (coin/gem/critter); fall back to the generic props set if a world lacks one
function propImg(nm){ const wi=ART.wp[nm]; if(wi&&wi.complete&&wi.naturalWidth) return wi; const im=PR[nm]; return (im&&im.complete&&im.naturalWidth)?im:null; }
// The sky and the ground take their colours from the world too, so Frostpine Hollow is
// not a green forest with snow art pasted on it.
const DEFAULT_LOOK={ sky:["#bcdfff","#cfeaff","#dff0d6","#eef6dc"], ground:"#6b9b4a", groundTop:"#8fc46a", dirt:"#5a4332" };
function worldLook(){ return ((GAME_CONFIG.looks||{})[ART.world]) || DEFAULT_LOOK; }

// --- deterministic RNG so a level is reproducible (and QA-able) ---
function mulberry(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

// --- build one level from its recipe — alternating RUN zones (hazards) and
// CLIMB zones (flat ground + platforms). Always clearable: RUN zones space
// hazards <= a jump apart; CLIMB zones are flat so the bot never jumps where a
// platform could catch it. Platforms/stars/bounces live only in CLIMB zones. ---
// HH3 — a coin arc laid on the engine's OWN jump curve, so the reward sits exactly
// where a jumping hero passes rather than somewhere a designer guessed. cx/baseY are
// the hero's CENTRE at take-off, v is the speed being carried, vy0 the launch speed
// (a normal jump over a gap, or the much bigger kick of a bounce pad). Holding the
// jump button softens gravity on the way up, which is why the rise uses GRAV*0.62.
function coinArc(coins, cx, baseY, v, vy0, n){
  const aUp=GRAV*0.62, tUp=Math.abs(vy0)/aUp, rise=vy0*vy0/(2*aUp);
  const tTot=tUp+Math.sqrt(2*rise/GRAV); n=n||6;
  for(let i=1;i<=n;i++){ const t=tTot*i/(n+1);
    const dy = t<=tUp ? (vy0*t + 0.5*aUp*t*t) : (-rise + 0.5*GRAV*(t-tUp)*(t-tUp));
    coins.push({ x: cx + v*t, y: baseY+dy, got:false }); }
}
function mkSwing(ax, rnd){ return {ax, ay:GROUND_Y-230, len:140+rnd()*40, ang:(rnd()<0.5?-1:1)*(0.5+rnd()*0.3), angV:0, grabbed:false}; }
function buildLevel(lv, idx){

  let boss=null, barrierX=Infinity;
  const isLast = idx === ((GAME_CONFIG.levels&&GAME_CONFIG.levels.length||1)-1);
  const wantBoss = lv.boss!==false && (lv.boss===true || isLast);
  const n=lv.length, speed=lv.speed||RUN_BASE;

  // A gap is capped well inside that (the guarantee), and anything the hero would LAND
  // on has to sit beyond it (the thing that used to be wrong, and cost the bot a heart
  // at three different obstacles once the hero got faster).
  const flight=speed*TOP_MULT*AIR_FRAMES_HELD;
  const safeGapTiles=Math.max(1, Math.floor(flight*0.55/TILE) - 1);
  const landTiles=Math.ceil(flight/TILE)+2;
  const POOL=(GAME_CONFIG.powerups&&GAME_CONFIG.powerups.length)?GAME_CONFIG.powerups:["shield"];
  const topV=speed*TOP_MULT;                 // the speed a running hero actually carries
  // Where a running hero LEAVES THE GROUND for each kind of hazard. These mirror the
  // look-ahead numbers in botThink exactly (46 / 66 / 58 tiles-ahead, scaled by the speed
  // being carried), so an arc always starts at the real take-off point. Guessing these
  // by eye put the obstacle arcs 36px out, and a 36px error on the steep part of a jump
  // is the whole reason a coin gets missed.
  const KB=topV/RUN_BASE;

  while(i<n-4){
    if(mode==="run"){
      // 18-27 tiles of hazards. Longer than they used to be: a jump now carries the hero
      // most of 6 tiles, and nothing he can land on may sit inside that, so a short zone
      // only had room for one hazard and the level came out empty.
      const segEnd=Math.min(n-4, i + 18 + Math.floor(rnd()*10));
      // HH3 PIPE — a stand-on marker at the mouth of every run zone: safe ground here,
      // danger after this. It lands in the zone's 3-tile hazard-free lead-in, so it is
      // always on solid ground and there is always room to jump it.
      // One tile into the zone, but well clear of the spawn on the very first one, so a
      // kid's first two seconds are running, not a wall.
      { const pp={ x:(i + (i<=4 ? 6 : 1))*TILE+8, w:66, h:64 }; pipes.push(pp);
        coinArc(coins, pp.x-takePipe, GROUND_Y-30, topV, JUMP, 6); }   // a pipe is a jump too, so it gets its arc
      // lastHaz spaces hazards for variety; lastJump is the safety rule — nothing the
      // hero can LAND on (a hole, a crystal, a low bar) may sit inside the arc of the
      // jump he had to make for the hazard before it.
      // lastHaz spaces hazards for variety. lastFresh is where the current jump started,
      // which is what "still inside that arc" is measured from. lastAny is EVERY hazard
      // the hero might take off for, cluster ones included — because a cluster hazard he
      // is grounded at moves the landing point forward, and a hole or a crystal sitting
      // at that new landing point is exactly how the perfect player lost two hearts.
      let lastHaz=i, lastFresh=i, lastAny=i, arcOpen=false;

        const tx=i*TILE;
        const canHaz=(i-lastHaz)>=2;
        // canLand: far enough past the last jump that the hero is back on his feet, so
        // this is somewhere he can safely come DOWN. inArc: still inside that jump, high
        // over the ground, so a crystal or a critter here is flown over rather than
        // landed on — which is what lets hazards cluster like they do in a Mario level.
        // A low bar is slid under, not jumped, so it opens no arc: nothing may cluster
        // behind it. Clustering an enemy two tiles past one made the bot jump while it
        // was still inside the bar and take the hit it had just ducked.
        const canLand=(i-lastAny)>=landTiles, inArc=arcOpen && (i-lastFresh)<=3;

        // cascade let whichever hazard was tested first eat every slot, which is how a
        // level ended up with fifteen crystals and two holes.
        if(canHaz){
          const opts=[];
          if(canLand) opts.push(['gap', lv.gapChance||0]);
          if(canLand||inArc){ opts.push(['obs', lv.obstacleChance||0], ['ene', lv.enemyChance||0]); }
          if(canLand) opts.push(['low', lv.lowChance||0]);
          const total=opts.reduce((a,o)=>a+o[1],0);

              const gapTiles=1+Math.floor(rnd()*maxGap);
              if((lv.vineChance||0)>0 && rnd()<0.6) swings.push(mkSwing(tx + gapTiles*TILE*0.5, rnd));   // optional vine to swing the pit (ground jump still clears it)

            } else if(pick==='ene'){

              if(canLand){ coinArc(coins, tx+TILE/2-takeEne, GROUND_Y-30, topV, JUMP, 6); lastFresh=i; arcOpen=true; }
              lastHaz=i; lastAny=i;
            } else { lowBars.push({x:tx+TILE/2}); lastHaz=i; lastFresh=i; lastAny=i; arcOpen=false; }
          }
        }
        // HH3 — run-zone coins sat 70-130px up, ABOVE the hero's chest, so a kid running
        // along the floor ran underneath them and collected almost nothing. They now sit
        // on the running line, with the occasional one lifted onto a little hop arc.
        if(rnd()<lv.coinChance){
          if(rnd()<0.22) coinArc(coins, tx-40, GROUND_Y-30, topV, JUMP*0.55, 3);
          else coins.push({x:tx+TILE/2, y:GROUND_Y-34-Math.floor(rnd()*16), got:false});
        }
      }
      mode="climb";
    } else {
      const segEnd=Math.min(n-4, i + 12 + Math.floor(rnd()*6));   // 12-17 tiles, roomier climbs
      for(let j=i+1; j<segEnd-2; ){
        const tier=1+Math.floor(rnd()*2);                         // 1 or 2 (both reachable)
        const py=GROUND_Y-100-(tier-1)*78;
        const wT=2+Math.floor(rnd()*2);
        if(j+wT>segEnd-2) break;
        const pf={x:j*TILE, y:py, w:wT*TILE};
        if(rnd() < (lv.movingPlatChance||0)){
          const roll=rnd();                                       // x / y / diagonal movers for variety
          if(roll<0.42)      pf.mv={axis:'x',    amp:TILE*(0.9+rnd()*1.3),               spd:0.018+rnd()*0.016, ph:rnd()*6.28, bx:pf.x, by:pf.y};
          else if(roll<0.78) pf.mv={axis:'y',    amp:28+rnd()*34,                        spd:0.018+rnd()*0.016, ph:rnd()*6.28, bx:pf.x, by:pf.y};
          else               pf.mv={axis:'diag', amp:TILE*(0.7+rnd()*0.9), ampY:24+rnd()*26, spd:0.016+rnd()*0.014, ph:rnd()*6.28, bx:pf.x, by:pf.y};
          pf.dx=0; pf.dy=0;
        }
        platforms.push(pf);
        if(pf.mv){                                                // coins along the mover's path reward riding it
          const cn=2, spread=(pf.mv.axis==='y')?0:(pf.mv.amp||TILE)*1.1;
          for(let cc=0;cc<cn;cc++){ const fx=(cn>1?cc/(cn-1):0.5)-0.5; coins.push({x:pf.x+pf.w*0.5+fx*spread, y:py-30, got:false}); }
        } else {

          // making (the coin, plus the stars and power-ups that only live up here), but the
          // bulk of the level's coins now sit on the floor where a running kid meets them.
          coins.push({x:j*TILE+wT*TILE/2, y:py-30, got:false});
        }
        if(rnd() < (lv.vineChance||0)){                           // more vines, sometimes a 2-vine chain to swing across
          swings.push(mkSwing(pf.x+pf.w*0.5, rnd));
          if(rnd()<0.45) swings.push(mkSwing(pf.x+pf.w*0.5 + TILE*(2.4+rnd()*1.4), rnd));
        }
        if(tier===2 && stars.length<(lv.starCount||3) && rnd()<0.7) stars.push({x:j*TILE+TILE/2, y:py-36, got:false});
        else if(rnd()<0.35) powerups.push({x:j*TILE+TILE/2, y:py-36, kind:POOL[Math.floor(rnd()*POOL.length)], got:false});
        if(rnd()<0.4){ const bp={x:j*TILE+wT*TILE/2-32, y:py-14, w:64, t:0}; bounces.push(bp);
          coinArc(coins, bp.x+32, bp.y-30, topV*0.45, JUMP*1.55, 3); }   // HH3 — a reward for riding the bounce up

      }

      // platform reward before, so a kid who stays on the ground walked through them
      // with nothing to collect. The platform coins are still the prize for climbing.
      for(let g=i+1; g<segEnd-1; g++){ if(rnd()<0.5) coins.push({x:g*TILE+TILE/2, y:GROUND_Y-34-Math.floor(rnd()*16), got:false}); }
      // HH3 BONK BLOCKS — one short row per climb zone. Climb zones are flat solid
      // ground by construction, and the row is placed only where it overlaps no
      // platform, so the ground path a kid (or the QA bot) walks is never blocked.
      { const by=GROUND_Y-234, rowLen=3+Math.floor(rnd()*2);
        for(let tries=0; tries<10; tries++){
          const j0=i+2+Math.floor(rnd()*Math.max(1,(segEnd-i-4-rowLen)));

          for(const pf of platforms){ if(pf.y<GROUND_Y-140 && x1>pf.x-30 && x0<pf.x+pf.w+30){ clash=true; break; } }

  // to reward climbing almost exclusively: a kid who ran along the ground passed under
  // nearly every coin. This lays one on the running line every two tiles wherever the
  // floor is solid and nothing dangerous is standing there, skipping any spot a coin
  // already covers. The platform and arc coins stay exactly as they are, as the extra.
  { const gAt=(x)=>{ for(const g of ground){ if(x>=g.x0 && x<g.x1) return g.y; } return null; };
    // Everything the hero JUMPS puts him in the air for about 340px afterwards. A floor
    // coin inside that span can never be reached, so the arc over the jump carries the
    // reward there instead and the floor line steps around it.
    const air=[];

    // so this is the real window, not a guess with slack piled on

    for(const o of obstacles) air.push([o.x-AIR_BEFORE, o.x+AIR_AFTER]);
    for(const e of enemies)   air.push([e.x-AIR_BEFORE, e.x+AIR_AFTER]);
    for(const pp of pipes)    air.push([pp.x-AIR_BEFORE, pp.x+pp.w+AIR_AFTER]);

  if(wantBoss){
    const bx=(n*TILE) - TILE*4;                              // arena just before the flag
    ground.push({x0:bx-TILE*2.5, x1:n*TILE, y:GROUND_Y});    // guarantee a solid, gap-free boss arena
    boss={ x:bx, y:GROUND_Y, w:100, h:92, hp:(lv.bossHp||3), maxHp:(lv.bossHp||3), t:0, hit:0, defeated:false, happy:0, active:false };

  }

  while(stars.length<(lv.starCount||3) && platforms.length){ const pf=platforms[Math.floor(rnd()*platforms.length)]; stars.push({x:pf.x+pf.w/2, y:pf.y-36, got:false}); }
  // endless edges so the world never just stops
  ground.unshift({x0:-3000, x1:0, y:GROUND_Y});
  ground.push({x0:n*TILE, x1:n*TILE+3000, y:GROUND_Y});
  const goalX=n*TILE - TILE*1.4;
  return { ground, obstacles, enemies, coins, lowBars, decos, powerups, platforms, bounces, stars, swings, blocks, pipes,
           boss, barrierX, goalX, poleX:goalX, worldEnd:n*TILE, name:lv.name, world:lv.world||"enchanted-forest", speed:lv.speed||RUN_BASE };
}

// --- scatter the world pieces across parallax layers (cosmetic; separate RNG so QA is unaffected) ---
function buildScene(L, idx){
  const we=L.worldEnd, S={mid:[],near:[],fore:[],top:[],flies:[]};
  const r1=mulberry(21000+idx*7);
  for(let x=-1000; x<we+1600; x+= 230+r1()*210){ S.mid.push({x, piece: r1()<0.58?"tree_a":"tree_b", s:0.85+r1()*0.6, flip:r1()<0.5, ph:r1()*6.28}); }
  const r2=mulberry(33000+idx*7);
  for(let x=-1000; x<we+1600; x+= 140+r2()*150){ const t=r2(); S.near.push({x, piece: t<0.4?"bush_a":t<0.7?"bush_b":"mushroom", s:0.5+r2()*0.45, flip:r2()<0.5, ph:r2()*6.28}); }
  const r3=mulberry(44000+idx*7);
  for(let x=-1000; x<we+1600; x+= 600+r3()*320){ S.fore.push({x, piece:"fern", s:0.8+r3()*0.45, flip:r3()<0.5, ph:r3()*6.28}); }
  const r4=mulberry(55000+idx*7);
  for(let x=-1000; x<we+1600; x+= 360+r4()*240){ S.top.push({x, piece:"canopy", s:0.9+r4()*0.5, flip:r4()<0.5}); }
  const r5=mulberry(66000+idx*7);
  for(let i=0;i<48;i++){ S.flies.push({x:r5()*we, y:60+r5()*(GROUND_Y-50), ph:r5()*6.28, sp:0.4+r5()*0.8}); }
  return S;
}

let player, camX, hearts, coinsGot, totalCoins, state, invuln, botMode=false, doneMsgT=0, started=false, starsGot=0, totalStars=0, gameT=0, demoMode=true, demoRestartT=0;
let dust=[], pops=[], camY=0;
function spawnDust(wx,wy){ for(let i=0;i<6;i++) dust.push({x:wx,y:wy,vx:(Math.random()-0.5)*3.2,vy:-Math.random()*2,life:16+Math.random()*10}); }

  { const u=LIB_BASE+"?img=world:"+L.world+"&style="+ARTSTYLE; if(bg.dataset===undefined || bg.src!==u) bg.src=u; }

          coyote:COYOTE_FRAMES, buf:0, skid:0, runPhase:0, idleT:0};
  camX=0; camY=0; invuln=0; state="play"; coinsGot=0;

  totalCoins=L.coins.length + (L.blocks||[]).filter(b=>b.kind==='q' && b.content==='coin').length; starsGot=0; totalStars=L.stars.length; dust=[]; pops=[]; doneMsgT=0; gameT=0;
  poleT=0;
  // Replay has to hand the level back exactly as it was built. Nothing here used to be
  // reset, so playing the same level twice showed an empty world — invisible while the
  // only way back was a deliberate tap, obvious the moment the flag pole auto-advances.

  for(const u of L.powerups) u.got=false;

  for(const b of (L.blocks||[])){ b.used=false; b.hit=0; }

  for(const sw of (L.swings||[])){ sw.grabbed=false; }
  shieldOn=false; magnetT=0; springT=0; starT=0;
  if(hearts==null) hearts=3;
  if(!L.scene) L.scene=buildScene(L, li);
}

let jumpHeld=false, inputLeft=false, inputRight=false, paused=true;
// One jump attempt. Returns true if it actually fired. Coyote time lets a ground jump
// still work for a few frames after walking off a ledge; a press that finds nothing is
// remembered by the buffer and fired the moment the feet touch down.
function tryJump(){
  if(player.swing){ const sw=player.swing; const tang=sw.angV*sw.len;        // let go of the vine, fling in the swing direction
    player.vx=Math.max(-7,Math.min(7,Math.cos(sw.ang)*tang*6));
    player.vy=JUMP*0.7 - Math.min(6,Math.abs(Math.sin(sw.ang)*tang)*0.5);
    player.swing=null; sw.grabbed=false; player.onGround=false; player.dj=true; player.swingCool=10; S("jump"); return true; }
  if(player.slide>0) player.slide=0;                       // jump cancels a slide
  const jv = springT>0 ? 1.2 : 1;                          // spring power-up = higher jump
  if(player.onGround || player.coyote>0){                  // ground jump, incl. the coyote grace window
    player.vy=JUMP*jv; player.onGround=false; player.coyote=0; player.dj=true; S("jump"); return true; }
  if(player.dj){ player.vy=JUMP*0.82*jv; player.dj=false; S("jump"); return true; }   // double jump, unchanged
  return false;
}
function doJump(){
  if(!started){started=true;}
  jumpHeld=true;
  if(!tryJump()) player.buf=BUFFER_FRAMES;                 // nothing to jump from yet — remember the press
}
function doSlide(){ if(!started){started=true;return;} if(player.onGround && player.slide<=0){ player.slide=SLIDE_FRAMES; } }
addEventListener('keydown',e=>{

  if(e.code==='ArrowLeft'){inputLeft=true;started=true;}
  else if(e.code==='ArrowRight'){inputRight=true;started=true;}
  else if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();started=true;doJump();}
  else if(e.code==='ArrowDown'){e.preventDefault();doSlide();}
  else if(e.key==='b')botMode=!botMode;
});

//  HH4 — the start screen. The shared one (buildable-startscreen.js), so Hop Heroes
//  launches like every other game: the four worlds as its level row, the chosen hero
//  with a Change button, coins, and the sound toggle. The bespoke swipe overlay it
//  replaces is gone. Everything here is guarded so headless QA (no document.body,
//  no BuildableStartScreen) never touches it.
// ===========================================================================
const BS = (typeof window!=="undefined" && window.BuildableStartScreen) || null;
const SAVE_KEY = "bk_hopheroes_v1";
function loadSave(){
  try{ const raw=localStorage.getItem(SAVE_KEY); const o=raw?JSON.parse(raw):null;
    return { hero:(o&&o.hero)||CAST[0].slug, cleared:Math.max(0,Math.min(LEVELS.length,(o&&o.cleared)|0)), stars:(o&&o.stars)||{} };
  }catch(e){ return { hero:CAST[0].slug, cleared:0, stars:{} }; }
}
function saveNow(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(SAVE)); }catch(e){} }
let SAVE = loadSave();
setHero(SAVE.hero);

const menuEl = document.getElementById('menu');
const heroPick = document.getElementById('heroPick');
let screen=null;

function starsBanked(){ let n=0; for(const k in SAVE.stars) n+=SAVE.stars[k]|0; return n; }
function screenSpec(){
  const h=heroInfo();
  return {
    title: GAME_CONFIG.name || "Hop Heroes",
    subtitle: "Reach the flag in every world",
    coins: starsBanked(),
    sound: soundOn,
    hero: { name:h.name, img:heroUrl(h.slug),
            progressText: SAVE.cleared+" of "+LEVELS.length+" worlds cleared" },
    levels: LEVELS.map((lv,i)=>({
      n: i+1, name: lv.name, color: (GAME_CONFIG.looks[lv.world]||{}).ground,
      stars: SAVE.stars[i]|0, maxStars: 3,
      state: i<SAVE.cleared ? "done" : (i===SAVE.cleared ? "next" : "locked"),
    })),
  };
}
function paintMenu(){
  if(!BS || !menuEl || !menuEl.appendChild) return;
  if(screen && screen.update){ screen.update(screenSpec()); return; }
  try{
    screen = BS.mount(menuEl, screenSpec(), {
      onPlay: (n)=>startPlay((n|0)-1),
      onHero: ()=>openHeroPick(),
      onSound: (on)=>{ soundOn=!!on; musicOn=soundOn; actx(); if(soundOn&&musicOn) Music.start(); else Music.stop(); paintMute(); },
    });
  }catch(e){ screen=null; }
}
// --- the hero chooser: four big faces, nothing to read ---
function openHeroPick(){
  if(!heroPick || !heroPick.querySelector) return;
  const row=heroPick.querySelector('.hpRow'); if(!row) return;
  row.innerHTML = CAST.map(c=>
    '<div class="hpBtn'+(c.slug===heroSlug?' on':'')+'" data-slug="'+c.slug+'">'+
      '<div class="hpFace" style="background:'+c.colour+'"><img alt="" src="'+heroUrl(c.slug)+'" onerror="this.remove()"></div>'+
      '<div class="hpName">'+c.name+'</div>'+
    '</div>').join('');
  row.querySelectorAll('.hpBtn').forEach(el=>{
    el.addEventListener('pointerdown',(ev)=>{ ev.preventDefault();
      const slug=el.getAttribute('data-slug'); setHero(slug); SAVE.hero=slug; saveNow();
      heroPick.hidden=true; paintMenu(); });
  });
  heroPick.hidden=false;
}
if(heroPick) heroPick.addEventListener('pointerdown',(e)=>{ if(e.target===heroPick) heroPick.hidden=true; });

// The play furniture (thumb pads, the engine's own buttons, the hint, the HUD strip)
// belongs to PLAY. On the start screen it was drawing straight over the world list.
const PLAY_CHROME=["pad","actions","hint","bMute","bMusic","bHelp"];
function showPlayChrome(on){
  for(const id of PLAY_CHROME){ const el=document.getElementById(id); if(el&&el.style) el.style.display = on ? "" : "none"; }
  try{ if(hud){ if(on) hud.show(); else hud.hide(); } }catch(e){}
}
function startDemo(){
  if(typeof hintEl!=='undefined'&&hintEl){hintEl.style.opacity='';hintGone=false;}
  demoMode=true; botMode=false; hearts=3; startLevel(Math.min(SAVE.cleared, LEVELS.length-1));
  started=false; paused=false; demoRestartT=0;
  if(menuEl) menuEl.hidden=false; showPlayChrome(false); paintMenu();
}
function startPlay(idx){
  demoMode=false; botMode=false; if(menuEl) menuEl.hidden=true; if(heroPick) heroPick.hidden=true;
  showPlayChrome(true);
  hearts=3; startLevel(idx==null ? Math.min(SAVE.cleared, LEVELS.length-1) : idx);
  started=false; paused=false; inputLeft=false; inputRight=false;
  try{window.focus();}catch{} actx(); if(soundOn&&musicOn) Music.start();
}
// mute / sound toggle
const SPK_ON='<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="4,9 4,15 8,15 13,19 13,5 8,9" fill="#fff" stroke="none"/><path d="M16 8.5a5 5 0 0 1 0 7"/><path d="M18.5 6a8.5 8.5 0 0 1 0 12"/></svg>';
const SPK_OFF='<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="4,9 4,15 8,15 13,19 13,5 8,9" fill="#fff" stroke="none"/><line x1="16" y1="9" x2="22" y2="15"/><line x1="22" y1="9" x2="16" y2="15"/></svg>';
const bMute=document.getElementById('bMute');
function paintMute(){ bMute.innerHTML = (soundOn) ? SPK_ON : SPK_OFF; bMute.style.opacity = soundOn? '1' : '.55'; }
paintMute();
bMute.addEventListener('click',()=>{ soundOn=!soundOn; musicOn=soundOn; actx(); if(soundOn&&musicOn) Music.start(); else Music.stop(); paintMute(); });
// music-note button: cycle through the song library by ear
const NOTE_ICON='<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3" fill="#fff" stroke="none"/><circle cx="17" cy="16" r="3" fill="#fff" stroke="none"/></svg>';
const bMusic=document.getElementById('bMusic'); bMusic.innerHTML=NOTE_ICON;
bMusic.addEventListener('click',()=>{ actx(); if(!soundOn){ soundOn=true; musicOn=true; paintMute(); } Music.next(); });
document.getElementById('bHelp').addEventListener('click',()=>{ startDemo(); });

// --- where are the holes? Merged from the ground segments once per level, so the
// pit art and the ground band can never disagree about where an edge is. ---
function pitsFrom(segs){
  const g=segs.slice().sort((a,b)=>a.x0-b.x0), out=[]; let end=g.length?g[0].x1:0;
  for(let i=1;i<g.length;i++){ if(g[i].x0>end+1) out.push({x0:end, x1:g[i].x0}); end=Math.max(end,g[i].x1); }
  return out;
}
function pitsOf(L){ if(!L._pits) L._pits=pitsFrom(L.ground); return L._pits; }
// --- helpers: is there solid ground under world-x? ---
function groundUnder(wx){ for(const g of L.ground){ if(wx>=g.x0 && wx<g.x1) return g.y; } return null; }

// --- simple "perfect player" bot: jump before a gap or obstacle/enemy ---
function botThink(){
  inputRight=true; inputLeft=false;          // perfect player walks right
  // HH1: the hero now runs up to L.speed*TOP_MULT, so every "how far ahead do I look"
  // number scales with the speed actually being carried. Without this the bot jumps
  // too late at the new top speed and clips the lip of a pit.
  const K = Math.max(1, Math.abs(player.vx)/RUN_BASE);
  if(player.onGround){
    if(L.boss && !L.boss.defeated){ const d=L.boss.x-(player.x+24); if(d>-20 && d<90*K){ doJump(); return; } }
    for(const b of L.lowBars){ const d=b.x-(player.x+24); if(d>2 && d<60*K){ if(player.slide<=0) doSlide(); return; } }
    if(groundUnder(player.x+24+46*K)==null){ doJump(); return; }   // gap just ahead
    for(const pp of L.pipes){ const d=pp.x-(player.x+24); if(d>2 && d<64*K){ doJump(); return; } }
    for(const o of L.obstacles){ const d=o.x-(player.x+24); if(d>2 && d<66*K){ doJump(); return; } }
    for(const e of L.enemies){ if(!e.dead){ const d=e.x-(player.x+24); if(d>2 && d<58*K){ doJump(); return; } } }
  } else { jumpHeld=true; }
}

// --- update ---
function update(){
  if(state!=="play"){
    doneMsgT++;
    // HH3 — the flag pole runs itself: the hero slides down, there is a short fanfare,
    // and then the next level starts. No tap needed. (One level today, so it repeats;
    // HH4 brings the worlds that make this go somewhere new.)
    if(state==="win" && poleT>0){
      poleT++;
      if(poleT>POLE_SLIDE+POLE_FANFARE){
        poleT=0;
        // Banking the world is what makes the start screen mean anything: the next world
        // unlocks, and the best star count for this one is kept.
        if(typeof SAVE!=="undefined"){
          SAVE.stars[li]=Math.max(SAVE.stars[li]|0, starsGot);
          if(li+1>SAVE.cleared) SAVE.cleared=Math.min(LEVELS.length, li+1);
          saveNow();
        }
        if(li<LEVELS.length-1) startLevel(li+1);      // straight on into the next world
        else startDemo();                              // last world cleared: back to the map
      }
    }
    return;
  }
  if(paused) return;
  if(botMode) botThink();
  if(!started) return;                       // wait for first input
  if(player.slide>0) player.slide--;
  if(magnetT>0)magnetT--; if(springT>0)springT--; if(starT>0)starT--; if(player.swingCool>0)player.swingCool--;
  gameT++;
  // advance moving platforms (deterministic frame clock so the QA sim matches real play)
  for(const pf of L.platforms){ if(pf.mv){ const m=pf.mv, s=Math.sin(gameT*m.spd+m.ph);
    const nx = (m.axis==='x'||m.axis==='diag')? m.bx+s*m.amp : m.bx;
    const ny = m.axis==='y'? m.by+s*m.amp : (m.axis==='diag'? m.by+Math.cos(gameT*m.spd+m.ph)*m.ampY : m.by);
    pf.dx=nx-pf.x; pf.dy=ny-pf.y; pf.x=nx; pf.y=ny; } }
  // swinging vines: pendulum motion (ungrabbed) + ride/grab
  for(const sw of L.swings){ if(sw===player.swing)continue; sw.angV += -0.006*Math.sin(sw.ang); sw.angV*=0.996; sw.ang+=sw.angV; }
  if(player.swing){ const sw=player.swing;
    sw.angV += -0.010*Math.sin(sw.ang);
    if(inputLeft) sw.angV-=0.0016; if(inputRight) sw.angV+=0.0016;
    sw.angV*=0.992; sw.ang+=sw.angV;
    player.x = sw.ax+Math.sin(sw.ang)*sw.len - 24;
    player.y = sw.ay+Math.cos(sw.ang)*sw.len - 30;
    player.vx=0; player.vy=0; player.onGround=false;
    for(const k of L.coins){ if(!k.got && Math.abs((player.x+24)-k.x)<34 && Math.abs((player.y+30)-k.y)<40){ k.got=true; coinsGot++; getCoin(k.x,k.y); } }
    return;
  } else if(!botMode && !player.onGround && player.swingCool<=0){     // bonus toy; the QA "perfect runner" stays on the ground path
    for(const sw of L.swings){ const bx=sw.ax+Math.sin(sw.ang)*sw.len, by=sw.ay+Math.cos(sw.ang)*sw.len;
      if(Math.abs((player.x+24)-bx)<40 && Math.abs((player.y+30)-by)<46){ player.swing=sw; sw.grabbed=true; player.vy=0; break; } }
  }
  // walk — player-controlled (Mario-style, no auto-scroll). A short run-up to a faster
  // top speed, and pushing against your own momentum SKIDS instead of stopping dead.
  const MAXR=L.speed*TOP_MULT;
  const ACC = player.onGround ? ACC_GROUND : ACC_AIR;
  const dir = (inputLeft && !inputRight) ? -1 : (inputRight && !inputLeft) ? 1 : 0;
  if(player.skid>0) player.skid--;
  if(dir!==0){
    const turning = player.vx*dir < -0.01;                 // asking for the opposite of where you are going
    if(turning){
      if(player.onGround && Math.abs(player.vx)>SKID_MIN){ player.skid=10; if(gameT%3===0) spawnSkidDust(player.x+24, player.y+60, dir); }
      player.vx *= SKID_DECEL;                             // skid: momentum bleeds off, it does not stop dead
      player.vx += ACC*dir*1.8;
    } else player.vx += ACC*dir;
  } else player.vx *= (player.onGround?FRIC_GROUND:FRIC_AIR);
  if(Math.abs(player.vx)<0.04) player.vx=0;
  if(player.vx>MAXR)player.vx=MAXR; if(player.vx<-MAXR)player.vx=-MAXR;
  player.x += player.vx;
  if(player.x<20){ player.x=20; if(player.vx<0)player.vx=0; }
  if(Math.abs(player.vx)>0.4) player.face = player.vx>0?1:-1;
  // run cycle phase: driven by distance travelled, so the legs match the speed
  player.runPhase += Math.abs(player.vx)*0.09;
  if(player.onGround && Math.abs(player.vx)<0.3) player.idleT++; else player.idleT=0;
  // gravity + variable jump height
  player.vy += GRAV * (jumpHeld && player.vy<0 ? 0.62 : 1);
  player.y += player.vy;
  // vertical support: ground + one-way platforms + bounce pads
  { const feet=player.y+60, prevFeet=feet-player.vy, cx=player.x+24;
    let landY=null, landPf=null, bounce=false;
    if(player.vy>=0){
      const g=groundUnder(cx); if(g!=null && feet>=g) landY=g;
      for(const pf of L.platforms){ if(cx>=pf.x && cx<=pf.x+pf.w && prevFeet<=pf.y && feet>=pf.y){ if(landY==null||pf.y<landY){landY=pf.y; landPf=pf;} } }
      for(const b of (L.blocks||[])){ if(cx>=b.x && cx<=b.x+b.w && prevFeet<=b.y && feet>=b.y){ if(landY==null||b.y<landY){landY=b.y; landPf=null;} } }
      for(const pp of (L.pipes||[])){ const top=GROUND_Y-pp.h; if(cx>=pp.x && cx<=pp.x+pp.w && prevFeet<=top && feet>=top){ if(landY==null||top<landY){landY=top; landPf=null;} } }
      for(const bp of L.bounces){ if(cx>=bp.x && cx<=bp.x+bp.w && prevFeet<=bp.y && feet>=bp.y){ bounce=true; bp.t=10; } }
    }
    const wasOnGround=player.onGround;
    if(bounce){ player.vy=JUMP*1.55; player.onGround=false; player.dj=true; player.coyote=0; S("bounce"); }
    else if(landY!=null){ if(!player.onGround){ player.land=8; spawnDust(cx, landY); S("land"); } player.y=landY-60; player.vy=0; player.onGround=true; player.dj=false; player.coyote=COYOTE_FRAMES;
      if(landPf&&landPf.mv){ if(landPf.mv.axis==='x'||landPf.mv.axis==='diag') player.x+=landPf.dx; player.standPf=landPf; } else player.standPf=null; }
    else { player.onGround=false; player.standPf=null; if(wasOnGround && player.vy>=0) player.coyote=COYOTE_FRAMES; }
    if(!player.onGround && player.coyote>0) player.coyote--;
    // a jump pressed just before landing fires the moment there is something to push off
    if(player.buf>0){ player.buf--; if(player.onGround||player.coyote>0){ if(tryJump()) player.buf=0; } }
  }
  // HH3 BONK BLOCKS — hit from below. A ? block pops a coin or a power-up; a plain block
  // just thumps and nudges the hero back down. Blocks only ever sit over solid ground, so
  // bonking one can never drop a kid somewhere they cannot get out of.
  for(const b of (L.blocks||[])){
    if(b.hit>0) b.hit--;
    if(player.vy>=0) continue;
    const cx=player.x+24, head=player.y, prevHead=head-player.vy, bot=b.y+b.h;
    if(cx>b.x-14 && cx<b.x+b.w+14 && prevHead>=bot && head<=bot){
      player.y=bot; player.vy=1.4; b.hit=12; spawnDust(cx, bot+6);
      if(b.kind==='q' && !b.used){
        b.used=true;
        if(b.content==='power'){ L.powerups.push({x:b.x+b.w/2, y:b.y-28, kind:b.pu, got:false}); S("power"); pop(b.x+b.w/2, b.y-34, "POW!", "#ffe27a"); }
        else { coinsGot++; getCoin(b.x+b.w/2, b.y-6); pop(b.x+b.w/2, b.y-34, "+1", "#ffd23f");
               for(let d=0;d<7;d++) dust.push({x:b.x+b.w/2, y:b.y-6, vx:(Math.random()-0.5)*3.4, vy:-2-Math.random()*2.4, life:18+Math.random()*10, gold:true}); }
      } else S("jump");                                 // a plain block just thumps
    }
  }
  // HH3 PIPES — solid props. You stand on them (handled with the platforms above) and you
  // cannot walk through them, so they read as the wall a pipe should be.
  for(const pp of (L.pipes||[])){
    const top=GROUND_Y-pp.h, cx=player.x+24;
    if(player.y+60 <= top+4) continue;                      // standing on it, or clear above it
    if(cx>pp.x-22 && cx<pp.x+pp.w+22){
      if(cx < pp.x+pp.w*0.5){ player.x=pp.x-46; if(player.vx>0)player.vx=0; }
      else { player.x=pp.x+pp.w-2; if(player.vx<0)player.vx=0; }
    }
  }
  player.r = player.onGround?0:Math.max(-0.5,Math.min(0.5,player.vy*0.03));
  // fell in a gap
  if(player.y>H+40){ loseHeart(true); return; }
  if(invuln>0) invuln--;
  if(player.land>0)player.land--;
  for(const d of dust){ d.x+=d.vx; d.y+=d.vy; d.vy+=0.2; d.life--; }
  if(dust.length) dust=dust.filter(d=>d.life>0);
  // magnet power-up: pull nearby coins toward the hero
  if(magnetT>0){ for(const k of L.coins){ if(k.got)continue; const dx=(player.x+24)-k.x, dy=(player.y+30)-k.y; if(dx*dx+dy*dy<170*170){ k.x+=dx*0.16; k.y+=dy*0.16; } } }
  // coins
  for(const k of L.coins){ if(!k.got && Math.abs((player.x+24)-k.x)<34 && Math.abs((player.y+30)-k.y)<40){ k.got=true; coinsGot++; getCoin(k.x,k.y); } }
  for(const st of L.stars){ if(!st.got && Math.abs((player.x+24)-st.x)<38 && Math.abs((player.y+30)-st.y)<46){ st.got=true; starsGot++; if(FEEL){ try{ FEEL.explode(sx_(st.x), sy_(st.y), "#ffd23f", {pop:"STAR!", sound:"levelup"}); }catch(e){ S("star"); } } else S("star"); } }
  // power-up pickups
  for(const u of L.powerups){ if(u.got)continue; if(Math.abs((player.x+24)-u.x)<36 && Math.abs((player.y+30)-u.y)<44){ u.got=true; if(FEEL){ try{ FEEL.explode(sx_(u.x), sy_(u.y), "#7ee0a0", {pop:"POWER!", sound:"levelup"}); }catch(e){ S("power"); } } else S("power"); if(u.kind==="shield")shieldOn=true; else if(u.kind==="magnet")magnetT=360; else if(u.kind==="spring")springT=360; else if(u.kind==="star")starT=360; else if(u.kind==="heart"&&hearts<3)hearts++; } }
  // enemies (walk a little)
  for(const e of L.enemies){ if(e.squash>0) e.squash--; if(e.dead)continue; e.x+=e.dir*0.6; if(Math.abs(e.x-e.base)>e.range)e.dir*=-1;
    const dx=Math.abs((player.x+24)-e.x), dy=(player.y+60)-e.y;
    if(dx<34 && Math.abs((player.y+30)-e.y)<46){
      if(starT>0){ e.dead=true; e.squash=26; pop(e.x, e.y-30, "SMASH!", "#ffd23f"); }        // star smashes enemies
      else if(player.vy>0 && (player.y+60)-e.y<26){                 // STOMP: squash flat, bounce, pop text
        e.dead=true; e.squash=26; player.vy=JUMP*(jumpHeld?0.92:0.72); player.dj=true;
        spawnDust(e.x, GROUND_Y); S("bounce"); pop(e.x, e.y-34, "NICE!", "#fff3b0");
      }
      else if(invuln<=0){ takeHit(); }
    }
  }
  for(const q of pops){ q.t++; q.y-=0.9; }
  if(pops.length) pops=pops.filter(q=>q.t<44);
  // obstacles
  for(const o of L.obstacles){ const dx=Math.abs((player.x+24)-o.x); if(dx<28 && (player.y+60)>o.y-o.h+6 && (player.y+30)<o.y && invuln<=0){ takeHit(); } }
  // low barriers: must SLIDE under (can't jump over)
  for(const b of L.lowBars){ const dx=Math.abs((player.x+24)-b.x); if(dx<26){ const heroTop=player.y+(player.slide>0?26:0); if(heroTop < GROUND_Y-36 && invuln<=0){ takeHit(); } } }
  // friendly end-of-level boss: bop it on the head to make it happy
  if(L.boss && !L.boss.defeated){ const b=L.boss; if(b.hit>0)b.hit--;
    if(!b.active && player.x > b.x - W*0.9) b.active=true;       // wake up only when the player is close
    if(b.active){ b.t++; if(b.t>60*18) defeatBoss(); }           // mercy failsafe: boss gives up 18s after the fight starts (never soft-locks)
    const dx=Math.abs((player.x+24)-b.x), pcy=player.y+30;
    if(dx < b.w*0.5+26 && pcy < b.y-6 && player.vy>0){           // stomp from above
      b.hp--; b.hit=12; player.vy=JUMP*0.7; player.dj=true; S("bounce"); if(b.hp<=0) defeatBoss();
    } else if(dx < b.w*0.5+20 && pcy > b.y-b.h && player.onGround && invuln<=0){  // gentle side bump — NO heart loss
      player.vx=-3; player.x-=4; invuln=16;
    }
  }
  // magic barrier holds you back until the boss is happy
  if(L.boss && !L.boss.defeated && (player.x+24) > L.barrierX){ player.x=L.barrierX-24; if(player.vx>0)player.vx=0; }
  // reach goal
  if(player.x>=L.goalX){ state="win"; poleT=1; player.vx=0; player.vy=0; player.x=L.goalX-20; player.y=GROUND_Y-190;
    if(FEEL){ try{ FEEL.celebrate(W,VH); }catch(e){ S("win"); } } else S("win"); try{window.parent.postMessage({source:"buildable",kind:"win"},"*")}catch(e){} }
}
// LAW 3 — coins land with a burst: gold sparkle, rising coin chime, a light buzz.
// No "+1" text: the coin line is dense on purpose, and a pop per coin buried the level
// in floating numbers. The sparkle and the chime are the reward.
function getCoin(wx,wy){ if(FEEL){ try{ FEEL.coinBurst(sx_(wx), sy_(wy), null, {n:5}); return; }catch(e){} } S("coin"); }
function takeHit(){ if(starT>0) return; if(shieldOn){ shieldOn=false; invuln=70; return; } loseHeart(false); }
function loseHeart(fell){
  hearts--; invuln=70;
  if(FEEL){ try{ FEEL.miss(); }catch(e){ S("hurt"); } } else S("hurt");
  if(hearts<=0){ state="lose"; try{window.parent.postMessage({source:"buildable",kind:"lose"},"*")}catch(e){} return; }
  // gentle: nudge back to safe ground
  if(fell){ let sx=player.x-TILE*2; while(sx>90 && groundUnder(sx)==null) sx-=20; player.x=Math.max(90,sx); player.y=GROUND_Y-80; player.vy=0; }
}

function draw(){

  // running into), never scrolling left of the start, and a gentle vertical follow that
  // only kicks in on the tall two-tier climbs so the top platforms stay on screen.
  const spd01 = Math.min(1, Math.abs(player.vx)/(L.speed*TOP_MULT));

  // Vertical follow is a DEAD ZONE, not a spring: the world only slides down once the

  // climb), and it is hard-clamped so the ground band can never leave the bottom of the

    sky.addColorStop(Math.min(0.999,p0+(1-p0)*0.55),c4[2]); sky.addColorStop(1,c4[3]);

      ctx.fillStyle="rgba(255,255,255,.7)"; ctx.beginPath(); ctx.ellipse(x-7, GROUND_Y-6, 4, 2.4,0,0,7); ctx.ellipse(x+7, GROUND_Y-6, 4, 2.4,0,0,7); ctx.fill();
      ctx.restore(); continue; }
    // HH2: every enemy gets a pale halo and a dark base shadow, so whatever art the
    // world hands us it can never disappear into a green bush.
    const bob=Math.sin(t*4+e.base)*2;
    ctx.fillStyle="rgba(0,0,0,.22)"; ctx.beginPath(); ctx.ellipse(x,GROUND_Y+2,21,6,0,0,7); ctx.fill();
    ctx.save(); ctx.shadowColor="rgba(255,250,235,.95)"; ctx.shadowBlur=10;
    const im=propImg("critter");
    if(im){ const s=52, w=s*(im.naturalWidth/im.naturalHeight); ctx.save(); ctx.translate(x, GROUND_Y-s+bob); if(e.dir>0)ctx.scale(-1,1); ctx.drawImage(im, -w/2, 0, w, s); ctx.restore(); }
    else { ctx.fillStyle=P.enemy; rrect(x-20,e.y-6+bob,40,34,16);ctx.fill();
      ctx.fillStyle="rgba(255,255,255,.22)"; rrect(x-15,e.y-2+bob,30,10,6); ctx.fill();
      ctx.fillStyle="#fff"; ctx.beginPath();ctx.arc(x-7,e.y+6+bob,5.5,0,7);ctx.arc(x+7,e.y+6+bob,5.5,0,7);ctx.fill();
      ctx.fillStyle="#241a22"; ctx.beginPath();ctx.arc(x-6,e.y+7+bob,2.6,0,7);ctx.arc(x+8,e.y+7+bob,2.6,0,7);ctx.fill(); }
    ctx.restore(); }
  // low barriers (slide under)
  for(const b of L.lowBars){ const x=b.x-camX; if(x<-40||x>W+40)continue; const im=propImg("vines"); if(im){ const h=GROUND_Y+240, w=72; ctx.drawImage(im, x-w/2, -240, w, h); } else { ctx.fillStyle=P.obstacle; rrect(x-22,-250,44,GROUND_Y+214,12); ctx.fill(); ctx.fillStyle="rgba(255,255,255,.18)"; rrect(x-22,-250,12,GROUND_Y+214,12); ctx.fill(); ctx.fillStyle=P.obstacle; ctx.beginPath();ctx.moveTo(x-30,GROUND_Y-36);ctx.lineTo(x+30,GROUND_Y-36);ctx.lineTo(x,GROUND_Y-18);ctx.closePath();ctx.fill(); } }
  // power-ups (floating bonus pickups)
  for(const u of L.powerups){ if(u.got)continue; const x=u.x-camX; if(x<-30||x>W+30)continue; drawPU(x, u.y+Math.sin(Date.now()/300+u.x)*4, u.kind, 15); }
  // friendly end-of-level boss — themed world art if available, else a drawn blob
  if(L.boss){ const b=L.boss, x=b.x-camX; if(x>-180&&x<W+180){ const happy=b.defeated;
    const bob=Math.sin(t*3)*4 - (b.hit>0?7:0) + (happy?-Math.abs(Math.sin(t*6))*7:0);
    const bim=propImg("boss");
    ctx.fillStyle="rgba(0,0,0,.16)"; ctx.beginPath(); ctx.ellipse(x, GROUND_Y+6, b.w*0.62, 11, 0,0,7); ctx.fill();
    if(bim){
      const hh=176*(b.hit>0?0.93:1), ww=hh*(bim.naturalWidth/bim.naturalHeight), topY=GROUND_Y+bob-hh;
      ctx.save(); if(happy){ ctx.translate(x,GROUND_Y); ctx.rotate(Math.sin(t*9)*0.05); ctx.translate(-x,-GROUND_Y); }
      ctx.drawImage(bim, x-ww/2, topY, ww, hh); ctx.restore();
      if(b.hit>0){ ctx.fillStyle="rgba(255,255,255,"+(b.hit/26).toFixed(3)+")"; ctx.beginPath(); ctx.ellipse(x, topY+hh*0.45, ww*0.42, hh*0.42,0,0,7); ctx.fill(); }
      if(!happy){ for(let i=0;i<b.maxHp;i++){ ctx.fillStyle=i<b.hp?"#ff6b8a":"rgba(255,255,255,.4)"; ctx.beginPath(); ctx.arc(x-(b.maxHp-1)*8+i*16, topY-14, 5.5,0,7); ctx.fill(); } }
      else { for(let i=0;i<7;i++){ const a=t*2.2+i*0.9; ctx.fillStyle="rgba(255,232,130,.85)"; const sx=x+Math.cos(a)*(46+8*Math.sin(t*3+i)), sy=topY+hh*0.4+Math.sin(a)*30; ctx.beginPath(); ctx.arc(sx,sy,3.2,0,7); ctx.fill(); } }
    } else {
      const bw=b.w, bh=b.h, topY=b.y-bh+bob;
      ctx.fillStyle = happy? "#7bc86a" : "#a86fb0"; rrect(x-bw/2, topY, bw, bh, 22); ctx.fill();
      ctx.fillStyle="rgba(255,255,255,.18)"; rrect(x-bw/2+6, topY+6, bw-12, 13, 9); ctx.fill();
      ctx.fillStyle="#ffd23f"; const cy=topY-2; ctx.beginPath(); ctx.moveTo(x-18,cy); ctx.lineTo(x-18,cy-14); ctx.lineTo(x-9,cy-4); ctx.lineTo(x,cy-16); ctx.lineTo(x+9,cy-4); ctx.lineTo(x+18,cy-14); ctx.lineTo(x+18,cy); ctx.closePath(); ctx.fill();
      const ey=topY+bh*0.34; ctx.fillStyle="#fff"; ctx.beginPath(); ctx.arc(x-16,ey,10,0,7); ctx.arc(x+16,ey,10,0,7); ctx.fill();
      ctx.fillStyle="#222"; const ed=happy?-2:0; ctx.beginPath(); ctx.arc(x-16+ed,ey,4.5,0,7); ctx.arc(x+16+ed,ey,4.5,0,7); ctx.fill();
      ctx.strokeStyle="#222"; ctx.lineWidth=3; ctx.beginPath(); const my=topY+bh*0.66; if(happy) ctx.arc(x,my-4,12,0.15*Math.PI,0.85*Math.PI); else ctx.arc(x,my+10,11,1.15*Math.PI,1.85*Math.PI); ctx.stroke();
      if(!happy){ for(let i=0;i<b.maxHp;i++){ ctx.fillStyle = i<b.hp? "#ff6b8a":"rgba(255,255,255,.32)"; ctx.beginPath(); ctx.arc(x-(b.maxHp-1)*7+i*14, topY-26, 5,0,7); ctx.fill(); } }
    }
  } }
  if(L.boss && !L.boss.defeated){ const bxs=L.barrierX-camX; if(bxs>-20&&bxs<W+20){ ctx.fillStyle="rgba(150,200,255,"+(0.10+0.05*Math.sin(t*4)).toFixed(3)+")"; ctx.fillRect(bxs-3,0,6,GROUND_Y+10); } }
  // goal flag
  // HH3 FLAG POLE — the finish is a pole you touch and slide down, and the flag rides
  // down with you before the next level starts.
  { const fx=L.goalX-camX;
    if(fx<W+110 && fx>-110){
      const POLE_H=210, top=GROUND_Y-POLE_H;
      const slide = poleT>0 ? Math.min(1, poleT/POLE_SLIDE) : 0;
      const flagY = top+18 + slide*(POLE_H-72);
      ctx.fillStyle="rgba(0,0,0,.16)"; ctx.beginPath(); ctx.ellipse(fx,GROUND_Y+4,26,7,0,0,7); ctx.fill();
      ctx.fillStyle="#4a3a26"; rrect(fx-18,GROUND_Y-16,36,18,5); ctx.fill();              // the plinth
      ctx.fillStyle="#8a6a45"; rrect(fx-4,top,8,POLE_H,4); ctx.fill();                    // the pole
      ctx.fillStyle="rgba(255,255,255,.30)"; ctx.fillRect(fx-2,top+4,2.5,POLE_H-10);
      ctx.fillStyle=P.flag; ctx.beginPath(); ctx.arc(fx,top,11,0,7); ctx.fill();          // the ball on top
      ctx.fillStyle="#fff3b0"; ctx.beginPath(); ctx.arc(fx-3,top-3,4,0,7); ctx.fill();
      ctx.fillStyle=P.flag;                                                               // the flag itself
      ctx.beginPath(); ctx.moveTo(fx+3,flagY); ctx.lineTo(fx+58,flagY+15); ctx.lineTo(fx+3,flagY+30); ctx.closePath(); ctx.fill();
      ctx.fillStyle="rgba(255,255,255,.35)"; ctx.beginPath(); ctx.moveTo(fx+3,flagY); ctx.lineTo(fx+34,flagY+8); ctx.lineTo(fx+3,flagY+13); ctx.closePath(); ctx.fill();
      if(poleT>0 && poleT<=POLE_SLIDE){                                                   // sparkles on the way down
        for(let i=0;i<4;i++){ const a=t*5+i*1.6; ctx.fillStyle="rgba(255,232,130,.8)";
          ctx.beginPath(); ctx.arc(fx+Math.cos(a)*(16+4*Math.sin(t*3+i)), flagY+18+Math.sin(a)*13, 2.6,0,7); ctx.fill(); }
      }
    } }
  // LAYER 6 — HH2: the canopy and the foreground ferns are a FRAME, not a curtain.
  // They are pinned to the screen edges (never the middle, where the hero plays), they
  // are drawn BEFORE the hero so he is always on top of scenery, and they are pinned to
  // the screen rather than the world so a climbing camera cannot open a gap at the top.
  { const sc=L.scene||{fore:[],top:[]};
    ctx.save(); ctx.translate(0,-camY);
    const EDGE=Math.min(190, W*0.20);
    for(const fo of sc.fore){ const sx=fo.x-camX*1.25 + Math.sin(t2()*0.7+fo.ph)*6;
      if(sx>EDGE && sx<W-EDGE) continue;                      // never over the play lane
      if(sx<-200||sx>W+200)continue; if(groundUnder(fo.x)==null)continue;
      const im=pieceImg("fern"); if(im){ ctx.globalAlpha=0.92; drawPiece(im, sx, H+28, 230*fo.s, fo.flip); ctx.globalAlpha=1; } }
    for(const tp of sc.top){ const sx=tp.x-camX*1.12;
      if(sx>W*0.30 && sx<W*0.70) continue;                    // corners only
      if(sx<-260||sx>W+260)continue; const im=pieceImg("canopy"); if(im) drawTopPiece(im, sx, 165*tp.s, tp.flip); }
    ctx.restore();
  }
  // landing dust
  for(const d of dust){ const x=d.x-camX; const a=Math.min(0.75,d.life/26).toFixed(2);
    ctx.fillStyle = d.gold ? "rgba(255,214,90,"+a+")" : "rgba(170,150,110,"+a+")";
    ctx.beginPath();ctx.arc(x,d.y,d.gold?3.6:3,0,7);ctx.fill(); }
  // hero — HH1 animation. api/story-library can only make FACE/MOOD variants of a
  // character (happy, excited, scared...), never a run or jump pose, so the poses are
  // built by moving the one watercolor cutout we have: idle breathe, a two-beat run
  // cycle (run A / run B) with a bounce and a lean, a stretch going up, a squash coming
  // down, the existing land squash, and a lean-back turn-around when skidding.
  // If the image never loads, the drawn fallback body gets the identical treatment,
  // so there is never a broken image and never a frozen hero.
  const onPole = (state==="win" && poleT>0);
  const hx = onPole ? (L.goalX-camX-20) : (player.x-camX);
  const hy = onPole ? (GROUND_Y-190 + Math.min(1,poleT/POLE_SLIDE)*130) : player.y;
  const sliding=player.slide>0 && !onPole;
  let scx=1, scy=1, lean=0, bob=0;
  const running = player.onGround && Math.abs(player.vx)>0.5;
  if(onPole){ lean=0.10; scx=0.94; scy=1.06; }        // clinging to the pole, riding it down
  else if(sliding){ /* slide keeps its own flat pose below */ }
  else if(player.skid>0){                         // turn-around: lean AWAY from where you were going
    lean = -0.30*(player.face||1); scx=1.10; scy=0.94; bob=1;
  } else if(player.land>0){ const k=player.land/8; scy=1-0.26*k; scx=1+0.26*k; }
  else if(!player.onGround){
    if(player.vy<-1){ scy=1.14; scx=0.88; lean=0.10*(player.face||1); }        // jump: stretched, tipped forward
    else if(player.vy>4){ scy=1.06; scx=0.95; lean=-0.05*(player.face||1); }   // falling: bracing
  } else if(running){
    // two-beat run cycle. sin() gives run A on one half and run B on the other:
    // the body rises and tips forward on A, drops and squashes on B.
    const ph=player.runPhase, sp=Math.min(1,Math.abs(player.vx)/(L.speed*TOP_MULT));
    const a=Math.sin(ph), b=Math.cos(ph*2);
    bob  = -Math.abs(a)*4.2*sp;
    lean = (0.16 + a*0.07)*sp*(player.face||1);
    scy  = 1 + b*0.05*sp; scx = 1 - b*0.05*sp;
  } else {                                        // idle: a slow breathe so he is never dead still
    const br=Math.sin(player.idleT*0.07);
    scy = 1 + br*0.022; scx = 1 - br*0.022; bob = br*0.8;
  }
  const fdir = onPole ? 1 : (player.face||1);
  ctx.save(); ctx.translate(hx+24, hy+64+bob); ctx.scale(scx*fdir,scy); ctx.rotate(sliding?0:((onPole?0:player.r*0.6) + lean*fdir));
  if(hero.complete && hero.naturalWidth){ if(sliding) ctx.drawImage(hero,-34,-40,68,40); else ctx.drawImage(hero,-30,-68,60,68); }
  else { ctx.fillStyle="#e8915a"; rrect(-22, sliding?-34:-60, 44, sliding?32:56, 16); ctx.fill();
         ctx.fillStyle="#fff"; ctx.beginPath(); ctx.arc(6,sliding?-22:-44,5,0,7); ctx.fill();
         ctx.fillStyle="#2a2118"; ctx.beginPath(); ctx.arc(7,sliding?-22:-44,2.4,0,7); ctx.fill(); }
  ctx.restore();
  if(shieldOn){ ctx.strokeStyle="rgba(90,170,255,.85)";ctx.lineWidth=3;ctx.beginPath();ctx.arc(hx+24,hy+28,34,0,7);ctx.stroke(); ctx.fillStyle="rgba(120,190,255,.16)";ctx.beginPath();ctx.arc(hx+24,hy+28,34,0,7);ctx.fill(); }
  if(starT>0){ ctx.fillStyle="rgba(255,220,90,.95)"; for(let s=0;s<3;s++){ const a=Date.now()/200+s*2.1; star5(hx+24+Math.cos(a)*30, hy+28+Math.sin(a)*30, 5); } }
  if(invuln>0 && !shieldOn && starT<=0 && Math.floor(invuln/6)%2===0){ ctx.fillStyle="rgba(255,255,255,.25)"; ctx.beginPath();ctx.arc(hx+24,hy+30,34,0,7);ctx.fill(); }
  // floating pop text from stomps and smashes
  for(const q of pops){ const x=q.x-camX; if(x<-60||x>W+60)continue; const a=Math.max(0,1-q.t/44);
    ctx.save(); ctx.globalAlpha=a; ctx.font="bold 20px Fredoka,sans-serif"; ctx.textAlign="center";
    ctx.lineWidth=4; ctx.strokeStyle="rgba(30,20,10,.55)"; ctx.strokeText(q.txt,x,q.y); ctx.fillStyle=q.col; ctx.fillText(q.txt,x,q.y); ctx.restore(); }
  ctx.restore();                                       // <<< end of the camera shift
  // the shared effects pipeline: particles, floating pops and the screen flash
  if(BM){ try{ BM.update(fx, 1/60); BM.draw(ctx, fx, { W, H:VH }); }catch(e){} }
  // HUD — the shared dark strip (buildable-hud.js). White canvas text was unreadable
  // on this pale sky; the shared chips are a dark tint over whatever is behind them and
  // they inset themselves clear of the shell's Home pill and Sound/Menu/Help column.
  paintHud();
  // active power-up icons: down at the bottom-left, well clear of the strip and the nav
  let pax=30; const acts=[["shield",shieldOn?1:0],["magnet",magnetT],["spring",springT],["star",starT]];
  for(const [k,v] of acts){ if(v>0){ drawPU(pax,H-52,k,12); pax+=32; } }
  // progress bar — inset so the thumb pads at the bottom corners never sit on it
  { const inset=Math.min(150, W*0.17), by=VH-20, bw=W-inset*2;
    const pg=Math.min(1, player.x/L.goalX);
    ctx.fillStyle="rgba(10,14,26,.30)"; rrect(inset,by,bw,9,5);ctx.fill();
    ctx.fillStyle=P.flag; rrect(inset,by,bw*pg,9,5);ctx.fill(); }
  // music track name toast (shown briefly when the song is changed)
  if(musicToast>0){ musicToast--; const nm=Music.current(); ctx.save(); ctx.font="bold 16px Fredoka,sans-serif"; ctx.textAlign="center"; const tw=ctx.measureText(nm).width+50, x=W/2, y=Math.round(VH*0.16)+20; ctx.globalAlpha=Math.max(0,Math.min(1,musicToast/30)); ctx.fillStyle="rgba(20,30,50,.74)"; rrect(x-tw/2,y-16,tw,30,15); ctx.fill(); ctx.fillStyle="#ffd23f"; ctx.beginPath(); ctx.arc(x-tw/2+18,y+4,3.4,0,7); ctx.fill(); ctx.fillRect(x-tw/2+20.4,y-8,2,12); ctx.fillStyle="#fff"; ctx.fillText(nm, x+8, y+5); ctx.restore(); }
  // banners
  if(state==="win" && (poleT===0 || poleT>POLE_SLIDE)){
    banner(li<LEVELS.length-1 ? "World Complete!" : "You Win!",
           "You found "+starsGot+"/"+totalStars+" stars  \u00b7  "+coinsGot+" coins");
  }
  if(state==="lose"){ banner("Try Again!","Tap to restart this level"); }
}
function t2(){return Date.now()/1000;}
// --- shared HUD strip. Safe no-op headless (node QA has no document.body). ---
let hud=null;
try{ if(typeof window!=="undefined" && window.BuildableHUD && document.body){ BuildableHUD.setAccent("#8fc46a"); hud=BuildableHUD.mount(c); } }catch(e){ hud=null; }
function paintHud(){
  if(!hud) return;
  try{ hud.set({
    left:  [{ text:L.name, soft:"Lv "+(li+1)+"/"+LEVELS.length }],
    right: [{ coin: coinsGot+" / "+totalCoins, stars:{ got:starsGot, of:totalStars } }, { heart: hearts }]
  }); }catch(e){}
}
// --- shared in-app nav bridge: hide this engine's own buttons in the app shell and let
// the shell's single Sound / Menu / Help column drive them (HUD-AND-NAV-RULES rule 1). ---
try{ if(typeof window!=="undefined" && window.BuildableGameNav){
  BuildableGameNav.register({
    hide: ["bMute","bMusic","bHelp"],
    onSound: ()=>{ soundOn=!soundOn; musicOn=soundOn; actx(); if(soundOn&&musicOn) Music.start(); else Music.stop(); paintMute(); },
    onMenu:  ()=>{ startDemo(); },
    onHelp:  ()=>{ startDemo(); },
    soundOn: ()=>soundOn,
  });
} }catch(e){}
// LAW 2 — the ONE shared floating card, never a greyed-out screen. Through the Feel Kit
// so it picks up the platform accent; straight to the card lib if the Kit is not loaded.
function banner(t,s){
  const lines=[{t:t,s:32,w:800,c:"#fff"}].concat(s?[{t:s,s:18,w:600,c:"#cfd3ff"}]:[]);
  if(FEEL && FEEL.winCard){ FEEL.winCard(ctx,W,VH,lines); return; }
  if(typeof BuildableWin!=="undefined" && BuildableWin.card) BuildableWin.card(ctx,W,VH,lines);
}


const hintEl=document.getElementById('hint');
let hintGone=false;
function tickHint(){                       // the hint has done its job once the kid is moving
  if(hintGone||!hintEl) return;
  if(started && !demoMode && gameT>200){ hintGone=true; hintEl.style.transition='opacity .6s'; hintEl.style.opacity='0'; }
}
function frame(){ update(); draw(); tickHint(); requestAnimationFrame(frame); }
startDemo();
requestAnimationFrame(frame);

// expose for QA / picker
window.BK_GAME = { startLevel:(i)=>startLevel(i), levelCount:()=>LEVELS.length, cast:()=>CAST.slice(), setBot:(b)=>{demoMode=false;botMode=b;started=true;paused=false;}, state:()=>state, level:()=>li,
  dbg:()=>({px:Math.round(player.x), goal:Math.round(L.goalX), started, runV:player.runV, hp:hearts, onG:player.onGround, vy:Math.round(player.vy), state}),
  // QA harness: run a "perfect player" headlessly (no rAF) through a level.
  frameStep:(n)=>{ demoMode=false; paused=false; for(let i=0;i<(n||1);i++){ update(); draw(); } },
  // --- test seam for qa-hopheroes.mjs: drive the hero one frame at a time, read the
  // internals, and re-fit the view, all without a browser. Nothing here is used by the
  // game itself. ---
  test:{
    boot:(i)=>{ demoMode=false; paused=false; botMode=false; hearts=3; startLevel(i||0); started=true; inputLeft=false; inputRight=false; jumpHeld=false; },
    step:(n)=>{ for(let k=0;k<(n||1);k++) update(); },
    paint:()=>draw(),
    jump:()=>doJump(),
    slide:()=>doSlide(),
    groundAt:(x)=>groundUnder(x),
    view:(vw,vh)=>{ if(vw&&vh){ W=Math.round(Math.max(560,Math.min(1600,H*(vw/vh)))); VH=Math.max(H,Math.round(W*vh/vw)); } return {W,VH}; },
    set:(o)=>{ o=o||{};
      if('x' in o)player.x=o.x; if('y' in o)player.y=o.y; if('vx' in o)player.vx=o.vx; if('vy' in o)player.vy=o.vy;
      if('onGround' in o)player.onGround=o.onGround; if('left' in o)inputLeft=!!o.left; if('right' in o)inputRight=!!o.right;
      if('hold' in o)jumpHeld=!!o.hold; },
    get:()=>({ x:player.x, y:player.y, vx:player.vx, vy:player.vy, onGround:player.onGround, coyote:player.coyote,
               buf:player.buf, skid:player.skid, dj:player.dj, camX, camY, W, VH, skyPad:skyPad(), state, poleT,
               coinsGot, totalCoins, starsGot, hearts }),
    level:()=>L,
    pits:()=>pitsOf(L),
    consts:()=>({ TOP_MULT, COYOTE_FRAMES, BUFFER_FRAMES, GROUND_Y, H, TILE, JUMP, GRAV, RUN_BASE }),
  },
  sim:(idx, maxFrames)=>{ demoMode=false; hearts=3; startLevel(idx); paused=false; botMode=true; started=true; inputLeft=false; inputRight=false; let f=0; const cap=maxFrames||8000;
    while(state==="play" && f<cap){ update(); f++; } botMode=false; inputLeft=false; inputRight=false; return { level:idx, result:state, frames:f, coins:coinsGot+"/"+totalCoins, hearts }; } };
</script>
