<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Buildable Runner — engine</title>
<style>
  html,body{margin:0;height:100%;background:#0e1020;overflow:hidden;touch-action:none;font-family:'Fredoka',-apple-system,sans-serif}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{background:#000;max-width:100%;max-height:100%;image-rendering:auto;border-radius:14px}
  #hint{position:fixed;left:0;right:0;bottom:14px;text-align:center;color:#fff;opacity:.7;font-size:15px;pointer-events:none}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="900" height="540"></canvas></div>
<div id="hint">Tap to jump · swipe down to slide</div>
<script>
// ============================================================================
//  FIXED ENGINE — never regenerated. A game = this engine + GAME_CONFIG (data).
//  Levels are RECIPES (difficulty knobs); the engine builds each level from them
//  so gaps are always jumpable => a level can never be unclearable.
// ============================================================================
const GAME_CONFIG = window.GAME_CONFIG || {
  name: "Bramble's Dash",
  world: "enchanted-forest", artStyle: "watercolor",
  artBase: "https://www.buildablekids.com/api/game-art",
  heroUrl: "https://www.buildablekids.com/api/story-library?img=character:bunny&style=watercolor&emo=happy",
  bgUrl:   "https://www.buildablekids.com/api/story-library?img=world:enchanted-forest&style=watercolor",
  palette: { ground:"#6b9b4a", groundTop:"#8fc46a", dirt:"#5a4332", coin:"#ffd23f", obstacle:"#7a4a86", enemy:"#c0566f", flag:"#ffd23f", hud:"#ffffff" },
  levels: [
    { name:"Sunny Start",  speed:3.2, length:42, gapChance:0.16, gapMax:2, obstacleChance:0.10, enemyChance:0.06, lowChance:0.16, coinChance:0.40, powerupChance:0.06 },
    { name:"Mushroom Run",  speed:3.8, length:54, gapChance:0.20, gapMax:3, obstacleChance:0.14, enemyChance:0.12, lowChance:0.18, coinChance:0.42, powerupChance:0.06 },
    { name:"Firefly Finale",speed:4.4, length:64, gapChance:0.24, gapMax:3, obstacleChance:0.16, enemyChance:0.16, lowChance:0.20, coinChance:0.44, powerupChance:0.07 },
  ],
  powerups: ["shield","magnet","spring","star"],   // the kid's chosen set; engine only spawns from here
};

const W=900, H=540, TILE=60;                  // world units
const GROUND_Y = H-110;                        // top of the ground band
const GRAV=0.58, JUMP=-13.8, RUN_BASE=3.2; // physics
const AIR_FRAMES = 2*Math.abs(JUMP)/GRAV;  // frames a full jump stays airborne
const SLIDE_FRAMES=34;
const c=document.getElementById('c'), ctx=c.getContext('2d');

// --- assets ---
const hero=new Image(); hero.crossOrigin="anonymous"; hero.src=GAME_CONFIG.heroUrl;
const bg=new Image();   bg.crossOrigin="anonymous";   bg.src=GAME_CONFIG.bgUrl;
// world-piece cutouts for the parallax layers
const WORLD=GAME_CONFIG.world||"enchanted-forest", ARTSTYLE=GAME_CONFIG.artStyle||"watercolor", ART_BASE=GAME_CONFIG.artBase||"https://www.buildablekids.com/api/game-art";
const PIECE_NAMES=["far","tree_a","tree_b","bush_a","bush_b","fern","mushroom","canopy"];
const PC={}; for(const nm of PIECE_NAMES){ const im=new Image(); im.crossOrigin="anonymous"; im.src=ART_BASE+"?img="+WORLD+":"+nm+"&style="+ARTSTYLE; PC[nm]=im; }

// --- deterministic RNG so a level is reproducible (and QA-able) ---
function mulberry(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

// --- build one level's layout from its recipe (always clearable) ---
function buildLevel(lv, idx){
  const rnd=mulberry(1000+idx*97);
  const P=GAME_CONFIG.palette;
  const ground=[], obstacles=[], enemies=[], coins=[], lowBars=[], decos=[], powerups=[];
  let x=0; const n=lv.length;
  let segStart=0;
  // largest gap (in tiles) a full jump can comfortably clear at this level's speed
  const speed = lv.speed||RUN_BASE;
  const safeGapTiles = Math.max(1, Math.floor(speed*AIR_FRAMES*0.62/TILE) - 1);
  const landTiles = Math.ceil(speed*AIR_FRAMES/TILE)+1;  // tiles a jump covers -> low bars must wait until player has LANDED (can't slide mid-air)
  let lastHaz = -99;                       // enforce breathing room between hazards
  const SPACING = 3;                        // tiles of safe ground after each hazard
  // first 3 tiles always solid (safe spawn)
  for(let i=0;i<n;i++){
    const tx=i*TILE;
    const canHaz = i>3 && i<n-3 && (i-lastHaz)>=SPACING;   // gated by spacing
    if(canHaz && rnd()<lv.gapChance){
      // close current ground segment, make a jumpable gap (<= gapMax tiles)
      ground.push({x0:segStart, x1:tx, y:GROUND_Y});
      const maxGap=Math.max(1, Math.min(lv.gapMax, safeGapTiles));
      const gapTiles=1+Math.floor(rnd()*maxGap);
      i+=gapTiles; segStart=(i)*TILE; lastHaz=i;
      continue;
    }
    // obstacle (a block to jump) on solid ground
    if(canHaz && rnd()<lv.obstacleChance){ obstacles.push({x:tx+TILE/2, y:GROUND_Y, w:34, h:46}); lastHaz=i; }
    // enemy walking on ground
    else if(canHaz && rnd()<lv.enemyChance){ enemies.push({x:tx+TILE/2, y:GROUND_Y-26, w:40, h:40, dir:-1, base:tx+TILE/2, range:40, dead:false}); lastHaz=i; }
    else if(canHaz && (lv.lowChance||0)>0 && (i-lastHaz)>=landTiles && rnd()<lv.lowChance){ lowBars.push({x:tx+TILE/2}); lastHaz=i; }
    // coin arc (independent of hazards)
    if(rnd()<lv.coinChance){ coins.push({x:tx+TILE/2, y:GROUND_Y-70-Math.floor(rnd()*60), got:false}); }
  }
  ground.push({x0:segStart, x1:n*TILE, y:GROUND_Y});
  // cosmetic foreground props + bonus power-ups (SEPARATE rng so hazard layout/QA stays identical)
  const POOL=(GAME_CONFIG.powerups&&GAME_CONFIG.powerups.length)?GAME_CONFIG.powerups:["shield"];
  const rd=mulberry(7000+idx*131);
  for(let i=3;i<n;i++){ if(rd()<0.55) decos.push({x:i*TILE+rd()*TILE, kind: rd()<0.6?'bush':'grass', s:0.7+rd()*0.7}); }
  const rp=mulberry(9000+idx*53);
  for(let i=6;i<n-3;i++){ if(rp()<(lv.powerupChance||0.05)) powerups.push({x:i*TILE+TILE/2, y:GROUND_Y-70-Math.floor(rp()*40), kind:POOL[Math.floor(rp()*POOL.length)], got:false}); }
  const goalX=n*TILE - TILE*1.4;
  return { ground, obstacles, enemies, coins, lowBars, decos, powerups, goalX, worldEnd:n*TILE, name:lv.name, speed:lv.speed||RUN_BASE };
}

// --- scatter the world pieces across parallax layers (cosmetic; separate RNG so QA is unaffected) ---
function buildScene(L, idx){
  const we=L.worldEnd, S={mid:[],near:[],fore:[],top:[],flies:[]};
  const r1=mulberry(21000+idx*7);
  for(let x=140; x<we; x+= 230+r1()*210){ S.mid.push({x, piece: r1()<0.58?"tree_a":"tree_b", s:0.85+r1()*0.6, flip:r1()<0.5, ph:r1()*6.28}); }
  const r2=mulberry(33000+idx*7);
  for(let x=70; x<we; x+= 140+r2()*150){ const t=r2(); S.near.push({x, piece: t<0.4?"bush_a":t<0.7?"bush_b":"mushroom", s:0.5+r2()*0.45, flip:r2()<0.5, ph:r2()*6.28}); }
  const r3=mulberry(44000+idx*7);
  for(let x=240; x<we; x+= 470+r3()*260){ S.fore.push({x, piece:"fern", s:0.95+r3()*0.7, flip:r3()<0.5, ph:r3()*6.28}); }
  const r4=mulberry(55000+idx*7);
  for(let x=120; x<we; x+= 360+r4()*240){ S.top.push({x, piece:"canopy", s:0.9+r4()*0.5, flip:r4()<0.5}); }
  const r5=mulberry(66000+idx*7);
  for(let i=0;i<48;i++){ S.flies.push({x:r5()*we, y:60+r5()*(GROUND_Y-50), ph:r5()*6.28, sp:0.4+r5()*0.8}); }
  return S;
}

// --- game state ---
let LEVELS = GAME_CONFIG.levels.map((lv,i)=>buildLevel(lv,i));
let li=0, L=LEVELS[0];
let player, camX, hearts, coinsGot, totalCoins, state, invuln, botMode=false, doneMsgT=0, started=false;
let shieldOn=false, magnetT=0, springT=0, starT=0;  // power-up effect timers

function startLevel(i){
  li=Math.max(0,Math.min(LEVELS.length-1,i)); L=LEVELS[li];
  player={x:90, y:GROUND_Y-60, vy:0, onGround:true, r:0, runV:L.speed, dj:false, slide:0};
  camX=0; invuln=0; state="play"; coinsGot=0; totalCoins=L.coins.length; doneMsgT=0;
  shieldOn=false; magnetT=0; springT=0; starT=0;
  if(hearts==null) hearts=3;
  if(!L.scene) L.scene=buildScene(L, li);
}
startLevel(0);

// --- input ---
let jumpHeld=false;
function doJump(){
  if(!started){started=true;}
  if(player.slide>0) player.slide=0;                       // jump cancels a slide
  const jv = springT>0 ? 1.2 : 1;                          // spring power-up = higher jump
  if(player.onGround){ player.vy=JUMP*jv; player.onGround=false; player.dj=true; }
  else if(player.dj){ player.vy=JUMP*0.82*jv; player.dj=false; }
  jumpHeld=true;
}
function doSlide(){ if(!started){started=true;return;} if(player.onGround && player.slide<=0){ player.slide=SLIDE_FRAMES; } }
addEventListener('keydown',e=>{ if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();doJump();} if(e.code==='ArrowDown'){e.preventDefault();doSlide();} if(e.key==='b')botMode=!botMode; });
addEventListener('keyup',e=>{ if(e.code==='Space'||e.code==='ArrowUp')jumpHeld=false; });
let _psy=0,_pact=false;
c.addEventListener('pointerdown',e=>{ e.preventDefault(); _psy=e.clientY; _pact=false; });
c.addEventListener('pointermove',e=>{ if(!_pact && (e.clientY-_psy)>34){ _pact=true; if(state==="play") doSlide(); } });
c.addEventListener('pointerup',e=>{ if(!_pact){ if(state==="win"){ if(li<LEVELS.length-1) startLevel(li+1); else { hearts=3; startLevel(0);} } else if(state==="lose"){ hearts=3; startLevel(li);} else { doJump(); } } _pact=true; jumpHeld=false; });

// --- helpers: is there solid ground under world-x? ---
function groundUnder(wx){ for(const g of L.ground){ if(wx>=g.x0 && wx<g.x1) return g.y; } return null; }

// --- simple "perfect player" bot: jump before a gap or obstacle/enemy ---
function botThink(){
  if(player.onGround){
    for(const b of L.lowBars){ const d=b.x-(player.x+24); if(d>2 && d<60){ if(player.slide<=0) doSlide(); return; } }  // duck under
    if(groundUnder(player.x+48)==null){ doJump(); return; }   // gap edge just ahead
    for(const o of L.obstacles){ const d=o.x-(player.x+24); if(d>4 && d<60){ doJump(); return; } }
    for(const e of L.enemies){ if(!e.dead){ const d=e.x-(player.x+24); if(d>4 && d<54){ doJump(); return; } } }
  } else { jumpHeld=true; }   // hold for full height/distance while airborne
}

// --- update ---
function update(){
  if(state!=="play"){ doneMsgT++; return; }
  if(botMode) botThink();
  if(!started) return;                       // wait for first input
  if(player.slide>0) player.slide--;
  if(magnetT>0)magnetT--; if(springT>0)springT--; if(starT>0)starT--;
  // run
  player.x += player.runV;
  // gravity + variable jump height
  player.vy += GRAV * (jumpHeld && player.vy<0 ? 0.62 : 1);
  player.y += player.vy;
  // ground / gaps
  const gy=groundUnder(player.x+24);
  if(player.vy>=0 && gy!=null && player.y+60>=gy){ player.y=gy-60; player.vy=0; if(!player.onGround){player.onGround=true;} player.dj=false; }
  else { player.onGround=false; }
  player.r = player.onGround?0:Math.max(-0.5,Math.min(0.5,player.vy*0.03));
  // fell in a gap
  if(player.y>H+40){ loseHeart(true); return; }
  if(invuln>0) invuln--;
  // magnet power-up: pull nearby coins toward the hero
  if(magnetT>0){ for(const k of L.coins){ if(k.got)continue; const dx=(player.x+24)-k.x, dy=(player.y+30)-k.y; if(dx*dx+dy*dy<170*170){ k.x+=dx*0.16; k.y+=dy*0.16; } } }
  // coins
  for(const k of L.coins){ if(!k.got && Math.abs((player.x+24)-k.x)<34 && Math.abs((player.y+30)-k.y)<40){ k.got=true; coinsGot++; } }
  // power-up pickups
  for(const u of L.powerups){ if(u.got)continue; if(Math.abs((player.x+24)-u.x)<36 && Math.abs((player.y+30)-u.y)<44){ u.got=true; if(u.kind==="shield")shieldOn=true; else if(u.kind==="magnet")magnetT=360; else if(u.kind==="spring")springT=360; else if(u.kind==="star")starT=360; else if(u.kind==="heart"&&hearts<3)hearts++; } }
  // enemies (walk a little)
  for(const e of L.enemies){ if(e.dead)continue; e.x+=e.dir*0.6; if(Math.abs(e.x-e.base)>e.range)e.dir*=-1;
    const dx=Math.abs((player.x+24)-e.x), dy=(player.y+60)-e.y;
    if(dx<34 && Math.abs((player.y+30)-e.y)<46){
      if(starT>0){ e.dead=true; }                                   // star smashes enemies
      else if(player.vy>0 && (player.y+60)-e.y<26){ e.dead=true; player.vy=JUMP*0.6; }  // stomp
      else if(invuln<=0){ takeHit(); }
    }
  }
  // obstacles
  for(const o of L.obstacles){ const dx=Math.abs((player.x+24)-o.x); if(dx<28 && (player.y+60)>o.y-o.h+6 && (player.y+30)<o.y && invuln<=0){ takeHit(); } }
  // low barriers: must SLIDE under (can't jump over)
  for(const b of L.lowBars){ const dx=Math.abs((player.x+24)-b.x); if(dx<26){ const heroTop=player.y+(player.slide>0?26:0); if(heroTop < GROUND_Y-36 && invuln<=0){ takeHit(); } } }
  // reach goal
  if(player.x>=L.goalX){ state="win"; }
}
function takeHit(){ if(starT>0) return; if(shieldOn){ shieldOn=false; invuln=70; return; } loseHeart(false); }
function loseHeart(fell){
  hearts--; invuln=70;
  if(hearts<=0){ state="lose"; return; }
  // gentle: nudge back to safe ground
  if(fell){ let sx=player.x-TILE*2; while(sx>90 && groundUnder(sx)==null) sx-=20; player.x=Math.max(90,sx); player.y=GROUND_Y-80; player.vy=0; }
}

// --- draw ---
function rrect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function pieceImg(nm){ const im=PC[nm]; return (im&&im.complete&&im.naturalWidth)?im:null; }
function drawPiece(im, sx, baseY, h, flip){ const w=h*(im.naturalWidth/im.naturalHeight); ctx.save(); ctx.translate(sx,0); if(flip)ctx.scale(-1,1); ctx.drawImage(im,-w/2,baseY-h,w,h); ctx.restore(); }
function drawTopPiece(im, sx, h, flip){ const w=h*(im.naturalWidth/im.naturalHeight); ctx.save(); ctx.translate(sx,0); if(flip)ctx.scale(-1,1); ctx.drawImage(im,-w/2,-12,w,h); ctx.restore(); }
function star5(cx,cy,r){ ctx.beginPath(); for(let i=0;i<10;i++){ const a=-Math.PI/2+i*Math.PI/5; const rr=i%2?r*0.45:r; ctx.lineTo(cx+Math.cos(a)*rr, cy+Math.sin(a)*rr);} ctx.closePath(); ctx.fill(); }
function drawDeco(x,baseY,d){ const s=d.s||1; if(d.kind==='bush'){ ctx.fillStyle="rgba(38,64,32,0.9)"; ctx.beginPath();ctx.arc(x,baseY,24*s,Math.PI,0);ctx.arc(x+16*s,baseY,17*s,Math.PI,0);ctx.arc(x-16*s,baseY,17*s,Math.PI,0);ctx.closePath();ctx.fill(); } else { ctx.strokeStyle="rgba(38,64,32,0.85)"; ctx.lineWidth=3; for(let b=-2;b<=2;b++){ ctx.beginPath();ctx.moveTo(x+b*5,baseY);ctx.quadraticCurveTo(x+b*5+b*2,baseY-16*s,x+b*6,baseY-26*s);ctx.stroke(); } } }
function drawPU(x,y,kind,r){ r=r||15; const col={shield:"#4aa3ff",magnet:"#e0566f",spring:"#5fc46a",star:"#ffd23f",heart:"#e0566f"}[kind]||"#fff";
  ctx.fillStyle="rgba(0,0,0,.18)"; ctx.beginPath();ctx.arc(x,y+2,r+2,0,7);ctx.fill();
  ctx.fillStyle="#fff"; ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
  ctx.fillStyle=col; ctx.beginPath();ctx.arc(x,y,r-3,0,7);ctx.fill();
  ctx.fillStyle="#fff"; ctx.strokeStyle="#fff"; ctx.lineWidth=Math.max(2,r/6);
  if(kind==="shield"){ ctx.beginPath();ctx.moveTo(x,y-r*0.5);ctx.lineTo(x+r*0.5,y-r*0.2);ctx.lineTo(x+r*0.5,y+r*0.15);ctx.quadraticCurveTo(x,y+r*0.7,x,y+r*0.7);ctx.quadraticCurveTo(x,y+r*0.7,x-r*0.5,y+r*0.15);ctx.lineTo(x-r*0.5,y-r*0.2);ctx.closePath();ctx.fill(); }
  else if(kind==="star"){ star5(x,y,r*0.62); }
  else if(kind==="spring"){ ctx.beginPath();ctx.moveTo(x-r*0.45,y+r*0.12);ctx.lineTo(x,y-r*0.5);ctx.lineTo(x+r*0.45,y+r*0.12);ctx.stroke(); ctx.beginPath();ctx.moveTo(x-r*0.45,y+r*0.45);ctx.lineTo(x,y-r*0.12);ctx.lineTo(x+r*0.45,y+r*0.45);ctx.stroke(); }
  else if(kind==="magnet"){ ctx.lineWidth=Math.max(3,r/3); ctx.beginPath();ctx.arc(x,y-r*0.1,r*0.45,Math.PI,0,false);ctx.stroke(); ctx.beginPath();ctx.moveTo(x-r*0.45,y-r*0.1);ctx.lineTo(x-r*0.45,y+r*0.45);ctx.moveTo(x+r*0.45,y-r*0.1);ctx.lineTo(x+r*0.45,y+r*0.45);ctx.stroke(); }
  else if(kind==="heart"){ heart(x,y-r*0.3,r*0.5); }
}
function heart(x,y,s){ctx.beginPath();ctx.moveTo(x,y+s*0.3);ctx.bezierCurveTo(x,y,x-s,y,x-s,y+s*0.35);ctx.bezierCurveTo(x-s,y+s*0.7,x,y+s*0.9,x,y+s*1.15);ctx.bezierCurveTo(x,y+s*0.9,x+s,y+s*0.7,x+s,y+s*0.35);ctx.bezierCurveTo(x+s,y,x,y,x,y+s*0.3);ctx.closePath();ctx.fill();}
function draw(){
  const P=GAME_CONFIG.palette;
  camX = Math.max(0, player.x-220);
  const t=Date.now()/1000, SC=L.scene||{mid:[],near:[],fore:[],top:[],flies:[]};
  // LAYER 1 — sky gradient
  const sky=ctx.createLinearGradient(0,0,0,H); sky.addColorStop(0,"#cfeaff"); sky.addColorStop(.55,"#dff0d6"); sky.addColorStop(1,"#eef6dc"); ctx.fillStyle=sky; ctx.fillRect(0,0,W,H);
  // soft god-rays
  ctx.save(); ctx.globalCompositeOperation="lighter";
  for(let i=0;i<4;i++){ const a=0.05+0.035*Math.sin(t*0.5+i*1.7); ctx.fillStyle="rgba(255,250,205,"+a.toFixed(3)+")"; const x=((150+i*240-(camX*0.1))%1100+1100)%1100 - 100; ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x+80,0);ctx.lineTo(x-10,H);ctx.lineTo(x-110,H);ctx.closePath();ctx.fill(); }
  ctx.restore();
  // LAYER 2 — far misty forest band (slow parallax, mirror-tiled)
  { const im=pieceImg("far"); if(im){ const h=H*0.62, w=h*(im.naturalWidth/im.naturalHeight), par=camX*0.12, i0=Math.floor(par/w); ctx.globalAlpha=0.85; for(let i=i0-1;;i++){ const sx=Math.round(i*w-par); if(sx>W)break; ctx.save();ctx.translate(sx,0); if(((i%2)+2)%2!==0){ctx.translate(w,0);ctx.scale(-1,1);} ctx.drawImage(im,0,GROUND_Y-h+34,w,h); ctx.restore(); } ctx.globalAlpha=1; } }
  // LAYER 3 — mid trees (parallax 0.4), rooted behind the ground band
  for(const m of SC.mid){ const sx=m.x-camX*0.4 + Math.sin(t*0.5+m.ph)*3; if(sx<-260||sx>W+260)continue; const im=pieceImg(m.piece); if(im) drawPiece(im, sx, GROUND_Y+26, 300*m.s, m.flip); }
  // LAYER 4 — near bushes / mushrooms (parallax 0.66)
  for(const nr of SC.near){ const sx=nr.x-camX*0.66 + Math.sin(t*0.8+nr.ph)*2; if(sx<-160||sx>W+160)continue; const im=pieceImg(nr.piece); if(im) drawPiece(im, sx, GROUND_Y+16, 150*nr.s, nr.flip); }
  // fireflies drifting in the air
  for(const f of SC.flies){ const sx=((f.x-camX*0.8)%W+W)%W; const y=f.y+Math.sin(t*f.sp+f.ph)*16; const a=0.3+0.4*Math.abs(Math.sin(t*1.6*f.sp+f.ph)); ctx.fillStyle="rgba(255,242,170,"+(a*0.25).toFixed(2)+")"; ctx.beginPath();ctx.arc(sx,y,6,0,7);ctx.fill(); ctx.fillStyle="rgba(255,244,180,"+a.toFixed(2)+")"; ctx.beginPath();ctx.arc(sx,y,2.3,0,7);ctx.fill(); }
  // ground segments
  for(const g of L.ground){ const sx=g.x0-camX, ex=g.x1-camX; if(ex<-40||sx>W+40)continue;
    ctx.fillStyle=P.dirt; ctx.fillRect(sx,g.y+14,ex-sx,H-g.y); ctx.fillStyle=P.ground; ctx.fillRect(sx,g.y,ex-sx,18); ctx.fillStyle=P.groundTop; ctx.fillRect(sx,g.y,ex-sx,6); }
  // coins
  for(const k of L.coins){ if(k.got)continue; const x=k.x-camX; if(x<-30||x>W+30)continue; ctx.fillStyle=P.coin; ctx.beginPath();ctx.arc(x,k.y,11,0,7);ctx.fill(); ctx.fillStyle="rgba(255,255,255,.6)";ctx.beginPath();ctx.arc(x-3,k.y-3,3,0,7);ctx.fill(); }
  // obstacles (crystals)
  for(const o of L.obstacles){ const x=o.x-camX; if(x<-40||x>W+40)continue; ctx.fillStyle=P.obstacle; ctx.beginPath();ctx.moveTo(x,o.y-o.h);ctx.lineTo(x+o.w/2,o.y);ctx.lineTo(x-o.w/2,o.y);ctx.closePath();ctx.fill(); ctx.fillStyle="rgba(255,255,255,.25)";ctx.beginPath();ctx.moveTo(x,o.y-o.h);ctx.lineTo(x+o.w/4,o.y-o.h/2);ctx.lineTo(x-o.w/6,o.y-o.h/3);ctx.closePath();ctx.fill(); }
  // enemies (little blobs)
  for(const e of L.enemies){ if(e.dead)continue; const x=e.x-camX; if(x<-40||x>W+40)continue; ctx.fillStyle=P.enemy; rrect(x-20,e.y-6,40,34,16);ctx.fill(); ctx.fillStyle="#fff"; ctx.beginPath();ctx.arc(x-7,e.y+6,5,0,7);ctx.arc(x+7,e.y+6,5,0,7);ctx.fill(); ctx.fillStyle="#222"; ctx.beginPath();ctx.arc(x-6,e.y+7,2.4,0,7);ctx.arc(x+8,e.y+7,2.4,0,7);ctx.fill(); }
  // low barriers (slide under)
  for(const b of L.lowBars){ const x=b.x-camX; if(x<-40||x>W+40)continue; ctx.fillStyle=P.obstacle; rrect(x-22,-12,44,GROUND_Y-24,12); ctx.fill(); ctx.fillStyle="rgba(255,255,255,.18)"; rrect(x-22,-12,12,GROUND_Y-24,12); ctx.fill(); ctx.fillStyle=P.obstacle; ctx.beginPath();ctx.moveTo(x-30,GROUND_Y-36);ctx.lineTo(x+30,GROUND_Y-36);ctx.lineTo(x,GROUND_Y-18);ctx.closePath();ctx.fill(); }
  // power-ups (floating bonus pickups)
  for(const u of L.powerups){ if(u.got)continue; const x=u.x-camX; if(x<-30||x>W+30)continue; drawPU(x, u.y+Math.sin(Date.now()/300+u.x)*4, u.kind, 15); }
  // goal flag
  const fx=L.goalX-camX; if(fx<W+60){ ctx.strokeStyle="#6a4a2a";ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(fx,GROUND_Y);ctx.lineTo(fx,GROUND_Y-120);ctx.stroke(); ctx.fillStyle=P.flag; ctx.beginPath();ctx.moveTo(fx,GROUND_Y-120);ctx.lineTo(fx+52,GROUND_Y-104);ctx.lineTo(fx,GROUND_Y-86);ctx.closePath();ctx.fill(); }
  // hero
  const hx=player.x-camX, hy=player.y;
  const sliding=player.slide>0;
  ctx.save(); ctx.translate(hx+24,hy+30); ctx.rotate(sliding?0:player.r);
  if(hero.complete && hero.naturalWidth){ if(sliding) ctx.drawImage(hero,-34,6,68,40); else ctx.drawImage(hero,-30,-34,60,68); }
  else { ctx.fillStyle="#e8915a"; rrect(-22,sliding?2:-26,44,sliding?32:56,16); ctx.fill(); }
  ctx.restore();
  if(shieldOn){ ctx.strokeStyle="rgba(90,170,255,.85)";ctx.lineWidth=3;ctx.beginPath();ctx.arc(hx+24,hy+28,34,0,7);ctx.stroke(); ctx.fillStyle="rgba(120,190,255,.16)";ctx.beginPath();ctx.arc(hx+24,hy+28,34,0,7);ctx.fill(); }
  if(starT>0){ ctx.fillStyle="rgba(255,220,90,.95)"; for(let s=0;s<3;s++){ const a=Date.now()/200+s*2.1; star5(hx+24+Math.cos(a)*30, hy+28+Math.sin(a)*30, 5); } }
  if(invuln>0 && !shieldOn && starT<=0 && Math.floor(invuln/6)%2===0){ ctx.fillStyle="rgba(255,255,255,.25)"; ctx.beginPath();ctx.arc(hx+24,hy+30,34,0,7);ctx.fill(); }
  // LAYER 6 — foreground ferns (parallax in front) + canopy framing the top
  { const sc=L.scene||{fore:[],top:[]};
    for(const fo of sc.fore){ const sx=fo.x-camX*1.25 + Math.sin(t2()*0.7+fo.ph)*6; if(sx<-200||sx>W+200)continue; const im=pieceImg("fern"); if(im) drawPiece(im, sx, H+28, 240*fo.s, fo.flip); }
    for(const tp of sc.top){ const sx=tp.x-camX*1.12; if(sx<-260||sx>W+260)continue; const im=pieceImg("canopy"); if(im) drawTopPiece(im, sx, 165*tp.s, tp.flip); }
  }
  // HUD
  ctx.fillStyle=P.hud; ctx.font="bold 22px Fredoka,sans-serif"; ctx.textAlign="left";
  ctx.fillText(L.name+"   Lv "+(li+1)+"/"+LEVELS.length, 18, 34);
  ctx.textAlign="right"; ctx.fillText(coinsGot+" / "+totalCoins, W-18, 34);
  ctx.fillStyle=P.enemy; for(let i=0;i<hearts;i++){ heart(W-44-i*30, 48, 11); }
  // active power-up icons (top-left, under the level name)
  let pax=30; const acts=[["shield",shieldOn?1:0],["magnet",magnetT],["spring",springT],["star",starT]];
  for(const [k,v] of acts){ if(v>0){ drawPU(pax,66,k,12); pax+=32; } }
  // progress bar
  const pg=Math.min(1, player.x/L.goalX); ctx.fillStyle="rgba(255,255,255,.25)"; rrect(18,H-22,W-36,8,4);ctx.fill(); ctx.fillStyle=P.flag; rrect(18,H-22,(W-36)*pg,8,4);ctx.fill();
  // banners
  if(state==="win"){ banner(li<LEVELS.length-1?"Level Complete!":"You Win!", li<LEVELS.length-1?"Tap for next level":"Tap to play again"); }
  if(state==="lose"){ banner("Try Again!","Tap to restart this level"); }
  if(!started && state==="play"){ ctx.fillStyle="rgba(0,0,0,.35)";ctx.fillRect(0,0,W,H); ctx.fillStyle="#fff";ctx.textAlign="center";ctx.font="bold 34px Fredoka,sans-serif";ctx.fillText(GAME_CONFIG.name,W/2,H/2-10); ctx.font="20px Fredoka,sans-serif";ctx.fillText("Tap to start",W/2,H/2+28); }
}
function t2(){return Date.now()/1000;}
function banner(t,s){ ctx.fillStyle="rgba(0,0,0,.45)";ctx.fillRect(0,0,W,H); ctx.textAlign="center"; ctx.fillStyle="#fff";ctx.font="bold 40px Fredoka,sans-serif";ctx.fillText(t,W/2,H/2-6); ctx.font="20px Fredoka,sans-serif";ctx.fillText(s,W/2,H/2+34); }


function frame(){ update(); draw(); requestAnimationFrame(frame); }
requestAnimationFrame(frame);

// expose for QA / picker
window.BK_GAME = { startLevel:(i)=>startLevel(i), setBot:(b)=>{botMode=b;started=true;}, state:()=>state, level:()=>li,
  dbg:()=>({px:Math.round(player.x), goal:Math.round(L.goalX), started, runV:player.runV, hp:hearts, onG:player.onGround, vy:Math.round(player.vy), state}),
  // QA harness: run a "perfect player" headlessly (no rAF) through a level.
  frameStep:(n)=>{ for(let i=0;i<(n||1);i++){ update(); draw(); } },
  sim:(idx, maxFrames)=>{ hearts=3; startLevel(idx); botMode=true; started=true; let f=0; const cap=maxFrames||4000;
    while(state==="play" && f<cap){ update(); f++; } return { level:idx, result:state, frames:f, coins:coinsGot+"/"+totalCoins }; } };
</script>
