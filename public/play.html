<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Buildable Runner — engine</title>
<style>
  html,body{margin:0;height:100%;background:#0e1020;overflow:hidden;touch-action:none;font-family:'Fredoka',-apple-system,sans-serif}
  #wrap{position:fixed;inset:0;box-sizing:border-box;display:flex;align-items:safe center;justify-content:safe center;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  canvas{background:#000;max-width:100%;max-height:100%;image-rendering:auto;border-radius:14px}
  #hint{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom));text-align:center;color:#fff;opacity:.7;font-size:15px;pointer-events:none}

  /* on-screen controls */
  #pad{position:fixed;left:18px;bottom:20px;display:flex;gap:14px;z-index:5}
  #actions{position:fixed;right:18px;bottom:20px;display:flex;gap:14px;align-items:flex-end;z-index:5}
  .ctl{width:74px;height:74px;border-radius:50%;background:rgba(20,30,50,.30);border:2px solid rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  .ctl:active{background:rgba(20,30,50,.55)}
  .ctl.small{width:58px;height:58px}
  .ctl.jump{width:94px;height:94px;background:rgba(59,191,115,.42);border-color:rgba(255,255,255,.75)}
  .ar{display:block;width:0;height:0}
  .arL{border-top:13px solid transparent;border-bottom:13px solid transparent;border-right:20px solid #fff}
  .arR{border-top:13px solid transparent;border-bottom:13px solid transparent;border-left:20px solid #fff}
  .arU{border-left:15px solid transparent;border-right:15px solid transparent;border-bottom:22px solid #fff}
  .arD{border-left:13px solid transparent;border-right:13px solid transparent;border-top:20px solid #fff}
  #bHelp{position:fixed;left:16px;top:14px;z-index:6;width:36px;height:36px;border-radius:50%;border:2px solid rgba(255,255,255,.6);background:rgba(20,30,50,.4);color:#fff;font:700 18px Fredoka,sans-serif;cursor:pointer}
  #bMute{position:fixed;left:60px;top:14px;z-index:6;width:36px;height:36px;border-radius:50%;border:2px solid rgba(255,255,255,.6);background:rgba(20,30,50,.4);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
  #bMute svg{width:20px;height:20px;display:block}
  #bMusic{position:fixed;left:104px;top:14px;z-index:6;width:36px;height:36px;border-radius:50%;border:2px solid rgba(255,255,255,.6);background:rgba(20,30,50,.4);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
  #bMusic svg{width:20px;height:20px;display:block}
  #howto{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:22px 0 32px;background:radial-gradient(ellipse at 50% 42%, rgba(8,12,28,.05), rgba(8,12,28,.5));-webkit-tap-highlight-color:transparent;cursor:pointer}
  #howto .ttl{color:#fff;font:700 30px Fredoka,sans-serif;text-shadow:0 2px 12px rgba(0,0,0,.55);margin-top:4px;letter-spacing:.4px}
  #demoGest{position:relative;width:130px;height:150px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;pointer-events:none}
  #demoGest .finger{position:absolute;left:45px;width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 34% 30%,#fff,#dbe4ff);box-shadow:0 0 0 9px rgba(255,255,255,.16),0 8px 18px rgba(0,0,0,.4);animation:bkswipe 2.6s ease-in-out infinite}
  #demoGest .chev{width:30px;height:30px;border-right:7px solid #fff;border-bottom:7px solid #fff;border-radius:5px}
  #demoGest .chev.up{transform:rotate(-135deg);animation:bkglowUp 2.6s ease-in-out infinite}
  #demoGest .chev.down{transform:rotate(45deg);animation:bkglowDn 2.6s ease-in-out infinite}
  @keyframes bkswipe{0%,10%{top:96px;opacity:.4}24%{opacity:1}40%,54%{top:8px;opacity:1}68%{opacity:1}84%,100%{top:96px;opacity:.4}}
  @keyframes bkglowUp{0%,48%{opacity:1;filter:drop-shadow(0 0 7px #fff)}58%,100%{opacity:.3;filter:none}}
  @keyframes bkglowDn{0%,54%{opacity:.3;filter:none}74%,90%{opacity:1;filter:drop-shadow(0 0 7px #fff)}100%{opacity:.3}}
  #play{display:block;background:#3bbf73;color:#fff;border:none;border-radius:18px;padding:16px 68px;font:700 26px Fredoka,sans-serif;cursor:pointer;box-shadow:0 10px 26px rgba(0,0,0,.45),0 0 0 5px rgba(255,255,255,.18);animation:bkpulse 1.6s ease-in-out infinite}
  #play:active{background:#33a866}
  @keyframes bkpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="900" height="540"></canvas>
  <button id="bHelp">?</button>
  <button id="bMute" aria-label="Sound on/off"></button>
  <button id="bMusic" aria-label="Change song"></button>
  <div id="pad">
    <div id="dleft" class="ctl"><span class="ar arL"></span></div>
    <div id="dright" class="ctl"><span class="ar arR"></span></div>
  </div>
  <div id="actions">
    <div id="ddown" class="ctl small"><span class="ar arD"></span></div>
    <div id="djump" class="ctl jump"><span class="ar arU"></span></div>
  </div>
  <div id="howto">
    <div class="ttl">Bramble&#39;s Dash</div>
    <div id="demoGest" aria-hidden="true">
      <span class="chev up"></span>
      <span class="finger"></span>
      <span class="chev down"></span>
    </div>
    <button id="play">Play!</button>
  </div>
<div id="hint">Move with the arrows · JUMP to hop · reach the flag</div>
<script>
// ============================================================================
//  FIXED ENGINE — never regenerated. A game = this engine + GAME_CONFIG (data).
//  Levels are RECIPES (difficulty knobs); the engine builds each level from them
//  so gaps are always jumpable => a level can never be unclearable.
// ============================================================================
// --- Builder/replay config injection -------------------------------------
// A game built in the Game Maker is just this engine + a chosen GAME_CONFIG.
// The maker hands the recipe over the URL as ?cfg=<base64url JSON>; a saved or
// shared game can pass ?g=<id> and we fetch the recipe. Falls back to the
// default below so opening play.html directly still plays a real game.
(function(){
  try{
    var qs=new URLSearchParams(location.search);
    var raw=qs.get('cfg');
    if(raw){
      var t=raw.replace(/-/g,'+').replace(/_/g,'/'); while(t.length%4)t+='=';
      window.GAME_CONFIG=JSON.parse(decodeURIComponent(escape(atob(t))));
    } else if(qs.get('g')){
      var x=new XMLHttpRequest(); x.open('GET','/api/load-game?id='+encodeURIComponent(qs.get('g')),false); x.send(null);
      if(x.status>=200&&x.status<300){ var row=JSON.parse(x.responseText); if(row&&row.config) window.GAME_CONFIG=row.config; }
    }
  }catch(e){ try{console.warn('[buildable] config load failed',e);}catch(_){} }
})();
const GAME_CONFIG = window.GAME_CONFIG || {
  name: "Bramble's Dash",
  world: "enchanted-forest", artStyle: "watercolor", musicKey: "ocean",
  artBase: "https://www.buildablekids.com/api/game-art",
  heroUrl: "https://www.buildablekids.com/api/story-library?img=character:bunny&style=watercolor&emo=happy",
  bgUrl:   "https://www.buildablekids.com/api/story-library?img=world:enchanted-forest&style=watercolor",
  palette: { ground:"#6b9b4a", groundTop:"#8fc46a", dirt:"#5a4332", coin:"#ffd23f", obstacle:"#7a4a86", enemy:"#c0566f", flag:"#ffd23f", hud:"#ffffff" },
  levels: [
    { name:"Whispering Woods", speed:3.2, length:150, gapChance:0.15, gapMax:2, obstacleChance:0.10, enemyChance:0.09, lowChance:0.10, coinChance:0.34, powerupChance:0.05, platformChance:0.5, starCount:3, movingPlatChance:0.55, vineChance:0.5, boss:true, bossHp:3 },
  ],
  powerups: ["shield","magnet","spring","star"],   // the kid's chosen set; engine only spawns from here
};

const W=900, H=540, TILE=60;                  // world units
const GROUND_Y = H-110;                        // top of the ground band
const GRAV=0.58, JUMP=-13.8, RUN_BASE=3.2; // physics
const AIR_FRAMES = 2*Math.abs(JUMP)/GRAV;  // frames a full jump stays airborne
const SLIDE_FRAMES=34;
const c=document.getElementById('c'), ctx=c.getContext('2d');
// --- sound (Web Audio; resumes on first tap, so it works on iPad) ---
let AX=null, soundOn=true, musicOn=true;
function actx(){ if(!AX){ try{ const AC=window.AudioContext||window.webkitAudioContext; if(AC)AX=new AC(); }catch{} } if(AX&&AX.state==='suspended'){ try{AX.resume();}catch{} } return AX; }
function blip(f,dur,type,vol,glide){ const a=actx(); if(!a||!soundOn)return; try{ const o=a.createOscillator(),g=a.createGain(); o.type=type||'sine'; o.frequency.setValueAtTime(f,a.currentTime); if(glide)o.frequency.exponentialRampToValueAtTime(glide,a.currentTime+dur); g.gain.setValueAtTime(0.0001,a.currentTime); g.gain.exponentialRampToValueAtTime(vol||0.14,a.currentTime+0.01); g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+dur); o.connect(g);g.connect(a.destination); o.start(); o.stop(a.currentTime+dur+0.03);}catch{} }
const SFX={
  jump:()=>blip(420,0.16,'sine',0.12,760),
  land:()=>blip(190,0.07,'sine',0.06,120),
  coin:()=>blip(900,0.09,'square',0.09,1340),
  star:()=>{blip(880,0.12,'triangle',0.13,1320); setTimeout(()=>blip(1320,0.18,'triangle',0.13,1760),90);},
  power:()=>{blip(660,0.10,'triangle',0.12,990); setTimeout(()=>blip(990,0.14,'triangle',0.12,1320),80);},
  bounce:()=>blip(280,0.18,'sine',0.13,920),
  hurt:()=>blip(320,0.22,'sawtooth',0.12,120),
  win:()=>{[523,659,784,1047].forEach((f,i)=>setTimeout(()=>blip(f,0.2,'triangle',0.14),i*130));}
};
// --- background music: REAL ElevenLabs tracks (the chess music library), streamed + looped ---
const MUSIC_BASE = GAME_CONFIG.musicBase || "https://www.buildablekids.com/api/chess-music";
const MUSIC_LIB = [   // a small library kids can cycle through by ear (no emoji; names are for grown-ups)
  {key:"ocean",  name:"Dreamy"},
  {key:"space",  name:"Starlight"},
  {key:"castle", name:"Fairytale"},
  {key:"jungle", name:"Sunny"},
  {key:"candy",  name:"Music box"},
  {key:"desert", name:"Mellow"},
];
let musicIdx = Math.max(0, MUSIC_LIB.findIndex(m=>m.key===(GAME_CONFIG.musicKey||"ocean")));
if(musicIdx<0) musicIdx=0;
let musicToast=0;                                  // frames to show the current track name
const Music=(()=>{
  let el=null;
  function ensure(){ if(!el && typeof Audio!=='undefined'){ el=new Audio(); el.loop=true; el.volume=0.34; el.preload="auto"; try{ if(window.registerAudio) window.registerAudio(el); }catch{} } return el; }
  function load(){ const m=ensure(); if(!m) return null; const src=MUSIC_BASE+"?world="+encodeURIComponent(MUSIC_LIB[musicIdx].key); if(m.dataset.src!==src){ m.src=src; m.dataset.src=src; } return m; }
  return {
    start(){ if(!soundOn||!musicOn) return; const m=load(); if(m) m.play().catch(()=>{}); },
    stop(){ if(el) el.pause(); },
    next(){ musicIdx=(musicIdx+1)%MUSIC_LIB.length; musicToast=140; const m=load(); if(m && soundOn && musicOn) m.play().catch(()=>{}); return MUSIC_LIB[musicIdx].name; },
    current(){ return MUSIC_LIB[musicIdx].name; }
  };
})();

// --- assets ---
const hero=new Image(); hero.crossOrigin="anonymous"; hero.src=GAME_CONFIG.heroUrl;
const bg=new Image();   bg.crossOrigin="anonymous";   bg.src=GAME_CONFIG.bgUrl;
// world-piece cutouts for the parallax layers
const WORLD=GAME_CONFIG.world||"enchanted-forest", ARTSTYLE=GAME_CONFIG.artStyle||"watercolor", ART_BASE=GAME_CONFIG.artBase||"https://www.buildablekids.com/api/game-art";
const PIECE_NAMES=["far","tree_a","tree_b","bush_a","bush_b","fern","mushroom","canopy"];
const PC={}; for(const nm of PIECE_NAMES){ const im=new Image(); im.crossOrigin="anonymous"; im.src=ART_BASE+"?img="+WORLD+":"+nm+"&style="+ARTSTYLE; PC[nm]=im; }
const PROP_NAMES=["coin","gem","critter","vines","spring","flag"];
const PR={}; for(const nm of PROP_NAMES){ const im=new Image(); im.crossOrigin="anonymous"; im.src=ART_BASE+"?img=props:"+nm+"&style="+ARTSTYLE; PR[nm]=im; }
// per-world themed gameplay props (coin/gem/critter); fall back to the generic props set if a world lacks one
const WORLD_PROP_NAMES=["coin","gem","critter"];
const WP={}; for(const nm of WORLD_PROP_NAMES){ const im=new Image(); im.crossOrigin="anonymous"; im.src=ART_BASE+"?img="+WORLD+":"+nm+"&style="+ARTSTYLE; WP[nm]=im; }
function propImg(nm){ const wi=WP[nm]; if(wi&&wi.complete&&wi.naturalWidth) return wi; const im=PR[nm]; return (im&&im.complete&&im.naturalWidth)?im:null; }

// --- deterministic RNG so a level is reproducible (and QA-able) ---
function mulberry(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

// --- build one level from its recipe — alternating RUN zones (hazards) and
// CLIMB zones (flat ground + platforms). Always clearable: RUN zones space
// hazards <= a jump apart; CLIMB zones are flat so the bot never jumps where a
// platform could catch it. Platforms/stars/bounces live only in CLIMB zones. ---
function buildLevel(lv, idx){
  const rnd=mulberry(1000+idx*97);
  const ground=[], obstacles=[], enemies=[], coins=[], lowBars=[], decos=[], powerups=[], platforms=[], bounces=[], stars=[], swings=[];
  let boss=null, barrierX=Infinity;
  const isLast = idx === ((GAME_CONFIG.levels&&GAME_CONFIG.levels.length||1)-1);
  const wantBoss = lv.boss!==false && (lv.boss===true || isLast);
  const n=lv.length, speed=lv.speed||RUN_BASE;
  const safeGapTiles=Math.max(1, Math.floor(speed*AIR_FRAMES*0.62/TILE) - 1);
  const landTiles=Math.ceil(speed*AIR_FRAMES/TILE)+1;
  const POOL=(GAME_CONFIG.powerups&&GAME_CONFIG.powerups.length)?GAME_CONFIG.powerups:["shield"];
  let segStart=0, i=4, mode="run";          // first 4 tiles solid (safe spawn)
  while(i<n-4){
    if(mode==="run"){
      const segEnd=Math.min(n-4, i + 11 + Math.floor(rnd()*7));   // 11-17 tiles of hazards
      let lastHaz=i;                                              // wait 3 tiles into the zone
      for(; i<segEnd; i++){
        const tx=i*TILE; const canHaz=(i-lastHaz)>=3;
        if(canHaz && rnd()<lv.gapChance){
          ground.push({x0:segStart, x1:tx, y:GROUND_Y});
          const maxGap=Math.max(1, Math.min(lv.gapMax, safeGapTiles));
          const gapTiles=1+Math.floor(rnd()*maxGap);
          i+=gapTiles; segStart=i*TILE; lastHaz=i; continue;
        }
        if(canHaz && rnd()<lv.obstacleChance){ obstacles.push({x:tx+TILE/2, y:GROUND_Y, w:34, h:46}); lastHaz=i; }
        else if(canHaz && rnd()<lv.enemyChance){ enemies.push({x:tx+TILE/2, y:GROUND_Y-26, w:40, h:40, dir:-1, base:tx+TILE/2, range:40, dead:false}); lastHaz=i; }
        else if(canHaz && (lv.lowChance||0)>0 && (i-lastHaz)>=landTiles && rnd()<lv.lowChance){ lowBars.push({x:tx+TILE/2}); lastHaz=i; }
        if(rnd()<lv.coinChance) coins.push({x:tx+TILE/2, y:GROUND_Y-70-Math.floor(rnd()*60), got:false});
      }
      mode="climb";
    } else {
      const segEnd=Math.min(n-4, i + 9 + Math.floor(rnd()*5));    // 9-13 tiles, flat ground
      for(let j=i+1; j<segEnd-2; ){
        const tier=1+Math.floor(rnd()*2);                         // 1 or 2 (both reachable)
        const py=GROUND_Y-100-(tier-1)*78;
        const wT=2+Math.floor(rnd()*2);
        if(j+wT>segEnd-2) break;
        const pf={x:j*TILE, y:py, w:wT*TILE};
        if(rnd() < (lv.movingPlatChance||0)){
          const horiz=rnd()<0.5;
          pf.mv = horiz ? {axis:'x', amp:TILE*(0.9+rnd()*1.1), spd:0.018+rnd()*0.016, ph:rnd()*6.28, bx:pf.x, by:pf.y}
                        : {axis:'y', amp:30+rnd()*36,          spd:0.018+rnd()*0.016, ph:rnd()*6.28, bx:pf.x, by:pf.y};
          pf.dx=0; pf.dy=0;
        }
        platforms.push(pf);
        if(!pf.mv) for(let cc=0;cc<wT;cc++) coins.push({x:j*TILE+TILE/2+cc*TILE, y:py-30, got:false});
        if(rnd() < (lv.vineChance||0)) swings.push({ax:pf.x+pf.w*0.5, ay:GROUND_Y-230, len:140+rnd()*40, ang:(rnd()<0.5?-1:1)*(0.5+rnd()*0.3), angV:0, grabbed:false});
        if(tier===2 && stars.length<(lv.starCount||3) && rnd()<0.7) stars.push({x:j*TILE+TILE/2, y:py-36, got:false});
        else if(rnd()<0.35) powerups.push({x:j*TILE+TILE/2, y:py-36, kind:POOL[Math.floor(rnd()*POOL.length)], got:false});
        if(rnd()<0.4) bounces.push({x:j*TILE+wT*TILE/2-32, y:py-14, w:64, t:0});
        j += wT + 1 + Math.floor(rnd()*2);
      }
      i=segEnd; mode="run";
    }
  }
  ground.push({x0:segStart, x1:n*TILE, y:GROUND_Y});
  if(wantBoss){
    const bx=(n*TILE) - TILE*4;                              // arena just before the flag
    ground.push({x0:bx-TILE*2.5, x1:n*TILE, y:GROUND_Y});    // guarantee a solid, gap-free boss arena
    boss={ x:bx, y:GROUND_Y, w:84, h:78, hp:(lv.bossHp||3), maxHp:(lv.bossHp||3), t:0, hit:0, defeated:false, happy:0, active:false };
    barrierX = bx - boss.w*0.5 - 2;                          // soft magic wall just left of the boss
  }
  // cosmetic decos (separate RNG)
  const rd=mulberry(7000+idx*131);
  for(let k=3;k<n;k++){ if(rd()<0.5) decos.push({x:k*TILE+rd()*TILE, kind: rd()<0.6?'bush':'grass', s:0.7+rd()*0.7}); }
  // make sure the level has its full set of stars
  while(stars.length<(lv.starCount||3) && platforms.length){ const pf=platforms[Math.floor(rnd()*platforms.length)]; stars.push({x:pf.x+pf.w/2, y:pf.y-36, got:false}); }
  // endless edges so the world never just stops
  ground.unshift({x0:-3000, x1:0, y:GROUND_Y});
  ground.push({x0:n*TILE, x1:n*TILE+3000, y:GROUND_Y});
  const goalX=n*TILE - TILE*1.4;
  return { ground, obstacles, enemies, coins, lowBars, decos, powerups, platforms, bounces, stars, swings, boss, barrierX, goalX, worldEnd:n*TILE, name:lv.name, speed:lv.speed||RUN_BASE };
}

// --- scatter the world pieces across parallax layers (cosmetic; separate RNG so QA is unaffected) ---
function buildScene(L, idx){
  const we=L.worldEnd, S={mid:[],near:[],fore:[],top:[],flies:[]};
  const r1=mulberry(21000+idx*7);
  for(let x=-1000; x<we+1600; x+= 230+r1()*210){ S.mid.push({x, piece: r1()<0.58?"tree_a":"tree_b", s:0.85+r1()*0.6, flip:r1()<0.5, ph:r1()*6.28}); }
  const r2=mulberry(33000+idx*7);
  for(let x=-1000; x<we+1600; x+= 140+r2()*150){ const t=r2(); S.near.push({x, piece: t<0.4?"bush_a":t<0.7?"bush_b":"mushroom", s:0.5+r2()*0.45, flip:r2()<0.5, ph:r2()*6.28}); }
  const r3=mulberry(44000+idx*7);
  for(let x=-1000; x<we+1600; x+= 600+r3()*320){ S.fore.push({x, piece:"fern", s:0.8+r3()*0.45, flip:r3()<0.5, ph:r3()*6.28}); }
  const r4=mulberry(55000+idx*7);
  for(let x=-1000; x<we+1600; x+= 360+r4()*240){ S.top.push({x, piece:"canopy", s:0.9+r4()*0.5, flip:r4()<0.5}); }
  const r5=mulberry(66000+idx*7);
  for(let i=0;i<48;i++){ S.flies.push({x:r5()*we, y:60+r5()*(GROUND_Y-50), ph:r5()*6.28, sp:0.4+r5()*0.8}); }
  return S;
}

// --- game state ---
let LEVELS = GAME_CONFIG.levels.map((lv,i)=>buildLevel(lv,i));
let li=0, L=LEVELS[0];
let player, camX, hearts, coinsGot, totalCoins, state, invuln, botMode=false, doneMsgT=0, started=false, starsGot=0, totalStars=0, gameT=0, demoMode=true, demoRestartT=0;
let dust=[];
function spawnDust(wx,wy){ for(let i=0;i<6;i++) dust.push({x:wx,y:wy,vx:(Math.random()-0.5)*3.2,vy:-Math.random()*2,life:16+Math.random()*10}); }
let shieldOn=false, magnetT=0, springT=0, starT=0;  // power-up effect timers

function startLevel(i){
  li=Math.max(0,Math.min(LEVELS.length-1,i)); L=LEVELS[li];
  player={x:90, y:GROUND_Y-60, vy:0, onGround:true, r:0, runV:L.speed, dj:false, slide:0, land:0, vx:0, face:1, swing:null, swingCool:0, standPf:null};
  camX=0; invuln=0; state="play"; coinsGot=0; totalCoins=L.coins.length; starsGot=0; totalStars=L.stars.length; dust=[]; doneMsgT=0; gameT=0;
  if(L.boss){ L.boss.hp=L.boss.maxHp; L.boss.defeated=false; L.boss.t=0; L.boss.hit=0; L.boss.happy=0; L.boss.active=false; }
  for(const sw of (L.swings||[])){ sw.grabbed=false; }
  shieldOn=false; magnetT=0; springT=0; starT=0;
  if(hearts==null) hearts=3;
  if(!L.scene) L.scene=buildScene(L, li);
}
startLevel(0);

// --- input ---
let jumpHeld=false, inputLeft=false, inputRight=false, paused=true;
function doJump(){
  if(!started){started=true;}
  if(player.swing){ const sw=player.swing; const tang=sw.angV*sw.len;        // let go of the vine, fling in the swing direction
    player.vx=Math.max(-7,Math.min(7,Math.cos(sw.ang)*tang*6));
    player.vy=JUMP*0.7 - Math.min(6,Math.abs(Math.sin(sw.ang)*tang)*0.5);
    player.swing=null; sw.grabbed=false; player.onGround=false; player.dj=true; player.swingCool=10; SFX.jump(); return; }
  if(player.slide>0) player.slide=0;                       // jump cancels a slide
  const jv = springT>0 ? 1.2 : 1;                          // spring power-up = higher jump
  if(player.onGround){ player.vy=JUMP*jv; player.onGround=false; player.dj=true; SFX.jump(); }
  else if(player.dj){ player.vy=JUMP*0.82*jv; player.dj=false; SFX.jump(); }
  jumpHeld=true;
}
function doSlide(){ if(!started){started=true;return;} if(player.onGround && player.slide<=0){ player.slide=SLIDE_FRAMES; } }
addEventListener('keydown',e=>{
  if(e.code==='ArrowLeft'){inputLeft=true;started=true;}
  else if(e.code==='ArrowRight'){inputRight=true;started=true;}
  else if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();started=true;doJump();}
  else if(e.code==='ArrowDown'){e.preventDefault();doSlide();}
  else if(e.key==='b')botMode=!botMode;
});
addEventListener('keyup',e=>{
  if(e.code==='ArrowLeft')inputLeft=false;
  else if(e.code==='ArrowRight')inputRight=false;
  else if(e.code==='Space'||e.code==='ArrowUp')jumpHeld=false;
});

function hold(id, down, up){ const el=document.getElementById(id); if(!el)return;
  el.addEventListener('pointerdown',ev=>{ev.preventDefault(); started=true; down(); });

}

// --- helpers: is there solid ground under world-x? ---
function groundUnder(wx){ for(const g of L.ground){ if(wx>=g.x0 && wx<g.x1) return g.y; } return null; }

// --- simple "perfect player" bot: jump before a gap or obstacle/enemy ---
function botThink(){
  inputRight=true; inputLeft=false;          // perfect player walks right
  if(player.onGround){
    if(L.boss && !L.boss.defeated){ const d=L.boss.x-(player.x+24); if(d>-20 && d<90){ doJump(); return; } }
    for(const b of L.lowBars){ const d=b.x-(player.x+24); if(d>2 && d<60){ if(player.slide<=0) doSlide(); return; } }
    if(groundUnder(player.x+24+46)==null){ doJump(); return; }   // gap just ahead
    for(const o of L.obstacles){ const d=o.x-(player.x+24); if(d>2 && d<66){ doJump(); return; } }
    for(const e of L.enemies){ if(!e.dead){ const d=e.x-(player.x+24); if(d>2 && d<58){ doJump(); return; } } }
  } else { jumpHeld=true; }
}

// --- update ---
function update(){
  if(state!=="play"){ doneMsgT++; if(demoMode){ if(++demoRestartT>70){ hearts=3; startLevel(0); botMode=true; started=true; paused=false; demoRestartT=0; } } return; }
  if(paused) return;
  if(botMode) botThink();
  if(!started) return;                       // wait for first input
  if(player.slide>0) player.slide--;
  if(magnetT>0)magnetT--; if(springT>0)springT--; if(starT>0)starT--; if(player.swingCool>0)player.swingCool--;
  gameT++;
  // advance moving platforms (deterministic frame clock so the QA sim matches real play)
  for(const pf of L.platforms){ if(pf.mv){ const m=pf.mv;
    const nx = m.axis==='x'? m.bx+Math.sin(gameT*m.spd+m.ph)*m.amp : m.bx;
    const ny = m.axis==='y'? m.by+Math.sin(gameT*m.spd+m.ph)*m.amp : m.by;
    pf.dx=nx-pf.x; pf.dy=ny-pf.y; pf.x=nx; pf.y=ny; } }
  // swinging vines: pendulum motion (ungrabbed) + ride/grab
  for(const sw of L.swings){ if(sw===player.swing)continue; sw.angV += -0.006*Math.sin(sw.ang); sw.angV*=0.996; sw.ang+=sw.angV; }
  if(player.swing){ const sw=player.swing;
    sw.angV += -0.010*Math.sin(sw.ang);
    if(inputLeft) sw.angV-=0.0016; if(inputRight) sw.angV+=0.0016;
    sw.angV*=0.992; sw.ang+=sw.angV;
    player.x = sw.ax+Math.sin(sw.ang)*sw.len - 24;
    player.y = sw.ay+Math.cos(sw.ang)*sw.len - 30;
    player.vx=0; player.vy=0; player.onGround=false;
    for(const k of L.coins){ if(!k.got && Math.abs((player.x+24)-k.x)<34 && Math.abs((player.y+30)-k.y)<40){ k.got=true; coinsGot++; SFX.coin(); } }
    return;
  } else if(!botMode && !player.onGround && player.swingCool<=0){     // bonus toy; the QA "perfect runner" stays on the ground path
    for(const sw of L.swings){ const bx=sw.ax+Math.sin(sw.ang)*sw.len, by=sw.ay+Math.cos(sw.ang)*sw.len;
      if(Math.abs((player.x+24)-bx)<40 && Math.abs((player.y+30)-by)<46){ player.swing=sw; sw.grabbed=true; player.vy=0; break; } }
  }
  // walk — player-controlled (Mario-style, no auto-scroll)
  const ACC=0.7, MAXR=L.speed, FR=0.80;
  if(inputLeft && !inputRight) player.vx-=ACC; else if(inputRight && !inputLeft) player.vx+=ACC; else player.vx*=FR;
  if(player.vx>MAXR)player.vx=MAXR; if(player.vx<-MAXR)player.vx=-MAXR;
  player.x += player.vx;
  if(player.x<20){ player.x=20; if(player.vx<0)player.vx=0; }
  if(Math.abs(player.vx)>0.4) player.face = player.vx>0?1:-1;
  // gravity + variable jump height
  player.vy += GRAV * (jumpHeld && player.vy<0 ? 0.62 : 1);
  player.y += player.vy;
  // vertical support: ground + one-way platforms + bounce pads
  { const feet=player.y+60, prevFeet=feet-player.vy, cx=player.x+24;
    let landY=null, landPf=null, bounce=false;
    if(player.vy>=0){
      const g=groundUnder(cx); if(g!=null && feet>=g) landY=g;
      for(const pf of L.platforms){ if(cx>=pf.x && cx<=pf.x+pf.w && prevFeet<=pf.y && feet>=pf.y){ if(landY==null||pf.y<landY){landY=pf.y; landPf=pf;} } }
      for(const bp of L.bounces){ if(cx>=bp.x && cx<=bp.x+bp.w && prevFeet<=bp.y && feet>=bp.y){ bounce=true; bp.t=10; } }
    }
    if(bounce){ player.vy=JUMP*1.55; player.onGround=false; player.dj=true; SFX.bounce(); }
    else if(landY!=null){ if(!player.onGround){ player.land=8; spawnDust(cx, landY); SFX.land(); } player.y=landY-60; player.vy=0; player.onGround=true; player.dj=false;
      if(landPf&&landPf.mv){ if(landPf.mv.axis==='x') player.x+=landPf.dx; player.standPf=landPf; } else player.standPf=null; }
    else { player.onGround=false; player.standPf=null; }
  }
  player.r = player.onGround?0:Math.max(-0.5,Math.min(0.5,player.vy*0.03));
  // fell in a gap
  if(player.y>H+40){ loseHeart(true); return; }
  if(invuln>0) invuln--;
  if(player.land>0)player.land--;
  for(const d of dust){ d.x+=d.vx; d.y+=d.vy; d.vy+=0.2; d.life--; }
  if(dust.length) dust=dust.filter(d=>d.life>0);
  // magnet power-up: pull nearby coins toward the hero
  if(magnetT>0){ for(const k of L.coins){ if(k.got)continue; const dx=(player.x+24)-k.x, dy=(player.y+30)-k.y; if(dx*dx+dy*dy<170*170){ k.x+=dx*0.16; k.y+=dy*0.16; } } }
  // coins
  for(const k of L.coins){ if(!k.got && Math.abs((player.x+24)-k.x)<34 && Math.abs((player.y+30)-k.y)<40){ k.got=true; coinsGot++; SFX.coin(); } }
  for(const st of L.stars){ if(!st.got && Math.abs((player.x+24)-st.x)<38 && Math.abs((player.y+30)-st.y)<46){ st.got=true; starsGot++; SFX.star(); } }
  // power-up pickups
  for(const u of L.powerups){ if(u.got)continue; if(Math.abs((player.x+24)-u.x)<36 && Math.abs((player.y+30)-u.y)<44){ u.got=true; SFX.power(); if(u.kind==="shield")shieldOn=true; else if(u.kind==="magnet")magnetT=360; else if(u.kind==="spring")springT=360; else if(u.kind==="star")starT=360; else if(u.kind==="heart"&&hearts<3)hearts++; } }
  // enemies (walk a little)
  for(const e of L.enemies){ if(e.dead)continue; e.x+=e.dir*0.6; if(Math.abs(e.x-e.base)>e.range)e.dir*=-1;
    const dx=Math.abs((player.x+24)-e.x), dy=(player.y+60)-e.y;
    if(dx<34 && Math.abs((player.y+30)-e.y)<46){
      if(starT>0){ e.dead=true; }                                   // star smashes enemies
      else if(player.vy>0 && (player.y+60)-e.y<26){ e.dead=true; player.vy=JUMP*0.6; }  // stomp
      else if(invuln<=0){ takeHit(); }
    }
  }
  // obstacles
  for(const o of L.obstacles){ const dx=Math.abs((player.x+24)-o.x); if(dx<28 && (player.y+60)>o.y-o.h+6 && (player.y+30)<o.y && invuln<=0){ takeHit(); } }
  // low barriers: must SLIDE under (can't jump over)
  for(const b of L.lowBars){ const dx=Math.abs((player.x+24)-b.x); if(dx<26){ const heroTop=player.y+(player.slide>0?26:0); if(heroTop < GROUND_Y-36 && invuln<=0){ takeHit(); } } }
  // friendly end-of-level boss: bop it on the head to make it happy
  if(L.boss && !L.boss.defeated){ const b=L.boss; if(b.hit>0)b.hit--;
    if(!b.active && player.x > b.x - W*0.9) b.active=true;       // wake up only when the player is close
    if(b.active){ b.t++; if(b.t>60*18) defeatBoss(); }           // mercy failsafe: boss gives up 18s after the fight starts (never soft-locks)
    const dx=Math.abs((player.x+24)-b.x), pcy=player.y+30;
    if(dx < b.w*0.5+26 && pcy < b.y-6 && player.vy>0){           // stomp from above
      b.hp--; b.hit=12; player.vy=JUMP*0.7; player.dj=true; SFX.bounce(); if(b.hp<=0) defeatBoss();
    } else if(dx < b.w*0.5+20 && pcy > b.y-b.h && player.onGround && invuln<=0){  // gentle side bump — NO heart loss
      player.vx=-3; player.x-=4; invuln=16;
    }
  }
  // magic barrier holds you back until the boss is happy
  if(L.boss && !L.boss.defeated && (player.x+24) > L.barrierX){ player.x=L.barrierX-24; if(player.vx>0)player.vx=0; }
  // reach goal
  if(player.x>=L.goalX){ state="win"; SFX.win(); }
}
function takeHit(){ if(starT>0) return; if(shieldOn){ shieldOn=false; invuln=70; return; } loseHeart(false); }
function loseHeart(fell){
  hearts--; invuln=70; SFX.hurt();
  if(hearts<=0){ state="lose"; return; }
  // gentle: nudge back to safe ground
  if(fell){ let sx=player.x-TILE*2; while(sx>90 && groundUnder(sx)==null) sx-=20; player.x=Math.max(90,sx); player.y=GROUND_Y-80; player.vy=0; }
}
function defeatBoss(){ const b=L.boss; if(!b||b.defeated)return; b.defeated=true; b.happy=140; SFX.power(); }

// --- draw ---
function rrect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function pieceImg(nm){ const im=PC[nm]; return (im&&im.complete&&im.naturalWidth)?im:null; }
function drawPiece(im, sx, baseY, h, flip){ const w=h*(im.naturalWidth/im.naturalHeight); ctx.save(); ctx.translate(sx,0); if(flip)ctx.scale(-1,1); ctx.drawImage(im,-w/2,baseY-h,w,h); ctx.restore(); }
function drawTopPiece(im, sx, h, flip){ const w=h*(im.naturalWidth/im.naturalHeight); ctx.save(); ctx.translate(sx,0); if(flip)ctx.scale(-1,1); ctx.drawImage(im,-w/2,-12,w,h); ctx.restore(); }
function star5(cx,cy,r){ ctx.beginPath(); for(let i=0;i<10;i++){ const a=-Math.PI/2+i*Math.PI/5; const rr=i%2?r*0.45:r; ctx.lineTo(cx+Math.cos(a)*rr, cy+Math.sin(a)*rr);} ctx.closePath(); ctx.fill(); }
function drawDeco(x,baseY,d){ const s=d.s||1; if(d.kind==='bush'){ ctx.fillStyle="rgba(38,64,32,0.9)"; ctx.beginPath();ctx.arc(x,baseY,24*s,Math.PI,0);ctx.arc(x+16*s,baseY,17*s,Math.PI,0);ctx.arc(x-16*s,baseY,17*s,Math.PI,0);ctx.closePath();ctx.fill(); } else { ctx.strokeStyle="rgba(38,64,32,0.85)"; ctx.lineWidth=3; for(let b=-2;b<=2;b++){ ctx.beginPath();ctx.moveTo(x+b*5,baseY);ctx.quadraticCurveTo(x+b*5+b*2,baseY-16*s,x+b*6,baseY-26*s);ctx.stroke(); } } }
function drawPU(x,y,kind,r){ r=r||15; const col={shield:"#4aa3ff",magnet:"#e0566f",spring:"#5fc46a",star:"#ffd23f",heart:"#e0566f"}[kind]||"#fff";
  ctx.fillStyle="rgba(0,0,0,.18)"; ctx.beginPath();ctx.arc(x,y+2,r+2,0,7);ctx.fill();
  ctx.fillStyle="#fff"; ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
  ctx.fillStyle=col; ctx.beginPath();ctx.arc(x,y,r-3,0,7);ctx.fill();
  ctx.fillStyle="#fff"; ctx.strokeStyle="#fff"; ctx.lineWidth=Math.max(2,r/6);
  if(kind==="shield"){ ctx.beginPath();ctx.moveTo(x,y-r*0.5);ctx.lineTo(x+r*0.5,y-r*0.2);ctx.lineTo(x+r*0.5,y+r*0.15);ctx.quadraticCurveTo(x,y+r*0.7,x,y+r*0.7);ctx.quadraticCurveTo(x,y+r*0.7,x-r*0.5,y+r*0.15);ctx.lineTo(x-r*0.5,y-r*0.2);ctx.closePath();ctx.fill(); }
  else if(kind==="star"){ star5(x,y,r*0.62); }
  else if(kind==="spring"){ ctx.beginPath();ctx.moveTo(x-r*0.45,y+r*0.12);ctx.lineTo(x,y-r*0.5);ctx.lineTo(x+r*0.45,y+r*0.12);ctx.stroke(); ctx.beginPath();ctx.moveTo(x-r*0.45,y+r*0.45);ctx.lineTo(x,y-r*0.12);ctx.lineTo(x+r*0.45,y+r*0.45);ctx.stroke(); }
  else if(kind==="magnet"){ ctx.lineWidth=Math.max(3,r/3); ctx.beginPath();ctx.arc(x,y-r*0.1,r*0.45,Math.PI,0,false);ctx.stroke(); ctx.beginPath();ctx.moveTo(x-r*0.45,y-r*0.1);ctx.lineTo(x-r*0.45,y+r*0.45);ctx.moveTo(x+r*0.45,y-r*0.1);ctx.lineTo(x+r*0.45,y+r*0.45);ctx.stroke(); }
  else if(kind==="heart"){ heart(x,y-r*0.3,r*0.5); }
}
function heart(x,y,s){ctx.beginPath();ctx.moveTo(x,y+s*0.3);ctx.bezierCurveTo(x,y,x-s,y,x-s,y+s*0.35);ctx.bezierCurveTo(x-s,y+s*0.7,x,y+s*0.9,x,y+s*1.15);ctx.bezierCurveTo(x,y+s*0.9,x+s,y+s*0.7,x+s,y+s*0.35);ctx.bezierCurveTo(x+s,y,x,y,x,y+s*0.3);ctx.closePath();ctx.fill();}
function draw(){
  const P=GAME_CONFIG.palette;
  const _ct=Math.max(0, player.x - W*0.42); camX += (_ct-camX)*0.16; if(camX<0)camX=0;
  const t=Date.now()/1000, SC=L.scene||{mid:[],near:[],fore:[],top:[],flies:[]};
  // LAYER 1 — sky gradient
  const sky=ctx.createLinearGradient(0,0,0,H); sky.addColorStop(0,"#cfeaff"); sky.addColorStop(.55,"#dff0d6"); sky.addColorStop(1,"#eef6dc"); ctx.fillStyle=sky; ctx.fillRect(0,0,W,H);
  // soft god-rays
  ctx.save(); ctx.globalCompositeOperation="lighter";
  for(let i=0;i<4;i++){ const a=0.05+0.035*Math.sin(t*0.5+i*1.7); ctx.fillStyle="rgba(255,250,205,"+a.toFixed(3)+")"; const x=((150+i*240-(camX*0.1))%1100+1100)%1100 - 100; ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x+80,0);ctx.lineTo(x-10,H);ctx.lineTo(x-110,H);ctx.closePath();ctx.fill(); }
  ctx.restore();
  // LAYER 2 — far misty forest band (slow parallax, mirror-tiled)
  { const im=pieceImg("far"); if(im){ const h=H*0.62, w=h*(im.naturalWidth/im.naturalHeight), par=camX*0.12, i0=Math.floor(par/w); ctx.globalAlpha=0.85; for(let i=i0-1;;i++){ const sx=Math.round(i*w-par); if(sx>W)break; ctx.save();ctx.translate(sx,0); if(((i%2)+2)%2!==0){ctx.translate(w,0);ctx.scale(-1,1);} ctx.drawImage(im,0,GROUND_Y-h+34,w,h); ctx.restore(); } ctx.globalAlpha=1; } }
  // LAYER 3 — mid trees (parallax 0.4), rooted behind the ground band
  for(const m of SC.mid){ const sx=m.x-camX*0.4 + Math.sin(t*0.5+m.ph)*3; if(sx<-260||sx>W+260)continue; const im=pieceImg(m.piece); if(im) drawPiece(im, sx, GROUND_Y+26, 300*m.s, m.flip); }
  // LAYER 4 — near bushes / mushrooms (parallax 0.66)
  for(const nr of SC.near){ const sx=nr.x-camX*0.66 + Math.sin(t*0.8+nr.ph)*2; if(sx<-160||sx>W+160)continue; if(groundUnder(sx+camX)==null)continue; const im=pieceImg(nr.piece); if(im) drawPiece(im, sx, GROUND_Y+16, 150*nr.s, nr.flip); }
  // fireflies drifting in the air
  for(const f of SC.flies){ const sx=((f.x-camX*0.8)%W+W)%W; const y=f.y+Math.sin(t*f.sp+f.ph)*16; const a=0.3+0.4*Math.abs(Math.sin(t*1.6*f.sp+f.ph)); ctx.fillStyle="rgba(255,242,170,"+(a*0.25).toFixed(2)+")"; ctx.beginPath();ctx.arc(sx,y,6,0,7);ctx.fill(); ctx.fillStyle="rgba(255,244,180,"+a.toFixed(2)+")"; ctx.beginPath();ctx.arc(sx,y,2.3,0,7);ctx.fill(); }
  // ground segments
  for(const g of L.ground){ const sx=g.x0-camX, ex=g.x1-camX; if(ex<-40||sx>W+40)continue;
    ctx.fillStyle=P.dirt; ctx.fillRect(sx,g.y+14,ex-sx,H-g.y); ctx.fillStyle=P.ground; ctx.fillRect(sx,g.y,ex-sx,18); ctx.fillStyle=P.groundTop; ctx.fillRect(sx,g.y,ex-sx,6); }
  // climbable platforms
  for(const pf of L.platforms){ const x=pf.x-camX; if(x+pf.w<-30||x>W+30)continue; ctx.fillStyle="#6a4a2a"; rrect(x,pf.y,pf.w,18,8);ctx.fill(); ctx.fillStyle=P.ground; rrect(x,pf.y,pf.w,8,7);ctx.fill(); ctx.fillStyle=P.groundTop; ctx.fillRect(x+5,pf.y,pf.w-10,4); }
  // bounce pads
  for(const bp of L.bounces){ const x=bp.x-camX; if(x+bp.w<-30||x>W+30)continue; const sq=bp.t>0?(bp.t/10):0; if(bp.t>0)bp.t--; const im=propImg("spring"); if(im){ const bw=bp.w+16, bh=48*(1-sq*0.3); ctx.drawImage(im, x-8, (bp.y+14)-bh+sq*6, bw, bh); } else { ctx.fillStyle="#3bbf95"; rrect(x, bp.y+sq*8, bp.w, 16-sq*6, 8);ctx.fill(); ctx.fillStyle="rgba(255,255,255,.35)"; rrect(x+5, bp.y+2+sq*8, bp.w-10, 5, 4);ctx.fill(); } }
  // swinging vines (bonus toy, over solid ground)
  for(const sw of L.swings){ const ax=sw.ax-camX; if(ax<-70||ax>W+70)continue; const bx=ax+Math.sin(sw.ang)*sw.len, by=sw.ay+Math.cos(sw.ang)*sw.len;
    ctx.lineCap="round"; ctx.strokeStyle="#5a7d3a"; ctx.lineWidth=6; ctx.beginPath(); ctx.moveTo(ax,sw.ay); ctx.quadraticCurveTo((ax+bx)/2,(sw.ay+by)/2,bx,by); ctx.stroke();
    ctx.strokeStyle="#86b65a"; ctx.lineWidth=2.5; ctx.stroke(); ctx.lineCap="butt";
    ctx.fillStyle="#6ea03f"; ctx.beginPath(); ctx.arc(bx,by,11,0,7); ctx.fill(); ctx.fillStyle="rgba(255,255,255,.2)"; ctx.beginPath(); ctx.arc(bx-3,by-3,4,0,7); ctx.fill();
    ctx.fillStyle="#4f7a32"; ctx.beginPath(); ctx.ellipse(ax,sw.ay,9,5,0,0,7); ctx.fill();
  }
  // coins
  for(const k of L.coins){ if(k.got)continue; const x=k.x-camX; if(x<-30||x>W+30)continue; const im=propImg("coin"); if(im){ const s=28, sp=0.35+0.65*Math.abs(Math.cos(t*3+k.x*0.02)), w=s*(im.naturalWidth/im.naturalHeight)*sp; ctx.drawImage(im, x-w/2, k.y-s/2, w, s); } else { ctx.fillStyle=P.coin; ctx.beginPath();ctx.arc(x,k.y,11,0,7);ctx.fill(); ctx.fillStyle="rgba(255,255,255,.6)";ctx.beginPath();ctx.arc(x-3,k.y-3,3,0,7);ctx.fill(); } }
  // hidden stars (up high, reward exploring)
  for(const st of L.stars){ if(st.got)continue; const x=st.x-camX; if(x<-30||x>W+30)continue; const yy=st.y+Math.sin(t*2+st.x*0.01)*4; ctx.save(); ctx.translate(x,yy); ctx.rotate(Math.sin(t*1.4+st.x)*0.25); ctx.fillStyle="rgba(255,225,90,.35)"; ctx.beginPath();ctx.arc(0,0,17,0,7);ctx.fill(); ctx.fillStyle="#ffd23f"; star5(0,0,13); ctx.fillStyle="#fff7cc"; star5(0,0,6.5); ctx.restore(); }
  // obstacles (crystals)
  for(const o of L.obstacles){ const x=o.x-camX; if(x<-40||x>W+40)continue; const im=propImg("gem"); if(im){ const h=o.h+22, w=h*(im.naturalWidth/im.naturalHeight); ctx.drawImage(im, x-w/2, o.y-h+8, w, h); } else { ctx.fillStyle=P.obstacle; ctx.beginPath();ctx.moveTo(x,o.y-o.h);ctx.lineTo(x+o.w/2,o.y);ctx.lineTo(x-o.w/2,o.y);ctx.closePath();ctx.fill(); ctx.fillStyle="rgba(255,255,255,.25)";ctx.beginPath();ctx.moveTo(x,o.y-o.h);ctx.lineTo(x+o.w/4,o.y-o.h/2);ctx.lineTo(x-o.w/6,o.y-o.h/3);ctx.closePath();ctx.fill(); } }
  // enemies (little blobs)
  for(const e of L.enemies){ if(e.dead)continue; const x=e.x-camX; if(x<-40||x>W+40)continue; const im=propImg("critter"); if(im){ const s=52, w=s*(im.naturalWidth/im.naturalHeight), bob=Math.sin(t*4+e.base)*2; ctx.save(); ctx.translate(x, GROUND_Y-s+bob); if(e.dir>0)ctx.scale(-1,1); ctx.drawImage(im, -w/2, 0, w, s); ctx.restore(); } else { ctx.fillStyle=P.enemy; rrect(x-20,e.y-6,40,34,16);ctx.fill(); ctx.fillStyle="#fff"; ctx.beginPath();ctx.arc(x-7,e.y+6,5,0,7);ctx.arc(x+7,e.y+6,5,0,7);ctx.fill(); ctx.fillStyle="#222"; ctx.beginPath();ctx.arc(x-6,e.y+7,2.4,0,7);ctx.arc(x+8,e.y+7,2.4,0,7);ctx.fill(); } }
  // low barriers (slide under)
  for(const b of L.lowBars){ const x=b.x-camX; if(x<-40||x>W+40)continue; const im=propImg("vines"); if(im){ const h=GROUND_Y-20, w=72; ctx.drawImage(im, x-w/2, -16, w, h); } else { ctx.fillStyle=P.obstacle; rrect(x-22,-12,44,GROUND_Y-24,12); ctx.fill(); ctx.fillStyle="rgba(255,255,255,.18)"; rrect(x-22,-12,12,GROUND_Y-24,12); ctx.fill(); ctx.fillStyle=P.obstacle; ctx.beginPath();ctx.moveTo(x-30,GROUND_Y-36);ctx.lineTo(x+30,GROUND_Y-36);ctx.lineTo(x,GROUND_Y-18);ctx.closePath();ctx.fill(); } }
  // power-ups (floating bonus pickups)
  for(const u of L.powerups){ if(u.got)continue; const x=u.x-camX; if(x<-30||x>W+30)continue; drawPU(x, u.y+Math.sin(Date.now()/300+u.x)*4, u.kind, 15); }
  // friendly end-of-level boss
  if(L.boss){ const b=L.boss, x=b.x-camX; if(x>-130&&x<W+130){ const happy=b.defeated; const bob=Math.sin(t*3)*4 - (b.hit>0?7:0); const bw=b.w, bh=b.h, topY=b.y-bh+bob;
    ctx.fillStyle="rgba(0,0,0,.16)"; ctx.beginPath(); ctx.ellipse(x, GROUND_Y+6, bw*0.5, 10, 0,0,7); ctx.fill();
    ctx.fillStyle = happy? "#7bc86a" : "#a86fb0"; rrect(x-bw/2, topY, bw, bh, 22); ctx.fill();
    ctx.fillStyle="rgba(255,255,255,.18)"; rrect(x-bw/2+6, topY+6, bw-12, 13, 9); ctx.fill();
    ctx.fillStyle="#ffd23f"; const cy=topY-2; ctx.beginPath(); ctx.moveTo(x-18,cy); ctx.lineTo(x-18,cy-14); ctx.lineTo(x-9,cy-4); ctx.lineTo(x,cy-16); ctx.lineTo(x+9,cy-4); ctx.lineTo(x+18,cy-14); ctx.lineTo(x+18,cy); ctx.closePath(); ctx.fill();
    const ey=topY+bh*0.34; ctx.fillStyle="#fff"; ctx.beginPath(); ctx.arc(x-16,ey,10,0,7); ctx.arc(x+16,ey,10,0,7); ctx.fill();
    ctx.fillStyle="#222"; const ed=happy?-2:0; ctx.beginPath(); ctx.arc(x-16+ed,ey,4.5,0,7); ctx.arc(x+16+ed,ey,4.5,0,7); ctx.fill();
    ctx.strokeStyle="#222"; ctx.lineWidth=3; ctx.beginPath(); const my=topY+bh*0.66; if(happy) ctx.arc(x,my-4,12,0.15*Math.PI,0.85*Math.PI); else ctx.arc(x,my+10,11,1.15*Math.PI,1.85*Math.PI); ctx.stroke();
    if(!happy){ for(let i=0;i<b.maxHp;i++){ ctx.fillStyle = i<b.hp? "#ff6b8a":"rgba(255,255,255,.32)"; ctx.beginPath(); ctx.arc(x-(b.maxHp-1)*7+i*14, topY-26, 5,0,7); ctx.fill(); } }
  } }
  if(L.boss && !L.boss.defeated){ const bxs=L.barrierX-camX; if(bxs>-20&&bxs<W+20){ ctx.fillStyle="rgba(150,200,255,"+(0.10+0.05*Math.sin(t*4)).toFixed(3)+")"; ctx.fillRect(bxs-3,0,6,GROUND_Y+10); } }
  // goal flag
  const fx=L.goalX-camX; if(fx<W+80 && fx>-90){ const im=propImg("flag"); if(im){ const h=150, w=h*(im.naturalWidth/im.naturalHeight); ctx.drawImage(im, fx-w*0.16, GROUND_Y-h, w, h); } else { ctx.strokeStyle="#6a4a2a";ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(fx,GROUND_Y);ctx.lineTo(fx,GROUND_Y-120);ctx.stroke(); ctx.fillStyle=P.flag; ctx.beginPath();ctx.moveTo(fx,GROUND_Y-120);ctx.lineTo(fx+52,GROUND_Y-104);ctx.lineTo(fx,GROUND_Y-86);ctx.closePath();ctx.fill(); } }
  // landing dust
  for(const d of dust){ const x=d.x-camX; ctx.fillStyle="rgba(170,150,110,"+Math.min(0.6,d.life/26).toFixed(2)+")"; ctx.beginPath();ctx.arc(x,d.y,3,0,7);ctx.fill(); }
  // hero
  const hx=player.x-camX, hy=player.y;
  const sliding=player.slide>0;
  let scx=1, scy=1;
  if(player.land>0){ const k=player.land/8; scy=1-0.26*k; scx=1+0.26*k; }
  else if(!player.onGround){ if(player.vy<-1){ scy=1.12; scx=0.9; } else if(player.vy>4){ scy=1.07; scx=0.95; } }
  ctx.save(); ctx.translate(hx+24, hy+64); ctx.scale(scx*(player.face||1),scy); ctx.rotate(sliding?0:player.r*0.6);
  if(hero.complete && hero.naturalWidth){ if(sliding) ctx.drawImage(hero,-34,-40,68,40); else ctx.drawImage(hero,-30,-68,60,68); }
  else { ctx.fillStyle="#e8915a"; rrect(-22, sliding?-34:-60, 44, sliding?32:56, 16); ctx.fill(); }
  ctx.restore();
  if(shieldOn){ ctx.strokeStyle="rgba(90,170,255,.85)";ctx.lineWidth=3;ctx.beginPath();ctx.arc(hx+24,hy+28,34,0,7);ctx.stroke(); ctx.fillStyle="rgba(120,190,255,.16)";ctx.beginPath();ctx.arc(hx+24,hy+28,34,0,7);ctx.fill(); }
  if(starT>0){ ctx.fillStyle="rgba(255,220,90,.95)"; for(let s=0;s<3;s++){ const a=Date.now()/200+s*2.1; star5(hx+24+Math.cos(a)*30, hy+28+Math.sin(a)*30, 5); } }
  if(invuln>0 && !shieldOn && starT<=0 && Math.floor(invuln/6)%2===0){ ctx.fillStyle="rgba(255,255,255,.25)"; ctx.beginPath();ctx.arc(hx+24,hy+30,34,0,7);ctx.fill(); }
  // LAYER 6 — foreground ferns (parallax in front) + canopy framing the top
  { const sc=L.scene||{fore:[],top:[]};
    for(const fo of sc.fore){ const sx=fo.x-camX*1.25 + Math.sin(t2()*0.7+fo.ph)*6; if(sx<-200||sx>W+200)continue; if(groundUnder(sx+camX)==null)continue; const im=pieceImg("fern"); if(im){ ctx.globalAlpha=0.92; drawPiece(im, sx, H+28, 230*fo.s, fo.flip); ctx.globalAlpha=1; } }
    for(const tp of sc.top){ const sx=tp.x-camX*1.12; if(sx<-260||sx>W+260)continue; const im=pieceImg("canopy"); if(im) drawTopPiece(im, sx, 165*tp.s, tp.flip); }
  }
  // HUD
  ctx.fillStyle=P.hud; ctx.font="bold 22px Fredoka,sans-serif"; ctx.textAlign="left";
  ctx.fillText(L.name+"   Lv "+(li+1)+"/"+LEVELS.length, 18, 34);
  ctx.textAlign="right"; ctx.fillText(coinsGot+" / "+totalCoins, W-18, 34);
  ctx.fillStyle=P.enemy; for(let i=0;i<hearts;i++){ heart(W-44-i*30, 48, 11); }
  // star progress (top center)
  for(let i=0;i<totalStars;i++){ const sx=W/2+(i-(totalStars-1)/2)*30; ctx.fillStyle = i<starsGot?"#ffd23f":"rgba(255,255,255,.28)"; star5(sx,30,11); }
  // active power-up icons (top-left, under the level name)
  let pax=30; const acts=[["shield",shieldOn?1:0],["magnet",magnetT],["spring",springT],["star",starT]];
  for(const [k,v] of acts){ if(v>0){ drawPU(pax,66,k,12); pax+=32; } }
  // progress bar
  const pg=Math.min(1, player.x/L.goalX); ctx.fillStyle="rgba(255,255,255,.25)"; rrect(18,H-22,W-36,8,4);ctx.fill(); ctx.fillStyle=P.flag; rrect(18,H-22,(W-36)*pg,8,4);ctx.fill();
  // music track name toast (shown briefly when the song is changed)
  if(musicToast>0){ musicToast--; const nm=Music.current(); ctx.save(); ctx.font="bold 16px Fredoka,sans-serif"; ctx.textAlign="center"; const tw=ctx.measureText(nm).width+50, x=W/2, y=64; ctx.globalAlpha=Math.max(0,Math.min(1,musicToast/30)); ctx.fillStyle="rgba(20,30,50,.74)"; rrect(x-tw/2,y-16,tw,30,15); ctx.fill(); ctx.fillStyle="#ffd23f"; ctx.beginPath(); ctx.arc(x-tw/2+18,y+4,3.4,0,7); ctx.fill(); ctx.fillRect(x-tw/2+20.4,y-8,2,12); ctx.fillStyle="#fff"; ctx.fillText(nm, x+8, y+5); ctx.restore(); }
  // banners
  if(state==="win"){ banner(li<LEVELS.length-1?"Level Complete!":"You Win!", "You found "+starsGot+"/"+totalStars+" stars  \u00b7  Tap to play again"); }
  if(state==="lose"){ banner("Try Again!","Tap to restart this level"); }
}
function t2(){return Date.now()/1000;}
function banner(t,s){ ctx.fillStyle="rgba(0,0,0,.45)";ctx.fillRect(0,0,W,H); ctx.textAlign="center"; ctx.fillStyle="#fff";ctx.font="bold 40px Fredoka,sans-serif";ctx.fillText(t,W/2,H/2-6); ctx.font="20px Fredoka,sans-serif";ctx.fillText(s,W/2,H/2+34); }


function frame(){ update(); draw(); requestAnimationFrame(frame); }
startDemo();
requestAnimationFrame(frame);

// expose for QA / picker
window.BK_GAME = { startLevel:(i)=>startLevel(i), setBot:(b)=>{demoMode=false;botMode=b;started=true;paused=false;}, state:()=>state, level:()=>li,
  dbg:()=>({px:Math.round(player.x), goal:Math.round(L.goalX), started, runV:player.runV, hp:hearts, onG:player.onGround, vy:Math.round(player.vy), state}),
  // QA harness: run a "perfect player" headlessly (no rAF) through a level.
  frameStep:(n)=>{ demoMode=false; paused=false; for(let i=0;i<(n||1);i++){ update(); draw(); } },
  sim:(idx, maxFrames)=>{ demoMode=false; hearts=3; startLevel(idx); paused=false; botMode=true; started=true; inputLeft=false; inputRight=false; let f=0; const cap=maxFrames||8000;
    while(state==="play" && f<cap){ update(); f++; } botMode=false; inputLeft=false; inputRight=false; return { level:idx, result:state, frames:f, coins:coinsGot+"/"+totalCoins }; } };
</script>
