<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FDFAF5">
<title>Practice - Buildable Kids</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="/favicon-16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  /* Session PT1 — Practice. Cream brand tokens, same family as lessons.html.
     NO EMOJIS anywhere: every icon is drawn SVG geometry (product guardrail).
     Built touch-first for iPad and iPhone; every tap target is >= 56px tall.

     There is NO timer, NO countdown, NO clock and NO score in this page. Speed
     is measured silently and only ever moves a word's box. A kid must never be
     able to tell they are being timed. */
  :root{
    --ink:#0F0E17; --cream:#FDFAF5; --gold:#FFC542; --mint:#2FAE68; --sky:#37B6F5;
    --card:#FFFFFF; --sub:#6E6684; --line:#EDE5D6; --purple:#7C5CFC; --coral:#FF6B6B;
    --grad:linear-gradient(90deg,#7C5CFC 0%,#FF6B6B 100%);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:var(--cream);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;
       font-weight:800;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  .wrap{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
        padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}

  /* top bar */
  .top{display:flex;align-items:center;gap:10px;padding:12px 16px 6px}
  .top h1{font-family:'Fredoka',sans-serif;font-weight:600;font-size:21px;margin:0;flex:1;
          white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #back{width:44px;height:44px;flex:none;border-radius:13px;background:#fff;border:2px solid var(--line);
        display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
  /* Inside the shell the Home button belongs to the shell, so the page's own
     Back only appears once there is somewhere to step back TO. */
  body.in-app #back{display:none}
  body.in-app.canback #back{display:flex}
  body.in-app .top{padding-left:96px}

  /* a soft progress rail — how far through this run, never a clock */
  .rail{display:flex;gap:5px;padding:4px 16px 12px;min-height:16px}
  .rail i{flex:1;height:8px;border-radius:5px;background:#EBE3D3;transition:background .25s}
  .rail i.done{background:var(--grad)}
  .rail.hide{visibility:hidden}

  main{flex:1;padding:0 16px 34px}
  .hide{display:none !important}

  h2.title{font-family:'Fredoka',sans-serif;font-weight:600;font-size:23px;margin:4px 0 4px}
  p.lede{font-size:15px;color:var(--sub);margin:0 0 18px;line-height:1.4}

  /* deck + mode pickers */
  .picklist{display:flex;flex-direction:column;gap:11px;margin-bottom:22px}
  .pick{display:flex;align-items:center;gap:13px;width:100%;text-align:left;cursor:pointer;
        background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px 15px;
        font-family:'Nunito',sans-serif;font-weight:800;color:var(--ink);font-size:16px;
        box-shadow:0 5px 14px rgba(15,14,23,.05)}
  .pick[aria-pressed="true"]{border-color:var(--purple);box-shadow:0 6px 18px rgba(124,92,252,.20)}
  .pick .chip{width:46px;height:46px;flex:none;border-radius:14px;display:flex;align-items:center;
              justify-content:center;background:linear-gradient(160deg,#B197FF,#8A6BFF)}
  .pick .body{flex:1;min-width:0}
  .pick .nm{font-family:'Fredoka',sans-serif;font-weight:600;font-size:18px;line-height:1.15}
  .pick .sub{font-size:13px;color:var(--sub);font-weight:800;margin-top:2px}
  /* the per-deck mastery bar — honest: it only fills from real box-5 words */
  .bar{height:7px;border-radius:5px;background:#EBE3D3;overflow:hidden;margin-top:8px}
  .bar span{display:block;height:100%;background:var(--grad);border-radius:5px;transition:width .3s}

  .sectionlabel{font-size:11.5px;font-weight:900;letter-spacing:.09em;text-transform:uppercase;
                color:var(--purple);margin:2px 0 9px}

  .go{width:100%;border:none;cursor:pointer;border-radius:20px;padding:18px;font-size:19px;
      font-family:'Fredoka',sans-serif;font-weight:600;color:#fff;background:var(--grad);
      box-shadow:0 8px 20px rgba(124,92,252,.30)}
  .go[disabled]{opacity:.45;box-shadow:none;cursor:default}
  .ghost{width:100%;border:2px solid var(--line);background:#fff;color:var(--sub);cursor:pointer;
         border-radius:18px;padding:14px;font-size:16px;font-family:'Nunito',sans-serif;font-weight:800;
         margin-top:11px}

  /* ---- the intro moment (heart-word method) ---- */
  #intro .card{background:var(--card);border:2px solid var(--line);border-radius:26px;
               padding:30px 20px 24px;text-align:center;box-shadow:0 8px 22px rgba(15,14,23,.06)}
  .newflag{font-size:11.5px;font-weight:900;letter-spacing:.09em;text-transform:uppercase;
           color:var(--purple);margin-bottom:14px}
  .bigword{font-family:'Fredoka',sans-serif;font-weight:600;line-height:1.05;
           font-size:clamp(46px,17vw,84px);word-break:break-word;margin:6px 0 4px}
  /* The tricky letters GLOW — the part you have to know by heart. */
  .bigword .heart{color:var(--coral);position:relative;display:inline-block;
                  text-shadow:0 0 16px rgba(255,107,107,.55),0 0 34px rgba(255,107,107,.28);
                  animation:glow 1.5s ease-in-out infinite}
  @keyframes glow{0%,100%{text-shadow:0 0 12px rgba(255,107,107,.45),0 0 28px rgba(255,107,107,.20)}
                  50%{text-shadow:0 0 22px rgba(255,107,107,.80),0 0 46px rgba(255,107,107,.42)}}
  .hearthint{font-size:14.5px;color:var(--sub);margin:14px 0 0;line-height:1.4}
  .speaker{margin:18px auto 4px;width:74px;height:74px;border-radius:50%;border:2px solid var(--line);
           background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
  .speaker:active{transform:scale(.94)}

  /* ---- the question ---- */
  .asktop{text-align:center;margin:6px 0 16px;min-height:132px;display:flex;flex-direction:column;
          align-items:center;justify-content:center;gap:8px}
  .asklabel{font-size:14.5px;color:var(--sub);font-weight:800}
  /* Flash mode: the word appears for about a second, then goes. */
  .flashword{font-family:'Fredoka',sans-serif;font-weight:600;font-size:clamp(44px,16vw,78px);
             line-height:1.05;word-break:break-word;opacity:0;transition:opacity .16s}
  .flashword.on{opacity:1}
  .flashbox{min-height:96px;display:flex;align-items:center;justify-content:center}

  /* four big word cards */
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .wordcard{min-height:96px;border-radius:22px;border:2px solid var(--line);background:var(--card);
            cursor:pointer;font-family:'Fredoka',sans-serif;font-weight:600;color:var(--ink);
            font-size:clamp(24px,7.2vw,34px);line-height:1.1;word-break:break-word;padding:14px 8px;
            box-shadow:0 5px 14px rgba(15,14,23,.05);transition:transform .12s,border-color .16s,background .16s}
  .wordcard:active{transform:scale(.97)}
  .wordcard.right{border-color:var(--mint);background:#EAF8F0}
  .wordcard.wrongpick{border-color:var(--coral);background:#FFF0F0}
  .wordcard.showme{border-color:var(--mint)}
  .cards.locked .wordcard{cursor:default}
  @media (min-width:430px){ .wordcard{min-height:110px} }

  /* the gentle "here it is again" line — never a telling-off */
  .again{text-align:center;font-size:15px;color:var(--sub);margin:16px 0 0;min-height:22px}

  /* ---- the end of a run ---- */
  #done .card{background:var(--card);border:2px solid var(--line);border-radius:26px;padding:28px 20px;
              text-align:center;box-shadow:0 8px 22px rgba(15,14,23,.06)}
  .bignum{font-family:'Fredoka',sans-serif;font-weight:600;font-size:52px;line-height:1;margin:8px 0 2px}
  .wordchips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:16px 0 4px}
  .wordchip{background:#F6EFE1;border-radius:999px;padding:7px 14px;font-size:16px;
            font-family:'Fredoka',sans-serif;font-weight:600}

  .note{font-size:13.5px;color:var(--sub);text-align:center;margin-top:16px;line-height:1.45}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <button id="back" aria-label="Back">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#0F0E17" stroke-width="2.6"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <h1 id="h1">Practice</h1>
  </div>
  <div class="rail hide" id="rail"></div>

  <main>
    <!-- ---------- deck + mode picker ---------- -->
    <section id="home">
      <h2 class="title">What shall we practise?</h2>
      <p class="lede">Pick a set of words, then pick a way to play. Every word you get quick moves up a box, so you see it less and less.</p>
      <div class="sectionlabel">Word sets</div>
      <div class="picklist" id="decks"></div>
      <div class="sectionlabel">Ways to play</div>
      <div class="picklist" id="modes"></div>
      <button class="go" id="start" disabled>Start</button>
      <p class="note" id="homenote"></p>
    </section>

    <!-- ---------- intro moment for a brand new word ---------- -->
    <section id="intro" class="hide">
      <div class="card">
        <div class="newflag">A new word</div>
        <div class="bigword" id="introWord"></div>
        <button class="speaker" id="introSay" aria-label="Say it again">
          <svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 9v6h4l5 4V5L9 9H5z" fill="#0F0E17"/>
            <path d="M16.5 8.5c1.7 1.5 1.7 5.5 0 7M19 6c3 2.5 3 9.5 0 12" fill="none"
                  stroke="#0F0E17" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </button>
        <p class="hearthint" id="introHint"></p>
      </div>
      <button class="go" id="introGo" style="margin-top:16px">Got it</button>
    </section>

    <!-- ---------- the question ---------- -->
    <section id="ask" class="hide">
      <div class="asktop">
        <div class="asklabel" id="askLabel"></div>
        <div class="flashbox" id="flashBox"><div class="flashword" id="flashWord"></div></div>
        <button class="speaker" id="askSay" aria-label="Say it again" style="margin:0">
          <svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 9v6h4l5 4V5L9 9H5z" fill="#0F0E17"/>
            <path d="M16.5 8.5c1.7 1.5 1.7 5.5 0 7M19 6c3 2.5 3 9.5 0 12" fill="none"
                  stroke="#0F0E17" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
      <div class="cards" id="cards"></div>
      <p class="again" id="again"></p>
    </section>

    <!-- ---------- end of a run ---------- -->
    <section id="done" class="hide">
      <div class="card">
        <svg width="66" height="66" viewBox="0 0 24 24" aria-hidden="true" style="margin-bottom:2px">
          <circle cx="12" cy="12" r="10" fill="#2FAE68" opacity="0.14"/>
          <path d="M7.5 12.4l3 3 6-6.4" fill="none" stroke="#2FAE68" stroke-width="2.6"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div class="bignum" id="doneNum"></div>
        <div style="font-family:'Fredoka',sans-serif;font-weight:600;font-size:20px" id="doneLine"></div>
        <div id="doneMovedWrap" class="hide">
          <p class="hearthint" style="margin-top:18px">Words that moved up today</p>
          <div class="wordchips" id="doneMoved"></div>
        </div>
      </div>
      <button class="go" id="againBtn" style="margin-top:16px">Practise again</button>
      <button class="ghost" id="pickBtn">Pick another set</button>
    </section>
  </main>
</div>

<script src="/buildable-practice.js"></script>
<script>
(function(){
  "use strict";
  var BP = window.BuildablePractice;

  /* ---- shell awareness (lessons.html pattern) ---- */
  function iframed(){ try{ return window.parent && window.parent !== window; }catch(e){ return false; } }
  var IN_SHELL = iframed();
  function postToShell(msg){ if(IN_SHELL){ try{ window.parent.postMessage(msg,"*"); }catch(e){} } }
  if(IN_SHELL) document.body.classList.add("in-app");

  /* ---- who is practising ---- */
  function activeKid(){
    try{ var k=JSON.parse(localStorage.getItem("bk_active_kid_v1")||"null"); return (k&&k.id)?k:null; }
    catch(e){ return null; }
  }
  var KID = activeKid();
  var KID_ID = KID ? KID.id : null;
  var KID_GRADE = (KID && KID.grade) ? String(KID.grade) : null;

  var $ = function(id){ return document.getElementById(id); };
  var SECTIONS = ["home","intro","ask","done"];
  function show(which){
    SECTIONS.forEach(function(s){ $(s).classList.toggle("hide", s !== which); });
    $("rail").classList.toggle("hide", which === "home");
    document.body.classList.toggle("canback", which !== "home");
    try{ window.scrollTo(0,0); }catch(e){}
  }

  /* -----------------------------------------------------------------------
     AUDIO — three tiers, in order, so a kid always hears the word:
       1. the pre-generated file in /practice/audio/words/ (baked once by
          scripts/gen-practice-audio.mjs — instant, free, offline-friendly)
       2. /api/say, the live ElevenLabs pipeline (warm voice, cached
          server-side after the first play, so a missing file self-heals)
       3. the device voice (speechSynthesis) — always there, never pretty
     Audio unlocks on the first tap, as every game on this platform does.
  ----------------------------------------------------------------------- */
  var AUDIO = (function(){
    var cache = {};          // url -> HTMLAudioElement that has worked before
    var badFile = {};        // audio filenames already proved missing
    var current = null;
    function play(url){
      return new Promise(function(resolve, reject){
        var a = cache[url] || new Audio(url);
        cache[url] = a;
        try{ a.currentTime = 0; }catch(e){}
        current = a;
        var settled = false;
        var okDone = function(){ if(settled) return; settled = true; cleanup(); resolve(); };
        var bad = function(){ if(settled) return; settled = true; cleanup(); delete cache[url]; reject(new Error("audio")); };
        function cleanup(){ a.removeEventListener("ended", okDone); a.removeEventListener("error", bad); }
        a.addEventListener("ended", okDone);
        a.addEventListener("error", bad);
        var p = a.play();
        if(p && p.catch) p.catch(bad);
      });
    }
    function speak(text){
      try{
        if(!window.speechSynthesis) return;
        window.speechSynthesis.cancel();
        var u = new SpeechSynthesisUtterance(String(text));
        u.rate = 0.85; u.pitch = 1.05; u.lang = "en-US";
        window.speechSynthesis.speak(u);
      }catch(e){}
    }
    function stop(){
      try{ if(current){ current.pause(); } }catch(e){}
      try{ if(window.speechSynthesis) window.speechSynthesis.cancel(); }catch(e){}
    }
    // say(item, deck) — the whole ladder, in order.
    function say(item, deck){
      stop();
      var text = BP.sayOf(item);
      var file = item && item.audio;
      var base = (deck && deck.audioBase) || "/practice/audio/words/";
      var chain = Promise.reject();
      if(file && !badFile[file]) chain = chain.catch(function(){ return play(base + file); });
      chain
        .catch(function(){ if(file) badFile[file] = true; return play("/api/say?t=" + encodeURIComponent(text)); })
        .catch(function(){ speak(text); });
    }
    return { say: say, stop: stop, speak: speak };
  })();

  /* ---- decks ---- */
  var MODES = [
    { id:"find",  name:"Find It", sub:"Listen, then tap the word you heard" },
    { id:"flash", name:"Flash",   sub:"The word blinks — tap the one you saw" },
  ];
  var deckIndex = [], deck = null, deckId = null, mode = "find";

  function deckGlyph(){
    // Drawn SVG only. An open book.
    return '<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">' +
      '<path d="M4 5h6a2 2 0 0 1 2 2v12a2 2 0 0 0-2-2H4V5zm16 0h-6a2 2 0 0 0-2 2v12a2 2 0 0 1 2-2h6V5z" ' +
      'fill="#fff"/></svg>';
  }
  function modeGlyphFind(){
    return '<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">' +
      '<path d="M5 9v6h4l5 4V5L9 9H5z" fill="#fff"/>' +
      '<path d="M16.5 8.5c1.7 1.5 1.7 5.5 0 7" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg>';
  }
  function modeGlyphFlash(){
    return '<svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">' +
      '<path d="M13 2L4.5 13.5H11l-1 8.5 8.5-11.5H12l1-8.5z" fill="#fff"/></svg>';
  }

  function paintDecks(){
    var state = BP.loadState();
    var host = $("decks");
    host.innerHTML = "";
    deckIndex.forEach(function(d){
      var ds = BP.deckState(state, KID_ID, d.id);
      var seen = 0, mastered = 0;
      Object.keys(ds.items || {}).forEach(function(k){
        var r = ds.items[k]; if(!r || !r.seen) return;
        seen++; if(BP.clampBox(r.box) >= BP.MAX_BOX) mastered++;
      });
      var pct = d.count ? Math.round((mastered / d.count) * 100) : 0;
      var b = document.createElement("button");
      b.className = "pick"; b.type = "button";
      b.setAttribute("data-deck", d.id);
      b.setAttribute("aria-pressed", d.id === deckId ? "true" : "false");
      b.innerHTML =
        '<span class="chip">' + deckGlyph() + '</span>' +
        '<span class="body"><span class="nm">' + esc(d.name) + '</span>' +
        '<span class="sub">' + d.count + ' words' + (seen ? ' &middot; ' + mastered + ' known by heart' : ' &middot; ' + esc(d.blurb || "")) + '</span>' +
        '<span class="bar"><span style="width:' + pct + '%"></span></span></span>';
      b.addEventListener("click", function(){ deckId = d.id; paintDecks(); paintModes(); refreshStart(); });
      host.appendChild(b);
    });
  }
  function paintModes(){
    var host = $("modes");
    host.innerHTML = "";
    MODES.forEach(function(m){
      var b = document.createElement("button");
      b.className = "pick"; b.type = "button";
      b.setAttribute("data-mode", m.id);
      b.setAttribute("aria-pressed", m.id === mode ? "true" : "false");
      b.innerHTML =
        '<span class="chip">' + (m.id === "find" ? modeGlyphFind() : modeGlyphFlash()) + '</span>' +
        '<span class="body"><span class="nm">' + esc(m.name) + '</span>' +
        '<span class="sub">' + esc(m.sub) + '</span></span>';
      b.addEventListener("click", function(){ mode = m.id; paintModes(); refreshStart(); });
      host.appendChild(b);
    });
  }
  function refreshStart(){ $("start").disabled = !deckId; }
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
    return ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" })[c]; }); }

  /* ---- a run ---- */
  var run = null;   // { queue, i, answers, moved, shownAt }

  function startRun(){
    var state = BP.loadState();
    var ds = BP.deckState(state, KID_ID, deck.id);
    var built = BP.buildSession(deck, ds, {});
    if(!built.plan.length){ $("homenote").textContent = "Every word in this set is resting. Try another set — they come back over the next few days."; return; }
    run = { queue: built.plan.slice(), i: 0, answers: [], moved: [], shownAt: 0, total: built.plan.length };
    $("h1").textContent = deck.name;
    paintRail();
    step();
  }

  function paintRail(){
    var rail = $("rail");
    rail.innerHTML = "";
    var n = Math.max(1, run.total);
    for(var i=0;i<n;i++){
      var el = document.createElement("i");
      if(i < run.i) el.className = "done";
      rail.appendChild(el);
    }
  }

  function step(){
    if(!run || run.i >= run.queue.length){ finish(); return; }
    var entry = run.queue[run.i];
    paintRail();
    if(entry.intro) showIntro(entry); else showAsk(entry);
  }

  /* ---- the intro moment: word big, audio says it, tricky letters glow ---- */
  function showIntro(entry){
    var item = entry.item;
    var word = BP.answerOf(item);
    var heart = item.heart || [];
    var html = "";
    for(var i=0;i<word.length;i++){
      var ch = esc(word.charAt(i));
      html += heart.indexOf(i) >= 0 ? '<span class="heart">' + ch + '</span>' : ch;
    }
    $("introWord").innerHTML = html;
    $("introHint").textContent = heart.length
      ? "The glowing part is the tricky bit — you learn that part by heart."
      : "You can sound this one out, letter by letter.";
    show("intro");
    AUDIO.say(item, deck);
  }
  $("introSay").addEventListener("click", function(){
    var entry = run && run.queue[run.i];
    if(entry) AUDIO.say(entry.item, deck);
  });
  $("introGo").addEventListener("click", function(){
    var entry = run && run.queue[run.i];
    if(!entry) return;
    // The intro is not a question. Turn this card into the quiz for the same
    // word, right here, so a new word is met and then immediately used.
    entry.intro = false;
    showAsk(entry);
  });

  /* ---- the question: four big word cards ---- */
  var FLASH_MS = 1000;    // "flashes about 1s"
  var flashTimer = null;
  function showAsk(entry){
    var item = entry.item;
    var opts = BP.choices(deck, item, { count: 4 });
    $("again").textContent = entry.again ? "Here it comes again." : "";
    var cards = $("cards");
    cards.className = "cards";
    cards.innerHTML = "";
    opts.forEach(function(o){
      var b = document.createElement("button");
      b.className = "wordcard"; b.type = "button";
      b.setAttribute("data-word", BP.answerOf(o));
      b.textContent = BP.answerOf(o);
      b.addEventListener("click", function(){ answer(entry, o, b); });
      cards.appendChild(b);
    });

    if(flashTimer){ clearTimeout(flashTimer); flashTimer = null; }
    var fw = $("flashWord");
    if(mode === "flash"){
      $("askLabel").textContent = "Which word did you see?";
      $("askSay").classList.add("hide");
      fw.textContent = BP.answerOf(item);
      fw.classList.remove("on");
      show("ask");
      // paint, then flash: on next frame so the transition actually runs
      requestAnimationFrame(function(){
        fw.classList.add("on");
        AUDIO.say(item, deck);
        flashTimer = setTimeout(function(){
          fw.classList.remove("on");
          // The clock starts when the word GOES, not when it appears — a kid is
          // never timed on how long the page chose to show something.
          run.shownAt = Date.now();
        }, FLASH_MS);
      });
      run.shownAt = 0;
    } else {
      $("askLabel").textContent = "Tap the word you hear";
      $("askSay").classList.remove("hide");
      fw.textContent = "";
      fw.classList.remove("on");
      show("ask");
      AUDIO.say(item, deck);
      run.shownAt = Date.now();
    }
  }
  $("askSay").addEventListener("click", function(){
    var entry = run && run.queue[run.i];
    if(entry && mode !== "flash") AUDIO.say(entry.item, deck);
  });

  function answer(entry, picked, btn){
    var cards = $("cards");
    if(cards.classList.contains("locked")) return;
    cards.classList.add("locked");
    var item = entry.item;
    var correct = BP.answerOf(picked) === BP.answerOf(item);
    // Silently measured. Never rendered, never spoken, never stored anywhere a
    // kid can see. shownAt of 0 (the flash has not finished) counts as slow.
    var ms = run.shownAt ? (Date.now() - run.shownAt) : (BP.FAST_MS + 1);

    var before = BP.loadState();
    var beforeBox = BP.clampBox(((BP.deckState(before, KID_ID, deck.id).items || {})[item.id] || {}).box || 1);
    var rec = BP.recordAnswer(KID_ID, deck.id, item.id, { correct: correct, ms: ms });
    if(rec.box > beforeBox && run.moved.indexOf(BP.answerOf(item)) === -1) run.moved.push(BP.answerOf(item));
    run.answers.push({ itemId: item.id, correct: correct, ms: ms });

    if(correct){
      btn.classList.add("right");
      AUDIO.say(item, deck);
    }else{
      // No punishment: mark the tap, quietly light the right one, say it, and
      // put the word back in the queue a few cards later. That is all.
      btn.classList.add("wrongpick");
      Array.prototype.forEach.call(cards.children, function(c){
        if(c.getAttribute("data-word") === BP.answerOf(item)) c.classList.add("showme");
      });
      AUDIO.say(item, deck);
      BP.requeue(run.queue, run.i, entry);
    }
    setTimeout(function(){ run.i++; step(); }, correct ? 620 : 1250);
  }

  /* ---- the end of a run ---- */
  function finish(){
    if(flashTimer){ clearTimeout(flashTimer); flashTimer = null; }
    AUDIO.stop();
    var s = BP.summarize(run.answers);
    $("doneNum").textContent = String(s.right);
    $("doneLine").textContent = s.right === 1 ? "word right" : "words right";
    var wrap = $("doneMovedWrap"), chips = $("doneMoved");
    chips.innerHTML = "";
    if(run.moved.length){
      wrap.classList.remove("hide");
      run.moved.slice(0, 12).forEach(function(w){
        var c = document.createElement("span"); c.className = "wordchip"; c.textContent = w; chips.appendChild(c);
      });
    }else{
      wrap.classList.add("hide");
    }
    $("rail").classList.add("hide");
    logSession(run.answers);
    show("done");
  }

  /* ---- the learning ledger (Session 8B) --------------------------------
     ONE row per finished session, not one per answer — a practice run is the
     unit. In the shell, send the cartridge `skill` message up and let the
     shell relay it with the active kid attached (one writer). Standalone,
     POST it straight to the ledger. Never both. Fire and forget: a logging
     hiccup must never interrupt practice.                                  */
  function logSession(answers){
    if(!answers || !answers.length) return;
    var ev = BP.sessionEvent(deck, answers);
    if(IN_SHELL){
      postToShell({
        source:"buildable", kind:"skill",
        subject: ev.subject, skill: ev.skill, correct: ev.correct,
        quizType: ev.quizType, questionId: null, game: "practice"
      });
      return;
    }
    try{
      fetch("/api/log-learning-event", {
        method:"POST", headers:{"Content-Type":"application/json"}, keepalive:true,
        body: JSON.stringify({
          kidProfileId: KID_ID, grade: ev.grade || KID_GRADE || null,
          subject: ev.subject, skill: ev.skill, quizType: ev.quizType,
          correct: ev.correct, questionId: null, game: "practice"
        })
      }).catch(function(){});
    }catch(e){}
  }

  /* ---- navigation ---- */
  function toHome(){
    if(flashTimer){ clearTimeout(flashTimer); flashTimer = null; }
    AUDIO.stop();
    run = null;
    $("h1").textContent = "Practice";
    $("homenote").textContent = "";
    paintDecks(); paintModes(); refreshStart();
    show("home");
  }
  $("back").addEventListener("click", toHome);
  $("pickBtn").addEventListener("click", toHome);
  $("againBtn").addEventListener("click", function(){ startRun(); });
  $("start").addEventListener("click", function(){
    var meta = deckIndex.filter(function(d){ return d.id === deckId; })[0];
    if(!meta) return;
    $("start").disabled = true;
    $("homenote").textContent = "";
    fetch(meta.file).then(function(r){ return r.json(); }).then(function(d){
      deck = d; $("start").disabled = false; startRun();
    }).catch(function(){
      $("start").disabled = false;
      $("homenote").textContent = "That word set would not load. Check you are online and try again.";
    });
  });

  /* ---- boot ---- */
  fetch("/practice/decks/index.json").then(function(r){ return r.json(); }).then(function(d){
    deckIndex = (d && d.decks ? d.decks : []).slice().sort(function(a,b){ return (a.order||0) - (b.order||0); });
    // Start on the set that matches the kid's grade when there is one, so a
    // second grader is not staring at pre-primer.
    var byGrade = deckIndex.filter(function(x){ return KID_GRADE && String(x.grade) === KID_GRADE; })[0];
    deckId = (byGrade || deckIndex[0] || {}).id || null;
    paintDecks(); paintModes(); refreshStart();
    window.PRACTICE_READY = true;
  }).catch(function(){
    $("homenote").textContent = "The word sets would not load. Check you are online and try again.";
  });

  // Small surface for the QA harness — never used by the page itself.
  window.PRACTICE_PAGE = {
    decks: function(){ return deckIndex; },
    modes: MODES,
    run: function(){ return run; },
    setMode: function(m){ mode = m; paintModes(); },
    setDeck: function(id){ deckId = id; paintDecks(); refreshStart(); },
  };
})();
</script>
</body>
</html>
