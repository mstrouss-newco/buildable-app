<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Kidspedia — Topic Book</title>
<link rel="icon" href="/favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#0F0E17;--cream:#FDFAF5;--gold:#FFC542;--mint:#2FAE68;--sky:#37B6F5;--paper:#FBF6EC}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{overscroll-behavior:none}
  body{font-family:'Nunito',sans-serif;background:#101423;color:var(--cream);min-height:100vh}

  .top{display:flex;align-items:center;gap:10px;padding:12px 16px;max-width:648px;margin:0 auto}
  #back{width:38px;height:38px;border-radius:13px;border:none;background:rgba(255,255,255,.12);color:var(--cream);font-size:17px;font-weight:900;cursor:pointer;font-family:'Nunito'}
  .top h1{font-family:'Fredoka';font-weight:700;font-size:18px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .top h1 small{display:block;font-family:'Nunito';font-weight:900;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
  .shelfbtn{display:flex;align-items:center;gap:6px;flex:none;background:rgba(255,255,255,.12);border:none;border-radius:999px;padding:7px 12px;font-family:'Nunito';font-weight:900;font-size:12.5px;color:var(--cream);cursor:pointer}
  .shelfbtn svg{width:14px;height:14px}
  body.in-app #back{display:none}
  body.in-app .top{padding-left:96px}

  .bookwrap{max-width:620px;margin:0 auto;padding:0 14px calc(34px + env(safe-area-inset-bottom,0px))}
  .book{position:relative;border-radius:22px;overflow:hidden;background:var(--paper);color:var(--ink);box-shadow:0 16px 40px rgba(0,0,0,.45);touch-action:pan-y}
  .pages{display:flex;transition:transform .42s cubic-bezier(.2,.74,.24,1);will-change:transform}
  .page{flex:0 0 100%;min-width:100%;position:relative;background:var(--paper)}
  /* the gutter: a soft shadow down the binding edge so a page reads as paper
     bound into a book rather than a flat card. */
  .page::before{content:"";position:absolute;left:0;top:0;bottom:0;width:24px;z-index:4;pointer-events:none;
    background:linear-gradient(90deg,rgba(15,14,23,.15),rgba(15,14,23,0))}

  /* Session TB5 — the page turn. A light sweep travels across the paper in the
     direction of travel, the book gives one small breath, and the paper sound
     plays. No 3D flip: it must stay smooth on an old iPad. */
  .curl{position:absolute;inset:0;z-index:7;pointer-events:none;opacity:0;background-size:250% 100%;
    background-image:linear-gradient(102deg,rgba(15,14,23,0) 36%,rgba(15,14,23,.20) 45%,rgba(255,255,255,.5) 49%,rgba(15,14,23,.14) 54%,rgba(15,14,23,0) 64%)}
  .book.flipf .curl{animation:sweepf .46s cubic-bezier(.25,.7,.3,1)}
  .book.flipb .curl{animation:sweepb .46s cubic-bezier(.25,.7,.3,1)}
  @keyframes sweepf{0%{opacity:0;background-position:100% 0}14%{opacity:1}100%{opacity:0;background-position:-45% 0}}
  @keyframes sweepb{0%{opacity:0;background-position:-45% 0}14%{opacity:1}100%{opacity:0;background-position:100% 0}}
  .book.flipf,.book.flipb{animation:booknudge .42s ease}
  @keyframes booknudge{45%{transform:scale(.993)}100%{transform:scale(1)}}
  @media (prefers-reduced-motion:reduce){
    .pages{transition:none}
    .book.flipf,.book.flipb,.book.flipf .curl,.book.flipb .curl{animation:none}
  }
  .photo{position:relative;width:100%;aspect-ratio:4 / 3;background:linear-gradient(160deg,var(--fill,#2A3550),#141A2B);overflow:hidden}
  .photo img{width:100%;height:100%;object-fit:cover;display:block}
  .photo .painted{position:absolute;inset:0;display:flex;align-items:flex-end;padding:16px;font-family:'Fredoka';font-weight:600;font-size:15px;color:rgba(253,250,245,.82);background:radial-gradient(120% 90% at 30% 20%,rgba(255,255,255,.16),transparent 60%)}
  .photo .painted span{display:block}
  .ptitle{font-family:'Fredoka';font-weight:700;font-size:21px;padding:16px 18px 0;line-height:1.2}
  .pbody{padding:10px 18px 20px}
  .factbox{margin-top:12px}
  .facttext{font-size:15.5px;font-weight:700;line-height:1.55}
  .factsrc{margin-top:7px;font-size:10.5px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;color:rgba(15,14,23,.45)}
  .factnav{display:flex;align-items:center;gap:9px;margin-top:14px;flex-wrap:wrap}
  .dots{display:flex;gap:5px;flex:1}
  .dot{width:8px;height:8px;border-radius:50%;background:rgba(15,14,23,.16)}
  .dot.on{background:var(--ink)}
  .say{border:none;background:var(--gold);color:var(--ink);width:48px;height:48px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 4px 12px rgba(15,14,23,.18);transition:transform .08s ease,background .15s ease}
  .say:active{transform:scale(.93)}
  .say.playing{background:var(--mint);color:#fff}
  .say svg{width:22px;height:22px}
  .q{border:2px solid rgba(15,14,23,.15);background:none;border-radius:999px;padding:10px 15px;font-family:'Nunito';font-weight:800;font-size:12.5px;color:var(--ink);cursor:pointer}
  .q.next{background:var(--ink);border-color:var(--ink);color:#fff}
  .q.quiz{background:var(--mint);border-color:var(--mint);color:#fff}
  .q.tiein{background:var(--sky);border-color:var(--sky);color:#fff;display:inline-flex;align-items:center;gap:7px}
  .q.tiein svg{width:14px;height:14px;flex:none}

  /* cover spread */
  .page.cover .photo{aspect-ratio:3 / 4;max-height:56vh}
  .covertitle{font-family:'Fredoka';font-weight:700;font-size:30px;padding:16px 18px 0;line-height:1.1}
  .coverkicker{font-size:10px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:rgba(15,14,23,.45);padding:14px 18px 0}
  .coverblurb{padding:8px 18px 0;font-size:15px;font-weight:700;line-height:1.5;color:rgba(15,14,23,.72)}

  /* finish spread */
  .page.finish .photo{aspect-ratio:16 / 9}

  /* the dog-ear: a real folded paper corner, drawn, no emoji */
  .ear{position:absolute;right:0;bottom:0;width:74px;height:74px;border:none;background:none;padding:0;cursor:pointer;z-index:5}
  .ear svg{width:100%;height:100%;display:block}
  .ear .fold{fill:rgba(15,14,23,.10);transition:fill .18s ease}
  .ear .edge{fill:none;stroke:rgba(15,14,23,.22);stroke-width:2.5}
  .ear.on .fold{fill:var(--gold)}
  .ear.on .edge{stroke:rgba(15,14,23,.4)}
  .ear:active{transform:scale(.94)}
  .earhint{position:absolute;right:8px;bottom:8px;font-size:9.5px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:rgba(15,14,23,.5);z-index:6;pointer-events:none;transition:color .2s ease}
  .earhint.on{color:rgba(15,14,23,.72)}
  /* Session TB5 — the delight: the corner really creases down and throws a few
     gold flecks, so saving a page feels like folding paper. */
  .ear.pop svg{animation:earfold .44s cubic-bezier(.3,.8,.28,1)}
  @keyframes earfold{0%{transform:translate(7px,7px) rotate(-9deg)}55%{transform:translate(-1px,-1px) rotate(2deg)}100%{transform:none}}
  .sparks{position:absolute;right:30px;bottom:30px;width:0;height:0;z-index:6;pointer-events:none}
  .sparks i{position:absolute;width:7px;height:7px;border-radius:2px;background:var(--gold);opacity:0;box-shadow:0 1px 4px rgba(15,14,23,.25)}
  .sparks.go i{animation:sparkfly .62s cubic-bezier(.2,.8,.3,1) forwards}
  @keyframes sparkfly{0%{opacity:1;transform:translate(0,0) scale(.5) rotate(0)}
    100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.1) rotate(120deg)}}
  @media (prefers-reduced-motion:reduce){.ear.pop svg,.sparks.go i{animation:none}}

  .turns{display:flex;gap:10px;margin-top:12px;align-items:center}
  .turn{flex:none;width:52px;height:52px;border-radius:18px;border:none;background:rgba(255,255,255,.1);color:var(--cream);font-family:'Nunito';font-weight:900;font-size:20px;cursor:pointer}
  .turn:disabled{opacity:.3;cursor:default}
  .pagecount{flex:1;text-align:center;font-weight:900;font-size:12.5px;color:rgba(253,250,245,.72)}

  /* dog-ear shelf */
  .sheetbg{position:fixed;inset:0;background:rgba(1,3,16,.6);display:none;align-items:flex-end;justify-content:center;z-index:50}
  .sheetbg.open{display:flex}
  .sheet{background:var(--cream);color:var(--ink);border-radius:24px 24px 0 0;width:100%;max-width:560px;padding:20px 18px 34px;max-height:78vh;overflow-y:auto}
  .sheet h2{font-family:'Fredoka';font-weight:700;font-size:23px}
  .sheet .sub{font-size:12.5px;font-weight:800;color:rgba(15,14,23,.5);margin-top:4px}
  .earlist{margin-top:14px;display:flex;flex-direction:column;gap:9px}
  .earrow{display:flex;align-items:center;gap:11px;background:#F1EDE4;border:none;border-radius:16px;padding:10px 12px;cursor:pointer;text-align:left;font-family:'Nunito'}
  .earrow .thumb{width:52px;height:40px;border-radius:10px;background:#D9D2C4;flex:none;overflow:hidden}
  .earrow .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .earrow b{font-family:'Fredoka';font-weight:600;font-size:15px;display:block}
  .earrow small{font-size:11px;font-weight:800;color:rgba(15,14,23,.5)}
  .shelflink{margin-top:16px;width:100%;border:2px solid rgba(15,14,23,.15);background:none;color:var(--ink);font-family:'Nunito';font-weight:900;font-size:13.5px;padding:11px;border-radius:16px;cursor:pointer}
  .closebtn{margin-top:10px;width:100%;border:none;background:var(--ink);color:#fff;font-family:'Nunito';font-weight:900;font-size:14px;padding:13px;border-radius:16px;cursor:pointer}

  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;font-family:'Nunito';font-weight:800;font-size:13px;padding:10px 18px;border-radius:999px;z-index:80;opacity:0;pointer-events:none;transition:opacity .25s ease}
  .toast.show{opacity:1}
  .notready{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;flex-direction:column;gap:10px}
  .notready h2{font-family:'Fredoka';font-size:22px}
  .notready p{font-size:14px;color:rgba(253,250,245,.7);max-width:280px}
  .notready button{margin-top:6px;border:none;background:var(--gold);color:var(--ink);font-family:'Nunito';font-weight:900;font-size:14px;padding:11px 20px;border-radius:999px;cursor:pointer}
  .pauseveil{position:fixed;inset:0;background:rgba(11,10,24,.55);z-index:40;display:none;align-items:center;justify-content:center;font-family:'Fredoka';font-weight:700;font-size:16px}
  .pauseveil.show{display:flex}

  /* ================= Session RP1 — RICHER COMPOSED PAGES =================
     A page opts IN by carrying a "layout" (and/or per-fact art, and/or an
     "infographic" block). A page carrying none of those renders through the
     original one-photo path, unchanged — that is the replace-first rule, and
     it is what keeps the other 19 live books exactly as they are today.

     The look, locked across five mock rounds with Mike:
      - three photos a page: the hero plus one per fact, so no fact is text-only
      - composed editorial layouts that ECHO THE SUBJECT, never a tidy grid
      - picture-first "Wow chart" infographics: real things carry the meaning,
        bars only carry magnitude
      - read-aloud is a round SPEAKER, floated so the words wrap around it
      - US units everywhere                                                    */
  .rp{--bkblue:#4A6FA5;--bkdeep:#33507E;--bkgold:#E8B84B}
  .page.rich .pbody{padding:0 18px 24px}
  .facts{position:relative;display:flex;flex-direction:column;gap:18px;margin-top:14px}
  .fcard{position:relative;z-index:1}
  .fcard::after{content:"";display:block;clear:both}
  .fcard .facttext{font-size:15.5px;font-weight:700;line-height:1.55}
  .fcard .factsrc{margin-top:7px;font-size:10.5px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;color:rgba(15,14,23,.45);clear:both}
  /* The round speaker. FLOATED, never absolutely positioned: an absolute button
     sat on top of the words (Mike caught it in a screenshot), a float makes the
     sentence flow around it. */
  .say.mini{float:right;margin:1px 0 8px 12px;width:42px;height:42px;box-shadow:0 3px 10px rgba(15,14,23,.16)}
  .say.mini svg{width:20px;height:20px}

  /* Every fact photo is a FRAME with the picture inside it. The frame is what
     clips: a detail crop is a zoomed image, and without its own clipping box it
     spills straight out over the page (it did, off the left edge). */
  .fphoto{position:relative;margin:0 0 11px;border-radius:14px;background:#E7E1D5;aspect-ratio:16 / 10}
  .fphoto .frame{position:absolute;inset:0;overflow:hidden;border-radius:inherit}
  .fphoto img{display:block;width:100%;height:100%;object-fit:cover}
  .fphoto .cap{position:absolute;left:0;right:0;bottom:0;padding:16px 10px 8px;font-size:11px;font-weight:800;line-height:1.35;color:#fff;
    background:linear-gradient(to top,rgba(15,14,23,.72),rgba(15,14,23,0))}
  /* a taped-down snapshot: paper, a shadow, a small tilt, caption on the paper */
  .fphoto.polaroid{background:#fff;padding:8px;border-radius:5px;box-shadow:0 10px 24px rgba(15,14,23,.2);transform:rotate(-2.2deg);aspect-ratio:auto}
  .fphoto.polaroid .frame{position:static;display:block;aspect-ratio:4 / 3;border-radius:3px}
  /* the caption sits ON the paper, in the flow — an absolute one climbed back
     over the photo as soon as it ran to two lines */
  .fphoto.polaroid .cap{position:static;padding:7px 2px 3px;color:rgba(15,14,23,.62);background:none;font-size:10px;line-height:1.3;text-align:center}
  .fphoto .tape{position:absolute;top:-9px;left:50%;margin-left:-30px;width:60px;height:19px;border-radius:2px;background:rgba(232,184,75,.6);box-shadow:0 1px 3px rgba(15,14,23,.14)}

  /* --- layout: speed (bullet trains). A slanted photo edge, streaks of speed,
         one giant number, and a snapshot that overlaps the column. --- */
  .lay-speed .photo{clip-path:polygon(0 0,100% 0,100% 92%,0 100%)}
  /* the slants: a hint of motion off the left edge, never a scratched screen */
  .lay-speed .photo::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(101deg,rgba(255,255,255,.5) 0 2px,rgba(255,255,255,0) 2px 42px);opacity:.22;
    -webkit-mask-image:linear-gradient(90deg,#000,transparent 46%);mask-image:linear-gradient(90deg,#000,transparent 46%)}
  .bigstat{position:absolute;right:15px;bottom:11%;z-index:3;text-align:right;font-family:'Fredoka';color:#fff;text-shadow:0 3px 16px rgba(0,0,0,.6);pointer-events:none}
  .bigstat b{display:block;font-size:52px;line-height:.88;font-weight:700}
  .bigstat span{font-size:11.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase}
  .lay-speed .ptitle{padding-bottom:2px}
  /* the snapshot is a positioned, rotated element, so it paints OVER the words
     that flow past it — the gap has to be wide enough to cover the tilt */
  .lay-speed .fcard.n1 .fphoto{width:40%;float:left;margin:2px 20px 10px 0}

  /* --- layout: long (freight). A wide panorama, then a dashed track running
         down the page with the facts hung off it like cars. --- */
  .lay-long .photo{aspect-ratio:21 / 9}
  .lay-long .facts{padding-left:24px}
  .lay-long .facts::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:0;border-left:3px dashed rgba(74,111,165,.5);z-index:0}
  .lay-long .fcard::before{content:"";position:absolute;left:-24px;top:9px;width:15px;height:3px;border-radius:2px;background:rgba(74,111,165,.6)}
  .lay-long .fphoto{aspect-ratio:21 / 9}

  /* --- layout: then-now (the subway). A ghost year behind the words and a
         sepia THEN beside a bright NOW. --- */
  /* the ghost year gets its own band under the title: printed faintly behind
     the page, but never underneath a line a kid is trying to read */
  .lay-then-now .facts{margin-top:44px}
  .ghostyear{position:absolute;right:3px;top:-52px;font-family:'Fredoka';font-weight:700;font-size:76px;line-height:1;color:rgba(51,80,126,.13);z-index:0;pointer-events:none;letter-spacing:-.02em}
  .pairrow{display:grid;grid-template-columns:1fr 1fr;gap:11px;position:relative;z-index:1}
  .pairrow>div{position:relative}
  .pairrow .fphoto{margin-bottom:0;aspect-ratio:1 / 1}
  .pairrow .fphoto.then img{filter:sepia(.6) contrast(.94) brightness(1.02)}
  .pairtag{position:absolute;top:8px;left:8px;font-size:9.5px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:#fff;background:rgba(51,80,126,.82);padding:3px 8px;border-radius:999px}

  /* --- layout: close-up (the wheels). Circle crops the words wrap around. --- */
  .lay-close-up .fphoto{border-radius:50%;width:128px;aspect-ratio:1 / 1;float:left;margin:3px 15px 8px 0;box-shadow:0 6px 16px rgba(15,14,23,.18)}
  .lay-close-up .fphoto .cap{display:none}
  .lay-close-up .fcard.n2{padding-left:14px}

  /* --- layout: tall (Session RP3). For pages whose whole point is HOW TALL a
         thing is: a standing-up photo with a height ruler measured down its
         side, a little drawn kid at the foot of the ruler for scale, and the
         giant number reading as the height. Six pages across four books asked
         for this shape and none of the first four fitted it. --- */
  .lay-tall .photo{aspect-ratio:4 / 5}
  /* the ruler lives INSIDE the photo box, so it scales with the photo instead
     of drifting off it the way an absolutely-placed .bigstat once did */
  .ruler{position:absolute;left:13px;top:9%;bottom:15%;width:30px;z-index:3;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}
  .ruler i{display:block;width:12px;height:3px;border-radius:2px;background:rgba(255,255,255,.9);box-shadow:0 1px 5px rgba(0,0,0,.45)}
  .ruler i:nth-child(odd){width:22px}
  .ruler::before{content:"";position:absolute;left:0;top:-2px;bottom:-2px;width:3px;border-radius:2px;background:rgba(255,255,255,.75);box-shadow:0 1px 5px rgba(0,0,0,.45)}
  .scalekid{position:absolute;left:9px;bottom:3.5%;z-index:3;width:38px;height:29px;pointer-events:none;
    filter:drop-shadow(0 2px 5px rgba(0,0,0,.5))}
  .scalekid svg{width:100%;height:100%;display:block;fill:#fff;stroke:#fff}
  .lay-tall .bigstat{bottom:auto;top:8%}
  /* a standing photo beside the words: portrait, floated, and given a wide
     enough margin that the text never crowds it */
  .lay-tall .fphoto.standing{width:42%;aspect-ratio:3 / 4;float:right;margin:2px 0 10px 18px}

  /* --- the Wow chart. White card, thick brand border, a small tilt, and a pill
         that names it, so a kid learns to look for one. --- */
  .wow{position:relative;margin-top:22px;background:#fff;border:3px solid #E8B84B;border-radius:18px;padding:14px 14px 13px;
    box-shadow:0 10px 26px rgba(15,14,23,.15);transform:rotate(-.7deg)}
  .wow.blue{border-color:var(--book,#4A6FA5)}
  .wow::before{content:"";position:absolute;inset:0;border-radius:15px;background:linear-gradient(160deg,rgba(232,184,75,.09),rgba(74,111,165,.06));pointer-events:none}
  .wow>*{position:relative}
  .wow .pill{display:inline-block;background:#E8B84B;color:#2A2005;font-weight:900;font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;padding:4px 10px;border-radius:999px}
  .wow.blue .pill{background:var(--book,#4A6FA5);color:#fff}
  .wow h4{font-family:'Fredoka';font-weight:700;font-size:17.5px;line-height:1.2;margin-top:9px;color:#33507E}
  .wow .cap{margin-top:10px;font-size:11.5px;font-weight:800;line-height:1.45;color:rgba(15,14,23,.62)}
  .wow .src{margin-top:6px;font-size:9.5px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;color:rgba(15,14,23,.4)}
  .wowrows{margin-top:11px;display:flex;flex-direction:column;gap:11px}
  .wowrow{display:grid;grid-template-columns:48px 1fr;gap:11px;align-items:center}
  .glyph{width:48px;height:36px;display:block;border-radius:8px;overflow:hidden}
  .glyph img{width:100%;height:100%;object-fit:cover;display:block}
  .barwrap{min-width:0}
  .lab{font-size:11.5px;font-weight:900;color:rgba(15,14,23,.68);line-height:1.25}
  .bar{height:13px;border-radius:999px;background:rgba(15,14,23,.11);margin-top:5px;position:relative;overflow:hidden}
  .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:linear-gradient(90deg,var(--book,#4A6FA5),rgba(15,14,23,.45))}
  .num{font-family:'Fredoka';font-weight:700;font-size:15px;color:#33507E;margin-top:4px}
  .fieldrow{margin-top:2px}
  .fieldstrip{display:flex;flex-wrap:wrap;align-items:center;gap:3px;margin-top:6px}
  .fieldstrip svg{width:27px;height:17px;flex:none}
  .fieldmore{font-family:'Fredoka';font-weight:700;font-size:14px;color:#33507E;margin-left:5px}
  /* the timeline: photo chips, the dashed track running under them, then the
     year and who. Three stops fit a phone; more than three simply scroll. */
  .tl{margin-top:12px;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .tlinner{min-width:100%}
  .tlgrid{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(84px,1fr);gap:8px}
  .tlstop{text-align:center}
  .tlstop .chip{width:100%;height:60px;border-radius:12px;overflow:hidden;background:#E9E3D6;border:2px solid #4A6FA5;display:flex;align-items:center;justify-content:center}
  .tlstop .chip img{width:100%;height:100%;object-fit:cover;display:block}
  .tlstop .chip svg{width:46px;height:34px}
  .tlcap{text-align:center}
  .tlcap .yr{font-family:'Fredoka';font-weight:700;font-size:15px;color:#33507E}
  .tlcap .who{font-size:9.5px;font-weight:800;color:rgba(15,14,23,.58);line-height:1.28;margin-top:2px}
  .tlline{height:3px;margin:9px 0 8px;background:repeating-linear-gradient(90deg,#4A6FA5 0 11px,transparent 11px 19px)}
  .diag{margin-top:12px}
  .diag svg{width:100%;height:auto;display:block}
  @media (prefers-reduced-motion:reduce){.wow,.fphoto.polaroid{transform:none}}

  /* ============ Session TB5 — fit check: phone, iPad, and landscape ============
     The book is one column everywhere; only its measurements change. Notches and
     home bars are respected so no control ever sits under them. */
  @supports (height:100dvh){ body{min-height:100dvh} .page.cover .photo{max-height:56dvh} .sheet{max-height:78dvh} }
  .top{padding-top:calc(12px + env(safe-area-inset-top,0px))}
  .sheet{padding-bottom:calc(34px + env(safe-area-inset-bottom,0px))}
  .toast{bottom:calc(22px + env(safe-area-inset-bottom,0px))}

  /* Short phones (iPhone SE, and any phone with the browser bars showing): a
     shallower photo keeps the fact and both buttons above the fold. */
  @media (max-height:700px){
    .photo{aspect-ratio:16 / 10}
    .page.cover .photo{aspect-ratio:1 / 1;max-height:42vh}
    .ptitle{font-size:19px;padding-top:13px}
    .pbody{padding-bottom:16px}
  }
  /* A phone held sideways: the page becomes a real spread — photo on the left,
     words on the right — so nothing important falls below the screen. */
  @media (orientation:landscape) and (max-height:560px){
    .bookwrap{max-width:none;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
    /* keep the turn buttons on screen: the book never outgrows the window */
    .book{max-height:calc(100vh - 126px)}
    .page{display:grid;grid-template-columns:44% 1fr;grid-template-rows:auto 1fr;overflow-y:auto}
    .photo{grid-row:1 / span 2;aspect-ratio:auto;height:100%;max-height:none;min-height:238px}
    /* the cover is a spread too: art on the left, title and Start on the right */
    .page.cover{grid-template-rows:min-content min-content min-content 1fr}
    .page.cover .photo{grid-row:1 / span 4;max-height:none}
    .coverkicker{padding-top:16px}
    .ptitle{padding:12px 16px 0;font-size:17.5px}
    .pbody{padding:6px 16px 14px}
    .factbox{margin-top:8px}
    .facttext{font-size:13.5px;line-height:1.45}
    .factsrc{font-size:9.5px;margin-top:5px}
    .factnav{margin-top:9px;gap:8px}
    .say{width:42px;height:42px}
    .say svg{width:19px;height:19px}
    .q{padding:8px 13px;font-size:12px}
    .covertitle{font-size:24px}
    .turns{margin-top:8px}
    .turn{width:46px;height:46px}
    .ear{width:62px;height:62px}
    /* RP1: a sideways phone gets the tall photo column, so the composed page
       drops its slant and its panorama crop and simply reads down the right. */
    .lay-speed .photo,.lay-long .photo{clip-path:none}
    .lay-speed .photo::after{display:none}
    /* A composed page is TALL, and a full-height photo column would stretch the
       picture into a slice of sky. Keep it a real photo at the top of the
       column and let it ride along as the words scroll. */
    .page.rich .photo{grid-row:1 / span 2;align-self:start;height:auto;min-height:0;aspect-ratio:4 / 3;position:sticky;top:0}
    .bigstat{bottom:12%}
    .bigstat b{font-size:38px}
    .page.rich .pbody{padding:6px 16px 16px}
    .facts{gap:13px;margin-top:10px}
    .lay-speed .fcard.n1 .fphoto{width:52%}
    .lay-close-up .fphoto{width:94px}
    /* RP3: sideways, the tall page's photo joins the same 4/3 column as the
       rest, so the ruler shortens with it rather than running off the frame. */
    .lay-tall .fphoto.standing{width:50%}
    .ruler{top:8%;bottom:18%;width:24px}
    .scalekid{width:30px;height:23px}
    .lay-tall .bigstat{top:6%}
    .wow{margin-top:14px;padding:11px}
    .ghostyear{font-size:58px;top:-20px}
  }
  /* iPad and up: a wider page with bigger type, still one comfortable column.
     The height floor keeps a sideways phone (also wide) out of this block. */
  @media (min-width:820px) and (min-height:620px){
    .bookwrap{max-width:760px;padding-bottom:44px}
    .book{border-radius:26px}
    .photo{max-height:52vh}
    .ptitle{font-size:25px;padding:20px 24px 0}
    .covertitle{font-size:36px;padding:18px 24px 0}
    .coverkicker,.coverblurb{padding-left:24px;padding-right:24px}
    .pbody{padding:12px 24px 24px}
    .facttext{font-size:17.5px}
    .factsrc{font-size:11.5px}
    .say{width:54px;height:54px}
    .q{font-size:13.5px;padding:11px 18px}
    .ear{width:86px;height:86px}
    .top{max-width:760px}
    /* RP1: on an iPad the composed page gets room to breathe. */
    .page.rich .pbody{padding:0 24px 28px}
    .fcard .facttext{font-size:17.5px}
    .fcard .factsrc{font-size:11.5px}
    .say.mini{width:50px;height:50px}
    .say.mini svg{width:23px;height:23px}
    .bigstat b{font-size:68px}
    .lay-close-up .fphoto{width:168px}
    .lay-tall .fphoto.standing{width:38%}
    .ruler{width:40px}
    .ruler i{height:4px}
    .scalekid{width:52px;height:40px;left:12px}
    .wow h4{font-size:20px}
    .wow .cap{font-size:12.5px}
    .ghostyear{font-size:110px;top:-40px}
  }
</style>
</head>
<body>

<div id="app" style="display:none">
  <div class="top">
    <button id="back">&lsaquo;</button>
    <h1><small>Kidspedia</small><span id="pageTitle">Loading…</span></h1>
    <button class="shelfbtn" id="shelfBtn" type="button" aria-label="My dog-ears">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11l3 3v13l-7-4-7 4Z"/></svg>
      <span id="earCount">0</span>
    </button>
  </div>

  <div class="bookwrap">
    <div class="book" id="book"><div class="pages" id="pages"></div><div class="curl" id="curl" aria-hidden="true"></div></div>
    <div class="turns">
      <button class="turn" id="prev" type="button" aria-label="Previous page">&lsaquo;</button>
      <div class="pagecount" id="pagecount"></div>
      <button class="turn" id="next" type="button" aria-label="Next page">&rsaquo;</button>
    </div>
  </div>

  <div class="sheetbg" id="sheetbg">
    <div class="sheet">
      <h2>My dog-ears</h2>
      <div class="sub" id="earSub">Pages you folded a corner on.</div>
      <div class="earlist" id="earlist"></div>
      <button class="shelflink" id="allEars" type="button">See all my dog-ears</button>
      <button class="closebtn" id="closeSheet" type="button">Back to the book</button>
    </div>
  </div>
</div>

<div id="notready" class="notready" style="display:none">
  <h2 id="notreadyTitle">Not ready yet</h2>
  <p id="notreadyMsg">This book isn't open yet. Check back soon!</p>
  <button id="notreadyBtn" type="button">Back to Explore</button>
</div>

<div class="pauseveil" id="pauseveil">Paused</div>
<div class="toast" id="toast"></div>

<script src="/buildable-gamenav.js"></script>
<script src="/buildable-audio.js"></script>
<script src="/buildable-feel.js"></script>
<script>
"use strict";
// =====================================================================
// Kidspedia TOPIC-BOOK template (Session TB1).
//
// Templates are code, exhibits are data (EXHIBIT-MANIFEST.md). This file
// owns the picture-book feel — the page-turn, the read-aloud button, the
// dog-ear corner-fold, the quiz bridge — and NOTHING else. Every word a
// kid reads, every photo, and every source line comes from the exhibit
// JSON at /explore/{id}.json.
//
// A topic book is: a cover spread, then 4-5 photo pages, then a finish
// spread. A page comes in two shapes and the BOOK chooses which:
//   - the original: one full-width photo + 2-3 facts shown one at a time
//   - Session RP1's richer page: a composed layout that echoes the subject,
//     three photos, every fact on screen with its own picture and source,
//     and a picture-first "Wow chart" at the bottom
// Each fact always carries its own source, in both shapes.
//
// Dog-ears follow the KID, not the device: they are stored in Supabase
// through /api/saved-pages (localStorage is only a fast local mirror so
// the fold is instant and still works offline). No emojis (product rule).
// =====================================================================

function exhibitIdFromLocation() {
  const m = location.pathname.match(/\/explore\/([a-z0-9-]+)/i);
  if (m) return m[1];
  const q = new URLSearchParams(location.search).get("exhibit");
  return q || "sharks";
}
const EXHIBIT_ID = exhibitIdFromLocation();
// Session TB2. ?page=<pageId> opens the book straight at that page — this is
// what a dog-ear on the bookshelf clicks. ?from=shelf remembers that the kid
// arrived from the bookshelf, so Back goes back THERE and not all the way Home.
const QS = new URLSearchParams(location.search);
const DEEP_PAGE = (QS.get("page") || "").trim();
const FROM_SHELF = QS.get("from") === "shelf";
const BOOKSHELF_URL = "/explore/kidspedia";

function iframed() { try { return window.parent && window.parent !== window; } catch (e) { return false; } }
function postToShell(msg) { if (iframed()) { try { window.parent.postMessage(msg, "*"); } catch (e) {} } }
function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => t.classList.remove("show"), 2200);
}
function escapeHtml(s) { return (s || "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

let DATA = null;        // the loaded exhibit file
let SPREADS = [];       // cover + pages + finish, in reading order
let pageIdx = 0;        // which spread is showing
let factIdx = {};       // spread index -> which fact is showing
let paused = false;
let soundOn = true;
let audioUnlocked = false;
let ambientAudio = null;
let narrAudio = null;
let speaking = false;
let sayToken = 0;
const ears = new Set(); // page ids the kid has dog-eared in THIS book

if (iframed()) document.body.classList.add("in-app");

function exitToShell() {
  // Came from the bookshelf? Go back to the bookshelf (inside the shell frame
  // this is just the next page in the same wrapper, so Home still works).
  if (FROM_SHELF) { location.href = BOOKSHELF_URL; return; }
  postToShell("nav:exit");
  if (!iframed()) { history.length > 1 ? history.back() : (location.href = "/"); }
}
function goToBookshelf() { location.href = BOOKSHELF_URL; }

function showFallback(kind, msg) {
  try { document.getElementById("app").style.display = "none"; } catch (e) {}
  const title = document.getElementById("notreadyTitle");
  const body = document.getElementById("notreadyMsg");
  if (kind === "error") {
    title.textContent = "Oops!";
    body.textContent = msg || "This book had trouble loading. Let's try again in a moment.";
  } else {
    title.textContent = "Not ready yet";
    body.textContent = msg || "This book isn't open yet. Check back soon!";
  }
  document.getElementById("notready").style.display = "flex";
}
document.getElementById("notreadyBtn").onclick = exitToShell;

// =====================================================================
// WHO IS READING — the shell keeps the signed-in kid in localStorage
// (same key every engine uses). Signed in => the kid lane, so dog-ears
// follow them to any device. Not signed in => a device lane, honest and
// local-only, never a lie about syncing.
// =====================================================================
function activeKidId() {
  try { const k = JSON.parse(localStorage.getItem("bk_active_kid_v1") || "null"); return (k && k.id) ? String(k.id) : null; }
  catch (e) { return null; }
}
function deviceId() {
  try {
    let d = localStorage.getItem("bk_guest_device");
    if (!d) { d = "g_" + Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem("bk_guest_device", d); }
    return d;
  } catch (e) { return "g_local"; }
}
function ownerKey() { const k = activeKidId(); return k ? ("kid:" + k) : ("dev:" + deviceId()); }
function localEarKey() { return "bk_dogears_v1:" + ownerKey(); }

function readLocalEars() {
  try { const raw = JSON.parse(localStorage.getItem(localEarKey()) || "{}"); return (raw && raw[EXHIBIT_ID]) || []; }
  catch (e) { return []; }
}
function writeLocalEars(list) {
  try {
    const raw = JSON.parse(localStorage.getItem(localEarKey()) || "{}");
    raw[EXHIBIT_ID] = list;
    localStorage.setItem(localEarKey(), JSON.stringify(raw));
  } catch (e) {}
}

// Cloud read: never blocks the book. The page renders from the local
// mirror instantly and the cloud answer just tops it up when it lands.
function pullEars() {
  const url = "/api/saved-pages?owner=" + encodeURIComponent(ownerKey()) + "&exhibitId=" + encodeURIComponent(EXHIBIT_ID);
  return fetch(url, { cache: "no-store" })
    .then((r) => (r.ok ? r.json() : null))
    .then((j) => {
      if (!j || !j.ok || !Array.isArray(j.pages)) return;
      ears.clear();
      j.pages.forEach((p) => { if (p && p.saved !== false && p.pageId) ears.add(p.pageId); });
      writeLocalEars([...ears]);
      renderEarUi();
    })
    .catch(() => {});
}
function pushEar(pageId, saved, title) {
  return fetch("/api/saved-pages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      owner: ownerKey(), kidProfileId: activeKidId(), deviceId: deviceId(),
      exhibitId: EXHIBIT_ID, exhibitTitle: (DATA && DATA.title) || EXHIBIT_ID,
      pageId: pageId, pageTitle: title || "", saved: !!saved,
    }),
  }).catch(() => {});
}

// ---------- boot ----------
fetch("/explore/" + encodeURIComponent(EXHIBIT_ID) + ".json", { cache: "no-store" })
  .then((r) => { if (!r.ok) throw new Error("missing"); return r.json(); })
  .then((data) => {
    // Golden rule #2: kids only ever see status "approved". No exception.
    if (!data || data.status !== "approved") { showFallback("notready"); return; }
    if (data.template !== "topic-book") { showFallback("error"); return; }
    DATA = data;
    boot(data);
  })
  .catch(() => { showFallback("error"); });

function boot(data) {
  document.getElementById("app").style.display = "block";
  document.title = "Kidspedia — " + data.title;
  document.getElementById("pageTitle").textContent = data.title;

  SPREADS = buildSpreads(data);
  readLocalEars().forEach((id) => ears.add(id));
  buildPages();
  goTo(spreadIndexFor(DEEP_PAGE), true);
  renderEarUi();
  pullEars();
  checkTieIn(data);

  document.getElementById("back").onclick = exitToShell;
  document.getElementById("prev").onclick = () => turn(-1);
  document.getElementById("next").onclick = () => turn(1);
  document.getElementById("shelfBtn").onclick = openShelf;
  document.getElementById("closeSheet").onclick = closeShelf;
  document.getElementById("allEars").onclick = goToBookshelf;
  document.getElementById("sheetbg").onclick = (e) => { if (e.target && e.target.id === "sheetbg") closeShelf(); };
  initSwipe();
  initAudio(data);

  // Honor pause/resume from the shell around the quiz gate (CARTRIDGE-CONTRACT.md — mandatory).
  window.addEventListener("message", (e) => {
    const d = e && e.data;
    if (d === "pause" || (d && d.type === "pause")) setPaused(true);
    else if (d === "resume" || (d && d.type === "resume")) setPaused(false);
  });
  window.addEventListener("keydown", (e) => {
    if (!e) return;
    if (e.key === "ArrowRight") turn(1);
    else if (e.key === "ArrowLeft") turn(-1);
  });
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) { stopAmbient(); stopNarration(); }
    else if (!paused) { startAmbient(); }
  });
}

// The reading order: cover, every content page, then the finish spread.
// Only content pages can be dog-eared (a cover has nothing to remember).
function buildSpreads(data) {
  const out = [];
  const cover = data.cover || {};
  // Session RP3 — every book paints its own charts. The drawn glyphs and the
  // Wow chart border used to be hardcoded to the Trains blue, which made a
  // blue camel on a gold desert page. One variable, set from the shelf colour
  // the book already declares, and a book never looks borrowed again.
  document.documentElement.style.setProperty("--book", data.shelfColor || "#4A6FA5");
  out.push({ kind: "cover", id: "cover", title: data.title, blurb: cover.blurb || "", art: cover.art || data.heroArt || "", artAlt: cover.artAlt || "", fill: data.shelfColor || "#2A3550" });
  (data.pages || []).forEach((p) => {
    const facts = normaliseFacts(p);
    out.push({
      kind: "page", id: p.id, title: p.title || "", art: p.art || "", artAlt: p.artAlt || "",
      facts: facts, factAudio: p.factAudio || "", quiz: p.quiz || [], fill: data.shelfColor || "#2A3550",
      // Session RP1 — the richer page. A page is "rich" only when the BOOK asks
      // for it. Everything else takes the original path, untouched.
      layout: RICH_LAYOUTS[p.layout] ? p.layout : "",
      stat: p.stat || null, ghostYear: p.ghostYear || "", infographic: p.infographic || null,
      rich: !!(RICH_LAYOUTS[p.layout] || p.infographic || facts.some((f) => f.art)),
    });
  });
  const fin = data.finish || {};
  out.push({ kind: "finish", id: "finish", title: fin.title || ("You finished " + data.title + "!"), blurb: fin.blurb || "", art: cover.art || data.heroArt || "", artAlt: cover.artAlt || "", fill: data.shelfColor || "#2A3550" });
  return out;
}
// Which spread a page id lives on (0 when the id is unknown, so a stale
// dog-ear link opens the cover instead of a blank book).
function spreadIndexFor(pageId) {
  if (!pageId) return 0;
  for (let i = 0; i < SPREADS.length; i++) {
    if (SPREADS[i].kind === "page" && SPREADS[i].id === pageId) return i;
  }
  return 0;
}
// Facts are objects {text, source}. A plain string still works (older files).
// Session RP1 adds an optional per-fact photo (art / artAlt / caption) so no
// fact on a richer page is left as bare text.
function normaliseFacts(p) {
  const list = Array.isArray(p.facts) ? p.facts : (p.fact ? [p.fact] : []);
  return list.map((f) => (typeof f === "string" ? { text: f, source: "", art: "", artAlt: "", caption: "" } : {
    text: (f && f.text) || "", source: (f && f.source) || "",
    art: (f && f.art) || "", artAlt: (f && f.artAlt) || "", caption: (f && f.caption) || "",
  })).filter((f) => f.text);
}

// =====================================================================
// Session RP1 — RICHER COMPOSED PAGES
//
// The four layouts are named after what they DO, not what they look like,
// because the rule Mike locked is that the layout must echo the subject:
//   speed     — a slanted photo, streaks, one giant number   (fast things)
//   long      — a panorama and a dashed track running down    (long things)
//   then-now  — a ghost year with a sepia THEN beside a NOW   (history)
//   close-up  — circle crops the words wrap around            (small details)
// A page that names none of them renders through the original path.
// =====================================================================
//   tall      — a standing photo, a height ruler and a kid for scale (RP3)
const RICH_LAYOUTS = { speed: 1, long: 1, "then-now": 1, "close-up": 1, tall: 1 };

// Where a fact's photo comes from. RP1 is the pilot and ships with the Trains
// book's existing four photos, so a fact with no art of its own gets a DETAIL
// CROP of the page photo (a different part of the frame, pushed in) rather than
// a blank hole. RP2 replaces every one of these with real art; the data-crop
// flag is what lets QA count how many are still stand-ins.
const CROP_POS = ["50% 40%", "22% 66%", "80% 30%", "50% 78%"];
const CROP_ZOOM = [1.15, 1.5, 1.9, 1.35];
function factPhoto(sp, f, n, cls) {
  const src = f.art || sp.art;
  if (!src) return "";
  const crop = !f.art;
  const alt = escapeHtml(f.artAlt || sp.artAlt || sp.title || "");
  const style = "object-position:" + CROP_POS[n % CROP_POS.length] +
    (crop ? ";transform:scale(" + CROP_ZOOM[n % CROP_ZOOM.length] + ")" : "");
  const cap = f.caption ? '<figcaption class="cap">' + escapeHtml(f.caption) + "</figcaption>" : "";
  const tape = cls.indexOf("polaroid") !== -1 ? '<span class="tape"></span>' : "";
  return '<figure class="fphoto ' + cls + '"' + (crop ? ' data-crop="1"' : "") + ">" + tape +
    '<span class="frame"><img src="' + escapeHtml(src) + '" alt="' + alt + '" loading="lazy" style="' + style + '" onerror="this.style.display=\'none\'"></span>' +
    cap + "</figure>";
}
// The read-aloud control: a ROUND SPEAKER. It floats, so the sentence wraps
// around it instead of hiding behind it.
function speakerSvg() {
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<path d="M4 9.4h3.3L12 5.3v13.4L7.3 14.6H4Z" fill="currentColor" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>' +
    '<path d="M15.9 9.3a3.9 3.9 0 0 1 0 5.4"/><path d="M18.6 6.7a7.5 7.5 0 0 1 0 10.6"/></svg>';
}
function stopSvg() { return '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg>'; }
function sayId(i, n) { return n ? ("say-" + i + "-" + n) : ("say-" + i); }
function ftId(i, n) { return n ? ("ft-" + i + "-" + n) : ("ft-" + i); }
function fsId(i, n) { return n ? ("fs-" + i + "-" + n) : ("fs-" + i); }
function sayButton(i, n) {
  return '<button class="say mini" type="button" id="' + sayId(i, n) + '" aria-label="Read this to me">' + speakerSvg() + "</button>";
}
function factCard(sp, i, n, photoCls) {
  const f = sp.facts[n] || { text: "", source: "" };
  return '<div class="fcard n' + n + '">' +
    (photoCls === null ? "" : factPhoto(sp, f, n, photoCls)) +
    sayButton(i, n) +
    '<div class="facttext" id="' + ftId(i, n) + '">' + escapeHtml(f.text) + "</div>" +
    '<div class="factsrc" id="' + fsId(i, n) + '">' + (f.source ? "Source: " + escapeHtml(f.source) : "") + "</div>" +
    "</div>";
}
function richBody(sp, i) {
  const facts = sp.facts || [];
  let inner = "";
  if (sp.layout === "then-now" && facts.length >= 3) {
    // The pair is the whole point of this layout: the old photo and the new one
    // sit side by side, then each fact speaks under its own picture.
    inner = factCard(sp, i, 0, null) +
      '<div class="pairrow">' +
        '<div>' + factPhoto(sp, facts[1], 1, "then") + '<span class="pairtag">Then</span></div>' +
        '<div>' + factPhoto(sp, facts[2], 2, "now") + '<span class="pairtag">Now</span></div>' +
      "</div>" +
      factCard(sp, i, 1, null) + factCard(sp, i, 2, null);
  } else {
    const cls = sp.layout === "speed" ? ["wide", "polaroid", "wide"]
      : sp.layout === "long" ? ["wide", "wide", "wide"]
      : sp.layout === "close-up" ? ["round", "round", "round"]
      : sp.layout === "tall" ? ["wide", "standing", "wide"]
      : ["wide", "wide", "wide"];
    inner = facts.map((f, n) => factCard(sp, i, n, n === 0 ? null : cls[n % cls.length])).join("");
  }
  const ghost = sp.ghostYear ? '<div class="ghostyear" aria-hidden="true">' + escapeHtml(sp.ghostYear) + "</div>" : "";
  return '<div class="facts">' + ghost + inner + "</div>" + wowHtml(sp.infographic);
}

// Session RP3 — the tall page's measuring stick. Ticks down the side of the
// photo and a drawn kid standing at the bottom of them, so "40 feet" is a
// thing a kid can see against something their own size instead of a number.
// It goes INSIDE the photo box (passed to photoBlock) for the same reason the
// giant stat had to: an absolutely-placed overlay drifts off the picture.
function rulerHtml(sp) {
  if (sp.layout !== "tall") return "";
  let ticks = "";
  for (let k = 0; k < 9; k++) ticks += "<i></i>";
  return '<div class="ruler" aria-hidden="true">' + ticks + "</div>" +
    '<div class="scalekid" aria-hidden="true">' + glyphSvg("kid", "#fff") + "</div>";
}

// ---------------- the Wow chart ----------------
// Picture-first: the ENTITIES are pictures (a drawn kid, a real photo chip, a
// football field with its yard lines). Bars only ever carry magnitude, and every
// number is labelled directly. Brand palette only, no emoji anywhere.
function wowHtml(g) {
  if (!g || !g.kind) return "";
  let body = "";
  if (g.kind === "compare") body = compareRows(g);
  else if (g.kind === "fields") body = fieldRows(g);
  else if (g.kind === "timeline") body = timelineHtml(g);
  else if (g.kind === "diagram") body = diagramHtml(g);
  else return "";
  return '<div class="wow' + (g.tone === "blue" || g.tone === "book" ? " blue" : "") + '">' +
    '<span class="pill">' + escapeHtml(g.pill || "Wow chart") + "</span>" +
    "<h4>" + escapeHtml(g.title || "") + "</h4>" + body +
    (g.caption ? '<div class="cap">' + escapeHtml(g.caption) + "</div>" : "") +
    (g.source ? '<div class="src">Source: ' + escapeHtml(g.source) + "</div>" : "") +
    "</div>";
}
function compareRows(g) {
  const rows = g.rows || [];
  const max = Math.max.apply(null, rows.map((r) => Number(r.value) || 0).concat([1]));
  return '<div class="wowrows">' + rows.map((r) => {
    const w = Math.max(7, Math.round(((Number(r.value) || 0) / max) * 100));
    return '<div class="wowrow">' + glyphHtml(r) + '<div class="barwrap">' +
      '<div class="lab">' + escapeHtml(r.label || "") + "</div>" +
      '<div class="bar"><i style="width:' + w + '%"></i></div>' +
      '<div class="num">' + escapeHtml(r.display || "") + "</div></div></div>";
  }).join("") + "</div>";
}
function fieldRows(g) {
  const rows = g.rows || [];
  return '<div class="wowrows">' + rows.map((r) => {
    const n = Math.max(1, Math.round(Number(r.count) || 0));
    const draw = Math.min(n, 10);
    let strip = "";
    for (let k = 0; k < draw; k++) strip += fieldSvg();
    if (n > draw) strip += '<span class="fieldmore">and ' + (n - draw) + " more</span>";
    return '<div class="fieldrow"><div class="lab">' + escapeHtml(r.label || "") + "</div>" +
      '<div class="fieldstrip">' + strip + "</div>" +
      '<div class="num">' + escapeHtml(r.display || "") + "</div></div>";
  }).join("") + "</div>";
}
function timelineHtml(g) {
  const stops = g.stops || [];
  const chips = stops.map((s) => '<div class="tlstop"><div class="chip">' +
    (s.art ? '<img src="' + escapeHtml(s.art) + '" alt="' + escapeHtml(s.artAlt || "") + '" loading="lazy" onerror="this.style.display=\'none\'">' : glyphSvg(s.icon || "train")) +
    "</div></div>").join("");
  const caps = stops.map((s) => '<div class="tlcap"><div class="yr">' + escapeHtml(s.year || "") + "</div>" +
    '<div class="who">' + escapeHtml(s.label || "") + "</div></div>").join("");
  return '<div class="tl"><div class="tlinner">' +
    '<div class="tlgrid">' + chips + "</div>" +
    '<div class="tlline" aria-hidden="true"></div>' +
    '<div class="tlgrid">' + caps + "</div>" +
    "</div></div>";
}
function diagramHtml(g) {
  const d = DIAGRAMS[g.name];
  return d ? '<div class="diag">' + d() + "</div>" : "";
}
function glyphHtml(r) {
  if (r && r.art) return '<span class="glyph"><img src="' + escapeHtml(r.art) + '" alt="" loading="lazy" onerror="this.style.display=\'none\'"></span>';
  return '<span class="glyph">' + glyphSvg((r && r.icon) || "train") + "</span>";
}

// ---------- the book itself ----------
function photoBlock(sp, extra) {
  const alt = escapeHtml(sp.artAlt || sp.title || "");
  const painted = '<div class="painted"><span>' + escapeHtml(sp.title || "") + "</span></div>";
  const more = extra || "";
  if (!sp.art) return '<div class="photo" style="--fill:' + escapeHtml(sp.fill) + '">' + painted + more + "</div>";
  // The painted block sits UNDER the photo: if the photo is missing or slow,
  // the kid still sees a finished-looking page instead of a white hole.
  return '<div class="photo" style="--fill:' + escapeHtml(sp.fill) + '">' + painted +
    '<img src="' + escapeHtml(sp.art) + '" alt="' + alt + '" loading="lazy" onerror="this.style.display=\'none\'">' + more + "</div>";
}
function earSvg() {
  return '<svg viewBox="0 0 74 74" aria-hidden="true">' +
    '<path class="fold" d="M74 22 L74 74 L22 74 Z"/>' +
    '<path class="edge" d="M74 22 L22 74"/>' +
    "</svg>";
}
// Session TB5 — the flecks of gold that fly off the corner when it creases.
// Drawn squares, never an emoji, and each one carries its own direction.
const SPARK_DIRS = [[-46,-14],[-34,-38],[-10,-50],[-58,-30],[-22,-22],[-44,-52]];
function sparkSvg(i) {
  return '<span class="sparks" id="sparks-' + i + '" aria-hidden="true">' +
    SPARK_DIRS.map((d) => '<i style="--dx:' + d[0] + 'px;--dy:' + d[1] + 'px"></i>').join("") +
    "</span>";
}
function buildPages() {
  const wrap = document.getElementById("pages");
  wrap.innerHTML = "";
  SPREADS.forEach((sp, i) => {
    const el = document.createElement("div");
    el.className = "page " + sp.kind;
    el.id = "sp-" + i;
    if (sp.kind === "cover") {
      el.innerHTML = photoBlock(sp) +
        '<div class="coverkicker">Kidspedia topic book</div>' +
        '<div class="covertitle">' + escapeHtml(sp.title) + "</div>" +
        '<div class="coverblurb">' + escapeHtml(sp.blurb) + "</div>" +
        '<div class="pbody"><div class="factnav"><button class="q next" type="button" id="startBtn">Start reading</button>' +
        '<button class="q tiein" type="button" id="tiein-cover" style="display:none"></button></div></div>';
    } else if (sp.kind === "finish") {
      el.innerHTML = photoBlock(sp) +
        '<div class="ptitle">' + escapeHtml(sp.title) + "</div>" +
        '<div class="pbody"><div class="facttext">' + escapeHtml(sp.blurb) + "</div>" +
        '<div class="factnav"><button class="q tiein" type="button" id="tiein-finish" style="display:none"></button></div>' +
        '<div class="factnav"><button class="q" type="button" id="againBtn">Read it again</button>' +
        '<button class="q next" type="button" id="doneBtn">' + (FROM_SHELF ? "Back to the bookshelf" : "Back to Explore") + "</button></div></div>";
    } else if (sp.rich) {
      // Session RP1 — the composed page. Every fact is on screen at once, each
      // with its own picture and its own source, and the Wow chart closes it.
      el.className += " rich rp" + (sp.layout ? " lay-" + sp.layout : "");
      el.innerHTML = photoBlock(sp, (sp.stat
          ? '<div class="bigstat"><b>' + escapeHtml(sp.stat.value || "") + "</b><span>" + escapeHtml(sp.stat.unit || "") + "</span></div>"
          : "") + rulerHtml(sp)) +
        '<div class="ptitle">' + escapeHtml(sp.title) + "</div>" +
        '<div class="pbody">' + richBody(sp, i) + "</div>" +
        '<span class="earhint" id="earhint-' + i + '">Fold</span>' +
        sparkSvg(i) +
        '<button class="ear" type="button" id="ear-' + i + '" aria-label="Fold this page corner to save it">' + earSvg() + "</button>";
    } else {
      el.innerHTML = photoBlock(sp) +
        '<div class="ptitle">' + escapeHtml(sp.title) + "</div>" +
        '<div class="pbody">' +
          '<div class="factbox"><div class="facttext" id="ft-' + i + '"></div><div class="factsrc" id="fs-' + i + '"></div></div>' +
          '<div class="factnav">' +
            '<button class="say" type="button" id="say-' + i + '" aria-label="Read to me">' + speakerSvg() + "</button>" +
            '<div class="dots" id="dots-' + i + '"></div>' +
          "</div>" +
          '<div class="factnav">' +
            '<button class="q" type="button" id="more-' + i + '">Another fact</button>' +
          "</div>" +
        "</div>" +
        '<span class="earhint" id="earhint-' + i + '">Fold</span>' +
        sparkSvg(i) +
        '<button class="ear" type="button" id="ear-' + i + '" aria-label="Fold this page corner to save it">' + earSvg() + "</button>";
    }
    wrap.appendChild(el);
  });

  // Wire the buttons after the markup exists.
  SPREADS.forEach((sp, i) => {
    if (sp.kind === "cover") { const b = document.getElementById("startBtn"); if (b) b.onclick = () => turn(1); return; }
    if (sp.kind === "finish") {
      const a = document.getElementById("againBtn"); if (a) a.onclick = () => goTo(0);
      const d = document.getElementById("doneBtn"); if (d) d.onclick = exitToShell;
      return;
    }
    factIdx[i] = 0;
    const ear = document.getElementById("ear-" + i); if (ear) ear.onclick = () => toggleEar(i);
    if (sp.rich) {
      // One speaker per fact: the fact you are looking at is the one it reads.
      (sp.facts || []).forEach((f, n) => {
        const b = document.getElementById(sayId(i, n));
        if (b) b.onclick = () => readAloud(i, n);
      });
      return;
    }
    const say = document.getElementById("say-" + i); if (say) say.onclick = () => readAloud(i);
    const more = document.getElementById("more-" + i); if (more) more.onclick = () => cycleFact(i);
    renderFact(i);
  });
}

function renderFact(i) {
  const sp = SPREADS[i]; if (!sp || sp.kind !== "page") return;
  const list = sp.facts || [];
  const n = Math.min(factIdx[i] || 0, Math.max(0, list.length - 1));
  const f = list[n] || { text: "", source: "" };
  const t = document.getElementById("ft-" + i); if (t) t.textContent = f.text;
  const s = document.getElementById("fs-" + i); if (s) s.textContent = f.source ? ("Source: " + f.source) : "";
  const dots = document.getElementById("dots-" + i);
  if (dots) {
    dots.innerHTML = "";
    list.forEach((_, k) => { const d = document.createElement("span"); d.className = "dot" + (k === n ? " on" : ""); dots.appendChild(d); });
  }
  const more = document.getElementById("more-" + i);
  if (more) more.style.display = list.length > 1 ? "" : "none";
}
function cycleFact(i) {
  const sp = SPREADS[i]; if (!sp || !sp.facts || sp.facts.length < 2) return;
  factIdx[i] = ((factIdx[i] || 0) + 1) % sp.facts.length;
  stopNarration();
  renderFact(i);
  try { if (window.Feel && Feel.tap) Feel.tap(); } catch (e) {}
}

// ---------- turning pages ----------
function goTo(i, instant) {
  if (paused) return;
  const max = SPREADS.length - 1;
  pageIdx = Math.max(0, Math.min(max, i));
  const wrap = document.getElementById("pages");
  if (wrap) {
    if (instant) wrap.style.transition = "none";
    wrap.style.transform = "translateX(" + (-100 * pageIdx) + "%)";
    if (instant) { void wrap.offsetWidth; wrap.style.transition = ""; }
  }
  stopNarration();
  const prev = document.getElementById("prev"); if (prev) prev.disabled = pageIdx === 0;
  const next = document.getElementById("next"); if (next) next.disabled = pageIdx === max;
  const pc = document.getElementById("pagecount");
  if (pc) {
    const sp = SPREADS[pageIdx];
    pc.textContent = sp && sp.kind === "cover" ? "Cover"
      : sp && sp.kind === "finish" ? "The end"
      : "Page " + pageIdx + " of " + (SPREADS.length - 2);
  }
  renderEarUi();
}
// Session TB5 — what a turned page feels like. The light sweep runs across the
// paper in the direction of travel, the paper sound plays, and the phone gives
// the smallest tick. Every piece is optional: if the sound engine or the class
// list is not there, the page still turns.
let turnFxTimer = null;
function playTurnFx(dir) {
  const b = document.getElementById("book");
  if (b && b.classList) {
    b.classList.remove("flipf", "flipb");
    try { void b.offsetWidth; } catch (e) {}   // restart the sweep on a fast second turn
    b.classList.add(dir < 0 ? "flipb" : "flipf");
    if (turnFxTimer) clearTimeout(turnFxTimer);
    turnFxTimer = setTimeout(() => { try { b.classList.remove("flipf", "flipb"); } catch (e) {} }, 500);
  }
  try { if (window.Feel && Feel.sfx) Feel.sfx("pageturn"); } catch (e) {}
  try { if (window.Feel && Feel.haptic) Feel.haptic("light"); } catch (e) {}
}
function turn(dir) {
  if (paused) return;
  const target = pageIdx + dir;
  if (target < 0 || target > SPREADS.length - 1) return;
  goTo(target);
  playTurnFx(dir);
}
function initSwipe() {
  const book = document.getElementById("book"); if (!book) return;
  let x0 = null, y0 = null;
  book.addEventListener("touchstart", (e) => {
    const t = e.touches && e.touches[0]; if (!t) return;
    x0 = t.clientX; y0 = t.clientY;
  }, { passive: true });
  book.addEventListener("touchend", (e) => {
    if (x0 === null) return;
    const t = (e.changedTouches && e.changedTouches[0]) || null;
    if (t) {
      const dx = t.clientX - x0, dy = t.clientY - y0;
      // A page turn is a clear sideways flick, so scrolling the page never turns it.
      if (Math.abs(dx) > 46 && Math.abs(dx) > Math.abs(dy) * 1.4) turn(dx < 0 ? 1 : -1);
    }
    x0 = null; y0 = null;
  }, { passive: true });
}

// ================= visit-the-exhibit tie-in (Session TB2) =================
// A topic book may name ONE Kidspedia exhibit that brings its subject to life
// (Wild Weather -> the Weather Lab, The Deep Ocean -> Journey to the Deep).
// The button is drawn only after we confirm the target exhibit really exists
// AND is approved, so a book whose exhibit has not been built yet simply keeps
// its link slot empty — there is never a button that leads to a dead end.
function tieInSvg() {
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<path d="M14 4h6v6"/><path d="M20 4 11 13"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>';
}
function checkTieIn(data) {
  const t = data && data.exhibit;
  if (!t || !t.id || !/^[a-z0-9-]+$/i.test(t.id) || t.id === EXHIBIT_ID) return;
  fetch("/explore/" + encodeURIComponent(t.id) + ".json", { cache: "no-store" })
    .then((r) => (r.ok ? r.json() : null))
    .then((ex) => {
      if (!ex || ex.status !== "approved") return; // not built yet, or still in review
      const label = t.label || ("Visit " + (t.title || ex.title || "the exhibit"));
      ["tiein-cover", "tiein-finish"].forEach((id) => {
        const b = document.getElementById(id);
        if (!b) return;
        b.innerHTML = tieInSvg() + "<span>" + escapeHtml(label) + "</span>";
        b.style.display = "inline-flex";
        b.onclick = () => {
          try { if (window.Feel && Feel.tap) Feel.tap(); } catch (e) {}
          location.href = "/explore/" + encodeURIComponent(t.id);
        };
      });
    })
    .catch(() => {});
}

// ---------- the dog-ear ----------
function toggleEar(i) {
  const sp = SPREADS[i]; if (!sp || sp.kind !== "page") return;
  const on = !ears.has(sp.id);
  if (on) ears.add(sp.id); else ears.delete(sp.id);
  writeLocalEars([...ears]);
  renderEarUi();
  playEarFx(i, on);
  showToast(on ? "Page saved to My dog-ears." : "Fold undone.");
  pushEar(sp.id, on, sp.title);
}
// Session TB5 — the crease. The corner folds down for real, a few gold flecks
// fly off it, and a short paper sound plays. Undoing is quieter on purpose: the
// reward belongs to saving the page, not to changing your mind.
let earFxTimer = null;
function playEarFx(i, on) {
  const b = document.getElementById("ear-" + i);
  const sk = document.getElementById("sparks-" + i);
  if (b && b.classList) {
    b.classList.remove("pop");
    try { void b.offsetWidth; } catch (e) {}
    if (on) b.classList.add("pop");
  }
  if (sk && sk.classList) {
    sk.classList.remove("go");
    try { void sk.offsetWidth; } catch (e) {}
    if (on) sk.classList.add("go");
  }
  if (earFxTimer) clearTimeout(earFxTimer);
  earFxTimer = setTimeout(() => {
    try { if (b && b.classList) b.classList.remove("pop"); if (sk && sk.classList) sk.classList.remove("go"); } catch (e) {}
  }, 700);
  try {
    if (window.Feel) {
      if (Feel.sfx) Feel.sfx(on ? "fold" : "unfold");
      if (Feel.haptic) Feel.haptic(on ? "medium" : "light");
    }
  } catch (e) {}
}
function renderEarUi() {
  SPREADS.forEach((sp, i) => {
    if (sp.kind !== "page") return;
    const b = document.getElementById("ear-" + i);
    if (b) {
      const on = ears.has(sp.id);
      b.classList.toggle("on", on);
      if (b.setAttribute) b.setAttribute("aria-label", on ? "Unfold this page corner" : "Fold this page corner to save it");
    }
    const h = document.getElementById("earhint-" + i);
    if (h) { const on = ears.has(sp.id); h.textContent = on ? "Saved" : "Fold"; if (h.classList) h.classList.toggle("on", on); }
  });
  const c = document.getElementById("earCount"); if (c) c.textContent = String(ears.size);
}
function openShelf() {
  const list = document.getElementById("earlist"); if (!list) return;
  list.innerHTML = "";
  const saved = SPREADS.map((sp, i) => ({ sp, i })).filter((x) => x.sp.kind === "page" && ears.has(x.sp.id));
  const sub = document.getElementById("earSub");
  if (sub) sub.textContent = activeKidId()
    ? "Folded pages follow you to any device you sign in on."
    : "Sign in on the grown-ups screen to carry these to another device.";
  if (!saved.length) {
    const empty = document.createElement("div");
    empty.className = "sub";
    empty.textContent = "No folded pages yet. Tap the folded corner on any page to save it.";
    list.appendChild(empty);
  } else {
    saved.forEach(({ sp, i }) => {
      const b = document.createElement("button");
      b.className = "earrow"; b.type = "button";
      b.innerHTML = '<span class="thumb">' + (sp.art ? '<img src="' + escapeHtml(sp.art) + '" alt="" onerror="this.style.display=\'none\'">' : "") + "</span>" +
        "<span><b>" + escapeHtml(sp.title) + "</b><small>Page " + i + "</small></span>";
      b.onclick = () => { closeShelf(); goTo(i); };
      list.appendChild(b);
    });
  }
  document.getElementById("sheetbg").classList.add("open");
}
function closeShelf() { document.getElementById("sheetbg").classList.remove("open"); }

// ================= read aloud: narrator clip first, browser voice as fallback =================
function setSayButton(i, isPlaying, n) {
  const b = document.getElementById(sayId(i, n || 0)); if (!b) return;
  b.classList.toggle("playing", !!isPlaying);
  if (b.setAttribute) b.setAttribute("aria-label", isPlaying ? "Stop reading" : "Read this to me");
  b.innerHTML = isPlaying ? stopSvg() : speakerSvg();
}
function stopNarration() {
  sayToken++;
  try { if (narrAudio) { narrAudio.onended = null; narrAudio.onerror = null; narrAudio.pause(); narrAudio = null; } } catch (e) {}
  try { if ("speechSynthesis" in window) speechSynthesis.cancel(); } catch (e) {}
  speaking = false;
  // A composed page has one speaker per fact, so every one of them resets.
  SPREADS.forEach((sp, i) => {
    if (sp.kind !== "page") return;
    if (sp.rich) (sp.facts || []).forEach((f, n) => setSayButton(i, false, n));
    else setSayButton(i, false, 0);
  });
}
function browserVoice(i, text, token, n) {
  if (!("speechSynthesis" in window)) { showToast("Read-aloud isn't available on this device."); if (token === sayToken) { speaking = false; setSayButton(i, false, n); } return; }
  try {
    speechSynthesis.cancel();
    const sp = SPREADS[i] || {};
    const u = new SpeechSynthesisUtterance((sp.title || "") + ". " + (text || ""));
    u.rate = 0.92; u.pitch = 1.05;
    u.onend = function () { if (token === sayToken) { speaking = false; setSayButton(i, false, n); } };
    speechSynthesis.speak(u);
  } catch (e) { showToast("Couldn't read that aloud right now."); if (token === sayToken) { speaking = false; setSayButton(i, false, n); } }
}
function readAloud(i, which) {
  if (speaking) { stopNarration(); return; }
  const sp = SPREADS[i]; if (!sp || sp.kind !== "page") return;
  const list = sp.facts || [];
  const n = (which === undefined || which === null)
    ? Math.min(factIdx[i] || 0, Math.max(0, list.length - 1))
    : Math.min(Math.max(0, which), Math.max(0, list.length - 1));
  const text = (list[n] && list[n].text) || "";
  stopNarration();
  const token = ++sayToken; speaking = true; setSayButton(i, true, n);
  // The pre-made narrator clip covers the page's FIRST fact only; anything
  // else is read by the browser voice, so a kid never waits on a download.
  if (n === 0 && sp.factAudio) {
    try {
      const a = new Audio("/api/explore-audio?id=" + encodeURIComponent(sp.factAudio));
      narrAudio = a;
      a.onended = function () { if (token === sayToken) { speaking = false; setSayButton(i, false, n); } };
      a.onerror = function () { if (token !== sayToken) return; narrAudio = null; browserVoice(i, text, token, n); };
      const pr = a.play();
      if (pr && pr.catch) pr.catch(function () { if (token !== sayToken) return; narrAudio = null; browserVoice(i, text, token, n); });
      return;
    } catch (e) { /* fall through to browser voice */ }
  }
  browserVoice(i, text, token, n);
}

// ================= quiz bridge (CARTRIDGE-CONTRACT.md: quizRequest / pause / resume / bk:quizDone) =================
function requestQuiz(sp) {
  if (!iframed()) { showToast("Open this inside Buildable Kids to take the quiz."); return; }
  const onDone = (e) => { const d = e && e.data; if (d && d.type === "bk:quizDone") { window.removeEventListener("message", onDone); } };
  window.addEventListener("message", onDone);
  postToShell({
    source: "buildable",
    kind: "quizRequest",
    exhibitId: DATA.id,
    topic: DATA.topic,
    skills: DATA.skills || [],
    itemName: sp.title,
    quiz: sp.quiz || [],
  });
}

// ================= audio bed + shell Sound button =================
function initAudio(data) {
  try { if (window.Feel && Feel.configure) Feel.configure({ sfxBase: "/api/sfx?s=" }); } catch (e) {}
  try { soundOn = !(window.BuildableAudio && window.BuildableAudio.muted); } catch (e) { soundOn = true; }
  try {
    if (window.BuildableGameNav) BuildableGameNav.register({
      hide: [],
      onSound: function () { setSound(!soundOn); },
      soundOn: function () { return soundOn; },
      inGame: function () { return true; },
    });
  } catch (e) {}
  var unlock = function () {
    if (audioUnlocked) return; audioUnlocked = true;
    try { if (window.Feel && Feel.unlock) Feel.unlock(); } catch (e) {}
    startAmbient();
    document.removeEventListener("pointerdown", unlock);
    document.removeEventListener("touchstart", unlock);
  };
  document.addEventListener("pointerdown", unlock, { passive: true });
  document.addEventListener("touchstart", unlock, { passive: true });
}
function startAmbient() {
  if (!DATA || !DATA.ambient || !audioUnlocked || !soundOn || paused) return;
  if (!ambientAudio) {
    try { ambientAudio = new Audio("/api/sfx?s=" + encodeURIComponent(DATA.ambient)); ambientAudio.loop = true; ambientAudio.volume = 0.13; } catch (e) { return; }
  }
  try { var p = ambientAudio.play(); if (p && p.catch) p.catch(function () {}); } catch (e) {}
}
function stopAmbient() { if (ambientAudio) { try { ambientAudio.pause(); } catch (e) {} } }
function setSound(on) {
  soundOn = on;
  try { if (window.BuildableAudio) BuildableAudio.muted = !on; } catch (e) {}
  if (on) startAmbient(); else { stopAmbient(); stopNarration(); }
}
function setPaused(on) {
  paused = !!on;
  const v = document.getElementById("pauseveil");
  if (v) v.classList.toggle("show", paused);
  if (paused) { stopAmbient(); stopNarration(); } else { startAmbient(); }
}
</script>
