<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Buildable — Game Editor</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="icon" href="/favicon-32.png" sizes="32x32" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<style id="no-longpress">*{ -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; } input,textarea,select{ -webkit-user-select:text; user-select:text; }</style>
<style>
:root{ --ink:#2b2b2b; --muted:#7a756c; --line:#e7e1d5; --card:#fffdf8; --page:#f6f1e7; --accent:#FF6B6B; }
*{ box-sizing:border-box; }
body{ margin:0; font-family:"Baloo 2",system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--page); color:var(--ink); }
h1{ font-size:20px; margin:0; font-weight:700; }
.wrap{ max-width:1000px; margin:0 auto; padding:16px 16px 120px; }
.topbar{ position:sticky; top:0; z-index:5; background:var(--page); display:flex; align-items:center; gap:12px; padding:12px 4px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
.dot{ width:14px; height:14px; border-radius:4px; display:inline-block; }
.badge{ font-size:12px; padding:2px 8px; border-radius:999px; background:#efe9dc; color:#6b655c; }
.badge.live{ background:#e4f6ea; color:#1f7a42; }
.grow{ flex:1; }
.btn{ font-family:inherit; font-size:14px; border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:10px; padding:8px 12px; cursor:pointer; }
.btn:hover{ background:#fff; }
.btn.primary{ background:var(--accent); color:#fff; border-color:var(--accent); font-weight:700; }
.btn.ghost{ background:transparent; border-color:transparent; color:var(--muted); }
.btn.sm{ padding:5px 9px; font-size:13px; }
.btn.danger{ color:#b23b3b; }
.status{ font-size:13px; color:var(--muted); min-height:18px; }
.status.err{ color:#b23b3b; }
.section-label{ font-size:13px; color:var(--muted); margin:18px 2px 8px; }
.card{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 14px; }
.slots{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; }
.slot label{ display:block; font-size:12px; color:var(--muted); margin-bottom:4px; }
.slot input{ width:100%; }
input,select{ font-family:inherit; font-size:14px; border:1px solid var(--line); border-radius:9px; padding:7px 9px; background:#fff; color:var(--ink); }
input:focus,select:focus{ outline:2px solid #ffd0d0; border-color:var(--accent); }
.level{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin-bottom:10px; }
.lvl-top{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.reorder{ display:flex; flex-direction:column; gap:2px; }
.reorder button{ border:1px solid var(--line); background:#fff; border-radius:7px; width:28px; height:22px; line-height:1; cursor:pointer; font-size:12px; color:#6b655c; }
.reorder button:disabled{ opacity:.35; cursor:default; }
.lvl-name{ width:150px; font-weight:700; }
.lvl-id{ font-size:11px; color:var(--muted); margin-top:3px; }
.parts{ display:flex; gap:8px; }
.part{ text-align:center; }
.part .thumb{ width:44px; height:44px; border-radius:9px; border:1px solid var(--line); background:#efe9dc center/cover no-repeat; display:block; }
.part select{ width:74px; margin-top:3px; padding:3px 4px; font-size:11px; }
.part span.plabel{ display:block; font-size:10px; color:var(--muted); }
.chips{ display:flex; gap:5px; }
.chip{ width:30px; height:30px; border-radius:50%; border:1px solid var(--line); background:#fff; color:var(--muted); font-weight:700; font-size:14px; cursor:pointer; }
.chip.on{ background:var(--accent); color:#fff; border-color:var(--accent); }
.spacer{ flex:1; }
.addbtn{ width:100%; border:1.5px dashed #cdbfae; background:transparent; color:#8a7c68; border-radius:14px; padding:12px; font-family:inherit; font-size:15px; cursor:pointer; }
.addbtn:hover{ background:#fbf7ee; }
.gate{ position:fixed; inset:0; background:var(--page); display:flex; align-items:center; justify-content:center; z-index:50; }
.gate .box{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:24px; width:280px; text-align:center; }
.gate input{ width:100%; text-align:center; font-size:20px; letter-spacing:4px; margin:12px 0; }
.hint{ font-size:12px; color:var(--muted); }
.fieldlbl{ font-size:11px; color:var(--muted); display:block; }
</style>
</head>
<body>
<div class="gate" id="gate">
  <div class="box">
    <h1>Editor</h1>
    <div class="hint" style="margin-top:6px;">Enter the editor PIN</div>
    <input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="••••" />
    <button class="btn primary" style="width:100%;" onclick="unlock()">Open</button>
    <div class="hint err" id="gateErr" style="min-height:16px;margin-top:8px;"></div>
  </div>
</div>

<div class="wrap" id="app" style="display:none;">
  <div class="topbar">
    <span class="dot" id="dot"></span>
    <h1 id="gname">Editor</h1>
    <span class="badge" id="srcBadge">loading</span>
    <span class="grow"></span>
    <span class="status" id="status"></span>
    <button class="btn ghost sm" onclick="reload()">Reload</button>
    <button class="btn primary" id="saveBtn" onclick="save()">Save (goes live)</button>
  </div>
  <div class="hint" style="margin:8px 2px 0;">Order the levels below is the journey order. The robot safety-check before a save goes live arrives in Session 4B; for now Save checks the basics, then publishes.</div>

  <div class="section-label">Game art slots</div>
  <div class="card"><div class="slots" id="slots"></div></div>

  <div class="section-label">Levels</div>
  <div id="levels"></div>
  <button class="addbtn" onclick="addLevel()">+ Add level</button>
</div>

<script src="/buildable-manifest.js?v=1"></script>
<script>
var GAME = (new URLSearchParams(location.search).get("game") || "breaker").toLowerCase().replace(/[^a-z0-9-]/g,"") || "breaker";
var PIN = "";
var state = { manifest:null, source:"" };
var dirty = false;

var LAYOUTS = (window.BuildableManifest && window.BuildableManifest.TPL) ? Object.keys(window.BuildableManifest.TPL) : ["full","pyramid","checker","gaps","columns","frame","diamond"];
var THEMES = ["jungle","ocean","space"];
var PARTS = [["background","bg","Background"],["bricks","bricks","Bricks"],["balls","balls","Balls"],["paddle","paddle","Paddle"]];
var ART_SLOTS = [["badge","Badge"],["hero","Hero"],["winCelebration","Win art"],["loadingScreen","Loading"],["music","Music"]];

function assetUrl(id){ try{ return (window.BuildableManifest && window.BuildableManifest.resolveAsset(id)) || null; }catch(e){ return null; } }
function themeOf(id){ var m=/^breaker\/(?:bg|bricks|balls|paddle)\/([a-z0-9]+)-v\d+$/.exec(id||""); return m?m[1]:null; }
function partAsset(seg, theme){ return "breaker/"+seg+"/"+theme+"-v1"; }
function slugify(s){ return String(s||"").toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"").slice(0,40) || "level"; }
function el(tag, attrs, kids){ var e=document.createElement(tag); attrs=attrs||{}; for(var k in attrs){ if(k==="class")e.className=attrs[k]; else if(k==="html")e.innerHTML=attrs[k]; else if(k.slice(0,2)==="on")e.addEventListener(k.slice(2),attrs[k]); else e.setAttribute(k,attrs[k]); } (kids||[]).forEach(function(c){ if(c) e.appendChild(typeof c==="string"?document.createTextNode(c):c); }); return e; }
function setDirty(){ dirty=true; setStatus("Unsaved changes"); srcBadge(state.source,true); }
function setStatus(t, err){ var s=document.getElementById("status"); s.textContent=t||""; s.className="status"+(err?" err":""); }
function srcBadge(src, unsaved){ var b=document.getElementById("srcBadge"); if(unsaved){ b.textContent="unsaved"; b.className="badge"; return; } if(src==="override"){ b.textContent="live (edited)"; b.className="badge live"; } else { b.textContent="default"; b.className="badge"; } }

function unlock(){
  var v=document.getElementById("pin").value.trim();
  if(!v){ document.getElementById("gateErr").textContent="Enter the PIN"; return; }
  PIN=v; document.getElementById("gate").style.display="none"; document.getElementById("app").style.display="block";
  load();
}
document.getElementById("pin").addEventListener("keydown",function(e){ if(e.key==="Enter") unlock(); });

function load(){
  setStatus("Loading…");
  fetch("/api/manifest?game="+encodeURIComponent(GAME)+"&v="+Date.now())
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(!d || !d.manifest){ throw new Error(d && d.error || "no manifest"); }
      state.manifest = d.manifest; state.source = d.source||"";
      renderAll(); setStatus(""); srcBadge(state.source);
    })
    .catch(function(err){ setStatus("Could not load: "+(err.message||err), true); });
}
function reload(){ if(dirty && !confirm("Discard unsaved changes and reload?")) return; dirty=false; load(); }

function renderAll(){
  var m=state.manifest;
  document.getElementById("gname").textContent=(m.name||GAME)+" — Editor";
  document.getElementById("dot").style.background=m.color||"var(--accent)";
  renderSlots(); renderLevels();
}

function renderSlots(){
  var host=document.getElementById("slots"); host.innerHTML=""; var art=state.manifest.art=state.manifest.art||{};
  ART_SLOTS.forEach(function(pair){
    var key=pair[0], label=pair[1];
    var inp=el("input",{ value:art[key]||"", placeholder:"asset id", oninput:function(){ art[key]=inp.value.trim(); setDirty(); } });
    host.appendChild(el("div",{class:"slot"},[ el("label",{},[label]), inp ]));
  });
}

function renderLevels(){
  var host=document.getElementById("levels"); host.innerHTML="";
  var levels=state.manifest.levels||(state.manifest.levels=[]);
  levels.forEach(function(lv,idx){ host.appendChild(levelRow(lv,idx,levels.length)); });
}

function levelRow(lv, idx, total){
  lv.parts=lv.parts||{};
  var row=el("div",{class:"level"});
  var top=el("div",{class:"lvl-top"});

  var up=el("button",{ title:"move up", disabled: idx===0?"":null, onclick:function(){ moveLevel(idx,-1); } },["▲"]);
  var down=el("button",{ title:"move down", disabled: idx===total-1?"":null, onclick:function(){ moveLevel(idx,1); } },["▼"]);
  if(idx===0) up.disabled=true; if(idx===total-1) down.disabled=true;
  top.appendChild(el("div",{class:"reorder"},[up,down]));

  var nameWrap=el("div",{});
  var name=el("input",{ class:"lvl-name", value:lv.name||"", placeholder:"Level name", oninput:function(){ lv.name=name.value; idlbl.textContent="id: "+(lv.id||""); setDirty(); } });
  var idlbl=el("div",{class:"lvl-id"},["id: "+(lv.id||"")]);
  nameWrap.appendChild(name); nameWrap.appendChild(idlbl);
  top.appendChild(nameWrap);

  var parts=el("div",{class:"parts"});
  PARTS.forEach(function(p){
    var key=p[0], seg=p[1], plabel=p[2];
    var cur=lv.parts[key]||"";
    var curTheme=themeOf(cur);
    var thumb=el("span",{class:"thumb"});
    var u=assetUrl(cur); if(u) thumb.style.backgroundImage="url('"+u+"')";
    var opts=THEMES.slice(); if(curTheme && opts.indexOf(curTheme)<0) opts.unshift(curTheme);
    var sel=el("select",{ onchange:function(){ lv.parts[key]=partAsset(seg, sel.value); var nu=assetUrl(lv.parts[key]); thumb.style.backgroundImage=nu?"url('"+nu+"')":""; setDirty(); } });
    opts.forEach(function(t){ var o=el("option",{value:t},[t]); if(t===curTheme)o.selected=true; sel.appendChild(o); });
    parts.appendChild(el("div",{class:"part"},[ thumb, sel, el("span",{class:"plabel"},[plabel]) ]));
  });
  top.appendChild(parts);

  var lay=el("select",{ onchange:function(){ lv.layout=lay.value; setDirty(); } });
  LAYOUTS.forEach(function(L){ var o=el("option",{value:L},[L]); if(L===lv.layout)o.selected=true; lay.appendChild(o); });
  top.appendChild(el("div",{},[ el("span",{class:"fieldlbl"},["Layout"]), lay ]));

  var chips=el("div",{class:"chips"});
  for(var d=1; d<=5; d++){ (function(dd){ var c=el("button",{ class:"chip"+(lv.difficulty===dd?" on":""), onclick:function(){ lv.difficulty=dd; Array.prototype.forEach.call(chips.children,function(ch,ci){ ch.className="chip"+(ci+1===dd?" on":""); }); setDirty(); } },[String(dd)]); chips.appendChild(c); })(d); }
  top.appendChild(el("div",{},[ el("span",{class:"fieldlbl"},["Difficulty"]), chips ]));

  top.appendChild(el("span",{class:"spacer"}));
  top.appendChild(el("button",{ class:"btn sm", title:"Play this level", onclick:function(){ testLevel(lv); } },["▶ Test"]));
  top.appendChild(el("button",{ class:"btn sm danger", title:"Remove level", onclick:function(){ removeLevel(idx); } },["Remove"]));

  row.appendChild(top);
  return row;
}

function moveLevel(idx, dir){ var L=state.manifest.levels; var j=idx+dir; if(j<0||j>=L.length) return; var t=L[idx]; L[idx]=L[j]; L[j]=t; setDirty(); renderLevels(); }
function removeLevel(idx){ var L=state.manifest.levels; if(L.length<=1){ setStatus("A game needs at least one level.",true); return; } if(!confirm("Remove \""+(L[idx].name||"this level")+"\"?")) return; L.splice(idx,1); setDirty(); renderLevels(); }

function addLevel(){
  var L=state.manifest.levels; var base=L[L.length-1]||{};
  var id="level-"+(L.length+1); var n=1; var ids={}; L.forEach(function(x){ ids[x.id]=1; }); while(ids[id]){ n++; id="level-"+(L.length+n); }
  var nu={ id:id, name:"New Level", layout:"full", difficulty:2,
    journeyBadge:(base.journeyBadge||null),
    parts:{ background:(base.parts&&base.parts.background)||"breaker/bg/jungle-v1", bricks:(base.parts&&base.parts.bricks)||"breaker/bricks/jungle-v1", balls:(base.parts&&base.parts.balls)||"breaker/balls/jungle-v1", paddle:(base.parts&&base.parts.paddle)||"breaker/paddle/jungle-v1" } };
  L.push(nu); setDirty(); renderLevels();
  window.scrollTo(0, document.body.scrollHeight);
}

function testLevel(lv){
  if(dirty){ if(!confirm("Save first so Test plays your latest change? (Cancel = test the last saved version)")) { openTest(lv); return; } save(function(){ openTest(lv); }); return; }
  openTest(lv);
}
function openTest(lv){ window.open("/"+GAME+"/play/"+encodeURIComponent(lv.id), "_blank"); }

function ensureInvariants(){
  var L=state.manifest.levels||[];
  L.forEach(function(lv,i){
    if(!lv.id) lv.id=slugify(lv.name);
    lv.name=lv.name||lv.id;
    lv.difficulty=Math.max(1,Math.min(5, parseInt(lv.difficulty,10)||2));
    if(i===0) lv.unlocked=true; else if(lv.unlocked) delete lv.unlocked;
  });
  // de-dup ids
  var seen={}; L.forEach(function(lv){ var b=lv.id, k=lv.id, c=2; while(seen[k]){ k=b+"-"+(c++); } lv.id=k; seen[k]=1; });
}

function save(after){
  ensureInvariants(); renderLevels();
  var v=window.BuildableManifest ? window.BuildableManifest.validate(state.manifest) : {ok:true,errors:[]};
  if(!v.ok){ setStatus("Fix first: "+v.errors.join("; "), true); return; }
  var btn=document.getElementById("saveBtn"); btn.disabled=true; setStatus("Saving…");
  fetch("/api/manifest",{ method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({ game:GAME, manifest:state.manifest, pin:PIN }) })
    .then(function(r){ return r.json(); })
    .then(function(d){
      btn.disabled=false;
      if(d.ok){ dirty=false; state.source="override"; srcBadge("override"); setStatus("Saved — live now."); if(typeof after==="function") after(); }
      else { setStatus("Save failed: "+((d.errors&&d.errors.join("; "))||d.error||d.detail||"unknown"), true); }
    })
    .catch(function(err){ btn.disabled=false; setStatus("Save failed: "+(err.message||err), true); });
}
window.addEventListener("beforeunload", function(e){ if(dirty){ e.preventDefault(); e.returnValue=""; } });
</script>
</body>
</html>
