<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Kidspedia — Explore</title>
<link rel="icon" href="/favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#0F0E17;--cream:#FDFAF5;--gold:#FFC542;--mint:#2FAE68}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:'Nunito',sans-serif;background:#0B0A18;color:var(--cream);min-height:100vh;overflow-x:hidden}
  .top{display:flex;align-items:center;gap:10px;padding:14px 16px;position:relative;z-index:5}
  #back{width:40px;height:40px;border-radius:14px;border:none;background:rgba(255,255,255,.1);color:var(--cream);font-size:18px;font-weight:900;cursor:pointer;font-family:'Nunito'}
  .top h1{font-family:'Fredoka';font-weight:700;font-size:20px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .top h1 small{display:block;font-family:'Nunito';font-weight:900;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
  .hinttag{font-size:10px;font-weight:800;color:rgba(253,250,245,.5);text-align:right;line-height:1.35}
  #stage{width:100%;height:min(60vh,460px);display:block;touch-action:none;cursor:grab}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:10px 16px 4px;scrollbar-width:none;position:relative;z-index:5}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.08);border:2px solid transparent;border-radius:999px;padding:8px 14px;color:var(--cream);font-family:'Nunito';font-weight:900;font-size:12.5px;cursor:pointer}
  .chip b{display:block;width:18px;height:18px;border-radius:50%;flex:none;background-size:cover;background-position:center;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.35),0 1px 2px rgba(0,0,0,.35)}
  .chip.sel{border-color:var(--gold)}
  .card{background:var(--cream);color:var(--ink);border-radius:24px 24px 0 0;margin-top:10px;padding:20px 18px 30px;min-height:230px;position:relative;z-index:5}
  .hd{display:flex;align-items:center;gap:12px}
  .dot{width:46px;height:46px;border-radius:50%;flex:none;box-shadow:0 4px 10px rgba(15,14,23,.15);background-size:cover;background-position:center}
  .card h2{font-family:'Fredoka';font-weight:700;font-size:24px;flex:1;min-width:0}
  .say{border:none;background:var(--ink);color:#fff;font-family:'Nunito';font-weight:900;font-size:12px;padding:10px 16px;border-radius:999px;cursor:pointer;display:flex;align-items:center;gap:7px;flex:none}
  .say[disabled]{opacity:.4;cursor:default}
  .another{margin-top:12px;display:inline-flex;align-items:center;gap:7px;border:2px solid rgba(15,14,23,.15);background:none;border-radius:999px;padding:8px 14px;font-family:'Nunito';font-weight:800;font-size:12px;color:var(--ink);cursor:pointer}
  .fact{font-size:15px;font-weight:700;line-height:1.55;margin-top:12px}
  .stats{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
  .stat{background:#F1EDE4;border-radius:14px;padding:10px 14px;flex:1;min-width:100px}
  .stat small{display:block;font-size:9.5px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:rgba(15,14,23,.45)}
  .stat b{font-family:'Fredoka';font-weight:600;font-size:16px}
  .more{margin-top:16px}
  .more small{font-size:10px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:rgba(15,14,23,.45)}
  .qrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .q{border:2px solid rgba(15,14,23,.15);background:none;border-radius:999px;padding:9px 14px;font-family:'Nunito';font-weight:800;font-size:12px;color:var(--ink);cursor:pointer}
  .q.quiz{background:var(--mint);border-color:var(--mint);color:#fff}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;font-family:'Nunito';font-weight:800;font-size:13px;padding:10px 18px;border-radius:999px;z-index:80;opacity:0;pointer-events:none;transition:opacity .25s ease}
  .toast.show{opacity:1}
  .notready{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;flex-direction:column;gap:10px}
  .notready h2{font-family:'Fredoka';font-size:22px}
  .notready p{font-size:14px;color:rgba(253,250,245,.7);max-width:280px}
  .notready button{margin-top:6px;border:none;background:var(--gold);color:var(--ink);font-family:'Nunito';font-weight:900;font-size:14px;padding:11px 20px;border-radius:999px;cursor:pointer}
  /* In-shell (loaded inside the app's GameFrame): the shell owns the top-left Home,
     so hide the exhibit's own back button and slide the title clear of the Home pill.
     One header, no stacking. Standalone (opened directly) keeps its own back button. */
  body.in-app #back{display:none}
  body.in-app .top{padding-left:96px}
  .pauseveil{position:fixed;inset:0;background:rgba(11,10,24,.55);z-index:40;display:none;align-items:center;justify-content:center;font-family:'Fredoka';font-weight:700;font-size:16px}
  .pauseveil.show{display:flex}
</style>
</head>
<body>

<div id="app" style="display:none">
  <div class="top">
    <button id="back">&lsaquo;</button>
    <h1><small>Kidspedia</small><span id="pageTitle">Loading…</span></h1>
    <div class="hinttag">Drag to spin<br>Pinch to zoom<br>Tap to select</div>
  </div>

  <canvas id="stage"></canvas>
  <div class="chips" id="chips"></div>

  <div class="card" id="card">
    <div class="hd">
      <span class="dot" id="cDot"></span>
      <h2 id="cName">&nbsp;</h2>
      <button class="say" id="sayBtn" onclick="readAloud()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l6 5V4L7 9H3z"/><path d="M16 8a5 5 0 0 1 0 8" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
        <span id="sayLabel">Read to me</span>
      </button>
    </div>
    <p class="fact" id="cFact"></p>
    <button class="another" id="anotherBtn" onclick="nextFact()" style="display:none">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
      <span>Another fact</span>
    </button>
    <div class="stats">
      <div class="stat"><small id="s1l"></small><b id="s1"></b></div>
      <div class="stat"><small id="s2l"></small><b id="s2"></b></div>
    </div>
    <div class="more"><small>Keep exploring</small><div class="qrow" id="qrow"></div></div>
  </div>
</div>

<div id="notready" class="notready" style="display:none">
  <h2 id="notreadyTitle">Not ready yet</h2>
  <p id="notreadyMsg">This exhibit isn't open yet. Check back soon!</p>
  <button id="notreadyBtn" type="button">Back to Explore</button>
</div>

<div class="pauseveil" id="pauseveil">Paused</div>
<div class="toast" id="toast"></div>

<script src="/buildable-gamenav.js"></script>
<script src="/buildable-audio.js"></script>
<script src="/buildable-feel.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
// =====================================================================
// Kidspedia orbit-explorer template — Session 8G.
// Templates are code, exhibits are data (EXHIBIT-MANIFEST.md). This file
// knows nothing about "solar system" specifically: everything tappable,
// every fact, every stat comes from the exhibit's JSON file.
// =====================================================================

function exhibitIdFromLocation() {
  // /explore/{id} (vercel rewrite) or ?exhibit={id} for direct/standalone testing.
  const m = location.pathname.match(/\/explore\/([a-z0-9-]+)/i);
  if (m) return m[1];
  const q = new URLSearchParams(location.search).get("exhibit");
  return q || "solar-system";
}
const EXHIBIT_ID = exhibitIdFromLocation();

function iframed() { try { return window.parent && window.parent !== window; } catch (e) { return false; } }
function postToShell(msg) { if (iframed()) { try { window.parent.postMessage(msg, "*"); } catch (e) {} } }
function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => t.classList.remove("show"), 2200);
}

let DATA = null;       // the loaded exhibit file
let ITEMS = {};        // id -> item (center + bodies), for chip/card lookups
let current = null;    // currently selected item id
let factIdx = 0;       // which fact of the current item is showing (facts list)
let paused = false;
let soundOn = true;      // ambient + tap sounds; the shell Sound button toggles this
let audioUnlocked = false;
let ambientAudio = null; // the soft per-exhibit background bed (an /api/sfx loop)
let narrAudio = null;    // the currently playing "Read to me" narration clip

// In-shell vs standalone: tag the body so the CSS defers the top-left corner to
// the shell's Home button (HUD-AND-NAV-RULES.md — the shell owns that corner).
if (iframed()) document.body.classList.add("in-app");

function exitToShell() {
  postToShell("nav:exit");
  if (!iframed()) { history.length > 1 ? history.back() : (location.href = "/"); }
}

// One friendly failure surface — an exhibit is NEVER left as a blank space.
// kind "notready" = not approved yet; kind "error" = it couldn't load/render.
// No emojis anywhere (product rule).
function showFallback(kind, msg) {
  try { document.getElementById("app").style.display = "none"; } catch (e) {}
  const title = document.getElementById("notreadyTitle");
  const body = document.getElementById("notreadyMsg");
  if (kind === "error") {
    title.textContent = "Oops!";
    body.textContent = msg || "This exhibit had trouble loading. Let's try again in a moment.";
  } else {
    title.textContent = "Not ready yet";
    body.textContent = msg || "This exhibit isn't open yet. Check back soon!";
  }
  document.getElementById("notready").style.display = "flex";
}
document.getElementById("notreadyBtn").onclick = exitToShell;

fetch(`/explore/${encodeURIComponent(EXHIBIT_ID)}.json`, { cache: "no-store" })
  .then((r) => { if (!r.ok) throw new Error("missing"); return r.json(); })
  .then((data) => {
    // Golden rule #2: kids only ever see status "approved". No exception.
    if (!data || data.status !== "approved") { showFallback("notready"); return; }
    if (data.template !== "orbit-explorer") { showFallback("error"); return; }
    DATA = data;
    boot(data);
  })
  .catch(() => { showFallback("error"); });

function boot(data) {
  document.getElementById("app").style.display = "block";
  document.title = "Kidspedia — " + data.title;
  document.getElementById("pageTitle").textContent = data.title;

  ITEMS[data.center.id] = data.center;
  data.bodies.forEach((b) => { ITEMS[b.id] = b; });

  // Nav: the shell owns the top-left Home in-app (HUD-AND-NAV-RULES.md). This
  // exhibit has no in-app sound/menu/help of its own, so it relies on the shell
  // Home only (like bingo/memory/snakes) — its own back button is hidden in-app
  // by the body.in-app CSS, and buildable-gamenav.js installs the iOS Home-tap
  // catcher for the reserved corner. Standalone keeps the back button working.
  document.getElementById("back").onclick = exitToShell;

  initAudio(data);

  // Honor pause/resume from the shell around the quiz gate (CARTRIDGE-CONTRACT.md — mandatory).
  window.addEventListener("message", (e) => {
    const d = e && e.data;
    if (d === "pause" || (d && d.type === "pause")) setPaused(true);
    else if (d === "resume" || (d && d.type === "resume")) setPaused(false);
  });

  // Background = silence, iOS-reliably. When the tab/app is hidden (screen-lock or
  // app-switch) stop the ambient bed and cancel any read-aloud NOW, in this frame,
  // so speech never keeps talking behind a locked phone (a shell postMessage can
  // arrive too late as iOS freezes the page). On return, the soft ambient may come
  // back but read-aloud never auto-restarts mid-sentence. We do NOT touch the quiz
  // pause veil here, so a quiz gate stays put across a background trip.
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) { stopAmbient(); stopNarration(); }
    else if (!paused) { startAmbient(); }
  });

  // three.js loads from a CDN and WebGL can be unavailable on some devices; never
  // let either failure leave a blank exhibit — show the friendly oops instead.
  if (typeof THREE === "undefined") {
    showFallback("error", "The 3D view couldn't load. Please check your connection and try again.");
    return;
  }
  try {
    initScene(data);
  } catch (e) {
    showFallback("error", "This device couldn't open the 3D view. Try another browser or device.");
    return;
  }
  buildChips(data);
  pick(data.center.id);
}

function setPaused(v) {
  paused = v;
  document.getElementById("pauseveil").classList.toggle("show", v);
  if (v) { stopAmbient(); stopNarration(); } else { startAmbient(); }
}

// ================= three.js scene =================
let renderer, scene, camera, bodies3d = {}, pickables = [], halo, clock;
let theta = 0.9, phi = 1.05, dist = 46;
const target = { x: 0, y: 0, z: 0 };

function initScene(data) {
  const canvas = document.getElementById("stage");
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(50, 1, .1, 300);

  scene.add(new THREE.AmbientLight(0xffffff, .25));
  const centerLight = new THREE.PointLight(0xFFE0A3, 1.6, 0);
  scene.add(centerLight);

  (function starfield() {
    const g = new THREE.BufferGeometry(), n = 700, pos = new Float32Array(n * 3);
    for (let i = 0; i < n * 3; i++) pos[i] = (Math.random() - .5) * 220;
    g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
    scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0xffffff, size: .35, transparent: true, opacity: .7 })));
  })();

  const allItems = [data.center].concat(data.bodies);
  allItems.forEach((p) => {
    const isCenter = p.id === data.center.id;
    const hex = (p.colorHex || "#999999").replace("#", "0x");
    const geo = new THREE.SphereGeometry(p.size || 1, 32, 24);
    const mat = isCenter
      ? new THREE.MeshBasicMaterial({ color: parseInt(hex) })
      : new THREE.MeshPhongMaterial({ color: parseInt(hex), shininess: 12 });
    const m = new THREE.Mesh(geo, mat);
    m.userData.id = p.id;
    loadArtTexture(p, mat); // art-slot rule: instant color, texture swaps in when ready — never blocks
    if (!isCenter) {
      const pts = [];
      for (let a = 0; a <= 64; a++) { const t = a / 64 * Math.PI * 2; pts.push(new THREE.Vector3(Math.cos(t) * p.orbit, 0, Math.sin(t) * p.orbit)); }
      scene.add(new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: .16 })));
      if (p.ring) {
        const innerR = (p.size || 1) * 1.35, outerR = (p.size || 1) * 2.3;
        const rg = new THREE.RingGeometry(innerR, outerR, 64, 1);
        mapRingUV(rg, innerR, outerR);
        const rm = new THREE.MeshBasicMaterial({ color: parseInt(hex), side: THREE.DoubleSide, transparent: true, opacity: .85 });
        const ring = new THREE.Mesh(rg, rm); ring.rotation.x = Math.PI / 2.25; m.add(ring);
        if (p.ringArt) loadRingTexture(p, rm); // art-slot rule: instant colorHex ring, real texture swaps in when ready
      }
      p.__angle = Math.random() * Math.PI * 2;
    }
    scene.add(m); bodies3d[p.id] = m; pickables.push(m);
  });

  halo = new THREE.Mesh(new THREE.SphereGeometry(1, 24, 18), new THREE.MeshBasicMaterial({ color: 0xFFC542, transparent: true, opacity: .25, side: THREE.BackSide }));
  scene.add(halo);

  wireInteraction(canvas);
  clock = new THREE.Clock();
  requestAnimationFrame(tick);
  addEventListener("resize", sizeStage);
  sizeStage();
}

// Art-slot convention: an "art" value with a slash (e.g.
// "explore/solar-system/textures/sun") is a real static asset in public/,
// served as {path}.webp with a {path}.jpg fallback. A flat hyphenated value
// (e.g. "explore-mercury") is a generative placeholder id, resolved through
// the shared /api/images AI pipeline. Either way, the caller's onerror chain
// keeps the flat colorHex fallback as the last resort (art-slot rule below).
function explorerArtUrl(item, ext) {
  const art = item.art || "";
  if (art.indexOf("/") !== -1) return `/${art}.${ext || "webp"}`;
  return `/api/images?kind=explore&id=${encodeURIComponent(art)}`;
}
function isRealStaticArt(item) { return (item.art || "").indexOf("/") !== -1; }

// Art rule (CARTRIDGE-CONTRACT.md): fetch art at load time, never bake it in.
// The sphere already shows its colorHex; swap in the real texture only once it
// loads, and silently keep the color if it never resolves.
function loadArtTexture(item, mat) {
  if (!item.art) return;
  const img = new Image();
  img.crossOrigin = "anonymous";
  img.onload = () => {
    try {
      const tex = new THREE.Texture(img);
      tex.needsUpdate = true;
      mat.map = tex;
      mat.color.set(0xffffff);
      mat.needsUpdate = true;
    } catch (e) {}
  };
  img.onerror = () => {
    if (isRealStaticArt(item) && img.src.endsWith(".webp")) {
      // webp missed (old browser, bad deploy): retry the jpg fallback once.
      img.src = explorerArtUrl(item, "jpg");
      return;
    }
    // instant-fallback color already showing, nothing more to do
  };
  img.src = explorerArtUrl(item, "webp");
}

// Saturn's ring geometry (a flat disc) needs UV coordinates that run radially
// from the inner edge to the outer edge, because the ring texture is a thin
// strip (inner-to-outer band), not a square planet map. RingGeometry's default
// UVs don't match that, so remap: U = normalized radial distance, V constant.
function mapRingUV(geometry, innerRadius, outerRadius) {
  const pos = geometry.attributes.position;
  const uv = geometry.attributes.uv;
  if (!pos || typeof pos.count !== "number") return; // defensive: no real geometry (e.g. WebGL unavailable)
  const v3 = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v3.fromBufferAttribute(pos, i);
    const u = Math.min(1, Math.max(0, (v3.length() - innerRadius) / (outerRadius - innerRadius)));
    uv.setXY(i, u, 1);
  }
}

// Real ring texture (transparent PNG-derived webp/jpg), same art-slot rule as
// loadArtTexture: the colorHex ring already shows instantly, the real texture
// swaps in once it loads, and a load failure silently keeps the color ring.
function loadRingTexture(item, mat) {
  if (!item.ringArt) return;
  const img = new Image();
  img.crossOrigin = "anonymous";
  const url = (ext) => `/${item.ringArt}.${ext}`;
  img.onload = () => {
    try {
      const tex = new THREE.Texture(img);
      tex.needsUpdate = true;
      mat.map = tex;
      mat.color.set(0xffffff);
      mat.needsUpdate = true;
    } catch (e) {}
  };
  img.onerror = () => {
    if (img.src.endsWith(".webp")) { img.src = url("jpg"); return; }
    // instant colorHex ring fallback already showing, nothing more to do
  };
  img.src = url("webp");
}

function wireInteraction(canvas) {
  let dragging = false, moved = 0, px = 0, py = 0, pinch = 0;
  canvas.addEventListener("pointerdown", (e) => { dragging = true; moved = 0; px = e.clientX; py = e.clientY; canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener("pointermove", (e) => {
    if (!dragging || paused) return;
    const dx = e.clientX - px, dy = e.clientY - py; moved += Math.abs(dx) + Math.abs(dy);
    theta += dx * .006; phi = Math.min(2.6, Math.max(.35, phi - dy * .006)); px = e.clientX; py = e.clientY;
  });
  canvas.addEventListener("pointerup", (e) => {
    dragging = false;
    if (moved < 8) {
      const r = canvas.getBoundingClientRect();
      const v = new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
      const rc = new THREE.Raycaster(); rc.setFromCamera(v, camera);
      const hit = rc.intersectObjects(pickables)[0];
      if (hit) { tapFx(); pick(hit.object.userData.id); }
    }
  });
  canvas.addEventListener("wheel", (e) => { e.preventDefault(); dist = Math.min(90, Math.max(12, dist + e.deltaY * .04)); }, { passive: false });
  canvas.addEventListener("touchmove", (e) => {
    if (e.touches.length === 2) {
      const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
      if (pinch) dist = Math.min(90, Math.max(12, dist * (pinch / d)));
      pinch = d; dragging = false;
    }
  }, { passive: true });
  canvas.addEventListener("touchend", () => { pinch = 0; });
}

function placeCam() {
  camera.position.set(
    target.x + dist * Math.sin(phi) * Math.cos(theta),
    target.y + dist * Math.cos(phi),
    target.z + dist * Math.sin(phi) * Math.sin(theta));
  camera.lookAt(target.x, target.y, target.z);
}
function sizeStage() {
  const canvas = document.getElementById("stage");
  const w = canvas.clientWidth, h = canvas.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / (h || 1); camera.updateProjectionMatrix();
}
function tick() {
  requestAnimationFrame(tick);
  const dt = paused ? 0 : clock.getDelta();
  const allItems = [DATA.center].concat(DATA.bodies);
  allItems.forEach((p) => {
    if (p.id === DATA.center.id) return;
    if (dt) {
      p.__angle += dt * (2 * Math.PI / (p.years || 20));
      bodies3d[p.id].position.set(Math.cos(p.__angle) * p.orbit, 0, Math.sin(p.__angle) * p.orbit);
      bodies3d[p.id].rotation.y += dt * .6;
    }
  });
  if (current && bodies3d[current]) halo.position.copy(bodies3d[current].position);
  placeCam(); sizeStage(); renderer.render(scene, camera);
}

// ================= sound: tap feedback + soft ambient (Feel Kit + shell toggle) =================
// EXHIBIT-MANIFEST.md: every tap gets Feel Kit feedback; each exhibit may name a
// soft ambient bed; the shell's Sound button (nav:sound) mutes/unmutes both.
function tapFx() { try { if (window.Feel && Feel.tap) Feel.tap(); } catch (e) {} }

function initAudio(data) {
  try { if (window.Feel && Feel.configure) Feel.configure({ sfxBase: "/api/sfx?s=" }); } catch (e) {}
  try { soundOn = !(window.BuildableAudio && window.BuildableAudio.muted); } catch (e) { soundOn = true; }

  // The shell owns the Sound button in-app; register so it drives our audio.
  try {
    if (window.BuildableGameNav) BuildableGameNav.register({
      hide: [],
      onSound: function () { setSound(!soundOn); },
      soundOn: function () { return soundOn; },
      inGame: function () { return true; },
    });
  } catch (e) {}

  // Audio unlocks on the first tap (iOS + product rule); start the ambient bed then.
  var unlock = function () {
    if (audioUnlocked) return; audioUnlocked = true;
    try { if (window.Feel && Feel.unlock) Feel.unlock(); } catch (e) {}
    startAmbient();
    document.removeEventListener("pointerdown", unlock);
    document.removeEventListener("touchstart", unlock);
  };
  document.addEventListener("pointerdown", unlock, { passive: true });
  document.addEventListener("touchstart", unlock, { passive: true });
}

function startAmbient() {
  if (!DATA || !DATA.ambient || !audioUnlocked || !soundOn || paused) return;
  if (!ambientAudio) {
    try {
      ambientAudio = new Audio("/api/sfx?s=" + encodeURIComponent(DATA.ambient));
      ambientAudio.loop = true; ambientAudio.volume = 0.15;
    } catch (e) { return; }
  }
  try { var p = ambientAudio.play(); if (p && p.catch) p.catch(function () {}); } catch (e) {}
}
function stopAmbient() { if (ambientAudio) { try { ambientAudio.pause(); } catch (e) {} } }

function setSound(on) {
  soundOn = on;
  // keep Feel/BuildableAudio mute in sync so tap sounds match the toggle
  try {
    if (window.BuildableAudio) {
      if (on && window.BuildableAudio.muted) window.BuildableAudio.toggleMute();
      else if (!on && !window.BuildableAudio.muted) window.BuildableAudio.toggleMute();
    }
  } catch (e) {}
  if (on) startAmbient(); else { stopAmbient(); stopNarration(); }
  try { if (window.BuildableGameNav) BuildableGameNav.update(); } catch (e) {}
}

// ================= chips + fact card =================
function buildChips(data) {
  const chips = document.getElementById("chips");
  [data.center].concat(data.bodies).forEach((p) => {
    const c = document.createElement("button");
    c.className = "chip"; c.id = "ch-" + p.id;
    // Real chip icon: a circular thumbnail cropped (CSS) from the body's own
    // texture, layered over its colorHex so the color shows instantly and the
    // texture swaps in when it loads — a miss silently keeps the color dot.
    const thumb = p.art ? `background-image:url(${explorerArtUrl(p, "webp")});` : "";
    c.innerHTML = `<b style="background-color:${p.colorHex || "#999"};${thumb}"></b>${escapeHtml(p.name)}`;
    c.onclick = () => { tapFx(); pick(p.id); };
    chips.appendChild(c);
  });
}

function escapeHtml(s) { return (s || "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

// ================= facts list (backward compatible with a single `fact`) =================
// EXHIBIT-MANIFEST.md: an item may carry `facts` (a short list). The card shows
// one at a time; "Another fact" cycles; "Read to me" reads whichever is showing.
function factsFor(item) { return (item && Array.isArray(item.facts) && item.facts.length) ? item.facts : [ (item && item.fact) || "" ]; }
function showFact() {
  const p = ITEMS[current]; if (!p) return;
  const fs = factsFor(p); if (factIdx >= fs.length) factIdx = 0;
  document.getElementById("cFact").textContent = fs[factIdx] || "";
  const btn = document.getElementById("anotherBtn"); if (btn) btn.style.display = fs.length > 1 ? "inline-flex" : "none";
}
function nextFact() {
  const p = ITEMS[current]; if (!p) return;
  const fs = factsFor(p); if (fs.length < 2) return;
  factIdx = (factIdx + 1) % fs.length;
  document.getElementById("cFact").textContent = fs[factIdx] || "";
  stopNarration();
}

function pick(id) {
  const p = ITEMS[id];
  if (!p) return;
  current = id;
  document.querySelectorAll(".chip").forEach((x) => x.classList.remove("sel"));
  const chip = document.getElementById("ch-" + id); if (chip) chip.classList.add("sel");
  document.getElementById("cName").textContent = p.name;
  factIdx = 0; showFact();
  const dot = document.getElementById("cDot");
  dot.style.background = p.colorHex || "#999";
  dot.style.backgroundImage = `url(${explorerArtUrl(p, "webp")})`;
  const stats = p.stats || [];
  document.getElementById("s1l").textContent = (stats[0] && stats[0].label) || "";
  document.getElementById("s1").textContent = (stats[0] && stats[0].value) || "";
  document.getElementById("s2l").textContent = (stats[1] && stats[1].label) || "";
  document.getElementById("s2").textContent = (stats[1] && stats[1].value) || "";

  const qr = document.getElementById("qrow"); qr.innerHTML = "";
  (p.asks || []).forEach((q) => {
    const b = document.createElement("button"); b.className = "q"; b.textContent = q;
    b.onclick = () => showToast("More Kidspedia answers are coming soon!");
    qr.appendChild(b);
  });
  const quizBtn = document.createElement("button");
  quizBtn.className = "q quiz"; quizBtn.textContent = "Quick quiz";
  quizBtn.onclick = () => requestQuiz(p);
  qr.appendChild(quizBtn);

  if (halo) halo.scale.setScalar((p.size || 1) * 1.35);
  stopNarration();
}

// ================= read aloud: narrator clip first, browser voice as fallback =================
// EXHIBIT-MANIFEST.md: if this fact has factAudio, "Read to me" plays the
// pre-generated narrator voice; the serve endpoint 404s instantly when a clip
// isn't made yet, so we drop to the browser voice with no waiting.
function stopNarration() {
  try { if (narrAudio) { narrAudio.pause(); narrAudio = null; } } catch (e) {}
  try { if ("speechSynthesis" in window) speechSynthesis.cancel(); } catch (e) {}
}
function browserVoice(p, text) {
  if (!("speechSynthesis" in window)) { showToast("Read-aloud isn't available on this device."); return; }
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(p.name + ". " + (text != null ? text : (p.fact || "")));
    u.rate = .92; u.pitch = 1.05;
    speechSynthesis.speak(u);
  } catch (e) { showToast("Couldn't read that aloud right now."); }
}
function readAloud() {
  if (!current) return;
  const p = ITEMS[current]; if (!p) return;
  const fs = factsFor(p); const text = fs[Math.min(factIdx, fs.length - 1)] || "";
  stopNarration();
  // The narrator clip is generated from the primary fact only, so use it for
  // fact #1; any "Another fact" is read by the browser voice (still no waiting).
  if (factIdx === 0 && p.factAudio) {
    try {
      const a = new Audio("/api/explore-audio?id=" + encodeURIComponent(p.factAudio));
      narrAudio = a;
      a.onerror = function () { narrAudio = null; browserVoice(p, text); };
      const pr = a.play();
      if (pr && pr.catch) pr.catch(function () { narrAudio = null; browserVoice(p, text); });
      return;
    } catch (e) { /* fall through to browser voice */ }
  }
  browserVoice(p, text);
}

// ================= quiz bridge (CARTRIDGE-CONTRACT.md: quizRequest / pause / resume / bk:quizDone) =================
function requestQuiz(item) {
  if (!iframed()) { showToast("Open this inside Buildable Kids to take the quiz."); return; }
  const onDone = (e) => {
    const d = e && e.data;
    if (d && d.type === "bk:quizDone") { window.removeEventListener("message", onDone); }
  };
  window.addEventListener("message", onDone);
  postToShell({
    source: "buildable",
    kind: "quizRequest",
    exhibitId: DATA.id,
    topic: DATA.topic,
    skills: DATA.skills || [],
    itemName: item.name,
    quiz: item.quiz || [],
  });
}
</script>
