<!doctype html>
<html>
<head>
    <link rel="icon" href="/favicon.ico?v=4" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=4" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=4" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=4" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=4" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#7C5CFC" />

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Buildable Survival — engine</title>
<style>
  html,body{margin:0;height:100%;background:#070a18;overflow:hidden;touch-action:none;font-family:'Fredoka',-apple-system,sans-serif}
  #wrap{position:fixed;inset:0}
  /* full-screen: the canvas fills the whole viewport (no letterbox bars, no rounded corners) */
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;background:#0b1230;border-radius:0}
  #hint{position:fixed;left:0;right:0;bottom:14px;text-align:center;color:#fff;opacity:.65;font-size:15px;pointer-events:none}
  /* menu + locker overlays (DOM, so taps are big and easy on iPad) */
  .ov{position:fixed;inset:0;z-index:10;display:none;flex-direction:column;align-items:center;
      background:linear-gradient(180deg,#0b1230,#1e1140);color:#fff;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .ov.show{display:flex}
  .ov h1{font-size:40px;margin:30px 0 4px;letter-spacing:.5px}
  .ov .sub{opacity:.75;margin:0 0 18px}
  .coins{font-size:20px;font-weight:700;color:#ffe27a;margin:6px 0 14px}
  .btn{font-family:inherit;font-weight:700;font-size:22px;color:#0b1230;background:#7ad0ff;border:none;
       border-radius:16px;padding:16px 40px;margin:8px;cursor:pointer;min-width:220px;box-shadow:0 6px 0 #4aa3d6}
  .btn:active{transform:translateY(3px);box-shadow:0 3px 0 #4aa3d6}
  .btn.alt{background:#ffe27a;box-shadow:0 6px 0 #c9ad48}
  .btn.small{font-size:17px;min-width:0;padding:10px 18px;margin:4px}
  .tabs{display:flex;gap:8px;margin:6px 0 12px;flex-wrap:wrap;justify-content:center}
  .tab{font-family:inherit;font-weight:700;font-size:16px;color:#cdd6ff;background:#1b2350;border:2px solid #2c386e;
       border-radius:12px;padding:9px 16px;cursor:pointer}
  .tab.on{background:#7ad0ff;color:#0b1230;border-color:#7ad0ff}
  .grid{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;max-width:760px;padding:0 14px 30px}
  .card{width:170px;background:#161d40;border:2px solid #2c386e;border-radius:16px;padding:14px;text-align:center}
  .card.eq{border-color:#7ee0a0;box-shadow:0 0 0 2px rgba(126,224,160,.3)}
  .card .ico{height:54px;display:flex;align-items:center;justify-content:center;margin-bottom:6px}
  .card .nm{font-weight:700;font-size:18px}
  .card .ds{opacity:.7;font-size:13px;min-height:32px;margin:4px 0 8px}
  .toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:20;background:#ffe27a;color:#0b1230;
         font-weight:700;padding:12px 22px;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.35);display:none}
  #muteBtn{position:fixed;left:12px;bottom:12px;z-index:30;font-family:inherit;font-weight:700;font-size:14px;
           color:#cdd6ff;background:rgba(20,26,64,.7);border:1px solid #2c386e;border-radius:10px;padding:7px 12px;cursor:pointer}
  #helpBtn{position:fixed;right:12px;top:12px;z-index:30;display:none;font-family:inherit;font-weight:800;font-size:18px;
           color:#0b1230;background:#ffe27a;border:none;border-radius:50%;width:38px;height:38px;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.3)}
  #start{position:fixed;inset:0;z-index:10;display:none}   /* shared start screen / level picker (BS) */
</style>
<style id="no-longpress">/* Buildable: disable iOS long-press magnifier + Look Up/Translate popup app-wide; keep inputs selectable */
html,body{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
input,textarea,select,[contenteditable]{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="900" height="600"></canvas></div>
<div id="hint">Drag to move · your hero sparkles on its own</div>

<div id="start"></div>

<div id="locker" class="ov">
  <h1>My Hero</h1>
  <div class="coins" id="lockerCoins">★ 0 coins</div>
  <div class="tabs" id="lockerTabs"></div>
  <div class="grid" id="lockerGrid"></div>
  <button class="btn small" id="lockerBack">← Back</button>
</div>
<div id="toast" class="toast"></div>
<button id="muteBtn">Sound: On</button>
<button id="helpBtn" title="How to play">?</button>

<script src="buildable-renders.js"></script>
<script src="buildable-worlds.js?v=1"></script>
<script src="buildable-audio.js"></script>
<script src="buildable-mechanics.js"></script>
<script src="buildable-startscreen.js"></script>
<script src="buildable-gamenav.js"></script>
<script src="buildable-levelthumb.js"></script>
<script src="buildable-manifest.js?v=1"></script>
<script src="buildable-hud.js?v=4"></script>
<script>
// ============================================================================
//  FIXED ENGINE — never regenerated. A game = this engine + GAME_CONFIG (data).
//  Top-down "survivor": you only move; the hero auto-fires at the nearest foe.
//  Levels are RECIPES (difficulty knobs). The engine keeps foes slower than the
//  hero so kiting always works => a level can always be survived (it's fair).
// ============================================================================
const ART="https://www.buildablekids.com/api/story-library?img=character:";
const SD="/survival-dalle/";   // new hand-made "Survival dalle" art pack (hero, foes, helpers, backgrounds)
const GAME_CONFIG = window.GAME_CONFIG || {
  name: "Space Sparkles",
  theme: "space", artStyle: "modern3d",
  bgImg: SD+"bg1.jpg",                             // fallback backdrop (per-level backgrounds set below)
  // Real ElevenLabs music (generated + cached) — never the old synth mp3s.
  musicUrl: "https://www.buildablekids.com/api/chess-music?world=space",
  // Bespoke Space Sparkles sound effects (ElevenLabs) from the shared /api/sfx library.
  sfxBase: "https://www.buildablekids.com/api/sfx?s=",
  // No per-shot fire sound (it's an auto-shooter). Sound plays on impact/kill/explode only.
  sfx: { hit:"spk_hit", coin:"spk_coin", levelup:"spk_levelup", hurt:"spk_hurt", boss:"spk_boss", win:"spk_win", lose:"spk_lose", explode:"spk_pop", boom:"spk_boom" },
  heroUrl: SD+"hero.png",                          // new jetpack explorer hero (drawn astronaut fallback)
  palette: { hero:"#eaf2ff", visor:"#62d0ff", spark:"#ffe27a", gem:"#6ff0ff", hp:"#ff7aa8", xp:"#7ad0ff", boss:"#c69bff" },
  // base hero stats (level-ups stack on top of these during a run)
  hero: { speed:2.7, hearts:4, fireCd:23, projSpeed:7.0, projDmg:1, projR:0, projPerShot:1, pierce:0, pickupR:115 },
  // each level = a recipe. Survive its time, then beat the boss to win the level.
  // bossChar = which library character is that level's boss (real art, drawn fallback).
  // foes = which new "Survival dalle" critters spawn here · bossKey = that boss's art · bgKey = which sky backdrop
  levels: [
    { name:"Comet Meadow",   dur:28, spawnEvery:46, maxAlive:8,  eSpeed:1.30, eHp:2, eDmg:1, colors:["#7ee0a0","#8fd0ff"],                     foes:["enemy_leaf","enemy_cloud"],                         boss:{ hp:26,  spd:1.05, dmg:1 }, bossKey:"enemy_tumble", bossName:"Thistle", bgKey:1 },
    { name:"Nebula Drift",   dur:34, spawnEvery:40, maxAlive:11, eSpeed:1.45, eHp:3, eDmg:1, colors:["#ffd27a","#ff9ec4","#8fd0ff"],          foes:["enemy_fairy","enemy_bat","enemy_cloud"],            boss:{ hp:42,  spd:1.15, dmg:1 }, bossKey:"enemy_bat",    bossName:"Nightwing", bgKey:2 },
    { name:"Asteroid Twirl", dur:40, spawnEvery:36, maxAlive:13, eSpeed:1.55, eHp:4, eDmg:1, colors:["#a99cff","#7ee0a0","#ff9ec4"],          foes:["enemy_rock","enemy_tumble","enemy_leaf"],           boss:{ hp:60,  spd:1.22, dmg:1 }, bossKey:"enemy_rock",   bossName:"Boulder", bgKey:4 },
    { name:"Stardust Caves", dur:44, spawnEvery:34, maxAlive:14, eSpeed:1.62, eHp:4, eDmg:1, colors:["#8fd0ff","#a99cff","#ffd27a"],          foes:["enemy_octo","enemy_fairy","enemy_bat"],             boss:{ hp:74,  spd:1.26, dmg:1 }, bossKey:"enemy_octo",   bossName:"Inkling", bgKey:3 },
    { name:"Rocket Rapids",  dur:48, spawnEvery:32, maxAlive:15, eSpeed:1.68, eHp:5, eDmg:1, colors:["#ff9ec4","#7ee0a0","#8fd0ff"],          foes:["enemy_pirate","enemy_alien","enemy_cloud"],         boss:{ hp:86,  spd:1.30, dmg:1 }, bossKey:"enemy_pirate", bossName:"Captain Bones", bgKey:2 },
    { name:"Galaxy Finale",  dur:52, spawnEvery:30, maxAlive:16, eSpeed:1.74, eHp:5, eDmg:1, colors:["#ff9ec4","#a99cff","#ffd27a","#8fd0ff"], foes:["enemy_alien","enemy_octo","enemy_fairy","enemy_rock"], boss:{ hp:104, spd:1.34, dmg:1 }, bossKey:"enemy_alien",  bossName:"The Saucer", bgKey:4 },
  ],
  // power-ups offered when the hero levels up (engine offers 3 random each time)
  powerups: ["fast","multi","big","pierce","orbit","nova","blackhole","frost","homing","swift","magnet","heal","storm","shield"],
};
const START_NEED=8, NEED_GROW=1.55;   // first power-up after 8 gems, then ramps up (slower cadence)

// W/H are the game's logical size. They now ADAPT to the screen so the canvas can fill
// the whole viewport on iPad/iPhone (no letterbox). Headless QA (node) keeps 900x600.
let W=900, H=600;
const PAD=26;                         // wall padding so the hero never hides off-screen
const c=document.getElementById('c'), ctx=c.getContext('2d');
// Fit the canvas to the whole screen. Keep the SHORT side at a fixed number of game units
// (so heroes/enemies stay a comfortable size) and let the long side grow to fill — no
// stretching, no bars. DPR-aware so it stays crisp on retina screens.
function resizeCanvas(){
  if(typeof window==="undefined"||!c||!c.getContext) return;
  const vw=window.innerWidth, vh=window.innerHeight, REF=640;
  if(!vw||!vh||!ctx.setTransform) return;   // headless / no real viewport → keep 900x600 defaults
  if(vw>=vh){ H=REF; W=Math.round(REF*vw/vh); } else { W=REF; H=Math.round(REF*vh/vw); }
  const dpr=Math.min(2, window.devicePixelRatio||1);
  c.width=Math.round(W*dpr); c.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);   // draw in logical W×H units, sharp on retina
  if(typeof makeStars==="function") makeStars();
  if(typeof hero!=="undefined" && hero){ hero.x=Math.max(PAD,Math.min(W-PAD,hero.x)); hero.y=Math.max(PAD,Math.min(H-PAD,hero.y)); }
}
const P=GAME_CONFIG.palette;
const BASE=GAME_CONFIG.hero;
// shared, reusable drawing library (all renders live here, not inline)
const BR=(typeof window!=="undefined"&&window.BuildableRenders)||(typeof globalThis!=="undefined"&&globalThis.BuildableRenders);

// shared audio library (synth SFX + space music); safe if missing (node QA)
const BA=(typeof window!=="undefined"&&window.BuildableAudio)||(typeof globalThis!=="undefined"&&globalThis.BuildableAudio);
// Session 7I: ?screen=demo attract mode — the game plays ITSELF silently for the
// landing demo box. No menus, no audio ever, all input ignored, quiet restart loop.
var DEMO=false; try{ DEMO=(typeof location!=="undefined") && new URLSearchParams(location.search).get("screen")==="demo"; }catch(e){}
function sfx(n,o){ if(DEMO)return; if(BA)BA.sfx(n,o); }
// shared FX/"juice" library (particles, flash, shake, explode) — headless-safe
const BM=(typeof window!=="undefined"&&window.BuildableMechanics)||(typeof globalThis!=="undefined"&&globalThis.BuildableMechanics);
const fx=BM?BM.makeFx():null;   // flash+shake live here; the engine keeps its own particles/rings
// Kenney CC0 particle textures (served from /fx) → glowing tinted FX; drawn shapes are the fallback.
if(BM&&BM.useTextures) BM.useTextures({ glow:"/fx/circle_05.png", spark:"/fx/star_01.png", star:"/fx/star_07.png", ring:"/fx/circle_01.png", smoke:"/fx/smoke_05.png", fire:"/fx/fire_01.png", muzzle:"/fx/light_03.png", magic:"/fx/magic_05.png" });
// shared start screen / level picker (BS) — the consistent launch screen for every game
const BS=(typeof window!=="undefined"&&window.BuildableStartScreen)||(typeof globalThis!=="undefined"&&globalThis.BuildableStartScreen);
// shared HUD (buildable-hud.js) — the ONE info-bar system for every game.
// Headless/QA or a load failure -> a no-op HUD so the engine never crashes.
let survHud=null;
function HUD(){ if(survHud) return survHud;
  if(typeof BuildableHUD==="undefined"||!BuildableHUD||!BuildableHUD.mount){ return (survHud={set:function(){},show:function(){},hide:function(){},destroy:function(){}}); }
  return (survHud=BuildableHUD.mount(c)); }
// art: hero, background, per-level boss character — all transparent library cut-outs
function mkImg(src){ const im=(typeof Image!=="undefined")?new Image():{}; try{ im.crossOrigin="anonymous"; }catch(e){} if(src&&"src" in im){ if(/\.webp(\?|$)/i.test(src)){ let st=0; im.onerror=function(){ if(st===0){st=1; im.src=src.replace(/\.webp/i,".png");} else if(st===1){st=2; im.src=src.replace(/\.webp/i,".jpg");} }; } im.src=src; } return im; }
const heroImg=mkImg(GAME_CONFIG.heroUrl);
const bgImg=mkImg(GAME_CONFIG.bgImg);
const charCache={};
function charImg(slug,emo){ const k=slug+":"+emo; if(!charCache[k]) charCache[k]=mkImg(ART+slug+"&style="+(GAME_CONFIG.artStyle||"modern3d")+"&emo="+emo); return charCache[k]; }
let bossImg=null;
// New "Survival dalle" foe cutouts (drawn blob fallback if an image is slow/missing)
const SD_ENEMY_KEYS=["enemy_fairy","enemy_cloud","enemy_leaf","enemy_alien","enemy_pirate","enemy_octo","enemy_rock","enemy_tumble","enemy_bat"];
const sdImg={};
let LIB_SKY=null, LIB_HERO=null, LIB_ENEMIES={};   // whole-game reskin (filled below if a world is assigned)
var LIB_PACK=null;                                 // full world pack (all worlds) for PER-LEVEL art
function curWorld(){ try{ return (GAME_CONFIG.levels[level]||{}).world||null; }catch(e){ return null; } }
// per-level custom image for a key ('hero' or an enemy key), or null -> whole-game/drawn fallback
function worldCustom(key){ try{ var w=curWorld(); if(!(LIB_PACK&&w&&LIB_PACK.hasWorld&&LIB_PACK.hasWorld(w))) return null;
  if(key==="hero"){ var hl=LIB_PACK.list("hero",w); return (hl[0]&&hl[0].img)||null; }
  var pc=LIB_PACK.piece("enemies",key,w); if(pc) return pc;
  var el2=LIB_PACK.list("enemies",w); for(var i=0;i<el2.length;i++){ var m=el2[i].name.match(/^(enemy_[a-z]+)/); if((m?m[1]:el2[i].name)===key) return el2[i].img; }
  return null; }catch(e){ return null; } }
function sdGet(k){ var c=worldCustom(k); if(c) return c; if(LIB_ENEMIES[k]) return LIB_ENEMIES[k]; if(!sdImg[k]) sdImg[k]=mkImg(SD+k+".webp"); return sdImg[k]; }
SD_ENEMY_KEYS.forEach(sdGet);                              // warm all foe cutouts up front
// New helper "orbi tools" (double as power-ups): spinning star, spark bee, robo-dog, healer
const HELPER_KEYS=["helper_star","helper_bee","helper_dog","helper_healer"];
HELPER_KEYS.forEach(sdGet);
// ---- library world reskin: swap sky/hero/enemies for a world made in Asset Studio ----
if(window.BuildableWorlds) BuildableWorlds.load("survival", function(p){   // shared world loader
  LIB_PACK=p;
  var b=(p.slot("bg").list[0]||p.slot("background").list[0]); if(b)LIB_SKY=b.img;
  var h=p.slot("hero").list[0]; if(h)LIB_HERO=h.img;
  p.slot("enemies").list.forEach(function(x){ var m=x.name.match(/^(enemy_[a-z]+)/); LIB_ENEMIES[m?m[1]:x.name]=x.img; });
});
// Animated frame-strips: "<key>_anim.png" is N square cells in a row (idle/hover loop).
// drawAnimSprite() flips through them by time; if the strip isn't loaded yet it falls back
// to the still cutout (sdGet), then to the drawn blob. So the game always looks right.
const animCache={};
function animGet(k){ if(!(k in animCache)) animCache[k]=mkImg(SD+k+"_anim.webp"); return animCache[k]; }
["hero"].concat(SD_ENEMY_KEYS,HELPER_KEYS).forEach(animGet);   // warm every character's animation
function drawAnimSprite(key,x,y,size,opts){ opts=opts||{};
  var _cust=worldCustom(key); if(_cust && (_cust.naturalWidth||_cust.width)){ BR.sprite(ctx,_cust,x,y,size,opts); return true; }
  const im=animGet(key), h=im&&(im.naturalHeight||im.height), w=im&&(im.naturalWidth||im.width);
  if(im && h && w){ const n=Math.max(1,Math.round(w/h)), fps=opts.fps||5;   // gentle idle speed
    const f=Math.floor(Date.now()/(1000/fps)+(opts.phase||0))%n;
    ctx.drawImage(im, f*h,0,h,h, x-size/2,y-size/2,size,size); return true; }   // (no drop shadow)
  const st=sdGet(key); if(st && (st.naturalWidth||st.width)){ BR.sprite(ctx,st,x,y,size,opts); return true; }
  return false; }
// New per-level background skies (bg1..bg4 map across the six levels via level.bgKey)
const sdBg={};
function bgFor(i){ const L2=GAME_CONFIG.levels[i]||{}; const w=L2.world||null;
  if(LIB_PACK && w && LIB_PACK.hasWorld && LIB_PACK.hasWorld(w)){ var l=LIB_PACK.list("bg",w); if(!l.length) l=LIB_PACK.list("background",w); if(l[0]&&l[0].img) return l[0].img; }
  if(LIB_SKY) return LIB_SKY; const k=L2.bgKey||1; if(!sdBg[k]) sdBg[k]=mkImg(SD+"bg"+k+".webp"); return sdBg[k]; }

// ===== Gently-moving parallax worlds (one per level) =====
// Each scene = a folder of smooth, painterly layers stacked back→front (1.png = far sky,
// higher = nearer). We draw them tiled across the width and drift each layer slowly (front
// a touch faster than back) for a calm sense of depth. An earth→space journey: green
// village → pine forest → snowy peaks → desert → night city → the moon (finale).
const SCENES=[
  { dir:"parallax/atmos/rural",  n:10 }, // green mountain village
  { dir:"parallax/atmos/forest", n:7  }, // pine forest
  { dir:"parallax/atmos/peaks",  n:9  }, // snowy mountains
  { dir:"parallax/atmos/desert", n:6  }, // warm desert spires
  { dir:"parallax/atmos/city",   n:7  }, // night city skyline
  { dir:"parallax/atmos/moon",   n:6  }, // moon with Earth rising (finale)
];
const sceneCache={};
function sceneLayers(i){ const s=SCENES[((i%SCENES.length)+SCENES.length)%SCENES.length];
  if(!sceneCache[i]){ const a=[]; for(let k=1;k<=s.n;k++) a.push(mkImg("/"+s.dir+"/"+k+".webp")); sceneCache[i]=a; }
  return sceneCache[i]; }
// (Parallax worlds retired — the new "Survival dalle" sky backgrounds are used instead,
// see bgFor(). SCENES/drawParallax are kept as a dormant fallback but no longer warmed.)
function imgReady(im){ return im && (im.complete||im.width) && (im.naturalWidth||im.width); }
// one image tiled across the width, scaled to cover H, offset by ox (px) — seamless loop
function drawScrollLayer(im,ox){ const iw=im.naturalWidth||im.width, ih=im.naturalHeight||im.height; if(!iw||!ih)return;
  const scale=H/ih, tw=Math.max(1,iw*scale); let x=-(((ox%tw)+tw)%tw); for(; x<W; x+=tw){ ctx.drawImage(im,0,0,iw,ih, x,0,tw,H); } }
// draw the whole parallax world for level i; returns false if art isn't ready yet
function drawParallax(i,t){ const layers=sceneLayers(i); let any=false;
  for(let k=0;k<layers.length;k++){ const im=layers[k]; if(!imgReady(im)) continue; any=true;
    drawScrollLayer(im, t*(3+k*4)); }   // back layer barely moves; each nearer layer drifts a touch faster
  return any; }

// deterministic RNG so spawns are reproducible (and QA-able)
function mulberry(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function dist2(ax,ay,bx,by){const dx=ax-bx,dy=ay-by;return dx*dx+dy*dy;}

// power-up catalogue
const PU={
  fast:  { name:"Faster Sparkles", apply:s=>{ s.fireCd=Math.max(11, s.fireCd*0.83); } },
  multi: { name:"Extra Sparkle",   apply:s=>{ s.projPerShot+=1; } },
  big:   { name:"Bigger Sparkles", apply:s=>{ s.projDmg+=1; s.projR+=3; } },
  pierce:{ name:"Piercing Sparkles",apply:s=>{ s.pierce+=1; } },
  orbit: { name:"Spinny Star",     apply:s=>{ s.orbit=(s.orbit||0)+1; } },
  nova:  { name:"Star Nova",       apply:s=>{ s.nova=(s.nova||0)+1; } },        // AoE shockwave on a timer
  blackhole:{ name:"Black Hole",   apply:s=>{ s.blackhole=(s.blackhole||0)+1; } }, // opens a swirl that vacuums foes in & crushes them
  frost: { name:"Frost Shot",      apply:s=>{ s.frost=(s.frost||0)+1; } },      // shots slow the slimes they hit
  homing:{ name:"Homing Sparkles", apply:s=>{ s.homing=(s.homing||0)+1; } },    // shots curve toward foes
  swift: { name:"Speedy Boots",    apply:s=>{ s.speed+=0.45; } },
  magnet:{ name:"Gem Magnet",      apply:s=>{ s.pickupR+=70; } },
  heal:  { name:"Heart",           apply:(s,g)=>{ if(g.hearts<g.maxHearts) g.hearts++; else s.shield=true; } },
  storm: { name:"Lightning Zap",   apply:s=>{ s.storm=(s.storm||0)+1; } },   // bright bolts leap from you to the nearest foes
  shield:{ name:"Bubble Shield",   apply:s=>{ s.shield=true; } },
};
const BOT_PREF=["blackhole","nova","fast","big","homing","multi","frost","pierce","orbit","swift","heal","storm","shield","magnet"];  // QA bot's pick order

// ---- game state ----
let level, L, stats, hero, enemies, projs, gems, parts, stars;
let state, started, botMode=false;
let levelFrame, levelDur, spawnTimer, spawnRng, offerRng, dropRng, spawnCount;
let xp, plvl, xpNeed, invuln, boss, bossSpawned, choices=[];
let inputDir={x:0,y:0}, orbAngle=0, regenTimer=0;

function mergeChar(d){ const c=defaultChar(); if(!d||typeof d!=="object")return c;

  for(const s of SLOTS){ if(d.owned&&Array.isArray(d.owned[s]))c.owned[s]=Array.from(new Set(c.owned[s].concat(d.owned[s]))); if(d.equipped&&d.equipped[s])c.equipped[s]=d.equipped[s]; }

function activeKidId(){ try{ const k=JSON.parse(localStorage.getItem("bk_active_kid_v1")||"null"); return k&&k.id?k.id:null; }catch{ return null; } }

// Session 9B: the SHELL owns upgrade purchases (see CARTRIDGE-CONTRACT.md). When it
// launches this game it hands the kid's equipped power as a launch param, e.g.
// ?up=weapon:twin,armor:vest,boots:rocket,hero:astro . We TRUST those ids as the
// source of truth (the shell already spent the coins and recorded ownership) and
// only apply their EFFECT below via applyGear. With no param present (offline or
// standalone play) the engine's own saved gear is used, so nothing regresses.
function shellUpgrades(){ try{
  const q=new URLSearchParams(location.search).get("up"); if(!q) return null;
  const map={}; q.split(",").forEach(p=>{ const kv=p.split(":"); if(kv[0]&&kv[1]) map[kv[0]]=kv[1]; }); return map;
}catch(e){ return null; } }
function applyShellUpgrades(){ const up=shellUpgrades(); if(!up||!CHAR) return; CHAR.equipped=CHAR.equipped||{}; CHAR.owned=CHAR.owned||{};
  for(const slot of SLOTS){ if(up[slot]){ CHAR.equipped[slot]=up[slot];
    if(Array.isArray(CHAR.owned[slot]) && !CHAR.owned[slot].includes(up[slot])) CHAR.owned[slot].push(up[slot]); } } }

// equipped gear permanently boosts the run's starting stats (called on a fresh run)
function applyGear(s){ BASE._bonusHearts=0; if(!CHAR)return; const eq=CHAR.equipped||{};
  for(const slot of SLOTS){ const item=(GEAR[slot]||[]).find(x=>x.id===eq[slot]); if(!item||!item.boost)continue; const b=item.boost;
    if(b.projDmg)s.projDmg+=b.projDmg; if(b.projPerShot)s.projPerShot+=b.projPerShot; if(b.pierce)s.pierce+=b.pierce;
    if(b.fire)s.fireCd=Math.max(6,s.fireCd-b.fire); if(b.speed)s.speed+=b.speed; if(b.pickupR)s.pickupR+=b.pickupR;
    if(b.shield)s.shield=true; if(b.hearts)BASE._bonusHearts+=b.hearts; } }

// carry=true keeps your upgrades & hearts into the next level; false = brand-new run
function startLevel(i, carry){
  level=Math.max(0,Math.min(GAME_CONFIG.levels.length-1,i)); L=GAME_CONFIG.levels[level];
  bossImg = L.bossKey ? sdGet(L.bossKey) : null;             // this level's boss = a big new foe cutout
  bgFor(level);                                              // warm this level's sky backdrop
  if(level+1<GAME_CONFIG.levels.length) bgFor(level+1);      // and pre-warm the next
  const prevHearts = hero?hero.hearts:BASE.hearts;
  if(!carry || !stats){ stats=freshStats(); applyGear(stats); xp=0; plvl=1; xpNeed=START_NEED;
    // catch-up: starting a later level on its own grants the progress you'd have by then, so a retry is fair
    const grants=level*2, cyc=["fast","big","multi","fast","big","swift"];
    for(let k=0;k<grants;k++){ PU[cyc[k%cyc.length]].apply(stats,{hearts:BASE.hearts,maxHearts:BASE.hearts}); plvl++; } }
  const maxH=BASE.hearts+(BASE._bonusHearts||0);
  hero={ x:W/2, y:H/2, r:16, hearts:(carry?Math.min(maxH,prevHearts+1):maxH), maxHearts:maxH, cd:0, aim:0, vx:0, vy:0 };
  enemies=[]; projs=[]; gems=[]; parts=[]; rings=[]; holes=[]; bhTimer=0; bolts=[]; stormTimer=0; drops=[]; dropTimer=0;
  levelFrame=0; levelDur=Math.round((L.dur||30)*60); spawnTimer=0; spawnCount=0; orbAngle=0; regenTimer=0; novaTimer=0;
  spawnRng=mulberry(1234+level*101); offerRng=mulberry(5678+level*211); dropRng=mulberry(4242+level*131);
  invuln=0; boss=null; bossSpawned=false; choices=[];
  state="play"; inputDir={x:0,y:0};
}

// ---------- level-up ----------
function offerChoices(){ const pool=(GAME_CONFIG.powerups||Object.keys(PU)).slice(); const out=[]; while(out.length<3 && pool.length){ const k=Math.floor(offerRng()*pool.length); out.push(pool.splice(k,1)[0]); } choices=out; state="choose"; sfx("levelup"); }
function applyChoice(id){ const p=PU[id]; if(p) p.apply(stats,hero);
  // "power surge": every pick is felt — a burst around the hero, a screen flash, a small
  // shake, a spark ring, and a floating label of what you just got.
  if(hero){ burst(hero.x,hero.y,P.spark,18);
    if(BM&&fx){ BM.flash(fx,P.xp,0.22); BM.shake(fx,0.16); BM.ring(fx,hero.x,hero.y,95,P.spark);
      if(BM.pop) BM.pop(fx.pops, hero.x, hero.y-46, (p&&p.name)||"", P.spark); } }
  sfx("levelup");
  choices=[]; state="play"; }
function gainXp(v){ xp+=v; while(xp>=xpNeed){ xp-=xpNeed; plvl++; xpNeed=Math.ceil(xpNeed*NEED_GROW); offerChoices(); } }

// ---------- combat ----------
function nearestEnemy(){ let best=null,bd=1e9; const all=boss?enemies.concat([boss]):enemies; for(const e of all){ const d=dist2(hero.x,hero.y,e.x,e.y); if(d<bd){bd=d;best=e;} } return best; }
function fire(){ const tgt=nearestEnemy(); if(!tgt)return; const base=Math.atan2(tgt.y-hero.y,tgt.x-hero.x); hero.aim=base;
  const n=stats.projPerShot, spread=0.26; const start=base-(n-1)*spread/2;
  for(let i=0;i<n;i++){ const a=n===1?base:start+i*spread; projs.push({ x:hero.x,y:hero.y, vx:Math.cos(a)*stats.projSpeed, vy:Math.sin(a)*stats.projSpeed, life:70, dmg:stats.projDmg, r:7+stats.projR, pierce:stats.pierce, hit:new Set() }); } if(BM&&fx) BM.muzzle(fx, hero.x+Math.cos(base)*20, hero.y+Math.sin(base)*20, P.spark); }   // muzzle flash, no per-shot sound
function spawnEnemy(){ const r=spawnRng(); const edge=Math.floor(r*4); let x,y; const m=18;
  if(edge===0){x=-m;y=spawnRng()*H;} else if(edge===1){x=W+m;y=spawnRng()*H;} else if(edge===2){x=spawnRng()*W;y=-m;} else {x=spawnRng()*W;y=H+m;}
  const col=L.colors[Math.floor(spawnRng()*L.colors.length)];
  const foeKeys=(L.foes&&L.foes.length)?L.foes:SD_ENEMY_KEYS;
  const fk=foeKeys[Math.floor(spawnRng()*foeKeys.length)];
  enemies.push({ x,y, r:15, hp:L.eHp, maxHp:L.eHp, spd:L.eSpeed, dmg:L.eDmg, val:L.eValue, col, wob:spawnRng()*6.28, boss:false, orbCd:0, animKey:fk, sprite:sdGet(fk) }); }
function spawnBoss(){ const b=L.boss||{hp:30,spd:1.1,dmg:1}; boss={ x:W/2, y:-40, r:42, hp:b.hp, maxHp:b.hp, spd:b.spd, dmg:b.dmg, val:8, col:P.boss, wob:0, boss:true, orbCd:0 }; bossSpawned=true; sfx("boss"); }
function burst(x,y,col,n){ if(BM&&fx){ BM.burst(fx.parts,x,y,col,n,{tex:"spark",additive:true,spd:[50,230],life:[0.28,0.55],r:3.5}); return; } for(let i=0;i<n;i++){ const a=Math.random()*6.28,s=1+Math.random()*3; parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:18+Math.random()*12,col}); } }
function hurtHero(dmg){ if(invuln>0)return; if(stats.shield){ stats.shield=false; invuln=70; burst(hero.x,hero.y,P.visor,12); sfx("hurt"); return; } hero.hearts-=dmg; invuln=80; burst(hero.x,hero.y,P.hp,14); sfx("hurt"); if(hero.hearts<=0){ hero.hearts=0; state="lose"; sfx("lose"); } }

// ---------- bot (QA "good player": kite away from the swarm, keep firing) ----------
function botThink(){
  if(state==="choose"){ for(const pref of BOT_PREF){ if(choices.includes(pref)){ applyChoice(pref); return; } } applyChoice(choices[0]); return; }
  const all=boss?enemies.concat([boss]):enemies;
  // flee vector from the nearest few foes + a centre nudge so we never get cornered
  let fx=0,fy=0, near=all.slice().sort((p,q)=>dist2(hero.x,hero.y,p.x,p.y)-dist2(hero.x,hero.y,q.x,q.y)).slice(0,5);
  for(const e of near){ const dx=hero.x-e.x, dy=hero.y-e.y, d=Math.hypot(dx,dy)||1; fx+=dx/d/d*200; fy+=dy/d/d*200; }
  fx += (W/2-hero.x)*0.004; fy += (H/2-hero.y)*0.004;
  const threat = near.length ? Math.hypot(hero.x-near[0].x, hero.y-near[0].y) : 999;
  // nearest gem to vacuum up XP (a kiting hero that ignores gems never powers up)
  let g=null,gd=1e9; for(const k of gems){ if(k.got)continue; const d=dist2(hero.x,hero.y,k.x,k.y); if(d<gd){gd=d;g=k;} }
  let ax=fx, ay=fy;
  if(threat>95 && g){ const dx=g.x-hero.x, dy=g.y-hero.y, d=Math.hypot(dx,dy)||1; ax=dx/d*1.0 + fx*0.4; ay=dy/d*1.0 + fy*0.4; }   // safe-ish: grab gems
  const m=Math.hypot(ax,ay); const want = m>0.0001 ? {x:ax/m,y:ay/m} : {x:0,y:0};
  // demo glide: ease the virtual stick toward the new direction with a capped step so
  // the attract-mode hero never twitches when the bot flips targets (Breaker ea01edf)
  if(DEMO){ const cap=0.09, gx=want.x-inputDir.x, gy=want.y-inputDir.y, gm=Math.hypot(gx,gy);
    inputDir = gm>cap ? {x:inputDir.x+gx/gm*cap, y:inputDir.y+gy/gm*cap} : want; }
  else inputDir=want;
}

// ---------- update (pure logic, no canvas — so QA can run it headless) ----------
function update(){
  if(DEMO && (state==="win"||state==="lose") && !survDemoRestartT){
    survDemoRestartT=setTimeout(function(){ survDemoRestartT=null; survDemoStart(); },1200); }
  if(state==="win"||state==="lose"||state==="title"){ if(BM&&fx) BM.update(fx); return; }   // keep FX (shake/flash) settling so the win screen doesn't jitter forever
  if(botMode) botThink(); else readKeys();
  if(!started) return;
  if(state==="choose") return;     // action pauses while choosing a power-up
  if(helpOpen) return;             // paused while the how-to-play demo is open

  levelFrame++;
  // move hero
  hero.vx=inputDir.x*stats.speed; hero.vy=inputDir.y*stats.speed;
  hero.x=Math.max(PAD,Math.min(W-PAD,hero.x+hero.vx)); hero.y=Math.max(PAD,Math.min(H-PAD,hero.y+hero.vy));
  if(invuln>0)invuln--;
  // auto fire
  if(hero.cd>0)hero.cd--; if(hero.cd<=0){ fire(); hero.cd=stats.fireCd; }
  // spawn waves until the timer runs out, then the boss arrives
  if(levelFrame<levelDur){ spawnTimer--; if(spawnTimer<=0 && enemies.length<L.maxAlive){ spawnEnemy(); spawnCount++; spawnTimer=L.spawnEvery; } }
  else if(!bossSpawned){ spawnBoss(); }
  // enemies chase + separate a little so they don't all stack on the hero
  const all=boss?enemies.concat([boss]):enemies;
  for(const e of all){ if(e.slowT>0)e.slowT--; const sp=e.spd*(e.slowT>0?0.32:1); const dx=hero.x-e.x, dy=hero.y-e.y, d=Math.hypot(dx,dy)||1; e.x+=dx/d*sp; e.y+=dy/d*sp; e.wob+=0.15;
    for(const o of enemies){ if(o===e)continue; const ox=e.x-o.x, oy=e.y-o.y, od=Math.hypot(ox,oy); if(od>0 && od<e.r+o.r){ e.x+=ox/od*0.6; e.y+=oy/od*0.6; } }
    if(d<e.r+hero.r){ hurtHero(e.dmg); const k=e.boss?6:10; e.x-=dx/d*k; e.y-=dy/d*k; }
  }
  // projectiles
  for(const p of projs){
    if(stats.homing){ let tg=null,td=1e9; for(const e of all){ const dd=dist2(p.x,p.y,e.x,e.y); if(dd<td){td=dd;tg=e;} }
      if(tg){ const ang=Math.atan2(tg.y-p.y,tg.x-p.x), cur=Math.atan2(p.vy,p.vx); let diff=ang-cur; while(diff>Math.PI)diff-=6.283; while(diff<-Math.PI)diff+=6.283; const na=cur+diff*Math.min(0.28,stats.homing*0.09), sp=Math.hypot(p.vx,p.vy); p.vx=Math.cos(na)*sp; p.vy=Math.sin(na)*sp; } }
    p.x+=p.vx; p.y+=p.vy; p.life--;
    for(const e of all){ if(p.hit.has(e))continue; if(dist2(p.x,p.y,e.x,e.y) < (p.r+e.r)*(p.r+e.r)){ e.hp-=p.dmg; p.hit.add(e); burst(p.x,p.y,e.col,4);
      if(stats.frost) e.slowT=Math.max(e.slowT||0, 90+stats.frost*45);
      if(p.pierce>0)p.pierce--; else p.life=0;
      if(e.hp<=0){ killEnemy(e); } else { sfx("hit"); }   // soft impact only when it survives; kill plays the pop
      break; } }
  }
  projs=projs.filter(p=>p.life>0 && p.x>-20&&p.x<W+20&&p.y>-20&&p.y<H+20);
  // Star Nova: periodic shockwave that damages everything nearby
  if(stats.nova>0){ const cd=Math.max(80,240-stats.nova*38); novaTimer++;
    if(novaTimer>=cd){ novaTimer=0; const nr=80+stats.nova*20, nd=1+Math.floor((stats.nova-1)/2); if(BM&&fx)BM.ring(fx,hero.x,hero.y,nr,P.spark); else rings.push({x:hero.x,y:hero.y,r:12,max:nr,life:22});
      const all2=boss?enemies.concat([boss]):enemies; for(const e of all2){ if(dist2(hero.x,hero.y,e.x,e.y)<nr*nr){ e.hp-=nd; burst(e.x,e.y,P.spark,4); if(stats.frost)e.slowT=Math.max(e.slowT||0,60); if(e.hp<=0)killEnemy(e); } } } }
  for(const rg of rings){ rg.r+=(rg.max-rg.r)*0.25; rg.life--; } rings=rings.filter(rg=>rg.life>0);
  // Black Hole: every so often opens a swirling singularity over the swarm that drags nearby
  // foes into its core and crushes them. Kept fair: it opens AWAY from the hero (so it pulls
  // enemies off you), and bosses only get tugged gently, never yanked or insta-crushed.
  // Black Hole (STRONG auto-vortex): opens OFTEN, right over the swarm, and powerfully
  // hauls every nearby foe into its core and crushes them. Big, loud, clearly felt.
  // Still fair: it opens AWAY from the hero (pulling enemies OFF you) and only tugs a
  // boss gently so a boss fight is never trivialised.
  if(stats.blackhole>0){ const cd=Math.max(80,165-stats.blackhole*22); bhTimer++;
    if(bhTimer>=cd && enemies.length>0){ bhTimer=0;
      let cx=0,cy=0; for(const e of enemies){ cx+=e.x; cy+=e.y; } cx/=enemies.length; cy/=enemies.length;   // over the thickest part of the swarm
      const dh=Math.hypot(cx-hero.x,cy-hero.y); if(dh<180){ const a=Math.atan2((cy-hero.y)||1,(cx-hero.x)||1); cx=hero.x+Math.cos(a)*210; cy=hero.y+Math.sin(a)*210; }
      cx=Math.max(60,Math.min(W-60,cx)); cy=Math.max(60,Math.min(H-60,cy));
      holes.push({ x:cx, y:cy, r:155+stats.blackhole*34, life:160+stats.blackhole*34, age:0, dmg:1+Math.floor(stats.blackhole/2) });

        if(d<h.r){ const pull=e.boss ? 1.3 : (5.5 + (1-d/h.r)*7.5); e.x+=dx/d*pull; e.y+=dy/d*pull;   // strong haul-in

    for(let k=0;k<stats.orbit;k++){ const a=orbAngle+k*6.28/stats.orbit, ox=hero.x+Math.cos(a)*OR, oy=hero.y+Math.sin(a)*OR;
      for(const e of all2){ if(e.orbCd>0)continue; if(dist2(ox,oy,e.x,e.y)<(12+e.r)*(12+e.r)){ e.hp-=1; e.orbCd=16; burst(ox,oy,P.spark,4); if(e.hp<=0)killEnemy(e); } } } }

    if(stormTimer>=cd){ stormTimer=0; const all2=boss?enemies.concat([boss]):enemies;
      if(all2.length){ const tg=all2.slice().sort((a,b)=>dist2(hero.x,hero.y,a.x,a.y)-dist2(hero.x,hero.y,b.x,b.y)).slice(0,1+stats.storm);

// coin tiers: 1 (=1, common) · 2 (=5, rare) · 3 (=10, boss/lucky). Higher levels drop a bit more.
function rollTier(){ const r=(dropRng?dropRng():Math.random())-level*0.012; if(r>0.965) return 3; if(r>0.80) return 2; return 1; }
function tierVal(t){ return t===3?10:t===2?5:1; }
function dropCoin(x,y,tier){ const rr=dropRng||Math.random; const t=tier||rollTier(); gems.push({ x,y, tier:t, val:tierVal(t), vx:(rr()-0.5)*2, vy:(rr()-0.5)*2, got:false }); }
function killEnemy(e){
  if(e.boss){ for(let i=0;i<3;i++) dropCoin(e.x+(Math.random()-0.5)*46, e.y+(Math.random()-0.5)*46, 3); boss=null;
    if(BM&&fx) BM.explode(fx, e.x, e.y, e.col, { big:true, sfx:"boom" }); else { burst(e.x,e.y,e.col,26); sfx("boom"); } }
  else { dropCoin(e.x,e.y);
    if(BM&&fx) BM.explode(fx, e.x, e.y, e.col, { sfx:"explode" }); else { burst(e.x,e.y,e.col,10); sfx("explode"); }
    const i=enemies.indexOf(e); if(i>=0)enemies.splice(i,1); } }
// walk-over drop effects (instant, one-time treats)
function collectDrop(kind){
  if(kind==="magnet"){ for(const g of gems){ runGems+=g.val; gainXp(g.val); } gems=[]; sfx("coin",{tier:3}); if(BM&&fx){ BM.ring(fx,hero.x,hero.y,150,P.gem); BM.flash(fx,P.gem,0.12); } }
  else if(kind==="bomb"){ const all2=(boss?enemies.concat([boss]):enemies).slice(); for(const e of all2){ e.hp -= e.boss?8:999; burst(e.x,e.y,e.col,6); if(e.hp<=0)killEnemy(e); } if(BM&&fx) BM.explode(fx,hero.x,hero.y,P.spark,{big:true,sfx:"boom"}); else sfx("boom"); }
  else if(kind==="freeze"){ for(const e of enemies){ e.slowT=Math.max(e.slowT||0,220); } if(boss)boss.slowT=Math.max(boss.slowT||0,130); if(BM&&fx){ BM.flash(fx,"#bfeaff",0.18); BM.ring(fx,hero.x,hero.y,170,"#bfeaff"); } sfx("levelup"); }
  else if(kind==="heart"){ if(hero)hero.hearts=hero.maxHearts; if(hero)burst(hero.x,hero.y,P.hp,16); if(BM&&fx)BM.flash(fx,P.hp,0.14); sfx("levelup"); }
}

              { hearts: hero.hearts } ]
    }); }catch(e){}
    // xp gauge (bottom) — a live power-up progress bar, not HUD chrome
    ctx.fillStyle="rgba(255,255,255,.2)"; rrect(18,H-26,W-36,10,5);ctx.fill(); ctx.fillStyle=P.xp; rrect(18,H-26,(W-36)*Math.min(1,xp/xpNeed),10,5);ctx.fill();
  } else if(_hud){ _hud.hide(); }
  // overlays
  if(state==="choose"){ ctx.fillStyle="rgba(5,8,24,.72)";ctx.fillRect(0,0,W,H); ctx.fillStyle="#fff";ctx.textAlign="center";ctx.font="bold 34px Fredoka,sans-serif";ctx.fillText("Power up! Pick one",W/2,H/2-160);
    for(let k=0;k<choices.length;k++){ const cr=cardRect(k), id=choices[k]; ctx.fillStyle="#1b2350";rrect(cr.x,cr.y,cr.w,cr.h,18);ctx.fill(); ctx.strokeStyle=P.xp;ctx.lineWidth=3;rrect(cr.x,cr.y,cr.w,cr.h,18);ctx.stroke();
      drawPUicon(id,cr.x+cr.w/2,cr.y+86); ctx.fillStyle="#fff";ctx.font="bold 22px Fredoka,sans-serif";ctx.fillText(PU[id].name,cr.x+cr.w/2,cr.y+cr.h-46); ctx.fillStyle="#9fb0ff";ctx.font="16px Fredoka,sans-serif";ctx.fillText("Tap to choose",cr.x+cr.w/2,cr.y+cr.h-22); } }
  if(helpOpen) drawTutorial();   // in-game auto-demo removed (pre-level start screen already teaches it); only shows if help is opened
  if(state==="title"){ ctx.fillStyle="rgba(5,8,24,.55)";ctx.fillRect(0,0,W,H); ctx.fillStyle="#fff";ctx.textAlign="center";ctx.font="bold 44px Fredoka,sans-serif";ctx.fillText(GAME_CONFIG.name,W/2,H/2-10); ctx.font="22px Fredoka,sans-serif";ctx.fillText("Drag to move · Tap to start",W/2,H/2+30); }
  if(DEMO && state==="play") drawDemoHand();
  if(!DEMO && state==="win"){ banner(level<GAME_CONFIG.levels.length-1?"Boss beaten!":"You Win!", level<GAME_CONFIG.levels.length-1?"Next level unlocked — tap to go on":"Tap to collect your coins"); }
  if(!DEMO && state==="lose"){ banner("Oops! Out of hearts","Tap to collect your coins"); }
}

// ===== menus, locker, runs, coins (DOM — guarded so headless QA never touches it) =====
function el(id){ const e=document.getElementById(id); return (e&&e.style)?e:null; }
function show(id,on){ const e=el(id); if(e)e.classList[on?"add":"remove"]("show"); }
function toast(msg){ const e=el("toast"); if(!e)return; e.textContent=msg; e.style.display="block"; clearTimeout(toast._t); toast._t=setTimeout(()=>{e.style.display="none";},2600); }
function refreshMenu(){ const b=el("lockerCoins"); if(b)b.textContent="★ "+(CHAR?CHAR.coins:0)+" coins"; }
// ---- shared start screen / level picker (BS) ----
function heroName(){ const h=GEAR.hero.find(x=>x.id===(CHAR&&CHAR.equipped.hero)); return h?h.name:"Astro"; }
function bsLevels(){ const unlocked=CHAR?(CHAR.unlocked||0):0;
  return GAME_CONFIG.levels.map((lv,i)=>{ const st = i<unlocked?"done" : i===unlocked?"next" : "locked";
    const o={ n:i+1, name:lv.name, state:st };
    o.img = SD+"bg"+(lv.bgKey||1)+".webp";   // journey card shows the level's OWN world art (like Breaker)
    if(st==="done"){ o.stars=3; o.maxStars=3; }
    return o; }); }
function bsConfig(){ const unlocked=CHAR?(CHAR.unlocked||0):0; return {
  title:GAME_CONFIG.name, subtitle:"Beat each boss to unlock the next world",
  coins:CHAR?CHAR.coins:0, sound:!(BA&&BA.muted),
  hero:{ name:heroName(), img:GAME_CONFIG.heroUrl, progressText:unlocked+" of "+GAME_CONFIG.levels.length+" worlds cleared" },
  levels:bsLevels(), customizeLabel:"My Hero",
}; }
let bsScreen=null;
function showMenu(){ state="title"; show("locker",false); showHelpBtn(false); showMuteBtn(false);
  const startEl=el("start"); if(!startEl) return; startEl.style.display="block";
  if(BS && !bsScreen){ bsScreen=BS.mount(startEl, bsConfig(), {
      onPlay:(n)=>startRunAt(n-1), onCustomize:showLocker, onHero:showLocker,
      onSound:(on)=>{ if(BA){ BA.unlock(); const cur=!BA.muted; if(cur!==on) BA.toggleMute(); } },
      onBack:()=>{ try{ window.parent && window.parent!==window && window.parent.postMessage("bk:home","*"); }catch(e){} },
    }); }
  else if(bsScreen){ bsScreen.update(bsConfig()); } }
function startRunAt(i){ if(BA)BA.unlock(); runGems=0; runLevelsCleared=0; stats=null; startLevel(i,false); state="play"; started=true;
  const s=el("start"); if(s)s.style.display="none"; show("locker",false); showHelpBtn(false); showMuteBtn(true); }
function startRun(){ startRunAt(Math.min((CHAR&&CHAR.unlocked)||0, GAME_CONFIG.levels.length-1)); }
function endRun(won){ if(!CHAR)CHAR=defaultChar();
  CHAR.totalRuns++; if(won)CHAR.totalWins++; CHAR.totalGems+=runGems; CHAR.bestLevel=Math.max(CHAR.bestLevel,runLevelsCleared);
  const reward=Math.round(runGems + runLevelsCleared*5 + (won?20:0)); CHAR.coins+=reward; saveChar();
  showMenu(); toast((won?"You won! ":"Good try! ")+"+"+reward+" coins"); }

const SLOT_LABEL={weapon:"Weapon",armor:"Armor",boots:"Boots",hero:"Hero"};
// Upgrade-shop cards use the real new artwork where it matches; other items keep the drawn icon.
const GEAR_IMG={ hero:{astro:"hero.png"}, weapon:{nova:"helper_star.png"}, armor:{shell:"helper_healer.png"}, boots:{rocket:"helper_dog.png"} };
function gearIcon(slot,item){ const m=(GEAR_IMG[slot]||{})[item.id];
  if(m) return '<img src="'+SD+m+'" alt="" style="height:54px;width:auto;object-fit:contain;filter:drop-shadow(0 3px 4px rgba(0,0,0,.35))">';
  return BR.gearSVG(slot); }
function renderLocker(){ const tabs=el("lockerTabs"), grid=el("lockerGrid"); if(!tabs||!grid||!CHAR)return;
  tabs.innerHTML=""; for(const s of SLOTS){ const b=document.createElement("button"); b.className="tab"+(s===lockerTab?" on":""); b.textContent=SLOT_LABEL[s]; b.onclick=()=>{lockerTab=s;renderLocker();}; tabs.appendChild(b); }
  grid.innerHTML=""; for(const item of GEAR[lockerTab]){ const owned=CHAR.owned[lockerTab].includes(item.id); const eq=CHAR.equipped[lockerTab]===item.id;
    const card=document.createElement("div"); card.className="card"+(eq?" eq":"");
    card.innerHTML='<div class="ico">'+gearIcon(lockerTab,item)+'</div><div class="nm">'+item.name+'</div><div class="ds">'+item.desc+'</div>';
    const btn=document.createElement("button"); btn.className="btn small"+(owned?"":" alt");
    if(eq){ btn.textContent="Equipped"; btn.disabled=true; btn.style.opacity=".6"; }
    else if(owned){ btn.textContent="Equip"; btn.onclick=()=>{ CHAR.equipped[lockerTab]=item.id; saveChar(); renderLocker(); }; }
    else { btn.textContent="Buy ★"+item.cost; btn.onclick=()=>{ if(CHAR.coins>=item.cost){ CHAR.coins-=item.cost; CHAR.owned[lockerTab].push(item.id); CHAR.equipped[lockerTab]=item.id; saveChar(); refreshMenu(); renderLocker(); } else { toast("Need ★"+(item.cost-CHAR.coins)+" more coins"); } }; }
    card.appendChild(btn); grid.appendChild(card); }
}
function showLocker(){ lockerTab="weapon"; const s=el("start"); if(s)s.style.display="none"; show("locker",true); showHelpBtn(false); showMuteBtn(false); refreshMenu(); renderLocker(); }

function wireMenus(){ const bk=el("lockerBack"); if(bk)bk.onclick=showMenu;   // start screen + level picker are the shared BS overlay now
  const mb=el("muteBtn"); if(mb){ const upd=()=>{ mb.textContent="Sound: "+(BA&&BA.muted?"Off":"On"); }; upd(); mb.onclick=()=>{ if(BA){ BA.unlock(); BA.toggleMute(); } upd(); }; }
  const hb=el("helpBtn"); if(hb)hb.onclick=()=>{ helpOpen=true; }; }
function showHelpBtn(on){ const hb=el("helpBtn"); if(hb)hb.style.display=on?"block":"none"; }
function showMuteBtn(on){ const mb=el("muteBtn"); if(mb)mb.style.display=on?"block":"none"; }

function frame(){ update(); draw(); requestAnimationFrame(frame); }
// boot: load the saved character, wire menus, show the shared start screen
if(typeof document!=="undefined" && document.getElementById("start")){
  if(DEMO){ CHAR=defaultChar(); survDemoStart(); }   // attract mode: no music, no menus, no saves
  else {
    if(BA){ BA.configure({sfxBase:GAME_CONFIG.sfxBase, map:GAME_CONFIG.sfx}); if(GAME_CONFIG.musicUrl)BA.setMusic(GAME_CONFIG.musicUrl); }
    CHAR=localLoadChar()||defaultChar(); applyShellUpgrades(); wireMenus(); showMenu(); loadChar();
    survReadLevelParam();   // Session 7I: ?level=N (0-based) -> start that level like its card tap
  }
  resizeCanvas(); addEventListener("resize",resizeCanvas); addEventListener("orientationchange",resizeCanvas); }
requestAnimationFrame(frame);

// ---- SHELL: load /survival/manifest.json and drive levels/identity from it ----
// The built-in GAME_CONFIG above is the headless/QA + offline fallback. In the
// browser the manifest is the source of the level list (names, difficulty 1-5 ->
// engine tuning, which foes/boss/sky each level uses) and the game's signature
// colour (HUD accent). Only the campaign levels are replaced; the engine's own
// palette, hero stats, sounds and gear store stay put. (QA calls _applyManifest
// directly, so this async fetch path is browser-only.)
function applyManifest(cfg, raw){
  if(!cfg || !Array.isArray(cfg.levels) || !cfg.levels.length) return;
  try{ window.BUILDABLE_MANIFEST = raw; }catch(e){}
  try{ if(window.BuildableHUD && BuildableHUD.setAccent && raw && raw.color) BuildableHUD.setAccent(raw.color); }catch(e){}
  GAME_CONFIG.levels.length = cfg.levels.length;
  for(var i=0;i<cfg.levels.length;i++){ GAME_CONFIG.levels[i]=cfg.levels[i]; }
  try{ survPlayPending(); }catch(e){}   // a ?level= deep-link waits for the manifest's level list
  try{ if(bsScreen && typeof bsConfig==="function") bsScreen.update(bsConfig()); }catch(e){}
}
try{
  if(window.BuildableManifest && window.BuildableManifest.load){
    window.BuildableManifest.load("survival", applyManifest, function(errs){
      try{ console.warn("[survival] manifest not applied, using built-in levels:", errs); }catch(e){}
    });
  }
}catch(e){}

// ---------- Session 7I: ?level=N deep-link + ?screen=demo attract mode ----------
// Deep-link: N is a 0-based index into the manifest levels array. The manifest
// applies async, so the request is stashed and fired by applyManifest (with a
// 1.6s safety timeout — same shape as Breaker's bkPendingPlay). Out-of-range
// indexes clamp. Composes with ?up= (applyShellUpgrades already ran at boot).
var survPendingLevel, survDemoRestartT;   // no initializer: boot (above) may have already stashed a pending ?level=
function survClampLevel(n){ return Math.max(0, Math.min(GAME_CONFIG.levels.length-1, Math.floor(n))); }
function survPlayPending(){ if(survPendingLevel==null) return; var n=survPendingLevel; survPendingLevel=null; startRunAt(survClampLevel(n)); }
function survReadLevelParam(){ var v=null; try{ v=new URLSearchParams(location.search).get("level"); }catch(e){}
  if(v==null || v==="" || isNaN(+v)) return;
  if(window.BuildableManifest && window.BuildableManifest.load && !window.BUILDABLE_MANIFEST){
    survPendingLevel=+v;                     // manifest still applying -> defer
    setTimeout(survPlayPending, 1600);       // safety net if the manifest never answers
  } else { startRunAt(survClampLevel(+v)); }
}
// Attract mode: start world 1 with the QA bot driving (weapons already auto-fire);
// on win/lose the update loop quietly restarts after ~1.2s. Never saves, never beeps.
function survDemoStart(){
  runGems=0; runLevelsCleared=0; hero=null; stats=null; startLevel(0,false);
  state="play"; botMode=true; started=true;
  var s=el("start"); if(s)s.style.display="none"; show("locker",false); showHelpBtn(false); showMuteBtn(false);
}
// Demo tutorial hand: the shared 3D hand (BR.hand) glides after the hero with a
// capped per-frame step (never teleports) + a small press dip — shows the drag gesture.
var demoHand={x:0,y:0,init:false};
function drawDemoHand(){ if(!hero || !(BR&&BR.hand)) return; const t=Date.now()/1000;
  const tx=hero.x+Math.cos(t*1.1)*30, ty=hero.y+58+Math.sin(t*2.2)*6;
  if(!demoHand.init){ demoHand.x=tx; demoHand.y=ty; demoHand.init=true; }
  const dx=tx-demoHand.x, dy=ty-demoHand.y, d=Math.hypot(dx,dy), cap=4.5;
  if(d>cap){ demoHand.x+=dx/d*cap; demoHand.y+=dy/d*cap; } else { demoHand.x=tx; demoHand.y=ty; }
  const dip=Math.max(0,Math.sin(t*2.6))*8;
  ctx.save(); ctx.globalAlpha=0.92; BR.hand(ctx,demoHand.x,demoHand.y+dip,0.95); ctx.restore();
}

// ---------- QA / picker hooks ----------
window.SURV_GAME = {
  startLevel:(i)=>{ startLevel(i); },
  setBot:(b)=>{ botMode=b; started=true; if(state==="title")state="play"; },
  state:()=>state,
  dbg:()=>({ level, frame:levelFrame, dur:levelDur, hp:hero.hearts, plvl, foes:enemies.length, boss:boss?Math.round(boss.hp):0, bossUp:bossSpawned, state }),
  // headless harness: run the bot through a level with no drawing, return the result
  sim:(idx, maxFrames)=>{ hero=null; stats=null; startLevel(idx,false); state="play"; botMode=true; started=true; let f=0; const cap=maxFrames||7000;
    while(state!=="win" && state!=="lose" && f<cap){ update(); f++; } return { level:idx, result:state, frames:f, powerLv:plvl, hpLeft:hero.hearts }; },
  // full adventure: start at level 1 and carry upgrades forward (the real player experience)
  campaign:(cap)=>{ hero=null; stats=null; startLevel(0,false); state="play"; botMode=true; started=true; const out=[]; cap=cap||8000;
    for(let lvl=0; lvl<GAME_CONFIG.levels.length; lvl++){ let f=0; while(state!=="win" && state!=="lose" && f<cap){ update(); f++; }
      out.push({ level:lvl+1, result:state, frames:f, powerLv:plvl, hpLeft:hero.hearts }); if(state==="lose")break;
      if(lvl<GAME_CONFIG.levels.length-1){ startLevel(lvl+1,true); state="play"; botMode=true; started=true; } }
    return out; },
  // gear/save debug hooks (used by qa.mjs)
  _char:()=>CHAR, _setChar:(c)=>{ CHAR=mergeChar(c); }, _equip:(slot,id)=>{ CHAR.equipped[slot]=id; },
  // Session 9B: expose the engine's real gear ids per slot + the shell-param handoff
  // so QA can prove every manifest upgrade id maps to a real, applyable power.
  _gearIds:()=>{ const o={}; for(const s of SLOTS) o[s]=(GEAR[s]||[]).map(x=>x.id); return o; },
  _applyShellUpgrades:()=>applyShellUpgrades(),
  _gearTest:()=>{ const s=freshStats(); applyGear(s); return { dmg:s.projDmg, shots:s.projPerShot, pierce:s.pierce, fireCd:s.fireCd, speed:Math.round(s.speed*100)/100, pickupR:s.pickupR, shield:s.shield, bonusHearts:BASE._bonusHearts }; },
  // render debug hooks (used by qa-render.mjs)
  _begin:(i)=>{ if(!CHAR)CHAR=defaultChar(); stats=null; startLevel(i||0,false); state="play"; botMode=true; started=true; },
  _step:(n)=>{ for(let i=0;i<(n||1);i++) update(); }, _draw:()=>{ try{ draw(); return "ok"; }catch(e){ return "ERR: "+(e&&e.message||e); } },
  // Session 5A: manifest hooks (mirror Breaker/Sling). _cfg is the live config;
  // _applyManifest lets the QA robot drive the engine from the manifest.
  _cfg:()=>GAME_CONFIG,
  _applyManifest:(cfg,raw)=>applyManifest(cfg,raw),
};
// normalize on the platform game handle (Breaker/Sling expose BUILDABLE_GAME)
try{ window.BUILDABLE_GAME = window.SURV_GAME; }catch(e){}
</script>
</body>
