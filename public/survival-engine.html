<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Buildable Survival — engine</title>
<style>
  html,body{margin:0;height:100%;background:#070a18;overflow:hidden;touch-action:none;font-family:'Fredoka',-apple-system,sans-serif}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{background:#000;max-width:100%;max-height:100%;image-rendering:auto;border-radius:14px}
  #hint{position:fixed;left:0;right:0;bottom:14px;text-align:center;color:#fff;opacity:.65;font-size:15px;pointer-events:none}
  /* menu + locker overlays (DOM, so taps are big and easy on iPad) */
  .ov{position:fixed;inset:0;z-index:10;display:none;flex-direction:column;align-items:center;
      background:linear-gradient(180deg,#0b1230,#1e1140);color:#fff;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .ov.show{display:flex}
  .ov h1{font-size:40px;margin:30px 0 4px;letter-spacing:.5px}
  .ov .sub{opacity:.75;margin:0 0 18px}
  .coins{font-size:20px;font-weight:700;color:#ffe27a;margin:6px 0 14px}
  .btn{font-family:inherit;font-weight:700;font-size:22px;color:#0b1230;background:#7ad0ff;border:none;
       border-radius:16px;padding:16px 40px;margin:8px;cursor:pointer;min-width:220px;box-shadow:0 6px 0 #4aa3d6}
  .btn:active{transform:translateY(3px);box-shadow:0 3px 0 #4aa3d6}
  .btn.alt{background:#ffe27a;box-shadow:0 6px 0 #c9ad48}
  .btn.small{font-size:17px;min-width:0;padding:10px 18px;margin:4px}
  .tabs{display:flex;gap:8px;margin:6px 0 12px;flex-wrap:wrap;justify-content:center}
  .tab{font-family:inherit;font-weight:700;font-size:16px;color:#cdd6ff;background:#1b2350;border:2px solid #2c386e;
       border-radius:12px;padding:9px 16px;cursor:pointer}
  .tab.on{background:#7ad0ff;color:#0b1230;border-color:#7ad0ff}
  .grid{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;max-width:760px;padding:0 14px 30px}
  .card{width:170px;background:#161d40;border:2px solid #2c386e;border-radius:16px;padding:14px;text-align:center}
  .card.eq{border-color:#7ee0a0;box-shadow:0 0 0 2px rgba(126,224,160,.3)}
  .card .ico{height:54px;display:flex;align-items:center;justify-content:center;margin-bottom:6px}
  .card .nm{font-weight:700;font-size:18px}
  .card .ds{opacity:.7;font-size:13px;min-height:32px;margin:4px 0 8px}
  .toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:20;background:#ffe27a;color:#0b1230;
         font-weight:700;padding:12px 22px;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.35);display:none}
  #muteBtn{position:fixed;left:12px;bottom:12px;z-index:30;font-family:inherit;font-weight:700;font-size:14px;
           color:#cdd6ff;background:rgba(20,26,64,.7);border:1px solid #2c386e;border-radius:10px;padding:7px 12px;cursor:pointer}
  #helpBtn{position:fixed;right:12px;top:12px;z-index:30;display:none;font-family:inherit;font-weight:800;font-size:18px;
           color:#0b1230;background:#ffe27a;border:none;border-radius:50%;width:38px;height:38px;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.3)}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="900" height="600"></canvas></div>
<div id="hint">Drag to move · your hero sparkles on its own</div>

<div id="menu" class="ov">
  <h1 id="menuTitle">Space Sparkles</h1>
  <div class="sub" id="menuSub">Drag to move. Beat each boss to unlock the next level.</div>
  <div class="coins" id="menuCoins">★ 0 coins</div>
  <div class="grid" id="levelSelect" style="max-width:560px"></div>
  <button class="btn alt" id="lockerBtn">My Hero</button>
</div>

<div id="locker" class="ov">
  <h1>My Hero</h1>
  <div class="coins" id="lockerCoins">★ 0 coins</div>
  <div class="tabs" id="lockerTabs"></div>
  <div class="grid" id="lockerGrid"></div>
  <button class="btn small" id="lockerBack">← Back</button>
</div>
<div id="toast" class="toast"></div>
<button id="muteBtn">Sound: On</button>
<button id="helpBtn" title="How to play">?</button>

<script src="buildable-renders.js"></script>
<script src="buildable-audio.js"></script>
<script>
// ============================================================================
//  FIXED ENGINE — never regenerated. A game = this engine + GAME_CONFIG (data).
//  Top-down "survivor": you only move; the hero auto-fires at the nearest foe.
//  Levels are RECIPES (difficulty knobs). The engine keeps foes slower than the
//  hero so kiting always works => a level can always be survived (it's fair).
// ============================================================================
const ART="https://www.buildablekids.com/api/story-library?img=character:";
const GAME_CONFIG = window.GAME_CONFIG || {
  name: "Space Sparkles",
  theme: "space", artStyle: "modern3d",
  bgImg: "chess-art/space_bg.png",                 // polished space backdrop
  musicUrl: "game-music/music_space.mp3",          // looping space music
  heroUrl: ART+"robot&style=modern3d&emo=happy",   // Bolt the Robot (drawn astronaut if it can't load)
  palette: { hero:"#eaf2ff", visor:"#62d0ff", spark:"#ffe27a", gem:"#6ff0ff", hp:"#ff7aa8", xp:"#7ad0ff", boss:"#c69bff" },
  // base hero stats (level-ups stack on top of these during a run)
  hero: { speed:2.7, hearts:4, fireCd:23, projSpeed:7.0, projDmg:1, projR:0, projPerShot:1, pierce:0, pickupR:115 },
  // each level = a recipe. Survive its time, then beat the boss to win the level.
  // bossChar = which library character is that level's boss (real art, drawn fallback).
  levels: [
    { name:"Comet Meadow",   dur:28, spawnEvery:46, maxAlive:8,  eSpeed:1.30, eHp:2, eDmg:1, colors:["#7ee0a0","#8fd0ff"],                     boss:{ hp:26,  spd:1.05, dmg:1 }, bossChar:"dragon"  },
    { name:"Nebula Drift",   dur:34, spawnEvery:40, maxAlive:11, eSpeed:1.45, eHp:3, eDmg:1, colors:["#ffd27a","#ff9ec4","#8fd0ff"],          boss:{ hp:42,  spd:1.15, dmg:1 }, bossChar:"tiger"   },
    { name:"Asteroid Twirl", dur:40, spawnEvery:36, maxAlive:13, eSpeed:1.55, eHp:4, eDmg:1, colors:["#a99cff","#7ee0a0","#ff9ec4"],          boss:{ hp:60,  spd:1.22, dmg:1 }, bossChar:"bear"    },
    { name:"Stardust Caves", dur:44, spawnEvery:34, maxAlive:14, eSpeed:1.62, eHp:4, eDmg:1, colors:["#8fd0ff","#a99cff","#ffd27a"],          boss:{ hp:74,  spd:1.26, dmg:1 }, bossChar:"unicorn" },
    { name:"Rocket Rapids",  dur:48, spawnEvery:32, maxAlive:15, eSpeed:1.68, eHp:5, eDmg:1, colors:["#ff9ec4","#7ee0a0","#8fd0ff"],          boss:{ hp:86,  spd:1.30, dmg:1 }, bossChar:"wizard"  },
    { name:"Galaxy Finale",  dur:52, spawnEvery:30, maxAlive:16, eSpeed:1.74, eHp:5, eDmg:1, colors:["#ff9ec4","#a99cff","#ffd27a","#8fd0ff"], boss:{ hp:104, spd:1.34, dmg:1 }, bossChar:"dragon"  },
  ],
  // power-ups offered when the hero levels up (engine offers 3 random each time)
  powerups: ["fast","multi","big","pierce","orbit","nova","frost","homing","swift","magnet","heal","regen","shield"],
};
const START_NEED=8, NEED_GROW=1.55;   // first power-up after 8 gems, then ramps up (slower cadence)

const W=900, H=600;
const PAD=26;                         // wall padding so the hero never hides off-screen
const c=document.getElementById('c'), ctx=c.getContext('2d');
const P=GAME_CONFIG.palette;
const BASE=GAME_CONFIG.hero;
// shared, reusable drawing library (all renders live here, not inline)
const BR=(typeof window!=="undefined"&&window.BuildableRenders)||(typeof globalThis!=="undefined"&&globalThis.BuildableRenders);

// shared audio library (synth SFX + space music); safe if missing (node QA)
const BA=(typeof window!=="undefined"&&window.BuildableAudio)||(typeof globalThis!=="undefined"&&globalThis.BuildableAudio);
function sfx(n,o){ if(BA)BA.sfx(n,o); }
// art: hero, background, per-level boss character — all transparent library cut-outs
function mkImg(src){ const im=(typeof Image!=="undefined")?new Image():{}; try{ im.crossOrigin="anonymous"; }catch(e){} if(src&&"src" in im) im.src=src; return im; }
const heroImg=mkImg(GAME_CONFIG.heroUrl);
const bgImg=mkImg(GAME_CONFIG.bgImg);
const charCache={};
function charImg(slug,emo){ const k=slug+":"+emo; if(!charCache[k]) charCache[k]=mkImg(ART+slug+"&style="+(GAME_CONFIG.artStyle||"modern3d")+"&emo="+emo); return charCache[k]; }
let bossImg=null;

// deterministic RNG so spawns are reproducible (and QA-able)
function mulberry(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function dist2(ax,ay,bx,by){const dx=ax-bx,dy=ay-by;return dx*dx+dy*dy;}

// power-up catalogue
const PU={
  fast:  { name:"Faster Sparkles", apply:s=>{ s.fireCd=Math.max(13, s.fireCd*0.88); } },
  multi: { name:"Extra Sparkle",   apply:s=>{ s.projPerShot+=1; } },
  big:   { name:"Bigger Sparkles", apply:s=>{ s.projDmg+=1; s.projR+=2; } },
  pierce:{ name:"Piercing Sparkles",apply:s=>{ s.pierce+=1; } },
  orbit: { name:"Spinny Star",     apply:s=>{ s.orbit=(s.orbit||0)+1; } },
  nova:  { name:"Star Nova",       apply:s=>{ s.nova=(s.nova||0)+1; } },        // AoE shockwave on a timer
  frost: { name:"Frost Shot",      apply:s=>{ s.frost=(s.frost||0)+1; } },      // shots slow the slimes they hit
  homing:{ name:"Homing Sparkles", apply:s=>{ s.homing=(s.homing||0)+1; } },    // shots curve toward foes
  swift: { name:"Speedy Boots",    apply:s=>{ s.speed+=0.35; } },
  magnet:{ name:"Gem Magnet",      apply:s=>{ s.pickupR+=50; } },
  heal:  { name:"Heart",           apply:(s,g)=>{ if(g.hearts<g.maxHearts) g.hearts++; else s.shield=true; } },
  regen: { name:"Slow Heal",       apply:s=>{ s.regen = (s.regen>=1e9) ? 600 : Math.max(240, s.regen-180); } },
  shield:{ name:"Bubble Shield",   apply:s=>{ s.shield=true; } },
};
const BOT_PREF=["nova","fast","big","homing","multi","frost","pierce","orbit","swift","heal","regen","shield","magnet"];  // QA bot's pick order

// ---- game state ----
let level, L, stats, hero, enemies, projs, gems, parts, stars;
let state, started, botMode=false;
let levelFrame, levelDur, spawnTimer, spawnRng, offerRng, spawnCount;
let xp, plvl, xpNeed, invuln, boss, bossSpawned, choices=[];
let inputDir={x:0,y:0}, orbAngle=0, regenTimer=0;
let runGems=0, runLevelsCleared=0, lockerTab="weapon", novaTimer=0, rings=[], helpOpen=false;

function makeStars(){ const r=mulberry(9999); stars=[]; for(let i=0;i<90;i++) stars.push({x:r()*W,y:r()*H,s:0.6+r()*1.8,ph:r()*6.28,sp:0.5+r()*1.5}); }
makeStars();

function freshStats(){ return { speed:BASE.speed, fireCd:BASE.fireCd, projSpeed:BASE.projSpeed, projDmg:BASE.projDmg, projR:BASE.projR, projPerShot:BASE.projPerShot, pierce:BASE.pierce, pickupR:BASE.pickupR, shield:false, orbit:0, regen:1e9, nova:0, frost:0, homing:0 }; }

// ===== Collectible gear (data). Change names/costs/boosts freely — no code edits. =====
// boost keys: projDmg, projPerShot, pierce, fire(=lower cooldown), speed, pickupR, hearts, shield
const GEAR = {
  weapon: [
    { id:"wand",  name:"Star Wand",     cost:0,   desc:"Your trusty starter wand",      boost:{} },
    { id:"twin",  name:"Twin Wand",     cost:40,  desc:"Throws one extra sparkle",      boost:{projPerShot:1} },
    { id:"bow",   name:"Comet Bow",     cost:90,  desc:"Stronger, pierces a slime",     boost:{projDmg:1, pierce:1} },
    { id:"nova",  name:"Nova Staff",    cost:160, desc:"Bigger and faster sparkles",    boost:{projDmg:1, fire:4} },
  ],
  armor: [
    { id:"suit",  name:"Play Suit",     cost:0,   desc:"Comfy starter suit",            boost:{} },
    { id:"vest",  name:"Bubble Vest",   cost:50,  desc:"+1 heart",                      boost:{hearts:1} },
    { id:"star",  name:"Star Armor",    cost:110, desc:"+2 hearts",                     boost:{hearts:2} },
    { id:"shell", name:"Guardian Shell",cost:180, desc:"+2 hearts & start with a shield",boost:{hearts:2, shield:true} },
  ],
  boots: [
    { id:"sneak", name:"Sneakers",      cost:0,   desc:"Everyday shoes",                boost:{} },
    { id:"jet",   name:"Jet Boots",     cost:45,  desc:"Move a little faster",          boost:{speed:0.3} },
    { id:"rocket",name:"Rocket Boots",  cost:120, desc:"Move a lot faster",             boost:{speed:0.6} },
  ],
  hero: [
    { id:"astro", name:"Astro",         cost:0,   desc:"The classic astronaut",         boost:{} },
    { id:"foxy",  name:"Cosmo Fox",     cost:140, desc:"Scoops gems from farther away", boost:{pickupR:35} },
    { id:"sparky",name:"Sparky",        cost:200, desc:"Sparkles fire a touch faster",  boost:{fire:2} },
  ],
};
const SLOTS=["weapon","armor","boots","hero"];

// ===== Character (saved): coins, owned + equipped gear, stats =====
let CHAR=null;
function defaultChar(){ return { coins:0, bestLevel:0, unlocked:0, totalRuns:0, totalWins:0, totalGems:0,
  owned:{ weapon:["wand"], armor:["suit"], boots:["sneak"], hero:["astro"] },
  equipped:{ weapon:"wand", armor:"suit", boots:"sneak", hero:"astro" } }; }
function mergeChar(d){ const c=defaultChar(); if(!d||typeof d!=="object")return c;
  c.coins=d.coins||0; c.bestLevel=d.bestLevel||0; c.unlocked=Math.max(c.unlocked||0, d.unlocked||0); c.totalRuns=d.totalRuns||0; c.totalWins=d.totalWins||0; c.totalGems=d.totalGems||0;
  for(const s of SLOTS){ if(d.owned&&Array.isArray(d.owned[s]))c.owned[s]=Array.from(new Set(c.owned[s].concat(d.owned[s]))); if(d.equipped&&d.equipped[s])c.equipped[s]=d.equipped[s]; }
  return c; }
function activeKidId(){ try{ const k=JSON.parse(localStorage.getItem("bk_active_kid_v1")||"null"); return k&&k.id?k.id:null; }catch{ return null; } }
function charLSKey(){ const k=activeKidId(); return "bk_survival_char"+(k?("_"+k):""); }
function localLoadChar(){ try{ const s=localStorage.getItem(charLSKey()); return s?mergeChar(JSON.parse(s)):null; }catch{ return null; } }
function localSaveChar(){ try{ localStorage.setItem(charLSKey(), JSON.stringify(CHAR)); }catch{} }
function saveChar(){ localSaveChar(); const kid=activeKidId(); if(kid && typeof fetch!=="undefined"){ try{ fetch("/api/save-character",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({kidProfileId:kid,data:CHAR})}).catch(()=>{}); }catch{} } }
async function loadChar(){ CHAR=localLoadChar()||defaultChar();
  const kid=activeKidId();
  if(kid && typeof fetch!=="undefined"){ try{ const r=await fetch("/api/get-character?kidProfileId="+encodeURIComponent(kid)); const j=await r.json(); if(j&&j.ok&&j.data){ CHAR=mergeChar(j.data); localSaveChar(); } }catch{} }
  refreshMenu(); }

// equipped gear permanently boosts the run's starting stats (called on a fresh run)
function applyGear(s){ BASE._bonusHearts=0; if(!CHAR)return; const eq=CHAR.equipped||{};
  for(const slot of SLOTS){ const item=(GEAR[slot]||[]).find(x=>x.id===eq[slot]); if(!item||!item.boost)continue; const b=item.boost;
    if(b.projDmg)s.projDmg+=b.projDmg; if(b.projPerShot)s.projPerShot+=b.projPerShot; if(b.pierce)s.pierce+=b.pierce;
    if(b.fire)s.fireCd=Math.max(6,s.fireCd-b.fire); if(b.speed)s.speed+=b.speed; if(b.pickupR)s.pickupR+=b.pickupR;
    if(b.shield)s.shield=true; if(b.hearts)BASE._bonusHearts+=b.hearts; } }

// carry=true keeps your upgrades & hearts into the next level; false = brand-new run
function startLevel(i, carry){
  level=Math.max(0,Math.min(GAME_CONFIG.levels.length-1,i)); L=GAME_CONFIG.levels[level];
  bossImg = L.bossChar ? charImg(L.bossChar,"angry") : null;   // start loading this level's boss art
  const prevHearts = hero?hero.hearts:BASE.hearts;
  if(!carry || !stats){ stats=freshStats(); applyGear(stats); xp=0; plvl=1; xpNeed=START_NEED;
    // catch-up: starting a later level on its own grants the progress you'd have by then, so a retry is fair
    const grants=level*2, cyc=["fast","big","multi","fast","big","swift"];
    for(let k=0;k<grants;k++){ PU[cyc[k%cyc.length]].apply(stats,{hearts:BASE.hearts,maxHearts:BASE.hearts}); plvl++; } }
  const maxH=BASE.hearts+(BASE._bonusHearts||0);
  hero={ x:W/2, y:H/2, r:16, hearts:(carry?Math.min(maxH,prevHearts+1):maxH), maxHearts:maxH, cd:0, aim:0, vx:0, vy:0 };
  enemies=[]; projs=[]; gems=[]; parts=[]; rings=[];
  levelFrame=0; levelDur=Math.round((L.dur||30)*60); spawnTimer=0; spawnCount=0; orbAngle=0; regenTimer=0; novaTimer=0;
  spawnRng=mulberry(1234+level*101); offerRng=mulberry(5678+level*211);
  invuln=0; boss=null; bossSpawned=false; choices=[];
  state="play"; inputDir={x:0,y:0};
}
hero=null; stats=null; startLevel(0,false); state="title";

// ---------- input ----------
let joyOn=false, joyOx=0, joyOy=0;
function pickByIndex(k){ if(state==="choose" && k>=0 && k<choices.length){ applyChoice(choices[k]); } }
function setDirFromKeys(){ /* keyboard handled below via held set */ }
const held={};
addEventListener('keydown',e=>{
  if(e.key==='b'){ botMode=!botMode; started=true; if(state==="title") state="play"; return; }
  if(state==="title"){ if(typeof startRun==="function")startRun(); else {state="play";started=true;} return; }
  if(state==="choose"){ if(e.key==='1')pickByIndex(0); if(e.key==='2')pickByIndex(1); if(e.key==='3')pickByIndex(2); return; }
  if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","w","a","s","d","W","A","S","D"].includes(e.key)){ held[e.key.toLowerCase().replace("arrow","")]=true; e.preventDefault(); started=true; }
});
addEventListener('keyup',e=>{ held[e.key.toLowerCase().replace("arrow","")]=false; });
function readKeys(){ let x=0,y=0; if(held.left||held.a)x-=1; if(held.right||held.d)x+=1; if(held.up||held.w)y-=1; if(held.down||held.s)y+=1; if(x||y){const m=Math.hypot(x,y);inputDir={x:x/m,y:y/m};} else if(!joyOn) inputDir={x:0,y:0}; }

function canvasPt(e){ const r=c.getBoundingClientRect(); return { x:(e.clientX-r.left)*(W/r.width), y:(e.clientY-r.top)*(H/r.height) }; }
c.addEventListener('pointerdown',e=>{ e.preventDefault(); if(BA)BA.unlock(); if(helpOpen){ helpOpen=false; return; } const p=canvasPt(e);
  if(state==="title"){ return; }   // the DOM menu handles starting a run
  if(state==="win"){ runLevelsCleared++; if(level<GAME_CONFIG.levels.length-1){ startLevel(level+1, true); started=false; } else { endRun(true); } return; }
  if(state==="lose"){ endRun(false); return; }
  if(state==="choose"){ for(let k=0;k<choices.length;k++){ const cr=cardRect(k); if(p.x>=cr.x&&p.x<=cr.x+cr.w&&p.y>=cr.y&&p.y<=cr.y+cr.h){ pickByIndex(k); return; } } return; }
  joyOn=true; joyOx=p.x; joyOy=p.y; started=true; inputDir={x:0,y:0};
});
c.addEventListener('pointermove',e=>{ if(!joyOn)return; const p=canvasPt(e); let dx=p.x-joyOx, dy=p.y-joyOy; const m=Math.hypot(dx,dy); if(m>6){ inputDir={x:dx/m,y:dy/m}; } else inputDir={x:0,y:0}; });
function endJoy(){ joyOn=false; inputDir={x:0,y:0}; }
c.addEventListener('pointerup',endJoy); c.addEventListener('pointercancel',endJoy);

// ---------- level-up ----------
function offerChoices(){ const pool=(GAME_CONFIG.powerups||Object.keys(PU)).slice(); const out=[]; while(out.length<3 && pool.length){ const k=Math.floor(offerRng()*pool.length); out.push(pool.splice(k,1)[0]); } choices=out; state="choose"; sfx("levelup"); }
function applyChoice(id){ const p=PU[id]; if(p) p.apply(stats,hero); choices=[]; state="play"; }
function gainXp(v){ xp+=v; while(xp>=xpNeed){ xp-=xpNeed; plvl++; xpNeed=Math.ceil(xpNeed*NEED_GROW); offerChoices(); } }

// ---------- combat ----------
function nearestEnemy(){ let best=null,bd=1e9; const all=boss?enemies.concat([boss]):enemies; for(const e of all){ const d=dist2(hero.x,hero.y,e.x,e.y); if(d<bd){bd=d;best=e;} } return best; }
function fire(){ const tgt=nearestEnemy(); if(!tgt)return; const base=Math.atan2(tgt.y-hero.y,tgt.x-hero.x); hero.aim=base;
  const n=stats.projPerShot, spread=0.26; const start=base-(n-1)*spread/2;
  for(let i=0;i<n;i++){ const a=n===1?base:start+i*spread; projs.push({ x:hero.x,y:hero.y, vx:Math.cos(a)*stats.projSpeed, vy:Math.sin(a)*stats.projSpeed, life:70, dmg:stats.projDmg, r:7+stats.projR, pierce:stats.pierce, hit:new Set() }); } sfx("shoot"); }
function spawnEnemy(){ const r=spawnRng(); const edge=Math.floor(r*4); let x,y; const m=18;
  if(edge===0){x=-m;y=spawnRng()*H;} else if(edge===1){x=W+m;y=spawnRng()*H;} else if(edge===2){x=spawnRng()*W;y=-m;} else {x=spawnRng()*W;y=H+m;}
  const col=L.colors[Math.floor(spawnRng()*L.colors.length)];
  enemies.push({ x,y, r:15, hp:L.eHp, maxHp:L.eHp, spd:L.eSpeed, dmg:L.eDmg, val:L.eValue, col, wob:spawnRng()*6.28, boss:false, orbCd:0 }); }
function spawnBoss(){ const b=L.boss||{hp:30,spd:1.1,dmg:1}; boss={ x:W/2, y:-40, r:42, hp:b.hp, maxHp:b.hp, spd:b.spd, dmg:b.dmg, val:8, col:P.boss, wob:0, boss:true, orbCd:0 }; bossSpawned=true; sfx("boss"); }
function burst(x,y,col,n){ for(let i=0;i<n;i++){ const a=Math.random()*6.28,s=1+Math.random()*3; parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:18+Math.random()*12,col}); } }
function hurtHero(dmg){ if(invuln>0)return; if(stats.shield){ stats.shield=false; invuln=70; burst(hero.x,hero.y,P.visor,12); sfx("hurt"); return; } hero.hearts-=dmg; invuln=80; burst(hero.x,hero.y,P.hp,14); sfx("hurt"); if(hero.hearts<=0){ hero.hearts=0; state="lose"; sfx("lose"); } }

// ---------- bot (QA "good player": kite away from the swarm, keep firing) ----------
function botThink(){
  if(state==="choose"){ for(const pref of BOT_PREF){ if(choices.includes(pref)){ applyChoice(pref); return; } } applyChoice(choices[0]); return; }
  const all=boss?enemies.concat([boss]):enemies;
  // flee vector from the nearest few foes + a centre nudge so we never get cornered
  let fx=0,fy=0, near=all.slice().sort((p,q)=>dist2(hero.x,hero.y,p.x,p.y)-dist2(hero.x,hero.y,q.x,q.y)).slice(0,5);
  for(const e of near){ const dx=hero.x-e.x, dy=hero.y-e.y, d=Math.hypot(dx,dy)||1; fx+=dx/d/d*200; fy+=dy/d/d*200; }
  fx += (W/2-hero.x)*0.004; fy += (H/2-hero.y)*0.004;
  const threat = near.length ? Math.hypot(hero.x-near[0].x, hero.y-near[0].y) : 999;
  // nearest gem to vacuum up XP (a kiting hero that ignores gems never powers up)
  let g=null,gd=1e9; for(const k of gems){ if(k.got)continue; const d=dist2(hero.x,hero.y,k.x,k.y); if(d<gd){gd=d;g=k;} }
  let ax=fx, ay=fy;
  if(threat>95 && g){ const dx=g.x-hero.x, dy=g.y-hero.y, d=Math.hypot(dx,dy)||1; ax=dx/d*1.0 + fx*0.4; ay=dy/d*1.0 + fy*0.4; }   // safe-ish: grab gems
  const m=Math.hypot(ax,ay); inputDir = m>0.0001 ? {x:ax/m,y:ay/m} : {x:0,y:0};
}

// ---------- update (pure logic, no canvas — so QA can run it headless) ----------
function update(){
  if(state==="win"||state==="lose"||state==="title") return;
  if(botMode) botThink(); else readKeys();
  if(!started) return;
  if(state==="choose") return;     // action pauses while choosing a power-up
  if(helpOpen) return;             // paused while the how-to-play demo is open

  levelFrame++;
  // move hero
  hero.vx=inputDir.x*stats.speed; hero.vy=inputDir.y*stats.speed;
  hero.x=Math.max(PAD,Math.min(W-PAD,hero.x+hero.vx)); hero.y=Math.max(PAD,Math.min(H-PAD,hero.y+hero.vy));
  if(invuln>0)invuln--;
  // auto fire
  if(hero.cd>0)hero.cd--; if(hero.cd<=0){ fire(); hero.cd=stats.fireCd; }
  // spawn waves until the timer runs out, then the boss arrives
  if(levelFrame<levelDur){ spawnTimer--; if(spawnTimer<=0 && enemies.length<L.maxAlive){ spawnEnemy(); spawnCount++; spawnTimer=L.spawnEvery; } }
  else if(!bossSpawned){ spawnBoss(); }
  // enemies chase + separate a little so they don't all stack on the hero
  const all=boss?enemies.concat([boss]):enemies;
  for(const e of all){ if(e.slowT>0)e.slowT--; const sp=e.spd*(e.slowT>0?0.45:1); const dx=hero.x-e.x, dy=hero.y-e.y, d=Math.hypot(dx,dy)||1; e.x+=dx/d*sp; e.y+=dy/d*sp; e.wob+=0.15;
    for(const o of enemies){ if(o===e)continue; const ox=e.x-o.x, oy=e.y-o.y, od=Math.hypot(ox,oy); if(od>0 && od<e.r+o.r){ e.x+=ox/od*0.6; e.y+=oy/od*0.6; } }
    if(d<e.r+hero.r){ hurtHero(e.dmg); const k=e.boss?6:10; e.x-=dx/d*k; e.y-=dy/d*k; }
  }
  // projectiles
  for(const p of projs){
    if(stats.homing){ let tg=null,td=1e9; for(const e of all){ const dd=dist2(p.x,p.y,e.x,e.y); if(dd<td){td=dd;tg=e;} }
      if(tg){ const ang=Math.atan2(tg.y-p.y,tg.x-p.x), cur=Math.atan2(p.vy,p.vx); let diff=ang-cur; while(diff>Math.PI)diff-=6.283; while(diff<-Math.PI)diff+=6.283; const na=cur+diff*Math.min(0.28,stats.homing*0.09), sp=Math.hypot(p.vx,p.vy); p.vx=Math.cos(na)*sp; p.vy=Math.sin(na)*sp; } }
    p.x+=p.vx; p.y+=p.vy; p.life--;
    for(const e of all){ if(p.hit.has(e))continue; if(dist2(p.x,p.y,e.x,e.y) < (p.r+e.r)*(p.r+e.r)){ e.hp-=p.dmg; p.hit.add(e); burst(p.x,p.y,e.col,4);
      if(stats.frost) e.slowT=Math.max(e.slowT||0, 60+stats.frost*30);
      if(p.pierce>0)p.pierce--; else p.life=0;
      if(e.hp<=0){ killEnemy(e); }
      break; } }
  }
  projs=projs.filter(p=>p.life>0 && p.x>-20&&p.x<W+20&&p.y>-20&&p.y<H+20);
  // Star Nova: periodic shockwave that damages everything nearby
  if(stats.nova>0){ const cd=Math.max(80,240-stats.nova*38); novaTimer++;
    if(novaTimer>=cd){ novaTimer=0; const nr=80+stats.nova*20, nd=1+Math.floor((stats.nova-1)/2); rings.push({x:hero.x,y:hero.y,r:12,max:nr,life:22});
      const all2=boss?enemies.concat([boss]):enemies; for(const e of all2){ if(dist2(hero.x,hero.y,e.x,e.y)<nr*nr){ e.hp-=nd; burst(e.x,e.y,P.spark,4); if(stats.frost)e.slowT=Math.max(e.slowT||0,60); if(e.hp<=0)killEnemy(e); } } } }
  for(const rg of rings){ rg.r+=(rg.max-rg.r)*0.25; rg.life--; } rings=rings.filter(rg=>rg.life>0);
  // orbiting helper stars (a passive spinning weapon)
  if(stats.orbit>0){ orbAngle+=0.07; const OR=54, all2=boss?enemies.concat([boss]):enemies;
    for(const e of all2){ if(e.orbCd>0)e.orbCd--; }
    for(let k=0;k<stats.orbit;k++){ const a=orbAngle+k*6.28/stats.orbit, ox=hero.x+Math.cos(a)*OR, oy=hero.y+Math.sin(a)*OR;
      for(const e of all2){ if(e.orbCd>0)continue; if(dist2(ox,oy,e.x,e.y)<(12+e.r)*(12+e.r)){ e.hp-=1; e.orbCd=16; burst(ox,oy,P.spark,4); if(e.hp<=0)killEnemy(e); } } } }
  // slow heal over time (regen power-up)
  if(stats.regen<1e9){ regenTimer++; if(regenTimer>=stats.regen){ regenTimer=0; if(hero.hearts<hero.maxHearts){ hero.hearts++; burst(hero.x,hero.y,P.hp,8); } } }
  // gems drift to hero within pickup range, collected when close
  for(const g of gems){ if(g.got)continue; const dx=hero.x-g.x, dy=hero.y-g.y, d=Math.hypot(dx,dy)||1;
    if(d<stats.pickupR){ g.x+=dx/d*Math.min(6,d*0.25); g.y+=dy/d*Math.min(6,d*0.25); }
    else { g.x+=g.vx; g.y+=g.vy; g.vx*=0.9; g.vy*=0.9; }
    if(d<hero.r+6){ g.got=true; runGems+=g.val; gainXp(g.val); sfx("coin",{tier:g.tier}); } }
  gems=gems.filter(g=>!g.got);
  // particles
  for(const pt of parts){ pt.x+=pt.vx; pt.y+=pt.vy; pt.vx*=0.92; pt.vy*=0.92; pt.life--; }
  parts=parts.filter(pt=>pt.life>0);
  // win when the boss is beaten (boss only appears after surviving the timer).
  // Beating the boss is the gate: it permanently unlocks the next level.
  if(bossSpawned && !boss){ state="win"; sfx("win");
    if(CHAR){ const u=Math.min(GAME_CONFIG.levels.length-1, level+1); if(u>(CHAR.unlocked||0)){ CHAR.unlocked=u; saveChar(); } } }
}
// coin tiers: 1 (=1, common) · 2 (=5, rare) · 3 (=10, boss/lucky). Higher levels drop a bit more.
function rollTier(){ const r=Math.random()-level*0.012; if(r>0.965) return 3; if(r>0.80) return 2; return 1; }
function tierVal(t){ return t===3?10:t===2?5:1; }
function dropCoin(x,y,tier){ const t=tier||rollTier(); gems.push({ x,y, tier:t, val:tierVal(t), vx:(Math.random()-0.5)*2, vy:(Math.random()-0.5)*2, got:false }); }
function killEnemy(e){ burst(e.x,e.y,e.col,e.boss?26:10);
  if(e.boss){ for(let i=0;i<3;i++) dropCoin(e.x+(Math.random()-0.5)*46, e.y+(Math.random()-0.5)*46, 3); boss=null; }
  else { dropCoin(e.x,e.y); const i=enemies.indexOf(e); if(i>=0)enemies.splice(i,1); } }

// ---------- draw ----------
// thin wrappers → the shared renders library (BuildableRenders)
function rrect(x,y,w,h,r){ BR.rrect(ctx,x,y,w,h,r); }
function spark(x,y,r,rot){ BR.sparkle(ctx,x,y,r,rot); }
function heart(x,y,s){ BR.heart(ctx,x,y,s); }
function blob(x,y,r,col,wob,boss){ BR.enemy(ctx,x,y,r,col,wob,boss); }
function drawHero(){ const usingArt=GAME_CONFIG.heroUrl && heroImg.complete && heroImg.naturalWidth;
  BR.hero(ctx, hero.x, hero.y, { img: usingArt?heroImg:null, palette:P, aim:hero.aim,
    blink:(invuln>0 && Math.floor(invuln/5)%2===0), shield:stats.shield }); }
function cardRect(k){ const w=200,h=240,gap=24, total=3*w+2*gap, x0=(W-total)/2; return { x:x0+k*(w+gap), y:H/2-h/2, w, h }; }
function drawPUicon(id,x,y){ BR.puIcon(ctx,id,x,y,P); }
function banner(t,s){ ctx.fillStyle="rgba(5,8,24,.6)";ctx.fillRect(0,0,W,H); ctx.textAlign="center"; ctx.fillStyle="#fff";ctx.font="bold 46px Fredoka,sans-serif";ctx.fillText(t,W/2,H/2-8); ctx.font="22px Fredoka,sans-serif";ctx.fillText(s,W/2,H/2+34); }
// wordless how-to-play demo (for kids who can't read): animated hand dragging,
// hero following, plus three picture cues, and a pulsing PLAY button.
function drawTutorial(){
  const tt=Date.now()/1000;
  ctx.fillStyle="rgba(5,8,24,.80)"; ctx.fillRect(0,0,W,H);
  // --- big demo: a finger slides side to side, the hero follows it ---
  const cx=W/2, cy=H*0.34, swing=Math.sin(tt*1.5)*120;
  ctx.strokeStyle="rgba(255,255,255,.22)"; ctx.lineWidth=4; ctx.setLineDash([10,12]);
  ctx.beginPath(); ctx.moveTo(cx-130,cy+34); ctx.lineTo(cx+130,cy+34); ctx.stroke(); ctx.setLineDash([]);
  // little arrows at each end
  ctx.fillStyle="rgba(255,255,255,.5)";
  ctx.beginPath();ctx.moveTo(cx-150,cy+34);ctx.lineTo(cx-132,cy+24);ctx.lineTo(cx-132,cy+44);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(cx+150,cy+34);ctx.lineTo(cx+132,cy+24);ctx.lineTo(cx+132,cy+44);ctx.closePath();ctx.fill();
  const heroFollow=cx+Math.sin((tt-0.22)*1.5)*120;
  BR.hero(ctx, heroFollow, cy+34, { palette:P, aim:0 });
  BR.hand(ctx, cx+swing, cy+70, 1.35);
  // --- three picture cues along the bottom ---
  const by=H*0.72, gap=235, xs=[W/2-gap, W/2, W/2+gap];
  for(const x of xs){ ctx.fillStyle="rgba(27,35,80,.9)"; rrect(x-95,by-70,190,150,20); ctx.fill(); ctx.strokeStyle="rgba(255,255,255,.15)";ctx.lineWidth=2; rrect(x-95,by-70,190,150,20); ctx.stroke(); }
  // cue 1: drag to move (hand + arrows)
  BR.hand(ctx, xs[0], by-26, 1.0);
  ctx.fillStyle="rgba(255,255,255,.7)"; ctx.beginPath();ctx.moveTo(xs[0]-58,by+40);ctx.lineTo(xs[0]-40,by+30);ctx.lineTo(xs[0]-40,by+50);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(xs[0]+58,by+40);ctx.lineTo(xs[0]+40,by+30);ctx.lineTo(xs[0]+40,by+50);ctx.closePath();ctx.fill();
  // cue 2: hero auto-zaps slimes (hero -> sparkle -> slime)
  BR.hero(ctx, xs[1]-44, by-4, { palette:P, aim:0 });
  BR.projectile(ctx, xs[1]+2+Math.sin(tt*6)*6, by-10, 8, P.spark);
  BR.enemy(ctx, xs[1]+52, by-6, 16, "#7ee0a0", tt*3, false);
  // cue 3: collect coins (three glowing coins)
  BR.coin(ctx, xs[2]-40, by-6, tt, 1, 1); BR.coin(ctx, xs[2], by-10, tt, 2, 5); BR.coin(ctx, xs[2]+42, by-4, tt, 3, 10);
  // --- pulsing PLAY button (universal, no words) ---
  const pr=34+Math.sin(tt*3)*3, py=H-70;
  ctx.fillStyle="rgba(122,208,255,.25)"; ctx.beginPath();ctx.arc(W/2,py,pr+10,0,7);ctx.fill();
  ctx.fillStyle="#7ad0ff"; ctx.beginPath();ctx.arc(W/2,py,pr,0,7);ctx.fill();
  ctx.fillStyle="#0b1230"; ctx.beginPath();ctx.moveTo(W/2-10,py-15);ctx.lineTo(W/2+16,py);ctx.lineTo(W/2-10,py+15);ctx.closePath();ctx.fill();
}
function draw(){
  const t=Date.now()/1000;
  // background: real space art if loaded (with light twinkle + vignette), else drawn
  if(bgImg && (bgImg.complete||bgImg.width) && (bgImg.naturalWidth||bgImg.width)){
    BR.bgImage(ctx,bgImg,W,H);
    for(const st of stars){ if(st.s<1.4)continue; const a=0.3*Math.abs(Math.sin(t*st.sp+st.ph)); ctx.fillStyle="rgba(255,255,255,"+a.toFixed(2)+")"; ctx.beginPath();ctx.arc(st.x,st.y,st.s*0.8,0,7);ctx.fill(); }
    const v=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.38,W/2,H/2,Math.max(W,H)*0.72); v.addColorStop(0,"rgba(0,0,0,0)"); v.addColorStop(1,"rgba(0,0,0,0.40)"); ctx.fillStyle=v; ctx.fillRect(0,0,W,H);
  } else { BR.background(ctx, W, H, stars, t, GAME_CONFIG.theme); }
  // coins (glowing, tiered)
  for(const g of gems) BR.coin(ctx,g.x,g.y,t,g.tier,g.val);
  // nova shockwave rings
  for(const rg of rings){ const a=Math.min(0.55,rg.life/22*0.55); ctx.strokeStyle="rgba(255,226,122,"+a.toFixed(2)+")"; ctx.lineWidth=5; ctx.beginPath(); ctx.arc(rg.x,rg.y,rg.r,0,7); ctx.stroke(); }
  // enemies + boss
  for(const e of enemies){ blob(e.x,e.y,e.r,e.col,e.wob,false); if(e.slowT>0){ ctx.strokeStyle="rgba(150,220,255,.65)";ctx.lineWidth=2;ctx.beginPath();ctx.arc(e.x,e.y,e.r+3,0,7);ctx.stroke(); } }
  if(boss){ const useArt=bossImg && (bossImg.naturalWidth||bossImg.width);
    if(useArt){ BR.sprite(ctx,bossImg,boss.x,boss.y,boss.r*2.5,{shadow:true,glow:"rgba(198,155,255,0.4)"}); }
    else blob(boss.x,boss.y,boss.r,boss.col,Date.now()/300,true);
    const bw=180; ctx.fillStyle="rgba(0,0,0,.35)";rrect(W/2-bw/2,14,bw,11,6);ctx.fill(); ctx.fillStyle=P.boss;rrect(W/2-bw/2,14,bw*Math.max(0,boss.hp/boss.maxHp),11,6);ctx.fill(); ctx.fillStyle="#fff";ctx.font="bold 13px Fredoka,sans-serif";ctx.textAlign="center";ctx.fillText((L.bossChar?L.bossChar.toUpperCase():"BOSS"),W/2,33); }
  // projectiles (twinkly sparkles)
  for(const p of projs) BR.projectile(ctx,p.x,p.y,p.r,P.spark);
  // particles
  for(const pt of parts) BR.particle(ctx,pt);
  // hero
  drawHero();
  // orbiting helper stars
  if(stats.orbit>0){ for(let k=0;k<stats.orbit;k++){ const a=orbAngle+k*6.28/stats.orbit, ox=hero.x+Math.cos(a)*54, oy=hero.y+Math.sin(a)*54; BR.orbiter(ctx,ox,oy,P.spark); } }
  // joystick ring
  if(joyOn){ ctx.strokeStyle="rgba(255,255,255,.25)";ctx.lineWidth=3;ctx.beginPath();ctx.arc(joyOx,joyOy,34,0,7);ctx.stroke(); ctx.fillStyle="rgba(255,255,255,.3)";ctx.beginPath();ctx.arc(joyOx+inputDir.x*26,joyOy+inputDir.y*26,14,0,7);ctx.fill(); }
  // HUD
  ctx.fillStyle="#fff"; ctx.textAlign="left"; ctx.font="bold 22px Fredoka,sans-serif";
  ctx.fillText(L.name+"   Lv "+(level+1)+"/"+GAME_CONFIG.levels.length, 18, 32);
  for(let i=0;i<hero.maxHearts;i++){ const hx=W-28-i*30, hy=20; ctx.fillStyle=(i<hero.hearts)?P.hp:"rgba(255,255,255,.18)"; heart(hx,hy,10); }
  // xp bar + hero level
  ctx.fillStyle="rgba(255,255,255,.2)"; rrect(18,H-26,W-36,10,5);ctx.fill(); ctx.fillStyle=P.xp; rrect(18,H-26,(W-36)*Math.min(1,xp/xpNeed),10,5);ctx.fill();
  ctx.fillStyle="#fff";ctx.font="bold 16px Fredoka,sans-serif";ctx.textAlign="left";ctx.fillText("Power Lv "+plvl,18,H-34);
  // wave/boss timer
  ctx.textAlign="right"; ctx.fillStyle="#cdd6ff"; ctx.font="bold 18px Fredoka,sans-serif";
  ctx.fillText(bossSpawned?"BOSS!":("Boss in "+Math.ceil((levelDur-levelFrame)/60)+"s"), W-18, H-34);
  // overlays
  if(state==="choose"){ ctx.fillStyle="rgba(5,8,24,.72)";ctx.fillRect(0,0,W,H); ctx.fillStyle="#fff";ctx.textAlign="center";ctx.font="bold 34px Fredoka,sans-serif";ctx.fillText("Power up! Pick one",W/2,H/2-160);
    for(let k=0;k<choices.length;k++){ const cr=cardRect(k), id=choices[k]; ctx.fillStyle="#1b2350";rrect(cr.x,cr.y,cr.w,cr.h,18);ctx.fill(); ctx.strokeStyle=P.xp;ctx.lineWidth=3;rrect(cr.x,cr.y,cr.w,cr.h,18);ctx.stroke();
      drawPUicon(id,cr.x+cr.w/2,cr.y+86); ctx.fillStyle="#fff";ctx.font="bold 22px Fredoka,sans-serif";ctx.fillText(PU[id].name,cr.x+cr.w/2,cr.y+cr.h-46); ctx.fillStyle="#9fb0ff";ctx.font="16px Fredoka,sans-serif";ctx.fillText("Tap to choose",cr.x+cr.w/2,cr.y+cr.h-22); } }
  if(state==="play" && (!started || helpOpen)) drawTutorial();
  if(state==="title"){ ctx.fillStyle="rgba(5,8,24,.55)";ctx.fillRect(0,0,W,H); ctx.fillStyle="#fff";ctx.textAlign="center";ctx.font="bold 44px Fredoka,sans-serif";ctx.fillText(GAME_CONFIG.name,W/2,H/2-10); ctx.font="22px Fredoka,sans-serif";ctx.fillText("Drag to move · Tap to start",W/2,H/2+30); }
  if(state==="win"){ banner(level<GAME_CONFIG.levels.length-1?"Boss beaten!":"You Win!", level<GAME_CONFIG.levels.length-1?"Next level unlocked — tap to go on":"Tap to collect your coins"); }
  if(state==="lose"){ banner("Oops! Out of hearts","Tap to collect your coins"); }
}

// ===== menus, locker, runs, coins (DOM — guarded so headless QA never touches it) =====
function el(id){ const e=document.getElementById(id); return (e&&e.style)?e:null; }
function show(id,on){ const e=el(id); if(e)e.classList[on?"add":"remove"]("show"); }
function toast(msg){ const e=el("toast"); if(!e)return; e.textContent=msg; e.style.display="block"; clearTimeout(toast._t); toast._t=setTimeout(()=>{e.style.display="none";},2600); }
function refreshMenu(){ const c=CHAR?CHAR.coins:0; const a=el("menuCoins"); if(a)a.textContent="★ "+c+" coins"; const b=el("lockerCoins"); if(b)b.textContent="★ "+c+" coins"; }
function showMenu(){ state="title"; show("locker",false); show("menu",true); showHelpBtn(false); refreshMenu(); renderLevels(); }
function renderLevels(){ const wrap=el("levelSelect"); if(!wrap||!CHAR)return; wrap.innerHTML="";
  const unlocked=CHAR.unlocked||0;
  GAME_CONFIG.levels.forEach((lv,i)=>{ const open=i<=unlocked;
    const card=document.createElement("div"); card.className="card"; card.style.width="150px";
    card.innerHTML='<div class="nm">Level '+(i+1)+'</div><div class="ds">'+lv.name+'</div>';
    const b=document.createElement("button"); b.className="btn small"+(open?"":" ");
    if(open){ b.textContent="Play"; b.onclick=()=>startRunAt(i); } else { b.textContent="Locked"; b.disabled=true; b.style.opacity=".45"; }
    card.appendChild(b); wrap.appendChild(card); });
}
function startRunAt(i){ if(BA)BA.unlock(); runGems=0; runLevelsCleared=0; stats=null; startLevel(i,false); state="play"; started=false; show("menu",false); show("locker",false); showHelpBtn(true); }
function startRun(){ startRunAt(Math.min((CHAR&&CHAR.unlocked)||0, GAME_CONFIG.levels.length-1)); }
function endRun(won){ if(!CHAR)CHAR=defaultChar();
  CHAR.totalRuns++; if(won)CHAR.totalWins++; CHAR.totalGems+=runGems; CHAR.bestLevel=Math.max(CHAR.bestLevel,runLevelsCleared);
  const reward=Math.round(runGems + runLevelsCleared*5 + (won?20:0)); CHAR.coins+=reward; saveChar();
  showMenu(); toast((won?"You won! ":"Good try! ")+"+"+reward+" coins"); }

const SLOT_LABEL={weapon:"Weapon",armor:"Armor",boots:"Boots",hero:"Hero"};
function gearIconSVG(slot,boost){ return BR.gearSVG(slot); }
function renderLocker(){ const tabs=el("lockerTabs"), grid=el("lockerGrid"); if(!tabs||!grid||!CHAR)return;
  tabs.innerHTML=""; for(const s of SLOTS){ const b=document.createElement("button"); b.className="tab"+(s===lockerTab?" on":""); b.textContent=SLOT_LABEL[s]; b.onclick=()=>{lockerTab=s;renderLocker();}; tabs.appendChild(b); }
  grid.innerHTML=""; for(const item of GEAR[lockerTab]){ const owned=CHAR.owned[lockerTab].includes(item.id); const eq=CHAR.equipped[lockerTab]===item.id;
    const card=document.createElement("div"); card.className="card"+(eq?" eq":"");
    card.innerHTML='<div class="ico">'+gearIconSVG(lockerTab,item.boost)+'</div><div class="nm">'+item.name+'</div><div class="ds">'+item.desc+'</div>';
    const btn=document.createElement("button"); btn.className="btn small"+(owned?"":" alt");
    if(eq){ btn.textContent="Equipped"; btn.disabled=true; btn.style.opacity=".6"; }
    else if(owned){ btn.textContent="Equip"; btn.onclick=()=>{ CHAR.equipped[lockerTab]=item.id; saveChar(); renderLocker(); }; }
    else { btn.textContent="Buy ★"+item.cost; btn.onclick=()=>{ if(CHAR.coins>=item.cost){ CHAR.coins-=item.cost; CHAR.owned[lockerTab].push(item.id); CHAR.equipped[lockerTab]=item.id; saveChar(); refreshMenu(); renderLocker(); } else { toast("Need ★"+(item.cost-CHAR.coins)+" more coins"); } }; }
    card.appendChild(btn); grid.appendChild(card); }
}
function showLocker(){ lockerTab="weapon"; show("menu",false); show("locker",true); showHelpBtn(false); refreshMenu(); renderLocker(); }

function wireMenus(){ const l=el("lockerBtn"), bk=el("lockerBack");
  if(l)l.onclick=showLocker; if(bk)bk.onclick=showMenu;
  const mt=el("menuTitle"); if(mt)mt.textContent=GAME_CONFIG.name;
  const mb=el("muteBtn"); if(mb){ const upd=()=>{ mb.textContent="Sound: "+(BA&&BA.muted?"Off":"On"); }; upd(); mb.onclick=()=>{ if(BA){ BA.unlock(); BA.toggleMute(); } upd(); }; }
  const hb=el("helpBtn"); if(hb)hb.onclick=()=>{ helpOpen=true; }; }
function showHelpBtn(on){ const hb=el("helpBtn"); if(hb)hb.style.display=on?"block":"none"; }

function frame(){ update(); draw(); requestAnimationFrame(frame); }
// boot: load the saved character, wire menus, show the main menu
if(typeof document!=="undefined" && document.getElementById("menu")){ if(BA)BA.setMusic(GAME_CONFIG.musicUrl); CHAR=localLoadChar()||defaultChar(); wireMenus(); showMenu(); loadChar(); }
requestAnimationFrame(frame);

// ---------- QA / picker hooks ----------
window.SURV_GAME = {
  startLevel:(i)=>{ startLevel(i); },
  setBot:(b)=>{ botMode=b; started=true; if(state==="title")state="play"; },
  state:()=>state,
  dbg:()=>({ level, frame:levelFrame, dur:levelDur, hp:hero.hearts, plvl, foes:enemies.length, boss:boss?Math.round(boss.hp):0, bossUp:bossSpawned, state }),
  // headless harness: run the bot through a level with no drawing, return the result
  sim:(idx, maxFrames)=>{ hero=null; stats=null; startLevel(idx,false); state="play"; botMode=true; started=true; let f=0; const cap=maxFrames||7000;
    while(state!=="win" && state!=="lose" && f<cap){ update(); f++; } return { level:idx, result:state, frames:f, powerLv:plvl, hpLeft:hero.hearts }; },
  // full adventure: start at level 1 and carry upgrades forward (the real player experience)
  campaign:(cap)=>{ hero=null; stats=null; startLevel(0,false); state="play"; botMode=true; started=true; const out=[]; cap=cap||8000;
    for(let lvl=0; lvl<GAME_CONFIG.levels.length; lvl++){ let f=0; while(state!=="win" && state!=="lose" && f<cap){ update(); f++; }
      out.push({ level:lvl+1, result:state, frames:f, powerLv:plvl, hpLeft:hero.hearts }); if(state==="lose")break;
      if(lvl<GAME_CONFIG.levels.length-1){ startLevel(lvl+1,true); state="play"; botMode=true; started=true; } }
    return out; },
  // gear/save debug hooks (used by qa.mjs)
  _char:()=>CHAR, _setChar:(c)=>{ CHAR=mergeChar(c); }, _equip:(slot,id)=>{ CHAR.equipped[slot]=id; },
  _gearTest:()=>{ const s=freshStats(); applyGear(s); return { dmg:s.projDmg, shots:s.projPerShot, pierce:s.pierce, fireCd:s.fireCd, speed:Math.round(s.speed*100)/100, pickupR:s.pickupR, shield:s.shield, bonusHearts:BASE._bonusHearts }; },
  // render debug hooks (used by qa-render.mjs)
  _begin:(i)=>{ if(!CHAR)CHAR=defaultChar(); stats=null; startLevel(i||0,false); state="play"; botMode=true; started=true; },
  _step:(n)=>{ for(let i=0;i<(n||1);i++) update(); }, _draw:()=>{ try{ draw(); return "ok"; }catch(e){ return "ERR: "+(e&&e.message||e); } },
};
</script>
