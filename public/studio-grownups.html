<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Grown-ups — Buildable Kids</title>
<link rel="icon" href="/favicon.ico?v=4" sizes="any" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=4" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=4" />
<meta name="theme-color" content="#14122b" />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#14122b; --card:#1d1b36; --line:rgba(255,255,255,.12); --accent:#9B7BFF; --dim:#B9AEEA; --good:#7EE0A0; }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--bg);color:#fff;font-family:'Nunito',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
  .bar{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
  .bar h1{font-size:16px;font-weight:900;margin:0;flex:1}
  main{width:100%;max-width:680px;margin:0 auto;padding:18px 16px 40px}
  h2{font-size:clamp(20px,5vw,26px);font-weight:900;margin:22px 0 4px}
  h3{font-size:17px;font-weight:900;margin:0 0 6px}
  p.sub{color:var(--dim);font-size:15px;line-height:1.5;margin:0 0 14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}
  .btn{font-family:inherit;font-weight:900;font-size:15px;color:#16142b;background:linear-gradient(160deg,#9B7BFF,#67E8F9);
    border:none;border-radius:14px;padding:12px 20px;cursor:pointer}
  .btn.alt{background:rgba(155,123,255,.16);color:#cdbcff}
  .btn.wide{width:100%;margin-top:8px}
  .btn:disabled{opacity:.45;cursor:default}
  .game{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
  .game:first-of-type{border-top:none}
  .game img{width:52px;height:52px;border-radius:12px;object-fit:cover;background:#2a2748;flex:none}
  .game .n{flex:1;min-width:0}
  .game .n b{display:block;font-size:15px;font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .game .n small{color:var(--dim);font-size:12.5px;font-weight:700}
  .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .toggle{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
  .toggle .t{flex:1}
  .toggle .t b{display:block;font-size:15px}
  .toggle .t small{color:var(--dim);font-size:12.5px;font-weight:700;line-height:1.4;display:block;margin-top:2px}
  .sw{width:52px;height:30px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.08);position:relative;cursor:pointer;flex:none}
  .sw i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#8f86bb;transition:all .16s}
  .sw.on{background:linear-gradient(160deg,#9B7BFF,#67E8F9);border-color:transparent}
  .sw.on i{left:25px;background:#16142b}
  input[type=text],input[type=number]{font-family:inherit;font-size:15px;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:#191733;color:#fff;width:100%}
  input[type=password]{font-family:inherit;font-size:20px;padding:13px 16px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:#fff;width:100%;max-width:240px;text-align:center;letter-spacing:6px;margin:12px 0}
  .note{color:var(--dim);font-size:13.5px;line-height:1.5;margin-top:10px}
  .err{color:#ff9a9a;font-size:14px;min-height:18px;margin-top:8px}
  .ok{color:var(--good)}
  .hide{display:none!important}
</style>
</head>
<body>
<div class="bar">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFD86B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M12 2.6l2.6 5.5 6 .8-4.4 4.2 1.1 6-5.3-2.9-5.3 2.9 1.1-6L3.4 8.9l6-.8z"/></svg>
  <h1>Grown-ups</h1>
  <a class="btn alt" href="/studio" style="text-decoration:none;padding:9px 14px;font-size:13px">Back to the studio</a>
</div>
<main id="main"><p class="sub">Loading…</p></main>
<script>
// ===========================================================================
//  /studio/grownups — THE GROWN-UP STUDIO (Session CB4).
//
//  Everything a child never sees: what the family is on, how many new games are
//  left this month, the share sheet for each game, and the house rules. Behind
//  the same grown-up code as the rest of the app.
//
//  THE PROMISE THIS PAGE MAKES, in these words: "N of M new games this month,
//  renews <date>. Edits are always free." The meter that enforces it lives in
//  api/cobuild-billing.js, in one place, so the sentence and the behaviour cannot
//  drift apart.
//
//  No emojis: every icon is drawn SVG.
// ===========================================================================
(function(){
  "use strict";
  var GATE="bk_studio_grown_v1", main=document.getElementById("main");
  var FAM=deviceId(), state={ plan:null, kids:[] };

  function esc(s){ return String(s==null?"":s).replace(/[<>&"]/g,function(m){ return {"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[m]; }); }
  function deviceId(){
    try{ var id=localStorage.getItem("deviceId");
      if(!id){ id="dev_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,10); localStorage.setItem("deviceId",id); }
      return id; }catch(e){ return "dev_anon"; }
  }
  function post(url, body){
    return fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body||{})})
      .then(function(r){ return r.json().catch(function(){ return {ok:false}; }); })
      .catch(function(){ return {ok:false,error:"we could not reach the studio"}; });
  }
  function on(id, fn){ var n=document.getElementById(id); if(n) n.onclick=fn; return n; }
  function coverUrl(g){
    var c=g.cover||"";
    if(/^https?:|^\//.test(c)) return c;
    if(c) return "/api/asset-studio?asset="+encodeURIComponent(c.replace(/^studio:/,""));
    return "/api/images?kind=game&id="+encodeURIComponent(g.engine||"breaker");
  }

  // ---- the grown-up gate ---------------------------------------------------
  function gated(){ try{ return sessionStorage.getItem(GATE)==="1"; }catch(e){ return false; } }
  function screenGate(){
    main.innerHTML='<h2>Grown-ups only</h2><p class="sub">This is where the plan, the sharing and the house rules live. Enter the grown-up code.</p>'+
      '<input id="pw" type="password" inputmode="numeric" autocomplete="off" placeholder="&bull;&bull;&bull;&bull;">'+
      '<div class="err" id="err"></div><button class="btn" id="go">Open it</button>';
    var pw=document.getElementById("pw");
    var submit=function(){
      if(pw.value.trim()==="1111"){ try{ sessionStorage.setItem(GATE,"1"); }catch(e){} load(); }
      else document.getElementById("err").textContent="Not that one. Try again.";
    };
    on("go", submit);
    pw.addEventListener("keydown", function(e){ if(e.key==="Enter") submit(); });
    pw.focus();
  }

  // ---- load everything -----------------------------------------------------
  function load(){
    main.innerHTML='<p class="sub">Loading…</p>';
    Promise.all([
      fetch("/api/cobuild-billing?op=plan&familyId="+encodeURIComponent(FAM)).then(function(r){ return r.json(); }).catch(function(){ return {}; }),
      fetch("/api/cobuild-rules?op=kids&familyId="+encodeURIComponent(FAM)).then(function(r){ return r.json(); }).catch(function(){ return {}; })
    ]).then(function(a){
      state.plan=(a[0]&&a[0].plan)||null; state.prices=(a[0]&&a[0].prices)||{cobuild:10,premium:20,addon:5};
      state.kids=(a[1]&&a[1].kids)||[];
      paint();
    });
  }

  function paint(){
    var p=state.plan||{};
    var html='<h2>Your plan</h2><div class="card"><h3>'+esc(p.label||"Preview")+'</h3>'+
      '<p class="sub" style="margin:0">'+esc(p.said||"")+'</p>';
    if(p.live){
      html+='<div class="row">'+
        (p.plan==="preview"||p.plan==="none"
          ? '<button class="btn" id="buy10">Start Cobuild, $'+state.prices.cobuild+' a month</button>'+
            '<button class="btn alt" id="buy20">Premium, $'+state.prices.premium+' a month</button>'
          : '<button class="btn alt" id="addon">Three more games, $'+state.prices.addon+'</button>'+
            (p.hasSub?'<button class="btn alt" id="portal">Manage or cancel</button>':''))+
        '</div>';
    } else {
      html+='<p class="note">The plans are not switched on yet. While the preview is running nothing is charged and nothing is counted.</p>';
    }
    html+='<div class="err" id="planerr"></div></div>';

    if(!state.kids.length){
      html+='<h2>Games</h2><div class="card"><p class="sub" style="margin:0">Nothing made yet. Open the studio and build one together.</p>'+
        '<a class="btn wide" style="display:block;text-align:center;text-decoration:none" href="/studio">Open the studio</a></div>';
    }
    state.kids.forEach(function(k,i){
      html+='<h2>'+esc(k.kidName||"This house")+'</h2><div class="card">'+
        k.games.map(function(g){
          return '<div class="game"><img src="'+esc(coverUrl(g))+'" alt="" onerror="this.style.visibility=\'hidden\'">'+
            '<div class="n"><b>'+esc(g.name)+'</b><small>'+g.plays+' play'+(g.plays===1?"":"s")+
            (g.public?' &middot; on the Top Board':(g.shared?' &middot; link is on':''))+'</small></div>'+
            '<button class="btn alt" data-share="'+esc(g.id)+'" style="padding:9px 13px;font-size:13px">Share</button></div>';
        }).join("")+
        (k.games.length?'':'<p class="sub" style="margin:0">No games yet.</p>')+
        '</div>'+rulesCard(k,i);
    });
    main.innerHTML=html;

    on("buy10", function(){ checkout("cobuild"); });
    on("buy20", function(){ checkout("premium"); });
    on("addon", function(){ checkout("addon"); });
    on("portal", function(){ go("portal", {}); });
    Array.prototype.forEach.call(document.querySelectorAll("[data-share]"), function(b){
      b.onclick=function(){ shareSheet(b.getAttribute("data-share")); };
    });
    state.kids.forEach(function(k,i){ wireRules(k,i); });
  }
  function checkout(which){
    var op = which==="addon" ? "addon" : "checkout";
    go(op, { plan:which });
  }
  function go(op, extra){
    var e=document.getElementById("planerr"); if(e) e.textContent="One moment...";
    post("/api/cobuild-billing", Object.assign({ op:op, familyId:FAM }, extra||{})).then(function(j){
      if(j&&j.ok&&j.url){ location.href=j.url; return; }
      if(e) e.textContent = (j&&j.reason==="not_open") ? "The checkout is not switched on yet." : ((j&&j.error)||"That did not open.");
    });
  }

  // ---- the share sheet, per game -------------------------------------------
  function shareSheet(id){
    var kid=null, game=null;
    state.kids.forEach(function(k){ k.games.forEach(function(g){ if(g.id===id){ kid=k; game=g; } }); });
    if(!game) return;
    var link=location.origin+"/g/"+game.id;
    main.innerHTML='<h2>'+esc(game.name)+'</h2><p class="sub">'+esc(kid.kidName||"")+' &middot; '+game.plays+' play'+(game.plays===1?"":"s")+'</p>'+
      '<div class="card"><h3>The link</h3><p class="sub" style="margin:0 0 8px">Anyone with it can play. No account, no ads.</p>'+
      '<input type="text" id="link" value="'+esc(link)+'" readonly>'+
      '<div class="row"><button class="btn" id="copy">Copy the link</button>'+
      '<button class="btn alt" id="text">Text it to someone</button></div><div class="err" id="serr"></div></div>'+
      '<div class="card"><div class="toggle" style="border-top:none"><div class="t"><b>Put it on the Top Board</b>'+
      '<small>Everyone can see it and play it. First name only, hearts and plays, no comments.</small></div>'+
      '<div class="sw'+(game.public?" on":"")+'" id="pub"><i></i></div></div></div>'+
      '<div class="card"><h3>Print the poster</h3><p class="sub" style="margin:0 0 8px">One page for the fridge: the cover, the title, and a code anyone can point a phone at.</p>'+
      '<button class="btn wide" id="poster">Print the poster</button>'+
      '<p class="note">Printing turns the link on, so the code on the poster works.</p></div>'+
      '<button class="btn alt wide" id="back">Back</button>';
    on("copy", function(){
      var i=document.getElementById("link"); i.select();
      try{ navigator.clipboard.writeText(link); document.getElementById("serr").innerHTML='<span class="ok">Copied.</span>'; }catch(e){}
      post("/api/kid-game",{op:"share",id:game.id,shared:true,familyId:FAM});
    });
    on("text", function(){
      var line=(kid.kidName?kid.kidName:"My kid")+" made a game called "+game.name+". Have a go: "+link;
      post("/api/kid-game",{op:"share",id:game.id,shared:true,familyId:FAM});
      if(navigator.share) navigator.share({ title:game.name, text:line, url:link }).catch(function(){});
      else location.href="sms:?&body="+encodeURIComponent(line);
    });
    on("poster", function(){
      window.open("/api/cobuild-poster?id="+encodeURIComponent(game.id)+"&familyId="+encodeURIComponent(FAM), "_blank");
    });
    var sw=document.getElementById("pub");
    sw.onclick=function(){
      var next=!sw.classList.contains("on");
      sw.classList.toggle("on", next);
      post("/api/kid-game",{op:"share",id:game.id,public:next,shared:next?true:undefined,familyId:FAM}).then(function(j){
        if(!j||!j.ok){ sw.classList.toggle("on", !next); document.getElementById("serr").textContent="That did not save."; return; }
        game.public=next; if(next) game.shared=true;
      });
    };
    on("back", paint);
  }

  // ---- the house rules, per kid -------------------------------------------
  function rulesCard(k,i){
    var r=k.rules||{};
    return '<div class="card" id="rules'+i+'"><h3>House rules for '+esc(k.kidName||"this kid")+'</h3>'+
      '<p class="sub" style="margin:0 0 4px">All off unless you turn them on. None of them nags.</p>'+
      '<div class="toggle"><div class="t"><b>Vegetables first</b><small>A question before the next level unlocks, on the games you choose.</small></div>'+
      '<div class="sw'+(r.vegFirst?" on":"")+'" data-veg="'+i+'"><i></i></div></div>'+
      (r.vegFirst?'<div class="row" id="veggames'+i+'">'+k.games.map(function(g){
        var on=(r.vegGames||[]).indexOf(g.id)!==-1;
        return '<button class="btn '+(on?"":"alt")+'" data-vg="'+i+'" data-id="'+esc(g.id)+'" style="padding:9px 13px;font-size:13px">'+esc(g.name)+'</button>';
      }).join("")+'</div>':'')+
      '<div class="toggle"><div class="t"><b>Chores unlock play</b><small>A short list to tick before a game opens. It clears itself every day.</small></div>'+
      '<div class="sw'+((r.chores||[]).length?" on":"")+'" data-ch="'+i+'"><i></i></div></div>'+
      ((r.chores||[]).length?'<div id="chores'+i+'">'+(r.chores||[]).map(function(c,j){
        return '<div class="row" style="margin-top:6px"><input type="text" data-cid="'+i+'-'+j+'" value="'+esc(c.text)+'"></div>';
      }).join("")+'<div class="row"><button class="btn alt" data-addch="'+i+'" style="padding:9px 13px;font-size:13px">Add another</button>'+
      '<button class="btn" data-savech="'+i+'" style="padding:9px 13px;font-size:13px">Save the list</button></div></div>':'')+
      '<div class="toggle"><div class="t"><b>Play clock</b><small>Minutes a day. There is no countdown on screen: the game ends the way a win ends.</small></div>'+
      '<div class="sw'+(r.playMinutes?" on":"")+'" data-pc="'+i+'"><i></i></div></div>'+
      (r.playMinutes?'<div class="row"><input type="number" min="5" max="600" step="5" value="'+r.playMinutes+'" data-mins="'+i+'" style="max-width:120px">'+
      '<button class="btn" data-savepc="'+i+'" style="padding:9px 13px;font-size:13px">Save</button>'+
      '<span class="note" style="margin:0;align-self:center">'+(r.minutesLeft==null?"":(r.minutesLeft+" left today"))+'</span></div>':'')+
      '<div class="err" id="rerr'+i+'"></div></div>';
  }
  function wireRules(k,i){
    var err=function(t){ var n=document.getElementById("rerr"+i); if(n) n.textContent=t||""; };
    var save=function(rules, said){
      err(said||"Saving...");
      post("/api/cobuild-rules",{op:"set",familyId:FAM,kidId:k.kidId,rules:rules}).then(function(j){
        if(!j||!j.ok) return err("That did not save.");
        k.rules=j.rules;
        if(j.applied && (j.applied.changed||[]).length) err("Done. "+j.applied.changed.length+" game"+(j.applied.changed.length===1?"":"s")+" updated.");
        else err("");
        paint();
      });
    };
    var q=function(sel){ return document.querySelector(sel); };
    var veg=q('[data-veg="'+i+'"]'); if(veg) veg.onclick=function(){
      var on=!veg.classList.contains("on");
      save({ vegFirst:on, vegGames:on?((k.rules.vegGames||[]).length?k.rules.vegGames:k.games.slice(0,1).map(function(g){return g.id;})):[] });
    };
    Array.prototype.forEach.call(document.querySelectorAll('[data-vg="'+i+'"]'), function(b){
      b.onclick=function(){
        var id=b.getAttribute("data-id"), cur=(k.rules.vegGames||[]).slice();
        var at=cur.indexOf(id); if(at===-1) cur.push(id); else cur.splice(at,1);
        save({ vegFirst:true, vegGames:cur });
      };
    });
    var ch=q('[data-ch="'+i+'"]'); if(ch) ch.onclick=function(){
      var on=!ch.classList.contains("on");
      save({ chores: on ? [{id:"c1",text:"Tidy up"}] : [] });
    };
    var addch=q('[data-addch="'+i+'"]'); if(addch) addch.onclick=function(){
      var list=(k.rules.chores||[]).map(function(c){ return {id:c.id,text:c.text}; });
      list.push({ id:"c"+(list.length+1), text:"Another job" });
      save({ chores:list });
    };
    var savech=q('[data-savech="'+i+'"]'); if(savech) savech.onclick=function(){
      var list=[];
      Array.prototype.forEach.call(document.querySelectorAll('[data-cid^="'+i+'-"]'), function(inp,j){
        if(inp.value.trim()) list.push({ id:"c"+(j+1), text:inp.value.trim() });
      });
      save({ chores:list });
    };
    var pc=q('[data-pc="'+i+'"]'); if(pc) pc.onclick=function(){
      var on=!pc.classList.contains("on");
      save({ playMinutes: on ? 30 : 0 });
    };
    var savepc=q('[data-savepc="'+i+'"]'); if(savepc) savepc.onclick=function(){
      var v=q('[data-mins="'+i+'"]');
      save({ playMinutes: parseInt(v && v.value,10)||30 });
    };
  }

  if(!gated()) screenGate(); else load();
})();
</script>
</body>
</html>
