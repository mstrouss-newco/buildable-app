html,body{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}

<!doctype html>
<meta charset="utf-8">
<title>Stories — living scenes</title>
<link rel="icon" href="/favicon.ico?v=4" sizes="any" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=4" />
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=4" />
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=4" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=4" />
<link rel="manifest" href="/site.webmanifest" />
<meta name="theme-color" content="#7C5CFC" />

<style>
  body{margin:0;background:#0e1020;color:#eef0ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:22px;box-sizing:border-box}
  h1{font-size:20px;margin:0 0 2px}
  p.sub{color:#9aa0c7;margin:0 0 16px;font-size:13px;text-align:center;max-width:600px}
  .stage{position:relative;width:min(94vw,720px);aspect-ratio:3/2;border-radius:20px;overflow:hidden;background:#000;box-shadow:0 18px 50px rgba(0,0,0,.5)}
  .scene{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .8s ease;animation:kb 16s ease-in-out infinite alternate}
  .scene.on{opacity:1}
  .fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .firefly{position:absolute;width:7px;height:7px;border-radius:50%;background:radial-gradient(circle,#fff7c4,#ffd95a 60%,transparent 70%);box-shadow:0 0 8px 2px rgba(255,221,90,.7);animation:fly 9s ease-in-out infinite, tw 2.4s ease-in-out infinite}
  .spark{position:absolute;width:5px;height:5px;background:#fff;border-radius:50%;opacity:0;animation:sp 3.2s ease-in-out infinite}
  .leaf{position:absolute;width:13px;height:13px;border-radius:0 100% 0 100%;opacity:.0;animation:leaf 11s linear infinite}
  .rays{position:absolute;inset:0;background:linear-gradient(120deg,transparent 30%,rgba(255,245,200,.16) 48%,transparent 60%);mix-blend-mode:screen;animation:rays 9s ease-in-out infinite}
  .cap{position:absolute;left:0;right:0;bottom:0;padding:34px 22px 18px;font-size:18px;font-weight:600;background:linear-gradient(to top,rgba(0,0,0,.7),transparent);text-shadow:0 1px 4px rgba(0,0,0,.6)}
  .dots{display:flex;gap:8px;margin:16px 0 4px}
  .dot{width:9px;height:9px;border-radius:50%;background:#39406e;cursor:pointer}.dot.on{background:#7aa2ff}
  @keyframes kb{0%{transform:scale(1.05)}100%{transform:scale(1.14) translate(-1.5%,-1%)}}
  @keyframes fly{0%{transform:translate(0,0)}25%{transform:translate(14px,-18px)}50%{transform:translate(-10px,-30px)}75%{transform:translate(-18px,-12px)}100%{transform:translate(0,0)}}
  @keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
  @keyframes sp{0%,100%{opacity:0;transform:scale(.5)}50%{opacity:.95;transform:scale(1)}}
  @keyframes leaf{0%{opacity:0;transform:translate(0,-8%) rotate(0)}10%{opacity:.85}100%{opacity:0;transform:translate(-60px,108%) rotate(320deg)}}
  @keyframes rays{0%,100%{opacity:.35}50%{opacity:.9}}
</style>

<h1>Living scenes — Enchanted Forest</h1>
<p class="sub">The same generated pages, now alive: the picture slowly drifts, fireflies float and twinkle, leaves blow through, and light rays shimmer. All free CSS motion over the illustration — no video. Auto-plays.</p>

<div class="stage" id="stage">
  <img class="scene" id="scene">
  <div class="fx" id="fx"></div>
  <div class="rays"></div>
  <div class="cap" id="cap"></div>
</div>
<div class="dots" id="dots"></div>

<script>
const API="/api/story-library";
const PAGES=[
  {shot:"establish", text:"Pip skipped down the glowing forest path."},
  {shot:"peek",      text:"He peeked out shyly from behind a giant mushroom."},
  {shot:"doorway",   text:"A shimmering doorway of light glowed between the trees."},
  {shot:"companion", text:"A wise old owl welcomed him into the clearing."},
  {shot:"cozy",      text:"Tucked by a great tree, Pip drifted off to sleep."},
];
const sceneUrl=(shot)=>`${API}?simg=1&slug=fox&style=watercolor&shot=${shot}`;
const stage=document.getElementById("stage"), sceneEl=document.getElementById("scene"),
      fx=document.getElementById("fx"), cap=document.getElementById("cap"), dotsEl=document.getElementById("dots");

// build particles once
function rnd(a,b){return a+Math.random()*(b-a);}
for(let i=0;i<16;i++){const f=document.createElement("div");f.className="firefly";
  f.style.left=rnd(5,95)+"%";f.style.top=rnd(15,90)+"%";
  f.style.animationDuration=rnd(7,13)+"s,"+rnd(1.8,3.2)+"s";f.style.animationDelay=rnd(-8,0)+"s,"+rnd(-3,0)+"s";fx.appendChild(f);}
for(let i=0;i<12;i++){const s=document.createElement("div");s.className="spark";
  s.style.left=rnd(2,98)+"%";s.style.top=rnd(5,85)+"%";s.style.animationDelay=rnd(-3,0)+"s";fx.appendChild(s);}
const leafColors=["#c9863f","#e0a44b","#8a9a4a","#b5743a"];
for(let i=0;i<7;i++){const l=document.createElement("div");l.className="leaf";
  l.style.left=rnd(10,95)+"%";l.style.top=rnd(-5,40)+"%";l.style.background=leafColors[i%leafColors.length];
  l.style.animationDuration=rnd(8,14)+"s";l.style.animationDelay=rnd(-12,0)+"s";fx.appendChild(l);}

let idx=0, timer=null;
function show(i){
  idx=(i+PAGES.length)%PAGES.length;
  sceneEl.classList.remove("on");
  setTimeout(()=>{ sceneEl.src=sceneUrl(PAGES[idx].shot); cap.textContent=PAGES[idx].text; sceneEl.classList.add("on"); },120);
  [...dotsEl.children].forEach((d,k)=>d.classList.toggle("on",k===idx));
  clearInterval(timer); timer=setInterval(()=>show(idx+1),5500);
}
PAGES.forEach((_,k)=>{const d=document.createElement("div");d.className="dot";d.onclick=()=>show(k);dotsEl.appendChild(d);});
sceneEl.onload=()=>sceneEl.classList.add("on");
show(0);
</script>
