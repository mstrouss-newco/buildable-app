<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Forge review — Buildable Kids</title>
<link rel="icon" href="/favicon.ico?v=4" sizes="any" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=4" />
<meta name="theme-color" content="#14122b" />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#14122b; --card:#1d1b36; --line:rgba(255,255,255,.12); --accent:#9B7BFF; --dim:#B9AEEA; --good:#7EE0A0; --warn:#FFD86B; --bad:#FF9A9A; }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--bg);color:#fff;font-family:'Nunito',system-ui,-apple-system,sans-serif}
  .bar{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
  .bar h1{font-size:16px;font-weight:900;margin:0;flex:1}
  main{max-width:820px;margin:0 auto;padding:18px 16px 40px}
  h2{font-size:clamp(19px,5vw,24px);font-weight:900;margin:22px 0 4px}
  p.sub{color:var(--dim);font-size:15px;line-height:1.5;margin:0 0 14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;margin:12px 0}
  .card h3{margin:0 0 4px;font-size:17px;font-weight:900}
  .said{color:var(--dim);font-size:14px;line-height:1.45;margin:0 0 10px;font-style:italic}
  .nums{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
  .num{font-size:12px;font-weight:800;color:#e9e2ff;background:rgba(155,123,255,.16);border:1px solid var(--line);border-radius:999px;padding:6px 11px}
  .num b{color:#fff}
  .why{color:var(--dim);font-size:13.5px;line-height:1.5;margin:6px 0 0;padding-left:16px}
  .why li{margin:3px 0}
  .btn{font-family:inherit;font-weight:900;font-size:15px;color:#16142b;background:linear-gradient(160deg,#9B7BFF,#67E8F9);
    border:none;border-radius:13px;padding:11px 18px;cursor:pointer;margin-right:8px;margin-top:6px}
  .btn.alt{background:rgba(155,123,255,.16);color:#cdbcff}
  input[type=password]{font-family:inherit;font-size:20px;padding:13px 16px;border-radius:14px;border:1px solid var(--line);
    background:var(--card);color:#fff;width:100%;max-width:240px;text-align:center;letter-spacing:6px;margin:12px 0}
  .tag{font-size:11px;font-weight:900;letter-spacing:1px;padding:4px 9px;border-radius:999px;border:1px solid var(--line)}
  .tag.ok{color:var(--good);background:rgba(126,224,160,.1)}
  .tag.no{color:var(--bad);background:rgba(255,154,154,.08)}
  .tag.up{color:var(--warn);background:rgba(255,216,107,.1)}
  .row{display:flex;align-items:center;gap:10px}
  .err{color:#ff9a9a;font-size:14px;margin-top:10px;min-height:18px}
  code{background:rgba(0,0,0,.3);padding:2px 6px;border-radius:6px;font-size:12.5px}
</style>
</head>
<body>
<div class="bar">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFD86B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M12 2.6l2.6 5.5 6 .8-4.4 4.2 1.1 6-5.3-2.9-5.3 2.9 1.1-6L3.4 8.9l6-.8z"/></svg>
  <h1>Forge review</h1>
</div>
<main id="main"><p class="sub">Loading…</p></main>
<script>
// ===========================================================================
//  /studio/forge-review — THE OWNER'S DESK (Session CB5).
//
//  Two lists, and they matter in opposite directions.
//
//  READY is the promotion queue: games layer three wrote that passed every gate
//  and that families have actually played. Promote takes one and stages it to
//  become a real engine in the repo — the button never writes to main by itself,
//  because nothing a model wrote should land because a button was pressed.
//
//  COULD NOT BUILD is the roadmap. Every idea the forge could not finish is here
//  in the child's own words. That list is the most honest product research in
//  this company: it is what children ask for that we cannot make yet.
//
//  Grown-up gated on the SERVER (api/_grownup.js). This page holds no code.
// ===========================================================================
(function(){
  "use strict";
  var GROWN_KEY="bk_studio_grown_v1", main=document.getElementById("main");
  function esc(s){ return String(s==null?"":s).replace(/[<>&"]/g,function(m){ return {"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[m]; }); }
  function show(h){ main.innerHTML=h; window.scrollTo(0,0); }
  function on(id,fn){ var n=document.getElementById(id); if(n) n.onclick=fn; return n; }
  function token(){ try{ return sessionStorage.getItem(GROWN_KEY)||""; }catch(e){ return ""; } }
  function post(url,body){
    var h={"Content-Type":"application/json"}, t=token(); if(t) h["x-bk-grownup"]=t;
    return fetch(url,{method:"POST",headers:h,body:JSON.stringify(body||{})})
      .then(function(r){ return r.json().catch(function(){ return {ok:false,error:"no answer"}; }); })
      .catch(function(){ return {ok:false,error:"could not reach the workshop"}; });
  }
  function when(s){ try{ return new Date(s).toLocaleDateString(); }catch(e){ return ""; } }

  // The grown-up code, checked on the server. Same gate as the grown-up studio.
  function screenGate(msg){
    show('<h2>Grown-ups only</h2><p class="sub">'+esc(msg||"This is the workshop queue. Enter the grown-up code.")+'</p>'+
      '<input id="pw" type="password" inputmode="numeric" autocomplete="off" placeholder="&bull;&bull;&bull;&bull;">'+
      '<div><button class="btn" id="go">Open it</button></div><div class="err" id="err"></div>');
    var pw=document.getElementById("pw");
    var go=function(){
      post("/api/cobuild-grownup",{op:"open",code:pw.value.trim()}).then(function(j){
        if(!j||!j.ok||!j.token){ document.getElementById("err").textContent="Not that one. Try again."; return; }
        try{ sessionStorage.setItem(GROWN_KEY,j.token); }catch(e){}
        load();
      });
    };
    on("go",go); pw.addEventListener("keydown",function(e){ if(e.key==="Enter") go(); }); pw.focus();
  }

  function readyCard(g){
    return '<div class="card"><div class="row"><h3 style="flex:1">'+esc(g.name||g.id)+'</h3>'+
      '<span class="tag '+(g.promotedAs?"up":"ok")+'">'+(g.promotedAs?"PROMOTED":"READY")+'</span></div>'+
      '<p class="said">"'+esc(g.idea||"")+'"</p>'+
      '<div class="nums"><span class="num">played <b>'+(g.plays||0)+'</b></span>'+
      '<span class="num">finished <b>'+(g.cleared||0)+'</b></span>'+
      '<span class="num">loved <b>'+(g.hearts||0)+'</b></span>'+
      '<span class="num">tries <b>'+(g.attempts||0)+'</b></span>'+
      '<span class="num">'+esc(when(g.createdAt))+'</span></div>'+
      '<a class="btn alt" href="/forge/'+esc(g.id)+'" target="_blank" rel="noopener" style="text-decoration:none;display:inline-block">Play it</a>'+
      (g.promotedAs
        ? '<p class="sub" style="margin-top:10px">Staged as <code>'+esc(g.promotedAs)+'</code>. Run <code>node scripts/promote-forge.mjs '+esc(g.id)+'</code> to write the files into the repo.</p>'
        : '<button class="btn" data-promote="'+esc(g.id)+'">Make it a real game</button>')+
      '</div>';
  }
  function failedCard(g){
    var probs=(g.problems||[]).slice(0,4);
    return '<div class="card"><div class="row"><h3 style="flex:1">'+esc(g.name||g.id)+'</h3>'+
      '<span class="tag no">COULD NOT BUILD</span></div>'+
      '<p class="said">"'+esc(g.idea||"")+'"</p>'+
      '<div class="nums"><span class="num">tries <b>'+(g.attempts||0)+'</b></span>'+
      (g.nearest?'<span class="num">played as <b>'+esc(g.nearest)+'</b></span>':'')+
      '<span class="num">'+esc(when(g.createdAt))+'</span></div>'+
      (probs.length?'<ul class="why">'+probs.map(function(p){ return '<li>'+esc(p)+'</li>'; }).join("")+'</ul>':'')+
      '</div>';
  }

  function load(){
    var t=token();
    fetch("/api/cobuild-forge?op=queue"+(t?"&gt="+encodeURIComponent(t):""),{headers:t?{"x-bk-grownup":t}:{}})
      .then(function(r){ return r.json(); })
      .then(function(j){
        if(!j||!j.ok){ return screenGate(j&&j.needGrownup?"This is the workshop queue. Enter the grown-up code.":"That did not open."); }
        var ready=(j.ready||[]).concat(j.promoted||[]), failed=j.failed||[], forging=j.forging||[];
        show(
          '<h2>Ready to be real games</h2>'+
          '<p class="sub">Layer three wrote these, the robot finished every level, and families have played them. Promoting one stages the files; a person still reads them before they reach the site.</p>'+
          (ready.length?ready.map(readyCard).join(""):'<div class="card"><p class="sub" style="margin:0">Nothing here yet.</p></div>')+
          (forging.length?'<h2>Being written now</h2>'+forging.map(function(g){
            return '<div class="card"><h3>'+esc(g.name||g.id)+'</h3><p class="said">"'+esc(g.idea||"")+'"</p></div>'; }).join(""):'')+
          '<h2>What kids asked for that we could not build</h2>'+
          '<p class="sub">This is the roadmap, in their own words. Every one of these is a game somebody wanted and did not get.</p>'+
          (failed.length?failed.map(failedCard).join(""):'<div class="card"><p class="sub" style="margin:0">Nothing here yet.</p></div>')+
          '<div class="err" id="err"></div>');
        Array.prototype.forEach.call(document.querySelectorAll("[data-promote]"), function(b){
          b.onclick=function(){
            b.disabled=true; b.textContent="Staging…";
            post("/api/cobuild-forge",{op:"promote",id:b.getAttribute("data-promote")}).then(function(r){
              if(!r||!r.ok){ b.disabled=false; b.textContent="Make it a real game";
                document.getElementById("err").textContent=(r&&r.error)||"That did not work."; return; }
              load();
            });
          };
        });
      })
      .catch(function(){ screenGate("That did not open."); });
  }

  load();
})();
</script>
</body>
</html>
