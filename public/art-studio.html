<!doctype html>
<html>
<head>
    <link rel="icon" href="/favicon.ico?v=4" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=4" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=4" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=4" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=4" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#7C5CFC" />

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Buildable Art Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --tray:#1a1444; --tray2:#241a52; --card:#201751; --line:#3a2c6e; --accent:#9b7bff; --good:#7ee0a0; }
  html,body{margin:0;height:100%;background:#0b1030;overflow:hidden;touch-action:none;
    font-family:'Fredoka',-apple-system,sans-serif;color:#fff;-webkit-user-select:none;user-select:none}
  #app{position:fixed;inset:0;display:flex;flex-direction:column}
  /* TOP bar: title + do-actions + my art + sound */
  #top{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:6px 10px 6px 84px;background:#120b30;z-index:5}
  #top .t{font-weight:700;font-size:18px;letter-spacing:.3px;margin-right:4px}
  /* MIDDLE: left rail | canvas | right rail */
  #mid{flex:1 1 auto;display:flex;min-height:0}
  .rail{flex:0 0 auto;background:var(--tray);display:flex;flex-direction:column;align-items:center;gap:6px;
    padding:7px 6px;overflow-y:auto;overflow-x:hidden}
  #left{width:78px;border-right:2px solid var(--line)}
  #right{width:70px;border-left:2px solid var(--line)}
  #stage{flex:1 1 auto;min-width:0;position:relative;display:flex;align-items:center;justify-content:center;padding:8px}
  #paper{background:#fff;border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.45);max-width:100%;max-height:100%;touch-action:none}
  /* BOTTOM bar: size / mirror / style / stamps */
  #bottom{flex:0 0 auto;background:var(--tray);border-top:2px solid var(--line);padding:6px 8px;display:flex;gap:8px;align-items:stretch;justify-content:center;overflow-x:auto}
  .railhdr{font-size:10px;font-weight:700;color:#a99fe0;text-transform:uppercase;letter-spacing:.4px;display:flex;align-items:center;gap:4px}
  .g{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:5px 8px 7px;display:flex;flex-direction:column;gap:5px;flex:0 0 auto}
  .gh{display:flex;align-items:center;gap:6px;color:#a99fe0;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
  .items{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .bt{width:62px;height:56px;border-radius:13px;background:var(--tray2);border:3px solid var(--line);cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:#cfc8ff;flex:0 0 auto}
  .bt.on{border-color:var(--good);box-shadow:0 0 0 2px rgba(126,224,160,.4);color:#fff}
  .bt .lab{font-size:10px;font-weight:600}
  .sw{width:42px;height:42px;border-radius:50%;border:3px solid rgba(255,255,255,.28);cursor:pointer;flex:0 0 auto}
  .sw.on{border-color:#fff;box-shadow:0 0 0 3px var(--accent)}
  .mi{width:50px;height:50px;border-radius:13px;background:var(--tray2);border:3px solid var(--line);cursor:pointer;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .mi.on{border-color:var(--good);box-shadow:0 0 0 2px rgba(126,224,160,.4)}
  .iconbtn{width:48px;height:48px;border-radius:13px;background:var(--tray2);border:3px solid var(--line);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;flex:0 0 auto}
  .iconbtn:active{transform:translateY(2px)}
  .iconbtn.save{background:#fff0f5;border-color:#ff9bbb}
  #top .tbtn{width:56px;height:50px;flex-direction:column;gap:0}
  #top .tbtn svg{width:24px;height:24px}
  #top .tbtn .cap{font-size:9px;font-weight:700;color:#cfc8ff;line-height:1.05;margin-top:1px}
  #top .tbtn.clear{background:#2a1430;border-color:#ff7a90}
  #top .tbtn.clear .cap{color:#ffb3c1}
  #top .tbtn.save .cap{color:#ff5d8f}
  .spacer{flex:1}
  input[type=color]{width:42px;height:42px;border:none;background:none;border-radius:50%;cursor:pointer;padding:0;flex:0 0 auto}
  .ov{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(8,6,24,.74)}
  .ov.show{display:flex}
  .card{background:linear-gradient(180deg,#1a1248,#241152);border:2px solid var(--line);border-radius:22px;padding:20px;max-width:94vw;max-height:88vh;overflow:auto;text-align:center}
  .card h2{margin:0 0 14px;font-size:22px}
  .pickwrap{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;max-width:640px}
  .pick{width:92px;height:92px;border-radius:16px;background:#fff;border:3px solid var(--line);cursor:pointer;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .pick img{max-width:84px;max-height:84px}.pick canvas{width:84px;height:62px}
  .tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
  .tab{font-weight:700;font-size:14px;color:#cdd0ff;background:#241a52;border:2px solid var(--line);border-radius:11px;padding:8px 15px;cursor:pointer}
  .tab.on{background:var(--accent);color:#1a0f3a;border-color:var(--accent)}
  #toast{position:fixed;left:50%;top:14px;transform:translateX(-50%) translateY(-20px);opacity:0;transition:.25s;background:#2b1a66;border:2px solid var(--accent);color:#fff;font-weight:600;padding:10px 18px;border-radius:14px;z-index:40;pointer-events:none}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  input[type=text]{font-family:inherit;font-size:18px;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:#0f0a2c;color:#fff;width:260px;max-width:70vw;text-align:center}
  /* PORTRAIT / narrow tablets: side rails become horizontal bars so the canvas keeps full width */
  @media (orientation:portrait),(max-width:760px){
    #mid{flex-direction:column}
    #left,#right{width:auto;flex-direction:row;align-items:center;overflow-x:auto;overflow-y:hidden;flex:0 0 auto;border:none}
    #left{border-bottom:2px solid var(--line)} #right{border-top:2px solid var(--line)}
    #left .railhdr,#right .railhdr{flex:0 0 auto;margin-right:6px}
    #stage{flex:1 1 auto;min-height:0}
    .bt{width:56px;height:52px} .sw{width:38px;height:38px}
    #top{padding-left:78px} #top .t{display:none}
    #bottom{justify-content:flex-start}
  }
</style>
<style id="no-longpress">/* Buildable: disable iOS long-press magnifier + Look Up/Translate popup app-wide; keep inputs selectable */
html,body{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
input,textarea,select,[contenteditable]{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div class="t">Art Studio</div>
    <button class="iconbtn tbtn" id="undoBtn" aria-label="Undo"></button>
    <button class="iconbtn tbtn" id="redoBtn" aria-label="Redo"></button>
    <button class="iconbtn tbtn clear" id="clearBtn" aria-label="Clear"></button>
    <button class="iconbtn tbtn save" id="saveBtn" aria-label="Save"></button>
    <span class="spacer"></span>
    <button class="iconbtn tbtn" id="galleryBtn" aria-label="My art"></button>
    <button class="iconbtn tbtn" id="soundBtn" aria-label="Sound"></button>
  </div>
  <div id="mid">
    <div class="rail" id="left"></div>
    <div id="stage"><canvas id="paper"></canvas></div>
    <div class="rail" id="right"></div>
  </div>
  <div id="bottom"></div>
</div>

<div class="ov" id="clearOv"><div class="card"><h2>Start over?</h2>
  <div><button class="iconbtn" id="clearNo" aria-label="Keep it" style="width:62px;height:62px;background:#10391f;border-color:#3DD06A"></button>
  <button class="iconbtn" id="clearYes" aria-label="Start over" style="width:62px;height:62px;background:#3a1430;border-color:#ff7a90"></button></div></div></div>
<div class="ov" id="stickOv"><div class="card"><h2>Stickers</h2><div class="tabs" id="stickTabs"></div><div class="pickwrap" id="stickWrap"></div>
  <div style="margin-top:16px"><button class="iconbtn" id="stickClose" style="width:62px;height:62px" aria-label="Done"></button></div></div></div>
<div class="ov" id="shapeOv"><div class="card"><h2>Shapes</h2><div class="pickwrap" id="shapeWrap"></div>
  <div style="margin-top:16px"><button class="iconbtn" id="shapeClose" style="width:62px;height:62px" aria-label="Done"></button></div></div></div>
<div class="ov" id="bgOv"><div class="card"><h2>Scene</h2><div class="pickwrap" id="bgWrap"></div>
  <div style="margin-top:16px"><button class="iconbtn" id="bgClose" style="width:62px;height:62px" aria-label="Done"></button></div></div></div>
<div class="ov" id="colorOv"><div class="card"><h2>Coloring pages</h2><div class="pickwrap" id="colorWrap"></div>
  <div style="margin-top:16px"><button class="iconbtn" id="colorClose" style="width:62px;height:62px" aria-label="Done"></button></div></div></div>
<div class="ov" id="galleryOv"><div class="card"><h2>My Art</h2><div class="pickwrap" id="galleryWrap"></div>
  <div style="margin-top:16px"><button class="iconbtn" id="galleryClose" style="width:62px;height:62px" aria-label="Close"></button></div></div></div>
<div class="ov" id="saveOv"><div class="card"><h2>Save your art</h2>
  <input type="text" id="artTitle" placeholder="My masterpiece" maxlength="40"><br><br>
  <label style="display:block;margin:6px 0 16px;font-size:15px;opacity:.85"><input type="checkbox" id="shareChk"> Also show my family</label>
  <div><button class="iconbtn" id="saveCancel" style="width:62px;height:62px" aria-label="Not yet"></button>
  <button class="iconbtn save" id="saveGo" style="width:62px;height:62px" aria-label="Save it"></button></div></div></div>
<div id="toast"></div>

<script src="/buildable-renders.js"></script>
<script src="/buildable-audio.js"></script>
<script src="/buildable-mechanics.js"></script>
<script>
(function(){
  "use strict";
  var BR=window.BuildableRenders, BA=window.BuildableAudio, BM=window.BuildableMechanics;
  var CFG=window.STUDIO_CONFIG||{
    brushes:[
      {id:"crayon",name:"Crayon",sound:"art_crayon",texture:"waxy"},{id:"marker",name:"Marker",sound:"art_marker",texture:"smooth"},
      {id:"paint",name:"Paint",sound:"art_paint",texture:"wet"},{id:"pencil",name:"Pencil",sound:"art_pencil",texture:"fine"},
      {id:"chalk",name:"Chalk",sound:"art_chalk",texture:"grain"},{id:"spray",name:"Spray",sound:"art_spray",texture:"spray"},
      {id:"neon",name:"Neon",sound:"art_neon",texture:"glow"},{id:"ribbon",name:"Ribbon",sound:"art_marker",texture:"ribbon",dynamic:true},
      {id:"fur",name:"Fur",sound:"art_chalk",texture:"fur"},{id:"dots",name:"Sponge",sound:"art_spray",texture:"dots"},
      {id:"rainbow",name:"Rainbow",sound:"art_marker",texture:"smooth",rainbow:true},{id:"glitter",name:"Glitter",sound:"art_glitter",texture:"smooth",fx:"twinkle"},
      {id:"fill",name:"Fill",sound:"art_fill",fill:true},{id:"eraser",name:"Eraser",sound:"art_undo",erase:true}
    ],
    palette:["#ff4d4d","#ff8a3d","#ffd23f","#7ee0a0","#2ec4b6","#3a86ff","#8338ec","#ff70a6","#9b5e3c","#000000","#ffffff"],
    sizes:[6,16,30,50,72], mirror:[1,"V","H",2,4,8],
    styles:[{id:"paper",name:"Paper",bg:{type:"color",c:"#ffffff"}},{id:"chalk",name:"Chalk",bg:{type:"color",c:"#243240"}},
      {id:"neon",name:"Neon",bg:{type:"color",c:"#0a0a1e"}},{id:"3d",name:"3D",bg:{type:"color",c:"#eef0f7"}},{id:"pixel",name:"Pixel",bg:{type:"color",c:"#ffffff"}}],
    shapes:["star","heart","flower","diamond","triangle","circle","lightning","moon","cloud","dot"],
    backgrounds:[{type:"color",c:"#ffffff",name:"White"},{type:"color",c:"#0a0a1e",name:"Night"},{type:"color",c:"#243240",name:"Slate"},
      {type:"color",c:"#fff7e6",name:"Cream"},{type:"color",c:"#eafff2",name:"Mint"},{type:"color",c:"#ffeaf2",name:"Blush"},
      {type:"grad",from:"#89f7fe",to:"#66a6ff",name:"Sky"},{type:"grad",from:"#fbc2eb",to:"#a18cd1",name:"Candy"},
      {type:"grad",from:"#0a0a2e",to:"#3a1c71",name:"Galaxy"},{type:"grad",from:"#0f3d3e",to:"#136a4a",name:"Forest"}],
    stickerThemes:["all","forest","ocean","space","candy"]
  };
  var S={brush:CFG.brushes[0],color:CFG.palette[0],size:18,mirror:1,style:"paper",bg:CFG.styles[0].bg,ops:[],redo:[],sticker:null,shape:"star",hue:0,muted:false,recent:[],coloring:null};
  var Q=10;
  var paper=document.getElementById("paper"), ctx=paper.getContext?paper.getContext("2d"):null, stage=document.getElementById("stage");
  function fitCanvas(){ if(!paper.getBoundingClientRect) return; var r=stage.getBoundingClientRect();
    paper.width=Math.max(200,Math.floor(r.width-12)); paper.height=Math.max(160,Math.floor(r.height-12));
    paper.style.width=paper.width+"px"; paper.style.height=paper.height+"px"; redraw(); }

  var _snd={}; function playSfx(n,trimMs){ if(S.muted||!n) return; try{ var a=_snd[n]; if(!a){ a=new Audio("/api/sfx?s="+encodeURIComponent(n)); a.volume=.5; _snd[n]=a; } a.currentTime=0; clearTimeout(a._trim); var p=a.play(); if(p&&p.catch)p.catch(function(){}); if(trimMs){ a._trim=setTimeout(function(){ try{ a.pause(); a.currentTime=0; }catch(e){} },trimMs); } }catch(e){} }
  var _ls=0; function playStrokeSfx(n){ var t=Date.now(); if(t-_ls<90) return; _ls=t; playSfx(n,260); }

  function drawBg(c){ if(!c) return; c.save(); c.globalCompositeOperation="source-over"; var bg=S.bg||{type:"color",c:"#fff"};
    if(bg.type==="grad"){ var g=c.createLinearGradient(0,0,0,paper.height); g.addColorStop(0,bg.from); g.addColorStop(1,bg.to); c.fillStyle=g; } else c.fillStyle=bg.c||"#fff"; c.fillRect(0,0,paper.width,paper.height); c.restore(); }
  function rainbowCol(op,i){ return "hsl("+((op.hueStart+i*6)%360)+",85%,55%)"; }
  function quant(pts){ return pts.map(function(p){ return {x:Math.round(p.x/Q)*Q,y:Math.round(p.y/Q)*Q,w:p.w}; }); }
  function baseStroke(c,op,color){ var pts=op.points;
    if(op.rainbow){ for(var i=1;i<pts.length;i++) BR.stroke(c,{texture:op.texture,points:[pts[i-1],pts[i]],color:color||rainbowCol(op,i),width:op.width,alpha:1}); }
    else BR.stroke(c,{texture:op.texture,points:pts,color:color||op.color,width:op.width,alpha:1}); }
  function styledStroke(c,op){ var st=op.style||"paper",save=op.points; if(st==="pixel") op.points=quant(op.points);
    c.save(); c.lineCap=st==="pixel"?"butt":"round"; c.lineJoin=st==="pixel"?"miter":"round";
    if(op.erase){ c.globalCompositeOperation="destination-out"; baseStroke(c,op,"#000"); c.restore(); op.points=save; return; }
    if(st==="neon"){ c.shadowColor=op.color; c.shadowBlur=Math.max(8,op.width*1.4); baseStroke(c,op); baseStroke(c,op); }
    else if(st==="3d"){ c.save(); c.translate(3,4); baseStroke(c,op,"rgba(0,0,0,0.18)"); c.restore(); baseStroke(c,op); c.save(); c.translate(-1,-1); c.globalAlpha=.5; baseStroke(c,op,"rgba(255,255,255,0.55)"); c.restore(); }
    else baseStroke(c,op); c.restore(); op.points=save; }
  function drawStrokeMir(c,op){ if(!c||!op.points||!op.points.length) return; BR.mirror(c,op.mirror||1,paper.width,paper.height,function(){ styledStroke(c,op); }); }
  function drawStampMir(c,op){ if(!c) return; if(op.shape){ BR.mirror(c,op.mirror||1,paper.width,paper.height,function(){ BR.shape(c,op.shape,op.x,op.y,op.size,op.color); }); return; }
    var img=stampCache[op.url]; if(!img){ loadStamp(op.url,function(){ redraw(); }); return; } if(!(img.naturalWidth||img.width)) return;
    var sz=op.size; BR.mirror(c,op.mirror||1,paper.width,paper.height,function(){ try{ c.drawImage(img,op.x-sz/2,op.y-sz/2,sz,sz); }catch(e){} }); }
  function hexToRgb(h){ if(!h) return null; if(h[0]==="#") h=h.slice(1); if(h.length===3) h=h.split("").map(function(x){return x+x;}).join(""); var n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255]; }
  function floodFill(c,x,y,hex){ if(!c||!c.getImageData) return; x=x|0;y=y|0; var W=paper.width,H=paper.height,id; try{ id=c.getImageData(0,0,W,H); }catch(e){ return; } var d=id.data;
    var si=(y*W+x)*4, tgt=[d[si],d[si+1],d[si+2],d[si+3]], col=hexToRgb(hex); if(!col) return;
    if(Math.abs(col[0]-tgt[0])+Math.abs(col[1]-tgt[1])+Math.abs(col[2]-tgt[2])<8&&tgt[3]>250) return;
    var tol=40,stack=[si],guard=0,max=W*H+10; function match(i){ return Math.abs(d[i]-tgt[0])<=tol&&Math.abs(d[i+1]-tgt[1])<=tol&&Math.abs(d[i+2]-tgt[2])<=tol&&Math.abs(d[i+3]-tgt[3])<=tol; }
    while(stack.length&&guard++<max){ var i=stack.pop(); if(i<0||i>=d.length||!match(i)) continue; d[i]=col[0];d[i+1]=col[1];d[i+2]=col[2];d[i+3]=255; var px=(i/4)%W; stack.push(i+4*W);stack.push(i-4*W); if(px>0)stack.push(i-4); if(px<W-1)stack.push(i+4); } c.putImageData(id,0,0); }
  // ---- coloring-book line-art templates (outlines kids fill in) ----
  var COLORING={
    flower:function(c){ for(var i=0;i<6;i++){var a=i*Math.PI/3;c.beginPath();c.ellipse(Math.cos(a)*22,Math.sin(a)*22,16,10,a,0,7);c.stroke();} c.beginPath();c.arc(0,0,12,0,7);c.stroke(); c.beginPath();c.moveTo(0,12);c.lineTo(0,48);c.stroke(); c.beginPath();c.ellipse(10,38,9,5,-0.6,0,7);c.stroke(); },
    house:function(c){ c.strokeRect(-30,-6,60,46); c.beginPath();c.moveTo(-36,-6);c.lineTo(0,-40);c.lineTo(36,-6);c.stroke(); c.strokeRect(-10,16,20,24); c.strokeRect(12,4,14,14); },
    fish:function(c){ c.beginPath();c.ellipse(-6,0,30,18,0,0,7);c.stroke(); c.beginPath();c.moveTo(22,0);c.lineTo(44,-16);c.lineTo(44,16);c.closePath();c.stroke(); c.beginPath();c.arc(-20,-5,3,0,7);c.stroke(); },
    butterfly:function(c){ c.beginPath();c.ellipse(-16,-10,16,14,0.4,0,7);c.stroke(); c.beginPath();c.ellipse(-14,16,12,12,-0.4,0,7);c.stroke(); c.beginPath();c.ellipse(16,-10,16,14,-0.4,0,7);c.stroke(); c.beginPath();c.ellipse(14,16,12,12,0.4,0,7);c.stroke(); c.beginPath();c.moveTo(0,-22);c.lineTo(0,24);c.stroke(); },
    rocket:function(c){ c.beginPath();c.moveTo(0,-44);c.quadraticCurveTo(20,-10,16,28);c.lineTo(-16,28);c.quadraticCurveTo(-20,-10,0,-44);c.stroke(); c.beginPath();c.arc(0,-6,7,0,7);c.stroke(); c.beginPath();c.moveTo(-16,16);c.lineTo(-30,36);c.lineTo(-16,28);c.stroke(); c.beginPath();c.moveTo(16,16);c.lineTo(30,36);c.lineTo(16,28);c.stroke(); },
    sun:function(c){ c.beginPath();c.arc(0,0,22,0,7);c.stroke(); for(var i=0;i<12;i++){var a=i*Math.PI/6;c.beginPath();c.moveTo(Math.cos(a)*30,Math.sin(a)*30);c.lineTo(Math.cos(a)*44,Math.sin(a)*44);c.stroke();} },
    car:function(c){ c.beginPath();c.moveTo(-40,12);c.lineTo(-40,-2);c.lineTo(-22,-2);c.lineTo(-12,-18);c.lineTo(20,-18);c.lineTo(30,-2);c.lineTo(40,-2);c.lineTo(40,12);c.closePath();c.stroke(); c.beginPath();c.arc(-22,12,9,0,7);c.stroke(); c.beginPath();c.arc(22,12,9,0,7);c.stroke(); },
    balloon:function(c){ c.beginPath();c.ellipse(0,-14,22,26,0,0,7);c.stroke(); c.beginPath();c.moveTo(0,12);c.lineTo(-3,18);c.lineTo(3,18);c.closePath();c.stroke(); c.beginPath();c.moveTo(0,18);c.quadraticCurveTo(8,36,-4,48);c.stroke(); }
  };
  function drawColoring(c,onTop){ if(!S.coloring) return; var t=COLORING[S.coloring]; if(!t||!c.save) return;
    var W=paper.width,H=paper.height,s=Math.min(W,H)*0.78,k=s/110; c.save();
    if(onTop) c.globalCompositeOperation="multiply";
    c.translate(W/2,H/2); c.scale(k,k); c.strokeStyle="#2a2a2a"; c.lineWidth=2.6/k; c.lineJoin="round"; c.lineCap="round";

  function openColoring(){ playSfx("pop"); var ov=document.getElementById("colorOv"), wrap=document.getElementById("colorWrap"); wrap.innerHTML="";
    var none=tileMedia(function(){ S.coloring=null; redraw(); ov.classList.remove("show"); });
    var ncv=document.createElement("canvas"); ncv.width=84; ncv.height=62; var nc=ncv.getContext("2d"); nc.fillStyle="#fff"; nc.fillRect(0,0,84,62); nc.strokeStyle="#ff7a90"; nc.lineWidth=3; nc.beginPath(); nc.moveTo(18,44); nc.lineTo(66,18); nc.stroke(); none.appendChild(ncv); wrap.appendChild(none);
    Object.keys(COLORING).forEach(function(id){ var cv=document.createElement("canvas"); cv.width=84; cv.height=62; var c=cv.getContext("2d"); c.fillStyle="#fff"; c.fillRect(0,0,84,62);
      c.save(); c.translate(42,31); var k=46/110; c.scale(k,k); c.strokeStyle="#2a2a2a"; c.lineWidth=2.6/k; c.lineJoin="round"; c.lineCap="round"; try{ COLORING[id](c); }catch(e){} c.restore();
      var d=tileMedia(function(){ S.coloring=id; S.bg={type:"color",c:"#ffffff"}; S.style="paper"; redraw(); ov.classList.remove("show"); toast("Color it in! Try the Fill bucket."); }); d.appendChild(cv); wrap.appendChild(d); });
    ov.classList.add("show"); }
  function deviceId(){ var k="artstudio:device" ,v=localStorage.getItem(k); if(!v){ v="dev_"+Math.random().toString(36).slice(2)+Date.now().toString(36); localStorage.setItem(k,v); } return v; }
  function openGallery(){ var ov=document.getElementById("galleryOv"), wrap=document.getElementById("galleryWrap"); wrap.innerHTML="<p style='opacity:.7'>Loading…</p>"; ov.classList.add("show");
    fetch("/api/list-art?deviceId="+encodeURIComponent(deviceId())).then(function(r){return r.ok?r.json():null;}).then(function(j){ var arr=(j&&j.art)||[];
      if(!arr.length){ wrap.innerHTML="<p style='opacity:.85'>No saved art yet — make something and tap the heart!</p>"; return; } wrap.innerHTML="";
      arr.forEach(function(it){ var d=tileMedia(function(){ loadArt(it.art_id); ov.classList.remove("show"); }); if(it.thumbnail){ var im=new Image(); im.src=it.thumbnail; d.appendChild(im); } else d.appendChild(document.createTextNode((it.title||"Art").slice(0,12))); wrap.appendChild(d); });
    }).catch(function(){ wrap.innerHTML="<p style='opacity:.85'>Couldn't load your art.</p>"; }); }
  function loadArt(id){ fetch("/api/list-art?artId="+encodeURIComponent(id)).then(function(r){return r.ok?r.json():null;}).then(function(j){ var a=j&&j.art; if(!a||!a.art){ toast("Couldn't open that one."); return; }
    S.ops=(a.art.ops||[]).filter(function(o){return o.t;}); S.redo.length=0; if(a.art.style)S.style=a.art.style; if(a.art.bg)S.bg=a.art.bg; S.coloring=a.art.coloring||null; buildUI(); redraw(); autosave(); toast("Opened your art!"); }).catch(function(){ toast("Couldn't open that one."); }); }

  function doSave(){ var title=(document.getElementById("artTitle").value||"My masterpiece").slice(0,40), share=document.getElementById("shareChk").checked, image_b64="";
    try{ image_b64=paper.toDataURL("image/png"); }catch(e){}
    var payload={ art_id:"art_"+Date.now().toString(36)+Math.random().toString(36).slice(2,6), device_id:deviceId(), title:title, theme:(S.bg&&S.bg.name)||S.style||"rainbow", image_b64:image_b64, art:{ops:S.ops,bg:S.bg,style:S.style,coloring:S.coloring}, published:!!share };
    document.getElementById("saveOv").classList.remove("show"); playSfx("art_save"); celebrate();
    fetch("/api/save-art",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)}).then(function(r){ if(r.ok) toast(share?"Saved & shared with family!":"Saved to your gallery!"); else downloadFallback(image_b64,title); }).catch(function(){ downloadFallback(image_b64,title); }); }
  function downloadFallback(data,title){ if(!data){ toast("Saved!"); return; } try{ var a=document.createElement("a"); a.href=data; a.download=(title||"art").replace(/\s+/g,"_")+".png"; document.body.appendChild(a); a.click(); a.remove(); toast("Saved a copy to your device!"); }catch(e){ toast("Saved!"); } }
  var fxParts=[]; function celebrate(){ if(!BM||!BM.burst||!ctx) return; for(var i=0;i<6;i++) BM.burst(fxParts,Math.random()*paper.width,paper.height*0.4,"hsl("+(i*60)+",90%,60%)",14);
    var t0=Date.now(); (function loop(){ if(Date.now()-t0>900){ redraw(); return; } redraw(); BM.updateParticles(fxParts,1/60); BM.drawParticles(ctx,fxParts); requestAnimationFrame(loop); })(); }
  var _tt; function toast(m){ var t=document.getElementById("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(_tt); _tt=setTimeout(function(){ t.classList.remove("show"); },1800); }

  function wire(){
    paper.addEventListener("mousedown",down); paper.addEventListener("touchstart",down,{passive:false});
    window.addEventListener("mousemove",move); window.addEventListener("touchmove",move,{passive:false});
    window.addEventListener("mouseup",up); window.addEventListener("touchend",up);
    document.getElementById("undoBtn").onclick=undo; document.getElementById("redoBtn").onclick=redoOp;
    document.getElementById("clearBtn").onclick=function(){ document.getElementById("clearOv").classList.add("show"); };
    document.getElementById("saveBtn").onclick=function(){ document.getElementById("saveOv").classList.add("show"); };
    document.getElementById("clearNo").onclick=function(){ document.getElementById("clearOv").classList.remove("show"); };
    document.getElementById("clearYes").onclick=function(){ document.getElementById("clearOv").classList.remove("show"); clearAll(); playSfx("art_undo"); };
    document.getElementById("saveCancel").onclick=function(){ document.getElementById("saveOv").classList.remove("show"); };
    document.getElementById("saveGo").onclick=doSave;
    document.getElementById("stickClose").onclick=function(){ document.getElementById("stickOv").classList.remove("show"); };
    document.getElementById("shapeClose").onclick=function(){ document.getElementById("shapeOv").classList.remove("show"); };
    document.getElementById("bgClose").onclick=function(){ document.getElementById("bgOv").classList.remove("show"); };
    document.getElementById("colorClose").onclick=function(){ document.getElementById("colorOv").classList.remove("show"); };
    document.getElementById("galleryBtn").onclick=openGallery;
    document.getElementById("galleryClose").onclick=function(){ document.getElementById("galleryOv").classList.remove("show"); };
    document.getElementById("soundBtn").onclick=function(){ S.muted=!S.muted; try{ localStorage.setItem("artstudio:muted",S.muted?"1":"0"); }catch(e){}
      if(BA&&BA.toggleMute) try{BA.toggleMute();}catch(_){} setSound(); if(!S.muted) playSfx("pop"); };
    window.addEventListener("resize", fitCanvas);
  }
  function cap(t){ return '<span class="cap">'+t+'</span>'; }
  function setSound(){ document.getElementById("soundBtn").innerHTML=(S.muted?ICONS.soundOff:ICONS.soundOn)+cap("Sound"); }
  function paintStatic(){ document.getElementById("undoBtn").innerHTML=ICONS.undo+cap("Undo"); document.getElementById("redoBtn").innerHTML=ICONS.redo+cap("Redo");
    document.getElementById("clearBtn").innerHTML=ICONS.trash+cap("Clear"); document.getElementById("saveBtn").innerHTML=ICONS.heart+cap("Save");
    document.getElementById("galleryBtn").innerHTML=ICONS.gallery+cap("Mine"); setSound();
    document.getElementById("clearNo").innerHTML=ICONS.check; document.getElementById("clearYes").innerHTML=ICONS.trash;
    document.getElementById("saveCancel").innerHTML=ICONS.x; document.getElementById("saveGo").innerHTML=ICONS.heart;
    document.getElementById("stickClose").innerHTML=ICONS.check; document.getElementById("shapeClose").innerHTML=ICONS.check;
    document.getElementById("bgClose").innerHTML=ICONS.check; document.getElementById("colorClose").innerHTML=ICONS.check; document.getElementById("galleryClose").innerHTML=ICONS.x; }
  function init(){ try{ S.muted=localStorage.getItem("artstudio:muted")==="1"; }catch(e){} restoreWip(); buildUI(); paintStatic(); wire(); fitCanvas(); }
  if(document.readyState!=="loading") init(); else document.addEventListener("DOMContentLoaded", init);

  window.ART_GAME={ state:S, config:CFG,
    sim:function(){ var report={added:0,brushesUsed:[],mirrorsUsed:[],stylesUsed:[],hadFill:false,hadShape:false,undoOk:false,redoOk:false}, mirs=CFG.mirror, styles=CFG.styles;
      CFG.brushes.forEach(function(b,bi){ if(b.fill||b.stamp||b.shapes||b.erase) return; var m=mirs[bi%mirs.length], st=styles[bi%styles.length].id;
        S.ops.push({t:"stroke",brush:b.id,texture:b.texture||"smooth",color:CFG.palette[bi%CFG.palette.length],width:18,mirror:m,style:st,rainbow:!!b.rainbow,hueStart:0,erase:false,dynamic:!!b.dynamic,points:[{x:50,y:50,w:18},{x:120,y:90,w:10},{x:200,y:140,w:14}]});
        report.added++; report.brushesUsed.push(b.id); if(report.mirrorsUsed.indexOf(m)<0)report.mirrorsUsed.push(m); if(report.stylesUsed.indexOf(st)<0)report.stylesUsed.push(st); });
      S.ops.push({t:"stamp",shape:"star",x:90,y:90,size:70,color:"#ffd23f",mirror:4}); report.added++; report.hadShape=true;
      S.ops.push({t:"stamp",url:"data:fake",x:120,y:120,size:80,mirror:2}); report.added++;
      S.ops.push({t:"fill",x:10,y:10,color:"#3a86ff"}); report.added++; report.hadFill=true;
      S.ops.push({t:"stroke",brush:"eraser",texture:"smooth",color:"#000",width:24,mirror:1,style:"paper",erase:true,points:[{x:60,y:60},{x:90,y:90}]}); report.added++;
      var before=S.ops.length; S.redo.length=0; S.redo.push(S.ops.pop()); report.undoOk=(S.ops.length===before-1); S.ops.push(S.redo.pop()); report.redoOk=(S.ops.length===before);
      report.total=S.ops.length; report.allBrushesDrawable=report.brushesUsed.length>=9; return report; },
    roundtrip:function(){ var json=JSON.stringify({ops:S.ops,bg:S.bg,style:S.style}), n=S.ops.length, saved=S.ops.slice(); S.ops.length=0; var p=JSON.parse(json); S.ops=p.ops; S.style=p.style; S.bg=p.bg;
      return {ok:(S.ops.length===n&&JSON.stringify(S.ops)===JSON.stringify(saved)),count:S.ops.length,expected:n}; },
    reset:function(){ S.ops.length=0; S.redo.length=0; } };
})();
</script>
