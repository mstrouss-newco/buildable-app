<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Buildable Art Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --tray:#1a1444; --tray2:#241a52; --line:#3a2c6e; --accent:#9b7bff; --good:#7ee0a0; }
  html,body{margin:0;height:100%;background:#0b1030;overflow:hidden;touch-action:none;
    font-family:'Fredoka',-apple-system,sans-serif;color:#fff;-webkit-user-select:none;user-select:none}
  #app{position:fixed;inset:0;display:flex;flex-direction:column}
  #top{display:flex;align-items:center;gap:10px;padding:8px 12px 8px 92px;background:#120b30;flex:0 0 auto;z-index:5}
  #top .t{font-weight:700;font-size:20px;letter-spacing:.3px}
  .spacer{flex:1}
  #stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;padding:8px}
  #paper{background:#fff;border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.45);max-width:100%;max-height:100%;touch-action:none}
  /* ONE clean toolbar of big self-explanatory buttons; each shows the current choice */
  #tray{flex:0 0 auto;background:var(--tray);border-top:2px solid var(--line);padding:10px 10px 12px}
  .bar{display:flex;align-items:center;gap:10px;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .open{flex:0 0 auto;width:66px;height:66px;border-radius:18px;background:var(--tray2);border:3px solid var(--line);
    display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;position:relative}
  .open:active{transform:translateY(2px)}
  .open .cap{position:absolute;bottom:3px;left:0;right:0;text-align:center;font-size:10px;font-weight:600;color:#9b93d6}
  .open.act{width:58px;height:58px;border-radius:15px}
  .open.save{width:66px;height:66px;background:#fff0f5;border-color:#ff9bbb}
  .div{flex:0 0 auto;width:2px;height:42px;background:var(--line);border-radius:2px;margin:0 2px}
  .iconbtn{flex:0 0 auto;width:56px;height:56px;border-radius:16px;background:var(--tray2);border:3px solid var(--line);
    display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
  .iconbtn:active{transform:translateY(2px)}
  .iconbtn.big{width:64px;height:64px}
  .iconbtn.save{background:#fff0f5;border-color:#ff9bbb}
  .ov{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(8,6,24,.74)}
  .ov.show{display:flex}
  .card{background:linear-gradient(180deg,#1a1248,#241152);border:2px solid var(--line);border-radius:22px;
    padding:20px;max-width:94vw;max-height:88vh;overflow:auto;text-align:center}
  .card h2{margin:0 0 14px;font-size:22px}
  .pickwrap{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;max-width:640px}
  .pick{width:92px;height:92px;border-radius:16px;background:#241a52;border:3px solid var(--line);cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;overflow:hidden;color:#cfc8ff;font-weight:600;font-size:12px}
  .pick.media{background:#fff;color:#23204a}
  .pick.on{border-color:var(--good);box-shadow:0 0 0 2px rgba(126,224,160,.4)}
  .pick img{max-width:84px;max-height:62px}
  .pick canvas{width:84px;height:62px}
  .pick .nm{font-size:11px;font-weight:600}
  .sw{width:58px;height:58px;border-radius:50%;border:3px solid rgba(255,255,255,.3);cursor:pointer}
  .sw.on{border-color:#fff;box-shadow:0 0 0 3px var(--accent)}
  .tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
  .tab{font-weight:700;font-size:14px;color:#cdd0ff;background:#241a52;border:2px solid var(--line);border-radius:11px;padding:8px 15px;cursor:pointer}
  .tab.on{background:var(--accent);color:#1a0f3a;border-color:var(--accent)}
  #toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);opacity:0;transition:.25s;
    background:#2b1a66;border:2px solid var(--accent);color:#fff;font-weight:600;padding:10px 18px;border-radius:14px;z-index:40;pointer-events:none}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  input[type=text]{font-family:inherit;font-size:18px;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:#0f0a2c;color:#fff;width:260px;max-width:70vw;text-align:center}
  input[type=color]{width:58px;height:58px;border:none;background:none;border-radius:50%;cursor:pointer;padding:0}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div class="t">Art Studio</div>
    <div class="spacer"></div>
    <button class="iconbtn" id="galleryBtn" aria-label="My art"></button>
    <button class="iconbtn" id="soundBtn" aria-label="Sound"></button>
  </div>
  <div id="stage"><canvas id="paper"></canvas></div>
  <div id="tray"><div class="bar">
    <button class="open" id="brushBtn"  aria-label="Brush"><span class="cap">Brush</span></button>
    <button class="open" id="colorBtn"  aria-label="Color"><span class="cap">Color</span></button>
    <button class="open" id="sizeBtn"   aria-label="Size"><span class="cap">Size</span></button>
    <span class="div"></span>
    <button class="open" id="mirrorBtn" aria-label="Mirror"><span class="cap">Mirror</span></button>
    <button class="open" id="styleBtn"  aria-label="Style"><span class="cap">Style</span></button>
    <button class="open" id="stickerBtn" aria-label="Stickers"><span class="cap">Stickers</span></button>
    <button class="open" id="bgBtn"     aria-label="Background"><span class="cap">Scene</span></button>
    <span class="spacer"></span>
    <button class="open act" id="undoBtn"  aria-label="Undo"></button>
    <button class="open act" id="redoBtn"  aria-label="Redo"></button>
    <button class="open act" id="clearBtn" aria-label="Start over"></button>
    <button class="open save" id="saveBtn" aria-label="Save"></button>
  </div></div>
</div>

<!-- generic picker (brush / color / size / mirror / style) -->
<div class="ov" id="pickOv"><div class="card">
  <h2 id="pickTitle"></h2>
  <div class="pickwrap" id="pickGrid"></div>
  <div style="margin-top:16px"><button class="iconbtn big" id="pickClose" aria-label="Close"></button></div>
</div></div>

<div class="ov" id="clearOv"><div class="card">
  <h2>Start over?</h2>
  <div style="margin:6px 0 4px"><button class="iconbtn big" id="clearNo" aria-label="Keep my drawing" style="background:#10391f;border-color:#3DD06A"></button>
  <button class="iconbtn big" id="clearYes" aria-label="Start over" style="background:#3a1430;border-color:#ff7a90"></button></div>
</div></div>

<div class="ov" id="stickOv"><div class="card">
  <h2>Stickers</h2><div class="tabs" id="stickTabs"></div>
  <div class="pickwrap" id="stickWrap"></div>
  <div style="margin-top:16px"><button class="iconbtn big" id="stickClose" aria-label="Done"></button></div>
</div></div>

<div class="ov" id="shapeOv"><div class="card">
  <h2>Shapes</h2><div class="pickwrap" id="shapeWrap"></div>
  <div style="margin-top:16px"><button class="iconbtn big" id="shapeClose" aria-label="Done"></button></div>
</div></div>

<div class="ov" id="bgOv"><div class="card">
  <h2>Scene</h2><div class="pickwrap" id="bgWrap"></div>
  <div style="margin-top:16px"><button class="iconbtn big" id="bgClose" aria-label="Done"></button></div>
</div></div>

<div class="ov" id="galleryOv"><div class="card">
  <h2>My Art</h2><div class="pickwrap" id="galleryWrap"></div>
  <div style="margin-top:16px"><button class="iconbtn big" id="galleryClose" aria-label="Close"></button></div>
</div></div>

<div class="ov" id="saveOv"><div class="card">
  <h2>Save your art</h2>
  <input type="text" id="artTitle" placeholder="My masterpiece" maxlength="40"><br><br>
  <label style="display:block;margin:6px 0 16px;font-size:15px;opacity:.85"><input type="checkbox" id="shareChk"> Also show my family</label>
  <div><button class="iconbtn big" id="saveCancel" aria-label="Not yet"></button>
  <button class="iconbtn save big" id="saveGo" aria-label="Save it"></button></div>
</div></div>

<div id="toast"></div>

<script src="/buildable-renders.js"></script>
<script src="/buildable-audio.js"></script>
<script src="/buildable-mechanics.js"></script>
<script>
(function(){
  "use strict";
  var BR=window.BuildableRenders, BA=window.BuildableAudio, BM=window.BuildableMechanics;

  var CFG = window.STUDIO_CONFIG || {
    brushes:[
      {id:"crayon",name:"Crayon",sound:"art_crayon",texture:"waxy"},
      {id:"marker",name:"Marker",sound:"art_marker",texture:"smooth"},
      {id:"paint", name:"Paint", sound:"art_paint", texture:"wet"},
      {id:"pencil",name:"Pencil",sound:"art_pencil",texture:"fine"},
      {id:"chalk", name:"Chalk", sound:"art_chalk", texture:"grain"},
      {id:"spray", name:"Spray", sound:"art_spray", texture:"spray"},
      {id:"neon",  name:"Neon",  sound:"art_neon",  texture:"glow"},
      {id:"ribbon",name:"Ribbon",sound:"art_marker",texture:"ribbon",dynamic:true},
      {id:"fur",   name:"Fur",   sound:"art_chalk", texture:"fur"},
      {id:"dots",  name:"Sponge",sound:"art_spray", texture:"dots"},
      {id:"rainbow",name:"Rainbow",sound:"art_marker",texture:"smooth",rainbow:true},
      {id:"glitter",name:"Glitter",sound:"art_glitter",texture:"smooth",fx:"twinkle"},
      {id:"shapes",name:"Shapes",sound:"art_stamp",shapes:true},
      {id:"fill",  name:"Fill",  sound:"art_fill", fill:true},
      {id:"eraser",name:"Eraser",sound:"art_undo", erase:true}
    ],
    palette:["#ff4d4d","#ff8a3d","#ffd23f","#7ee0a0","#2ec4b6","#3a86ff","#8338ec","#ff70a6","#9b5e3c","#000000","#ffffff"],
    sizes:[6,16,30,50,72],
    mirror:[1,"V","H",2,4,8],
    styles:[
      {id:"paper",name:"Paper",bg:{type:"color",c:"#ffffff"}},
      {id:"chalk",name:"Chalk",bg:{type:"color",c:"#243240"}},
      {id:"neon", name:"Neon", bg:{type:"color",c:"#0a0a1e"}},
      {id:"3d",   name:"3D Pop",bg:{type:"color",c:"#eef0f7"}},
      {id:"pixel",name:"Pixel",bg:{type:"color",c:"#ffffff"}}
    ],
    shapes:["star","heart","flower","diamond","dot"],
    backgrounds:[
      {type:"color",c:"#ffffff",name:"White"},{type:"color",c:"#0a0a1e",name:"Night"},
      {type:"color",c:"#243240",name:"Slate"},{type:"color",c:"#fff7e6",name:"Cream"},
      {type:"color",c:"#eafff2",name:"Mint"},{type:"color",c:"#ffeaf2",name:"Blush"},
      {type:"grad",from:"#89f7fe",to:"#66a6ff",name:"Sky"},{type:"grad",from:"#fbc2eb",to:"#a18cd1",name:"Candy"},
      {type:"grad",from:"#0a0a2e",to:"#3a1c71",name:"Galaxy"},{type:"grad",from:"#0f3d3e",to:"#136a4a",name:"Forest"}
    ],
    stickerThemes:["all","forest","ocean","space","candy"]
  };

  var S={ brush:CFG.brushes[0], color:CFG.palette[0], size:18, mirror:1, style:"paper",
    bg:CFG.styles[0].bg, ops:[], redo:[], sticker:null, shape:"star", hue:0, muted:false, recent:[] };
  var Q=10;

  var paper=document.getElementById("paper"), ctx=paper.getContext?paper.getContext("2d"):null, stage=document.getElementById("stage");
  function fitCanvas(){ if(!paper.getBoundingClientRect) return; var r=stage.getBoundingClientRect();
    paper.width=Math.max(200,Math.floor(r.width-16)); paper.height=Math.max(200,Math.floor(r.height-16));
    paper.style.width=paper.width+"px"; paper.style.height=paper.height+"px"; redraw(); }

  // ---- sound ----
  var _snd={};
  function playSfx(name){ if(S.muted||!name) return; try{ var a=_snd[name]; if(!a){ a=new Audio("/api/sfx?s="+encodeURIComponent(name)); a.volume=.5; _snd[name]=a; } a.currentTime=0; a.play().catch(function(){}); }catch(e){} }
  var _ls=0; function playStrokeSfx(n){ var t=Date.now(); if(t-_ls<90) return; _ls=t; playSfx(n); }

  // ---- background + strokes ----
  function drawBg(c){ if(!c) return; c.save(); c.globalCompositeOperation="source-over"; var bg=S.bg||{type:"color",c:"#fff"};
    if(bg.type==="grad"){ var g=c.createLinearGradient(0,0,0,paper.height); g.addColorStop(0,bg.from); g.addColorStop(1,bg.to); c.fillStyle=g; } else c.fillStyle=bg.c||"#fff";
    c.fillRect(0,0,paper.width,paper.height); c.restore(); }
  function rainbowCol(op,i){ return "hsl("+((op.hueStart+i*6)%360)+",85%,55%)"; }
  function quant(pts){ return pts.map(function(p){ return {x:Math.round(p.x/Q)*Q,y:Math.round(p.y/Q)*Q,w:p.w}; }); }
  function baseStroke(c,op,color){ var pts=op.points;
    if(op.rainbow){ for(var i=1;i<pts.length;i++) BR.stroke(c,{texture:op.texture,points:[pts[i-1],pts[i]],color:color||rainbowCol(op,i),width:op.width,alpha:1}); }
    else BR.stroke(c,{texture:op.texture,points:pts,color:color||op.color,width:op.width,alpha:1}); }
  function styledStroke(c,op){ var st=op.style||"paper", save=op.points;
    if(st==="pixel") op.points=quant(op.points);
    c.save(); c.lineCap=st==="pixel"?"butt":"round"; c.lineJoin=st==="pixel"?"miter":"round";
    if(op.erase){ c.globalCompositeOperation="destination-out"; baseStroke(c,op,"#000"); c.restore(); op.points=save; return; }
    if(st==="neon"){ c.shadowColor=op.color; c.shadowBlur=Math.max(8,op.width*1.4); baseStroke(c,op); baseStroke(c,op); }
    else if(st==="3d"){ c.save(); c.translate(3,4); baseStroke(c,op,"rgba(0,0,0,0.18)"); c.restore(); baseStroke(c,op);
      c.save(); c.translate(-1,-1); c.globalAlpha=.5; baseStroke(c,op,"rgba(255,255,255,0.55)"); c.restore(); }
    else baseStroke(c,op);
    c.restore(); op.points=save; }
  function drawStrokeMir(c,op){ if(!c||!op.points||!op.points.length) return; BR.mirror(c,op.mirror||1,paper.width,paper.height,function(){ styledStroke(c,op); }); }
  function drawStampMir(c,op){ if(!c) return;
    if(op.shape){ BR.mirror(c,op.mirror||1,paper.width,paper.height,function(){ BR.shape(c,op.shape,op.x,op.y,op.size,op.color); }); return; }
    var img=stampCache[op.url]; if(!img){ loadStamp(op.url,function(){ redraw(); }); return; } if(!(img.naturalWidth||img.width)) return;
    var sz=op.size; BR.mirror(c,op.mirror||1,paper.width,paper.height,function(){ try{ c.drawImage(img,op.x-sz/2,op.y-sz/2,sz,sz); }catch(e){} }); }
  function hexToRgb(h){ if(!h) return null; if(h[0]==="#") h=h.slice(1); if(h.length===3) h=h.split("").map(function(x){return x+x;}).join(""); var n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255]; }
  function floodFill(c,x,y,hex){ if(!c||!c.getImageData) return; x=x|0;y=y|0; var W=paper.width,H=paper.height,id; try{ id=c.getImageData(0,0,W,H); }catch(e){ return; } var d=id.data;
    var si=(y*W+x)*4, tgt=[d[si],d[si+1],d[si+2],d[si+3]], col=hexToRgb(hex); if(!col) return;
    if(Math.abs(col[0]-tgt[0])+Math.abs(col[1]-tgt[1])+Math.abs(col[2]-tgt[2])<8&&tgt[3]>250) return;
    var tol=40, stack=[si], guard=0, max=W*H+10;
    function match(i){ return Math.abs(d[i]-tgt[0])<=tol&&Math.abs(d[i+1]-tgt[1])<=tol&&Math.abs(d[i+2]-tgt[2])<=tol&&Math.abs(d[i+3]-tgt[3])<=tol; }
    while(stack.length&&guard++<max){ var i=stack.pop(); if(i<0||i>=d.length||!match(i)) continue;
      d[i]=col[0];d[i+1]=col[1];d[i+2]=col[2];d[i+3]=255; var px=(i/4)%W;
      stack.push(i+4*W);stack.push(i-4*W); if(px>0)stack.push(i-4); if(px<W-1)stack.push(i+4); }
    c.putImageData(id,0,0); }
  function redraw(){ if(!ctx) return; drawBg(ctx);
    for(var i=0;i<S.ops.length;i++){ var op=S.ops[i];
      if(op.t==="stroke") drawStrokeMir(ctx,op); else if(op.t==="stamp") drawStampMir(ctx,op); else if(op.t==="fill") floodFill(ctx,op.x,op.y,op.color); } }

  var stampCache={};
  function loadStamp(url,cb){ if(stampCache[url]&&stampCache[url]._done){ cb&&cb(); return; }
    var img=new Image(); img.crossOrigin="anonymous"; img.onload=function(){ img._done=true; stampCache[url]=img; cb&&cb(); };
    img.onerror=function(){ img._done=true; stampCache[url]=img; cb&&cb(); }; img.src=url; stampCache[url]=img; }

  function pushOp(op){ S.ops.push(op); S.redo.length=0; autosave(); }
  function undo(){ if(!S.ops.length) return; S.redo.push(S.ops.pop()); redraw(); playSfx("art_undo"); autosave(); }
  function redoOp(){ if(!S.redo.length) return; S.ops.push(S.redo.pop()); redraw(); autosave(); }
  function clearAll(){ S.ops.length=0; S.redo.length=0; redraw(); autosave(); }

  var drawing=false,cur=null,lastP=null,lastT=0;
  function pos(e){ var r=paper.getBoundingClientRect(); var cx=e.touches?e.touches[0].clientX:e.clientX, cy=e.touches?e.touches[0].clientY:e.clientY;
    return {x:(cx-r.left)*(paper.width/r.width),y:(cy-r.top)*(paper.height/r.height)}; }
  function withW(p){ if(!S.brush.dynamic) return {x:p.x,y:p.y}; return {x:p.x,y:p.y,w:S.size}; }
  function down(e){ e.preventDefault(); if(BA&&BA.unlock) try{BA.unlock();}catch(_){}
    var p=pos(e);
    if(S.brush.fill){ var f={t:"fill",x:p.x,y:p.y,color:S.color}; pushOp(f); floodFill(ctx,p.x,p.y,S.color); playSfx("art_fill"); return; }
    if(S.brush.shapes){ var so={t:"stamp",shape:S.shape,x:p.x,y:p.y,size:Math.max(40,S.size*2.6),color:S.color,mirror:S.mirror}; pushOp(so); drawStampMir(ctx,so); playSfx("art_stamp"); return; }
    if(S.brush.stamp){ if(!S.sticker){ openStickers(); return; } var st={t:"stamp",url:S.sticker.url,x:p.x,y:p.y,size:Math.max(40,S.size*2.6),mirror:S.mirror}; pushOp(st); drawStampMir(ctx,st); playSfx("art_stamp"); return; }
    drawing=true; lastP=p; lastT=Date.now();
    cur={t:"stroke",brush:S.brush.id,texture:S.brush.texture||"smooth",color:S.color,width:S.size,mirror:S.mirror,style:S.style,
      rainbow:!!S.brush.rainbow,hueStart:S.hue,erase:!!S.brush.erase,dynamic:!!S.brush.dynamic,points:[withW(p)]}; }
  function move(e){ if(!drawing) return; e.preventDefault(); var p=pos(e);
    if(cur.dynamic){ var dt=Math.max(8,Date.now()-lastT), dist=Math.hypot(p.x-lastP.x,p.y-lastP.y), sp=dist/dt, w=Math.max(3,S.size*(1.5-Math.min(1,sp*5))); p={x:p.x,y:p.y,w:w}; lastT=Date.now(); }
    var prev=cur.points[cur.points.length-1]; cur.points.push(p);
    drawStrokeMir(ctx,{texture:cur.texture,color:cur.rainbow?rainbowCol(cur,cur.points.length):cur.color,width:cur.width,mirror:cur.mirror,style:cur.style,rainbow:false,erase:cur.erase,points:[prev,p]});
    if(cur.rainbow) S.hue=(S.hue+3)%360; if(S.brush.fx==="twinkle") sparkleAt(p); lastP=p; playStrokeSfx(S.brush.sound); }
  function up(){ if(!drawing) return; drawing=false; if(cur&&cur.points.length){ pushOp(cur); redraw(); } cur=null; }
  function sparkleAt(p){ if(!ctx) return; for(var k=0;k<5;k++){ var ang=Math.random()*7, rr=Math.random()*S.size*1.4;
    ctx.save(); ctx.globalAlpha=.9; ctx.fillStyle="hsl("+((S.hue+k*40)%360)+",90%,65%)";
    if(BR.sparkle) BR.sparkle(ctx,p.x+Math.cos(ang)*rr,p.y+Math.sin(ang)*rr,4,Date.now()/120); else{ ctx.beginPath(); ctx.arc(p.x+Math.cos(ang)*rr,p.y+Math.sin(ang)*rr,1.6,0,7); ctx.fill(); } ctx.restore(); } S.hue=(S.hue+12)%360; }

  function autosave(){ try{ localStorage.setItem("artstudio:wip",JSON.stringify({ops:S.ops,style:S.style,bg:S.bg})); }catch(e){} }
  function restoreWip(){ try{ var w=JSON.parse(localStorage.getItem("artstudio:wip")||"null");
    if(w&&w.ops){ S.ops=w.ops.filter(function(o){return o.t==="stroke"||o.t==="stamp"||o.t==="fill";}); if(w.style)S.style=w.style; if(w.bg)S.bg=w.bg; } }catch(e){} }

  // ---------- icons ----------
  function ic(inner,w){ w=w||34; return '<svg width="'+w+'" height="'+w+'" viewBox="0 0 32 32" fill="none">'+inner+'</svg>'; }
  function bsvg(inner){ return '<svg width="40" height="40" viewBox="0 0 32 32">'+inner+'</svg>'; }
  var ICONS={
    gallery: ic('<rect x="6" y="9" width="20" height="15" rx="2.5" stroke="#dcd6ff" stroke-width="2.4"/><circle cx="12" cy="14" r="2.2" fill="#ffd23f"/><path d="M7 22 l5-4 4 3 3-2 6 5" stroke="#7ee0a0" stroke-width="2.2" stroke-linejoin="round"/>',30),
    soundOn: ic('<path d="M7 13 H11 L16 8 V24 L11 19 H7 Z" fill="#dcd6ff"/><path d="M20 12 q3 4 0 8 M23.5 9 q6 7 0 14" stroke="#7ee0a0" stroke-width="2.2" stroke-linecap="round"/>',30),
    soundOff: ic('<path d="M7 13 H11 L16 8 V24 L11 19 H7 Z" fill="#9b93d6"/><path d="M21 12 l7 8 M28 12 l-7 8" stroke="#ff7a90" stroke-width="2.6" stroke-linecap="round"/>',30),

  function loadStickers(theme){ var wrap=document.getElementById("stickWrap"); if(stickerCache[theme]){ renderStickers(wrap,stickerCache[theme]); return; }
    wrap.innerHTML="<p style='opacity:.7'>Loading…</p>"; var q=theme==="all"?"":("&theme="+encodeURIComponent(theme));

      fetch("/api/list-assets?limit=16"+q).then(function(r){return r.ok?r.json():[];}).catch(function(){return [];}) ])
      .then(function(res){ var items=normalize(res[0]).concat(normalize(res[1])).filter(function(x){return x.url;}); if(!items.length){ drawnFallback(wrap); return; } stickerCache[theme]=items; renderStickers(wrap,items); })

      var mirs=CFG.mirror, styles=CFG.styles;
      CFG.brushes.forEach(function(b,bi){ if(b.fill||b.stamp||b.shapes||b.erase) return; var m=mirs[bi%mirs.length], st=styles[bi%styles.length].id;
        S.ops.push({t:"stroke",brush:b.id,texture:b.texture||"smooth",color:CFG.palette[bi%CFG.palette.length],width:18,mirror:m,style:st,rainbow:!!b.rainbow,hueStart:0,erase:false,dynamic:!!b.dynamic,points:[{x:50,y:50,w:18},{x:120,y:90,w:10},{x:200,y:140,w:14}]});
        report.added++; report.brushesUsed.push(b.id); if(report.mirrorsUsed.indexOf(m)<0)report.mirrorsUsed.push(m); if(report.stylesUsed.indexOf(st)<0)report.stylesUsed.push(st); });
      S.ops.push({t:"stamp",shape:"star",x:90,y:90,size:70,color:"#ffd23f",mirror:4}); report.added++; report.hadShape=true;
      S.ops.push({t:"stamp",url:"data:fake",x:120,y:120,size:80,mirror:2}); report.added++;
      S.ops.push({t:"fill",x:10,y:10,color:"#3a86ff"}); report.added++; report.hadFill=true;
      S.ops.push({t:"stroke",brush:"eraser",texture:"smooth",color:"#000",width:24,mirror:1,style:"paper",erase:true,points:[{x:60,y:60},{x:90,y:90}]}); report.added++;
      var before=S.ops.length; S.redo.length=0; S.redo.push(S.ops.pop()); report.undoOk=(S.ops.length===before-1); S.ops.push(S.redo.pop()); report.redoOk=(S.ops.length===before);
      report.total=S.ops.length; report.allBrushesDrawable=report.brushesUsed.length>=9; return report; },
    roundtrip:function(){ var json=JSON.stringify({ops:S.ops,bg:S.bg,style:S.style}), n=S.ops.length, saved=S.ops.slice();
      S.ops.length=0; var p=JSON.parse(json); S.ops=p.ops; S.style=p.style; S.bg=p.bg;
      return {ok:(S.ops.length===n&&JSON.stringify(S.ops)===JSON.stringify(saved)),count:S.ops.length,expected:n}; },
    reset:function(){ S.ops.length=0; S.redo.length=0; } };
})();
</script>
