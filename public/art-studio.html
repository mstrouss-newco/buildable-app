<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Buildable Art Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --tray:#1a1444; --tray2:#241a52; --line:#3a2c6e; --accent:#9b7bff; --good:#7ee0a0; }
  html,body{margin:0;height:100%;background:#0b1030;overflow:hidden;touch-action:none;
    font-family:'Fredoka',-apple-system,sans-serif;color:#fff;-webkit-user-select:none;user-select:none}
  #app{position:fixed;inset:0;display:flex;flex-direction:column}
  /* top bar */
  #top{display:flex;align-items:center;gap:10px;padding:8px 12px 8px 92px;background:#120b30;flex:0 0 auto;z-index:5}
  #top .t{font-weight:700;font-size:20px;letter-spacing:.3px}
  .icbtn{font-family:inherit;font-weight:700;font-size:15px;color:#dcd6ff;background:var(--tray2);
    border:2px solid var(--line);border-radius:12px;padding:8px 14px;cursor:pointer}
  .icbtn:active{transform:translateY(2px)}
  .spacer{flex:1}
  /* stage */
  #stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;padding:8px}
  #paper{background:#fff;border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.45);max-width:100%;max-height:100%;touch-action:none}
  /* bottom tray */
  #tray{flex:0 0 auto;background:var(--tray);border-top:2px solid var(--line);padding:8px 8px 10px}
  .row{display:flex;align-items:center;gap:8px;overflow-x:auto;padding:4px 2px;-webkit-overflow-scrolling:touch}
  .tool{flex:0 0 auto;width:60px;height:58px;border-radius:14px;background:var(--tray2);border:3px solid var(--line);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;color:#cfc8ff}
  .tool.on{border-color:var(--good);box-shadow:0 0 0 2px rgba(126,224,160,.35);color:#fff}
  .tool .lab{font-size:11px;font-weight:600}
  .tool svg{display:block}
  .sw{flex:0 0 auto;width:38px;height:38px;border-radius:50%;border:3px solid rgba(255,255,255,.25);cursor:pointer}
  .sw.on{border-color:#fff;box-shadow:0 0 0 2px var(--accent)}
  .mir{flex:0 0 auto;min-width:44px;height:40px;border-radius:12px;background:var(--tray2);border:2px solid var(--line);
    color:#cfc8ff;font-weight:700;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;padding:0 10px}
  .mir.on{border-color:var(--good);color:#fff}
  #size{width:140px;flex:0 0 auto}
  .grp{display:flex;align-items:center;gap:8px;flex:0 0 auto}
  .sec{font-size:11px;color:#9b93d6;font-weight:600;margin:0 2px 0 6px;flex:0 0 auto;text-transform:uppercase;letter-spacing:.4px}
  .btn{font-family:inherit;font-weight:700;font-size:16px;color:#1a0f3a;background:var(--accent);border:none;
    border-radius:14px;padding:10px 18px;cursor:pointer;box-shadow:0 5px 0 #6a4ad6;flex:0 0 auto}
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 #6a4ad6}
  .btn.save{background:var(--good);box-shadow:0 5px 0 #3da86a}
  .btn.ghost{background:var(--tray2);color:#dcd6ff;box-shadow:0 5px 0 #15103a}
  /* overlays */
  .ov{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(8,6,24,.72)}
  .ov.show{display:flex}
  .card{background:linear-gradient(180deg,#1a1248,#241152);border:2px solid var(--line);border-radius:20px;
    padding:22px;max-width:90vw;max-height:84vh;overflow:auto;text-align:center}
  .card h2{margin:0 0 4px;font-size:24px}
  .card p{margin:0 0 16px;opacity:.8}
  .stickwrap{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:560px}
  .stick{width:78px;height:78px;border-radius:14px;background:#fff;border:3px solid var(--line);cursor:pointer;
    display:flex;align-items:center;justify-content:center;overflow:hidden}
  .stick.on{border-color:var(--good)}
  .stick img{max-width:100%;max-height:100%}
  .stick canvas{width:100%;height:100%}
  #toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%) translateY(20px);opacity:0;transition:.25s;
    background:#2b1a66;border:2px solid var(--accent);color:#fff;font-weight:600;padding:10px 18px;border-radius:14px;z-index:40;pointer-events:none}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  input[type=text]{font-family:inherit;font-size:18px;padding:12px 14px;border-radius:12px;border:2px solid var(--line);
    background:#0f0a2c;color:#fff;width:260px;max-width:70vw;text-align:center}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div class="t">Art Studio</div>
    <div class="spacer"></div>
    <button class="icbtn" id="soundBtn">Sound: On</button>
  </div>
  <div id="stage"><canvas id="paper"></canvas></div>
  <div id="tray">
    <div class="row" id="brushRow"></div>
    <div class="row" id="colorRow"></div>
    <div class="row" id="ctrlRow">
      <span class="sec">Size</span><input type="range" id="size" min="2" max="80" value="18">
      <span class="sec">Mirror</span><span id="mirRow" class="grp"></span>
      <span class="spacer" style="flex:1"></span>
      <button class="btn ghost" id="undoBtn">Undo</button>
      <button class="btn ghost" id="redoBtn">Redo</button>
      <button class="btn ghost" id="clearBtn">Clear</button>
      <button class="btn save" id="saveBtn">Save</button>
    </div>
  </div>
</div>

<!-- confirm clear -->
<div class="ov" id="clearOv"><div class="card">
  <h2>Clear everything?</h2><p>Your drawing will be wiped. This can't be undone.</p>
  <button class="btn ghost" id="clearNo">Keep it</button>
  <button class="btn" id="clearYes" style="background:#ff7a90;box-shadow:0 5px 0 #c9536a">Yes, clear</button>
</div></div>

<!-- sticker picker -->
<div class="ov" id="stickOv"><div class="card">
  <h2>Pick a sticker</h2><p>Tap a sticker, then tap the paper to stamp it.</p>
  <div class="stickwrap" id="stickWrap"></div>
  <div style="margin-top:16px"><button class="btn ghost" id="stickClose">Done</button></div>
</div></div>

<!-- save dialog -->
<div class="ov" id="saveOv"><div class="card">
  <h2>Save your art</h2><p>Give it a name so you can find it later.</p>
  <input type="text" id="artTitle" placeholder="My masterpiece" maxlength="40"><br><br>
  <label style="display:block;margin:6px 0 16px;font-size:15px;opacity:.85">
    <input type="checkbox" id="shareChk"> Also show my family</label>
  <div><button class="btn ghost" id="saveCancel">Not yet</button>
  <button class="btn save" id="saveGo">Save it!</button></div>
</div></div>

<div id="toast"></div>

<script src="/buildable-renders.js"></script>
<script src="/buildable-audio.js"></script>
<script src="/buildable-mechanics.js"></script>
<script>
(function(){
  "use strict";
  var BR = window.BuildableRenders, BA = window.BuildableAudio, BM = window.BuildableMechanics;

  // ---------- config (data, not code) ----------
  var STUDIO_CONFIG = window.STUDIO_CONFIG || {
    brushes: [
      { id:"crayon",  name:"Crayon",  sound:"art_crayon", texture:"waxy"   },
      { id:"marker",  name:"Marker",  sound:"art_marker", texture:"smooth" },
      { id:"paint",   name:"Paint",   sound:"art_paint",  texture:"wet"    },
      { id:"pencil",  name:"Pencil",  sound:"art_pencil", texture:"fine"   },
      { id:"chalk",   name:"Chalk",   sound:"art_chalk",  texture:"grain"  },
      { id:"spray",   name:"Spray",   sound:"art_spray",  texture:"spray"  },
      { id:"neon",    name:"Neon",    sound:"art_neon",   texture:"glow"   },
      { id:"rainbow", name:"Rainbow", sound:"art_marker", texture:"smooth", rainbow:true },
      { id:"glitter", name:"Glitter", sound:"art_glitter",texture:"smooth", fx:"twinkle" },
      { id:"sticker", name:"Sticker", sound:"art_stamp",  stamp:true },
      { id:"eraser",  name:"Eraser",  sound:"art_undo",   erase:true  }
    ],
    palette: ["#ff4d4d","#ff8a3d","#ffd23f","#7ee0a0","#2ec4b6","#3a86ff","#8338ec","#ff70a6","#9b5e3c","#000000","#ffffff"],
    mirror: [1,2,4,8],
    bg: "#ffffff"
  };

  // ---------- state ----------
  var S = {
    brush: STUDIO_CONFIG.brushes[0],
    color: STUDIO_CONFIG.palette[0],
    size: 18,
    mirror: 1,
    ops: [],          // committed drawing ops (the replayable recipe)
    redo: [],
    sticker: null,    // {url,img}  currently selected sticker
    hue: 0,
    muted: false
  };

  // ---------- DOM ----------
  var paper = document.getElementById("paper");
  var ctx = paper.getContext ? paper.getContext("2d") : null;
  var stage = document.getElementById("stage");

  function fitCanvas(){
    if(!paper.getBoundingClientRect) return;
    var r = stage.getBoundingClientRect();
    var w = Math.max(200, Math.floor(r.width  - 16));
    var h = Math.max(200, Math.floor(r.height - 16));
    paper.width = w; paper.height = h;
    paper.style.width = w+"px"; paper.style.height = h+"px";
    redraw();
  }

  // ---------- sound ----------
  var _snd = {};
  function playSfx(name){
    if(S.muted || !name) return;
    try{
      var a = _snd[name];
      if(!a){ a = new Audio("/api/sfx?s="+encodeURIComponent(name)); a.volume=0.5; _snd[name]=a; }
      a.currentTime = 0; a.play().catch(function(){});
    }catch(e){}
  }
  var _lastStroke = 0;
  function playStrokeSfx(name){ var t=Date.now(); if(t-_lastStroke<120) return; _lastStroke=t; playSfx(name); }

  // ---------- drawing helpers ----------
  function strokeColor(op, i){
    if(op.rainbow){ return "hsl("+((op.hueStart + i*6)%360)+",85%,55%)"; }
    return op.color;
  }
  // draw one full stroke op (used on redraw)
  function drawStroke(c, op){
    if(!c || !op.points || !op.points.length) return;
    var n = S.mirror===op.mirror ? op.mirror : op.mirror; // op carries its own mirror
    var W = paper.width, H = paper.height;
    function paint(){
      if(op.erase){
        c.save(); c.globalCompositeOperation="destination-out";
        BR.stroke(c, {texture:"smooth", points:op.points, color:"#000", width:op.width, alpha:1});
        c.restore(); return;
      }
      if(op.rainbow){
        for(var i=1;i<op.points.length;i++){
          BR.stroke(c, {texture:op.texture, points:[op.points[i-1],op.points[i]], color:strokeColor(op,i), width:op.width, alpha:1});
        }
      } else {
        BR.stroke(c, {texture:op.texture, points:op.points, color:op.color, width:op.width, alpha:1});
      }
    }
    if(BR.mirror) BR.mirror(c, op.mirror||1, W, H, paint); else paint();
  }
  function drawStamp(c, op){
    if(!c) return;
    var img = stampCache[op.url];
    if(!img){ loadStamp(op.url, function(){ redraw(); }); return; }
    if(!(img.naturalWidth||img.width)) return;
    var W=paper.width,H=paper.height,sz=op.size;
    function paint(){ try{ c.drawImage(img, op.x-sz/2, op.y-sz/2, sz, sz); }catch(e){} }
    if(BR.mirror) BR.mirror(c, op.mirror||1, W, H, paint); else paint();
  }
  function redraw(){
    if(!ctx) return;
    ctx.save(); ctx.globalCompositeOperation="source-over";
    ctx.fillStyle = STUDIO_CONFIG.bg; ctx.fillRect(0,0,paper.width,paper.height);
    ctx.restore();
    for(var i=0;i<S.ops.length;i++){ var op=S.ops[i];
      if(op.t==="stroke") drawStroke(ctx, op);
      else if(op.t==="stamp") drawStamp(ctx, op);
    }
  }

  // ---------- stamps ----------
  var stampCache = {};
  function loadStamp(url, cb){
    if(stampCache[url]){ cb && cb(); return; }
    var img = new Image(); img.crossOrigin="anonymous";
    img.onload = function(){ stampCache[url]=img; cb&&cb(); };
    img.onerror = function(){ stampCache[url]=img; cb&&cb(); };
    img.src = url; stampCache[url]=img;
  }

  // ---------- ops / undo ----------
  function pushOp(op){ S.ops.push(op); S.redo.length=0; autosave(); }
  function undo(){ if(!S.ops.length) return; S.redo.push(S.ops.pop()); redraw(); playSfx("art_undo"); autosave(); }
  function redoOp(){ if(!S.redo.length) return; S.ops.push(S.redo.pop()); redraw(); autosave(); }
  function clearAll(){ if(S.ops.length) S.ops.push({t:"clearmark"}); S.ops.length=0; S.redo.length=0; redraw(); autosave(); }

  // ---------- pointer drawing ----------
  var drawing=false, cur=null;
  function pos(e){
    var r=paper.getBoundingClientRect();
    var cx = e.touches? e.touches[0].clientX : e.clientX;
    var cy = e.touches? e.touches[0].clientY : e.clientY;
    return { x:(cx-r.left)*(paper.width/r.width), y:(cy-r.top)*(paper.height/r.height) };
  }
  function down(e){
    e.preventDefault();
    if(BA && BA.unlock) try{BA.unlock();}catch(_){}
    var p = pos(e);
    if(S.brush.stamp){
      if(!S.sticker){ openStickers(); return; }
      var op={t:"stamp", url:S.sticker.url, x:p.x, y:p.y, size:Math.max(40,S.size*2.6), mirror:S.mirror};
      pushOp(op); drawStamp(ctx, op); playSfx("art_stamp");
      if(BM&&BM.burst){ /* tiny pop handled visually elsewhere */ }
      return;
    }
    drawing=true;
    cur={ t:"stroke", brush:S.brush.id, texture:S.brush.texture||"smooth",
          color:S.color, width:S.size, mirror:S.mirror,
          rainbow:!!S.brush.rainbow, hueStart:S.hue, erase:!!S.brush.erase, points:[p] };
  }
  function move(e){
    if(!drawing) return; e.preventDefault();
    var p=pos(e); var pts=cur.points; var prev=pts[pts.length-1];
    pts.push(p);
    // live incremental draw of the last segment (cheap + smooth)
    var seg={ t:"stroke", texture:cur.texture, color: cur.rainbow? strokeColor({rainbow:true,hueStart:cur.hueStart}, pts.length): cur.color,
              width:cur.width, mirror:cur.mirror, rainbow:false, erase:cur.erase, points:[prev,p] };
    drawStroke(ctx, seg);
    if(cur.rainbow) S.hue=(S.hue+3)%360;
    if(S.brush.fx==="twinkle" && BM && BM.burst){ /* sparkle visuals are baked into glitter texture via dots */ sparkleAt(p); }
    playStrokeSfx(S.brush.sound);
  }
  function up(){
    if(!drawing) return; drawing=false;
    if(cur && cur.points.length){ pushOp(cur); redraw(); }   // redraw so mirrored full-stroke is clean
    cur=null;
  }
  function sparkleAt(p){
    if(!ctx) return;
    for(var k=0;k<5;k++){ var ang=Math.random()*7, rr=Math.random()*S.size*1.4;
      ctx.save(); ctx.globalAlpha=0.9; ctx.fillStyle="hsl("+((S.hue+k*40)%360)+",90%,65%)";
      if(BR.sparkle) BR.sparkle(ctx, p.x+Math.cos(ang)*rr, p.y+Math.sin(ang)*rr, 4, Date.now()/120);
      else { ctx.beginPath(); ctx.arc(p.x+Math.cos(ang)*rr,p.y+Math.sin(ang)*rr,1.6,0,7); ctx.fill(); }
      ctx.restore(); }
    S.hue=(S.hue+12)%360;
  }

  // ---------- autosave (work-in-progress, never lose it) ----------
  function autosave(){ try{ localStorage.setItem("artstudio:wip", JSON.stringify({ops:S.ops})); }catch(e){} }
  function restoreWip(){ try{ var w=JSON.parse(localStorage.getItem("artstudio:wip")||"null");
    if(w&&w.ops&&w.ops.length){ S.ops=w.ops.filter(function(o){return o.t==="stroke"||o.t==="stamp";}); } }catch(e){} }

  // ---------- UI build ----------
  function brushGlyph(b){
    var col = b.erase?"#ffb3c1":(b.stamp?"#ffd23f":"#cfc8ff");
    if(b.stamp)   return svg('<rect x="6" y="6" width="20" height="20" rx="5" fill="none" stroke="'+col+'" stroke-width="2.5"/><path d="M11 16l3 3 7-8" stroke="'+col+'" stroke-width="2.5" fill="none" stroke-linecap="round"/>');
    if(b.erase)   return svg('<rect x="6" y="13" width="16" height="9" rx="2" transform="rotate(-30 14 17)" fill="'+col+'"/>');
    if(b.rainbow) return svg('<path d="M5 24a11 11 0 0 1 22 0" fill="none" stroke="#ff5d5d" stroke-width="3"/><path d="M9 24a7 7 0 0 1 14 0" fill="none" stroke="#ffd23f" stroke-width="3"/><path d="M13 24a3 3 0 0 1 6 0" fill="none" stroke="#3a86ff" stroke-width="3"/>');
    if(b.fx)      return svg('<path d="M16 5l2.2 6.4L25 13l-6 3 -1 7-2-7-6-3 6.8-1.6z" fill="#ffd23f"/>');
    if(b.id==="neon") return svg('<rect x="8" y="6" width="6" height="20" rx="3" fill="#67e8f9"/><rect x="8" y="6" width="6" height="6" rx="3" fill="#fff"/>');
    return svg('<rect x="13" y="5" width="6" height="14" rx="2" fill="'+col+'"/><path d="M13 19h6l-3 7z" fill="'+col+'"/>');
  }
  function svg(inner){ return '<svg width="30" height="30" viewBox="0 0 32 32">'+inner+'</svg>'; }

  function buildUI(){
    var br = document.getElementById("brushRow"); br.innerHTML="";
    STUDIO_CONFIG.brushes.forEach(function(b){
      var el=document.createElement("div"); el.className="tool"+(b.id===S.brush.id?" on":"");
      el.innerHTML = brushGlyph(b)+'<span class="lab">'+b.name+'</span>';
      el.onclick=function(){ S.brush=b; if(BA&&BA.unlock)try{BA.unlock();}catch(_){}
        if(b.stamp) openStickers();
        syncBrush(); };
      el.dataset.bid=b.id; br.appendChild(el);
    });
    var cr=document.getElementById("colorRow"); cr.innerHTML="";
    var lab=document.createElement("span"); lab.className="sec"; lab.textContent="Colors"; cr.appendChild(lab);
    STUDIO_CONFIG.palette.forEach(function(col){
      var sw=document.createElement("div"); sw.className="sw"+(col===S.color?" on":"");
      sw.style.background=col; if(col==="#ffffff") sw.style.border="3px solid #888";
      sw.onclick=function(){ S.color=col; syncColor(); }; sw.dataset.col=col; cr.appendChild(sw);
    });
    var mr=document.getElementById("mirRow"); mr.innerHTML="";
    STUDIO_CONFIG.mirror.forEach(function(m){
      var b=document.createElement("button"); b.className="mir"+(m===S.mirror?" on":"");
      b.textContent = m===1? "Off" : ("x"+m); b.onclick=function(){ S.mirror=m; syncMirror(); }; b.dataset.m=m; mr.appendChild(b);
    });
  }
  function syncBrush(){ document.querySelectorAll("#brushRow .tool").forEach(function(e){ e.classList.toggle("on", e.dataset.bid===S.brush.id); }); }
  function syncColor(){ document.querySelectorAll("#colorRow .sw").forEach(function(e){ e.classList.toggle("on", e.dataset.col===S.color); }); }
  function syncMirror(){ document.querySelectorAll("#mirRow .mir").forEach(function(e){ e.classList.toggle("on", +e.dataset.m===S.mirror); }); }

  // ---------- stickers ----------
  function openStickers(){
    document.getElementById("stickOv").classList.add("show");
    if(!stickerList.loaded) loadStickerLibrary();
  }
  var stickerList={ loaded:false, items:[] };
  function loadStickerLibrary(){
    stickerList.loaded=true;
    var wrap=document.getElementById("stickWrap"); wrap.innerHTML="<p style='opacity:.7'>Loading…</p>";
    Promise.all([
      fetch("/api/list-characters?limit=18").then(function(r){return r.ok?r.json():[];}).catch(function(){return [];}),
      fetch("/api/list-assets?limit=18").then(function(r){return r.ok?r.json():[];}).catch(function(){return [];})
    ]).then(function(res){
      var chars=normalize(res[0]), assets=normalize(res[1]);
      var items=chars.concat(assets).filter(function(x){return x.url;});
      if(!items.length) return drawnFallback(wrap);
      stickerList.items=items; renderStickers(wrap, items);
    }).catch(function(){ drawnFallback(wrap); });
  }
  function normalize(j){
    var arr = Array.isArray(j)? j : (j&&j.items)||(j&&j.characters)||(j&&j.assets)||[];
    return arr.map(function(x){ return { url: x.image_url||x.url||x.preview_image_url, name:x.name||"" }; });
  }
  function renderStickers(wrap, items){
    wrap.innerHTML="";
    items.forEach(function(it){
      var d=document.createElement("div"); d.className="stick";
      var im=new Image(); im.src=it.url; im.alt=it.name; d.appendChild(im);
      d.onclick=function(){ S.sticker=it; S.brush=findBrush("sticker"); syncBrush();
        document.querySelectorAll(".stick").forEach(function(e){e.classList.remove("on");}); d.classList.add("on");
        toast("Now tap the paper to stamp!"); document.getElementById("stickOv").classList.remove("show"); };
      wrap.appendChild(d);
    });
  }
  function drawnFallback(wrap){
    // BR-drawn shapes so the stamp brush is NEVER empty (library outage safe)
    wrap.innerHTML="";
    var shapes=[ {n:"Star",f:function(c){c.fillStyle="#ffd23f";BR.sparkle&&BR.sparkle(c,39,39,30,1);}},
      {n:"Heart",f:function(c){c.fillStyle="#ff5d8f";BR.heart&&BR.heart(c,39,39,30);}},
      {n:"Gem",f:function(c){if(BR.gem)BR.gem(c,39,30,16,1,false);else{c.fillStyle="#67e8f9";c.fillRect(24,24,30,30);}}} ];
    shapes.forEach(function(sh){
      var d=document.createElement("div"); d.className="stick";
      var cv=document.createElement("canvas"); cv.width=78; cv.height=78; var c=cv.getContext("2d");
      try{ sh.f(c); }catch(e){}
      d.appendChild(cv);
      d.onclick=function(){ S.sticker={url:cv.toDataURL(),name:sh.n}; S.brush=findBrush("sticker"); syncBrush();
        toast("Now tap the paper to stamp!"); document.getElementById("stickOv").classList.remove("show"); };
      wrap.appendChild(d);
    });
  }
  function findBrush(id){ return STUDIO_CONFIG.brushes.filter(function(b){return b.id===id;})[0]; }

  // ---------- save ----------
  function deviceId(){ var k="artstudio:device"; var v=localStorage.getItem(k);
    if(!v){ v="dev_"+Math.random().toString(36).slice(2)+Date.now().toString(36); localStorage.setItem(k,v); } return v; }
  function themeGuess(){ // pick a library-friendly word from what's used, for the auto thumbnail
    return "rainbow"; }
  function doSave(){
    var title=(document.getElementById("artTitle").value||"My masterpiece").slice(0,40);
    var share=document.getElementById("shareChk").checked;
    var image_b64=""; try{ image_b64=paper.toDataURL("image/png"); }catch(e){}
    var payload={ art_id:"art_"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
      device_id:deviceId(), title:title, theme:themeGuess(),
      image_b64:image_b64, art:{ ops:S.ops, bg:STUDIO_CONFIG.bg }, published:!!share };
    document.getElementById("saveOv").classList.remove("show");
    playSfx("art_save"); celebrate();
    fetch("/api/save-art",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)})
      .then(function(r){ if(r.ok){ toast(share?"Saved & shared with family!":"Saved to your gallery!"); }
        else { downloadFallback(image_b64,title); } })
      .catch(function(){ downloadFallback(image_b64,title); });
  }
  function downloadFallback(data,title){
    if(!data){ toast("Saved!"); return; }
    try{ var a=document.createElement("a"); a.href=data; a.download=(title||"art").replace(/\s+/g,"_")+".png";
      document.body.appendChild(a); a.click(); a.remove(); toast("Saved a copy to your device!"); }
    catch(e){ toast("Saved!"); }
  }
  // confetti on save (BM)
  var fxParts=[];
  function celebrate(){
    if(!BM||!BM.burst||!ctx) return;
    for(var i=0;i<6;i++) BM.burst(fxParts, Math.random()*paper.width, paper.height*0.4, "hsl("+(i*60)+",90%,60%)", 14);
    var t0=Date.now();
    (function loop(){ if(Date.now()-t0>900) { redraw(); return; }
      redraw(); BM.updateParticles(fxParts, 1/60); BM.drawParticles(ctx, fxParts);
      requestAnimationFrame(loop); })();
  }

  // ---------- toast ----------
  var _tt; function toast(msg){ var t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show");
    clearTimeout(_tt); _tt=setTimeout(function(){ t.classList.remove("show"); }, 1800); }

  // ---------- wire events ----------
  function wire(){
    paper.addEventListener("mousedown",down); paper.addEventListener("touchstart",down,{passive:false});
    window.addEventListener("mousemove",move); window.addEventListener("touchmove",move,{passive:false});
    window.addEventListener("mouseup",up); window.addEventListener("touchend",up);
    document.getElementById("size").addEventListener("input",function(e){ S.size=+e.target.value; });
    document.getElementById("undoBtn").onclick=undo;
    document.getElementById("redoBtn").onclick=redoOp;
    document.getElementById("clearBtn").onclick=function(){ document.getElementById("clearOv").classList.add("show"); };
    document.getElementById("clearNo").onclick=function(){ document.getElementById("clearOv").classList.remove("show"); };
    document.getElementById("clearYes").onclick=function(){ document.getElementById("clearOv").classList.remove("show"); clearAll(); playSfx("art_undo"); };
    document.getElementById("saveBtn").onclick=function(){ document.getElementById("saveOv").classList.add("show"); };
    document.getElementById("saveCancel").onclick=function(){ document.getElementById("saveOv").classList.remove("show"); };
    document.getElementById("saveGo").onclick=doSave;
    document.getElementById("stickClose").onclick=function(){ document.getElementById("stickOv").classList.remove("show"); };
    document.getElementById("soundBtn").onclick=function(){ S.muted=!S.muted;
      try{ localStorage.setItem("artstudio:muted", S.muted?"1":"0"); }catch(e){}
      if(BA&&BA.toggleMute) try{BA.toggleMute();}catch(_){}
      document.getElementById("soundBtn").textContent="Sound: "+(S.muted?"Off":"On"); };
    window.addEventListener("resize", fitCanvas);
  }

  // ---------- init ----------
  function init(){
    try{ S.muted = localStorage.getItem("artstudio:muted")==="1"; }catch(e){}
    document.getElementById("soundBtn").textContent="Sound: "+(S.muted?"Off":"On");
    restoreWip(); buildUI(); wire(); fitCanvas();
  }
  if(document.readyState!=="loading") init(); else document.addEventListener("DOMContentLoaded", init);

  // ---------- QA hook (model-level; safe with no real canvas) ----------
  window.ART_GAME = {
    state:S, config:STUDIO_CONFIG,
    // lay down strokes with every brush, exercise each mirror setting, drop a stamp, undo/redo
    sim:function(steps){
      steps = steps||1; var report={ added:0, brushesUsed:[], mirrorsUsed:[], undoOk:false, redoOk:false };
      var mirs=STUDIO_CONFIG.mirror;
      STUDIO_CONFIG.brushes.forEach(function(b,bi){
        if(b.stamp||b.erase) return;
        var m=mirs[bi%mirs.length];
        var op={ t:"stroke", brush:b.id, texture:b.texture||"smooth", color:STUDIO_CONFIG.palette[bi%STUDIO_CONFIG.palette.length],
          width:18, mirror:m, rainbow:!!b.rainbow, hueStart:0, erase:false,
          points:[{x:50,y:50},{x:120,y:90},{x:200,y:140}] };
        S.ops.push(op); report.added++; report.brushesUsed.push(b.id); if(report.mirrorsUsed.indexOf(m)<0)report.mirrorsUsed.push(m);
      });
      // a stamp + an eraser stroke
      S.ops.push({t:"stamp", url:"data:fake", x:100,y:100, size:80, mirror:4}); report.added++;
      S.ops.push({t:"stroke", brush:"eraser", texture:"smooth", color:"#000", width:24, mirror:1, erase:true, points:[{x:60,y:60},{x:90,y:90}]}); report.added++;
      var before=S.ops.length; S.redo.length=0;
      var popped=S.ops.pop(); S.redo.push(popped); report.undoOk = (S.ops.length===before-1);
      S.ops.push(S.redo.pop()); report.redoOk = (S.ops.length===before);
      report.total=S.ops.length; report.allBrushesDrawable = report.brushesUsed.length>=7;
      return report;
    },
    // save -> JSON -> clear -> restore -> compare (the save/restore contract)
    roundtrip:function(){
      var json=JSON.stringify({ ops:S.ops, bg:STUDIO_CONFIG.bg });
      var n=S.ops.length;
      var saved=S.ops.slice();
      S.ops.length=0;                       // simulate clear
      var parsed=JSON.parse(json);
      S.ops=parsed.ops;                     // restore
      var ok = S.ops.length===n && JSON.stringify(S.ops)===JSON.stringify(saved);
      return { ok:ok, count:S.ops.length, expected:n };
    },
    reset:function(){ S.ops.length=0; S.redo.length=0; }
  };
})();
</script>
