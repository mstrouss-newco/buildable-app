<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buildable — Question Review</title>
<link rel="icon" href="/favicon.svg">
<style>
  :root{
    --bg:#f5f7fc; --card:#ffffff; --card2:#f1f3fa; --line:#e1e5f0;
    --ink:#1b1f33; --muted:#5f6785; --accent:#6b4eff; --accent2:#00b488;
    --warn:#b9770a; --danger:#e0384a; --ready:#00a37a; --chip:#eceffa;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--ink);-webkit-text-size-adjust:100%}
  .wrap{max-width:820px;margin:0 auto;padding:18px 16px 80px}
  h1{font-size:22px;margin:6px 0 2px}
  .legend{color:var(--muted);font-size:13px;margin:0}
  .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0}
  .pill{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--muted)}
  .pill b{color:var(--ink)}
  select,.btn{font:inherit}
  .btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:9px 14px;cursor:pointer}
  .btn:hover{background:var(--card2)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.good{background:var(--ready);border-color:var(--ready);color:#fff}
  .btn.bad{background:var(--danger);border-color:var(--danger);color:#fff}
  select{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 10px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 1px 2px rgba(20,25,60,.04)}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
  .tag{font-size:11px;letter-spacing:.3px;text-transform:uppercase;background:var(--chip);border-radius:6px;padding:3px 8px;color:var(--muted)}
  .tag.subject{background:#e7f0ff;color:#2a5bd7}
  .tag.grade{background:#e9f8f1;color:#0a8a5f}
  .q{font-size:16px;font-weight:600;margin:4px 0 4px}
  .story{font-size:14px;color:var(--muted);font-style:italic;margin:2px 0 6px}
  .choices{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0 12px}
  .choice{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px;background:var(--card2)}
  .choice.correct{border-color:var(--ready);background:#e9f8f1;font-weight:600}
  .choice .mk{color:var(--ready);font-weight:700;margin-left:6px}
  .row{display:flex;gap:8px}
  .row .btn{flex:1}
  #gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:60}
  #gate .box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px;width:min(340px,90vw);text-align:center}
  #gate input{width:100%;text-align:center;font-size:20px;letter-spacing:4px;margin:12px 0;padding:10px;border:1px solid var(--line);border-radius:10px}
  .empty{text-align:center;color:var(--muted);padding:40px 10px}
  .toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .2s;z-index:50}
  .toast.show{opacity:1}
  .stickybar{position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:10}
</style>
</head>
<body>
<div id="gate"><div class="box">
  <h1 style="margin:0">Question Review</h1>
  <p class="legend">Grown-ups only</p>
  <input id="pin" type="password" inputmode="numeric" placeholder="code" onkeydown="if(event.key==='Enter')tryPin()">
  <button class="btn primary" style="width:100%" onclick="tryPin()">Open</button>
  <p id="pinErr" class="legend" style="color:var(--danger);min-height:16px;margin-top:8px"></p>
</div></div>

<div class="wrap" id="app" style="display:none">
  <h1>Question Review</h1>
  <p class="legend">New questions the weekly factory made are waiting here. Approve the good ones to send them to kids. Nothing reaches a kid until you approve it.</p>

  <div class="stickybar">
    <div class="bar">
      <span class="pill">Waiting: <b id="cPending">0</b></span>
      <span class="pill">Approved: <b id="cApproved">0</b></span>
      <span class="pill">Rejected: <b id="cRejected">0</b></span>
    </div>
    <div class="bar">
      <label class="legend">Show</label>
      <select id="fStatus" onchange="load()">
        <option value="pending">Waiting</option>
        <option value="approved">Approved</option>
        <option value="rejected">Rejected</option>
      </select>
      <select id="fSubject" onchange="load()">
        <option value="">All subjects</option>
        <option value="math">Math</option>
        <option value="geometry">Shapes</option>
        <option value="spelling">Spelling</option>
        <option value="reading">Reading</option>
      </select>
      <button class="btn" onclick="load()">Refresh</button>
      <button class="btn good" id="approveAll" onclick="approveAllVisible()">Approve all shown</button>
    </div>
  </div>

  <div id="list"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const PIN="1025"; // light privacy gate, same as the planner
let CURRENT=[];

function tryPin(){
  const v=document.getElementById('pin').value.trim();
  if(v===PIN){ document.getElementById('gate').style.display='none'; document.getElementById('app').style.display='block'; load(); }
  else { document.getElementById('pinErr').textContent='Try again.'; }
}
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1600); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

async function load(){
  const status=document.getElementById('fStatus').value;
  const subject=document.getElementById('fSubject').value;
  const list=document.getElementById('list');
  list.innerHTML='<div class="empty">Loading...</div>';
  let url='/api/review-questions?status='+status+'&limit=200';
  if(subject) url+='&subject='+subject;
  try{
    const r=await fetch(url); const d=await r.json();
    if(!d.ok){ list.innerHTML='<div class="empty">'+esc(d.error||d.hint||'Not ready yet.')+'</div>'; return; }
    const c=d.counts||{};
    document.getElementById('cPending').textContent=c.pending||0;
    document.getElementById('cApproved').textContent=c.approved||0;
    document.getElementById('cRejected').textContent=c.rejected||0;
    CURRENT=d.questions||[];
    document.getElementById('approveAll').style.display=(status==='pending'&&CURRENT.length)?'':'none';
    if(!CURRENT.length){ list.innerHTML='<div class="empty">Nothing here. When the factory runs, new questions show up as Waiting.</div>'; return; }
    list.innerHTML=CURRENT.map(cardHTML).join('');
  }catch(e){ list.innerHTML='<div class="empty">Could not load.</div>'; }
}

function cardHTML(q){
  const p=q.payload||{};
  const gradeLbl=q.grade==='k'?'Kindergarten':('Grade '+esc(q.grade||'?'));
  const subjLbl={math:'Math',geometry:'Shapes',spelling:'Spelling',reading:'Reading'}[q.subject]||esc(q.subject);
  let head='';
  if(p.story) head+='<div class="story">'+esc(p.story)+'</div>';
  const qtext=p.question||p.clue||(p.word_template?('Fill the blank: '+esc(p.word_template)):'')||'(question)';
  head+='<div class="q">'+esc(qtext)+'</div>';
  const choices=(p.choices||[]).map((ch,i)=>{
    const ok=i===p.correctIndex;
    return '<div class="choice'+(ok?' correct':'')+'">'+esc(ch)+(ok?'<span class="mk">correct</span>':'')+'</div>';
  }).join('');
  const themeTag=q.game_theme?'<span class="tag">theme</span>':'';
  return '<div class="card" data-id="'+esc(q.id)+'">'
    +'<div class="tags"><span class="tag subject">'+subjLbl+'</span><span class="tag grade">'+gradeLbl+'</span>'
    +(q.skill?'<span class="tag">'+esc(q.skill)+'</span>':'')+'<span class="tag">'+esc(q.source||'ai')+'</span>'+themeTag+'</div>'
    +head+'<div class="choices">'+choices+'</div>'
    +(document.getElementById('fStatus').value==='pending'
        ? '<div class="row"><button class="btn good" onclick="decide(\''+esc(q.id)+'\',\'approve\')">Approve</button>'
          +'<button class="btn bad" onclick="decide(\''+esc(q.id)+'\',\'reject\')">Reject</button></div>'
        : '')
    +'</div>';
}

async function decide(id,op){
  try{
    const r=await fetch('/api/review-questions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({op,id})});
    const d=await r.json();
    if(d.ok){ const el=document.querySelector('.card[data-id="'+id+'"]'); if(el) el.remove(); toast(op==='approve'?'Approved':'Rejected'); refreshCounts(d.counts); }
    else toast('Something went wrong');
  }catch(e){ toast('Something went wrong'); }
}

async function approveAllVisible(){
  const ids=CURRENT.map(q=>q.id);
  if(!ids.length) return;
  if(!confirm('Approve all '+ids.length+' shown questions?')) return;
  try{
    const r=await fetch('/api/review-questions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({op:'approve',ids})});
    const d=await r.json();
    if(d.ok){ toast('Approved '+(d.updated||ids.length)); load(); } else toast('Something went wrong');
  }catch(e){ toast('Something went wrong'); }
}
function refreshCounts(c){ if(!c) return; document.getElementById('cPending').textContent=c.pending||0; document.getElementById('cApproved').textContent=c.approved||0; document.getElementById('cRejected').textContent=c.rejected||0; }

document.getElementById('pin').focus();
</script>
</body>
</html>
