  bale2.scale.setScalar(0.72);
  g.add(bale2);

  scene.add(g);

  // ---- THREE HENS ON NESTS, one strutting. The nests go down first so a hen
  //      is sitting IN one rather than beside it.
  var nestSpots=[
    [COOP_C.x-1.5, COOP_C.z-2.4, 0.5],
    [COOP_C.x-0.2, COOP_C.z-0.7, -0.4],
    [COOP_C.x+2.4, COOP_C.z+1.1, 1.1]
  ];
  for(i=0;i<nestSpots.length;i++){
    var n=buildNest();
    n.position.set(nestSpots[i][0], 0, nestSpots[i][1]);
    g.add(n);
    var hen=addAnimal("chicken", nestSpots[i][0], nestSpots[i][1], nestSpots[i][2], "nest");
    hen.baseY=0.18;                    // settled down into the straw
    hen.obj.position.y=hen.baseY;
    hen.nested=true;
  }
  addAnimal("chicken", COOP_C.x-2.4, COOP_C.z+1.4, 0, "strut",
    {patrol:{cx:COOP_C.x-1.0, cz:COOP_C.z+1.6, r:2.1, speed:0.42}});

  // ---- THE COW
  addAnimal("cow", PEN_C.x, PEN_C.z, -1.2, "graze");

  // ---- FM3: the runway, the crate and the plane, west of the field
  var rw=buildRunway(); scene.add(rw);
  crateObj=buildCrate();
  crateObj.position.set(CRATE.x, 0, CRATE.z);
  crateObj.rotation.y=0.28;
  scene.add(crateObj);
  // FM3 pushed the kid out of the crate by hand. FM4 has a blocker list, so the
  // crate joins it and the bespoke push goes away — one rule for solid things.
  addCircleBlocker(CRATE.x, CRATE.z, 1.60, "crate");
  buildPlane();
  newOrder();
  // FM5 — the farm exists now, so it can be poured full of her save.
  farmBoot();
}

// =========================================================================
//  FM5 — THE TOWNSHIP LESSONS. Four things, and they are all one idea: the
//  farm is a PLACE SHE OWNS, and it is waiting for her.
//
//    1. IT REMEMBERS HER. The whole farm — every patch, every animal, the
//       stack, the pantry, the order, the presents — is saved per kid, in
//       Supabase with localStorage underneath it. Best-effort and silent: the
//       game runs at full speed off the local copy and syncs in the
//       background. There is NO reset a child can reach.
//    2. IT GROWS WHILE SHE IS AWAY, AND SOMETHING IS WAITING. A deterministic
//       catch-up finishes what was started, and if she has been gone more
//       than ten minutes a BASKET sits by the door holding it. Walking to it
//       is the first ten seconds of every visit, and it is a reward.
//    3. NEVER IDLE. whatCanSheDoNow() counts what she could do this second,
//       and if that would ever be zero the farm quietly fixes it before she
//       notices.
//    4. THE NEXT THING IS ALWAYS VISIBLE. One wrapped present in the shop,
//       with its price under it, and nothing after it shown.
//
//  NO TIMERS ON SCREEN. Nothing in here draws a countdown, and QA greps for
//  it. Growth is a shape changing, exactly as it already was.
// =========================================================================

// ---------------------------------------------------------------- WHO SHE IS
// The shell's active kid, read the same way survival-engine.html reads it. No
// kid (a guest, or the farm opened on its own) is not an error: the save just
// lives in this browser under the plain key.
function activeKidId(){
  try{ var k=JSON.parse(localStorage.getItem("bk_active_kid_v1")||"null");
       return k&&k.id?String(k.id):null; }catch(e){ return null; }
}
var KID_ID=activeKidId();
var SAVE_V=1;
function saveKey(){ return "bk_farm_save"+(KID_ID?("_"+KID_ID):""); }

// ------------------------------------------------------------- THE SNAPSHOT
// Everything that makes this farm HERS. Timers are stored as SECONDS LEFT and
// never as a wall-clock stamp, so a device with a wrong clock, a daylight
// saving jump or a tab left open overnight can never poison the save. The one
// wall-clock number is savedAt, and it is only ever used to work out how long
// she has been gone.
function collectedList(){ var out=[],k; for(k in COLLECTED) if(COLLECTED[k]) out.push(k); return out; }
function ownedList(){ var out=[],k; for(k in OWNED) if(OWNED[k]) out.push(k); return out; }

function snapshotFarm(){
  var now=performance.now()/1000, i, P=[], A=[], S=[];
  for(i=0;i<PATCHES.length;i++){
    var p=PATCHES[i];
    if(p.cover){ P.push({s:null, cov:1}); continue; }
    if(p.locked){ P.push({s:null, lock:1}); continue; }
    if(p.state==="empty"){ P.push({s:null}); continue; }
    var r=CROP_RECIPES[p.seed];
    // An OR and not a ternary on purpose: a ternary's colon reads as a fourth
    // crop recipe to the harness that counts them in the source.
    var gs = (r && r.growSec) || 34;
    var left = (p.state==="ready") ? 0 : Math.max(0, gs - (now - p.plantedAt));
    P.push({s:p.seed, left:+left.toFixed(2)});
  }
  for(i=0;i<ANIMALS.length;i++){
    var a=ANIMALS[i], st=a.state, left=0;
    if(st==="feeding") st="making";                 // mid-air is a fed animal
    if(st==="making") left=Math.max(0, a.makeSec-(now-a.fedAt));
    A.push({k:a.kind, st:st, left:+left.toFixed(2)});
  }
  for(i=0;i<stack.length;i++) S.push(stack[i].userData.kind);
  // whatever the dog has in his mouth was on its way to the stack anyway, so
  // it rides home in the stack rather than needing a field of its own
  if(DOG.carry) S.push(DOG.carry);
  return {
    v:SAVE_V, savedAt:Date.now(),
    patches:P, animals:A, stack:S,
    basket:BASKET.items.slice(),
    collected:collectedList(),
    unlocks:ownedList(),
    duck:DUCK_BOUGHT,
    can:CAN_OWNED,
    // BY KIND AND ORDER WITHIN KIND, never by index: which animals exist and in
    // what order depends on what she has unlocked and when, so a saved index
    // can easily come back pointing at a different animal.
    names:(function(){ var seen={}, out=[];
      ANIMALS.forEach(function(a){
        var n=(seen[a.kind]=(seen[a.kind]||0)+1)-1;
        if(a.mark) out.push({k:a.kind, n:n, m:a.mark});
      });
      return out; })(),
    decor:DECOR.map(function(D){ return {k:D.kind, x:+D.x.toFixed(2),
      z:+D.z.toFixed(2), y:+D.yaw.toFixed(3)}; }),
    ordersDone:ORDERS_DONE,
    // FM8 — the stamps she has already been shown, the sizes of farm already
    // photographed, and whether a truck has ever come. All three are about not
    // repeating a celebration she has already had.
    seen:(function(){ var out=[],k; for(k in BOOK_SEEN) if(BOOK_SEEN[k]) out.push(k); return out; })(),
    shots:(function(){ var out=[],k; for(k in PHOTO.rings) if(PHOTO.rings[k]) out.push(+k); return out; })(),
    truckSeen:!!TRUCK.seen,
    // FM9 — who she picked. The file behind the name can change; this cannot.
    kidLook:KID_LOOK,
    order: order ? { pay:order.pay, face:order.face, sent:!!order.sent,
      items:order.items.map(function(it){ return {k:it.kind, f:!!it.filled}; }) } : null
  };
}

// ------------------------------------------------------- BEST EFFORT, ALWAYS
// Local first, cloud after, and a failure at either end is silent. A child
// never sees a save error, and a save never makes her wait for anything.
var saveTimer=null, lastSig="", saveSigT=0, cloudSaves=0, cloudErrs=0, localSaves=0;

function writeLocal(blob){
  try{ localStorage.setItem(saveKey(), JSON.stringify(blob)); localSaves++; return true; }
  catch(e){ return false; }
}
function readLocal(){
  try{ var raw=localStorage.getItem(saveKey()); return raw?JSON.parse(raw):null; }
  catch(e){ return null; }
}
function writeCloud(blob, beacon){
  if(!KID_ID) return;
  var body=JSON.stringify({kidProfileId:KID_ID, data:blob});
  // On the way out of the page a normal fetch is killed mid-flight; a beacon
  // is the only thing a browser promises to finish.
  if(beacon){
    try{ if(navigator.sendBeacon &&
            navigator.sendBeacon("/api/farm-save", new Blob([body],{type:"application/json"}))){
      cloudSaves++; return; } }catch(e){}
  }
  try{
    fetch("/api/farm-save",{method:"POST",headers:{"Content-Type":"application/json"},body:body})
      .then(function(r){ return r.json(); })
      .then(function(j){ if(j&&j.ok) cloudSaves++; else cloudErrs++; })
      .catch(function(){ cloudErrs++; });
  }catch(e){ cloudErrs++; }
}
// The one door out. Local is written straight away so nothing is ever lost to
// a dead network; the cloud copy follows and may fail as often as it likes.
function saveNow(beacon){
  if(!SAVE_ON) return null;
  var blob=snapshotFarm();
  writeLocal(blob);
  writeCloud(blob, beacon);
  return blob;
}
function scheduleSave(){
  if(!SAVE_ON) return;
  if(saveTimer) return;
  saveTimer=setTimeout(function(){ saveTimer=null; saveNow(false); }, 1200);
}
var SAVE_ON=true;    // QA turns this off to prove the farm plays without it

// A signature of everything worth saving. Watching it beats sprinkling a
// save() call through twenty call sites and forgetting the twenty-first.
function saveSignature(){
  var i, s=[];
  for(i=0;i<PATCHES.length;i++) s.push(PATCHES[i].state.charAt(0)+(PATCHES[i].seed||""));
  for(i=0;i<ANIMALS.length;i++) s.push(ANIMALS[i].kind.charAt(0)+ANIMALS[i].state.charAt(0));
  for(i=0;i<stack.length;i++) s.push(stack[i].userData.kind);
  s.push("n"+DECOR.length, "w"+(CAN_OWNED?1:0),
         "m"+ANIMALS.map(function(a){return a.mark?a.mark.charAt(0):"-";}).join(""),
         "b"+BASKET.items.length, "o"+ORDERS_DONE, "u"+ownedList().length,
         "c"+collectedList().length, "d"+(DUCK_BOUGHT?1:0),
         "r"+FIELD_RING, "v"+coversLeft(), "g"+(DOG.carry||"-"),
         "k"+(KID_LOOK||"-"), "s"+(TRUCK.seen?1:0));
  if(order) for(i=0;i<order.items.length;i++) s.push(order.items[i].kind+(order.items[i].filled?"1":"0"));
  return s.join("|");
}
function watchForChanges(dt){
  // NEVER write before the save has been read. Without this a slow model load
  // lets the watcher save an empty farm over a good one — the one way a
  // best-effort save could actually lose a child's farm.
  if(!BOOTED) return;
  saveSigT-=dt; if(saveSigT>0) return;
  saveSigT=1.0;
  var sig=saveSignature();
  if(sig!==lastSig){ lastSig=sig; scheduleSave(); }
}
// Leaving the page is the one moment a debounce cannot cover.
function flushSave(){ if(saveTimer){ clearTimeout(saveTimer); saveTimer=null; } saveNow(true); }
try{
  addEventListener("pagehide", flushSave);
  addEventListener("visibilitychange", function(){ if(document.visibilityState==="hidden") flushSave(); });
}catch(e){}

// =========================================================================
//  THE WELCOME-BACK BASKET
//
//  She was away. Things finished. They are not scattered around the farm
//  waiting to be found — they are IN A BASKET BY THE DOOR, in colour, with
//  the same pictures the order card uses. Walk to it and the lot whooshes
//  onto the stack, rapid fire, exactly like the crate unload. Nothing else on
//  the farm moves until she gets there, so the first ten seconds of every
//  visit are a reward for coming back.
// =========================================================================
var AWAY_MIN=600;          // ten minutes. Under that she never really left.
var BASKET_R=3.0;          // the same generous reach a pickup has
// Beside where she arrives, and deliberately well clear of the crate: at z=3.8
// the basket sat 2.98 units from the crate, inside its own 3.0 reach, so a kid
// walking to the crate emptied it on the way past without ever seeing it.
var BASKET_SPOT={x:-13.5, z:-7.0};
var BASKET={ items:[], obj:null, wants:null, wantT:0, gap:0, run:0, sink:0 };

var BASKET_W=0xC79A5E, BASKET_D=0x9A6E3C;
function buildBasket(){
  var p=[], i;
  // A basket a four-year-old reads as a basket from across the screen: DEEP,
  // with a rim she can see over and a proper arc of a handle standing up off
  // it. The first pass was a shallow stack of flat hoops and it came back from
  // the picture gate looking like a pile of pancakes.
  // straight-sided, not flared: the flared first pass read as a plant pot
  p.push(hbTurn([[0.60,0],[0.78,0.16],[0.90,0.78],[0.97,1.28],[0.93,1.36]], BASKET_W, null, 18));
  p.push(hbTube(1.04,1.04,0.18,BASKET_D,{p:[0,1.34,0]},20));          // the rim
  for(i=0;i<3;i++)                                                     // the weave
    p.push(hbTube(0.84+i*0.05,0.84+i*0.05,0.10,BASKET_D,{p:[0,0.32+i*0.34,0]},18));
  // The handle: a half torus standing up. It is STRETCHED TALL on purpose —
  // at its natural height it arcs less than a basket-width above the rim and
  // from the game's overhead camera it disappeared into the lip completely.
  p.push(hbPaint(new THREE.TorusGeometry(0.84,0.09,8,22,Math.PI),BASKET_D,
    {s:[1,1.55,1], p:[0,1.34,0]}));
  var g=new THREE.Group(); g.add(hbMesh(hbBake(p)));
  return g;
}

// One floating model per KIND, turning, in a row above the basket — the same
// language the crate already speaks and the same one slot per kind the order
// card settled on in FM4.
function basketKinds(){
  var seen={}, out=[], i;
  for(i=0;i<BASKET.items.length;i++){
    var k=BASKET.items[i]; if(!seen[k]){ seen[k]=1; out.push(k); }
  }
  return out;
}
function showBasketWants(){
  if(BASKET.wants){ scene.remove(BASKET.wants); BASKET.wants=null; }
  var kinds=basketKinds(); if(!kinds.length || !BASKET.obj) return;
  var n=Math.min(kinds.length,5), g=new THREE.Group(), i, span=(n-1)*0.78;
  for(i=0;i<n;i++){
    var r=ITEM(kinds[i]); if(!r) continue;
    var m=hbMesh(hbBake(r.parts(1.25)));
    var w=new THREE.Group(); w.add(m);
    // a tight cluster with a little stagger, so five things still read as five
    // things and not as one smear
    w.position.set(-span/2 + i*0.78, (i%2)*0.26, (i%2)*0.12);
    g.add(w);
  }
  // JUST OVER THE RIM. The first pass hung them at 2.5 and at 0.62 scale and
  // they read as specks somewhere off in the sky, which is exactly what the
  // picture gate is for.
  g.position.set(BASKET_SPOT.x, 2.85, BASKET_SPOT.z);
  scene.add(g); BASKET.wants=g;
}
function openBasket(items){
  if(!items || !items.length) return false;
  BASKET.items = items.slice();
  if(!BASKET.obj){
    // never drop the basket inside something solid
    var sx=BASKET_SPOT.x, sz=BASKET_SPOT.z, tries=0;
    while(blockedAt(sx,sz,1.1) && tries<12){ sx-=0.7; tries++; }
    BASKET_SPOT.x=sx; BASKET_SPOT.z=sz;
    BASKET.obj=buildBasket();
    BASKET.obj.position.set(sx, 0, sz);
    scene.add(BASKET.obj);
  }
  BASKET.sink=0;
  showBasketWants();
  return true;
}
function closeBasket(){
  if(BASKET.obj){ scene.remove(BASKET.obj); BASKET.obj=null; }
  if(BASKET.wants){ scene.remove(BASKET.wants); BASKET.wants=null; }
  BASKET.items.length=0; BASKET.run=0;
}
function basketWaiting(){ return BASKET.items.length>0; }
function basketNear(){
  return !!BASKET.obj &&
    Math.hypot(kid.position.x-BASKET_SPOT.x, kid.position.z-BASKET_SPOT.z) < BASKET_R;
}
// The FM3 unload treatment, item for item: one at a time, rapid fire, each on
// its own arc onto the stack, each note a little higher than the last.
function updateBasket(dt, now){
  if(BASKET.obj && BASKET.wants){
    BASKET.wantT+=dt;
    BASKET.wants.position.y = 2.85 + Math.sin(BASKET.wantT*2.1)*0.12;
    for(var c=0;c<BASKET.wants.children.length;c++)
      BASKET.wants.children[c].rotation.y += dt*1.3;
  }
  if(BASKET.obj && !BASKET.items.length){
    // it has been emptied: sink it away rather than blinking it out
    BASKET.sink+=dt;
    BASKET.obj.position.y = -BASKET.sink*1.6;
    BASKET.obj.scale.setScalar(Math.max(0.001, 1-BASKET.sink*1.4));
    if(BASKET.sink>0.75) closeBasket();
    return;
  }
  if(!basketWaiting() || !basketNear()) { BASKET.run=0; return; }
  BASKET.gap-=dt;
  if(BASKET.gap>0) return;
  BASKET.gap=UNLOAD_GAP;
  var kind=BASKET.items.shift();
  pushOntoStack(kind, new THREE.Vector3(BASKET_SPOT.x, 1.25, BASKET_SPOT.z));
  sfx("deliver",{rate:Math.min(1.55, 1+BASKET.run*0.055)});
  haptic("light");
  BASKET.run++;
  showBasketWants();
  if(!BASKET.items.length){
    sfx("levelup"); haptic("success");
    sparklePuff(BASKET_SPOT.x, 1.1, BASKET_SPOT.z, 14);
  }
}

// ------------------------------------------------------------- THE CATCH-UP
// Deterministic: the same save and the same elapsed time always give the same
// farm. Crops that would have finished are finished; an animal that was fed
// has ONE produce waiting, never two. Nothing over-grows: a field cannot be
// more than fully ready.
function applySave(blob){
  if(!blob || blob.v!==SAVE_V) return null;
  var now=performance.now()/1000;
  var elapsed = Math.max(0, (Date.now() - (blob.savedAt||Date.now()))/1000);
  var away = elapsed >= AWAY_MIN;
  var basket = (blob.basket||[]).slice();     // anything still waiting from last time
  var i, k;

  // ---- the pantry, the presents, the money already spent
  COLLECTED={};
  (blob.collected||["corn","carrot","wheat"]).forEach(function(k){ COLLECTED[k]=1; });
  COLLECTED.corn=1; COLLECTED.carrot=1; COLLECTED.wheat=1;   // a patch is always plantable
  saveCollected();
  OWNED={};
  (blob.unlocks||[]).forEach(function(id){ OWNED[id]=1; });
  // FM6 — the presents she has opened are real things, and they have to be
  // BACK ON THE FARM before the field below is filled in: the second row must
  // exist before the patches in it can be restored into it.
  applyAllUnlocks();
  ORDERS_DONE=blob.ordersDone|0;

  // FM8 — the sticker book, the pictures already taken and the truck. The book
  // is restored BEFORE anything else moves, so loading a farm full of stickers
  // never fires a "new sticker" for every one of them.
  BOOK_SEEN={};
  (blob.seen||[]).forEach(function(id){ BOOK_SEEN[id]=1; });
  BOOK_READY=(blob.seen||[]).length>0;
  PHOTO.rings={};
  (blob.shots||[]).forEach(function(r){ PHOTO.rings[r]=1; });
  TRUCK.seen=!!blob.truckSeen;
  if(blob.kidLook && kidLookById(blob.kidLook)) setKidLook(blob.kidLook, true);

  // ---- the duck, if she bought one
  if(blob.duck && !DUCK_BOUGHT){ DUCK_BOUGHT=true; addDuck(); }

  // ---- the field
  for(i=0;i<PATCHES.length && i<(blob.patches||[]).length;i++){
    var sp=blob.patches[i], P=PATCHES[i];
    if(!sp) continue;
    // FM6 — the outer ring. applyAllUnlocks() ran above, so if she owns the
    // present every one of these already has a cover on it; this takes the
    // covers off the ones she had already cleared.
    if(P.tier===1 && !sp.cov && !sp.lock && P.cover) clearCover(P, true);
    if(!sp.s || !CROP_RECIPES[sp.s]) continue;
    var r=CROP_RECIPES[sp.s];
    var left=Math.max(0, (sp.left==null?0:sp.left) - elapsed);
    var finishedWhileAway = away && sp.left>0 && left<=0;
    if(finishedWhileAway){ basket.push(sp.s); continue; }   // it is in the basket, the patch is free
    P.state="growing"; P.seed=sp.s;
    P.plantedAt = now - (r.growSec - left);
    P.ring.visible=false;
    P.crop=buildCrop(sp.s, left<=0?2:(left>r.growSec*0.6?0:1));
    P.crop.position.set(P.x,0.06,P.z);
    scene.add(P.crop);
    if(left<=0) P.state="ready";
  }

  // ---- the animals, matched kind by kind in the order the yard built them
  var cur={};
  for(i=0;i<(blob.animals||[]).length;i++){
    var sa=blob.animals[i];
    cur[sa.k]=(cur[sa.k]||0);
    var A=null, seen=0;
    for(k=0;k<ANIMALS.length;k++){
      if(ANIMALS[k].kind!==sa.k) continue;
      if(seen===cur[sa.k]){ A=ANIMALS[k]; break; }
      seen++;
    }
    cur[sa.k]++;
    if(!A) continue;
    if(sa.st==="hungry"){ A.state="hungry"; continue; }
    if(sa.st==="ready"){ A.fedAt=now-A.makeSec; spawnProduce(A); continue; }
    if(sa.st==="making"){
      var mleft=Math.max(0, (sa.left||0) - elapsed);
      var madeWhileAway = away && sa.left>0 && mleft<=0;
      if(madeWhileAway){ basket.push(A.gives); A.state="hungry"; continue; }
      A.state="making"; A.fedAt = now - (A.makeSec - mleft);
      if(mleft<=0) spawnProduce(A);
    }
  }

  // ---- FM7: the can, what she has put down, and what she named things
  if(blob.can && !CAN_OWNED) giveCanQuiet();
  clearDecor();
  (blob.decor||[]).forEach(function(D){ placeDecor(D.k, D.x, D.z, D.y, true); });
  (blob.names||[]).forEach(function(N){
    if(!N || !N.m) return;
    var seen=0, i;
    for(i=0;i<ANIMALS.length;i++){
      if(ANIMALS[i].kind!==N.k) continue;
      if(seen===N.n){ ANIMALS[i].mark=N.m; return; }
      seen++;
    }
  });

  // ---- the tower she was carrying
  (blob.stack||[]).forEach(function(kind){
    if(ITEM(kind)) pushOntoStack(kind, new THREE.Vector3(kid.position.x, 0.9, kid.position.z));
  });

  // ---- the order she was in the middle of
  if(blob.order && blob.order.items && blob.order.items.length){
    var items=blob.order.items.filter(function(it){ return !!ITEM(it.k); })
      .map(function(it){ return {kind:it.k, filled:!!it.f, el:null}; });
    if(items.length){
      order={items:items, pay:blob.order.pay||orderPay(items),
             sent:!!blob.order.sent, face:blob.order.face|0};
      renderOrder();
    }
  }
  if(!order) newOrder();

  // ---- and the basket by the door
  if(basket.length) openBasket(basket);
  updateShopButton();
  return { elapsed:elapsed, away:away, basket:basket.length };
}

// =========================================================================
//  NEVER IDLE
//
//  The rule: at any moment there is at least one thing she can do RIGHT NOW.
//  Not soon, not once something finishes — now. whatCanSheDoNow() counts
//  them, and if the count would ever be zero the farm fixes it before she can
//  notice: whatever is closest to being finished simply finishes.
// =========================================================================
function heldOnStack(kind){
  for(var i=0;i<stack.length;i++) if(stack[i].userData.kind===kind) return true;
  return false;
}
// FM7 — the mill and the dairy take TWO, so "has she got one" is not the
// question any more.
function countOnStack(kind){
  var n=0; for(var i=0;i<stack.length;i++) if(stack[i].userData.kind===kind) n++;
  return n;
}
function readyCropOf(kind){
  for(var i=0;i<PATCHES.length;i++)
    if(PATCHES[i].state==="ready" && PATCHES[i].seed===kind) return true;
  return false;
}
// Something the farm can make for her, with what is standing on it today: a
// crop (a patch is always plantable, and a seed is free when she is broke) or
// a thing an animal that LIVES HERE gives.
function producibleNow(kind){
  // FM6: a crop counts only if she may actually PLANT it. The pumpkin exists
  // in the recipes from the first frame, but until the present is opened there
  // is no seed for it, so an order naming one could never be filled.
  if(CROP_RECIPES[kind]) return availableSeeds().indexOf(kind)>=0;
  for(var i=0;i<ANIMALS.length;i++) if(ANIMALS[i].gives===kind) return true;
  return heldOnStack(kind);
}
// Can she move the order along this second, with what she is holding or what
// is sitting ready on the farm?
function orderProgressable(){
  if(!order || order.sent) return false;
  for(var i=0;i<order.items.length;i++){
    var it=order.items[i]; if(it.filled) continue;
    if(heldOnStack(it.kind)) return true;
    if(readyCropOf(it.kind)) return true;
    for(var a=0;a<ANIMALS.length;a++)
      if(ANIMALS[a].state==="ready" && ANIMALS[a].gives===it.kind) return true;
  }
  return false;
}
function whatCanSheDoNow(){
  var n=0, i;
  for(i=0;i<PATCHES.length;i++){
    if(PATCHES[i].locked || PATCHES[i].cover) continue;   // FM6: not field yet
    if(PATCHES[i].state==="ready") n++;
    else if(PATCHES[i].state==="empty") n++;      // planting is never gated: free seed floor
  }
  for(i=0;i<ANIMALS.length;i++){
    if(ANIMALS[i].state==="ready") n++;           // loose produce, sitting out
    else if(ANIMALS[i].state==="hungry" && ANIMALS[i].wants &&
            (countOnStack(ANIMALS[i].wants) >= (ANIMALS[i].needs||1) ||
             readyCropOf(ANIMALS[i].wants))) n++;
  }
  if(basketWaiting()) n++;
  n += coversLeft();                    // FM6: land waiting to be tidied
  if(orderProgressable()) n++;
  return n;
}
// The invisible hand. It never adds anything from nowhere: it finishes
// something she already started, which is the only fix a child cannot feel.
function fixIdle(){
  var i, best=null, bestLeft=1e9, now=performance.now()/1000;
  for(i=0;i<ANIMALS.length;i++){
    if(ANIMALS[i].state!=="making") continue;
    var l=ANIMALS[i].makeSec-(now-ANIMALS[i].fedAt);
    if(l<bestLeft){ bestLeft=l; best={kind:"animal", a:ANIMALS[i]}; }
  }
  for(i=0;i<PATCHES.length;i++){
    if(PATCHES[i].state!=="growing") continue;
    var r=CROP_RECIPES[PATCHES[i].seed]; if(!r) continue;
    var pl=r.growSec-(now-PATCHES[i].plantedAt);
    if(pl<bestLeft){ bestLeft=pl; best={kind:"patch", p:PATCHES[i]}; }
  }
  if(best && best.kind==="animal"){
    best.a.fedAt=now-best.a.makeSec;
    spawnProduce(best.a);              // it is out on the grass THIS instant
    return "animal";
  }
  if(best && best.kind==="patch"){
    best.p.plantedAt = now - CROP_RECIPES[best.p.seed].growSec;
    makeReady(best.p);                 // takeable THIS instant, not next frame
    return "crop";
  }
  // Nothing is in flight at all, so the order is the only lever left: ask for
  // something she is actually holding.
  if(order && !order.sent && stack.length){
    var kinds=[]; for(i=0;i<stack.length && kinds.length<3;i++){
      if(kinds.indexOf(stack[i].userData.kind)<0) kinds.push(stack[i].userData.kind);
    }
    var items=kinds.map(function(k){ return {kind:k, filled:false, el:null}; });
    order={items:items, pay:orderPay(items), sent:false, face:ORDERS_DONE%CUSTOMERS.length};
    renderOrder();
    return "order";
  }
  return "none";
}
var idleT=0, idleFixes=0;
function watchIdle(dt){
  if(!BOOTED) return;                  // nothing to fix before the farm is hers
  if(basketWaiting()) return;          // the basket IS the thing she can do
  idleT-=dt; if(idleT>0) return;
  idleT=1.0;
  if(whatCanSheDoNow()>0) return;
  if(fixIdle()!=="none") idleFixes++;
}

// =========================================================================
//  THE NEXT THING IS ALWAYS VISIBLE — one wrapped present at a time
//
//  A fixed path, in this order, each shown in the shop as a wrapped present
//  with its price under it. Only the NEXT one is ever shown: what comes after
//  is not a list to be daunted by, it is a surprise.
//
//  Six of the eight are built in FM6 to FM8. Until then opening one plays the
//  whole reveal, marks the unlock owned so a later phase honours it, and hops
//  a handful of coins out of the box instead of the thing itself. Mike chose
//  that on 2026-09-07 over a full refund (which would let all eight be opened
//  in one sitting) and over hiding them (which would leave no ladder at all).
// =========================================================================
var UNLOCKS=[
  { id:"pumpkinseed", price:130, name:"Pumpkin seed",     built:true  },
  { id:"farmdog",     price:180, name:"A farm dog",       built:true  },
  { id:"fieldrow",    price:240, name:"Another row",      built:true  },
  { id:"pig",         price:300, name:"A pig",            built:true  },
  { id:"mill",        price:380, name:"The mill",         built:true  },
  { id:"bees",        price:460, name:"Bees",             built:true  },
  { id:"strawberry",  price:560, name:"Strawberry seed",  built:true  },
  { id:"tractor",     price:700, name:"A tractor",        built:true  },
  { id:"farmhand",    price:860, name:"A farmhand",        built:true  }
];
var OWNED={};
var UNBUILT_BACK=0.3;     // a third of the price hops back out of an empty box
function nextUnlock(){
  for(var i=0;i<UNLOCKS.length;i++) if(!OWNED[UNLOCKS[i].id]) return UNLOCKS[i];
  return null;
}

// The present, drawn in code: a box, a ribbon both ways, and a bow. No emoji,
// nothing to read — the shape says present on its own.
var PRESENT_SVG='<svg width="96" height="96" viewBox="0 0 96 96">'+
  '<rect x="16" y="38" width="64" height="42" rx="6" fill="#E86A6A" stroke="#B84B4B" stroke-width="2.5"/>'+
  '<rect x="11" y="28" width="74" height="15" rx="5" fill="#F27E7E" stroke="#B84B4B" stroke-width="2.5"/>'+
  '<rect x="42" y="28" width="12" height="52" fill="#FFD86B" stroke="#D9A82C" stroke-width="2"/>'+
  '<rect x="11" y="31" width="74" height="9" fill="#FFD86B" stroke="#D9A82C" stroke-width="2"/>'+
  '<path d="M48 28 C40 24 30 12 38 8 C45 5 47 18 48 28 Z" fill="#FFD86B" stroke="#D9A82C" stroke-width="2.2"/>'+
  '<path d="M48 28 C56 24 66 12 58 8 C51 5 49 18 48 28 Z" fill="#FFD86B" stroke="#D9A82C" stroke-width="2.2"/>'+

// ------------------------------------------------------------- THE REVEAL
// The biggest celebration in the game, and the only one allowed to take three
// seconds: confetti, the plane over the top, and the thing hopping out of the
// box. Everything else in the farm is under half a second.
var REVEAL={ on:false, t:0, box:null, lid:null, thing:null, unlock:null,
             popped:false, x:0, z:0, scale:1.45 };

function revealUnlock(U){
  if(REVEAL.on) return false;
  REVEAL.on=true; REVEAL.t=0; REVEAL.unlock=U; REVEAL.popped=false;
  REVEAL.x=kid.position.x; REVEAL.z=kid.position.z-3.6;
  REVEAL.scale=1.45;                     // it is the hero of its own moment
  REVEAL.box=buildPresentBox(); REVEAL.box.position.set(REVEAL.x,0,REVEAL.z);
  REVEAL.box.scale.setScalar(0.01); scene.add(REVEAL.box);
  REVEAL.lid=buildPresentLid(); REVEAL.lid.position.set(REVEAL.x,1.3,REVEAL.z);
  REVEAL.lid.scale.setScalar(0.01); scene.add(REVEAL.lid);
  planeFlyBy();
  sfx("whoosh"); haptic("light");
  return true;
}
function updateReveal(dt){
  if(!REVEAL.on) return;
  REVEAL.t+=dt;
  var t=REVEAL.t, e;
  if(t<0.35){                                  // the box lands
    e=t/0.35; var s=e*e*(3-2*e)*REVEAL.scale;
    REVEAL.box.scale.setScalar(s);
    REVEAL.lid.scale.setScalar(s);
    REVEAL.lid.position.y=1.3*REVEAL.scale;
  } else if(t<1.0){                            // it shakes: something is in there
    REVEAL.box.rotation.z=Math.sin(t*34)*0.07;
    REVEAL.lid.rotation.z=Math.sin(t*34)*0.07;
    REVEAL.lid.position.y=1.3+Math.abs(Math.sin(t*17))*0.10;
  } else {
    if(!REVEAL.popped){                        // POP
      REVEAL.popped=true;
      REVEAL.box.rotation.z=0;
      sfx("celebrate"); haptic("success");
      confettiBurst(64);
      sparklePuff(REVEAL.x, 1.5, REVEAL.z, 22);
      var U=REVEAL.unlock;
      applyUnlock(U.id);               // the farm changes WITH the confetti
      if(U.built){
        REVEAL.thing=unlockModel(U.id);
      }
      if(!REVEAL.thing){
        // the empty box: a fistful of coins, and the unlock still becomes hers
        REVEAL.thing=buildCoinCluster();
        var back=Math.round(U.price*UNBUILT_BACK);
        addCoins(back); flashToast("+"+back); coinBurstToPill(back);
      }
      if(REVEAL.thing){ REVEAL.thing.position.set(REVEAL.x,1.1*REVEAL.scale,REVEAL.z);
        REVEAL.thing.scale.setScalar(REVEAL.scale); scene.add(REVEAL.thing); }
    }
    var u=t-1.0;
    REVEAL.lid.position.y = 1.3*REVEAL.scale + u*3.2 - u*u*2.6;   // the lid flips away
    REVEAL.lid.rotation.z += dt*5.2;
    REVEAL.lid.rotation.x += dt*3.4;
    if(REVEAL.thing){
      REVEAL.thing.position.y = 1.1*REVEAL.scale + Math.sin(Math.min(1,u/0.6)*Math.PI)*1.2
                                    + Math.sin(t*2.4)*0.08;
      REVEAL.thing.rotation.y += dt*1.8;
      var pop = (u<0.3 ? (1+Math.sin(u/0.3*Math.PI)*0.3) : 1) * REVEAL.scale;
      REVEAL.thing.scale.setScalar(pop);
    }
    if(u>1.9){                                          // and it is put away
      var f=Math.max(0.001, 1-(u-1.9)*2.4);
      REVEAL.box.scale.setScalar(f*REVEAL.scale);
      REVEAL.lid.scale.setScalar(f*REVEAL.scale);
      if(REVEAL.thing) REVEAL.thing.scale.setScalar(f*REVEAL.scale);
      if(u>2.35) endReveal();
    }
  }
}
function endReveal(){
  if(REVEAL.box) scene.remove(REVEAL.box);
  if(REVEAL.lid) scene.remove(REVEAL.lid);
  if(REVEAL.thing) scene.remove(REVEAL.thing);
  REVEAL.on=false; REVEAL.box=REVEAL.lid=REVEAL.thing=null; REVEAL.unlock=null;
  updateShopButton(); renderShop();
}
function buildCoinCluster(){
  var p=[], i;
  for(i=0;i<7;i++){
    var a=(i/7)*Math.PI*2, r=0.30+((i%3)*0.10);
    p.push(hbTube(0.30,0.30,0.10,0xF7C948,
      {p:[Math.cos(a)*r, (i%4)*0.16, Math.sin(a)*r], r:[Math.PI/2,0,(i*0.4)]},14));
  }
  var g=new THREE.Group(); g.add(hbMesh(hbBake(p)));
  return g;
}

// The plane goes over the top of the whole thing. It is the farm's own
// biggest noise and it costs nothing to reuse here.
function planeFlyBy(){
  if(!plane || planeBusy()) return false;
  PL.phase="flyby"; PL.t=0;
  PL.fb={ x0:kid.position.x-30, x1:kid.position.x+30, z:kid.position.z-8 };
  return true;
}

// =========================================================================
//  FM6 — THE FIRST THREE PRESENTS, BUILT FOR REAL
//
//  FM5 shipped the ladder with hollow boxes: opening one marked the unlock
//  hers and hopped some coins back out. These three are now real things.
//
//    1. THE PUMPKIN SEED — a fourth crop, the dearest and the slowest, and
//       the biggest single thing an order can ask for. It appears in the seed
//       pop-up only once the present has been opened.
//    2. THE FARM DOG — a companion who tidies up after her. Deliberately NOT
//       an autoplayer: see the rule on DOG_PATIENCE below.
//    3. THE SECOND FIELD ROW — three more patches, added to the south so
//       nothing she already planted moves.
//
//  An unlock is applied by applyUnlock(), which is idempotent, because it is
//  called both when a present is opened AND on every load of a save that
//  already has that present in it.
// =========================================================================

// ------------------------------------------------------------- THE FARM DOG
var DOG_COLORS={ coat:0xD9A05B, coatD:0xB47F3F, belly:0xF2DCBB, nose:0x3A2A1E, tongue:0xE0798C };
function buildDog(){
  var C=DOG_COLORS, p=[], g=new THREE.Group();
  // THE FIRST CUT OF THIS WENT ON THE MODEL STAND AND CAME BACK A BEAR CUB:
  // the head was too big and sat straight on the body, the muzzle was the same
  // colour as everything else so it vanished, the ears did not read, and the
  // tail stood up like an aerial. Four fixes, and all four are silhouette:
  // a LONG LOW body, a smaller head set high on a neck, a PALE muzzle that
  // sticks out in front of it, and big ears hanging down the sides.
  p.push(hbTurn([[0.001,-0.72],[0.26,-0.62],[0.33,-0.20],[0.34,0.24],[0.28,0.56],[0.001,0.64]],
    C.coat, {r:[Math.PI/2,0,0], p:[0,0.50,-0.04]}, 14));
  p.push(hbTurn([[0.001,-0.46],[0.19,-0.36],[0.22,0.22],[0.001,0.36]],
    C.belly, {r:[Math.PI/2,0,0], s:[1,0.45,1], p:[0,0.31,0.00]}, 12));
  // a neck, so the head is ON something rather than merged into the shoulders
  p.push(hbTube(0.17,0.19,0.34,C.coat,{r:[0.55,0,0],p:[0,0.76,0.48]},9));
  p.push(hbBall(0.245, C.coat, {p:[0,0.94,0.62]}, 12));
  // THE MUZZLE, pale and projecting — it is what makes it a dog
  p.push(hbTurn([[0.001,-0.19],[0.135,-0.13],[0.125,0.11],[0.001,0.17]],
    C.belly, {r:[Math.PI/2,0,0], p:[0,0.86,0.86]}, 10));
  p.push(hbBall(0.075, C.nose, {p:[0,0.88,1.02]}, 8));
  // ears hanging DOWN the sides of the head, flattened, big enough to read
  p.push(hbBall(0.17, C.coatD, {s:[0.42,1.25,0.80], r:[0.15,0,0.30], p:[-0.235,0.86,0.56]}, 10));
  p.push(hbBall(0.17, C.coatD, {s:[0.42,1.25,0.80], r:[0.15,0,-0.30], p:[0.235,0.86,0.56]}, 10));
  // eyes and brows, or it has no face at all from the game's overhead camera
  p.push(hbBall(0.050, C.nose, {p:[-0.115,1.02,0.79]}, 7));
  p.push(hbBall(0.050, C.nose, {p:[0.115,1.02,0.79]}, 7));
  g.add(hbMesh(hbBake(p)));
  // the legs move, so they are their own meshes
  function leg(x,z){
    var l=hbMesh(hbBake([hbTube(0.090,0.080,0.38,DOG_COLORS.coatD,{p:[0,-0.19,0]},7),
                         hbBall(0.105,DOG_COLORS.belly,{p:[0,-0.38,0.03]},7)]));
    l.position.set(x,0.40,z); g.add(l); return l;
  }
  g.userData.legs=[leg(-0.21,0.36), leg(0.21,0.36), leg(-0.21,-0.36), leg(0.21,-0.36)];
  // and the tail: SHORT, THICK and curled up over its back, which is the last
  // bit of dog-shaped silhouette there is to have
  var tail=hbMesh(hbBake([hbTube(0.085,0.055,0.40,DOG_COLORS.coat,{p:[0,0.20,0]},8),
                          hbBall(0.085,DOG_COLORS.belly,{r:[0,0,0],p:[0.09,0.40,0]},8)]));
  tail.position.set(0,0.66,-0.66); tail.rotation.x=-0.95; g.add(tail);
  g.userData.tail=tail;
  return g;
}

// THE RULE THAT KEEPS HER PLAYING. A dog that fetched everything the moment it
// appeared would leave a child with nothing to walk to, which is the exact
// opposite of what FM5's never-idle rule is protecting. So he only tidies up
// what she has LEFT BEHIND: a thing has to have been sitting ready for a while
// AND be a long way from where she is, and he carries one at a time, slower
// than she walks. He is help, not an autoplayer.
var DOG_SPEED=4.6;          // she runs at 6.4, so she can always beat him to it
var DOG_PATIENCE=10;        // seconds a thing must have sat there, forgotten
var DOG_MIN_AWAY=7.0;       // and how far from her it must be before he bothers
var DOG_HEEL=2.3;           // how close behind her he settles
var DOG_LOOK=0.8;           // how often he looks for a job
var DOG = { obj:null, x:-9.5, z:1.6, yaw:0, state:"follow", target:null,
            carry:null, carryObj:null, lookT:0, trot:0 };

function spawnDog(){
  if(DOG.obj) return false;
  DOG.obj=buildDog();
  DOG.x=kid.position.x-1.6; DOG.z=kid.position.z-1.6;
  DOG.obj.position.set(DOG.x,0,DOG.z);
  DOG.obj.scale.setScalar(0.15);        // he arrives with a pop, like the duck
  DOG.popIn=0;
  scene.add(DOG.obj);
  return true;
}
function dogHasDog(){ return !!DOG.obj; }

// Everything sitting out that she has walked away from. Returns the FURTHEST
// forgotten thing, because the nearest one she is most likely to come back for.
function dogFindJob(now){
  var best=null, bestD=-1, i, d;
  for(i=0;i<PATCHES.length;i++){
    var P=PATCHES[i];
    if(P.state!=="ready" || P.sparkleT<DOG_PATIENCE) continue;
    d=Math.hypot(kid.position.x-P.x, kid.position.z-P.z);
    if(d<DOG_MIN_AWAY || d<bestD) continue;
    bestD=d; best={t:"patch", p:P, x:P.x, z:P.z};
  }
  for(i=0;i<ANIMALS.length;i++){
    var A=ANIMALS[i];
    if(A.state!=="ready" || !A.produce || A.magnet!=null) continue;
    if(A.readyAt==null || (now-A.readyAt)<DOG_PATIENCE) continue;
    d=Math.hypot(kid.position.x-A.produceX, kid.position.z-A.produceZ);
    if(d<DOG_MIN_AWAY || d<bestD) continue;
    bestD=d; best={t:"animal", a:A, x:A.produceX, z:A.produceZ};
  }
  return best;
}
// Is the job still there? She may well have got there first, and that is the
// point of him being slower than her.
function dogJobAlive(J){
  if(!J) return false;
  if(J.t==="patch") return J.p.state==="ready";
  return J.a.state==="ready" && !!J.a.produce;
}
function dogTake(J){
  var kind=null, wx=J.x, wz=J.z;
  if(J.t==="patch"){
    var P=J.p;
    kind=P.seed;
    scene.remove(P.crop); P.crop=null;
    if(P.halo){ scene.remove(P.halo); P.halo=null; }
    P.state="empty"; P.seed=null; P.ring.visible=true; P.chimed=false; P.sparkleT=0;
  } else {
    var A=J.a;
    kind=A.gives;
    scene.remove(A.produce); A.produce=null;
    if(A.halo){ scene.remove(A.halo); A.halo=null; }
    A.produceSide=null; A.magnet=null; A.readyAt=null;
    A.state="hungry"; A.happy=0.6;
  }
  if(!kind || !ITEM(kind)) return false;
  DOG.carry=kind;
  DOG.carryObj=new THREE.Group();
  DOG.carryObj.add(hbMesh(hbBake(ITEM(kind).parts(0.62))));
  scene.add(DOG.carryObj);
  sparklePuff(wx, 0.6, wz, 6);
  sfx("select");
  return true;
}
function dogDrop(){
  if(!DOG.carry) return;
  pushOntoStack(DOG.carry, new THREE.Vector3(DOG.x, 1.0, DOG.z));
  sfx("pickup"); haptic("light");
  if(DOG.carryObj){ scene.remove(DOG.carryObj); DOG.carryObj=null; }
  DOG.carry=null;
}

function updateDog(dt, now){
  if(!DOG.obj) return;
  if(DOG.popIn!=null && DOG.popIn<1){
    DOG.popIn=Math.min(1, DOG.popIn+dt*1.6);
    var e=1+Math.sin(DOG.popIn*Math.PI)*0.22;
    DOG.obj.scale.setScalar((0.15+0.85*DOG.popIn)*e);
    if(DOG.popIn>=1) DOG.obj.scale.setScalar(1);
  }
  // where he is trying to be
  var tx, tz, stop;
  if(DOG.state==="toItem" && dogJobAlive(DOG.target)){
    tx=DOG.target.x; tz=DOG.target.z; stop=0.9;
  } else {
    if(DOG.state==="toItem") DOG.state="follow";        // she beat him to it
    tx=kid.position.x; tz=kid.position.z; stop=DOG.HEEL||DOG_HEEL;
  }
  var dx=tx-DOG.x, dz=tz-DOG.z, d=Math.hypot(dx,dz), moving=false;
  if(d-stop>0.02){
    // He eases down as he gets there so he does not skate past — but with a
    // FLOOR under the easing, and never overshooting. Without the floor the
    // last hand-width takes forever: the first cut of this crept toward a
    // ready crop 0.9 units away and never once reached it.
    var k=Math.max(0.18, Math.min(1, (d-stop)/0.8));
    var step=Math.min(DOG_SPEED*k*dt, d-stop);
    DOG.x += (dx/d)*step;
    DOG.z += (dz/d)*step;
    DOG.yaw=Math.atan2(dx,dz);
    moving=step>0.012;
  } else if(DOG.state==="toItem"){
    dogTake(DOG.target); DOG.target=null; DOG.state="back";
  } else if(DOG.state==="back"){
    dogDrop(); DOG.state="follow";
  }
  // HE IGNORES THE FENCES ON PURPOSE. A dog goes under a rail, and giving him
  // a pathfinder to solve a problem a dog does not have would be silly.
  DOG.obj.position.set(DOG.x, 0, DOG.z);
  DOG.obj.rotation.y=DOG.yaw;
  // trot, and a tail that never stops
  DOG.trot += dt*(moving?11:2.2);
  var legs=DOG.obj.userData.legs, sw=Math.sin(DOG.trot)*(moving?0.6:0.05);
  legs[0].rotation.x= sw; legs[3].rotation.x= sw;
  legs[1].rotation.x=-sw; legs[2].rotation.x=-sw;
  DOG.obj.position.y = moving ? Math.abs(Math.sin(DOG.trot))*0.05 : 0;
  DOG.obj.userData.tail.rotation.z=Math.sin(now*7.5)*0.5;
  // the thing in his mouth rides in front of his nose
  if(DOG.carryObj){
    DOG.carryObj.position.set(DOG.x+Math.sin(DOG.yaw)*0.95, 0.80, DOG.z+Math.cos(DOG.yaw)*0.95);
    DOG.carryObj.rotation.y+=dt*1.6;
  }
  // and every so often he looks for something she has forgotten
  DOG.lookT-=dt;
  if(DOG.lookT<=0){
    DOG.lookT=DOG_LOOK;
    if(DOG.state==="follow" && !DOG.carry){
      var J=dogFindJob(now);
      if(J){ DOG.target=J; DOG.state="toItem"; }
    }
  }
}

// ------------------------------------------------- WHAT A PRESENT ACTUALLY DOES
// Idempotent, every one of them: this runs when a present is opened AND on
// every load of a save that already has that present in it.
function applyUnlock(id){
  if(id==="pumpkinseed" || id==="strawberry" ||
     id==="tomatoseed"  || id==="melonseed"){ buildSeedPicker(); return true; }
  if(id==="farmdog"){ return spawnDog(); }
  if(id==="fieldrow"){ return unlockFieldRing(); }
  if(id==="pig"){ return placePig(); }
  if(id==="mill"){ return placeBuilding("mill", ISLE.mill, -0.35); }
  if(id==="dairy"){ return placeBuilding("dairy", ISLE.dairy, 0.3); }
  if(id==="bees"){ return placeHive(); }
  if(id==="tractor"){ return placeTractor(); }
  if(id==="farmhand"){ return spawnHand(); }
  return false;
}
function applyAllExtras(){
  for(var i=0;i<EXTRAS.length;i++)
    if(EXTRAS[i].id!=="duck" && OWNED[EXTRAS[i].id]) applyUnlock(EXTRAS[i].id);
}
function applyAllUnlocks(){
  for(var i=0;i<UNLOCKS.length;i++) if(OWNED[UNLOCKS[i].id]) applyUnlock(UNLOCKS[i].id);
  applyAllExtras();
}

// The thing that hops out of the box. A present whose thing does not exist yet
// still has no model, and FM5's fistful of coins stands in for it.
// A mill is over three units tall and a strawberry is a fifth of one. The box
// is the same size for all of them, so whatever comes out is scaled to fit it.
function fitReveal(obj, want){
  if(!obj) return null;
  var box=new THREE.Box3().setFromObject(obj);
  var span=Math.max(box.max.x-box.min.x, box.max.y-box.min.y, box.max.z-box.min.z);
  if(span>0.001){
    var wrap=new THREE.Group();
    obj.scale.setScalar((want||1.5)/span);
    obj.position.y = -box.min.y*obj.scale.y;
    wrap.add(obj);
    return wrap;
  }
  return obj;
}
function unlockModel(id){
  if(id==="pumpkinseed"){
    var g=new THREE.Group(); g.add(hbMesh(hbBake(CROP_RECIPES.pumpkin.parts(1.15)))); return g;
  }
  if(id==="strawberry"){
    var sg=new THREE.Group(); sg.add(hbMesh(hbBake(CROP_RECIPES.strawberry.parts(1.3)))); return sg;
  }
  if(id==="mill") return fitReveal(buildMill(), 1.7);
  if(id==="bees") return fitReveal(buildHive(), 1.5);
  if(id==="pig"){
    // the pig is a library model, so the one that hops out of the box is its
    // OWN body, built the same way the one in the pen is
    var body=makeAnimalBody("pig");
    return body ? fitReveal(body.obj, 1.5) : null;
  }
  if(id==="farmdog") return buildDog();
  if(id==="tractor") return fitReveal(buildTractor(), 1.7);
  if(id==="farmhand") return fitReveal(buildHand(), 1.7);
  if(id==="fieldrow"){
    var f=new THREE.Group(), i;
    for(i=0;i<3;i++){
      var d=buildDirtDisc(); d.position.set((i-1)*1.05, 0, 0); d.scale.setScalar(0.62); f.add(d);
      var r=buildDashRing(); r.position.set((i-1)*1.05, 0.02, 0); r.scale.setScalar(0.62); f.add(r);
    }
    return f;
  }
  return null;
}


// =========================================================================
//  FM7 — THE WATERING CAN. She fetches it from the well once, and after that
//  she holds her finger on a growing crop and it RAINS on it, and it grows
//  twice as fast for as long as she holds. No meter, nothing to run out of,
//  nothing to fail: let go and it is simply not raining any more.
// =========================================================================
var CAN_OWNED=false, canObj=null;
var WATER={ patch:null, t:0, drops:[] };

function buildCan(){
  var p=[];
  p.push(hbTurn([[0.001,0],[0.30,0.03],[0.32,0.44],[0.28,0.52],[0.001,0.52]], 0x6FA9C4, null, 12));
  p.push(hbTube(0.30,0.30,0.07,0x4E86A6,{p:[0,0.55,0]},12));
  p.push(hbTube(0.065,0.065,0.52,0x4E86A6,{r:[0,0,Math.PI/2],p:[0,0.62,0]},8));
  p.push(hbTube(0.07,0.13,0.60,0x4E86A6,{r:[0,0,-0.9],p:[0.34,0.40,0]},9));
  p.push(hbTurn([[0.001,0],[0.17,0.04],[0.001,0.08]], 0x9BD0E2, {r:[0,0,-0.9], p:[0.58,0.62,0]}, 10));
  var g=new THREE.Group(); g.add(hbMesh(hbBake(p)));
  return g;
}
// the same can, arriving without the fanfare, for a farm being restored
function giveCanQuiet(){
  if(CAN_OWNED) return false;
  CAN_OWNED=true; canObj=buildCan(); scene.add(canObj); return true;
}
function giveCan(){
  if(CAN_OWNED) return false;
  CAN_OWNED=true;
  canObj=buildCan();
  scene.add(canObj);
  flashToast("A watering can!");
  sfx("levelup"); haptic("success");
  sparklePuff(ISLE.well.x, 1.2, ISLE.well.z, 14);
  return true;
}
// She picks it up by walking to the well, which is a place she already walks
// past on her way from the barn to the field.
function atTheWell(){
  if(CAN_OWNED || !DRESSED) return;
  if(Math.hypot(kid.position.x-ISLE.well.x, kid.position.z-ISLE.well.z) < 2.8) giveCan();
}
function startWatering(P){
  if(!CAN_OWNED || !P || P.state!=="growing") return false;
  WATER.patch=P; WATER.t=0;
  return true;
}
function stopWatering(){
  WATER.patch=null;
  for(var i=0;i<WATER.drops.length;i++) scene.remove(WATER.drops[i]);
  WATER.drops.length=0;
}
function updateWatering(dt, now){
  if(canObj){
    // it rides on her hip until she needs it, then tips over the crop
    var W=WATER.patch;
    if(W){
      canObj.position.set(W.x-0.9, 1.7, W.z-0.2);
      canObj.rotation.z=-1.05;
      canObj.rotation.y=Math.atan2(W.x-kid.position.x, W.z-kid.position.z);
    } else {
      canObj.position.set(kid.position.x+0.75, 0.55+Math.sin(now*2)*0.03, kid.position.z-0.15);
      canObj.rotation.z=0;
      canObj.rotation.y=kidState.facing;
    }
  }
  var P=WATER.patch;
  if(!P){ return; }
  if(P.state!=="growing"){ stopWatering(); return; }
  // DOUBLE SPEED while she holds: one extra second of growing per second.
  P.plantedAt -= dt;
  // and it rains, so she can see why
  WATER.t-=dt;
  if(WATER.t<=0 && WATER.drops.length<26){
    WATER.t=0.05;
    var d=hbMesh(hbBake([hbBall(0.05,0x9BD0E2,{s:[1,2.2,1]},6)]));
    d.position.set(P.x+(Math.random()-0.5)*PATCH_R*1.5, 1.45+Math.random()*0.5,
                   P.z+(Math.random()-0.5)*PATCH_R*1.5);
    d.userData.v=2.6+Math.random()*1.6;
    scene.add(d); WATER.drops.push(d);
  }
  for(var i=WATER.drops.length-1;i>=0;i--){
    var dr=WATER.drops[i];
    dr.position.y -= dr.userData.v*dt;
    if(dr.position.y<0.08){
      scene.remove(dr); WATER.drops.splice(i,1);
      if(Math.random()<0.4) puff(dr.position.x, 0.10, dr.position.z, 0x9BD0E2, 2, 0.5, 0.7, 0.22);
    }
  }
}

//  FM7 — EVERY ANIMAL GETS A NAME, AND THE NAME IS A PICTURE.
//
//  She cannot type and should never be asked to. Walk up to an animal, tap it,
//  and pick one of eight shapes. That shape is its name from then on, and it
//  floats over its head whenever she is near it.
// =========================================================================
var NAME_MARKS=[
  {id:"star",   c:0xF7C948, svg:'<path d="M20 4 L24.5 15 L36 16 L27 24 L30 35 L20 29 L10 35 L13 24 L4 16 L15.5 15 Z"/>'},
  {id:"heart",  c:0xE8637C, svg:'<path d="M20 34 C6 24 4 15 10 10 C15 6 20 11 20 13 C20 11 25 6 30 10 C36 15 34 24 20 34 Z"/>'},
  {id:"flower", c:0xE86FA8, svg:'<g><circle cx="20" cy="10" r="6"/><circle cx="30" cy="20" r="6"/><circle cx="20" cy="30" r="6"/><circle cx="10" cy="20" r="6"/><circle cx="20" cy="20" r="5.5" fill="#FFF3C4"/></g>'},
  {id:"crown",  c:0xF0A72E, svg:'<path d="M5 30 L7 12 L14 20 L20 8 L26 20 L33 12 L35 30 Z"/>'},
  {id:"moon",   c:0xC9B8F0, svg:'<path d="M26 6 A15 15 0 1 0 26 34 A12 12 0 1 1 26 6 Z"/>'},
  {id:"sun",    c:0xFFD34E, svg:'<g><circle cx="20" cy="20" r="9"/><path d="M20 2 v6 M20 32 v6 M2 20 h6 M32 20 h6 M7 7 l4 4 M29 29 l4 4 M33 7 l-4 4 M11 29 l-4 4" stroke-width="3.2" stroke-linecap="round"/></g>'},
  {id:"leaf",   c:0x63C46A, svg:'<path d="M32 8 C14 8 8 18 8 32 C22 32 32 24 32 8 Z"/>'},
  {id:"bell",   c:0xE0A24E, svg:'<path d="M20 5 C27 5 29 12 29 20 L32 28 H8 L11 20 C11 12 13 5 20 5 Z M20 30 a3 3 0 0 0 0 6 a3 3 0 0 0 0 -6"/>'}
];
function markSvg(id, size){
  var i, M=null;
  for(i=0;i<NAME_MARKS.length;i++) if(NAME_MARKS[i].id===id) M=NAME_MARKS[i];
  if(!M) return "";
  return '<svg width="'+(size||40)+'" height="'+(size||40)+'" viewBox="0 0 40 40" '+
    'fill="#'+M.c.toString(16).padStart(6,"0")+'" stroke="#5B4A2A" stroke-width="2" '+
    'stroke-linejoin="round">'+M.svg+'</svg>';
}
// the same shape, in 3D, to float over the animal it belongs to
function buildMark3D(id){
  var i, M=null;
  for(i=0;i<NAME_MARKS.length;i++) if(NAME_MARKS[i].id===id) M=NAME_MARKS[i];
  if(!M) return null;
  var p=[];
  if(id==="star"||id==="flower"||id==="sun"){
    for(i=0;i<(id==="star"?5:(id==="sun"?8:5));i++){
      var a=(i/(id==="star"?5:(id==="sun"?8:5)))*Math.PI*2;
      p.push(hbBall(id==="sun"?0.09:0.13, M.c,
        {s:[1,0.5,1], p:[Math.cos(a)*0.24, 0, Math.sin(a)*0.24]}, 7));
    }
    p.push(hbBall(0.15, id==="flower"?0xFFF3C4:M.c, {s:[1,0.5,1]}, 8));
  } else if(id==="heart"){
    p.push(hbBall(0.15, M.c, {s:[1,0.5,1], p:[-0.11,0,0.07]}, 8));
    p.push(hbBall(0.15, M.c, {s:[1,0.5,1], p:[0.11,0,0.07]}, 8));
    p.push(hbCone(0.20, 0.34, M.c, {r:[Math.PI/2,0,0], p:[0,0,-0.14]}, 8));
  } else if(id==="moon"){
    p.push(hbTube(0.24,0.24,0.10,M.c,{p:[0,0,0]},14));
    p.push(hbTube(0.17,0.17,0.13,0x8FD262,{p:[0.13,0,0]},12));
  } else if(id==="crown"){
    p.push(hbTube(0.24,0.24,0.12,M.c,{p:[0,0,0]},10));
    for(i=0;i<4;i++){
      var ca=(i/4)*Math.PI*2;
      p.push(hbCone(0.08,0.22,M.c,{p:[Math.cos(ca)*0.22, 0.12, Math.sin(ca)*0.22]},7));
    }
  } else if(id==="leaf"){
    p.push(hbBall(0.26, M.c, {s:[1.5,0.34,0.85], r:[0,0.6,0]}, 10));
  } else {
    p.push(hbTurn([[0.001,0],[0.22,0.06],[0.16,0.30],[0.001,0.34]], M.c, null, 10));
    p.push(hbBall(0.07, M.c, {p:[0,-0.05,0]}, 6));
  }
  var g=new THREE.Group(); g.add(hbMesh(hbBake(p)));
  return g;
}
var namingAnimal=null;
function buildNamePicker(){
  if(!nameRowEl) return;
  nameRowEl.innerHTML="";
  NAME_MARKS.forEach(function(M){
    var el=document.createElement("div");
    el.className="mark"; el.dataset.mark=M.id;
    el.innerHTML=markSvg(M.id, 46);
    el.addEventListener("click", function(){ pickName(M.id); });
    nameRowEl.appendChild(el);
  });
}
buildNamePicker();   // NAME_MARKS and markSvg both live above this line
function openNamePicker(A){
  if(!nameCardEl) return false;
  namingAnimal=A;
  Array.prototype.forEach.call(nameRowEl.querySelectorAll(".mark"), function(el){
    el.classList.toggle("on", A.mark===el.dataset.mark);
  });
  nameCardEl.classList.add("up");
  return true;
}
function closeNamePicker(){ if(nameCardEl) nameCardEl.classList.remove("up"); namingAnimal=null; }
function pickName(id){
  var A=namingAnimal; if(!A) return false;
  A.mark=id;
  if(A.markObj){ scene.remove(A.markObj); A.markObj=null; }
  sfx("select"); haptic("light");
  sparklePuff(A.x, (ANIMAL_KINDS[A.kind].wantAt||1.6)*0.9, A.z, 9);
  closeNamePicker();
  scheduleSave();
  return true;
}
// the mark floats over its animal, but only when she is near enough to be
// looking at it, so eight badges never clutter the field at once
function updateMarks(dt, now){
  for(var i=0;i<ANIMALS.length;i++){
    var A=ANIMALS[i];
    if(!A.mark) continue;
    var near=Math.hypot(kid.position.x-A.x, kid.position.z-A.z) < 8.5;
    if(near && !A.markObj){
      A.markObj=buildMark3D(A.mark);
      if(A.markObj) scene.add(A.markObj);
    } else if(!near && A.markObj){
      scene.remove(A.markObj); A.markObj=null;
    }
    if(A.markObj){
      var K=ANIMAL_KINDS[A.kind];
      A.markObj.position.set(A.x + (A.want?0.85:0), (K.wantAt||1.6)+0.55+Math.sin(now*2.3+i)*0.07, A.z);
      A.markObj.rotation.y += dt*1.1;
    }
  }
}

// =========================================================================
//  FM7 — MAKE IT HERS. Buy a thing, then tap where it goes.
//
//  Five things, and none of them does anything except be where she put it —
//  which is the point. A farm you have arranged is a farm you own. The one
//  that is not only decoration is the flower bed: put those near the hive and
//  the honey comes quicker (see hiveMakeSec).
//
//  Placing is two taps and no dragging: tap the thing, then tap the ground.
//  A drag is a hard gesture for a four-year-old on a moving camera, and this
//  farm already teaches "tap where you want it" for everything else.
// =========================================================================
var DECOR=[];                    // {kind, x, z, yaw, obj}
var DECOR_KINDS=[
  { id:"flowers",   price:30,  name:"Flowers"   },
  { id:"hay",       price:40,  name:"Hay"       },
  { id:"fence",     price:25,  name:"Fence"     },
  { id:"tree",      price:80,  name:"A tree"    },
  { id:"scarecrow", price:120, name:"Scarecrow" }
];
var placing=null;                // the kind she has picked up but not put down
var ghost=null;

function decorPrice(id){
  for(var i=0;i<DECOR_KINDS.length;i++) if(DECOR_KINDS[i].id===id) return DECOR_KINDS[i].price;
  return 30;
}
function buildScarecrow(){
  var p=[];
  p.push(hbTube(0.10,0.10,2.5,0x8C6237,{p:[0,1.25,0]},8));
  p.push(hbTube(0.09,0.09,1.9,0x8C6237,{r:[0,0,Math.PI/2],p:[0,1.85,0]},8));
  p.push(hbTurn([[0.001,0],[0.42,0.10],[0.40,0.72],[0.001,0.80]],0xE8DCA8,{p:[0,1.20,0]},12));
  p.push(hbBall(0.34,0xE8C98A,{s:[1,1.15,1],p:[0,2.30,0]},12));
  p.push(hbTurn([[0.62,0],[0.52,0.06],[0.001,0.30]],0xDCC079,{p:[0,2.52,0]},14));
  p.push(hbBall(0.055,0x3A2A1E,{p:[-0.13,2.34,0.28]},6));
  p.push(hbBall(0.055,0x3A2A1E,{p:[0.13,2.34,0.28]},6));
  p.push(hbBall(0.05,0x3A2A1E,{s:[2.6,0.7,1],p:[0,2.16,0.30]},6));
  var i;
  for(i=0;i<5;i++){
    p.push(hbCone(0.07,0.30,0xDCC079,{r:[0.4,0,(i-2)*0.35],p:[-0.92+i*0.05,1.72,0]},6));
    p.push(hbCone(0.07,0.30,0xDCC079,{r:[0.4,0,(i-2)*0.35],p:[0.92-i*0.05,1.72,0]},6));
  }
  var g=new THREE.Group(); g.add(hbMesh(hbBake(p)));
  return g;
}
function buildFencePiece(){
  var g=new THREE.Group();
  buildFenceRun(g, 3.0, 0, 0, 0);
  var post=buildFencePost(); post.position.set(-1.5,0,0); g.add(post);
  var post2=buildFencePost(); post2.position.set(1.5,0,0); g.add(post2);
  return g;
}
function buildDecor(kind){
  if(kind==="hay"){ return buildHayBale(); }
  if(kind==="scarecrow"){ return buildScarecrow(); }
  if(kind==="fence"){ return buildFencePiece(); }
  if(kind==="tree"){
    var t=NAT_READY ? natGet(["CommonTree_1","CommonTree_3","CommonTree_5"][Math.floor(Math.random()*3)], 5.0) : null;
    if(t) return t;
    // no kit, no problem: a drawn tree in the farm's own hand
    var p=[];
    p.push(hbTube(0.26,0.34,2.0,0x8C6237,{p:[0,1.0,0]},9));
    p.push(hbBall(1.30,0x63A94E,{s:[1,0.85,1],p:[0,2.60,0]},14));
    p.push(hbBall(0.85,0x74B04E,{s:[1,0.85,1],p:[0.75,2.10,0.35]},12));
    var g2=new THREE.Group(); g2.add(hbMesh(hbBake(p))); return g2;
  }
  // flowers
  var f=NAT_READY ? natGet(Math.random()<0.5?"Flower_3_Group":"Flower_4_Group", 1.7) : null;
  if(f) return f;
  var q=[], i, a;
  for(i=0;i<7;i++){
    a=(i/7)*Math.PI*2;
    q.push(hbTube(0.035,0.030,0.55,0x53A045,{p:[Math.cos(a)*0.3,0.28,Math.sin(a)*0.3]},6));
    q.push(hbBall(0.14,[0xE86FA8,0xF7C948,0xE8637C][i%3],
      {s:[1,0.5,1],p:[Math.cos(a)*0.3,0.58,Math.sin(a)*0.3]},8));
  }
  var g3=new THREE.Group(); g3.add(hbMesh(hbBake(q))); return g3;
}

// Where a thing may go: on the island, on open ground, not on the farm itself.
function canPlaceAt(x,z){
  if(Math.hypot(x,z) > ISLAND_R-3.0) return false;
  if(blockedAt(x,z,1.0)) return false;
  if(areaContaining(x,z)) return false;                 // not inside a pen
  if(Math.abs(x-FIELD_CX)<fieldHalf(1)+1.0 && Math.abs(z-FIELD_CZ)<fieldHalf(1)+1.0) return false;
  if(Math.abs(x-RUNWAY.x)<RUNWAY.halfW+2.0 && Math.abs(z-RUNWAY.z)<RUNWAY.halfL+1.0) return false;
  if(Math.abs(z-ISLE.road.z)<3.6) return false;
  if(Math.hypot(x-ISLE.pond.x, z-ISLE.pond.z) < ISLE.pond.r+1.6) return false;
  var i;
  for(i=0;i<DECOR.length;i++) if(Math.hypot(x-DECOR[i].x, z-DECOR[i].z) < 1.9) return false;
  return true;
}
function placeDecor(kind, x, z, yaw, free){
  if(!canPlaceAt(x,z)) return false;
  if(!free && !spendCoins(decorPrice(kind))){ flashToast("Keep saving"); sfx("hit"); return false; }
  var obj=buildDecor(kind);
  if(!obj) return false;
  obj.position.set(x,0,z);
  obj.rotation.y = yaw==null ? Math.random()*6.28 : yaw;
  scene.add(obj);
  DECOR.push({kind:kind, x:x, z:z, yaw:obj.rotation.y, obj:obj});
  if(kind==="tree" || kind==="scarecrow") addCircleBlocker(x,z,0.55,"decor");
  if(!free){
    soilPuff(x,z); sfx("levelup"); haptic("success");
    sparklePuff(x, 0.8, z, 10);
  }
  scheduleSave();
  return true;
}
function clearDecor(){
  for(var i=0;i<DECOR.length;i++) scene.remove(DECOR[i].obj);
  DECOR.length=0;
  for(i=BLOCKERS.length-1;i>=0;i--) if(BLOCKERS[i].tag==="decor") BLOCKERS.splice(i,1);
}

// ---- the ghost that follows her tap until she puts the thing down
function startPlacing(kind){
  if(placing) stopPlacing();
  placing=kind;
  ghost=buildDecor(kind);
  if(ghost){
    ghost.position.set(kid.position.x, 0, kid.position.z+3);
    ghost.traverse(function(o){ if(o.isMesh){ o.material=o.material.clone();
      o.material.transparent=true; o.material.opacity=0.55; } });
    scene.add(ghost);
  }
  closeDecorCard();
  return true;
}
function stopPlacing(){
  if(ghost){ scene.remove(ghost); ghost=null; }
  placing=null;
}
function moveGhost(x,z){
  if(!ghost) return;
  ghost.position.set(x,0,z);
  var ok=canPlaceAt(x,z);
  ghost.traverse(function(o){ if(o.isMesh && o.material) o.material.opacity = ok?0.75:0.25; });
}
// a tap while she is holding something puts it down there
function tapWhilePlacing(x,z){
  if(!placing) return false;
  var kind=placing;
  if(!canPlaceAt(x,z)){ moveGhost(x,z); sfx("hit"); return true; }
  stopPlacing();
  placeDecor(kind, x, z, null, false);
  return true;
}

function renderDecorCard(){
  if(!decorRowEl) return;
  decorRowEl.innerHTML="";
  DECOR_KINDS.forEach(function(D){
    var el=document.createElement("div");
    el.className="thing"+(walletBalance()>=D.price?"":" locked");
    el.dataset.kind=D.id;
    el.innerHTML='<div class="art">'+DECOR_SVG[D.id]+'</div>'+priceBadge(D.price);

// =========================================================================
//  FM7 — WHERE THE NEW THINGS GO, AND HOW SHE GETS THEM.
//
//  The present ladder Mike priced has eight rungs and the dairy, the tomato
//  and the melon are not among them. Rather than change a ladder he has
//  already approved, they are sold in the shop the way the duck always was:
//  ONE extra at a time, cheapest first, under the present. The card still
//  shows exactly two things, which is as much as a four-year-old should have
//  to choose between.
// =========================================================================
// South-west of the field, in its own open ground. The first spot for it put
// its north fence exactly on the coop's south fence and the two read as one
// confusing double rail.
var PIG_C={x:-6.5, z:16.5};
var EXTRAS=[
  { id:"tomatoseed", price:90,  name:"Tomato seed" },
  { id:"duck",       price:120, name:"A duck"      },
  { id:"melonseed",  price:150, name:"Melon seed"  },
  { id:"dairy",      price:260, name:"The dairy"   }
];
function extraOwned(id){ return id==="duck" ? DUCK_BOUGHT : !!OWNED[id]; }
function nextExtra(){
  for(var i=0;i<EXTRAS.length;i++) if(!extraOwned(EXTRAS[i].id)) return EXTRAS[i];
  return null;
}
var EXTRA_SVG={
  tomatoseed: CROP_RECIPES.tomato.svg(96),
  melonseed:  CROP_RECIPES.melon.svg(96),
  duck: null,                                  // DUCK_SVG, taken at render time
  dairy:'<svg width="96" height="96" viewBox="0 0 96 96">'+
