// =========================================================================
//  FM5 — SMALL CELEBRATIONS, CONSTANTLY
//
//  Every action gets a reaction. GAME-FEEL law 1. Each of these is under half
//  a second so it never slows her down, each uses the shared Feel Kit, and
//  each goes quiet when bk_muted is set, because sfx() is the only door.
// =========================================================================
var PUFFS=[];
function puff(x,y,z,color,n,spread,rise,life){
  var i;
  for(i=0;i<(n||8);i++){
    var m=hbMesh(hbBall(0.055+Math.random()*0.06, color, null, 6));
    m.position.set(x,y,z);
    scene.add(m);
    var a=Math.random()*Math.PI*2, s=(spread||1.1)*(0.4+Math.random()*0.8);
    PUFFS.push({ o:m, vx:Math.cos(a)*s, vz:Math.sin(a)*s,
      vy:(rise||1.5)*(0.5+Math.random()*0.9), t:0, life:(life||0.45) });
  }
}
function soilPuff(x,z){ puff(x,0.12,z,0x9C6939,10,1.5,1.1,0.42); }
function sparklePuff(x,y,z,n){ puff(x,y,z,0xFFF3A8,n||9,1.0,1.8,0.45); }
function heartPuff(x,y,z){ puff(x,y,z,0xF2889C,7,0.7,1.9,0.48); }
function updatePuffs(dt){
  for(var i=PUFFS.length-1;i>=0;i--){
    var P=PUFFS[i];
    P.t+=dt;
    if(P.t>=P.life){ scene.remove(P.o); PUFFS.splice(i,1); continue; }
    var u=P.t/P.life;
    P.o.position.x+=P.vx*dt; P.o.position.z+=P.vz*dt;
    P.o.position.y+=(P.vy - u*3.4)*dt;
    P.o.scale.setScalar(Math.max(0.001, 1-u));
  }
}

// Confetti belongs to the reveal alone, so it is DOM over the whole screen
// rather than geometry in the scene: it is the one moment allowed to cover
// everything.
var CONF_COLORS=["#F27E7E","#FFD86B","#8ED08A","#7EC8E3","#C9A0DC","#F6A96B"];
function confettiBurst(n){
  var hud=document.getElementById("hud"); if(!hud) return;
  for(var i=0;i<(n||48);i++) oneConfetti(hud, i);
}
function oneConfetti(hud, i){
  var el=document.createElement("div");
  el.className="confetti";
  el.style.background=CONF_COLORS[i%CONF_COLORS.length];
  var sx=innerWidth*(0.5+(Math.random()-0.5)*0.24);
  var sy=innerHeight*0.44;
  var vx=(Math.random()-0.5)*innerWidth*0.9;
  var vy=-innerHeight*(0.28+Math.random()*0.34);
  var spin=(Math.random()-0.5)*1080;
  var dur=1100+Math.random()*900, t0=performance.now();
  el.style.left=sx+"px"; el.style.top=sy+"px";
  hud.appendChild(el);
  (function drift(){
    var u=Math.min(1,(performance.now()-t0)/dur);
    el.style.transform="translate("+(vx*u)+"px,"+(vy*u + innerHeight*1.15*u*u)+"px) rotate("+(spin*u)+"deg)";
    el.style.opacity=String(u>0.75?(1-(u-0.75)/0.25):1);
    if(u<1) requestAnimationFrame(drift); else el.remove();
  })();
}

// =========================================================================
//  FM8 — HELPERS, A CAST WHO COME BACK, THE STICKER BOOK, AND A PICTURE
//
//  THE ONE RULE THE HELPERS ALL OBEY: they never take the fun part. Harvesting
//  a crop, feeding an animal and the crate whoosh stay hers, always. A helper
//  does the WAITING — the watering, the fetching, the long boring row of holes
//  — and every one of them is slower than she is, so she can beat any of them
//  to anything she wants to do herself.
// =========================================================================

// ------------------------------------------------------------- THE FARMHAND
// He waters. That is all he does. He walks to a crop that is still growing,
// tips his can over it, takes a bite out of the wait and moves on. He cannot
// pick anything, he cannot feed anything, and he never touches a crop that is
// ready — the ready ones are hers.
var HAND_SPEED=3.9;         // she runs at 6.4
var HAND_LOOK=1.0;          // how often he looks for something to water
var HAND_POUR=1.5;          // how long he stands there pouring
var HAND_HELP=0.35;         // and how much of the remaining wait he takes off
var HAND_REST={x:-4.6, z:6.6};
var HAND_C={ skin:0xE9BE93, hat:0xE3CC86, hatD:0xC3A85C, shirt:0xD86F5C,
             dung:0x4C6C93, boot:0x4A3524, can:0x9FB6C4 };
function buildHand(){
  var g=new THREE.Group(), p=[];
  // boots and legs, kept as their own meshes so they can swing when he walks
  var legL=hbMesh(hbBake([
    hbTube(0.20,0.18,0.95,HAND_C.dung,{p:[0,-0.48,0]}),
    hbTurn([[0,-0.98],[0.26,-0.98],[0.28,-0.84],[0.001,-0.80]],HAND_C.boot)
  ]));
  var legR=legL.clone();
  legL.position.set(-0.24,1.06,0); legR.position.set(0.24,1.06,0);
  g.add(legL); g.add(legR);
  // body, arms, head, and a hat with a real brim
  p.push(hbTurn([[0,1.06],[0.44,1.14],[0.46,1.72],[0.40,2.02],[0.001,2.06]],HAND_C.shirt));
  p.push(hbTurn([[0,1.06],[0.45,1.10],[0.44,1.46],[0.001,1.50]],HAND_C.dung));
  p.push(hbTube(0.13,0.13,0.78,HAND_C.shirt,{p:[-0.52,1.58,0.06],r:[0,0,0.30]}));
  p.push(hbTube(0.13,0.13,0.78,HAND_C.shirt,{p:[ 0.52,1.58,0.06],r:[0,0,-0.30]}));
  p.push(hbBall(0.34,HAND_C.skin,{p:[0,2.34,0]}));
  p.push(hbBall(0.075,0x3A2A1E,{p:[-0.13,2.36,0.29],s:[1,1.15,0.6]}));
  p.push(hbBall(0.075,0x3A2A1E,{p:[ 0.13,2.36,0.29],s:[1,1.15,0.6]}));
  p.push(hbTurn([[0,2.56],[0.86,2.56],[0.88,2.62],[0.34,2.66],[0.32,2.86],[0.001,2.90]],HAND_C.hat));
  p.push(hbTurn([[0.30,2.62],[0.34,2.62],[0.34,2.70],[0.30,2.70]],HAND_C.hatD));
  g.add(hbMesh(hbBake(p)));
  // the can rides in his hand, and it is the same shape as hers
  var can=hbMesh(hbBake([
    hbTurn([[0,0],[0.26,0],[0.28,0.34],[0.22,0.38],[0.001,0.38]],HAND_C.can),
    hbTube(0.055,0.075,0.40,HAND_C.can,{p:[0.30,0.22,0],r:[0,0,-0.85]})
  ]));
  can.position.set(0.62,1.28,0.22);
  g.add(can);
  g.userData.legL=legL; g.userData.legR=legR; g.userData.can=can;
  return g;
}
var HAND={ obj:null, x:HAND_REST.x, z:HAND_REST.z, yaw:0, state:"idle",
           target:null, pour:0, lookT:0, walkT:0, popIn:null };
function spawnHand(){
  if(HAND.obj) return false;
  HAND.obj=buildHand();
  HAND.x=kid.position.x+1.8; HAND.z=kid.position.z+1.8;
  HAND.obj.position.set(HAND.x,0,HAND.z);
  HAND.obj.scale.setScalar(0.15);
  HAND.popIn=0;
  HAND.state="idle"; HAND.target=null; HAND.pour=0;
  scene.add(HAND.obj);
  return true;
}
function hasHand(){ return !!HAND.obj; }
// The crop with the LONGEST left to wait, because that is the one she is most
// likely to have given up on. Ready crops are invisible to him on purpose.
function handFindJob(){
  var best=null, bestLeft=-1, now=performance.now()/1000, i;
  for(i=0;i<PATCHES.length;i++){
    var P=PATCHES[i];
    if(P.state!=="growing" || P.cover || P.locked) continue;
    var r=CROP_RECIPES[P.seed]; if(!r) continue;
    var left=(r.growSec||34)-(now-P.plantedAt);
    if(left<=1.2) continue;                    // nearly done: leave it to her
    if(left>bestLeft){ bestLeft=left; best=P; }
  }
  return best;
}
function handStillGrowing(P){ return !!P && P.state==="growing" && !P.cover; }
function handPourOn(P){
  var r=CROP_RECIPES[P.seed]; if(!r) return false;
  var now=performance.now()/1000;
  var left=Math.max(0,(r.growSec||34)-(now-P.plantedAt));
  P.plantedAt -= left*HAND_HELP;
  puff(P.x,0.55,P.z,0x7EC8E3,7,0.55,1.3,0.42);
  sfx("select");
  return true;
}
function updateHand(dt, now){
  if(!HAND.obj) return;
  if(HAND.popIn!=null && HAND.popIn<1){
    HAND.popIn=Math.min(1,HAND.popIn+dt*1.6);
    var e=1+Math.sin(HAND.popIn*Math.PI)*0.22;
    HAND.obj.scale.setScalar((0.15+0.85*HAND.popIn)*e);
    if(HAND.popIn>=1) HAND.obj.scale.setScalar(1);
  }
  var tx=HAND_REST.x, tz=HAND_REST.z, stop=0.4, moving=false;
  if(HAND.state==="pour"){
    // standing over the crop, tipping the can
    HAND.pour-=dt;
    var tip=Math.min(1,(HAND_POUR-HAND.pour)/0.45);
    if(HAND.obj.userData.can) HAND.obj.userData.can.rotation.z=-1.05*tip;
    if(Math.random()<dt*7) puff(HAND.target.x,0.75,HAND.target.z,0x7EC8E3,1,0.25,0.7,0.35);
    if(HAND.pour<=0 || !handStillGrowing(HAND.target)){
      if(handStillGrowing(HAND.target)) handPourOn(HAND.target);
      if(HAND.obj.userData.can) HAND.obj.userData.can.rotation.z=0;
      HAND.target=null; HAND.state="idle";
    }
  } else {
    if(HAND.state==="toCrop" && handStillGrowing(HAND.target)){
      tx=HAND.target.x; tz=HAND.target.z; stop=1.1;
    } else if(HAND.state==="toCrop"){
      HAND.state="idle"; HAND.target=null;
    }
    var dx=tx-HAND.x, dz=tz-HAND.z, d=Math.hypot(dx,dz);
    if(d-stop>0.02){
      var k=Math.max(0.2,Math.min(1,(d-stop)/0.9));
      var step=Math.min(HAND_SPEED*k*dt, d-stop);
      HAND.x+=(dx/d)*step; HAND.z+=(dz/d)*step;
      HAND.yaw=Math.atan2(dx,dz);
      moving=step>0.012;
    } else if(HAND.state==="toCrop"){
      HAND.state="pour"; HAND.pour=HAND_POUR;
    }
  }
  HAND.obj.position.set(HAND.x,0,HAND.z);
  HAND.obj.rotation.y=HAND.yaw;
  HAND.walkT += dt*(moving?9:0);
  var sw=Math.sin(HAND.walkT)*(moving?0.5:0);
  HAND.obj.userData.legL.rotation.x=sw;
  HAND.obj.userData.legR.rotation.x=-sw;
  HAND.obj.position.y=moving?Math.abs(Math.sin(HAND.walkT))*0.045:0;
  HAND.lookT-=dt;
  if(HAND.lookT<=0){
    HAND.lookT=HAND_LOOK;
    if(HAND.state==="idle"){
      var P=handFindJob();
      if(P){ HAND.target=P; HAND.state="toCrop"; }
    }
  }
}

// -------------------------------------------------------------- THE TRACTOR
// The eighth present, and the only one FM5 shipped as an empty box. It plants
// the WHOLE field in one go: she walks up to it, picks one seed, and it drives
// the rows dropping a seed in every empty patch while she watches. It buys each
// seed as it goes and simply stops when the coins run out, so it can never take
// more than she has.
var TRACTOR_SPOT={x:10.6, z:8.4};
var TRACTOR_R=3.4;                 // walk this close and it asks what to plant
var TRACTOR_SPEED=4.4;
var TRACTOR_C={ body:0xC8452F, bodyD:0x9B3222, roof:0xF2E3B6, wheel:0x33302C,
                hub:0xE7D06A, pipe:0x6E6A63 };
function buildTractor(){
  var g=new THREE.Group(), p=[];
  p.push(hbBox(1.55,0.72,2.35,TRACTOR_C.body,{p:[0,0.92,0.10]}));
  p.push(hbBox(1.20,0.62,0.95,TRACTOR_C.bodyD,{p:[0,1.52,-0.45]}));
  p.push(hbBox(1.32,0.10,1.15,TRACTOR_C.roof,{p:[0,1.92,-0.45]}));
  p.push(hbTube(0.10,0.10,0.70,TRACTOR_C.pipe,{p:[0.48,1.72,0.92]}));
  p.push(hbBox(0.10,0.34,0.10,TRACTOR_C.pipe,{p:[0,1.34,1.28],r:[0.5,0,0]}));
  g.add(hbMesh(hbBake(p)));
  var i, W=[[-0.92,0.60,-0.88,0.60],[0.92,0.60,-0.88,0.60],
            [-0.86,0.38,1.05,0.38],[0.86,0.38,1.05,0.38]];
  for(i=0;i<W.length;i++){
    var w=hbMesh(hbBake([
      hbTube(W[i][1],W[i][1],0.30,TRACTOR_C.wheel,{r:[0,0,Math.PI/2]}),
      hbTube(W[i][1]*0.45,W[i][1]*0.45,0.34,TRACTOR_C.hub,{r:[0,0,Math.PI/2]})
    ]));
    w.position.set(W[i][0],W[i][1],W[i][2]);
    g.add(w);
    if(!g.userData.wheels) g.userData.wheels=[];
    g.userData.wheels.push(w);
  }
  return g;
}
var TRACTOR={ obj:null, x:TRACTOR_SPOT.x, z:TRACTOR_SPOT.z, yaw:Math.PI,
              state:"parked", queue:[], kind:null, popIn:null, spin:0, latch:false,
              blocker:null };
function placeTractor(){
  if(TRACTOR.obj) return false;
  TRACTOR.obj=buildTractor();
  TRACTOR.x=TRACTOR_SPOT.x; TRACTOR.z=TRACTOR_SPOT.z; TRACTOR.yaw=Math.PI;
  TRACTOR.obj.position.set(TRACTOR.x,0,TRACTOR.z);
  TRACTOR.obj.rotation.y=TRACTOR.yaw;
  TRACTOR.obj.scale.setScalar(0.15);
  TRACTOR.popIn=0; TRACTOR.state="parked"; TRACTOR.queue=[];
  scene.add(TRACTOR.obj);
  BLOCKER_OWNER="tractor";
  // it is solid, and the solid part GOES WITH IT: a blocker left behind at the
  // parking spot is an invisible wall in the middle of the grass while it works
  TRACTOR.blocker=addCircleBlocker(TRACTOR_SPOT.x, TRACTOR_SPOT.z, 1.5, "tractor");
  BLOCKER_OWNER="";
  return true;
}
function hasTractor(){ return !!TRACTOR.obj; }
function emptyPatches(){
  var out=[], i;
  for(i=0;i<PATCHES.length;i++){
    var P=PATCHES[i];
    if(P.state==="empty" && !P.cover && !P.locked) out.push(P);
  }
  // row by row, the way a tractor really would
  out.sort(function(a,b){ return (a.z-b.z) || (a.x-b.x); });
  return out;
}
function tractorReady(){ return !!TRACTOR.obj && TRACTOR.state==="parked" && emptyPatches().length>0; }
function startTractorRun(kind){
  if(!tractorReady() || !CROP_RECIPES[kind]) return false;
  TRACTOR.queue=emptyPatches();
  TRACTOR.kind=kind;
  TRACTOR.state="driving";
  sfx("select"); haptic("light");
  return true;
}
function updateTractor(dt, now){
  if(!TRACTOR.obj) return;
  if(TRACTOR.popIn!=null && TRACTOR.popIn<1){
    TRACTOR.popIn=Math.min(1,TRACTOR.popIn+dt*1.6);
    var e=1+Math.sin(TRACTOR.popIn*Math.PI)*0.22;
    TRACTOR.obj.scale.setScalar((0.15+0.85*TRACTOR.popIn)*e);
    if(TRACTOR.popIn>=1) TRACTOR.obj.scale.setScalar(1);
  }
  var moving=false, tx=TRACTOR_SPOT.x, tz=TRACTOR_SPOT.z, stop=0.05;
  if(TRACTOR.state==="driving"){
    // drop the patches she has already planted herself while it was coming
    while(TRACTOR.queue.length && TRACTOR.queue[0].state!=="empty") TRACTOR.queue.shift();
    if(!TRACTOR.queue.length){ TRACTOR.state="home"; }
    else { tx=TRACTOR.queue[0].x; tz=TRACTOR.queue[0].z; stop=0.9; }
  }
  var dx=tx-TRACTOR.x, dz=tz-TRACTOR.z, d=Math.hypot(dx,dz);
  if(d-stop>0.02){
    var step=Math.min(TRACTOR_SPEED*dt, d-stop);
    TRACTOR.x+=(dx/d)*step; TRACTOR.z+=(dz/d)*step;
    TRACTOR.yaw=Math.atan2(dx,dz);
    moving=true;
  } else if(TRACTOR.state==="driving"){
    var P=TRACTOR.queue.shift();
    if(P && P.state==="empty" && !plantPatch(P, TRACTOR.kind)){
      // she cannot afford the next one: it parks, and nothing is taken
      TRACTOR.queue=[]; TRACTOR.state="home";
      flashToast("Keep saving"); sfx("hit");
    }
  } else if(TRACTOR.state==="home"){
    TRACTOR.state="parked"; TRACTOR.yaw=Math.PI; TRACTOR.kind=null;
  }
  TRACTOR.obj.position.set(TRACTOR.x,0,TRACTOR.z);
  TRACTOR.obj.rotation.y=TRACTOR.yaw;
  if(TRACTOR.blocker){ TRACTOR.blocker.x=TRACTOR.x; TRACTOR.blocker.z=TRACTOR.z; }
  TRACTOR.spin += dt*(moving?7.5:0);
  var W=TRACTOR.obj.userData.wheels, i;
  if(W) for(i=0;i<W.length;i++) W[i].rotation.x=TRACTOR.spin;
  TRACTOR.obj.position.y = moving ? Math.abs(Math.sin(TRACTOR.spin*2))*0.02 : 0;
}
// Walk up to it and it asks what to plant — the same "walk at it and it
// happens" as the barn and the well. The latch stops it asking twice.
function atTheTractor(){
  if(!TRACTOR.obj) return;
  var d=Math.hypot(kid.position.x-TRACTOR.x, kid.position.z-TRACTOR.z);
  if(d>TRACTOR_R*2.0){ TRACTOR.latch=false; return; }
  if(d>TRACTOR_R || TRACTOR.latch) return;
  TRACTOR.latch=true;
  if(REVEAL.on || basketWaiting() || !tractorReady()) return;
  openFieldPicker();
}

// -------------------------------------------------------- THE DELIVERY TRUCK
// The crate takes anything and pays three times what it is worth. The truck is
// the BIGGER customer and it is fussy: it only ever wants the things the farm
// MAKES — bread, cheese and honey — and it pays five times over for them. It
// comes down the road on its own, waits a good long while, and drives off again
// whether it got what it wanted or not, so nothing about it can ever be missed
// or failed.
var TRUCK_GOODS=["bread","cheese","honey"];
var TRUCK_MULT=5;
var TRUCK_R=4.0;
var TRUCK_STOP={x:-1.5, z:31.5};
var TRUCK_IN={x:-30.0}, TRUCK_OUT={x:30.0};
var TRUCK_SPEED=7.0;
var TRUCK_WAIT=95;              // how long it will sit there for her
var TRUCK_GAP=70;               // and how long before the next one comes
var TRUCK_WANT_Y=3.5, TRUCK_WANT_SEC=1.9;
var TRUCK_C={ cab:0x4E86A6, cabD:0x2F5A73, bed:0xE3CC86, bedD:0xC3A85C,
              glass:0xBFE3F0, wheel:0x33302C, hub:0xE7D06A };
function buildTruck(){
  var g=new THREE.Group(), p=[];
  p.push(hbBox(1.90,1.10,2.10,TRUCK_C.cab,{p:[0,1.35,-1.55]}));
  p.push(hbBox(1.60,0.62,0.14,TRUCK_C.glass,{p:[0,1.62,-2.58]}));
  p.push(hbBox(2.05,0.55,3.60,TRUCK_C.bedD,{p:[0,0.95,0.95]}));
  p.push(hbBox(2.10,0.75,0.16,TRUCK_C.bed,{p:[0,1.55,2.72]}));
  p.push(hbBox(0.16,0.75,3.60,TRUCK_C.bed,{p:[-1.00,1.55,0.95]}));
  p.push(hbBox(0.16,0.75,3.60,TRUCK_C.bed,{p:[ 1.00,1.55,0.95]}));
  p.push(hbBox(2.10,0.75,0.16,TRUCK_C.bed,{p:[0,1.55,-0.82]}));
  g.add(hbMesh(hbBake(p)));
  var i, W=[[-1.02,0.62,-1.95],[1.02,0.62,-1.95],[-1.02,0.62,1.45],[1.02,0.62,1.45]];
  for(i=0;i<W.length;i++){
    var w=hbMesh(hbBake([
      hbTube(0.62,0.62,0.34,TRUCK_C.wheel,{r:[0,0,Math.PI/2]}),
      hbTube(0.28,0.28,0.38,TRUCK_C.hub,{r:[0,0,Math.PI/2]})
    ]));
    w.position.set(W[i][0],W[i][1],W[i][2]);
    g.add(w);
    if(!g.userData.wheels) g.userData.wheels=[];
    g.userData.wheels.push(w);
  }
  return g;
}
var TRUCK={ obj:null, x:TRUCK_IN.x, z:TRUCK_STOP.z, state:"away", wants:[],
            want:null, wantI:0, wantT:0, t:TRUCK_GAP*0.55, pay:0, spin:0,
            gap:0, run:0, seen:false };
// It can only come once the farm makes something it buys, and only for the
// goods she has actually carried at least once.
function truckGoodsNow(){
  var out=[], i;
  for(i=0;i<TRUCK_GOODS.length;i++){
    var k=TRUCK_GOODS[i];
    if(COLLECTED[k] && ITEM(k) && producibleNow(k)) out.push(k);
  }
  return out;
}
function truckPossible(){ return truckGoodsNow().length>0; }
function truckWantsLeft(kind){
  var n=0, i;
  for(i=0;i<TRUCK.wants.length;i++) if(TRUCK.wants[i].kind===kind && !TRUCK.wants[i].filled) n++;
  return n;
}
function truckWantsAnything(){
  for(var i=0;i<TRUCK.wants.length;i++) if(!TRUCK.wants[i].filled) return true;
  return false;
}
function truckArrive(){
  var pool=truckGoodsNow(), i, n;
  if(!pool.length) return false;
  if(!TRUCK.obj){ TRUCK.obj=buildTruck(); scene.add(TRUCK.obj); }
  TRUCK.obj.visible=true;
  for(i=pool.length-1;i>0;i--){ n=Math.floor(Math.random()*(i+1));
    var t=pool[i]; pool[i]=pool[n]; pool[n]=t; }
  var distinct=Math.min(pool.length, 2), size=2+Math.floor(Math.random()*2);
  TRUCK.wants=[];
  for(i=0;i<size;i++) TRUCK.wants.push({ kind:pool[i%distinct], filled:false, claimed:false });
  var sum=0;
  for(i=0;i<TRUCK.wants.length;i++) sum+=itemValueOf(TRUCK.wants[i].kind);
  TRUCK.pay=Math.round(sum*TRUCK_MULT);
  TRUCK.x=TRUCK_IN.x; TRUCK.z=TRUCK_STOP.z;
  TRUCK.state="in"; TRUCK.t=TRUCK_WAIT; TRUCK.run=0; TRUCK.gap=0;
  TRUCK.seen=true;
  return true;
}
function showTruckWant(){
  if(TRUCK.want){ scene.remove(TRUCK.want); TRUCK.want=null; }
  var live=[], i;
  for(i=0;i<TRUCK.wants.length;i++)
    if(!TRUCK.wants[i].filled && live.indexOf(TRUCK.wants[i].kind)<0) live.push(TRUCK.wants[i].kind);
  if(!live.length) return;
  var r=ITEM(live[TRUCK.wantI%live.length]); if(!r) return;
  var g=new THREE.Group();
  g.add(hbMesh(hbBake(r.parts(1.05))));
  scene.add(g); TRUCK.want=g;
}
function hideTruckWant(){ if(TRUCK.want){ scene.remove(TRUCK.want); TRUCK.want=null; } }
function truckNear(){
  return TRUCK.state==="waiting" &&
    Math.hypot(kid.position.x-TRUCK.x, kid.position.z-TRUCK.z) < TRUCK_R;
}
function claimTruckSlot(kind){
  for(var i=0;i<TRUCK.wants.length;i++){
    var w=TRUCK.wants[i];
    if(!w.filled && !w.claimed && w.kind===kind) return w;
  }
  return null;
}
function pullOneIntoTruck(){
  for(var i=stack.length-1;i>=0;i--){
    var kind=stack[i].userData.kind;
    var slot=claimTruckSlot(kind); if(!slot) continue;
    var it=stack.splice(i,1)[0];
    reindexStack();
    FLYING.push({
      obj:it,
      from:it.position.clone(),
      to:new THREE.Vector3(TRUCK.x+(Math.random()-0.5)*1.2, 1.9, TRUCK.z+0.9+(Math.random()-0.5)*1.6),
      t:0, dur:0.40, truck:slot, note:TRUCK.run
    });
    slot.claimed=true;
    TRUCK.run++;
    return true;
  }
  return false;
}
function onTruckLanded(F){
  F.truck.filled=true;
  sfx("deliver",{rate:Math.min(1.55, 1+F.note*0.055)});
  haptic("light");
  showTruckWant();
  if(!truckWantsAnything()){
    hideTruckWant();
    sfx("mission"); haptic("success");
    addCoins(TRUCK.pay);
    flashToast("+"+TRUCK.pay);
    coinBurstToPill(TRUCK.pay);
    TRUCK.state="out";
    scheduleSave();
  }
}
function updateTruck(dt, now){
  // it only ever exists once the farm makes something it buys
  if(TRUCK.state==="away"){
    TRUCK.t-=dt;
    if(TRUCK.t<=0 && truckPossible() && !basketWaiting() && !REVEAL.on){
      if(!truckArrive()) TRUCK.t=TRUCK_GAP;
    }
    return;
  }
  if(!TRUCK.obj) return;
  var moving=false, dx;
  if(TRUCK.state==="in"){
    dx=TRUCK_STOP.x-TRUCK.x;
    var step=Math.min(TRUCK_SPEED*dt, Math.abs(dx));
    TRUCK.x += (dx>0?1:-1)*step; moving=true;
    if(Math.abs(TRUCK_STOP.x-TRUCK.x)<0.05){
      TRUCK.state="waiting"; TRUCK.wantI=0; TRUCK.wantT=0; showTruckWant();
      sfx("select");
    }
  } else if(TRUCK.state==="waiting"){
    TRUCK.t-=dt;
    if(TRUCK.t<=0){ hideTruckWant(); TRUCK.state="out"; }
    // the unload, on exactly the crate's rhythm so there is nothing new here
    else if(truckNear() && !basketWaiting()){
      TRUCK.gap-=dt;
      if(TRUCK.gap<=0){ TRUCK.gap=UNLOAD_GAP; pullOneIntoTruck(); }
    }
  } else if(TRUCK.state==="out"){
    dx=TRUCK_OUT.x-TRUCK.x;
    TRUCK.x += Math.min(TRUCK_SPEED*dt, Math.abs(dx)); moving=true;
    if(TRUCK.x>=TRUCK_OUT.x-0.05){
      TRUCK.obj.visible=false;
      TRUCK.state="away"; TRUCK.t=TRUCK_GAP; TRUCK.wants=[]; hideTruckWant();
    }
  }
  TRUCK.obj.position.set(TRUCK.x, 0, TRUCK.z);
  TRUCK.obj.rotation.y=Math.PI/2;              // it faces along the road
  TRUCK.spin += dt*(moving?6.5:0);
  var W=TRUCK.obj.userData.wheels, i;
  if(W) for(i=0;i<W.length;i++) W[i].rotation.x=TRUCK.spin;
  if(TRUCK.want){
    TRUCK.want.position.set(TRUCK.x, TRUCK_WANT_Y+Math.sin(now*2.2)*0.14, TRUCK.z);
    TRUCK.want.rotation.y += dt*1.4;
    TRUCK.wantT += dt;
    if(TRUCK.wantT>TRUCK_WANT_SEC){ TRUCK.wantT=0; TRUCK.wantI++; showTruckWant(); }
  }
}

// The book's pages, in the order a farm grows: the things she carries, then
// who lives here, then who came to help.
function stickerPages(){
  var out=[], i;
  for(i=0;i<COLLECT_ORDER.length;i++){
    var k=COLLECT_ORDER[i], r=ITEM(k);
    if(!r) continue;
    out.push({ id:"item:"+k, art:r.svg(44), got:!!COLLECTED[k] });
  }
  out.push({ id:"who:chicken", art:STICKER_ART.chicken, got:animalHere("chicken") });
  out.push({ id:"who:cow",     art:STICKER_ART.cow,     got:animalHere("cow") });
  out.push({ id:"who:duck",    art:DUCK_SVG,            got:DUCK_BOUGHT });
  out.push({ id:"who:pig",     art:STICKER_ART.pig,     got:animalHere("pig") });
  out.push({ id:"who:bees",    art:STICKER_ART.bees,    got:animalHere("hive") });
  out.push({ id:"help:dog",     art:STICKER_ART.dog,     got:!!DOG.obj });
  out.push({ id:"help:hand",    art:STICKER_ART.hand,    got:!!HAND.obj });
  out.push({ id:"help:tractor", art:STICKER_ART.tractor, got:!!TRACTOR.obj });
  out.push({ id:"help:truck",   art:STICKER_ART.truck,   got:!!TRUCK.seen });
  return out;
}
function animalHere(kind){
  for(var i=0;i<ANIMALS.length;i++) if(ANIMALS[i].kind===kind) return true;
  return false;
}
var BOOK_SEEN={}, BOOK_FRESH={};
var bookBtnEl=document.getElementById("bookBtn");
var bookCardEl=document.getElementById("bookCard");
var bookRowEl=document.getElementById("bookRow");
var bookDotsEl=document.getElementById("bookDots");
var bookCloseEl=document.getElementById("bookClose");
function renderBook(){
  if(!bookRowEl) return;
  var pages=stickerPages(), html="", dots="", i, got=0;
  for(i=0;i<pages.length;i++){
    var P=pages[i];
    if(P.got) got++;
    html += '<div class="stamp'+(P.got?"":" off")+(BOOK_FRESH[P.id]?" new":"")+
            '" data-id="'+P.id+'">'+P.art+'</div>';
    dots += '<i class="'+(P.got?"on":"")+'"></i>';
  }
  bookRowEl.innerHTML=html;
  if(bookDotsEl) bookDotsEl.innerHTML=dots;
  BOOK_FRESH={};
  return got;
}
function openBook(){ renderBook(); if(bookCardEl) bookCardEl.classList.add("up"); }
function closeBook(){ if(bookCardEl) bookCardEl.classList.remove("up"); }
function bookOpen(){ return !!(bookCardEl && bookCardEl.classList.contains("up")); }
if(bookCloseEl) bookCloseEl.addEventListener("click",closeBook);
if(bookCardEl) bookCardEl.addEventListener("click",function(e){ if(e.target===bookCardEl) closeBook(); });
if(bookBtnEl) bookBtnEl.addEventListener("click",function(){ if(bookOpen()) closeBook(); else openBook(); });
// A stamp she has just earned announces itself, once, wherever she is standing.
var bookWatchT=0;
function watchStickers(dt){
  bookWatchT-=dt;
  if(bookWatchT>0) return;
  bookWatchT=0.6;
  var pages=stickerPages(), i, fresh=0, got=0;
  for(i=0;i<pages.length;i++){
    if(!pages[i].got) continue;
    got++;
    if(!BOOK_SEEN[pages[i].id]){
      BOOK_SEEN[pages[i].id]=1;
      BOOK_FRESH[pages[i].id]=1;
      fresh++;
    }
  }
  if(bookBtnEl) bookBtnEl.classList.toggle("on", got>0 && DRESSED);
  if(fresh && BOOK_READY){
    if(bookBtnEl){ bookBtnEl.classList.remove("fresh"); void bookBtnEl.offsetWidth;
                   bookBtnEl.classList.add("fresh"); }
    flashToast("A new sticker");
    sfx("sparkle"); haptic("light");
    scheduleSave();
  }
  if(bookOpen()) renderBook();
  BOOK_READY=true;      // the first pass is the farm loading, not a new sticker
}
var BOOK_READY=false;
// The book itself stands by the barn door, because that is where the shop is
// and a kid should only have one place to remember.
var BOOK_STAND={x:BARN_DOOR.x-4.8, z:BARN_DOOR.z+0.6};
var BOOK_STAND_R=2.2, bookLatch=false;
function buildBookStand(){
  var g=new THREE.Group();
  g.add(hbMesh(hbBake([
    hbTube(0.16,0.20,1.10,0x9C6939,{p:[0,0.55,0]}),
    hbBox(0.90,0.10,0.62,0xC58A55,{p:[0,1.12,0],r:[-0.32,0,0]})
  ])));
  var book=hbMesh(hbBake([
    hbBox(0.62,0.10,0.46,0xF6E3B0,{p:[0,0,0]}),
    hbBox(0.66,0.06,0.50,0xB6473C,{p:[0,-0.05,0]}),
    hbBall(0.09,0xF2889C,{p:[0.14,0.07,0.02],s:[1,0.4,1]})
  ]));
  book.position.set(0,1.22,0.02); book.rotation.x=-0.32;
  g.add(book);
  g.userData.book=book;
  return g;
}
var bookStandObj=null;
function placeBookStand(){
  if(bookStandObj) return false;
  bookStandObj=buildBookStand();
  bookStandObj.position.set(BOOK_STAND.x,0,BOOK_STAND.z);
  bookStandObj.rotation.y=0.25;
  scene.add(bookStandObj);
  return true;
}
function atTheBook(now){
  if(!bookStandObj) return;
  if(bookStandObj.userData.book)
    bookStandObj.userData.book.position.y=1.22+Math.sin(now*1.8)*0.03;
  var d=Math.hypot(kid.position.x-BOOK_STAND.x, kid.position.z-BOOK_STAND.z);
  if(d>BOOK_STAND_R*2.0){ bookLatch=false; return; }
  if(d>BOOK_STAND_R || bookLatch) return;
  bookLatch=true;
  if(REVEAL.on || basketWaiting()) return;
  if(shopCardEl && shopCardEl.classList.contains("up")) return;
  openBook();
}

// --------------------------------------------------------- SHOW A GROWN-UP
// One tap, the whole island from above, and it lands in My Stuff next to her
// drawings. It also happens by itself the first time she plays at each size of
// farm, so there is a before-and-after even if she never taps the button.
var PHOTO={ busy:false, rings:{}, t:0, saved:0, lastOk:null };
var camBtnEl=document.getElementById("camBtn");
var flashEl=document.getElementById("flash");
function farmDeviceId(){
  try{
    var k="deviceId", v=localStorage.getItem(k);
    if(!v){ v="dev_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,10);
            localStorage.setItem(k,v); }
    return v;
  }catch(e){ return "dev_farm"; }
}
// The island from the FM6 picture camera, taken in ONE frame: render, grab,
// put the camera straight back. Nothing on screen moves, because the grab
// happens before the browser paints anything.
function farmShot(){
  var pos=camera.position.clone(), quat=camera.quaternion.clone();
  var data="";
  try{
    camera.position.set(0,74,60);
    camera.lookAt(0,0,4);
    renderer.render(scene,camera);
    data=renderer.domElement.toDataURL("image/jpeg",0.82);
  }catch(e){ data=""; }
  camera.position.copy(pos); camera.quaternion.copy(quat);
  return data;
}
function farmPhoto(auto){
  if(PHOTO.busy) return false;
  PHOTO.busy=true;
  var data=farmShot();
  if(flashEl){
    flashEl.classList.add("on");
    setTimeout(function(){ flashEl.classList.remove("on"); }, 30);
  }
  sfx("select"); haptic("light");
  if(!auto) flashToast("A picture for a grown-up");
  PHOTO.saved++;
  var payload={
    art_id:"farm_"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
    device_id:farmDeviceId(),
    title:"My farm",
    theme:"farm",
    image_b64:data,
    // saved_art wants a recipe as well as a picture; a farm's recipe is the
    // farm itself, so the save blob rides along and nothing new is invented.
    art:{ ops:[], farm:snapshotFarm() }
  };
  if(KID_ID) payload.kid_profile_id=KID_ID;
  try{
    fetch("/api/save-art",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify(payload)})
      .then(function(r){ PHOTO.lastOk=!!(r&&r.ok); })
      .catch(function(){ PHOTO.lastOk=false; });
  }catch(e){ PHOTO.lastOk=false; }
  setTimeout(function(){ PHOTO.busy=false; }, 400);
  return true;
}
if(camBtnEl) camBtnEl.addEventListener("click",function(){ farmPhoto(false); });
// One picture per size of farm, taken by itself once she has been playing a
// few seconds — never mid-celebration, never while the basket is waiting.
function watchPhoto(dt){
  if(!DRESSED) return;
  PHOTO.t+=dt;
  if(camBtnEl) camBtnEl.classList.toggle("on", PHOTO.t>1.5);
  if(PHOTO.t<8 || PHOTO.busy) return;
  if(REVEAL.on || basketWaiting() || NODRAW) return;

  // exactly when the farm can least afford one, and photographs a blur.
  if(FLYING.length || unload.running || TRACTOR.state==="driving" || lookPickerUp()) return;
  if(PHOTO.rings[FIELD_RING]) return;
  PHOTO.rings[FIELD_RING]=1;
  farmPhoto(true);
  scheduleSave();
}

// =========================================================================
//  FM9 — A REAL MAIN CHARACTER
//
//  Since FM1 the kid has been tube limbs, a ball head and two beads for eyes,
//  and from the game camera she read as a blue blob. She is now a proper
//  modelled character: Kenney's characterSmall body (CC0), converted to glb,
//  with the whole of her — outfit, hair, face, skin — living in ONE 1024 png.
//  That png is a NAMED SLOT, never a hardcoded path, so a different outfit, or
//  a character per kid, is a one-file change and no code at all.
//
//  THE CODE-BUILT KID IS STILL HERE, hidden inside the same group. If the model
//  ever fails to load, she comes straight back and the farm opens as it always
//  did. Shared-library law: read on render, always with a local fallback.
// =========================================================================
var KID_DIR="/models/skyflyer/character/";
var KID_URL=KID_DIR+"character-kid.glb";
// The four movements. Each lives in its own file and carries a T-pose called
// "Targeting Pose" at index 0 — taking animations[0] gets you a statue, so the
// clip is always matched BY NAME.
var KID_CLIP_URLS={ idle:KID_DIR+"anim-idle.glb",
                    walk:KID_DIR+"anim-walk.glb",
                    pick:KID_DIR+"anim-pickup.glb" };
// The named slots. "who" is what the kid picked; the file behind it can change
// without a line of this code changing.
var KID_LOOKS=[
  { id:"girl", skin:KID_DIR+"skin-farm-girl.png" },
  { id:"boy",  skin:KID_DIR+"skin-farm-a.png" }
];
function kidLookById(id){
  for(var i=0;i<KID_LOOKS.length;i++) if(KID_LOOKS[i].id===id) return KID_LOOKS[i];
  return null;
}
var KID_LOOK=null;              // null until she picks, and then it is saved
var KID_H=2.50;                 // exactly where the old kid's head was
var KID3={ on:false, root:null, mixer:null, clips:{}, action:null, want:"idle",
           mat:null, tex:{}, pickT:0, tried:false, fitScale:1,
           skin:KID_LOOKS[0].skin };

function kidTexture(url){
  if(KID3.tex[url]) return KID3.tex[url];
  var t=new THREE.TextureLoader().load(url);
  // Straight out of the kit's own notes: without these she renders rough, and
  // an upside-down skin puts her face on the back of her head.
  t.flipY=false;
  t.generateMipmaps=true;
  t.minFilter=THREE.LinearMipmapLinearFilter;
  t.magFilter=THREE.LinearFilter;
  try{ t.anisotropy=Math.min(16, renderer.capabilities.getMaxAnisotropy()); }catch(e){}
  // FM6's lesson, the other way round: this renderer works in linear, and a
  // texture loaded by hand is already linear, so nothing is re-encoded here.
  KID3.tex[url]=t;
  return t;
}
// The one clip in a file that is not the T-pose.
function realClip(anims){
  var i;
  if(!anims || !anims.length) return null;
  for(i=0;i<anims.length;i++)
    if(!/targeting/i.test(anims[i].name||"")) return anims[i];
  return null;
}
function kidPlay(name){
  if(!KID3.on || !KID3.mixer) return false;
  var clip=KID3.clips[name];
  if(!clip) return false;
  if(KID3.action && KID3.action._bkName===name) return true;
  var next=KID3.mixer.clipAction(clip);
  next._bkName=name;
  next.reset();
  next.setLoop(name==="pick"?THREE.LoopOnce:THREE.LoopRepeat, name==="pick"?1:Infinity);
  next.clampWhenFinished=(name==="pick");
  next.enabled=true;
  next.setEffectiveWeight(1);
  if(KID3.action) next.crossFadeFrom(KID3.action, 0.18, false);
  next.play();
  KID3.action=next;
  return true;
}
// Harvesting, feeding and taking an egg all reach for the ground, and they all
// come through here. A quarter of a second is enough to read as a reach.
function kidPick(){
  if(!KID3.on) return;
  KID3.pickT=0.75;
  kidPlay("pick");
}
// The soft dark circle that stops her floating on the grass.
function buildKidShadow(){
  var g=new THREE.CircleGeometry(0.52, 20);
  g.rotateX(-Math.PI/2);
  var m=new THREE.Mesh(g, new THREE.MeshBasicMaterial({ color:0x22331F, transparent:true,
    opacity:0.22, depthWrite:false, fog:false }));
  m.position.y=0.02;
  m.renderOrder=-1;
  return m;
}
function setKidLook(id, quiet){
  var L=kidLookById(id); if(!L) return false;
  KID_LOOK=L.id;
  KID3.skin=L.skin;
  if(KID3.mat){
    KID3.mat.map=kidTexture(L.skin);
    KID3.mat.needsUpdate=true;
  } else {
    loadKidModel(L.id);          // no-op once the load is already under way
  }
  if(!quiet){ sfx("celebrate"); haptic("success"); sparklePuff(kid.position.x,2.4,kid.position.z,12); }
  return true;
}
function loadKidModel(lookId){
  if(KID3.tried) return false;
  KID3.tried=true;
  if(!renderer || typeof THREE.GLTFLoader!=="function") return false;
  var L=kidLookById(lookId)||KID_LOOKS[0];
  if(!KID3.skin) KID3.skin=L.skin;
  var loader; try{ loader=new THREE.GLTFLoader(); }catch(e){ return false; }
  loader.load(KID_URL, function(gl){
    var root=gl.scene;
    if(!root){ return; }
    // ONE material for the whole of her, built here: the glb's own is not
    // worth keeping, and this renderer needs skinning switched on by hand.
    // KID3.skin, not L.skin: she may have picked while the body was loading
    var mat=new THREE.MeshPhongMaterial({ map:kidTexture(KID3.skin||L.skin), shininess:10,
      skinning:true });
    root.traverse(function(o){
      if(o.isMesh || o.isSkinnedMesh){
        o.material=mat;
        o.frustumCulled=false;      // a skinned bounding box lies about where she is
      }
    });
    KID3.mat=mat;
    // stand her exactly where the old kid stood: 2.5 units tall, feet on zero
    var box=new THREE.Box3().setFromObject(root);
    var h=Math.max(0.001, box.max.y-box.min.y);
    var sc=KID_H/h;
    root.scale.setScalar(sc);
    root.position.y=-box.min.y*sc;
    KID3.fitScale=sc;
    KID3.root=root;
    KID3.mixer=new THREE.AnimationMixer(root);
    // the drawn kid stays in the group, hidden, as the fallback she came from
    if(kid.userData.drawn) kid.userData.drawn.visible=false;
    kid.add(root);
    if(!kid.userData.shadow){
      var sh=buildKidShadow(); kid.add(sh); kid.userData.shadow=sh;
    }
    KID3.on=true;
    // and now the movements, each from its own file, each matched by name
    var k;
    for(k in KID_CLIP_URLS) loadKidClip(k, KID_CLIP_URLS[k]);
  }, null, function(){
    KID3.on=false;               // the farm opens with the drawn kid, as ever
  });
  return true;
}
function loadKidClip(name, url){
  var loader; try{ loader=new THREE.GLTFLoader(); }catch(e){ return; }
  loader.load(url, function(gl){
    var clip=realClip(gl.animations);
    if(!clip) return;
    KID3.clips[name]=clip;
    if(name==="idle" && !KID3.action) kidPlay("idle");
  }, null, function(){});
}
// Off the main loop: still is idle, moving is walk, and reaching for something
// plays the pick-up once and then goes back to whichever of the two she is in.
function updateKidModel(dt, moving){
  if(!KID3.on) return;
  if(KID3.pickT>0){
    KID3.pickT-=dt;
    if(KID3.pickT<=0) KID3.action=null;      // let the next state take over
  } else {
    kidPlay(moving?"walk":"idle");
  }
  if(KID3.mixer) KID3.mixer.update(dt);
}

// ------------------------------------------------------------------- BOOT
// The farmyard has to exist before a save can be poured into it, so this runs
// off the end of buildFarmyard() rather than off the end of the file.
var BOOTED=false, BOOT_INFO=null;
function farmBoot(){
  if(BOOTED) return; BOOTED=true;
  var local=readLocal();
  if(local) BOOT_INFO=applySave(local);
  lastSig=saveSignature();
  // The cloud copy follows. It only ever replaces the local one if it is
  // NEWER and she has not touched anything yet — a save must never yank the
  // farm out from under a child who is already playing.
  if(KID_ID && typeof fetch!=="undefined"){
    try{
      fetch("/api/farm-save?kidProfileId="+encodeURIComponent(KID_ID))
        .then(function(r){ return r.json(); })
        .then(function(j){
          if(!j || !j.ok || !j.data) return;
          if(local && (j.data.savedAt||0) <= (local.savedAt||0)) return;
          if(saveSignature()!==lastSig) return;      // she is already playing
          hardResetScene();
          BOOT_INFO=applySave(j.data);
          lastSig=saveSignature();
        })
        .catch(function(){});
    }catch(e){}
  }
}
// Only ever used to swap a just-loaded local farm for a newer cloud one, in
// the first second, before anything has been touched. It is NOT a reset a
// child can reach: nothing calls it from any control on the screen.
function hardResetScene(){
  var i;
  for(i=0;i<PATCHES.length;i++){
    var P=PATCHES[i];
    if(P.crop){ scene.remove(P.crop); P.crop=null; }
    if(P.halo){ scene.remove(P.halo); P.halo=null; }
    P.state="empty"; P.seed=null; P.plantedAt=0; P.ring.visible=true; P.chimed=false;
  }
  for(i=0;i<ANIMALS.length;i++){
    var A=ANIMALS[i];
    if(A.produce){ scene.remove(A.produce); A.produce=null; }
    if(A.halo){ scene.remove(A.halo); A.halo=null; }
    hideWant(A);
    A.state="hungry"; A.magnet=null; A.produceSide=null;
  }
  while(stack.length){ scene.remove(stack.pop()); }
  reindexStack();
  if(DOG.carryObj){ scene.remove(DOG.carryObj); DOG.carryObj=null; }
  DOG.carry=null; DOG.target=null; DOG.state="follow";
  stopWatering(); stopPlacing(); clearDecor();
  for(i=0;i<ANIMALS.length;i++){
    if(ANIMALS[i].markObj){ scene.remove(ANIMALS[i].markObj); ANIMALS[i].markObj=null; }
    ANIMALS[i].mark=null; ANIMALS[i].fedCount=0;
  }
  closeBasket();
  fm8Reset();
  order=null;
}

// FM6 — THE SHOP IS IN THE BARN. Walk up to the doors and it opens; walk away
// and the latch resets so it opens again next time. The button in the corner
// stays, because a kid already looking at it should not have to learn a second
// way in.
var barnLatch=false, barnOpened=false;
function atTheBarn(dt){
  if(!DRESSED) return;
  var d=Math.hypot(kid.position.x-BARN_DOOR.x, kid.position.z-BARN_DOOR.z);
  if(d>BARN_R*2.2){
    barnLatch=false;
    // It closes itself behind her: a card that opened because she walked past
    // should not still be there two fields away. But ONLY its own — closing a
    // card she opened with the button, from anywhere on the island, made the
    // shop button look broken.
    if(barnOpened && shopCardEl && shopCardEl.classList.contains("up") && !REVEAL.on){
      barnOpened=false; closeShop();
    }
    return;
  }
  if(d>BARN_R || barnLatch) return;
  barnLatch=true;
  if(REVEAL.on || basketWaiting() || bookOpen()) return;
  if(!nextUnlock() && DUCK_BOUGHT) return;      // nothing left in there to want
  barnOpened=true; tapUnlock(); openShop();
}

// =========================================================================
//  FM6 — DRESSING THE ISLAND. The Quaternius pieces go down here, plus the
//  things this session had to build itself because the full MegaKit could not
//  be fetched. Everything is placed from the ISLE table, so moving a building
//  moves what sits around it.
// =========================================================================
var islandGroup=null, DRESSED=false;

function dressIsland(){
  if(DRESSED) return false;
  DRESSED=true;
  var g=new THREE.Group(), i, a, r, t;

  // ---------------------------------------------------------- the buildings
  var barn=buildBarn();
  barn.position.set(ISLE.barn.x, 0, ISLE.barn.z);
  g.add(barn);
  BLOCKER_OWNER="barn";
  addBoxBlocker(ISLE.barn.x, ISLE.barn.z, BARN_HALF_X-0.1, BARN_HALF_Z-0.1, "barn");
  BLOCKER_OWNER="";

  var well=buildWell();
  well.position.set(ISLE.well.x, 0, ISLE.well.z);
  well.rotation.y=0.4;
  g.add(well);
  addCircleBlocker(ISLE.well.x, ISLE.well.z, 1.05, "well");

  // the two pads FM7 builds the mill and the dairy on
  [ISLE.mill, ISLE.dairy].forEach(function(P){
    var pad=buildPad(); pad.position.set(P.x, 0, P.z); g.add(pad);
    addCircleBlocker(P.x, P.z, 1.9, "pad");
  });

  var logs=buildLogPile();
  logs.position.set(ISLE.barn.x-6.6, 0, ISLE.barn.z+1.4);
  logs.rotation.y=0.5; g.add(logs);
  addCircleBlocker(ISLE.barn.x-6.6, ISLE.barn.z+1.4, 1.2, "logs");
  for(i=0;i<3;i++){
    var bale=buildHayBale();
    bale.position.set(ISLE.barn.x+5.4+i*0.4, 0, ISLE.barn.z+2.2+i*1.9);
    bale.rotation.y=0.3+i*0.7; bale.scale.setScalar(0.8+i*0.08);
    g.add(bale);
  }

  // ---------------------------------------------------------------- the pond
  var pond=buildPond(ISLE.pond.r);
  pond.position.set(ISLE.pond.x, 0, ISLE.pond.z);
  g.add(pond);
  // the bridge crosses it north to south, so the path from the coop carries on
  var br=buildBridge(ISLE.pond.r*2 + 1.4);
  br.position.set(ISLE.pond.x, 0, ISLE.pond.z);
  g.add(br);

  // ----------------------------------------------------------- road and paths
  buildRoad(g);
  steppingStones(g, BARN_DOOR.x, BARN_DOOR.z, FIELD_CX, FIELD_CZ-fieldHalf(1)-1.0);
  steppingStones(g, ISLE.well.x+1.4, ISLE.well.z+0.6, BARN_DOOR.x-1.2, BARN_DOOR.z+0.4);
  steppingStones(g, FIELD_CX+fieldHalf(1)+1.0, FIELD_CZ, COOP_C.x-5.6, COOP_C.z);
  steppingStones(g, COOP_C.x, COOP_C.z-5.2, PEN_C.x, PEN_C.z+4.6);
  steppingStones(g, FIELD_CX-fieldHalf(1)-1.0, FIELD_CZ, CRATE.x+2.2, CRATE.z);
  steppingStones(g, CRATE.x-2.4, CRATE.z, RUNWAY.x+RUNWAY.halfW+1.4, RUNWAY.z);
  steppingStones(g, COOP_C.x, COOP_C.z+5.0, ISLE.pond.x, ISLE.pond.z-ISLE.pond.r-2.0);
  steppingStones(g, ISLE.pond.x, ISLE.pond.z+ISLE.pond.r+2.0, ISLE.pond.x-2.0, ISLE.road.z-3.0);

  // ------------------------------------------------- the Quaternius set dressing
  if(NAT_READY){
    // PINES along the back (north) edge
    for(i=0;i<12;i++){
      a=-Math.PI*0.94 + (i/11)*Math.PI*0.88;
      r=ISLAND_R-4.2-Math.random()*3.2;
      t=natGet(i%2?"Pine_1":"Pine_3", 6.5+Math.random()*3.2);
      if(t){ t.position.set(Math.cos(a)*r, 0, Math.sin(a)*r);
             t.rotation.y=Math.random()*6.28; g.add(t); }
    }
    // THE ORCHARD in the north-west: round trees with apples in them
    for(i=0;i<7;i++){
      var ox=ISLE.orchard.x + (i%3)*4.6 - 4.6 + (Math.random()-0.5)*1.2;
      var oz=ISLE.orchard.z + Math.floor(i/3)*5.0 - 3.0 + (Math.random()-0.5)*1.2;
      t=natGet(["CommonTree_1","CommonTree_3","CommonTree_5"][i%3], 5.4+Math.random()*1.4);
      if(!t) continue;
      t.position.set(ox, 0, oz); t.rotation.y=Math.random()*6.28;
      g.add(t);
      addCircleBlocker(ox, oz, 0.60, "tree");
      // the apples, so it is an ORCHARD and not seven trees
      var ap=[];
      for(var k=0;k<7;k++){
        var aa=Math.random()*6.28, ar=0.9+Math.random()*0.9;
        ap.push(hbBall(0.17, k%3?0xE04B3C:0xE8703F,
          {p:[Math.cos(aa)*ar, 2.6+Math.random()*1.5, Math.sin(aa)*ar]}, 7));
      }
      var am=hbMesh(hbBake(ap)); am.position.set(ox,0,oz); g.add(am);
    }
    // FLOWER BEDS and the spot FM7 puts the beehive on
    for(i=0;i<9;i++){
      a=Math.random()*6.28; r=2.2+Math.random()*3.4;
      t=natGet(i%2?"Flower_3_Group":"Flower_4_Group", 1.5+Math.random()*0.7);
      if(t){ t.position.set(ISLE.orchard.x+5.5+Math.cos(a)*r, 0, ISLE.orchard.z+7.5+Math.sin(a)*r);
             t.rotation.y=Math.random()*6.28; g.add(t); }
    }
    // three red bushes by the orchard, on purpose
    for(i=0;i<3;i++){
      t=natGet("Bush_Common", 1.9+Math.random()*0.7);
      if(t){ t.position.set(ISLE.orchard.x+7.5+i*2.4, 0, ISLE.orchard.z-5.5+i*1.1);
             t.rotation.y=Math.random()*6.28; g.add(t); }
    }
    var hivePad=buildPad(); hivePad.scale.setScalar(0.55);
    hivePad.position.set(ISLE.orchard.x+5.5, 0, ISLE.orchard.z+7.5);
    g.add(hivePad);
    // BUSHES, FERNS AND MUSHROOMS, scattered where nothing else is
    for(i=0;i<26;i++){
      // biased toward the outside, because the middle of the island is the farm
      a=Math.random()*6.28; r=(0.45+Math.sqrt(Math.random())*0.55)*(ISLAND_R-4.0);
      var bx=Math.cos(a)*r, bz=Math.sin(a)*r;
      if(nearAnything(bx,bz,2.6)) continue;
      var pick=["Bush_Common_Flowers","Fern_1","Mushroom_Common","Bush_Common_Flowers"][i%4];
      t=natGet(pick, pick==="Mushroom_Common" ? 0.8 : 1.5+Math.random()*1.1);
      if(t){ t.position.set(bx,0,bz); t.rotation.y=Math.random()*6.28; g.add(t); }
    }
    // BOULDERS around the island's edge
    for(i=0;i<10;i++){
      a=(i/10)*Math.PI*2 + Math.random()*0.3;
      r=ISLAND_R-1.8-Math.random()*2.2;
      t=natGet(i%2?"Rock_Medium_1":"Rock_Medium_2", 1.8+Math.random()*1.8);
      if(t){ t.position.set(Math.cos(a)*r, -0.15, Math.sin(a)*r);
             t.rotation.y=Math.random()*6.28; g.add(t); }
    }
    // and the grass, all of it, in one draw call and all of it moving
    var carpet=grassCarpet(480);
    if(carpet) g.add(carpet);
  }

  scene.add(g);
  islandGroup=g;
  return true;
}

// The models arrive on the wire, so the yard is built once we know whether the
// real chicken made it. Either way the yard gets built — a missing file falls
// back to the hand-built hen and the farm still works. FM6 chains the nature
// kit on after it, and the island is dressed BEFORE the save is poured in, so
// a restored farm never lands on a bare green disc.
loadFarmAnimals(function(){
  loadNature(function(){
    dressIsland();
    placeBookStand();          // FM8 — the sticker book, standing by the barn door
    loadKidModel(KID_LOOK || KID_LOOKS[0].id);   // FM9 — the real main character
    buildFarmyard();

  });
});

// =========================================================================
//  FM2 — zoo(): a stand to judge a model on BEFORE it is placed.
//
//  The mock cow read as a PIG right up until the head went up on a neck and
//  it got horns and spots, and that was only caught by looking at it alone on
//  a turntable. ?zoo=1 (or window.FARM.zoo()) hides the farm, lines every
//  model up on plinths at a fixed camera and turns them, so the next session
//  judges a shape instead of guessing at one.
// =========================================================================
var ZOO_ON=false, ZOO=[], zooGroup=null;
function zoo(){
  if(ZOO_ON) return true;
  ZOO_ON=true;
  // hide the farm but keep the lights, or every exhibit is a silhouette
  scene.children.slice().forEach(function(o){ if(!o.isLight) o.visible=false; });
  zooGroup=new THREE.Group(); scene.add(zooGroup);
  var exhibits=[
    {name:"chicken (model)", make:function(){ return ANM_ON?anmGet("Chicken",1.0):null; }},
    {name:"chicken (drawn fallback)", make:function(){ var w=new THREE.Group(); w.add(buildChickenFallback()); return w; }},
    {name:"cow", make:function(){ return makeAnimalBody("cow").obj; }},
    {name:"coop", make:buildCoop},
    {name:"nest", make:buildNest},
    {name:"trough", make:buildTrough},
    {name:"hay bale", make:buildHayBale},
    {name:"egg", make:function(){ return hbMesh(hbBake(PRODUCE_RECIPES.egg.parts(1))); }},
    {name:"milk bottle", make:function(){ return hbMesh(hbBake(PRODUCE_RECIPES.milk.parts(1))); }},
    // FM3 — judged on the stand before any of them went into the world, same
    // rule that caught the cow reading as a pig.
    {name:"duck (model)", make:function(){ return ANM_ON?anmGet("PekinDuck",1.0):null; }},
    {name:"duck egg", make:function(){ return hbMesh(hbBake(PRODUCE_RECIPES.duckegg.parts(1))); }},
    {name:"crate", make:buildCrate},
    {name:"plane", make:buildPlaneModel},
    // FM5 and FM6 — judged on the stand before any of them went into the
    // world, the same rule that caught the cow reading as a pig.
    {name:"basket", make:buildBasket},
    {name:"present", make:function(){ var g=new THREE.Group();
      g.add(buildPresentBox()); var l=buildPresentLid(); l.position.y=1.3; g.add(l); return g; }},
    {name:"pumpkin", make:function(){ return hbMesh(hbBake(CROP_RECIPES.pumpkin.parts(1))); }},
    {name:"farm dog", make:buildDog},
    // FM7 — everything new goes on the stand before it goes on the farm.
    {name:"strawberry", make:function(){ return hbMesh(hbBake(CROP_RECIPES.strawberry.parts(1))); }},
    {name:"tomato", make:function(){ return hbMesh(hbBake(CROP_RECIPES.tomato.parts(1))); }},
    {name:"melon", make:function(){ return hbMesh(hbBake(CROP_RECIPES.melon.parts(1))); }},
    {name:"truffle", make:function(){ return hbMesh(hbBake(PRODUCE_RECIPES.truffle.parts(1))); }},
    {name:"honey", make:function(){ return hbMesh(hbBake(PRODUCE_RECIPES.honey.parts(1))); }},
    {name:"bread", make:function(){ return hbMesh(hbBake(PRODUCE_RECIPES.bread.parts(1))); }},
    {name:"cheese", make:function(){ return hbMesh(hbBake(PRODUCE_RECIPES.cheese.parts(1))); }},
    {name:"pig (model)", make:function(){ return ANM_ON?anmGet("Pig",1.0):null; }},
    {name:"beehive", make:buildHive},
    {name:"mill", make:buildMill},
    {name:"dairy", make:buildDairy},
    {name:"watering can", make:buildCan},
    {name:"scarecrow", make:buildScarecrow},
    // FM8 and FM9 — same rule, and it earned its keep again: the farmhand's
    // first turn was a scarecrow with arms and the truck's first bed was a box.
    {name:"farmhand", make:buildHand},
    {name:"tractor", make:buildTractor},
    {name:"delivery truck", make:buildTruck},
    {name:"sticker book", make:buildBookStand},
    {name:"the kid (drawn fallback)", make:buildKid},
    {name:"the kid (model)", make:function(){
      return KID3.root ? KID3.root.clone(true) : null; }}
  ];
  // EVERY EXHIBIT IS NORMALISED TO THE SAME LONGEST DIMENSION, which is the
  // whole point of a stand: a shape is judged against the others rather than
  // against however big it happened to be built. The first pass skipped this
  // and put a house-sized egg next to a thumbnail cow.
  // Rows are STAGGERED half a place sideways and stood well apart, so a front
  // exhibit sits in the gap between two back ones instead of in front of one.
  // Straight rows hid the cow behind the egg.
  var SHOW=2.30, perRow=5, gap=4.6, rowGap=6.4, names=[];
  exhibits.forEach(function(e,i){
    var col=i%perRow, row=Math.floor(i/perRow);
    var x=(col-(perRow-1)/2)*gap + (row%2 ? gap*0.5 : 0), z=row*rowGap;
    var plinth=hbMesh(hbBake([
      hbTurn([[1.35,0],[1.35,0.26],[1.18,0.34],[0.001,0.36]],0xEFE6D2,{p:[x,0,z]},18)
    ]));
    zooGroup.add(plinth);
    var m=null; try{ m=e.make(); }catch(err){ m=null; }
    if(m){
      var box=new THREE.Box3().setFromObject(m);
      var span=Math.max(0.001, box.max.x-box.min.x, box.max.y-box.min.y, box.max.z-box.min.z);
      var wrap=new THREE.Group();
      m.position.y-=box.min.y;          // sit it ON the plinth, never through it
      wrap.add(m);
      wrap.scale.setScalar(SHOW/span);
      wrap.position.set(x,0.36,z);
      zooGroup.add(wrap); ZOO.push(wrap);
    }
    names.push(e.name+(m?"":" (MISSING)"));
  });
  var rows=Math.ceil(exhibits.length/perRow);
  scene.background=new THREE.Color(0x30506B);
  scene.fog=null;
  // Frame the whole grid, whatever size it grows to, and sit HIGH enough that
  // the front row does not stand in front of the back row — the second pass
  // hid the cow behind the egg.
  // FM7 — the stand is up to six rows now and the last one was off the bottom
  // of the screen. The camera backs off with the DEPTH as well as the width.
  var spanX=(perRow+0.5)*gap, spanZ=(rows-1)*rowGap;
  var back=Math.max(spanX*0.92, 12) + spanZ*0.42;
  camera.position.set(0, 10.5+spanZ*0.72, spanZ*0.5+back);
  camera.lookAt(0, 0.6, spanZ*0.5);
  // FM6 — the wish-list card sat right on top of the last row of exhibits, so
  // the two models the stand existed to judge were the two you could not see.
  try{ orderCardEl.classList.remove("up"); }catch(e){}
  try{ document.getElementById("hint").style.display="none"; }catch(e){}
  var strip=document.createElement("div");
  strip.id="zooNames";
  strip.style.cssText="position:absolute;left:0;right:0;bottom:8px;text-align:center;"+
    "color:#fffdf4;font-weight:800;font-size:13px;text-shadow:0 2px 6px rgba(0,0,0,.5);padding:0 10px";
  strip.textContent="zoo: "+names.join("  |  ");
  document.getElementById("hud").appendChild(strip);
  document.getElementById("stick").style.display="none";
  document.getElementById("hint").style.display="none";
  return true;
}
function stepZoo(dt){
  for(var i=0;i<ZOO.length;i++) ZOO[i].rotation.y+=dt*0.55;
}

// FM6 — WHAT SHE MAY PLANT TODAY. The three starters, plus any seed a present

// FM8 — the tractor's version of the same card. Same seeds, same prices, same
// buttons; the only difference is that what she picks goes in EVERY patch.

  var t=document.getElementById("seedTitle");
  if(t) t.textContent=text;
}
