<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Sky Flyer — The Farm island (FM7)</title>
<!--
  FM1 — the farm corner of Sunny Islands, built in the Sky Flyer engine style.
  Standalone scene: same three.min.js, same hand-built vertex-colored models
  (AR1P recipe: lathes + lofts + balls baked into one geometry, one shared
  MeshPhong vertexColors material, no textures, no AI art). No emojis anywhere.

  What is here:
    - a fenced field of dirt patches
    - THE STACK (the heart of the mode): crops hop onto a carried tower over
      the kid's head; no cap; leans and wobbles more the taller it gets
      (whip-lag on x/z, amplitude scaling with height) and never falls
    - tap an empty patch to open a floating seed pop-up (max 340px, AR1R
      shape, rounded), pick corn / carrot / wheat, pay coins, plant
    - crops grow through sprout / mid / ready in 30-60 seconds; ready crops
      wobble and sparkle
    - harvest = walk through them; each hops onto the stack with a bounce

  FM2 — THE ANIMALS AND THE FEEDING. Added east of the field:
    - a coop yard with FOUR chickens: three settled on nests, one strutting a
      patrol loop. The chicken is a REAL model out of the EverythingLibrary
      animal kit, cut to its own 65KB glb by scripts/cut-animal-subset.mjs.
      Its colour is entirely in COLOR_0, so the merge here carries that
      attribute through — the engine's own mergeByMaterial() drops it and
      renders every animal solid BLACK.
    - a pen with ONE cow. There is no cow in the repo's 18-animal cut and the
      178-animal source library is not in this sandbox, so the cow is turned
      and lofted in code in the AR1P style, exactly like the crab, parrot and
      fish the flying engine hand-builds for the same reason. It is built
      against the note from the mock: the head goes UP ON A NECK, it has
      HORNS, and it has SURFACE SPOTS — without those three it reads as a pig.
    - FEEDING WITH NO MENUS AND NO READING. A hungry animal floats a small 3D
      model of what it wants over its head. Walk past carrying that item and
      the top matching one FLIES OFF THE STACK to the animal on an arc. Corn
      to the chickens, wheat to the cow.
    - After a short wait (well under a minute) an egg or a milk bottle appears
      beside the animal with a sparkle. Walk over it and it hops onto the
      stack exactly like a harvested crop.
    - NOTHING CAN DIE, STARVE OR FAIL. There is no hunger meter, no timer
      running out, no health. An unfed animal simply keeps waiting.
    - zoo(): ?zoo=1 (or window.FARM.zoo()) stands every farm model on a
      turntable at a fixed camera, so a model is judged BEFORE it is placed.

  FM3 — THE ORDER CRATE AND THE PLANE PAYOFF. West of the field:
    - a wooden CRATE beside a grass runway. Over it floats a picture wish-list:
      one silhouette slot per item wanted (3 corn + 2 eggs is five slots), and
      each slot lights up to full colour with a tick the moment that item lands
      in it. FL5b tick/cross language, icons drawn in code from the same
      recipes as the 3D crops. No reading, NO EMOJIS.
    - WALK TO THE CRATE AND THE WHOLE STACK WHOOSHES OFF, one item at a time,
      rapid fire, each on its own arc into its slot. This unload is the moment
      the genre is built on, so it gets the works: a pop and a spin per item,
      a sound per item rising in pitch as the run goes, the slot flashing as it
      fills, and a nudge of the camera on the last one. An item the order does
      not want stays on the stack — the crate flashes a cross on it and moves on.
    - WHEN THE ORDER FILLS the plane taxis out, rolls down the runway, climbs
      away, and comes back a moment later with a burst of coins that fly up
      into the wallet pill.
    - Orders scale gently (2 items, then 3, then 4, up to 6) and may only ever
      ask for something the kid can grow or collect RIGHT NOW.
    - Coins buy seeds, and at 120 coins they buy a DUCK for the coop — a real
      model out of island-animals.glb. She eats corn like the hens and lays a
      pale blue egg, which becomes a fourth thing an order can ask for.
    - Guardrails held: nothing here has a timer over a minute, nothing can fail,
      nothing costs real money, and a kid who runs out of coins gets their next
      seed free rather than being stuck.

  FM4 — THE PLAYTEST FIXES, AND A WISH LIST A CHILD CAN READ. Every one of
  these came out of one afternoon with Mike's daughter on a tablet:
    - AN ORDER MAY ONLY ASK FOR WHAT HAS ALREADY BEEN CARRIED. A kind joins
      the pool the first time it lands on the stack (COLLECTED, kept in
      localStorage), seeded with the three crops, so the first crate can only
      ever ask for something a kid can go and grow. FM3 listed anything an
      animal could ever give, and the very first order asked for MILK.
    - A NEAR MISS IS A PICKUP. Reach 2.0 -> 3.0 for produce AND ready crops,
      and inside 4.0 a loose egg or bottle slides over and hops on by itself.
    - SOLID THINGS. Fence rails and posts, the coop house, the crate and the
      PARKED plane all block, with a slide so a fence is something you run
      along and never something you stick to. Crops and animals stay
      walk-through on purpose. The field, the coop yard and the cow pen each
      have ONE gate: a rail gap with two taller posts on it, so the way in
      reads as a doorway without a word being written.
    - TAP TO GO, the main way to move on a tablet, with the joystick kept as
      the backup that always wins. Tap ground and she walks there behind a
      soft ring that fades as she arrives; tap a crop, an egg, an animal or
      the crate and the behaviour that was already there fires on arrival.
      A path that crosses a fence takes that pen's gate first. No new HUD.
    - THE WISH LIST IN FULL COLOUR: one big slot per KIND with a count badge
      that ticks down to a green tick, what the crate wants turning in 3D
      over the crate, and a drawn customer face waiting on the card.
    - Mike's numbers: seeds 4/3/2, item values 4/3/2/6/7/8, and an order pays
      three times the worth of what it asked for.

  FM5 — THE TOWNSHIP LESSONS. Mike's kids love Township, and the reason is
  that it is a place they own that keeps changing and is waiting for them. The
  farm used to forget everything on reload, so nothing could stick:
    - IT REMEMBERS HER. The whole farm — patches, animals, the stack, the
      pantry, the live order, the presents — saves per kid to Supabase
      (farm_saves, via /api/farm-save) with localStorage underneath it.
      Best-effort and silent: the game runs at full speed off the local copy
      and syncs in the background, a save error is invisible to the kid, and
      THERE IS NO RESET a child can reach.
    - IT GROWS WHILE SHE IS AWAY. A deterministic catch-up finishes what was
      started, capped by its own shape: a field cannot be more than fully
      ready and a fed animal gives at most one thing while she is gone.
    - AND SOMETHING IS WAITING. Away more than ten minutes with anything
      finished and a BASKET sits by the door holding it, the items floating
      over it in colour. Walk to it and the lot whooshes onto the stack on the
      FM3 unload treatment. Nothing else on the farm moves until she gets
      there, so the first ten seconds of every visit are a reward.
    - NEVER IDLE. whatCanSheDoNow() counts what she could do THIS SECOND, and
      if that would ever be zero the farm quietly finishes whatever is closest
      to done before she notices. An order that cannot be progressed is a bug
      and qa-farm asserts it never happens.
    - THE NEXT THING IS ALWAYS VISIBLE. A fixed ladder of eight presents, one
      shown at a time as a wrapped box with its price under it: pumpkin seed
      130, farm dog 180, another row 240, pig 300, mill 380, bees 460,
      strawberry 560, tractor 700. Opening one is the biggest celebration in
      the game — confetti, the plane over the top, the thing hopping out of
      the box. FM6 to FM8 build the things themselves; until then an opened
      present marks the unlock owned and hops a third of its coins back out.
    - SMALL CELEBRATIONS, CONSTANTLY. Soil puffs on planting, a chime the
      moment a crop is takeable, hearts over a fed animal, a sparkle when an
      egg lands. All under half a second, all through the shared Feel Kit,
      all silent when bk_muted is set.
  NO TIMERS ON SCREEN, still. Nothing in FM5 draws a countdown and QA greps
  for it. Growth is a shape changing, exactly as it always was.

  FM6 — THE FIRST THREE PRESENTS, BUILT FOR REAL. FM5 shipped the ladder with
  hollow boxes. These three are things now:
    - THE PUMPKIN SEED (130). A fourth crop: the dearest seed, the slowest to
      grow at 46 seconds, and worth 10 — the biggest single thing an order can
      ask for. It appears in the seed pop-up only once the present is opened,
      and an order may not name it before then, because until she has the seed
      there is no way for her to fill it.
    - THE FARM DOG (180). A companion who TIDIES UP AFTER HER and is
      deliberately not an autoplayer: he only goes for something that has sat
      ready for ten seconds AND is more than seven units away from her, he
      carries one thing at a time, and he trots at 4.6 against her 6.4 so she
      can always beat him to it. He ignores the fences, because a dog goes
      under a rail.
    - THE SECOND FIELD ROW (240). Three more patches, added to the SOUTH so
      that not one crop she already planted moves an inch. The fence comes
      down and goes back up around the bigger field; blockers now remember who
      owns them so the coop's and the pen's are never disturbed.
  Opening a present now changes the farm with the confetti, and a save puts
  every opened present back before the field it may have grown is filled in.

  FM3 also closed the four things FM1 left open: the farm now has a door on the
  Play page, the coins are the SHELL'S shared wallet (not a local variable), the
  shared nav bridge is loaded so Home works on iPhone, and the shared Feel Kit
  gives it sound.
-->
<style>
  html,body{margin:0;padding:0;overflow:hidden;height:100%;background:#B3E58C;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    -webkit-user-select:none;user-select:none;touch-action:none;color:#33566e}
  canvas{display:block}
  #hud{position:fixed;inset:0;pointer-events:none}
  .pill{position:absolute;top:calc(12px + env(safe-area-inset-top));right:14px;
    background:rgba(255,252,240,.92);border-radius:999px;padding:8px 16px 8px 10px;
    display:flex;align-items:center;gap:8px;box-shadow:0 3px 10px rgba(30,60,90,.18);
    font-weight:800;font-size:20px;color:#5b4a1f}
  .pill svg{display:block}
  #titlePill{position:absolute;top:calc(12px + env(safe-area-inset-top));
    left:calc(96px + env(safe-area-inset-left));
    background:rgba(255,252,240,.92);border-radius:999px;padding:8px 16px;
    font-weight:800;font-size:14px;color:#33566e;box-shadow:0 3px 10px rgba(30,60,90,.18)}
  /* The order card owns the bottom of the screen now, so the hint is hung off
     the SAME variable rather than a percentage that happened to clear it before
     FM3 existed. The first render had the card sitting on top of the sentence
     telling a kid what to do. */
  :root{--fm-card-b:calc(20px + env(safe-area-inset-bottom))}
  #hint{position:absolute;left:50%;bottom:calc(var(--fm-card-b) + 196px);transform:translateX(-50%);
    background:rgba(255,252,240,.94);border-radius:20px;padding:12px 22px;
    text-align:center;color:#33566e;font-weight:800;font-size:16px;
    box-shadow:0 4px 14px rgba(30,60,90,.2);transition:opacity .5s;
    max-width:80%}
  #hint .sub{font-weight:600;font-size:13px;color:#6b8aa0;margin-top:4px}
  #toast{position:absolute;left:50%;top:26%;transform:translateX(-50%) scale(.8);
    color:#fff;font-weight:900;font-size:28px;text-shadow:0 3px 8px rgba(30,60,90,.4);
    opacity:0;pointer-events:none}
  #toast.show{animation:pop 1.6s ease forwards}
  @keyframes pop{0%{opacity:0;transform:translateX(-50%) scale(.6)}
    15%{opacity:1;transform:translateX(-50%) scale(1.08)}
    30%{transform:translateX(-50%) scale(1)}
    75%{opacity:1}100%{opacity:0;transform:translateX(-50%) scale(1)}}

  /* AR1R offer-card shape, adopted here for the seed picker: floating (not a
     bottom sheet), rounded, capped at 340px wide, three big picture buttons,
     no emojis. */
  #seedCard{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);
    background:#fffef7;border-radius:26px;padding:14px 14px 18px;
    box-shadow:0 12px 40px rgba(30,60,90,.35),0 2px 0 #d9c99a inset;
    width:min(340px,92vw);max-width:340px;pointer-events:auto;
    opacity:0;visibility:hidden;transition:opacity .18s,transform .18s,visibility .18s;
    z-index:10}
  #seedCard.up{opacity:1;visibility:visible;transform:translate(-50%,-50%) scale(1)}
  #seedCard .title{text-align:center;font-weight:900;font-size:17px;color:#5b4a1f;
    padding:2px 0 10px;letter-spacing:.3px}
  #seedCard .row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  /* FM6 — a fourth seed arrives with the first present. Four across still
     reads on a tablet; on a phone they go two by two rather than shrinking
     into pictures too small to tell apart. */
  #seedCard .row.four{grid-template-columns:1fr 1fr 1fr 1fr}
  #seedCard .row.four .seed .art{height:66px}
  #seedCard .row.four .seed .name{font-size:12px}
  @media (max-width:430px){
    #seedCard .row.four{grid-template-columns:1fr 1fr}
    #seedCard .row.four .seed .art{height:76px}
  }
  #seedCard .seed{background:#f6efd6;border:2px solid #e7d9a4;border-radius:18px;
    padding:8px 6px 10px;text-align:center;cursor:pointer;transition:transform .08s;
    user-select:none;-webkit-tap-highlight-color:transparent}
  #seedCard .seed:active{transform:translateY(2px)}
  #seedCard .seed.locked{opacity:.42;cursor:not-allowed}
  #seedCard .seed .art{height:82px;display:flex;align-items:flex-end;justify-content:center}
  #seedCard .seed .name{font-weight:800;font-size:13px;color:#5b4a1f;margin-top:4px}
  #seedCard .seed .price{display:inline-flex;align-items:center;gap:4px;
    background:#fff7d6;border-radius:999px;padding:2px 8px;margin-top:4px;
    font-weight:800;font-size:13px;color:#8a6a12}
  /* FM3: when a kid is broke the price badge turns into a green FREE badge
     rather than the button going dead. Nobody is ever locked out of planting. */
  #seedCard .seed .price.free{background:#eaf7e4;color:#3f8f46}
  #seedCard .seed .price.free svg{display:none}
  #seedCard .seed .price.free::after{content:"FREE"}
  #seedCard .seed .price.free>span{display:none}
  #seedCard .close{position:absolute;top:6px;right:8px;width:28px;height:28px;
    border:none;background:transparent;cursor:pointer}
  #seedCard .close svg{display:block}

  /* FL9/HUD-AND-NAV: in the shell the top strip belongs to Home / Sound, so the
     coin pill and the title drop below whatever depth the nav bridge publishes.
     The 96px fallback is the depth a two-button strip resolves to, so the very
     first frame is already right and nothing jumps when the bridge answers. */
  .bk-inshell .pill      {top:calc(var(--bk-nav-bottom,96px) + 10px)}
  .bk-inshell #titlePill {top:calc(var(--bk-nav-bottom,96px) + 10px)}

  /* FM3 — THE ORDER CARD. One silhouette slot per item the crate wants; a slot
     fills to full colour with a tick as that item lands. No emojis: every icon
     is the crop's own drawn SVG, the same one the seed buttons use (FL5b).
     It lives bottom-centre. On a phone the joystick owns the bottom-left, so
     below 640px the card lifts clear ABOVE the stick rather than shrinking into
     a strip too small to read. */
  #orderCard{position:absolute;left:50%;transform:translateX(-50%) scale(.96);
    bottom:var(--fm-card-b);
    background:#fffef7;border-radius:22px;padding:9px 12px 11px;
    box-shadow:0 10px 30px rgba(30,60,90,.3),0 2px 0 #d9c99a inset;
    width:max-content;max-width:min(392px,calc(100vw - 190px));
    opacity:0;visibility:hidden;transition:opacity .2s,transform .2s,visibility .2s;
    pointer-events:none;z-index:8}
  #orderCard.up{opacity:1;visibility:visible;transform:translateX(-50%) scale(1)}
  #orderCard.done{box-shadow:0 10px 30px rgba(60,150,80,.45),0 0 0 3px #63C466 inset}
  /* FM4 — the customer sits next to the word, and the word is small: the
     PICTURES are the message. */
  #orderCard .cap{display:flex;align-items:center;justify-content:center;gap:8px;
    font-weight:900;font-size:12px;color:#8a7a4a;letter-spacing:.6px;
    text-transform:uppercase;padding:0 0 7px}
  #orderCard .cap .face{width:36px;height:36px;display:block;flex:0 0 auto}
  #orderCard .slots{display:flex;flex-wrap:nowrap;justify-content:center;gap:8px}
  #orderCard .slot{width:74px;height:78px;border-radius:18px;background:#f6efd6;
    border:2px dashed #cbb887;display:flex;align-items:center;justify-content:center;
    position:relative;transition:transform .12s,background .18s,border-color .18s}
  /* FM4 — FULL COLOUR, ALWAYS. FM3 greyed an empty slot to mean "not yet", and
     on a tablet Mike's daughter read that as a broken picture: the one thing a
     child who cannot read has to go on was a grey smudge. The DASHED FRAME is
     what says not-yet now. The picture is just the picture, corn-yellow and
     carrot-orange, from the first frame to the last. */
  #orderCard .slot svg.pic{width:58px;height:58px;display:block}
  #orderCard .slot.full{background:#eaf7e4;border-style:solid;border-color:#8ed08a}
  /* ONE SLOT PER KIND, with how many are still wanted on a dark pill. Three
     corn and two eggs is TWO pictures and two numbers, not five pictures. */
  #orderCard .slot .count{position:absolute;left:-6px;top:-7px;min-width:25px;height:25px;
    border-radius:999px;background:#3d4f5c;color:#fff;font-weight:900;font-size:14px;
    line-height:1;display:flex;align-items:center;justify-content:center;padding:0 6px;
    box-shadow:0 2px 5px rgba(30,60,90,.32)}
  #orderCard .slot.full .count{display:none}
  #orderCard .slot.pop{transform:scale(1.22)}
  #orderCard .slot .mark{position:absolute;right:-4px;bottom:-4px;width:26px;height:26px;
    opacity:0;transform:scale(.5);transition:opacity .16s,transform .16s}
  #orderCard .slot.full .mark{opacity:1;transform:scale(1)}
  /* FM8 — THE ONE THIS CUSTOMER LOVES. A heart on the slot, and that is the
     whole lesson: bring the bear his honey and he pays more for it. */
  #orderCard .slot .heart{position:absolute;left:-6px;bottom:-6px;width:24px;height:24px;
    display:none}
  #orderCard .slot.fav .heart{display:block}
  #orderCard .cap .face.love{animation:loveBounce .6s ease}
  @keyframes loveBounce{0%,100%{transform:scale(1)}30%{transform:scale(1.35) rotate(-6deg)}
    65%{transform:scale(1.12) rotate(4deg)}}
  #orderCard .slot.nope{animation:nope .34s ease}
  @keyframes nope{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}
    60%{transform:translateX(5px)}}
  #orderCard .payline{display:flex;align-items:center;justify-content:center;gap:4px;
    margin-top:7px;font-weight:800;font-size:13px;color:#8a6a12}
  @media (max-width:640px){
    :root{--fm-card-b:calc(174px + env(safe-area-inset-bottom))}
    #orderCard{max-width:min(392px,96vw)}
  }
  /* the smallest phones: still one row, still full colour, just a shade smaller */
  @media (max-width:400px){
    #orderCard .slot{width:64px;height:68px}
    #orderCard .slot svg.pic{width:50px;height:50px}
  }

  /* FM3 — the coins that fly up into the wallet when the plane lands. */
  .flyCoin{position:absolute;width:22px;height:22px;pointer-events:none;z-index:9}

  /* FM3 — THE SHOP. One card, one thing in it: the duck. Same AR1R shape as
     the seed picker so the farm only ever teaches one card. */
  #shopBtn{position:absolute;right:14px;
    top:calc(58px + env(safe-area-inset-top));
    background:rgba(255,252,240,.92);border:none;border-radius:999px;
    padding:7px 13px 7px 9px;display:none;align-items:center;gap:6px;
    box-shadow:0 3px 10px rgba(30,60,90,.18);font-weight:800;font-size:13px;
    color:#5b4a1f;pointer-events:auto;cursor:pointer;
    -webkit-tap-highlight-color:transparent}
  #shopBtn.on{display:flex}
  .bk-inshell #shopBtn{top:calc(var(--bk-nav-bottom,96px) + 56px)}
  #shopCard{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);
    background:#fffef7;border-radius:26px;padding:14px 14px 18px;
    box-shadow:0 12px 40px rgba(30,60,90,.35),0 2px 0 #d9c99a inset;
    width:min(340px,92vw);max-width:340px;pointer-events:auto;
    opacity:0;visibility:hidden;transition:opacity .18s,transform .18s,visibility .18s;
    z-index:11;text-align:center}
  #shopCard.up{opacity:1;visibility:visible;transform:translate(-50%,-50%) scale(1)}
  #shopCard .title{font-weight:900;font-size:17px;color:#5b4a1f;padding:2px 0 8px}
  #shopCard .buy{background:#f6efd6;border:2px solid #e7d9a4;border-radius:18px;
    padding:10px 8px 12px;cursor:pointer;user-select:none;
    -webkit-tap-highlight-color:transparent;transition:transform .08s}
  #shopCard .buy:active{transform:translateY(2px)}
  #shopCard .buy.locked{opacity:.42;cursor:not-allowed}
  #shopCard .buy .art{height:96px;display:flex;align-items:center;justify-content:center}
  #shopCard .buy .price{display:inline-flex;align-items:center;gap:4px;
    background:#fff7d6;border-radius:999px;padding:3px 10px;margin-top:6px;
    font-weight:800;font-size:14px;color:#8a6a12}
  #shopCard .close{position:absolute;top:6px;right:8px;width:28px;height:28px;
    border:none;background:transparent;cursor:pointer}
  /* FM5 — THE NEXT PRESENT. It sits above the duck and it is the loud one:
     a warm wrapped box on its own paper-coloured tile, price under it, and
     nothing at all shown about what comes after it. */
  #shopCard .buy + .buy{margin-top:10px}
  #shopCard .buy.present{background:#fdf0ef;border-color:#f0c6c2}
  #shopCard .buy.present .art{height:104px}
  /* the reveal's confetti — the one moment allowed to cover the whole screen */
  .confetti{position:absolute;left:0;top:0;width:10px;height:15px;border-radius:2px;
    pointer-events:none;z-index:12;will-change:transform,opacity}

  /* FM7 — THE NAME PICKER. Eight shapes, four across, and not one word in it
     beyond the title. She cannot type and should never be asked to. */
  #nameCard{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);
    background:#fffef7;border-radius:26px;padding:14px 14px 18px;
    box-shadow:0 12px 40px rgba(30,60,90,.35),0 2px 0 #d9c99a inset;
    width:min(340px,92vw);max-width:340px;pointer-events:auto;
    opacity:0;visibility:hidden;transition:opacity .18s,transform .18s,visibility .18s;
    z-index:11;text-align:center}
  #nameCard.up{opacity:1;visibility:visible;transform:translate(-50%,-50%) scale(1)}
  #nameCard .title{font-weight:900;font-size:17px;color:#5b4a1f;padding:2px 0 10px}
  #nameCard .row{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px}
  #nameCard .mark{background:#f6efd6;border:2px solid #e7d9a4;border-radius:16px;
    padding:8px 4px;cursor:pointer;display:flex;align-items:center;justify-content:center;
    -webkit-tap-highlight-color:transparent;transition:transform .08s,background .15s}
  #nameCard .mark:active{transform:translateY(2px)}
  #nameCard .mark.on{background:#eaf7e4;border-color:#8ed08a}
  #nameCard .close{position:absolute;top:6px;right:8px;width:28px;height:28px;
    border:none;background:transparent;cursor:pointer}

  /* FM7 — THINGS FOR THE FARM. Same card shape as everything else, so the farm
     only ever teaches one card. */
  #decorBtn{position:absolute;right:14px;
    top:calc(102px + env(safe-area-inset-top));
    background:rgba(255,252,240,.92);border:none;border-radius:999px;
    padding:7px 13px 7px 9px;display:none;align-items:center;gap:6px;
    box-shadow:0 3px 10px rgba(30,60,90,.18);font-weight:800;font-size:13px;
    color:#5b4a1f;pointer-events:auto;cursor:pointer;

<script>
(function(){
"use strict";
// -------------------------------------------------------------------------
// FM1 — tiny helpers, in the engine's style
// -------------------------------------------------------------------------
var clamp=function(v,a,b){return v<a?a:(v>b?b:v);};
var lerp=function(a,b,t){return a+(b-a)*t;};
var Q=(function(){try{return new URLSearchParams(location.search);}catch(e){return new URLSearchParams("");}})();
var NODRAW=Q.get("nodraw")==="1";

// -------------------------------------------------------------------------
// Renderer / scene / camera. 3/4 overhead, so you see the field and the
// stack over the kid's head at the same time.
// -------------------------------------------------------------------------
var W=innerWidth,H=innerHeight;
var renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
renderer.setSize(W,H);
document.body.insertBefore(renderer.domElement,document.getElementById('hud'));
var scene=new THREE.Scene();
scene.background=new THREE.Color(0x7ecbff);
scene.fog=new THREE.Fog(0xbfe6ff,60,150);
var camera=new THREE.PerspectiveCamera(46,W/H,0.1,400);
camera.position.set(0,26,32); camera.lookAt(0,0,0);
window.addEventListener("resize",function(){
  W=innerWidth;H=innerHeight;renderer.setSize(W,H);camera.aspect=W/H;camera.updateProjectionMatrix();
});

// -------------------------------------------------------------------------
// Lighting — hemi + a warm sun, matches the Sunny Islands palette.
// -------------------------------------------------------------------------
scene.add(new THREE.HemisphereLight(0xCDEBFF,0x86AE6E,0.92));
var sun=new THREE.DirectionalLight(0xFFEFC6,0.95);
sun.position.set(20,40,18); scene.add(sun);

// -------------------------------------------------------------------------
// AR1P recipe helpers (lathes, lofts, balls, cones), baked to one mesh with
// vertex colours. Straight from the engine's hbBuild pattern — the point is
// the crops and the kid come from the SAME primitives as the engine's crab /
// parrot / fish, so the whole world reads as one hand.
// -------------------------------------------------------------------------
var HB_MAT=new THREE.MeshPhongMaterial({vertexColors:true,shininess:22,specular:0x222222,flatShading:false});

function hbPaint(geo,hex,tf){
  if(tf){
    if(tf.s) geo.scale(tf.s[0],tf.s[1],tf.s[2]);
    if(tf.r){ if(tf.r[0])geo.rotateX(tf.r[0]); if(tf.r[1])geo.rotateY(tf.r[1]); if(tf.r[2])geo.rotateZ(tf.r[2]); }
    if(tf.p) geo.translate(tf.p[0],tf.p[1],tf.p[2]);
  }
  var c=new THREE.Color(hex), n=geo.attributes.position.count, col=new Float32Array(n*3),i;
  for(i=0;i<n;i++){ col[i*3]=c.r; col[i*3+1]=c.g; col[i*3+2]=c.b; }
  geo.setAttribute("color",new THREE.Float32BufferAttribute(col,3));
  return geo;
}
function hbBake(parts){
  var pos=[],nor=[],col=[],idx=[],base=0,i,k;
  for(k=0;k<parts.length;k++){
    var g=parts[k]; if(!g||!g.attributes.position) continue;
    if(!g.attributes.normal) g.computeVertexNormals();
    var pa=g.attributes.position,na=g.attributes.normal,ca=g.attributes.color;
    for(i=0;i<pa.count;i++){
      pos.push(pa.getX(i),pa.getY(i),pa.getZ(i));
      nor.push(na.getX(i),na.getY(i),na.getZ(i));
      col.push(ca.getX(i),ca.getY(i),ca.getZ(i));
    }
    if(g.index){ for(i=0;i<g.index.count;i++) idx.push(g.index.getX(i)+base); }
    else { for(i=0;i<pa.count;i++) idx.push(i+base); }
    base+=pa.count;
  }
  var o=new THREE.BufferGeometry();
  o.setAttribute("position",new THREE.Float32BufferAttribute(pos,3));
  o.setAttribute("normal",new THREE.Float32BufferAttribute(nor,3));
  o.setAttribute("color",new THREE.Float32BufferAttribute(col,3));
  o.setIndex(idx); return o;
}
function hbBall(r,c,tf,sg){ return hbPaint(new THREE.SphereGeometry(r,sg||10,(sg||10)-2),c,tf); }
function hbTube(r1,r2,h,c,tf,sg){ return hbPaint(new THREE.CylinderGeometry(r1,r2,h,sg||10),c,tf); }
function hbCone(r,h,c,tf,sg){ return hbPaint(new THREE.ConeGeometry(r,h,sg||10),c,tf); }
function hbBox(w,h,d,c,tf){ return hbPaint(new THREE.BoxGeometry(w,h,d),c,tf); }
// LATHE PROFILE MUST RUN UP THE AXIS.
function hbTurn(profile,c,tf,sg){
  var pts=profile.map(function(p){ return new THREE.Vector2(Math.max(0.001,p[0]),p[1]); });
  return hbPaint(new THREE.LatheGeometry(pts,sg||12),c,tf);
}
function hbMesh(geo){ return new THREE.Mesh(geo,HB_MAT); }
// FM3 — a TAPERED aerofoil. Everything else in this file is a lathe or a ball
// and neither can make a wing. A single BOX can, but a box reads as a plank,
// and building one out of stepped boxes reads as a staircase — the first two
// renders showed exactly that. So this takes one segmented box and pulls its
// VERTICES in: the chord shrinks smoothly toward the tip while the trailing
// edge stays straight, which is the shape a paper plane has and the shape the
// eye recognises as a wing. `up` builds a fin standing on its root instead.
function hbAero(span, rootChord, tipChord, thick, color, tf, up){
  var g = up ? new THREE.BoxGeometry(thick, span, rootChord, 1, 16, 1)
             : new THREE.BoxGeometry(span, thick, rootChord, 16, 1, 1);
  var pa=g.attributes.position, i;
  for(i=0;i<pa.count;i++){
    var t = up ? (pa.getY(i)+span/2)/span : Math.abs(pa.getX(i))/(span/2);
    t = t<0?0:(t>1?1:t);
    var chord = rootChord+(tipChord-rootChord)*t;
    // scale the chord about the centre, then slide it back so the TRAILING
    // edge stays on one straight line and only the leading edge sweeps
    pa.setZ(i, pa.getZ(i)*(chord/rootChord) - (rootChord-chord)/2);
  }
  g.computeVertexNormals();
  return hbPaint(g, color, tf);
}


// =========================================================================
//  FM6 — THE LAND. The farm stops being a flat green plane with things
//  standing on it and becomes an ISLAND: grass out to a sand rim, a low edge
//  dropping to the sea, a warm-to-blue sky with haze in the distance, and
//  wind moving through everything that grows.
//
//  THE SET DRESSING IS QUATERNIUS STYLIZED NATURE (CC0). This session could
//  not reach quaternius.com — the sandbox proxy answers 403 to it — so it
//  builds from the FOURTEEN pieces already in public/models/nature and makes
//  everything else in code. The pieces that are still wanted from the full
//  MegaKit are listed in SESSION-LOG.md so a session with a network can drop
//  them in without redesigning anything.
//
//  Sky, haze and wind are code and not assets, so they are here regardless.
// =========================================================================
var ISLAND_R  = 46;      // grass out to here
var SAND_W    = 3.4;     // then a rim of sand
var SHORE_Y   = -1.15;   // and the edge drops to the water
var GRASS_C   = 0x8FD262, GRASS_D = 0x76B84F;
var SAND_C    = 0xE7CD92, EARTH_C = 0xA37E4E;
var SEA_C     = 0x2C86B8, SHALLOW_C = 0x62BEDA;

// ------------------------------------------------------------------- WIND
// One uniform, updated once a frame, and the vertex shader does the rest.
// Doing this on the CPU would mean touching a matrix for every blade of grass
// on the island every frame; this way the grass, the leaves and the flowers
// all move and it costs nothing.
var WIND = { time: { value: 0 } };
function windify(mat, amount){
  if(!mat || mat.userData.windy) return mat;
  mat.userData.windy = true;
  mat.onBeforeCompile = function(shader){
    shader.uniforms.uWindTime = WIND.time;
    shader.uniforms.uWindAmt  = { value: amount==null ? 0.035 : amount };
    shader.vertexShader = "uniform float uWindTime;\nuniform float uWindAmt;\n" + shader.vertexShader;
    shader.vertexShader = shader.vertexShader.replace(
      "#include <begin_vertex>",
      [
        "#include <begin_vertex>",
        "{",
        "  float wH = max(transformed.y, 0.0);",
        "  vec3 wOrg = vec3(0.0);",
        "  #ifdef USE_INSTANCING",
        "    wOrg = instanceMatrix[3].xyz;",
        "  #endif",
        "  float wPh = (wOrg.x + transformed.x) * 0.24 + (wOrg.z + transformed.z) * 0.21;",
        "  transformed.x += sin(uWindTime * 1.45 + wPh) * wH * uWindAmt;",
        "  transformed.z += cos(uWindTime * 1.05 + wPh) * wH * uWindAmt * 0.6;",
        "}"
      ].join("\n"));
  };
  mat.needsUpdate = true;
  return mat;
}

// ------------------------------------------------------------------- SKY
// A dome with a warm horizon under a blue top, and the fog tuned to the same
// horizon colour so the far side of the island fades into it instead of
// stopping dead at a hard line.
function buildSky(){
  var g=new THREE.SphereGeometry(300, 16, 10);
  var pa=g.attributes.position, n=pa.count, col=new Float32Array(n*3), i;
  var lo=new THREE.Color(0xFFF0D2), mid=new THREE.Color(0xBFE8F5), hi=new THREE.Color(0x62B6E8);
  var c=new THREE.Color();
  for(i=0;i<n;i++){
    var u=clamp((pa.getY(i)/300 + 0.15) / 0.9, 0, 1);
    if(u<0.42) c.copy(lo).lerp(mid, u/0.42);
    else       c.copy(mid).lerp(hi, (u-0.42)/0.58);
    col[i*3]=c.r; col[i*3+1]=c.g; col[i*3+2]=c.b;
  }
  g.setAttribute("color", new THREE.Float32BufferAttribute(col,3));
  return new THREE.Mesh(g, new THREE.MeshBasicMaterial({
    vertexColors:true, side:THREE.BackSide, fog:false, depthWrite:false }));
}

// ------------------------------------------------------------------ THE ISLE
function buildIsland(){
  var g=new THREE.Group(), i;
  // the grass top. FLAT, on purpose: the kid walks at y=0 and a domed island
  // would bury her feet in the middle of it.
  var top=new THREE.CircleGeometry(ISLAND_R, 96);
  top.rotateX(-Math.PI/2);
  hbPaint(top, GRASS_C, null);
  g.add(hbMesh(top));
  // a darker band just inside the rim, so the island has an edge to it rather
  // than reading as one flat colour all the way out
  var band=new THREE.RingGeometry(ISLAND_R-4.5, ISLAND_R, 96, 1);
  band.rotateX(-Math.PI/2);
  hbPaint(band, GRASS_D, {p:[0,0.012,0]});
  g.add(hbMesh(band));
  // the sand rim
  var sand=new THREE.RingGeometry(ISLAND_R, ISLAND_R+SAND_W, 96, 1);
  sand.rotateX(-Math.PI/2);
  hbPaint(sand, SAND_C, {p:[0,0.006,0]});
  g.add(hbMesh(sand));
  // the low edge dropping to the water — an open cylinder skirt in earth
  var skirt=new THREE.CylinderGeometry(ISLAND_R+SAND_W, ISLAND_R+SAND_W-0.9,
    Math.abs(SHORE_Y)+0.4, 96, 1, true);
  hbPaint(skirt, EARTH_C, {p:[0, SHORE_Y/2 + 0.2, 0]});
  var sk=hbMesh(skirt); sk.material=HB_MAT; g.add(sk);
  // shallow water hugging the shore, then the open sea
  var shal=new THREE.RingGeometry(ISLAND_R+SAND_W-0.4, ISLAND_R+SAND_W+4.2, 96, 1);
  shal.rotateX(-Math.PI/2);
  hbPaint(shal, SHALLOW_C, {p:[0, SHORE_Y+0.08, 0]});
  g.add(hbMesh(shal));
  var sea=new THREE.CircleGeometry(300, 72);
  sea.rotateX(-Math.PI/2);
  hbPaint(sea, SEA_C, {p:[0, SHORE_Y, 0]});
  g.add(hbMesh(sea));
  return g;
}

// ---------------------------------------------------- THE QUATERNIUS PIECES
// Fourteen models, each a .gltf with its own texture. They are LOADED, not
// baked into the vertex-colour recipe the rest of the farm uses, because the
// whole point of the kit is the painterly look it brings. Their materials are
// tinted toward the farm's palette so a Quaternius tree and a hand-built barn
// look like they belong on the same island.
var NAT={}, NAT_READY=false;
var NAT_PIECES=["CommonTree_1","CommonTree_3","CommonTree_5","Pine_1","Pine_3",
  "Bush_Common","Bush_Common_Flowers","Flower_3_Group","Flower_4_Group",
  "Grass_Common_Tall","Fern_1","Mushroom_Common","Rock_Medium_1","Rock_Medium_2"];
// The kit's own colours are left alone: a colour multiplies a texture, so any
// tint only darkens it, and the emissive lift above is what brings it into the
// farm's register instead. The ONE exception is the common bush, whose kit
// texture is autumn red and read as a dead shrub on a summer island.
var NAT_TINT=null;
// The kit's Bush_Common carries the twisted-tree texture, which is AUTUMN RED.
// Tinting it green multiplied red by green and produced a black blob on the
// grass; left alone it is a handsome red shrub, so it is used deliberately as
// an accent by the orchard rather than scattered at random.
var NAT_TINT_BY_PIECE={};

function natPrep(root, tint, windAmt){
  root.traverse(function(o){
    if(!o.isMesh) return;
    var mats=Array.isArray(o.material)?o.material:[o.material];
    mats.forEach(function(m){
      if(!m) return;
      // THE KIT EXPORTS METALLIC MATERIALS. Under this scene's two lights and
      // no environment map, metal has nothing to reflect, so the first render
      // of the island had a black orchard and black grass. Everything here is
      // a leaf or a rock: none of it is metal.
      // THE REAL REASON THE KIT CAME OUT DARK. GLTFLoader marks a base-colour
      // texture as sRGB and expects the renderer to gamma-encode on the way
      // out. This renderer does not: the whole farm is hand-built vertex
      // colour, authored and signed off in linear. So the kit's textures were
      // being decoded to linear and then never re-encoded, and every leaf and
      // every rock came out black. Turning the renderer's output encoding on
      // would fix the kit and change every colour Mike has already approved,
      // so the textures are put into the farm's space instead of the other way
      // round. This is why the rocks were black.
      if(m.map){ m.map.encoding = THREE.LinearEncoding; m.map.needsUpdate = true; }
      if("metalness" in m) m.metalness = 0.0;
      if("roughness" in m) m.roughness = 0.92;
      // AND THEY ARE STILL TOO DARK next to hand-built art that is lit flat and
      // bright. Rather than tinting the texture (which only ever makes it
      // darker, because a colour multiplies), the texture is fed back in as an
      // EMISSIVE map at low strength. That lifts the kit's own painterly
      // colours into the same register as the farm without washing them out.
      if(m.map && "emissive" in m){
        m.emissiveMap = m.map;
        // the lift has to carry the same tint, or a corrected colour comes
        // straight back in through the emissive channel — which is exactly
        // what put an autumn-red bush back on a summer island
        m.emissive = new THREE.Color(tint || 0xFFFFFF);
        m.emissiveMap.encoding = THREE.LinearEncoding;
        m.emissiveIntensity = 0.18;
      }
      if(tint) m.color = new THREE.Color(tint);
      // the kit's leaves are cut-out planes, so they need their alpha honoured
      // and both sides drawn or a tree is half missing from behind
      if(m.map){ m.transparent = false; m.alphaTest = 0.35; }
      m.side = THREE.DoubleSide;
      m.fog = true;
      if(windAmt!=null) windify(m, windAmt);
    });
    o.castShadow=false; o.receiveShadow=false;
  });
  return root;
}
// One piece, scaled so its longest side is `size` and standing on the ground.
function natGet(name, size, tint, windAmt){
  var src=NAT[name]; if(!src) return null;
  var o=src.clone(true);
  // clone() shares materials, which is what we want: one material per piece,
  // tinted once, so the whole orchard is a handful of draw calls.
  var box=new THREE.Box3().setFromObject(o);
  var span=Math.max(0.001, box.max.x-box.min.x, box.max.y-box.min.y, box.max.z-box.min.z);
  var k=(size||3)/span;
  var w=new THREE.Group();
  o.scale.setScalar(k);
  o.position.y = -box.min.y*k;
  w.add(o);
  return w;
}
function loadNature(done){
  var L; try{ L=new THREE.GLTFLoader(); }catch(e){ NAT_READY=false; done(); return; }
  var left=NAT_PIECES.length, any=false;
  if(!left){ done(); return; }
  NAT_PIECES.forEach(function(name){
    L.load("/models/nature/"+name+".gltf",
      function(gltf){
        try{
          var root=gltf.scene || (gltf.scenes&&gltf.scenes[0]);
          if(root){
            natPrep(root, NAT_TINT_BY_PIECE[name] || NAT_TINT,
              /Grass|Flower|Fern|Bush|Tree|Pine/.test(name) ? 0.045 : null);
            NAT[name]=root; any=true;
          }
        }catch(e){}
        if(--left===0){ NAT_READY=any; done(); }
      },
      null,
      function(){ if(--left===0){ NAT_READY=any; done(); } });
  });
}

// A LOT of grass, in one draw call. An InstancedMesh plus the wind shader is
// the only way to have a field of it that actually moves.
function grassCarpet(count){
  var src=NAT.Grass_Common_Tall; if(!src) return null;
  var geo=null, mat=null;
  src.traverse(function(o){ if(o.isMesh && !geo){ geo=o.geometry; mat=o.material; } });
  if(!geo) return null;
  var box=new THREE.Box3().setFromObject(src);
  var span=Math.max(0.001, box.max.y-box.min.y);
  var im=new THREE.InstancedMesh(geo, mat, count);
  var m=new THREE.Matrix4(), q=new THREE.Quaternion(), v=new THREE.Vector3(), sc=new THREE.Vector3();
  var placed=0, tries=0;
  while(placed<count && tries<count*8){
    tries++;
    var a=Math.random()*Math.PI*2, r=Math.sqrt(Math.random())*(ISLAND_R-2.5);
    var x=Math.cos(a)*r, z=Math.sin(a)*r;
    if(nearAnything(x,z,2.2)) continue;               // never inside the farm itself
    var s=(0.55+Math.random()*0.75)/span;
    q.setFromAxisAngle(new THREE.Vector3(0,1,0), Math.random()*Math.PI*2);
    v.set(x,0,z); sc.set(s,s*(0.8+Math.random()*0.5),s);
    m.compose(v,q,sc);
    im.setMatrixAt(placed++, m);
  }
  im.count=placed;
  im.instanceMatrix.needsUpdate=true;
  im.frustumCulled=false;
  return im;
}

scene.add(buildSky());
scene.add(buildIsland());
// the haze, tuned to the sky's own horizon so the far shore fades into it
scene.fog=new THREE.Fog(0xCFE9F2, 46, 165);
scene.background=new THREE.Color(0xBFE8F5);

// -------------------------------------------------------------------------
// The field: a 3x3 grid of dirt patches inside a wooden fence, on the +z
// half of the world (the "farm corner").
// -------------------------------------------------------------------------
var FIELD_CX=0, FIELD_CZ=2.0;   // FM6: the field sits directly south of the barn
var PATCH_R=1.4;     // patch radius (world units)
var PATCH_STEP=3.6;  // spacing centre-to-centre
var PATCHES=[];      // {mesh, x, z, ring, state, seed, plantedAt, sparkle}

function buildDirtDisc(){
  var parts=[];
  // dark top disc
  parts.push(hbTurn([[PATCH_R,0],[PATCH_R*0.95,0.06],[0,0.08]],0x6B4E2E,null,20));
  // rim - a slightly darker crumbly edge
  parts.push(hbTurn([[PATCH_R*1.02,-0.08],[PATCH_R*1.02,0.02],[PATCH_R*0.9,0.06]],0x513A20,null,20));
  return hbMesh(hbBake(parts));
}

// A dashed glow ring above an empty patch: THREE line dashes are not supported
// on plain lines without a shader, so we make it out of many small tube pieces
// arranged in a circle. Rotates gently. Reads as "tap me".
function buildDashRing(){
  var g=new THREE.Group();
  var seg=14, R=PATCH_R+0.18, tubeR=0.09, tubeH=0.42;
  for(var i=0;i<seg;i++){
    var a=(i/seg)*Math.PI*2;
    var t=hbPaint(new THREE.BoxGeometry(tubeH,0.05,tubeR*1.6),0xFFF7B0,{
      r:[0,-a,0], p:[Math.cos(a)*R, 0.08, Math.sin(a)*R]
    });
    g.add(hbMesh(t));
  }
  return g;
}

function buildFencePost(){
  var parts=[];
  parts.push(hbTube(0.14,0.14,1.15,0xE0D2A6,{p:[0,0.6,0]},8));
  parts.push(hbCone(0.20,0.22,0xC7B579,{p:[0,1.22,0]},8));
  return hbMesh(hbBake(parts));
}
function buildFenceRail(len){
  var g=hbBox(len,0.10,0.14,0xEDDDA8,null);
  return hbMesh(g);
}

// =========================================================================
//  FM4 — SOLID THINGS.
//
//  Mike's daughter walked straight through every fence on the farm, which
//  makes a pen a drawing rather than a place. So a small blocker list, and a
//  kid who SLIDES along what she touches: only the part of her step that goes
//  INTO a thing is taken away, so a fence guides her along it and she never
//  sticks or judders.
//
//  What is solid: the fence rails and their posts, the coop house, the crate,
//  and the parked plane. What is NOT, deliberately: the crops (walking through
//  them IS the harvest) and the animals (they are stepped around, as before).
//
//  Every fenced area has ONE opening with two taller gate posts on it, so a
//  child can see where the way in is without a word being written.
// =========================================================================
var KID_R=0.55;
var BLOCKERS=[];       // {t:"circle",x,z,r} or {t:"box",x,z,hx,hz}
var AREAS=[];          // the fenced areas, each with its one gate
var GATE_GAP=2.2;      // the doorway, in world units — about two kid-widths
var RAIL_T=0.11;       // half the thickness of a rail, for blocking

// FM6 — a blocker now remembers WHO PUT IT THERE. The second field row has to
// take the field's fence down and build a bigger one, and it must not disturb
// the coop's or the cow pen's while it does.
var BLOCKER_OWNER="";
function addCircleBlocker(x,z,r,tag){
  var B={t:"circle",x:x,z:z,r:r,tag:tag||"",own:BLOCKER_OWNER,on:true}; BLOCKERS.push(B); return B;
}
function addBoxBlocker(x,z,hx,hz,tag){
  var B={t:"box",x:x,z:z,hx:hx,hz:hz,tag:tag||"",own:BLOCKER_OWNER,on:true}; BLOCKERS.push(B); return B;
}
// Everything one owner put down, gone in one line.
function dropBlockersOwnedBy(own){
  var i;
  for(i=BLOCKERS.length-1;i>=0;i--) if(BLOCKERS[i].own===own) BLOCKERS.splice(i,1);
  for(i=AREAS.length-1;i>=0;i--) if(AREAS[i].own===own) AREAS.splice(i,1);
}

// How far INTO a blocker a point at (x,z) is, given a body radius. Negative
// (or zero) means clear. Also hands back the direction to push out along.
function pushOut(B,x,z,rad){
  var dx,dz,d,cx,cz;
  if(B.t==="circle"){
    dx=x-B.x; dz=z-B.z; d=Math.hypot(dx,dz);
    var want=B.r+rad;
    if(d>=want) return null;
    if(d<1e-4){ dx=1; dz=0; d=1; }
    return {nx:dx/d, nz:dz/d, depth:want-d};
  }
  cx=clamp(x,B.x-B.hx,B.x+B.hx); cz=clamp(z,B.z-B.hz,B.z+B.hz);
  dx=x-cx; dz=z-cz; d=Math.hypot(dx,dz);
  if(d>=rad){
    if(d>0) return null;
    // dead inside the box: push out through the nearest wall
    var ox=B.hx-Math.abs(x-B.x), oz=B.hz-Math.abs(z-B.z);
    if(ox<oz) return {nx:(x>=B.x?1:-1), nz:0, depth:ox+rad};
    return {nx:0, nz:(z>=B.z?1:-1), depth:oz+rad};
  }
  if(d<1e-4){
    var px=B.hx-Math.abs(x-B.x), pz=B.hz-Math.abs(z-B.z);
    if(px<pz) return {nx:(x>=B.x?1:-1), nz:0, depth:px+rad};
    return {nx:0, nz:(z>=B.z?1:-1), depth:pz+rad};
  }
  return {nx:dx/d, nz:dz/d, depth:rad-d};
}

function blockedAt(x,z,rad){
  for(var i=0;i<BLOCKERS.length;i++){
    if(!BLOCKERS[i].on) continue;
    if(pushOut(BLOCKERS[i],x,z,rad||0)) return true;
  }
  return false;
}

// Slide, don't stop. Two passes so an inside corner settles instead of
// bouncing between its two walls.
function slideClear(p, rad){
  var pass,i,r;
  for(pass=0;pass<3;pass++){
    var moved=false;
    for(i=0;i<BLOCKERS.length;i++){
      if(!BLOCKERS[i].on) continue;
      r=pushOut(BLOCKERS[i], p.x, p.z, rad);
      if(!r) continue;
      p.x+=r.nx*r.depth; p.z+=r.nz*r.depth; moved=true;
    }
    if(!moved) break;
  }
  return p;
}

// Is the straight line between two points clear? Used by tap-to-go to decide
// whether it needs to aim for a gate first.
function lineClear(x0,z0,x1,z1,rad){
  var d=Math.hypot(x1-x0,z1-z0), n=Math.max(1,Math.ceil(d/0.35)), i,u;
  for(i=0;i<=n;i++){ u=i/n;
    if(blockedAt(x0+(x1-x0)*u, z0+(z1-z0)*u, rad)) return false;
  }
  return true;
}

function inArea(A,x,z,inset){
  var m=inset||0;
  return x>A.cx-A.halfX+m && x<A.cx+A.halfX-m && z>A.cz-A.halfZ+m && z<A.cz+A.halfZ-m;
}
function areaContaining(x,z){
  for(var i=0;i<AREAS.length;i++) if(inArea(AREAS[i],x,z,0)) return AREAS[i];
  return null;
}

// The gate post: taller than a rail post and capped in a warmer colour, so the
// one gap in a fence reads as a DOORWAY and not as a bit of missing fence.
function buildGatePost(){
  var parts=[];
  parts.push(hbTube(0.17,0.17,1.80,0xE6D8AE,{p:[0,0.90,0]},8));
  parts.push(hbTube(0.21,0.21,0.14,0xC7B579,{p:[0,1.20,0]},8));
  parts.push(hbCone(0.27,0.36,0xC0894C,{p:[0,1.98,0]},8));
  return hbMesh(hbBake(parts));
}

// One rail run: the two rails FM1 draws, plus the blocker that makes them real.
function buildFenceRun(g,len,rotY,x,z){
  var a=buildFenceRail(len); a.rotation.y=rotY; a.position.set(x,0.55,z); g.add(a);
  var b=buildFenceRail(len); b.rotation.y=rotY; b.position.set(x,0.9,z); g.add(b);
  if(rotY) addBoxBlocker(x,z,RAIL_T,len/2,"fence");
  else     addBoxBlocker(x,z,len/2,RAIL_T,"fence");
}

// A fenced rectangle with exactly ONE gate. Used by the field, the coop yard
// and the cow pen, so all three read the same way.
function buildFenceRect(g,cx,cz,halfX,halfZ,gapSide){
  var xs=[-halfX,0,halfX], zs=[-halfZ,0,halfZ], i,j,post;
  for(i=0;i<3;i++) for(j=0;j<3;j++){
    if(i===1&&j===1) continue;                                  // never the middle
    if(gapSide==="W" && i===0 && j===1) continue;                // never in the doorway
    if(gapSide==="E" && i===2 && j===1) continue;
    if(gapSide==="S" && j===0 && i===1) continue;
    if(gapSide==="N" && j===2 && i===1) continue;
    post=buildFencePost(); post.position.set(cx+xs[i],0,cz+zs[j]); g.add(post);
    addCircleBlocker(cx+xs[i], cz+zs[j], 0.20, "post");
  }
  function gatePost(x,z){
    var p=buildGatePost(); p.position.set(x,0,z); g.add(p);
    addCircleBlocker(x,z,0.20,"gate");
  }
  function side(name,isX,fx,fz,half){
    if(name!==gapSide){ buildFenceRun(g, half*2, isX?0:Math.PI/2, fx, fz); return; }
    var seg=Math.max(0.5, half-GATE_GAP/2), off=half-seg/2;
    if(isX){
      buildFenceRun(g,seg,0,fx-off,fz); buildFenceRun(g,seg,0,fx+off,fz);
      gatePost(fx-GATE_GAP/2,fz); gatePost(fx+GATE_GAP/2,fz);
    } else {
      buildFenceRun(g,seg,Math.PI/2,fx,fz-off); buildFenceRun(g,seg,Math.PI/2,fx,fz+off);
      gatePost(fx,fz-GATE_GAP/2); gatePost(fx,fz+GATE_GAP/2);
    }
  }
  side("N", true,  cx, cz+halfZ, halfX);
  side("S", true,  cx, cz-halfZ, halfX);
  side("E", false, cx+halfX, cz, halfZ);
  side("W", false, cx-halfX, cz, halfZ);
  var gx = gapSide==="W" ? cx-halfX : (gapSide==="E" ? cx+halfX : cx);
  var gz = gapSide==="N" ? cz+halfZ : (gapSide==="S" ? cz-halfZ : cz);
  var ox = gapSide==="W" ? -1 : (gapSide==="E" ? 1 : 0);
  var oz = gapSide==="N" ? 1 : (gapSide==="S" ? -1 : 0);
  AREAS.push({cx:cx,cz:cz,halfX:halfX,halfZ:halfZ,side:gapSide,own:BLOCKER_OWNER,
              gate:{x:gx,z:gz}, out:{x:ox,z:oz}});
  return g;
}

// FM6 — THE SECOND FIELD ROW, the third present. The field is 3x3 to start
// with and grows a fourth row SOUTHWARD, so not one crop she already planted
// moves an inch when it arrives. The fence comes down and goes back up around
// the bigger field; the three patches she has in the ground carry on growing.
// =========================================================================
//  FM6 — THE FIELD GROWS 3x3 TO 5x5, AND THE NEW LAND ARRIVES UNDER STONES
//
//  All twenty-five slots exist from the first frame, but only the middle nine
//  are field. The present turns the outer sixteen into LAND SHE CAN SEE — each
//  one under a heap of pebbles or an old stump — and she clears them one at a
//  time by walking up to them, which is the same "walk at it and it happens"
//  every other thing on this farm does. Clearing pays a few coins. It never
//  costs her anything: being unable to afford your own field would be a
//  strange thing to teach a four-year-old.
//
//  THE MIDDLE NINE ARE BUILT FIRST, so patch index 0 to 8 never change and a
//  save written before any of this loads straight back in with no migration.
// =========================================================================
var FIELD_RING=0;                 // 0 = the starting 3x3, 1 = the full 5x5
var CLEAR_PAYS=3;                 // what tidying one away is worth
function fieldHalf(ring){ return ((ring+1)*PATCH_STEP)+PATCH_R+0.8; }
function fieldHalfZ(){ return fieldHalf(FIELD_RING); }
var FIELD_HALF_X=fieldHalf(0);    // kept as a var: nearAnything() reads it

function fieldSlots(){
  var out=[], i, j;
  for(j=-1;j<=1;j++) for(i=-1;i<=1;i++) out.push({i:i, j:j, tier:0});
  for(j=-2;j<=2;j++) for(i=-2;i<=2;i++)
    if(Math.abs(i)===2 || Math.abs(j)===2) out.push({i:i, j:j, tier:1});
  return out;
}

// A heap of stones, and an old stump. Two covers rather than one, so the outer
// ring does not read as sixteen copies of the same thing.
function buildPebbles(){
  var p=[], i;
  for(i=0;i<7;i++){
    var a=(i/7)*Math.PI*2 + i*0.7, r=0.28+((i%3)*0.22);
    p.push(hbBall(0.24+((i%4)*0.07), i%2?0x9E968A:0xB3AB9D,
      {s:[1,0.62,0.9], r:[0,a,0], p:[Math.cos(a)*r, 0.16+((i%3)*0.08), Math.sin(a)*r]}, 8));
  }
  var g=new THREE.Group(); g.add(hbMesh(hbBake(p)));
  return g;
}
function buildStump(){
  var p=[], i;
  p.push(hbTurn([[0.62,0],[0.58,0.30],[0.52,0.62],[0.54,0.70],[0.001,0.70]], 0x8C6237, null, 12));
  for(i=0;i<3;i++)
    p.push(hbTurn([[0.001,0],[0.36-i*0.11,0.01],[0.34-i*0.11,0.02],[0.001,0.03]],
      0xC0A377, {p:[0,0.71+i*0.005,0]}, 12));
  for(i=0;i<3;i++){
    var a=i*2.2;
    p.push(hbTube(0.14,0.10,0.52,0x7A5232,
      {r:[0.7,a,0], p:[Math.cos(a)*0.55, 0.22, Math.sin(a)*0.55]},7));
  }
  var g=new THREE.Group(); g.add(hbMesh(hbBake(p)));
  return g;
}

function putCover(P){
  if(P.cover || P.tier===0) return;
  P.kindOfCover = (P.slotIndex % 4 === 1) ? "stump" : "pebbles";
  P.cover = (P.kindOfCover==="stump") ? buildStump() : buildPebbles();
  P.cover.position.set(P.x, 0, P.z);
  P.cover.rotation.y = (P.slotIndex*1.7) % (Math.PI*2);
  scene.add(P.cover);
  P.mesh.visible=false; P.ring.visible=false;
}
// Walk up to it and it is gone. Silent on a save load, or a farm restored with
// eight of them still standing would go off like a fireworks box.
function clearCover(P, quiet){
  if(!P.cover) return false;
  scene.remove(P.cover); P.cover=null;
  P.mesh.visible=true; P.ring.visible=true;
  P.locked=false;
  if(!quiet){
    soilPuff(P.x, P.z);
    puff(P.x, 0.35, P.z, 0xC9C3B6, 8, 1.4, 1.3, 0.44);
    addCoins(CLEAR_PAYS);
    sfx("collect"); haptic("light");
  }
  return true;
}
function coversLeft(){
  var n=0; for(var i=0;i<PATCHES.length;i++) if(PATCHES[i].cover) n++;
  return n;
}

// The present. Idempotent, because it runs when the box is opened AND on every
// load of a save that already has it.
function unlockFieldRing(){
  if(FIELD_RING>=1 || !fieldGroup) return false;
  FIELD_RING=1;
  FIELD_HALF_X=fieldHalf(1);
  for(var i=0;i<PATCHES.length;i++) if(PATCHES[i].tier===1) putCover(PATCHES[i]);
  if(fieldFence) fieldGroup.remove(fieldFence);
  dropBlockersOwnedBy("field");
  fieldFence=fieldFenceFor(FIELD_RING);
  fieldGroup.add(fieldFence);
  return true;
}

var fieldGroup=null, fieldFence=null;

// The fence that fits however much field there is now.
function fieldFenceFor(ring){
  var g=new THREE.Group();
  BLOCKER_OWNER="field";
  buildFenceRect(g, FIELD_CX, FIELD_CZ, fieldHalf(ring), fieldHalf(ring), "W");
  BLOCKER_OWNER="";
  return g;
}

function buildFieldLegacy(){
  var group=new THREE.Group();
  var slots=fieldSlots(), k;
  for(k=0;k<slots.length;k++){
    var S=slots[k];
    var x=FIELD_CX + S.i*PATCH_STEP;
    var z=FIELD_CZ + S.j*PATCH_STEP;
    var patch=buildDirtDisc();
    patch.position.set(x,0.001,z);
    group.add(patch);
    var ring=buildDashRing();
    ring.position.set(x,0.001,z);
    group.add(ring);
    // the outer sixteen are not field yet — they are plain grass until the
    // present turns them into land under stones
    if(S.tier===1){ patch.visible=false; ring.visible=false; }
    PATCHES.push({
      mesh:patch, ring:ring,
      // NOTE: `ring` is the dashed ring MESH and always has been. The tier a
      // slot belongs to is `tier`, or the two would quietly overwrite each
      // other and every patch would lose its ring.
      x:x, z:z, tier:S.tier, slotIndex:k, locked:S.tier===1, cover:null,
      state:"empty",     // empty | growing | ready
      seed:null,          // "corn" | "carrot" | "wheat" | "pumpkin"
      plantedAt:0,
      crop:null,          // THREE.Group with the 3D crop when growing/ready
      sparkleT:0, chimed:false
    });
  }
  return group;
}
// The field the scene actually gets: three rows of patches and the fence that
// fits them, kept apart so the fence can be replaced when a row is added.
function buildField(){
  fieldGroup=buildFieldLegacy();
  fieldFence=fieldFenceFor(FIELD_RING);
  fieldGroup.add(fieldFence);
  return fieldGroup;
}
scene.add(buildField());

// draw the icon on the seed-picker button — per the FL5b law: one source of
// art, one recipe, so a 3D crop and its picture can never drift.
//
// Each recipe returns an object with:
//   parts(scale)   -> array of Geometry parts for the 3D model at given scale
//   svg(size)      -> a string of <svg>...</svg> for the picker button
//   colors         -> {main, accent, stem} used by both
// -------------------------------------------------------------------------
// =========================================================================
//  FM3 — THE COIN ECONOMY (Mike's call, 2026-09-06).
//
//  FM1 shipped prices 10/6/4 against harvest rewards 8/5/3, so growing a crop
//  visibly LOST coins. A child reads that as a punishment for doing the thing
//  the game just told them to do. The fix Mike picked is the simplest one:
//
//    CROPS ARE INGREDIENTS, NOT MONEY. Harvesting pays nothing at all.
//    A seed costs the same 3 coins whatever it is, so there is no sum to do.
//    The ONLY way to earn is filling the crate and sending the plane.
//
//  And the floor that makes it impossible to get stuck: if a kid cannot afford
//  a seed, the next seed is FREE. There is no state in this farm from which a
//  child cannot carry on playing.
// =========================================================================
// FM4 — Mike's numbers, taken from section 7 of the growth plan. A seed costs
// what its crop is worth, an order pays THREE TIMES what it asked for, so the
// walk out to the crate is always worth more than the seeds that started it.
// FM6 — the pumpkin is the first present, so it is the best thing in the
// field: it costs the most, it takes the longest (still under a minute), and
// it is worth the most when the crate asks for one. A seed still costs exactly
// what its crop is worth, which is the rule FM4 set.
var SEED_PRICES = { corn:4, carrot:3, wheat:2, pumpkin:10, strawberry:8, tomato:6, melon:12 };
// FM7 — what a thing is worth. A crop is worth what its seed cost, as FM4 set
// it. The four things a building or a pig MAKES are worth more than what went
// into them, because that is the whole reason to bother: two wheat (2+2) go
// into the mill and bread worth 14 comes out.
var ITEM_VALUES = { corn:4, carrot:3, wheat:2, egg:6, duckegg:7, milk:8, pumpkin:10,
  strawberry:8, tomato:6, melon:12,
  truffle:16, honey:13, bread:14, cheese:20 };

var SEED_PRICE = 2;           // the CHEAPEST seed — what the free-seed floor reads
var DUCK_PRICE = 120;         // about four deliveries
function seedPriceOf(kind){ return SEED_PRICES[kind]!=null ? SEED_PRICES[kind] : SEED_PRICE; }
function itemValueOf(kind){ return ITEM_VALUES[kind]!=null ? ITEM_VALUES[kind] : 3; }

// -------------------------------------------------------------------------
// THE STACK — the heart of the mode. No cap. Each item lerps toward its
// target above the kid's head. Whip-lag: each item follows a delayed sample
// of the kid's position, so the tall stack curves and sways as the kid
// turns. It NEVER falls: the highest item just stays visible above the head.
// -------------------------------------------------------------------------
var STACK_ITEM_H = 0.42;          // vertical spacing between stacked items
var STACK_LAG_PER = 0.055;        // seconds of delay added per item up the stack
var STACK_HISTORY = [];           // ring buffer of {t,x,z,yaw}
var STACK_HISTORY_MAX_SEC = 6;    // enough for a huge stack
var stack = [];                   // array of {kind, group, tOffset, phase}

// A stack item's model is the same recipe at stage=2 (ready), but a bit
// smaller so a tall stack still fits under the camera and reads clearly.
// FM2: eggs and milk ride the stack on exactly the same terms as a crop, so
// this reads through ITEM() rather than CROP_RECIPES directly.
function buildStackItem(kind){
  var r=ITEM(kind); if(!r) return null;
  var s=0.72;
  var geo=hbBake(r.parts(s));
  var m=hbMesh(geo);
  var wrap=new THREE.Group(); wrap.add(m);
  wrap.userData.kind=kind;
  wrap.userData.phase=Math.random()*Math.PI*2;
  return wrap;
}

// =========================================================================
//  FM4 — WHAT THE KID HAS ACTUALLY CARRIED.
//
//  Mike's daughter's very first crate asked for MILK, before a cow had been
//  fed, before a bottle existed. The order pool used to be "everything an
//  animal in the farm could ever give", which on second one is milk and eggs.
//  Now a kind earns its place in the pool by LANDING ON THE STACK once, and
//  pushOntoStack below is the only door into this set — harvest, produce
//  pickup and the QA lever all come through it, and a later phase's bread and
//  cheese will too without another line here.
//
//  Seeded with the three crops, because an empty patch is always there to
//  plant, so the FIRST order is always crops the kid can go and grow.
// =========================================================================
var COLLECT_KEY="bk_farm_collected";
var COLLECT_ORDER=["corn","carrot","wheat","pumpkin","strawberry","tomato","melon",
                   "egg","duckegg","milk","truffle","honey","bread","cheese"];
var COLLECTED={corn:1,carrot:1,wheat:1};
(function loadCollected(){
  try{
    var raw=localStorage.getItem(COLLECT_KEY);
    if(!raw) return;
    var got=JSON.parse(raw), i;
    if(got && got.length) for(i=0;i<got.length;i++){
      if(COLLECT_ORDER.indexOf(got[i])>=0) COLLECTED[got[i]]=1;
    }
  }catch(e){}
})();
function saveCollected(){
  try{
    var out=[], k;
    for(k in COLLECTED) if(COLLECTED[k]) out.push(k);
    localStorage.setItem(COLLECT_KEY, JSON.stringify(out));
  }catch(e){}
}
function markCollected(kind){
  if(!kind || COLLECTED[kind]) return;
  COLLECTED[kind]=1;
  saveCollected();
}

function pushOntoStack(kind, worldPos){
  var it=buildStackItem(kind); if(!it) return;
  // FM9 — she bends down for a thing she picked up herself. Something the dog
  // dropped, or a basket emptied from across the yard, is not her reaching.
  if(worldPos && Math.hypot(worldPos.x-kid.position.x, worldPos.z-kid.position.z) < 3.2) kidPick();
  markCollected(kind);
  // start where the crop is on the ground, so we can animate it bouncing UP.
  it.position.copy(worldPos);
  it.userData.hopFrom=worldPos.clone();
  it.userData.hopT=0;        // 0..1 animation for the initial bounce
  it.userData.tOffset = STACK_LAG_PER * stack.length;   // whip-lag amount
  it.userData.stackIndex = stack.length;
  scene.add(it);
  stack.push(it);
}

function sampleHistory(delaySec, now){
  // find the sample from ~delaySec ago; linear scan from newest backwards
  var i, t=now-delaySec;
  for(i=STACK_HISTORY.length-1;i>=0;i--){
    if(STACK_HISTORY[i].t<=t){
      var a=STACK_HISTORY[i], b=STACK_HISTORY[Math.min(i+1,STACK_HISTORY.length-1)];
      var span=Math.max(0.0001,b.t-a.t);
      var u=clamp((t-a.t)/span, 0, 1);
      return { x: lerp(a.x,b.x,u), z: lerp(a.z,b.z,u), yaw: lerp(a.yaw,b.yaw,u) };
    }
  }
  return STACK_HISTORY[0] || {x:kid.position.x, z:kid.position.z, yaw:kidState.facing};
}

function updateStack(dt, now){
  // record the kid's current position for whip-lag lookups
  STACK_HISTORY.push({t:now, x:kid.position.x, z:kid.position.z, yaw:kidState.facing});
  // prune old samples
  var cutoff=now-STACK_HISTORY_MAX_SEC;
  while(STACK_HISTORY.length>4 && STACK_HISTORY[0].t<cutoff) STACK_HISTORY.shift();

  var count = stack.length;
  for(var i=0;i<count;i++){
    var it=stack[i];
    // wobble scales with height. sqrt so a 20-item stack still reads.
    var heightScale = Math.sqrt(i+1) * 0.06;   // amplitude in world units
    var samp = sampleHistory(it.userData.tOffset, now);
    var targetY = kid.userData.headTopY + i*STACK_ITEM_H + STACK_ITEM_H*0.5;
    // sinusoidal sway on top of the whip-lag position
    var sway = Math.sin(now*2.2 + it.userData.phase) * heightScale * 0.6;
    var swayZ = Math.cos(now*1.7 + it.userData.phase*1.3) * heightScale * 0.5;
    var tx = samp.x + sway;
    var tz = samp.z + swayZ;

    if(it.userData.hopT < 1){
      // initial bounce from the ground onto the stack
      it.userData.hopT = Math.min(1, it.userData.hopT + dt*3.4);
      var u = it.userData.hopT;
      // ease: y goes ballistic then settles
      var arc = Math.sin(u*Math.PI) * 1.6;   // peak of the hop
      var yNow = lerp(it.userData.hopFrom.y+arc, targetY, u);
      var xNow = lerp(it.userData.hopFrom.x, tx, u);
      var zNow = lerp(it.userData.hopFrom.z, tz, u);
      it.position.set(xNow, yNow, zNow);
      it.rotation.y = kidState.facing + Math.sin(u*Math.PI*2)*0.4;
    } else {
      // settle — pull toward target every frame
      it.position.x = lerp(it.position.x, tx, 1 - Math.pow(0.001, dt));
      it.position.z = lerp(it.position.z, tz, 1 - Math.pow(0.001, dt));
      it.position.y = lerp(it.position.y, targetY, 1 - Math.pow(0.0006, dt));
      // slight rotation with the sway — reads like weight up there
      it.rotation.y = kidState.facing + Math.sin(now*1.5+it.userData.phase)*0.12;
      it.rotation.z = -sway * 0.35;   // lean opposite to the sway
      it.rotation.x = swayZ * 0.35;
    }
  }
}

// =========================================================================
//  FM2 — THE REAL MODEL (the chicken).
//
//  ONE THING MATTERS ABOVE ALL: these models carry no texture at all. Every
//  scrap of their colour lives in the COLOR_0 vertex attribute. The flying
//  engine's own mergeByMaterial() copies position, normal and uv, so merging
//  one that way gives a perfectly-shaped BLACK chicken. This merge carries
//  the colour through and still folds the model down to one draw call.
// =========================================================================
var ANM_URL="/models/skyflyer/animals/farm-animals.glb";
var ANM={}, ANM_ON=false, ANM_PENDING=[];

function anmMerge(root){
  root.updateMatrixWorld(true);
  var pos=[],nor=[],col=[],idx=[],base=0;
  var v=new THREE.Vector3(), nm=new THREE.Matrix3();
  root.traverse(function(o){
    var g=o.isMesh&&o.geometry; if(!g||!g.attributes.position) return;
    var pa=g.attributes.position, na=g.attributes.normal, ca=g.attributes.color, i, k;
    nm.getNormalMatrix(o.matrixWorld);
    for(i=0;i<pa.count;i++){
      v.fromBufferAttribute(pa,i).applyMatrix4(o.matrixWorld); pos.push(v.x,v.y,v.z);
      if(na){ v.fromBufferAttribute(na,i).applyMatrix3(nm).normalize(); nor.push(v.x,v.y,v.z); }
      else nor.push(0,1,0);
      // COLOR_0 verbatim. Drop this and every animal renders solid black.
      if(ca) col.push(ca.getX(i),ca.getY(i),ca.getZ(i)); else col.push(1,1,1);
    }
    if(g.index){ for(k=0;k<g.index.count;k++) idx.push(g.index.getX(k)+base); }
    else { for(k=0;k<pa.count;k++) idx.push(k+base); }
    base+=pa.count;
  });
  var out=new THREE.BufferGeometry();
  out.setAttribute("position",new THREE.Float32BufferAttribute(pos,3));
  out.setAttribute("normal",new THREE.Float32BufferAttribute(nor,3));
  out.setAttribute("color",new THREE.Float32BufferAttribute(col,3));
  out.setIndex(idx);
  return new THREE.Mesh(out,HB_MAT);
}
// SIZE BY THE LONGEST DIMENSION, never by height. A hen sitting low on a nest
// is barely taller than an egg; sizing on height makes every bird enormous.
function anmPrep(node){
  var g=new THREE.Group(); g.add(node); g.updateMatrixWorld(true);
  var flat; try{ flat=anmMerge(g); }catch(e){ flat=g; }
  var box=new THREE.Box3().setFromObject(flat);
  var h=Math.max(0.001, box.max.y-box.min.y);
  var span=Math.max(h, box.max.x-box.min.x, box.max.z-box.min.z);
  flat.position.x-=(box.min.x+box.max.x)/2;
  flat.position.z-=(box.min.z+box.max.z)/2;
  flat.position.y-=box.min.y;
  var wrap=new THREE.Group(); wrap.add(flat);
  wrap.userData.h=h; wrap.userData.span=span;
  return wrap;
}
function anmGet(name,size){
  var p=ANM[name]; if(!p) return null;
  var c=p.clone(true);
  c.scale.setScalar(size/p.userData.span);
  return c;
}
function loadFarmAnimals(done){
  if(!renderer || typeof THREE.GLTFLoader!=="function"){ done(false); return; }
  var loader; try{ loader=new THREE.GLTFLoader(); }catch(e){ done(false); return; }
  loader.load(ANM_URL,function(gl){
    gl.scene.children.slice().forEach(function(o){
      if(o.name) try{ ANM[o.name]=anmPrep(o); }catch(e){}
    });
    ANM_ON=!!ANM.Chicken;   // the hen is the gate; the duck rides in the same file
    done(ANM_ON);
  },null,function(){ done(false); });
}
