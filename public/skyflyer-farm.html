// FM3 — THE FLOOR THAT MAKES BEING STUCK IMPOSSIBLE. If a kid cannot afford a
// seed, the next seed is free. Nothing else in this farm has a fail state, and
// "you have no coins and nothing growing" would have been the only one.
function seedIsFree(kind){
  return walletBalance() < (kind ? seedPriceOf(kind) : SEED_PRICE);
}

function updateSeedAffordability(){
  if(!seedRowEl) return;
  var kids=seedRowEl.querySelectorAll(".seed");
  kids.forEach(function(el){
    var priceEl=el.querySelector(".price");
    if(priceEl) priceEl.classList.toggle("free", seedIsFree(el.dataset.kind));
    el.classList.remove("locked");     // never locked: it is affordable or it is free
  });
}

// FM8 — the ONE place a seed goes into the ground. Her tap and the tractor's
// whole-field run both come through here, so the cost, the sprout and the puff
// of soil can never drift apart between them.
// `freeFloor` is FM3's rule that a kid who cannot afford a seed gets one free,
// so being stuck is impossible. It belongs to HER TAP and to nothing else: the
// tractor is a seven-hundred-coin luxury, and letting it take the free seed
// twenty-five times over would hand a broke farm a whole free field.
function plantPatch(P, kind, freeFloor){
  var r=CROP_RECIPES[kind];
  if(!P || !r || P.state!=="empty" || P.cover || P.locked) return false;
  if(!(freeFloor && seedIsFree(kind)) && !spendCoins(r.price)) return false;
  sfx("select"); haptic("light");
  P.state="growing";
  P.seed=kind;
  P.plantedAt=performance.now()/1000;
  P.ring.visible=false;
  var sprout=buildCrop(kind,0);
  sprout.position.set(P.x, 0.06, P.z);
  P.crop=sprout;
  P.chimed=false;
  scene.add(sprout);
  // FM5 — a puff of soil, so the seed going in is something that HAPPENED.
  soilPuff(P.x, P.z);
  return true;
}
function tryPlant(kind){
  // FM8 — the same picker, asked from the tractor: one seed, the whole field.
  if(FIELD_MODE){
    if(!CROP_RECIPES[kind]) return;
    tapUnlock();
    startTractorRun(kind);
    closeSeedPicker();
    return;
  }
  if(!openPatch) return;
  if(!CROP_RECIPES[kind]) return;
  tapUnlock();
  if(!plantPatch(openPatch, kind, true)){ flashToast("Not enough coins"); sfx("hit"); return; }
  closeSeedPicker();
}

// -------------------------------------------------------------------------
// Coins + toasts
// -------------------------------------------------------------------------
// FM3 — GAP 2 CLOSED. FM1 kept a plain local coins number and a pill of its
// own, which is
// exactly what CARTRIDGE-CONTRACT.md says a cartridge may not do: the SHELL
// owns the wallet, there is ONE balance per kid, and a game only announces
// against it. buildable-wallet.js works out its own role — inside the shell it
// is an announcer that posts deltas up and caches what comes back down; opened
// on its own it owns the number itself — so this same code is right both ways.
var BW = window.BuildableWallet || null;
var coinsEl=document.getElementById("coins");
var toastEl=document.getElementById("toast");
var hintEl=document.getElementById("hint");
var hintHidden=false;

// A tiny local mirror, so a page with no wallet script (headless QA, a cold
// offline load) still has a number to show rather than throwing.
var localCoins = 50;
function walletBalance(){
  if(BW){ try{ return BW.balance(); }catch(e){} }
  return localCoins;
}
function paintCoins(){
  var v=walletBalance();
  if(coinsEl) coinsEl.textContent=v;
  updateSeedAffordability();
  updateShopButton();
}
function addCoins(n){
  n=Math.round(n||0);
  if(n>0){ if(BW){ try{ BW.add(n); }catch(e){} } else localCoins+=n; }
  else if(n<0){ spendCoins(-n); return; }
  paintCoins();
}
function spendCoins(n){
  n=Math.round(n||0); if(n<=0) return true;
  var ok;
  if(BW){ try{ ok=BW.spend(n); }catch(e){ ok=false; } }
  else { ok = localCoins>=n; if(ok) localCoins-=n; }
  paintCoins();
  return !!ok;
}
// FM1's fifty starting coins survive the move to the shared wallet, but as a
// ONE-TIME grant rather than a hardcoded balance: awardOnce is exactly the
// mechanism the contract already has for "credit this, and only ever once".
// A kid arriving with coins from another game keeps them and gets the fifty on
// top; a kid coming back to the farm is not paid twice.
function grantSeedMoney(){
  if(BW){ try{ BW.awardOnce("farm:seedmoney", 50); }catch(e){} }
  paintCoins();
}

// The shell broadcasts the real balance down whenever it changes, and the
// wallet re-fires it here as a plain event. Repaint on it or the pill drifts
// away from the truth the moment coins are earned in another game.
try{ addEventListener("bk-wallet", paintCoins); }catch(e){}
grantSeedMoney();
paintCoins();

// ============ FM3 — GAP 4 CLOSED: sound, through the shared Feel Kit ============
// GAME-FEEL law 6: a game triggers PALETTE NAMES, never a raw tone. These names
// resolve to Sky Flyer's own created ElevenLabs one-shots (api/sfx.js), because
// the farm is the same cartridge as the flying engine and shares its voice.
var FEEL = window.BuildableFeel || null;
var BA   = window.BuildableAudio || null;
var SFX_MAP = {
  select:  "sky_coin",       // a tap, a small yes
  coin:    "sky_coin",
  collect: "sky_coinrun",    // a whole burst of coins at once
  pickup:  "sky_pickup",     // one thing hopping onto the stack
  deliver: "sky_deliver",    // ONE item landing in the crate (the unload note)
  mission: "sky_mission",    // the order is full
  whoosh:  "sky_takeoff",
  land:    "sky_land",
  levelup: "sky_bank",
  sparkle: "sky_bank",
  hit:     "sky_bump",       // the soft "not that one" — never a buzzer
  pop:     "sky_bump",
  win:     "sky_win",
  celebrate:"sky_win"
};
// The single shared mute flag. bk_muted is read by buildable-audio itself, so
// the farm never keeps a second idea of whether sound is on.
function soundOn(){ try{ return !(BA && BA.muted); }catch(e){ return true; } }
function sfx(name,opt){ if(!soundOn()) return; try{ if(FEEL) FEEL.sfx(name,opt); else if(BA) BA.sfx(name,opt); }catch(e){} }
function haptic(kind){ if(!soundOn()) return; try{ if(FEEL&&FEEL.haptic) FEEL.haptic(kind); }catch(e){} }
try{ if(FEEL&&FEEL.configure) FEEL.configure({accent:"#8ED08A", feel:{pace:"chill",celebration:"big",haptics:"on"}, sfxMap:SFX_MAP});
     else if(BA&&BA.configure) BA.configure({map:SFX_MAP}); }catch(e){}
// Audio only ever wakes on the first tap INSIDE this page — a browser will not
// start it any other way, and a farm that is silent until the kid happens to
// hit the right control is a bug report waiting to happen.
var audioWoken=false;
function tapUnlock(){
  if(audioWoken) return; audioWoken=true;
  try{ if(BA&&BA.unlock) BA.unlock(); }catch(e){}
}
try{
  ["pointerdown","touchstart","keydown"].forEach(function(ev){
    addEventListener(ev, tapUnlock, {once:false, passive:true});
  });
}catch(e){}

// ============ FM3 — GAP 3 CLOSED: the shared nav bridge ============
// Without this the page has no Home pill of its own AND, on iPhone, a touch on
// the SHELL'S Home button routes into this page and does nothing at all. That
// is precisely the Tennis bug, and the farm had it.
try{
  if(window.BuildableGameNav){
    window.BuildableGameNav.register({
      hide:["helpBtn"],                 // the farm teaches itself; there is no help screen
      onSound:function(){ try{ if(BA&&BA.toggleMute) BA.toggleMute(); }catch(e){} },
      soundOn:soundOn,
      inGame:function(){ return true; }
    });
  }
}catch(e){}
// The shell may pause us (a quiz gate, a parent interruption, a tab switch).
// Every game MUST honour it — CARTRIDGE-CONTRACT.md.
var PAUSED=false;
addEventListener("message",function(ev){
  var d=ev&&ev.data;
  var kind=(typeof d==="string")?d:(d&&(d.type||d.kind));
  if(kind==="pause") PAUSED=true;
  else if(kind==="resume"){ PAUSED=false; last=performance.now()/1000; }
});
function flashToast(text){
  toastEl.textContent=text;
  toastEl.classList.remove("show");
  // reflow to restart animation
  void toastEl.offsetWidth;
  toastEl.classList.add("show");
}
function hideHint(){ if(!hintHidden){ hintHidden=true; hintEl.style.opacity=0; }}

// -------------------------------------------------------------------------
// INPUT — a touch joystick + tap-to-plant on empty patches
// -------------------------------------------------------------------------
var stickEl=document.getElementById("stick");
var stickNub=stickEl.querySelector(".nub");
var stickCenter={x:0,y:0}, stickActive=false, stickVec={x:0,y:0};

function stickReset(){
  stickActive=false; stickVec.x=0; stickVec.y=0;
  stickNub.style.transform="translate(-50%,-50%)";
}
function stickMove(clientX,clientY){
  var r=stickEl.getBoundingClientRect();
  var cx=r.left+r.width/2, cy=r.top+r.height/2;
  var dx=clientX-cx, dy=clientY-cy, R=r.width/2 - 12;
  var d=Math.hypot(dx,dy);
  if(d>R){ dx=dx*R/d; dy=dy*R/d; }
  stickVec.x=dx/R; stickVec.y=dy/R;
  stickNub.style.transform="translate(calc(-50% + "+dx+"px),calc(-50% + "+dy+"px))";
}
stickEl.addEventListener("pointerdown",function(e){
  stickActive=true; stickEl.setPointerCapture(e.pointerId); stickMove(e.clientX,e.clientY);
  // THE STICK ALWAYS WINS. Touching it drops any walk the kid was on, so a
  // child can always take back the wheel mid-journey.
  clearWalkTo();
  hideHint(); e.preventDefault();
});
stickEl.addEventListener("pointermove",function(e){ if(!stickActive) return; stickMove(e.clientX,e.clientY); });
stickEl.addEventListener("pointerup",function(e){ stickReset(); });
stickEl.addEventListener("pointercancel",function(e){ stickReset(); });

// Raycast tap for patches. Fires only if we didn't drag much.
var ray=new THREE.Raycaster();
var _mouse=new THREE.Vector2();
var canvas=renderer.domElement;
var downXY=null, downAt=0;

// FM7 — a HOLD is a thing now too. A tap is still a tap and everything FM4
// built on it is untouched; keeping a finger down on a growing crop, once she
// has the can, makes it rain on that crop for exactly as long as she holds.
canvas.addEventListener("pointerdown",function(e){
  if(seedCardEl.classList.contains("up")) return;
  downXY={x:e.clientX,y:e.clientY}; downAt=performance.now();
  var P=growingPatchAt(e.clientX,e.clientY);
  if(P && CAN_OWNED) startWatering(P);
});
canvas.addEventListener("pointerup",function(e){
  stopWatering();
  if(!downXY) return;
  var dx=e.clientX-downXY.x, dy=e.clientY-downXY.y, t=performance.now()-downAt;
  downXY=null;
  if(Math.hypot(dx,dy)>10 || t>380) return;   // it was a drag, or it was a hold
  handleTap(e.clientX,e.clientY);
});
canvas.addEventListener("pointercancel",function(){ stopWatering(); downXY=null; });
canvas.addEventListener("pointerleave",function(){ stopWatering(); });
canvas.addEventListener("pointermove",function(e){
  // while she is holding a thing to put down, the ghost follows her finger
  if(!placing) return;
  var g=groundAt(e.clientX,e.clientY);
  if(g) moveGhost(g.x,g.z);
});
// =========================================================================
//  FM4 — TAP TO GO. Mike's call: on a tablet this is the MAIN way to move,
//  and the joystick stays as the backup that always wins.
//
//  Tap open ground and the kid walks there. Tap a ready crop, a loose egg or
//  bottle, an animal or the crate and she walks to it — and the behaviour
//  that was already there fires on arrival, because every one of those is a
//  proximity check in the main loop and nothing about them changed. Tapping
//  an empty patch still opens the seed pop-up, exactly as before.
//
//  No new button, no new panel, nothing to read.
// =========================================================================
var walkTo=null;                 // {legs:[{x,z}], stopR, what, stuck, lastD}
var tapRing=null, tapRingFade=0;

function showTapRing(x,z){
  if(!tapRing){
    var geo=new THREE.TorusGeometry(0.74,0.075,8,26);
    geo.rotateX(Math.PI/2);
    tapRing=new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
      color:0xFFF3B8, transparent:true, opacity:0.85, depthWrite:false }));
    scene.add(tapRing);
  }
  tapRing.position.set(x,0.06,z);
  tapRing.visible=true; tapRing.scale.setScalar(1.35); tapRingFade=1;
}
// The ring FADES AS SHE ARRIVES — it is a "going there", not a marker left on
// the ground, so it can never be mistaken for something to collect.
function updateTapRing(dt){
  if(!tapRing || !tapRing.visible) return;
  tapRing.rotation.y += dt*1.1;
  tapRing.scale.setScalar(lerp(tapRing.scale.x, 1, 0.18));
  var o;
  if(walkTo){
    var d=Math.hypot(tapRing.position.x-kid.position.x, tapRing.position.z-kid.position.z);
    o=clamp(d/3.2,0,1)*0.85;
  } else {
    tapRingFade=Math.max(0, tapRingFade-dt*3.4);
    o=tapRingFade*0.85;
  }
  tapRing.material.opacity=o;
  if(o<=0.012) tapRing.visible=false;
}
function clearWalkTo(){ walkTo=null; }

// A fenced area has ONE gate, so the path in or out is never a search: aim for
// the gate, then aim for the thing. Two legs is the whole pathfinder, and on
// this map that is all it takes.
function gateLegs(A, entering){
  var inx=A.gate.x - A.out.x*1.05, inz=A.gate.z - A.out.z*1.05;
  var outx=A.gate.x + A.out.x*1.45, outz=A.gate.z + A.out.z*1.45;
  return entering ? [{x:outx,z:outz},{x:inx,z:inz}] : [{x:inx,z:inz},{x:outx,z:outz}];
}
// FM6 — GOING ROUND SOMETHING SHE IS NOT GOING INTO. FM4's pathfinder had two
// legs: out of the pen she is in, in through the gate of the pen she wants.
// That was enough while nothing stood between them. The island puts the field
// squarely between the west side and the animals, so a tap on the cow used to
// send her walking straight into the field's fence to slide along it. If the
// way between two legs crosses a fenced area she is neither in nor going to,
// this puts ONE waypoint at the best corner of it and she walks round.
function detourCorner(ax, az, bx, bz){
  var m=KID_R+1.1, i, A, best=null, bestD=1e9;
  for(i=0;i<AREAS.length;i++){
    A=AREAS[i];
    if(inArea(A,ax,az,0) || inArea(A,bx,bz,0)) continue;
    if(lineClear(ax,az,bx,bz,KID_R)) continue;      // nothing in the way at all
    var xs=[A.cx-A.halfX-m, A.cx+A.halfX+m], zs=[A.cz-A.halfZ-m, A.cz+A.halfZ+m], j,k;
    for(j=0;j<2;j++) for(k=0;k<2;k++){
      var cx=xs[j], cz=zs[k];
      if(blockedAt(cx,cz,KID_R)) continue;
      if(!lineClear(ax,az,cx,cz,KID_R)) continue;
      if(!lineClear(cx,cz,bx,bz,KID_R)) continue;
      var d=Math.hypot(cx-ax,cz-az)+Math.hypot(bx-cx,bz-cz);
      if(d<bestD){ bestD=d; best={x:cx,z:cz}; }
    }
  }
  return best;
}
function planWalk(tx,tz){
  var legs=[], aK=areaContaining(kid.position.x, kid.position.z), aT=areaContaining(tx,tz);
  if(aK && aK!==aT) legs=legs.concat(gateLegs(aK,false));
  if(aT && aT!==aK) legs=legs.concat(gateLegs(aT,true));
  legs.push({x:tx,z:tz});
  // walk the legs and slip a way-round in wherever one is needed
  var out=[], px=kid.position.x, pz=kid.position.z, i;
  for(i=0;i<legs.length;i++){
    var d=detourCorner(px,pz,legs[i].x,legs[i].z);
    if(d) out.push(d);
    out.push(legs[i]);
    px=legs[i].x; pz=legs[i].z;
  }
  return out;
}
function startWalkTo(x,z,stopR,what){
  walkTo={ legs:planWalk(x,z), stopR:(stopR==null?0.35:stopR),
           what:what||"ground", stuck:0, lastD:null };
  showTapRing(x,z);
}
// Returns the move direction for this frame, and retires legs as they land.
function stepWalkTo(dt){
  var guard=0;
  while(walkTo && guard++<4){
    var leg=walkTo.legs[0];
    var dx=leg.x-kid.position.x, dz=leg.z-kid.position.z, d=Math.hypot(dx,dz);
    var stop=(walkTo.legs.length>1)?0.6:walkTo.stopR;
    if(d<=stop){
      walkTo.legs.shift();
      if(!walkTo.legs.length){ clearWalkTo(); return {x:0,z:0}; }
      walkTo.stuck=0; walkTo.lastD=null;
      continue;
    }
    // Wedged against something we cannot get round? Give up quietly rather
    // than grinding into a fence forever. Nothing is ever stuck in this farm.
    if(walkTo.lastD!=null && walkTo.lastD-d < 0.004) walkTo.stuck+=dt; else walkTo.stuck=0;
    walkTo.lastD=d;
    if(walkTo.stuck>1.2){ clearWalkTo(); return {x:0,z:0}; }
    var k=Math.min(1, d/0.7);      // ease down at the end so she does not skate past
    return {x:dx/d*k, z:dz/d*k};
  }
  return {x:0,z:0};
}

// What did that tap MEAN? The nearest interesting thing under the finger wins;
// with nothing there, it means "walk here".
function pickTapTarget(hx,hz){
  var cands=[], i, d, A, P;
  // FM6 — a heap of stones is a thing to walk to, like a crop or an egg
  for(i=0;i<PATCHES.length;i++){
    P=PATCHES[i]; if(!P.cover) continue;
    d=Math.hypot(hx-P.x, hz-P.z);
    if(d<PATCH_R*1.5) cands.push({d:d, x:P.x, z:P.z, stopR:PICKUP_R*0.8, what:"cover"});
  }
  d=Math.hypot(hx-CRATE.x, hz-CRATE.z);
  if(d<CRATE_R+0.9) cands.push({d:d, x:CRATE.x, z:CRATE.z, stopR:2.55, what:"crate"});
  for(i=0;i<ANIMALS.length;i++){
    A=ANIMALS[i];
    d=Math.hypot(hx-A.x, hz-A.z);
    if(d<2.1) cands.push({d:d, x:A.x, z:A.z, stopR:FEED_R*0.7, what:"animal"});
    if(A.produce){
      d=Math.hypot(hx-A.produceX, hz-A.produceZ);
      if(d<2.1) cands.push({d:d, x:A.produceX, z:A.produceZ, stopR:PICKUP_R*0.55, what:"produce"});
    }
  }
  for(i=0;i<PATCHES.length;i++){
    P=PATCHES[i]; if(P.state==="empty") continue;
    d=Math.hypot(hx-P.x, hz-P.z);
    if(d<PATCH_R*1.4)
      cands.push({d:d, x:P.x, z:P.z,
        stopR:(P.state==="ready"?PICKUP_R*0.55:PATCH_R*0.6), what:P.state});
  }
  if(!cands.length) return {x:hx, z:hz, stopR:0.35, what:"ground"};
  cands.sort(function(a,b){ return a.d-b.d; });
  return cands[0];
}

// Where on the ground is this pixel? Pulled out of handleTap so the watering
// hold, the naming tap and the decoration ghost can all ask the same question.
function groundAt(px,py){
  _mouse.x=(px/W)*2-1; _mouse.y=-(py/H)*2+1;
  ray.setFromCamera(_mouse,camera);
  var dir=ray.ray.direction, org=ray.ray.origin;
  if(Math.abs(dir.y)<1e-6) return null;
  var t=-org.y/dir.y; if(t<0) return null;
  return {x:org.x+dir.x*t, z:org.z+dir.z*t};
}
function growingPatchAt(px,py){
  var g=groundAt(px,py); if(!g) return null;
  var best=null, bestD=PATCH_R*1.5, i, P, d;
  for(i=0;i<PATCHES.length;i++){
    P=PATCHES[i]; if(P.state!=="growing") continue;
    d=Math.hypot(g.x-P.x, g.z-P.z);
    if(d<bestD){ best=P; bestD=d; }
  }
  return best;
}
function animalAt(px,py){
  var g=groundAt(px,py); if(!g) return null;
  var best=null, bestD=2.4, i, A, d;
  for(i=0;i<ANIMALS.length;i++){
    A=ANIMALS[i];
    d=Math.hypot(g.x-A.x, g.z-A.z);
    if(d<bestD){ best=A; bestD=d; }
  }
  return best;
}

function handleTap(x,y){
  _mouse.x=(x/W)*2 - 1;
  _mouse.y=-(y/H)*2 + 1;
  ray.setFromCamera(_mouse,camera);
  // We want the point where the ray hits Y=0 (the ground plane)
  var dir=ray.ray.direction, org=ray.ray.origin;
  if(Math.abs(dir.y)<1e-4) return;
  var t=-org.y/dir.y; if(t<0) return;
  var hx=org.x+dir.x*t, hz=org.z+dir.z*t;
  // find the nearest empty patch within reach — still the seed pop-up
  // FM7 — if she is holding something to put down, this tap puts it there
  if(placing && tapWhilePlacing(hx,hz)) return;
  // FM7 — and tapping an animal she is ALREADY standing next to asks what it
  // is called. Tapping one across the farm still just walks her to it, so
  // nothing FM4 taught her has changed.
  var nearA=animalAt(x,y);
  if(nearA && Math.hypot(kid.position.x-nearA.x, kid.position.z-nearA.z) < FEED_R*1.25){
    tapUnlock(); openNamePicker(nearA); return;
  }
  var best=null, bestD=PATCH_R*1.4;
  for(var i=0;i<PATCHES.length;i++){
    var P=PATCHES[i]; if(P.state!=="empty" || P.locked || P.cover) continue;
    var d=Math.hypot(hx-P.x, hz-P.z);
    if(d<bestD){ best=P; bestD=d; }
  }
  if(best){ hideHint(); openSeedPicker(best); return; }
  hideHint();
  var T=pickTapTarget(hx,hz);
  startWalkTo(T.x, T.z, T.stopR, T.what);
}

// FM5 — the ONE place a growing patch becomes a ready one, so the main loop
// and the never-idle fixer can never disagree about what ready looks like.
// The wobble was already here; the chime is new, and it fires once, the moment
// the crop becomes takeable, and never again.
function makeReady(P){
  if(P.state==="ready") return;
  var r=CROP_RECIPES[P.seed]; if(!r) return;
  if(!P.crop || P.crop.userData.stage!==2){
    if(P.crop) scene.remove(P.crop);
    P.crop=buildCrop(P.seed,2);
    P.crop.position.set(P.x,0.06,P.z);
    scene.add(P.crop);
  }
  P.state="ready";
  P.sparkleT=0;                        // FM6: how long it has sat there, for the dog
  if(!P.chimed){ P.chimed=true; sfx("sparkle"); sparklePuff(P.x,0.95,P.z,8); }
}

// -------------------------------------------------------------------------
// MAIN LOOP — growth, harvest collision, walk, camera follow, draw
// -------------------------------------------------------------------------
var WIDE=false;
var last=performance.now()/1000;
var speed=6.4;   // world units per second
function step(){
  var now=performance.now()/1000, dt=Math.min(0.05, now-last); last=now;

  // The shell may freeze us (a quiz gate, a parent interruption, a tab switch).
  // Freeze means freeze: the clock is still read so nothing lurches on resume.
  if(PAUSED){
    if(!NODRAW) renderer.render(scene,camera);
    requestAnimationFrame(step);
    return;
  }

  // FM2 — the model stand takes the whole frame: no kid, no farm, no camera
  // follow, just the exhibits turning under a fixed camera.
  if(ZOO_ON){
    stepZoo(dt);
    stepPuppets(now);
    if(!NODRAW) renderer.render(scene,camera);
    requestAnimationFrame(step);
    return;
  }

  // walk from joystick vector. Y axis on screen is Z axis in world (into
  // screen is -Z), so up on the stick moves you forward.
  var mv=stickVec, mag=Math.hypot(mv.x,mv.y);
  var mx=0, mz=0;
  if(mag>0.08){ mx=mv.x; mz=mv.y; clearWalkTo(); }
  else if(walkTo){ var wv=stepWalkTo(dt); mx=wv.x; mz=wv.z; }
  kidState.moving = Math.hypot(mx,mz) > 0.02;
  if(kidState.moving){
    // Screen-relative move against camera facing (camera looks down -Z).
    kid.position.x += mx * speed * dt;
    kid.position.z += mz * speed * dt;
    kidState.facing = Math.atan2(mx, mz);   // face where we're going (radians)
    kid.rotation.y = kidState.facing + Math.PI;   // model's front faces +Z
    kidState.walkT += dt*speed*1.4;
    // walk-cycle: legs swing
    var ang = Math.sin(kidState.walkT) * 0.55;
    kid.userData.legL.rotation.x = ang;
    kid.userData.legR.rotation.x = -ang;
    // body bob
    kid.userData.body.position.y = Math.abs(Math.sin(kidState.walkT))*0.08;
  } else {
    kid.userData.legL.rotation.x *= 0.85;
    kid.userData.legR.rotation.x *= 0.85;
    kid.userData.body.position.y *= 0.85;
  }
  // FM9 — and when the real model is up, the clips do the walking instead.
  updateKidModel(dt, kidState.moving);
  // FM6 — she stays ON THE ISLAND. Not a fence and not a wall: she simply
  // cannot walk out onto the water, and the edge is a shape she can see.
  var edge=Math.hypot(kid.position.x, kid.position.z), lim=ISLAND_R-2.2;
  if(edge>lim){
    kid.position.x *= lim/edge;
    kid.position.z *= lim/edge;
  }
  // FM4 — and now the solid things push back, by taking away only the part of
  // the step that went INTO them. That is what makes a fence something you
  // slide along instead of something you stick to.
  slideClear(kid.position, KID_R);
  kidState.pos.set(kid.position.x, 0, kid.position.z);
  updateTapRing(dt);

  // FM6 — the picture lever: hold the camera off the island and look at the
  // whole of it, so a layout can be judged in one shot.
  if(WIDE){
    camera.position.set(0, 74, 60);
    camera.lookAt(0, 0, 4);
    if(!NODRAW) renderer.render(scene,camera);
    requestAnimationFrame(step);
    return;
  }
  // camera follows the kid, offset overhead 3/4
  var camTargetX = kid.position.x;
  var camTargetZ = kid.position.z + 22;
  camera.position.x = lerp(camera.position.x, camTargetX, 1 - Math.pow(0.001, dt));
  camera.position.z = lerp(camera.position.z, camTargetZ, 1 - Math.pow(0.001, dt));
  camera.position.y = 22 + Math.min(6, stack.length*0.28);  // pull back a bit as stack grows
  camera.lookAt(kid.position.x, 1.0 + Math.min(5, stack.length*0.22), kid.position.z);

  // growth + wobble/sparkle for ready + harvest collision
  for(var i=0;i<PATCHES.length;i++){
    var P=PATCHES[i];
    // FM6 — land under stones. Walk up to it and it is cleared, which is the
    // same "walk at it and it happens" everything else on this farm does.
    if(P.cover){
      P.cover.rotation.y += dt*0.22;
      if(Math.hypot(kid.position.x-P.x, kid.position.z-P.z) < PICKUP_R) clearCover(P);
      continue;
    }
    if(P.locked) continue;              // not field yet, and not anything else
    // rotate empty rings gently so the "tap me" affordance reads
    if(P.state==="empty"){
      P.ring.rotation.y += dt*0.6;
      // pulse the ring's brightness by tilting its scale
      var s=1+Math.sin(now*2.4+i*0.7)*0.04;
      P.ring.scale.set(s,1,s);
      continue;
    }
    if(P.state==="growing"){
      var r=CROP_RECIPES[P.seed]; if(!r) continue;
      var age=now-P.plantedAt, u=clamp(age/r.growSec, 0, 1);
      // stage 0 -> 1 at 40%, 1 -> 2 at 100%
      var wantStage = u<0.4 ? 0 : (u<1 ? 1 : 2);
      if(!P.crop || P.crop.userData.stage !== wantStage){
        if(P.crop){ scene.remove(P.crop); }
        var c=buildCrop(P.seed, wantStage);
        c.position.set(P.x, 0.06, P.z);
        P.crop=c;
        scene.add(c);
      }
      // sub-stage jiggle so the crop always looks alive
      P.crop.rotation.y = Math.sin(now*1.3+i*0.4)*0.06;
      if(wantStage===2) makeReady(P);
      continue;
    }
    if(P.state==="ready"){
      // WOBBLE + SPARKLE — invite the walk-through
      P.sparkleT += dt;
      var wob = Math.sin(now*4.4+i*0.9);
      P.crop.rotation.z = wob*0.10;
      P.crop.rotation.x = Math.cos(now*3.7+i*1.1)*0.08;
      var bob = 0.06 + Math.max(0,wob)*0.06;
      P.crop.position.y = 0.06 + bob;
      // sparkle: temporary spinning halo tube added once
      if(!P.halo){
        var halo=hbPaint(new THREE.TorusGeometry(PATCH_R*0.9, 0.05, 6, 20), 0xFFF6A8, {r:[Math.PI/2,0,0]});
        var mh=new THREE.Mesh(halo, new THREE.MeshBasicMaterial({color:0xFFF6A8, transparent:true, opacity:0.65}));
        mh.position.set(P.x, 0.10, P.z);
        scene.add(mh); P.halo=mh;
      }
      P.halo.rotation.z += dt*2.2;
      P.halo.material.opacity = 0.35 + 0.35*Math.abs(Math.sin(now*3+i));

      // harvest? kid within pickup radius of this patch
      // FM4: the same radius the produce uses. A ready crop is harvested by
      // walking NEAR it, not by standing on the exact spot.
      var kd=Math.hypot(kid.position.x-P.x, kid.position.z-P.z);
      if(kd < PICKUP_R){
        // FM3: NO COINS HERE. A crop is an ingredient, not money — the coins
        // all come from the crate and the plane. What harvesting gives is the
        // hop onto the stack, which is the thing a kid is actually playing for.
        sfx("pickup"); haptic("light");
        pushOntoStack(P.seed, new THREE.Vector3(P.x, 0.9, P.z));
        // clear the patch back to empty
        scene.remove(P.crop); P.crop=null;
        if(P.halo){ scene.remove(P.halo); P.halo=null; }
        P.state="empty"; P.seed=null; P.ring.visible=true; P.chimed=false;
      }
    }
  }

  // stack update
  updateStack(dt, now);

  // FM2 — the animals, the items in the air, and the boneless walk cycles
  updateAnimals(dt, now);
  updateFlying(dt, now);
  stepPuppets(now);

  // FM3 — the crate takes the stack, and the plane takes the order away
  updateCrate(dt);
  updateCrateWant(dt, now);
  updatePlane(dt);

  // FM6 — the wind, and the barn doors that open the shop
  WIND.time.value = now;
  atTheBarn(dt);

  // FM7 — the well hands over the can, the sails turn, the bees go round, the
  // rain falls while she holds, and every animal wears the name she gave it
  atTheWell();
  updateBuilt(dt, now);
  updateWatering(dt, now);
  updateMarks(dt, now);

  // FM5 — the puffs, the welcome-back basket, the present reveal, the
  // never-idle watch and the background save.
  fm5Tick(dt, now);

  if(!NODRAW) renderer.render(scene,camera);
  requestAnimationFrame(step);
}
requestAnimationFrame(step);

// -------------------------------------------------------------------------
// FM1 handle — a QA harness can read the state and prove the mechanic works.
// -------------------------------------------------------------------------
window.FARM = {
  version: "fm8",
  coins: function(){ return walletBalance(); },
  addCoins: addCoins,
  patches: function(){ return PATCHES.map(function(P){
    return { x:P.x, z:P.z, state:P.state, seed:P.seed,
             tier:P.tier, locked:!!P.locked, cover:!!P.cover };
  }); },
  openSeedPicker: function(index){ if(PATCHES[index]) openSeedPicker(PATCHES[index]); },
  closeSeedPicker: closeSeedPicker,
  cardUp: function(){ return seedCardEl.classList.contains("up"); },
  seedButtons: function(){
    return Array.prototype.slice.call(seedRowEl.querySelectorAll(".seed")).map(function(el){
      return { kind:el.dataset.kind, locked:el.classList.contains("locked") };
    });
  },
  plant: function(index, kind){
    if(!PATCHES[index]) return false;
    openSeedPicker(PATCHES[index]); tryPlant(kind); return true;
  },
  // Fast-forward growth: advance all growing patches by seconds. Purely a
  // testing lever so QA doesn't have to wait 30s per crop. FM2 pulls the
  // animals' making-timers back by the same amount.
  advanceTime: function(sec){
    for(var i=0;i<PATCHES.length;i++){
      var P=PATCHES[i]; if(P.state==="growing"||P.state==="ready") P.plantedAt -= sec;
    }
    for(i=0;i<ANIMALS.length;i++){
      if(ANIMALS[i].state==="making") ANIMALS[i].fedAt -= sec;
    }
  },
  kid: function(){ return { x:kid.position.x, y:kid.position.y, z:kid.position.z, facing:kidState.facing }; },
  moveKidTo: function(x,z){ clearWalkTo(); kid.position.x=x; kid.position.z=z; kidState.pos.set(x,0,z); },
  stack: function(){ return stack.map(function(it,i){
    return { i:i, kind:it.userData.kind,
             x:+it.position.x.toFixed(3), y:+it.position.y.toFixed(3), z:+it.position.z.toFixed(3),
             lag:it.userData.tOffset };
  }); },
  stackHeight: function(){ return stack.length; },
  cropRecipes: function(){ var out={}; for(var k in CROP_RECIPES){
    out[k]={price:CROP_RECIPES[k].price, reward:CROP_RECIPES[k].reward, growSec:CROP_RECIPES[k].growSec};
  } return out; },

  // ---- FM2 -------------------------------------------------------------
  modelsLoaded: function(){ return ANM_ON; },
  animals: function(){ return ANIMALS.map(function(A,i){
    return { i:i, kind:A.kind, real:!!A.real, nested:!!A.nested, patrolling:!!A.patrol,
             x:+A.x.toFixed(3), z:+A.z.toFixed(3),
             state:A.state, wants:A.wants, gives:A.gives, makeSec:A.makeSec,
             wanting:!!A.want, hasProduce:!!A.produce, sparkling:!!A.halo };
  }); },
  animalKinds: function(){ var out={}; for(var k in ANIMAL_KINDS){
    out[k]={wants:ANIMAL_KINDS[k].wants, gives:ANIMAL_KINDS[k].gives,
            makeSec:ANIMAL_KINDS[k].makeSec, size:ANIMAL_KINDS[k].size};
  } return out; },
  // Put something straight on the stack, so a robot can prove the feed
  // without having to grow a crop first.
  giveItem: function(kind, n){
    var i, c=0;
    for(i=0;i<(n||1);i++){
      if(!ITEM(kind)) return c;
      pushOntoStack(kind, new THREE.Vector3(kid.position.x, 0.9, kid.position.z));
      c++;
    }
    return c;
  },
  flying: function(){ return FLYING.length; },
  // A testing lever, the same kind as giveItem and advanceTime: put the tower
  // back to nothing so one check does not inherit the last one's leftovers.
  clearStack: function(){ var n=stack.length;
    while(stack.length){ scene.remove(stack.pop()); }
