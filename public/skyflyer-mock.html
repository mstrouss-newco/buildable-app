<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Sky Flyer — FL1 mock</title>
<!--
  Sky Flyer FL1: playable 3D feel mock. Standalone on purpose — no shell,
  no manifest, no wallet wiring yet (that is FL2). One endless world
  (Sunny Islands), one-finger drag steering with auto-forward, coin
  trails, one landing pad (land banks coins, then take off again).
  Uses the repo's own three.min.js. No emojis anywhere (repo law).
-->
<style>
  html,body{margin:0;padding:0;overflow:hidden;height:100%;background:#7ecbff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    -webkit-user-select:none;user-select:none;touch-action:none}
  canvas{display:block}
  #hud{position:fixed;inset:0;pointer-events:none}
  .pill{position:absolute;top:calc(12px + env(safe-area-inset-top));right:14px;
    background:rgba(255,252,240,.92);border-radius:999px;padding:8px 16px 8px 10px;
    display:flex;align-items:center;gap:8px;box-shadow:0 3px 10px rgba(30,60,90,.18);
    font-weight:800;font-size:20px;color:#5b4a1f}
  .pill svg{display:block}
  #banked{position:absolute;top:calc(64px + env(safe-area-inset-top));right:14px;
    background:rgba(255,252,240,.85);border-radius:999px;padding:5px 14px;
    font-weight:700;font-size:13px;color:#2b7a4b;box-shadow:0 2px 6px rgba(30,60,90,.15);
    opacity:0;transition:opacity .4s}
  #hint{position:absolute;left:50%;bottom:12%;transform:translateX(-50%);
    background:rgba(255,252,240,.94);border-radius:20px;padding:14px 22px;
    text-align:center;color:#33566e;font-weight:800;font-size:18px;
    box-shadow:0 4px 14px rgba(30,60,90,.2);transition:opacity .6s}
  #hint .sub{font-weight:600;font-size:14px;color:#6b8aa0;margin-top:4px}
  #padmsg{position:absolute;left:50%;top:18%;transform:translateX(-50%);
    background:rgba(47,183,214,.95);color:#fff;border-radius:16px;padding:10px 20px;
    font-weight:800;font-size:18px;box-shadow:0 4px 14px rgba(20,80,110,.3);
    opacity:0;transition:opacity .4s}
  #takeoff{position:absolute;left:50%;bottom:16%;transform:translateX(-50%);
    pointer-events:auto;display:none;border:none;cursor:pointer;
    background:linear-gradient(#57d06b,#2fae4d);color:#fff;font-weight:900;
    font-size:24px;padding:18px 44px;border-radius:999px;
    box-shadow:0 6px 0 #1f8038,0 10px 24px rgba(20,90,40,.35);
    font-family:inherit;letter-spacing:.5px}
  #takeoff:active{transform:translateX(-50%) translateY(4px);box-shadow:0 2px 0 #1f8038}
  #arrow{position:absolute;width:52px;height:52px;opacity:0;transition:opacity .3s}
  #arrow .lbl{position:absolute;top:52px;left:50%;transform:translateX(-50%);
    background:rgba(255,252,240,.9);border-radius:8px;padding:2px 8px;font-size:11px;
    font-weight:800;color:#33566e;white-space:nowrap}
  #toast{position:absolute;left:50%;top:30%;transform:translateX(-50%) scale(.8);
    color:#fff;font-weight:900;font-size:34px;text-shadow:0 3px 8px rgba(30,60,90,.4);
    opacity:0;pointer-events:none}
  #toast.show{animation:pop 1.6s ease forwards}
  @keyframes pop{0%{opacity:0;transform:translateX(-50%) scale(.6)}
    15%{opacity:1;transform:translateX(-50%) scale(1.08)}
    30%{transform:translateX(-50%) scale(1)}
    75%{opacity:1}100%{opacity:0;transform:translateX(-50%) scale(1)}}
</style>
</head>
<body>
<div id="hud">
  <div class="pill">
    <svg width="26" height="26" viewBox="0 0 26 26">
      <circle cx="13" cy="13" r="11" fill="#F7C948" stroke="#D89B1C" stroke-width="2.5"/>
      <circle cx="13" cy="13" r="6" fill="none" stroke="#D89B1C" stroke-width="2"/>
    </svg>
    <span id="coins">0</span>
  </div>
  <div id="banked">Banked: <span id="bankedN">0</span></div>
  <div id="hint">
    <svg width="120" height="46" viewBox="0 0 120 46">
      <circle cx="24" cy="23" r="12" fill="none" stroke="#2FB7D6" stroke-width="4"/>
      <circle cx="24" cy="23" r="4" fill="#2FB7D6"/>
      <path d="M46 23 H96" stroke="#2FB7D6" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 9"/>
      <path d="M92 12 L108 23 L92 34 Z" fill="#2FB7D6"/>
    </svg>
    <div>Drag anywhere to fly</div>
    <div class="sub">Up and down too. The plane flies by itself</div>
  </div>
  <div id="padmsg">Fly low over the pad to land</div>
  <div id="arrow">
    <svg width="52" height="52" viewBox="0 0 52 52">
      <g id="arrowRot">
        <path d="M26 4 L40 30 L26 24 L12 30 Z" fill="#FF8A3C" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/>
      </g>
    </svg>
    <div class="lbl" id="arrowLbl">Landing pad</div>
  </div>
  <div id="toast"></div>
  <button id="takeoff">TAKE OFF</button>
</div>
<script src="/three.min.js"></script>
<script>
(function(){
"use strict";
// ---------- tiny helpers ----------
var clamp=function(v,a,b){return v<a?a:(v>b?b:v);};
var lerp=function(a,b,t){return a+(b-a)*t;};
// deterministic per-chunk random
function hash2(x,z){var h=Math.sin(x*127.1+z*311.7)*43758.5453;return h-Math.floor(h);}
function rng(seed){return function(){seed=(seed*9301+49297)%233280;return seed/233280;};}

// ---------- renderer / scene ----------
var W=innerWidth,H=innerHeight;
var renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
renderer.setSize(W,H);
document.body.insertBefore(renderer.domElement,document.getElementById('hud'));
var scene=new THREE.Scene();
scene.background=new THREE.Color(0x7ecbff);
scene.fog=new THREE.Fog(0xbfe6ff,260,720);
var camera=new THREE.PerspectiveCamera(62,W/H,0.5,1500);

var hemi=new THREE.HemisphereLight(0xbfe8ff,0x7aa96b,0.95);scene.add(hemi);
var sun=new THREE.DirectionalLight(0xfff2cf,1.0);sun.position.set(120,220,60);scene.add(sun);

// sun disc in the sky
var sunDisc=new THREE.Mesh(new THREE.CircleGeometry(38,24),
  new THREE.MeshBasicMaterial({color:0xFFE9A8,fog:false}));
scene.add(sunDisc);

// ---------- materials (shared) ----------
var M={
  water:new THREE.MeshPhongMaterial({color:0x1B76AC,shininess:45,flatShading:true}),
  sand:new THREE.MeshPhongMaterial({color:0xF6D98A,flatShading:true,shininess:8}),
  grass:new THREE.MeshPhongMaterial({color:0x6FD46F,flatShading:true,shininess:5}),
  grassDark:new THREE.MeshPhongMaterial({color:0x4FB85C,flatShading:true,shininess:5}),
  trunk:new THREE.MeshPhongMaterial({color:0xA9764B,flatShading:true,shininess:5}),
  leaf:new THREE.MeshPhongMaterial({color:0x3FA75B,flatShading:true,shininess:5}),
  red:new THREE.MeshPhongMaterial({color:0xFF6B6B,flatShading:true,shininess:30}),
  cream:new THREE.MeshPhongMaterial({color:0xFFF6E3,flatShading:true,shininess:20}),
  gray:new THREE.MeshPhongMaterial({color:0x5E6B77,flatShading:true}),
  gold:new THREE.MeshPhongMaterial({color:0xF7C948,emissive:0x8a6a10,shininess:90}),
  padTop:new THREE.MeshPhongMaterial({color:0xFFFFFF,flatShading:true}),
  padRing:new THREE.MeshBasicMaterial({color:0xFF8A3C}),
  cloud:new THREE.MeshPhongMaterial({color:0xFFFFFF,flatShading:true,shininess:0}),
  rock:new THREE.MeshPhongMaterial({color:0xB9A88F,flatShading:true})
};

// ---------- ocean ----------
var OCEAN_SEG=44,OCEAN_SIZE=1400;
var oceanGeo=new THREE.PlaneGeometry(OCEAN_SIZE,OCEAN_SIZE,OCEAN_SEG,OCEAN_SEG);
oceanGeo.rotateX(-Math.PI/2);
var ocean=new THREE.Mesh(oceanGeo,M.water);
scene.add(ocean);
var oceanPos=oceanGeo.attributes.position;
var oceanBase=oceanPos.array.slice();

// ---------- clouds ----------
var clouds=[];
(function(){
  var puff=new THREE.SphereGeometry(1,7,5);
  for(var i=0;i<10;i++){
    var g=new THREE.Group();
    var r=rng(i*77+5),n=3+((r()*3)|0);
    for(var j=0;j<n;j++){
      var m=new THREE.Mesh(puff,M.cloud);
      var s=6+r()*7;
      m.scale.set(s,s*0.62,s);
      m.position.set((j-n/2)*7+r()*4,r()*3,r()*5);
      g.add(m);
    }
    g.position.set((r()-.5)*900,90+r()*70,(r()-.5)*900);
    scene.add(g);clouds.push(g);
  }
})();

// ---------- the plane (cute low-poly, code-built) ----------
var plane=new THREE.Group();
(function(){
  var body=new THREE.Mesh(new THREE.CylinderGeometry(1.05,1.5,6.4,8),M.red);
  body.rotation.x=Math.PI/2;plane.add(body);
  var nose=new THREE.Mesh(new THREE.CylinderGeometry(1.5,1.15,1.5,8),M.cream);
  nose.rotation.x=Math.PI/2;nose.position.z=3.9;plane.add(nose);
  var tailTip=new THREE.Mesh(new THREE.CylinderGeometry(0.35,1.05,1.6,8),M.red);
  tailTip.rotation.x=Math.PI/2;tailTip.position.z=-4.0;plane.add(tailTip);
  var wing=new THREE.Mesh(new THREE.BoxGeometry(13,0.42,2.6),M.cream);
  wing.position.set(0,0.45,0.6);plane.add(wing);
  var wingTipL=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.6,2.6),M.red);
  wingTipL.position.set(-6.5,0.45,0.6);plane.add(wingTipL);
  var wingTipR=wingTipL.clone();wingTipR.position.x=6.5;plane.add(wingTipR);
  var tailWing=new THREE.Mesh(new THREE.BoxGeometry(4.6,0.32,1.5),M.cream);
  tailWing.position.set(0,0.3,-3.9);plane.add(tailWing);
  var fin=new THREE.Mesh(new THREE.BoxGeometry(0.32,2.0,1.6),M.red);
  fin.position.set(0,1.2,-4.1);plane.add(fin);
  var canopy=new THREE.Mesh(new THREE.SphereGeometry(0.95,8,6),
    new THREE.MeshPhongMaterial({color:0x9adcf5,shininess:90,flatShading:true}));
  canopy.scale.set(1,0.8,1.4);canopy.position.set(0,1.05,1.1);plane.add(canopy);
  var hub=new THREE.Mesh(new THREE.SphereGeometry(0.5,8,6),M.gray);
  hub.position.z=4.75;plane.add(hub);
})();
var prop=new THREE.Mesh(new THREE.BoxGeometry(0.28,5.2,0.5),M.gray);
prop.position.z=4.85;plane.add(prop);
var propDisc=new THREE.Mesh(new THREE.CircleGeometry(2.6,20),
  new THREE.MeshBasicMaterial({color:0xdddddd,transparent:true,opacity:0.25,side:THREE.DoubleSide}));
propDisc.position.z=4.9;plane.add(propDisc);
scene.add(plane);
// wheels for landing
var wheelGeo=new THREE.CylinderGeometry(0.55,0.55,0.4,10);wheelGeo.rotateZ(Math.PI/2);
[[-1.4,-1.35,1.2],[1.4,-1.35,1.2],[0,-1.15,-3.6]].forEach(function(p){
  var w=new THREE.Mesh(wheelGeo,M.gray);w.position.set(p[0],p[1],p[2]);plane.add(w);
});

// ---------- landing pad (one, fixed in the world) ----------
var PAD={x:0,z:-620,r:16,topY:10};
var padIsle=new THREE.Group();
(function(){
  var base=new THREE.Mesh(new THREE.CylinderGeometry(24,34,14,10),M.sand);
  base.position.y=3;padIsle.add(base);
  var top=new THREE.Mesh(new THREE.CylinderGeometry(PAD.r,PAD.r,1.6,20),M.padTop);
  top.position.y=PAD.topY;padIsle.add(top);
  var ring=new THREE.Mesh(new THREE.TorusGeometry(PAD.r-3.4,0.7,8,26),M.padRing);
  ring.rotation.x=Math.PI/2;ring.position.y=PAD.topY+0.85;padIsle.add(ring);
  var dot=new THREE.Mesh(new THREE.CylinderGeometry(3,3,0.3,14),M.padRing);
  dot.position.y=PAD.topY+0.85;padIsle.add(dot);
  // windsock pole
  var pole=new THREE.Mesh(new THREE.CylinderGeometry(0.28,0.28,7,6),M.gray);
  pole.position.set(PAD.r-2,PAD.topY+3.5,-(PAD.r-2));padIsle.add(pole);
  var sock=new THREE.Mesh(new THREE.ConeGeometry(1.1,3.4,8),M.padRing);
  sock.rotation.z=Math.PI/2;sock.position.set(PAD.r-3.8,PAD.topY+6.5,-(PAD.r-2));
  padIsle.add(sock);
  // beacon pillar so kids can spot it far away
  var beam=new THREE.Mesh(new THREE.CylinderGeometry(1.6,1.6,220,8,1,true),
    new THREE.MeshBasicMaterial({color:0xFF8A3C,transparent:true,opacity:0.16,fog:false}));
  beam.position.y=110;padIsle.add(beam);
})();
padIsle.position.set(PAD.x,0,PAD.z);
scene.add(padIsle);

// ---------- endless islands + coins (chunk grid) ----------
var CHUNK=340,RANGE=2; // 5x5 grid around the plane
var chunks={}; // key -> {group, coins:[{mesh,taken}]}
var isleGeoHill=new THREE.ConeGeometry(1,1,9);
var isleGeoCap=new THREE.ConeGeometry(1,1,9);
var trunkGeo=new THREE.CylinderGeometry(0.25,0.35,1,6);
var leafGeo=new THREE.ConeGeometry(1.6,2.2,7);
var rockGeo=new THREE.IcosahedronGeometry(1,0);
var beachGeo=new THREE.CylinderGeometry(1,1.12,1.2,10);
var coinGeo=new THREE.CylinderGeometry(1.15,1.15,0.34,14);coinGeo.rotateX(Math.PI/2);

function buildPalm(r){
  var g=new THREE.Group();
  var h=3.5+r()*2.5;
  var t=new THREE.Mesh(trunkGeo,M.trunk);t.scale.set(1,h,1);t.position.y=h/2;g.add(t);
  var l=new THREE.Mesh(leafGeo,M.leaf);l.position.y=h+0.9;g.add(l);
  return g;
}
function buildIsland(r,big){
  var g=new THREE.Group();
  var rad=big?(16+r()*14):(7+r()*7);
  var hh=big?(26+r()*40):(6+r()*8);
  var hill=new THREE.Mesh(isleGeoHill,M.sand);
  hill.scale.set(rad,hh,rad);hill.position.y=hh*0.5-2;g.add(hill);
  var beach=new THREE.Mesh(beachGeo,M.sand);
  beach.scale.set(rad*1.25,1,rad*1.25);beach.position.y=0.6;g.add(beach);
  var cap=new THREE.Mesh(isleGeoCap,r()>0.5?M.grass:M.grassDark);
  cap.scale.set(rad*0.55,hh*0.55,rad*0.55);cap.position.y=hh*0.72;g.add(cap);
  var palms=1+((r()*3)|0);
  for(var i=0;i<palms;i++){
    var p=buildPalm(r);
    var a=r()*Math.PI*2,d=rad*0.35*r();
    p.position.set(Math.cos(a)*d,hh*0.98-2,Math.sin(a)*d);
    p.rotation.y=r()*Math.PI;g.add(p);
  }
  if(r()>0.6){var rock=new THREE.Mesh(rockGeo,M.rock);
    var s=1+r()*2;rock.scale.set(s,s,s);
    rock.position.set(rad*0.8,0.5,rad*0.4);g.add(rock);}
  g.userData.hitR=rad*0.8;g.userData.hitH=hh;
  return g;
}
function makeCoin(x,y,z,parent,list){
  var c=new THREE.Mesh(coinGeo,M.gold);
  c.position.set(x,y,z);parent.add(c);
  list.push({mesh:c,taken:false});
}
function buildChunk(cx,cz){
  var key=cx+","+cz;
  if(chunks[key])return;
  var g=new THREE.Group();
  g.position.set(cx*CHUNK,0,cz*CHUNK);
  var r=rng(Math.floor(hash2(cx,cz)*100000)+7);
  var coins=[];
  var isles=[];
  // skip island right at spawn chunk center and near the pad
  var n=1+((r()*2.4)|0);
  for(var i=0;i<n;i++){
    var big=r()>0.62;
    var isle=buildIsland(r,big);
    var ix=(r()-.5)*CHUNK*0.86,iz=(r()-.5)*CHUNK*0.86;
    var wx=cx*CHUNK+ix,wz=cz*CHUNK+iz;
    if(Math.hypot(wx-PAD.x,wz-PAD.z)<95)continue;      // keep pad approach clear
    if(Math.hypot(wx,wz)<80)continue;                   // keep spawn clear
    isle.position.set(ix,0,iz);
    g.add(isle);isles.push(isle);
    // crown coins on tall islands
    if(big&&r()>0.35){
      var top=isle.userData.hitH*0.98;
      for(var k=0;k<5;k++){
        var a=k/5*Math.PI*2;
        makeCoin(ix+Math.cos(a)*7,top+6,iz+Math.sin(a)*7,g,coins);
      }
    }
  }
  // 1-2 coin trails per chunk: gentle arcs in the open air
  var trails=1+((r()*1.8)|0);
  for(var t=0;t<trails;t++){
    var sx=(r()-.5)*CHUNK*0.8,sz=(r()-.5)*CHUNK*0.8;
    var ang=r()*Math.PI*2,len=7+((r()*4)|0);
    var baseY=14+r()*40,rise=(r()-.5)*18,bend=(r()-.5)*0.5;
    for(var q=0;q<len;q++){
      var d=q*9,aa=ang+bend*(q/len);
      var yy=baseY+Math.sin(q/len*Math.PI)*Math.abs(rise)+ (rise<0?-q*0.6:0);
      makeCoin(sx+Math.cos(aa)*d,clamp(yy,8,95),sz+Math.sin(aa)*d,g,coins);
    }
  }
  scene.add(g);
  chunks[key]={group:g,coins:coins,isles:isles,cx:cx,cz:cz};
}
function updateChunks(px,pz){
  var ccx=Math.round(px/CHUNK),ccz=Math.round(pz/CHUNK);
  for(var dx=-RANGE;dx<=RANGE;dx++)for(var dz=-RANGE;dz<=RANGE;dz++)
    buildChunk(ccx+dx,ccz+dz);
  for(var key in chunks){
    var ch=chunks[key];
    if(Math.abs(ch.cx-ccx)>RANGE+1||Math.abs(ch.cz-ccz)>RANGE+1){
      scene.remove(ch.group); // all chunk geometry is shared, nothing to dispose
      delete chunks[key];
    }
  }
}

// starter coin trail: straight ahead so the very first seconds feel good
var starter={group:new THREE.Group(),coins:[]};
(function(){
  for(var i=0;i<10;i++)
    makeCoin(0,16+Math.sin(i/9*Math.PI)*6,-40-i*11,starter.group,starter.coins);
  scene.add(starter.group);
})();

// ---------- sparkles on coin pickup ----------
var sparks=[];
var sparkGeo=new THREE.IcosahedronGeometry(0.45,0);
var sparkMat=new THREE.MeshBasicMaterial({color:0xFFE066});
function burst(pos,n,color){
  for(var i=0;i<n;i++){
    var s=new THREE.Mesh(sparkGeo,color||sparkMat);
    s.position.copy(pos);
    s.userData.v=new THREE.Vector3((Math.random()-.5)*14,Math.random()*10+3,(Math.random()-.5)*14);
    s.userData.life=0.7;
    scene.add(s);sparks.push(s);
  }
}
var splashMat=new THREE.MeshBasicMaterial({color:0xCFF3FF});

// ---------- flight state ----------
var S={
  mode:"fly",            // fly | landing | landed | takeoff
  pos:new THREE.Vector3(0,22,40),
  yaw:0,                 // face -z (toward the pad far away)
  pitch:0,bank:0,
  speed:34,
  coins:0,banked:0,
  dragging:false,dx:0,dy:0,
  landTimer:0,hintDone:false,padNear:false
};
window.SKY=S; // debug/QA peek (FL2 will formalize autopilot)

// ---------- input: one finger, drag = steer ----------
var startX=0,startY=0;
function pdown(x,y){
  if(S.mode==="landed")return;
  S.dragging=true;startX=x;startY=y;S.dx=0;S.dy=0;
  if(!S.hintDone){S.hintDone=true;hintEl.style.opacity=0;}
}
function pmove(x,y){
  if(!S.dragging)return;
  S.dx=clamp((x-startX)/(W*0.28),-1,1);
  S.dy=clamp((y-startY)/(H*0.28),-1,1);
}
function pup(){S.dragging=false;S.dx=0;S.dy=0;}
addEventListener("pointerdown",function(e){pdown(e.clientX,e.clientY);});
addEventListener("pointermove",function(e){pmove(e.clientX,e.clientY);});
addEventListener("pointerup",pup);
addEventListener("pointercancel",pup);
addEventListener("touchstart",function(e){e.preventDefault();},{passive:false});

// ---------- HUD refs ----------
var coinsEl=document.getElementById("coins"),
    bankedBox=document.getElementById("banked"),
    bankedEl=document.getElementById("bankedN"),
    hintEl=document.getElementById("hint"),
    padmsg=document.getElementById("padmsg"),
    arrowEl=document.getElementById("arrow"),
    arrowRot=document.getElementById("arrowRot"),
    arrowLbl=document.getElementById("arrowLbl"),
    toastEl=document.getElementById("toast"),
    takeoffBtn=document.getElementById("takeoff");
function toast(t){toastEl.textContent=t;toastEl.classList.remove("show");
  void toastEl.offsetWidth;toastEl.classList.add("show");}
takeoffBtn.addEventListener("click",function(){
  if(S.mode!=="landed")return;
  S.mode="takeoff";S.landTimer=0;takeoffBtn.style.display="none";
  toast("Off we go!");
});

// ---------- collisions ----------
function islandBounce(){
  for(var key in chunks){
    var ch=chunks[key];
    for(var i=0;i<ch.isles.length;i++){
      var isle=ch.isles[i];
      var wx=ch.group.position.x+isle.position.x,
          wz=ch.group.position.z+isle.position.z;
      var hr=isle.userData.hitR,hh=isle.userData.hitH;
      var d=Math.hypot(S.pos.x-wx,S.pos.z-wz);
      if(d<hr+3&&S.pos.y<hh+2){
        // soft bounce: push out, small pop, never a fail state
        var nx=(S.pos.x-wx)/(d||1),nz=(S.pos.z-wz)/(d||1);
        S.pos.x=wx+nx*(hr+4);S.pos.z=wz+nz*(hr+4);
        S.pos.y+=2.5;S.speed=Math.max(20,S.speed*0.7);
        burst(S.pos,6);
        return;
      }
    }
  }
}
function collectCoins(list,parent){
  for(var i=0;i<list.length;i++){
    var c=list[i];
    if(c.taken)continue;
    var wp=c.mesh.position;
    var wx=parent?parent.position.x+wp.x:wp.x,
        wy=wp.y,
        wz=parent?parent.position.z+wp.z:wp.z;
    var dx=S.pos.x-wx,dy=S.pos.y-wy,dz=S.pos.z-wz;
    if(dx*dx+dy*dy+dz*dz<46){ // generous kid-sized magnet
      c.taken=true;c.mesh.visible=false;
      S.coins++;coinsEl.textContent=S.coins;
      burst(new THREE.Vector3(wx,wy,wz),5);
    }
  }
}

// ---------- landing pad logic ----------
function padDistance(){return Math.hypot(S.pos.x-PAD.x,S.pos.z-PAD.z);}
function tryLand(){
  var d=padDistance();
  var near=d<120;
  if(near!==S.padNear){S.padNear=near;padmsg.style.opacity=near&&S.mode==="fly"?1:0;}
  if(S.mode==="fly"&&d<PAD.r+6&&S.pos.y<PAD.topY+14){
    S.mode="landing";S.landTimer=0;padmsg.style.opacity=0;
  }
}

// ---------- camera ----------
var camPos=new THREE.Vector3(0,30,80);
function updateCamera(dt){
  var back=new THREE.Vector3(
    Math.sin(S.yaw)*20, 8.5-S.pitch*6, Math.cos(S.yaw)*20);
  var target=S.pos.clone().add(back);
  camPos.lerp(target,1-Math.pow(0.0012,dt));
  camera.position.copy(camPos);
  var look=S.pos.clone();look.y+=2.5;
  look.x-=Math.sin(S.yaw)*14;look.z-=Math.cos(S.yaw)*14;
  camera.lookAt(look);
}

// ---------- pad arrow (screen-edge pointer) ----------
var v3=new THREE.Vector3();
function updateArrow(){
  if(S.mode!=="fly"){arrowEl.style.opacity=0;return;}
  var d=padDistance();
  if(d<170){arrowEl.style.opacity=0;return;}
  v3.set(PAD.x,PAD.topY,PAD.z).project(camera);
  var onScreen=v3.z<1&&v3.x>-0.92&&v3.x<0.92&&v3.y>-0.85&&v3.y<0.85;
  if(onScreen){
    var sx=(v3.x*0.5+0.5)*W,sy=(-v3.y*0.5+0.5)*H;
    arrowEl.style.left=(sx-26)+"px";arrowEl.style.top=(sy-70)+"px";
    arrowRot.setAttribute("transform","rotate(180 26 26)");
  }else{
    // point along screen edge toward the pad
    var ang=Math.atan2(v3.x,v3.y);
    if(v3.z>1)ang=Math.PI-ang;
    var cx=W/2+Math.sin(ang)*(Math.min(W,H)*0.36),
        cy=H*0.42-Math.cos(ang)*(H*0.30);
    arrowEl.style.left=(cx-26)+"px";arrowEl.style.top=(cy-26)+"px";
    arrowRot.setAttribute("transform","rotate("+(ang*180/Math.PI)+" 26 26)");
  }
  arrowLbl.textContent="Landing pad "+Math.round(d)+"m";
  arrowEl.style.opacity=1;
}

// ---------- main loop ----------
var last=performance.now(),time=0;
function frame(now){
  requestAnimationFrame(frame);
  var dt=Math.min((now-last)/1000,0.05);last=now;time+=dt;

  if(S.mode==="fly"){
    // steering: drag offset -> turn rate + pitch
    var turn=S.dx*1.7,pitchT=S.dy*0.75;
    S.yaw-=turn*dt;
    S.pitch=lerp(S.pitch,-pitchT,1-Math.pow(0.002,dt));
    S.bank=lerp(S.bank,-S.dx*0.9,1-Math.pow(0.004,dt));
    var targetSpeed=34-S.pitch*10;
    S.speed=lerp(S.speed,clamp(targetSpeed,24,46),dt*1.5);
    var dir=new THREE.Vector3(-Math.sin(S.yaw),Math.sin(S.pitch),-Math.cos(S.yaw)).normalize();
    S.pos.addScaledVector(dir,S.speed*dt);
    // altitude limits: splash-bounce at water, soft ceiling
    if(S.pos.y<3){S.pos.y=3;S.pitch=Math.max(S.pitch,0.12);
      if(Math.random()<0.3)burst(new THREE.Vector3(S.pos.x,1,S.pos.z),3,splashMat);}
    if(S.pos.y>120){S.pos.y=120;S.pitch=Math.min(S.pitch,0);}
    islandBounce();
    tryLand();
  }
  else if(S.mode==="landing"){
    S.landTimer+=dt;
    var t=Math.min(S.landTimer/1.6,1),e=t*t*(3-2*t);
    S.pos.x=lerp(S.pos.x,PAD.x,e*0.14);
    S.pos.z=lerp(S.pos.z,PAD.z,e*0.14);
    S.pos.y=lerp(S.pos.y,PAD.topY+2.3,e*0.16);
    S.speed=lerp(S.speed,0,dt*1.4);
    S.pitch=lerp(S.pitch,0,dt*3);S.bank=lerp(S.bank,0,dt*3);
    var dir2=new THREE.Vector3(-Math.sin(S.yaw),0,-Math.cos(S.yaw));
    S.pos.addScaledVector(dir2,S.speed*dt*0.4);
    if(t>=1&&S.speed<1.5){
      S.mode="landed";
      // bank the coins
      if(S.coins>0){
        S.banked+=S.coins;
        toast("+"+S.coins+" coins banked!");
        S.coins=0;coinsEl.textContent=0;
        bankedEl.textContent=S.banked;bankedBox.style.opacity=1;
        burst(new THREE.Vector3(PAD.x,PAD.topY+4,PAD.z),16);
      }else{toast("Nice landing!");}
      takeoffBtn.style.display="block";
    }
  }
  else if(S.mode==="takeoff"){
    S.landTimer+=dt;
    S.speed=lerp(S.speed,38,dt*0.9);
    var dir3=new THREE.Vector3(-Math.sin(S.yaw),0,-Math.cos(S.yaw));
    S.pos.addScaledVector(dir3,S.speed*dt);
    if(S.landTimer>1.1){S.pos.y+=(S.landTimer-1.1)*14*dt*3;S.pitch=lerp(S.pitch,0.28,dt*2);}
    if(S.pos.y>PAD.topY+16){S.mode="fly";S.pitch=0.1;}
  }

  // plane transform
  plane.position.copy(S.pos);
  plane.rotation.set(0,0,0);
  plane.rotateY(S.yaw+Math.PI);
  plane.rotateX(-S.pitch);
  plane.rotateZ(S.bank);
  plane.position.y+=Math.sin(time*2.2)*0.25; // gentle idle bob
  var propSpeed=S.mode==="landed"?2:34;
  prop.rotation.z+=dt*propSpeed;
  propDisc.material.opacity=S.mode==="landed"?0:0.22;
  propDisc.rotation.z=prop.rotation.z;

  // world follows
  ocean.position.set(S.pos.x,0,S.pos.z);
  for(var i=0;i<oceanPos.count;i++){
    var ox=oceanBase[i*3],oz=oceanBase[i*3+2];
    oceanPos.array[i*3+1]=Math.sin((ox+S.pos.x)*0.05+time*1.3)*0.7
      +Math.cos((oz+S.pos.z)*0.06+time*0.9)*0.7;
  }
  oceanPos.needsUpdate=true;
  sunDisc.position.set(S.pos.x+280,170,S.pos.z-560);
  sunDisc.lookAt(camera.position);
  clouds.forEach(function(c,idx){
    c.position.x+=dt*(1.5+idx*0.2);
    if(c.position.x-S.pos.x>520)c.position.x-=1040;
    if(S.pos.x-c.position.x>520)c.position.x+=1040;
    if(c.position.z-S.pos.z>520)c.position.z-=1040;
    if(S.pos.z-c.position.z>520)c.position.z+=1040;
  });

  updateChunks(S.pos.x,S.pos.z);
  // coins spin + collect
  var spin=time*3;
  starter.coins.forEach(function(c){c.mesh.rotation.y=spin;});
  collectCoins(starter.coins,null);
  for(var key in chunks){
    var ch=chunks[key];
    for(var q=0;q<ch.coins.length;q++)ch.coins[q].mesh.rotation.y=spin;
    collectCoins(ch.coins,ch.group);
  }
  // sparkles
  for(var s=sparks.length-1;s>=0;s--){
    var sp=sparks[s];
    sp.userData.life-=dt;
    if(sp.userData.life<=0){scene.remove(sp);sparks.splice(s,1);continue;}
    sp.position.addScaledVector(sp.userData.v,dt);
    sp.userData.v.y-=30*dt;
    var sc=sp.userData.life/0.7;sp.scale.set(sc,sc,sc);
  }

  updateCamera(dt);
  updateArrow();
  renderer.render(scene,camera);
}
updateChunks(0,0);
requestAnimationFrame(frame);

addEventListener("resize",function(){
  W=innerWidth;H=innerHeight;
  camera.aspect=W/H;camera.updateProjectionMatrix();
  renderer.setSize(W,H);
});
})();
</script>
</body>
</html>
