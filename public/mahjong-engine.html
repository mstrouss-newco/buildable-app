<style>
  html,body{margin:0;height:100%;width:100%;background:#101a2e;overflow:hidden;font-family:'Nunito',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}

  #wrap{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
  .ov{position:absolute;inset:0;z-index:5}
  #start{position:absolute;inset:0;z-index:6}
  .hide{display:none!important}
  /* in-game controls: top-right vertical stack (Home is shell-owned, top-left) */
  #ctrls{position:absolute;top:12px;right:12px;z-index:4;display:flex;flex-direction:column;gap:9px}
  .cbtn{width:48px;height:48px;border-radius:50%;border:1px solid rgba(255,255,255,.22);background:rgba(16,26,46,.62);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;padding:0}

  .cbtn span{font-family:'Baloo 2','Nunito',sans-serif;font-weight:800;font-size:11px;line-height:1}
  .cbtn b{font-family:'Baloo 2','Nunito',sans-serif;font-weight:900;font-size:11px;line-height:1;color:#7CF6B0}
  .cbtn.off{opacity:.38;cursor:default}
  .cbtn.off b{color:#9aa7c4}
  #banner{position:absolute;left:50%;top:16px;transform:translateX(-50%);z-index:4;background:rgba(16,26,46,.72);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:8px 18px;color:#fff;font-weight:800;font-size:15px;display:flex;gap:14px;align-items:center}
  /* customize (tile-set picker) */
  #cust{position:absolute;inset:0;z-index:8;background:rgba(8,12,24,.84);display:flex;align-items:center;justify-content:center;padding:18px}
  .csheet{width:100%;max-width:440px;background:#16223c;border:1px solid rgba(255,255,255,.09);border-radius:22px;padding:20px;color:#fff}
  .ctitle{font-size:20px;font-weight:900;margin:0 0 4px;text-align:center}

  .setbtn{border:2px solid rgba(255,255,255,.1);background:#1f2c49;color:#fff;border-radius:16px;padding:12px 6px 10px;font-weight:800;font-size:14px;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:8px}
  .setbtn.on{border-color:#7CF6B0;background:#233457}
  .setbtn img{width:46px;height:60px;object-fit:contain;filter:drop-shadow(0 4px 6px rgba(0,0,0,.4))}

</style>

<body>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="banner" class="hide"><span id="bScore" style="color:#FFD23F">Score 0</span><span id="bLeft">Tiles left: 0</span><span id="bTime" style="opacity:.85">0:00</span></div>
  <div id="ctrls" class="hide">
    <button class="cbtn" id="soundBtn" aria-label="Sound"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9v6h4l5 4V5L9 9z"/><path d="M17 8a5 5 0 0 1 0 8"/></svg></button>
    <button class="cbtn" id="undoBtn" aria-label="Recall last move"><span>Recall</span><b id="undoN">3</b></button>
    <button class="cbtn" id="hintBtn" aria-label="Hint"><span>Hint</span><b id="hintN">3</b></button>
    <button class="cbtn" id="shufBtn" aria-label="Scramble"><span>Mix</span><b id="mixN">3</b></button>
  </div>
  <div id="start" class="ov"></div>
  <div id="cust" class="hide"><div class="csheet">
    <p class="ctitle">Pick your tiles</p>
    <p class="csub">Choose the pictures you want to match</p>
    <div class="cgrid" id="setGrid"></div>
    <p class="ctitle" style="margin-top:20px">Pick your scene</p>
    <p class="csub">Choose the world behind your tiles</p>
    <div class="cgrid" id="sceneGrid"></div>
    <button class="cdone" id="custDone">Done</button>
  </div></div>
</div>

<script src="buildable-renders.js"></script>
<script src="buildable-audio.js"></script>
<script src="buildable-wincard.js"></script>
<script src="buildable-mechanics.js"></script>
<script src="buildable-startscreen.js"></script>
<script src="buildable-levelthumb.js"></script>
<script src="buildable-manifest.js"></script>
<script src="buildable-worlds.js"></script>
<script>
//  Buildable Mahjong (Solitaire) — hand-authored Track B engine.
//  A game = this FIXED engine + GAME_CONFIG (data). Solo tile-matching puzzle.
//  Shared libs: BR (art fallback), BA (sound), BM (juice), BS (start screen).
//  ALWAYS-WINNABLE: boards are generated solvable (reverse "peel" builder), and the
//  game auto-reshuffles (still solvable) whenever no move is left, so a kid can never
//  get stuck. QA hook: window.MAHJONG_GAME (sim replays the guaranteed solution).
const BR=(typeof window!=="undefined"&&window.BuildableRenders)||globalThis.BuildableRenders;
const BA=(typeof window!=="undefined"&&window.BuildableAudio)||globalThis.BuildableAudio;
const BM=(typeof window!=="undefined"&&window.BuildableMechanics)||globalThis.BuildableMechanics;
const BS=(typeof window!=="undefined"&&window.BuildableStartScreen)||globalThis.BuildableStartScreen;

// ---------- DATA ----------
const GAME_CONFIG = (typeof window!=="undefined"&&window.GAME_CONFIG) || {
  title:"Mahjong",
  base:"/game-assets/mahjong-tiles/",
  // tile-face sets the kid can pick — CC0 Kenney art (see LICENSE.txt in that folder)
  sets:[
    {key:"classic",  name:"Classic",  count:24, full:true},
    {key:"animals",  name:"Animals",  count:24},
    {key:"cards",    name:"Cards",    count:24},
    {key:"candy",    name:"Candy",    count:20},
    {key:"shapes",   name:"Shapes",   count:24},
    {key:"stickers", name:"Stickers", count:20},
  ],
  // 1 / 2 / 3 fire difficulty = board size (concentric stacked rectangles; all peelable)
  levels:[
    {key:"one",   name:"1 Fire", flames:1, foot:"Small board",  layers:[[6,4],[4,3]]},                 // 36 tiles
    {key:"two",   name:"2 Fire", flames:2, foot:"Medium board", layers:[[8,5],[6,4],[4,2]]},           // 72 tiles
    {key:"three", name:"3 Fire", flames:3, foot:"Big board",    layers:[[10,6],[8,4],[6,3],[4,1]]},    // 114 tiles
  ],
  // painted world behind the tiles — real hand-painted scene art under
  // /game-assets/mahjong-tiles/backgrounds/. grad = two-stop fallback shown while the
  // image loads; p = ambient drifting particle style layered on top.
  worlds:[
    {key:"bamboo",  name:"Bamboo Garden", src:"/game-assets/mahjong-tiles/backgrounds/bamboo.webp?v=1",  grad:["#cfe0cf","#8fae7e"], p:"leaf"},
    {key:"koi",     name:"Koi Pond",      src:"/game-assets/mahjong-tiles/backgrounds/koi.webp?v=1",     grad:["#bcd9cf","#5f9e94"], p:"petal"},
    {key:"moonlit", name:"Moonlit Night", src:"/game-assets/mahjong-tiles/backgrounds/moonlit.webp?v=1", grad:["#2b3a63","#141d3a"], p:"star"},
    {key:"blossom", name:"Cherry Blossom",src:"/game-assets/mahjong-tiles/backgrounds/blossom.webp?v=1", grad:["#ffe6d2","#e9b8c4"], p:"petal"},
  ],
};

/* Session 7B: level names can come from /mahjong/manifest.json (menu), FULL fallback to GAME_CONFIG. */
(function loadMahjongManifest(){
  try{
    if(!window.BuildableManifest || typeof window.BuildableManifest.load!=="function") return;
    window.BuildableManifest.load("mahjong", function(cfg){
      try{
        if(cfg && cfg.stages && cfg.stages.length){
          for(var i=0;i<GAME_CONFIG.levels.length && i<cfg.stages.length;i++){
            if(cfg.stages[i].name) GAME_CONFIG.levels[i].name = cfg.stages[i].name;
            if(cfg.stages[i].desc) GAME_CONFIG.levels[i].foot = cfg.stages[i].desc;
          }
          try{ if(typeof state!=="undefined" && state==="menu" && typeof startScreen!=="undefined" && startScreen && startScreen.update) startScreen.update(buildStartCfg()); }catch(e){}
        }
      }catch(e){}
    }, function(){ /* missing/invalid -> keep built-in GAME_CONFIG */ });
  }catch(e){}
})();

// ---------- STATE ----------
/* Session 7I: shell URL params. ?level=N (0-based) skips the menu and starts that
   board directly; ?screen=demo = silent self-playing attract loop for the landing
   demo box (input ignored, no audio, no win/lose cards, loops forever). */
const MJ_Q=(()=>{ try{ return new URLSearchParams(location.search); }catch(e){ return null; } })();
const MJ_DEMO=!!(MJ_Q && MJ_Q.get("screen")==="demo");
const MJ_LEVEL=(()=>{ if(!MJ_Q) return null; const l=MJ_Q.get("level");
  return (l!=null && l!=="" && !isNaN(+l)) ? Math.floor(+l) : null; })();
let state="menu";                 // menu | play | win
let tiles=[];                     // {x,y,z,id,face,gone}
let solution=[];                  // recorded guaranteed-solvable pair order [[idA,idB],...]
let selId=-1;                     // currently selected free tile id
let hintPair=null, hintUntil=0;
let demo=null;                    // first-play tutorial (shared pointing hand)
let history=[];                   // stack of removed [idA,idB] pairs (for Recall/undo)
const CAP=3;                      // each helper (Recall / Hint / Mix) is capped at 3 per game
let undosLeft=CAP, hintsLeft=CAP, mixesLeft=CAP;
let nowMs=0, headless=false;
let PREFS={ setIdx:0, lvlIdx:0, worldKey:"bamboo" };
try{ const w=localStorage.getItem("bk_mahjong_world"); if(w) PREFS.worldKey=w; }catch(e){}
let startedAt=0, elapsedMs=0, isNewBest=false, wonBest=0;   // clear timer + personal best
let mistakes=0, wonStars=3, wonCheer="";                    // wrong taps this game + earned stars (1-3) + cheer line
let matchAnims=[];                                          // matched tiles flying together as they pop
let wrongFlash=[];                                          // {id,until,dur} red wobble on a wrong tap
let combo=0, comboUntil=0, score=0;                        // chain matches for excitement + score
let tray=[]; const TRAY_CAP=4; let trayShake=0;            // HARD (3 Fire) tray mode: parked unmatched tiles; overfill it and it's game over

// ---------- BACKGROUND MUSIC (shared reusable lofi track — calm but upbeat) ----------
function ensureMusic(){ if(!BA||!BA.setMusic) return;
  const url="/api/library-music?name=lofi_chill_upbeat";
  if(BA._mjMusic!==url){ if(BA.stopMusic)BA.stopMusic(); BA.setMusic(url); BA._mjMusic=url; }
  if(BA.playMusic) BA.playMusic();
}

// ---------- BEST TIME (per difficulty+set, saved on this device) ----------
function fmtTime(ms){ const s=Math.max(0,Math.round(ms/1000)); const m=(s/60)|0; const r=s%60; return m+":"+(r<10?"0":"")+r; }
function bestKey(){ return "L"+PREFS.lvlIdx+"S"+PREFS.setIdx; }
function allBest(){ try{ return JSON.parse(localStorage.getItem("bk_mahjong_best")||"{}")||{}; }catch(e){ return (window.__mjBest=window.__mjBest||{}); } }
function getBest(li,si){ const b=allBest(); return b["L"+li+"S"+si]||0; }
function saveBest(ms){ const b=allBest(); b[bestKey()]=ms; try{ localStorage.setItem("bk_mahjong_best",JSON.stringify(b)); }catch(e){ window.__mjBest=b; } }
// personal best SCORE (higher is better — rewards fast clears + big combos)
function allScore(){ try{ return JSON.parse(localStorage.getItem("bk_mahjong_score")||"{}")||{}; }catch(e){ return (window.__mjScore=window.__mjScore||{}); } }
function getBestScore(li,si){ const b=allScore(); return b["L"+li+"S"+si]||0; }
function saveBestScore(pts){ const b=allScore(); b[bestKey()]=pts; try{ localStorage.setItem("bk_mahjong_score",JSON.stringify(b)); }catch(e){ window.__mjScore=b; } }
const FACE_IMG=[];                // index -> HTMLImageElement for current set (optional; drawn fallback)
let fx = BM?BM.makeFx():{parts:[],pops:[],shake:0,flash:0,flashCol:"#fff"};
let cv, ctx, W=0, H=0, DPR=1;
let view={tileW:44,tileH:58,ox:0,oy:0,lx:6,ly:6};

function curSet(){ return GAME_CONFIG.sets[PREFS.setIdx]||GAME_CONFIG.sets[0]; }
function curLevel(){ return GAME_CONFIG.levels[PREFS.lvlIdx]||GAME_CONFIG.levels[0]; }
function trayMode(){ return curLevel().flames>=3; }   // 3 Fire = holding-tray challenge (you can lose)
function shuffleArr(a){ for(let i=a.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; const t=a[i];a[i]=a[j];a[j]=t; } return a; }

// ---------- LAYOUT (concentric stacked rectangles → classic look, always peelable) ----------
function buildLayout(level){
  const out=[]; let id=0;
  level.layers.forEach((rc,z)=>{
    const cols=rc[0], rows=rc[1];
    const x0=z, y0=z;               // each higher layer inset by 1 half-unit (the pretty stack)
    for(let j=0;j<rows;j++) for(let i=0;i<cols;i++){
      out.push({x:x0+2*i, y:y0+2*j, z:z, id:id++, face:-1, gone:false});
    }
  });
  return out;
}

// ---------- FREE-TILE RULES (standard mahjong solitaire) ----------
function covered(t,arr){
  for(const u of arr){ if(u.gone||u===t) continue;
    if(u.z===t.z+1 && Math.abs(u.x-t.x)<2 && Math.abs(u.y-t.y)<2) return true; }
  return false;
}
function sideBlocked(t,arr,dir){ // dir -2 (left) or +2 (right)
  for(const u of arr){ if(u.gone||u===t) continue;
    if(u.z===t.z && u.x===t.x+dir && Math.abs(u.y-t.y)<2) return true; }
  return false;
}
function isFree(t,arr){
  // A tile is takeable as long as NOTHING is stacked on top of it — no left/right side
  // rule. Any fully-uncovered tile (even in the bottom row) can be picked.
  return !t.gone && !covered(t,arr);
}
function freeTiles(arr){ const f=[]; for(const t of arr){ if(isFree(t,arr)) f.push(t); } return f; }

// ---------- SOLVABLE GENERATOR (reverse "peel": remove free pairs from the full board) ----------
// Playing back the recorded pair order (a1,b1)..(am,bm) from the FULL board is always valid,
// because right before pair k is played the board equals the state pair k was free in.
function assignSolvable(arr, faceCount){
  arr.forEach(t=>{ t.gone=false; t.face=-1; });
  const order=[]; let remaining=arr.length, guard=0;
  while(remaining>0){
    if(++guard>arr.length*4) return null;
    const free=freeTiles(arr);
    if(free.length<2) return null;                 // not peelable (never happens for these layouts)
    shuffleArr(free);
    const a=free[0], b=free[1];
    a.gone=true; b.gone=true; order.push([a.id,b.id]); remaining-=2;
  }
  // hand out faces: balanced bag, shuffled, so the board LOOKS random (each pair shares a face)
  const P=order.length, bag=[];
  for(let k=0;k<P;k++) bag.push(k%faceCount);
  shuffleArr(bag);
  const byId={}; arr.forEach(t=>{ t.gone=false; byId[t.id]=t; });
  order.forEach((pr,k)=>{ byId[pr[0]].face=bag[k]; byId[pr[1]].face=bag[k]; });
  return order;
}

// ---------- BUILD A GAME ----------
function build(){
  const lvl=curLevel(), set=curSet();
  tiles=buildLayout(lvl);
  let ord=null;
  for(let tryN=0; tryN<8 && !ord; tryN++) ord=assignSolvable(tiles, set.count);
  solution=ord||[];
  selId=-1; hintPair=null; state="play";
  history=[]; undosLeft=CAP; hintsLeft=CAP; mixesLeft=CAP; tray=[]; trayShake=0;
  startedAt=Date.now(); elapsedMs=0; isNewBest=false; wonBest=0;
  combo=0; comboUntil=0; score=0; demo=null;
  mistakes=0; wonStars=3; matchAnims=[]; wrongFlash=[];
  if(!headless){ loadSetArt(set); layout(); showChrome(!MJ_DEMO); updateBanner(); updateChrome();
    if(!MJ_DEMO) ensureMusic();
    if(!MJ_DEMO && !demoSeen()) startDemo(); }
}

// ---------- FIRST-PLAY DEMO (shared 3D pointing hand — same mechanic as other games) ----------
function demoSeen(){ try{ return localStorage.getItem("bk_mahjong_demo")==="1"; }catch(e){ return !!window.__mjDemo; } }
function markDemoSeen(){ try{ localStorage.setItem("bk_mahjong_demo","1"); }catch(e){ window.__mjDemo=1; } }
function startDemo(){ const m=availableMatch(); demo = m ? {a:m[0], b:m[1], t:0} : null; }
function endDemo(){ if(demo){ demo=null; markDemoSeen(); } }

// ---------- MOVES ----------
function tileById(id){ for(const t of tiles) if(t.id===id) return t; return null; }
function remaining(){ let n=0; for(const t of tiles) if(!t.gone) n++; return n; }
function availableMatch(){ // a free matching pair among present tiles, or null
  const f=freeTiles(tiles);
  for(let i=0;i<f.length;i++) for(let j=i+1;j<f.length;j++) if(f[i].face===f[j].face) return [f[i].id,f[j].id];
  return null;
}
function celebrateMatch(cx,cy){
  // COMBO: chaining matches quickly makes each one more exciting + worth more
  combo = (nowMs<comboUntil) ? combo+1 : 1; comboUntil = nowMs + 4500;
  const tier = combo>=5?3 : combo>=3?2 : 1;
  score += 10*combo;                                // faster chains => more points
  if(BA){ BA.sfx(tier===3?"match3":tier===2?"match2":"match");
    if(combo>=5 && combo%5===0) BA.sfx("jackpot");        // hit the jackpot on a big streak
    else if(combo>=3 && combo%2===1) BA.sfx("combo"); }   // coin-cascade on a growing streak
  if(BM && !headless){
    const LABELS=["Match!","Nice!","Great!","Awesome!","Amazing!","On fire!","Unstoppable!"];
    const lab=(combo>1?LABELS[Math.min(combo-1,LABELS.length-1)]+"  x"+combo:"Match!");
    const col=tier===3?"#FFD23F":tier===2?"#7CF6B0":"#67E8F9";
    BM.explode(fx, cx, cy, col, {n:Math.min(9+combo*3,28), pop:lab, popCol:"#fff",
      shake:Math.min(0.35,0.06+combo*0.03), flash:Math.min(0.28,0.05+combo*0.03)}); }
}
function flashWrong(id){ const dur=360; wrongFlash=wrongFlash.filter(f=>f.id!==id); wrongFlash.push({id,until:nowMs+dur,dur}); }
function pushMatchAnim(a,b){
  const w=view.tileW, h=view.tileH, pa=tilePx(a), pb=tilePx(b);
  const mx=(pa.x+pb.x)/2, my=(pa.y+pb.y)/2;
  matchAnims.push({face:a.face,x0:pa.x,y0:pa.y,mx,my,w,h,t0:nowMs});
  matchAnims.push({face:b.face,x0:pb.x,y0:pb.y,mx,my,w,h,t0:nowMs});
}
function drawMatchAnims(){
  if(!matchAnims.length) return; const DUR=300;
  for(let i=matchAnims.length-1;i>=0;i--){ const m=matchAnims[i];
    const k=(nowMs-m.t0)/DUR; if(k>=1){ matchAnims.splice(i,1); continue; }
    const e=1-Math.pow(1-k,3), sc=1-0.5*e, al=1-e;
    const cx=(m.x0+(m.mx-m.x0)*e)+m.w/2, cy=(m.y0+(m.my-m.y0)*e)+m.h/2;
    const w=m.w*sc, h=m.h*sc, r=Math.max(4,w*0.14), dx=cx-w/2, dy=cy-h/2;
    ctx.save(); ctx.globalAlpha=al;
    ctx.fillStyle="#fff7df"; rr(ctx,dx,dy,w,h,r); ctx.fill();
    const im=FACE_IMG[m.face], pad=w*0.12, iw=w-pad*2, ih=h-pad*2;
    if(im&&im.complete&&im.naturalWidth){ const s=Math.min(iw/im.naturalWidth,ih/im.naturalHeight);
      const dw=im.naturalWidth*s, dh=im.naturalHeight*s; try{ ctx.drawImage(im,dx+w/2-dw/2,dy+h/2-dh/2,dw,dh); }catch(e){} }
    ctx.restore();
  }
}
function tapTile(t){
  if(state!=="play"||!t||!isFree(t,tiles)) return;
  if(BA&&!MJ_DEMO)BA.unlock();
  hintPair=null;
  if(trayMode()){ tapTray(t); return; }              // HARD mode: holding-tray + game over
  if(selId===t.id){ selId=-1; return; }              // tap again = deselect
  if(selId<0){ selId=t.id; if(BA)BA.sfx("select"); return; }
  const a=tileById(selId), b=t;
  if(a && a.face===b.face){
    if(!headless) pushMatchAnim(a,b);                 // tiles fly together as they pop
    a.gone=true; b.gone=true; selId=-1; history.push([a.id,b.id]);
    if(!headless){ const c1=tileCenter(a), c2=tileCenter(b); celebrateMatch((c1.x+c2.x)/2,(c1.y+c2.y)/2); } else celebrateMatch(0,0);
    updateBanner(); updateChrome();
    if(remaining()===0){ winGame(); }
    else if(!availableMatch()){ autoShuffle(); }     // safety net (uncapped): never let a kid get stuck
  } else {
    // wrong pair — keep the newly tapped one selected (friendly), red wobble on both
    mistakes++; flashWrong(a.id); flashWrong(b.id);
    selId=b.id; combo=0; if(BA)BA.sfx("nomatch"); if(BM&&!headless) BM.shake(fx,0.18);
  }
}
// HARD (3 Fire) TRAY MODE: tapping a free tile sends it up to a holding tray. Tap its
// match on the board and the pair clears from the tray. Park too many un-matched tiles
// (tray already holds TRAY_CAP and you tap a non-match) and it's game over.
function tapTray(t){
  const idx = tray.findIndex(u=>u.face===t.face);
  if(idx>=0){                                        // partner is waiting in the tray -> clear the pair
    t.gone=true; tray.splice(idx,1);
    if(!headless){ const c=tileCenter(t); celebrateMatch(c.x,c.y); } else celebrateMatch(0,0);
    updateBanner(); updateChrome();
    if(remaining()===0 && tray.length===0) winGame();
    return;
  }
  if(tray.length>=TRAY_CAP){ if(BA)BA.sfx("nomatch"); loseGame(); return; }   // no room -> game over
  t.gone=true; tray.push({id:t.id, face:t.face}); combo=0;
  if(tray.length>=TRAY_CAP-1){ trayShake=0.45; if(BM&&!headless) BM.shake(fx,0.22); }
  if(BA)BA.sfx("select"); updateBanner(); updateChrome();
}
function loseGame(){
  state="lose"; showChrome(false);
  if(BA)BA.sfx("lose");
  if(BM&&!headless){ BM.shake(fx,0.5); BM.flash(fx,"#ff6b6b",0.4); }
}
function autoShuffle(){
  const present=tiles.filter(t=>!t.gone);
  // re-run the peel generator on just the remaining tiles → solvable from here on
  let ord=null; for(let n=0;n<8 && !ord;n++) ord=assignSolvable(present, curSet().count);
  selId=-1; hintPair=null; history=[]; combo=0; if(BA)BA.sfx("shuffle");   // scramble is an undo reset point
  if(BM&&!headless){ BM.flash(fx,"#67E8F9",0.4); updateChrome(); }
}
// Recall: put the last matched pair back on the board.
function doUndo(){
  if(trayMode()){                        // hard mode: pull the last parked tile back onto the board
    if(!tray.length) return false;
    const u=tray.pop(); const t=tileById(u.id); if(t) t.gone=false;
    hintPair=null; if(BA)BA.sfx("select"); updateBanner(); updateChrome(); return true;
  }
  if(!history.length) return false;
  const pr=history.pop(); const a=tileById(pr[0]), b=tileById(pr[1]);
  if(a) a.gone=false; if(b) b.gone=false; selId=-1; hintPair=null;
  if(BA)BA.sfx("select"); updateBanner();
  if(!availableMatch()) autoShuffle();   // safety net
  return true;
}
// Hint: highlight an available pair. Returns true only if one was actually shown
// (so a wasted tap on a stuck board doesn't burn a charge — it just safety-mixes).
function trayMatchHint(){   // a free board tile whose match is already parked in the tray
  const f=freeTiles(tiles);
  for(const t of f){ if(tray.some(u=>u.face===t.face)) return [t.id,t.id]; }
  return null;
}
function doHint(){
  if(trayMode()){
    const th=trayMatchHint(); if(th){ hintPair=th; hintUntil=nowMs+1400; if(BA)BA.sfx("select"); return true; }
    const m=availableMatch(); if(m){ hintPair=m; hintUntil=nowMs+1400; if(BA)BA.sfx("select"); return true; }
    return false;   // no auto-shuffle in tray mode — there's always a (risky) move
  }
  const m=availableMatch();
  if(m){ hintPair=m; hintUntil=nowMs+1400; if(BA)BA.sfx("select"); return true; }
  autoShuffle(); return false;
}
function winGame(){
  if(MJ_DEMO){ state="win"; showChrome(false); return; }   // 7I attract: no card/score/saves; the bot restarts us
  elapsedMs=Date.now()-startedAt;
  // SPEED BONUS: clearing faster than "par" (tiles * 1.4s) adds points → quicker = better score
  const parSec=tiles.length*1.4, spent=elapsedMs/1000;
  score += Math.max(0, Math.round((parSec-spent)*15));
  // STARS: 3 for a fast, clean clear; lose one for being slow, one for lots of misses
  wonStars=3;
  if(spent > parSec*1.5) wonStars--;
  if(mistakes > Math.max(3, tiles.length*0.12)) wonStars--;
  wonStars=Math.max(1,wonStars);
  const CHEERS={3:["Perfect!","Superstar!","Wonderful!"],2:["Great job!","Well done!","Nicely done!"],1:["You did it!","Good work!","Cleared!"]};
  const pool=CHEERS[wonStars]; wonCheer=pool[(Math.random()*pool.length)|0];
  const prevScore=getBestScore(PREFS.lvlIdx,PREFS.setIdx);
  if(!headless){ isNewBest=(score>prevScore); if(isNewBest) saveBestScore(score); wonBest=isNewBest?score:prevScore;
    const pt=getBest(PREFS.lvlIdx,PREFS.setIdx); if(elapsedMs && (!pt||elapsedMs<pt)) saveBest(elapsedMs); }
  state="win"; showChrome(false);
  if(BA)BA.sfx("win");
  if(BM&&!headless){ const conf=["#FFD23F","#7CF6B0","#67E8F9","#ff9ec4","#9B7BFF"];
    for(let i=0;i<7;i++) BM.explode(fx, W*(0.12+0.13*i), H*(0.30+0.12*(i%2)), conf[i%conf.length], {n:26, shake:i===3?0.3:0, flash:i===3?0.25:0, pop:i===3?wonCheer:""}); }
  try{ if(window.parent) window.parent.postMessage({source:"buildable",kind:"win",
    meta:{ game:"mahjong", score:score, best:Math.max(score,wonBest||0), newBest:!!isNewBest,
      timeMs:elapsedMs, level:curLevel().name, set:curSet().name } },"*"); }catch(e){}
}

// ---------- VIEW / DRAW ----------
function bounds(){
  let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9,maxZ=0;
  for(const t of tiles){ minX=Math.min(minX,t.x); maxX=Math.max(maxX,t.x+2);
    minY=Math.min(minY,t.y); maxY=Math.max(maxY,t.y+2); maxZ=Math.max(maxZ,t.z); }
  return {minX,maxX,minY,maxY,maxZ};
}
function layout(){
  if(!tiles.length) return;
  const vw=(W&&isFinite(W)&&W>0)?W:900, vh=(H&&isFinite(H)&&H>0)?H:600;
  const b=bounds();
  const cols=(b.maxX-b.minX)/2, rows=(b.maxY-b.minY)/2;
  const topRes=52;                              // space for the top banner
  const botRes=trayMode()?(Math.min(52,(vw*0.72)/TRAY_CAP)+40):0;   // reserve a bottom strip for the hard-mode tray
  // fill as much of the screen as possible (whole-screen on iPad/iPhone)
  const availW=vw*0.985, availH=((vh-botRes)-topRes-6)*0.995;
  // tile aspect ~ 1.3 tall; reserve room for the layer lift (maxZ)
  let tw=Math.min(availW/(cols+0.9), availH/((rows*1.3)+0.9));
  tw=Math.max(18,Math.min(tw,140));            // allow big tiles on large iPad screens
  view.tileW=tw; view.tileH=tw*1.3; view.lx=tw*0.14; view.ly=tw*0.14;
  // pixel extents (include lift) to center
  let pminX=1e9,pmaxX=-1e9,pminY=1e9,pmaxY=-1e9;
  for(const t of tiles){ const px=(t.x-b.minX)/2*view.tileW - t.z*view.lx;
    const py=(t.y-b.minY)/2*view.tileH - t.z*view.ly;
    pminX=Math.min(pminX,px); pmaxX=Math.max(pmaxX,px+view.tileW);
    pminY=Math.min(pminY,py); pmaxY=Math.max(pmaxY,py+view.tileH); }
  view.b=b;
  view.ox=(vw-(pmaxX-pminX))/2 - pminX;
  view.oy=topRes + ((vh-botRes)-topRes-(pmaxY-pminY))/2 - pminY;
}
function tilePx(t){ return { x:view.ox+(t.x-view.b.minX)/2*view.tileW - t.z*view.lx,
                             y:view.oy+(t.y-view.b.minY)/2*view.tileH - t.z*view.ly }; }
function tileCenter(t){ const p=tilePx(t); return {x:p.x+view.tileW/2, y:p.y+view.tileH/2}; }
function rr(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }

  const th=Math.max(3,w*0.11);

  const wf=wrongFlash.find(f=>f.id===t.id && nowMs<f.until);
  const wob = wf ? Math.sin(nowMs*0.045)*((wf.until-nowMs)/wf.dur)*5 : 0;
  ctx.save(); if(wob) ctx.translate(wob,0);

  if(wf){ ctx.lineWidth=w*0.07; ctx.strokeStyle="rgba(255,90,90,"+((wf.until-nowMs)/wf.dur)+")"; rr(ctx,p.x-2,p.y-2,w+4,h+4,r+2); ctx.stroke(); }

}
function drawDemo(){

function drawTray(){
  const vw=(W&&isFinite(W)&&W>0)?W:900, vh=(H&&isFinite(H)&&H>0)?H:600;
  const n=TRAY_CAP, slot=Math.min(52,(vw*0.72)/n), gap=slot*0.22;
  const totW=n*slot+(n-1)*gap, y0=vh-slot-18, x0=(vw-totW)/2;
  // little label above the tray so kids know what it is
  ctx.save(); ctx.globalAlpha=0.9; ctx.textAlign="center"; ctx.textBaseline="alphabetic";
  ctx.fillStyle= tray.length>=TRAY_CAP?"#ff9a8a":(tray.length>=TRAY_CAP-1?"#ffd27a":"#e6eefc");
  ctx.font="800 12px 'Baloo 2',Nunito,sans-serif";
  ctx.fillText(tray.length>=TRAY_CAP?"Tray full — match one!":"Tray  ("+tray.length+"/"+TRAY_CAP+")", vw/2, y0-gap*1.4); ctx.restore();
  const sh = trayShake>0 ? (Math.random()*2-1)*trayShake*6 : 0;
  ctx.save(); ctx.translate(sh,0);
  const filled=tray.length;

  rr(ctx, x0-gap, y0-gap*0.9, totW+gap*2, slot+gap*1.8, 14); ctx.fillStyle=warn; ctx.fill();

        const dw=im.naturalWidth*sc, dh=im.naturalHeight*sc;

function drawStar(cx,cy,R,filled,ms){

let bgImg=null, bgKey=null;
function curWorld(){ return (GAME_CONFIG.worlds||[]).find(w=>w.key===PREFS.worldKey)||(GAME_CONFIG.worlds||[])[0]||{key:"garden",grad:["#9cc2d6","#3d7a76"],p:"petal"}; }
function loadBg(){

let _parts=[], _partKey=null, _lastPMs=0;
function seedParticles(){ const p=curWorld().p; _parts=[]; const n=(p==="star")?46:26;
  for(let i=0;i<n;i++) _parts.push({x:Math.random(),y:Math.random(),r:0.5+Math.random(),sp:0.25+Math.random()*0.6,sw:Math.random()*6.28,ph:Math.random()*6.28});
  _partKey=p; }
function drawParticles(c,W,H){
  const p=curWorld().p; if(_partKey!==p) seedParticles();
  const dt=_lastPMs?Math.min(0.05,(nowMs-_lastPMs)/1000):0; _lastPMs=nowMs;
  const U=Math.max(6,Math.min(W,H)/85);
  c.save();
  for(const q of _parts){
    if(p==="star"){
      c.globalAlpha=(0.3+0.6*(0.5+0.5*Math.sin(nowMs*0.002*q.sp*3+q.ph)))*0.9; c.fillStyle="#fff";
      c.beginPath(); c.arc(q.x*W,q.y*H,q.r*U*0.32,0,7); c.fill(); continue;
    }
    q.y+=dt*q.sp*0.05; q.sw+=dt*1.5;
    if(q.y>1.06){ q.y=-0.05; q.x=Math.random(); }
    const x=(q.x+Math.sin(q.sw)*0.02)*W, y=q.y*H, s=q.r*U;
    c.globalAlpha=0.5;
    if(p==="snow"){ c.fillStyle="#fff"; c.beginPath(); c.arc(x,y,s*0.38,0,7); c.fill(); }
    else if(p==="leaf"){ c.fillStyle="#7bbf72"; c.save(); c.translate(x,y); c.rotate(q.sw); c.beginPath(); c.ellipse(0,0,s*0.55,s*0.26,0,0,7); c.fill(); c.restore(); }
    else if(p==="sprinkle"){ const cols=["#ff9ec4","#ffe27a","#7ee0a0","#9fd0ff"]; c.fillStyle=cols[(q.ph*7|0)%4]; c.save(); c.translate(x,y); c.rotate(q.sw); c.fillRect(-s*0.1,-s*0.38,s*0.2,s*0.76); c.restore(); }
    else { c.fillStyle="rgba(255,200,222,0.9)"; c.save(); c.translate(x,y); c.rotate(q.sw*0.5); c.beginPath(); c.ellipse(0,0,s*0.5,s*0.27,0,0,7); c.fill(); c.restore(); }
  }
  c.restore(); c.globalAlpha=1;
}
function drawBackdrop(c,W,H,ms){
  const wd=curWorld();
  let g=c.createLinearGradient(0,0,0,H);
  g.addColorStop(0,wd.grad[0]); g.addColorStop(1,wd.grad[1]);
  c.fillStyle=g; c.fillRect(0,0,W,H);
  if(bgImg){
    const iw=bgImg.naturalWidth||bgImg.width, ih=bgImg.naturalHeight||bgImg.height;
    if(iw&&ih){ const s=Math.max(W/iw,H/ih), bw=iw*s, bh=ih*s;
      try{ c.drawImage(bgImg,(W-bw)/2,(H-bh)/2,bw,bh); }catch(e){} }
  } else if(wd.key==="garden"){
    drawScene(c,W,H,ms);   // gorgeous drawn koi pond while the painted art loads
  }
  // soft center light so the cream tiles always pop
  let vg=c.createRadialGradient(W/2,H*0.5,Math.min(W,H)*0.24,W/2,H*0.5,Math.max(W,H)*0.72);
  vg.addColorStop(0,"rgba(255,252,240,0.12)"); vg.addColorStop(1,"rgba(10,16,30,0.30)");
  c.fillStyle=vg; c.fillRect(0,0,W,H);
  drawParticles(c,W,H);
}

// ---------- SERENE GARDEN / KOI-POND BACKDROP (procedural, gently animated) ----------
// Calm koi-pond scene drawn behind the tiles: dawn sky, swaying bamboo, hanging
// paper lanterns, a teal pond with shimmering ripples, lily pads + lotus, and a few
// koi that slowly swim. Kept soft/low-contrast so the cream tiles still pop.
const KOI=[
  {cx:0.27, cy:0.52, rx:0.15, ry:0.10, sp:0.34, ph:0.0, col:"#ef6d3a", patch:"#fff3e6", sc:1.15},
  {cx:0.71, cy:0.70, rx:0.16, ry:0.09, sp:0.27, ph:2.2, col:"#f6f1e8", patch:"#ef6d3a", sc:1.00},
  {cx:0.50, cy:0.86, rx:0.21, ry:0.055,sp:0.40, ph:4.1, col:"#e7a233", patch:"#fff3e6", sc:0.88},
];
function drawScene(c,W,H,ms){
  const t=ms/1000, horizon=Math.round(H*0.40), waterH=H-horizon;
  const U=Math.max(11,Math.min(W,H)/620*18); // unit scale for props
  // --- sky ---
  let g=c.createLinearGradient(0,0,0,horizon);
  g.addColorStop(0,"#9cc2d6"); g.addColorStop(0.6,"#c6dcda"); g.addColorStop(1,"#e6e6cd");
  c.fillStyle=g; c.fillRect(0,0,W,horizon+2);
  // soft morning sun
  const sx=W*0.78, sy=horizon*0.46, sr=horizon*0.95;
  let sg=c.createRadialGradient(sx,sy,4,sx,sy,sr);
  sg.addColorStop(0,"rgba(255,247,220,0.9)"); sg.addColorStop(1,"rgba(255,247,220,0)");
  c.fillStyle=sg; c.fillRect(0,0,W,horizon+2);
  // --- bamboo grove (edges, so the center stays open for tiles) ---
  drawBamboo(c,W,horizon,t);
  // --- hanging paper lanterns ---
  const lsz=Math.max(13,Math.min(W,H)*0.045);
  drawLantern(c, W*0.19, -2, lsz, t, 0.0);
  drawLantern(c, W*0.83, -2, lsz*0.92, t, 1.6);
  // --- water ---
  g=c.createLinearGradient(0,horizon,0,H);
  g.addColorStop(0,"#bfd9cd"); g.addColorStop(0.14,"#7fb1a7"); g.addColorStop(1,"#3d7a76");
  c.fillStyle=g; c.fillRect(0,horizon,W,waterH);
  c.fillStyle="rgba(255,250,232,0.30)"; c.fillRect(0,horizon,W,3); // waterline shine
  // sun reflection column on the water
  let rg=c.createLinearGradient(0,horizon,0,H);
  rg.addColorStop(0,"rgba(255,247,214,0.35)"); rg.addColorStop(1,"rgba(255,247,214,0)");
  c.save(); c.fillStyle=rg;
  c.beginPath(); c.moveTo(sx-U*1.2,horizon); c.lineTo(sx+U*1.2,horizon);
  c.lineTo(sx+U*3.4,H); c.lineTo(sx-U*3.4,H); c.closePath(); c.fill(); c.restore();
  // shimmering ripple lines
  c.save();
  for(let i=0;i<12;i++){
    const yy=horizon+(i+1)/13*waterH, amp=0.6+i*0.55;
    c.strokeStyle="rgba(255,255,255,"+(0.08+0.03*Math.sin(t*0.8+i))+")";
    c.lineWidth=1+i*0.13; c.beginPath();
    for(let xx=0;xx<=W;xx+=16){ const yo=Math.sin(xx*0.018+t*0.9+i*0.6)*amp;
      xx===0?c.moveTo(xx,yy+yo):c.lineTo(xx,yy+yo); }
    c.stroke();
  }
  c.restore();
  // --- lily pads (edges) + one lotus ---
  drawLily(c, W*0.11, horizon+waterH*0.74, U*1.5, t, 0.3, true);
  drawLily(c, W*0.90, horizon+waterH*0.44, U*1.15, t, 1.1, false);
  drawLily(c, W*0.83, horizon+waterH*0.86, U*1.35, t, 2.0, false);
  // --- koi (compute a gentle swim path + heading) ---
  for(const k of KOI){
    const a=t*k.sp+k.ph;
    const x=W*k.cx+Math.cos(a)*W*k.rx;
    const y=horizon+waterH*k.cy+Math.sin(a*1.3)*waterH*k.ry;
    const vx=-Math.sin(a)*W*k.rx*k.sp, vy=Math.cos(a*1.3)*waterH*k.ry*k.sp*1.3;
    const ang=Math.atan2(vy,vx), wag=Math.sin(t*6+k.ph)*0.38;
    drawKoi(c,x,y,ang,wag,U*0.052*k.sc,k.col,k.patch);
  }
  // gentle depth vignette so tiles in the center read clearly
  let vg=c.createRadialGradient(W/2,H*0.52,Math.min(W,H)*0.28,W/2,H*0.52,Math.max(W,H)*0.72);
  vg.addColorStop(0,"rgba(20,40,44,0)"); vg.addColorStop(1,"rgba(16,30,36,0.28)");
  c.fillStyle=vg; c.fillRect(0,0,W,H);
}
function drawBamboo(c,W,horizon,t){
  const cl=[0.045,0.095,0.14, 0.865,0.915,0.96];
  c.save(); c.globalAlpha=0.5; c.lineCap="round";
  cl.forEach((fx,i)=>{
    const x=fx*W, sway=Math.sin(t*0.5+i)*5, h=horizon*(0.82+(i%3)*0.07), top=horizon-h;
    const w=Math.max(4.5,W*0.011);
    c.strokeStyle="#6f9f6a"; c.lineWidth=w;
    c.beginPath(); c.moveTo(x,horizon);
    c.quadraticCurveTo(x+sway*0.5,(horizon+top)/2,x+sway,top); c.stroke();
    c.strokeStyle="#5b8557"; c.lineWidth=w*1.15;
    for(let s=0;s<5;s++){ const ny=horizon-(s+0.5)/5*h, nx=x+sway*((horizon-ny)/h);
      c.beginPath(); c.moveTo(nx-w*0.6,ny); c.lineTo(nx+w*0.6,ny); c.stroke(); }
    c.fillStyle="#79ac72";
    for(let l=0;l<4;l++){ const a=-0.6+l*0.4, lx=x+sway, ly=top+l*6;
      c.save(); c.translate(lx,ly); c.rotate(a);
      c.beginPath(); c.ellipse(w*2.2,0,w*3,w*0.9,0,0,7); c.fill(); c.restore(); }
  });
  c.restore();
}
function drawLantern(c,x,topY,size,t,phase){
  const sway=Math.sin(t*0.8+phase)*0.12, len=size*2.4;
  const lx=x+Math.sin(sway)*len, ly=topY+Math.cos(sway)*len;
  c.save();
  c.strokeStyle="rgba(70,48,34,0.55)"; c.lineWidth=Math.max(1,size*0.07);
  c.beginPath(); c.moveTo(x,topY); c.lineTo(lx,ly); c.stroke();
  let gg=c.createRadialGradient(lx,ly,size*0.3,lx,ly,size*2.1);
  gg.addColorStop(0,"rgba(255,150,90,0.45)"); gg.addColorStop(1,"rgba(255,150,90,0)");
  c.fillStyle=gg; c.beginPath(); c.arc(lx,ly,size*2.1,0,7); c.fill();
  c.fillStyle="#d94f3d"; c.beginPath(); c.ellipse(lx,ly,size*0.82,size,0,0,7); c.fill();
  c.strokeStyle="rgba(255,220,180,0.4)"; c.lineWidth=size*0.05;
  c.beginPath(); c.ellipse(lx,ly,size*0.42,size*0.92,0,0,7); c.stroke();
  c.fillStyle="#b83a2c";
  c.fillRect(lx-size*0.42,ly-size*1.02,size*0.84,size*0.16);
  c.fillRect(lx-size*0.42,ly+size*0.86,size*0.84,size*0.16);
  c.strokeStyle="#e8b64a"; c.lineWidth=size*0.1;
  c.beginPath(); c.moveTo(lx,ly+size); c.lineTo(lx,ly+size*1.45); c.stroke();
  c.restore();
}
function drawLily(c,x,y,r,t,ph,lotus){
  const wob=Math.sin(t*0.6+ph)*2;
  c.save(); c.translate(x,y+wob);
  c.fillStyle="rgba(38,86,68,0.8)";
  c.beginPath(); c.arc(0,0,r,0.55,Math.PI*2+0.15); c.lineTo(0,0); c.closePath(); c.fill();
  c.fillStyle="rgba(120,182,150,0.35)";
  c.beginPath(); c.arc(-r*0.18,-r*0.18,r*0.5,0.7,Math.PI*2); c.fill();
  if(lotus){
    const R=r*0.6;
    c.fillStyle="#f4a6c0";
    for(let p=0;p<6;p++){ const a=p/6*Math.PI*2; c.save(); c.rotate(a);
      c.beginPath(); c.ellipse(0,-R*0.55,R*0.28,R*0.6,0,0,7); c.fill(); c.restore(); }
    c.fillStyle="#fbd6e2";
    for(let p=0;p<5;p++){ const a=p/5*Math.PI*2+0.3; c.save(); c.rotate(a);
      c.beginPath(); c.ellipse(0,-R*0.4,R*0.2,R*0.42,0,0,7); c.fill(); c.restore(); }
    c.fillStyle="#f6d873"; c.beginPath(); c.arc(0,0,R*0.24,0,7); c.fill();
  }
  c.restore();
}
function drawKoi(c,x,y,ang,wag,s,col,patch){
  const L=42*s, Wd=17*s;
  c.save(); c.translate(x,y); c.rotate(ang); c.globalAlpha=0.93;
  // tail (wagging)
  c.save(); c.translate(-L*0.4,0); c.rotate(wag); c.fillStyle=col;
  c.beginPath(); c.moveTo(0,0);
  c.quadraticCurveTo(-L*0.34,-Wd*0.7,-L*0.5,-Wd*0.55);
  c.quadraticCurveTo(-L*0.34,0,-L*0.5,Wd*0.55);
  c.quadraticCurveTo(-L*0.34,Wd*0.7,0,0); c.fill(); c.restore();
  // pectoral fins
  c.fillStyle=col; c.globalAlpha=0.8;
  c.beginPath(); c.ellipse(L*0.05,-Wd*0.45,L*0.15,Wd*0.2,-0.5,0,7); c.fill();
  c.beginPath(); c.ellipse(L*0.05, Wd*0.45,L*0.15,Wd*0.2, 0.5,0,7); c.fill();
  c.globalAlpha=0.93;
  // body
  c.fillStyle=col; c.beginPath(); c.moveTo(L*0.5,0);
  c.quadraticCurveTo(L*0.2,-Wd*0.5,-L*0.34,-Wd*0.28);
  c.quadraticCurveTo(-L*0.44,0,-L*0.34,Wd*0.28);
  c.quadraticCurveTo(L*0.2,Wd*0.5,L*0.5,0); c.fill();
  // patches
  c.fillStyle=patch;
  c.beginPath(); c.ellipse(-L*0.02,0,L*0.16,Wd*0.3,0,0,7); c.fill();
  c.beginPath(); c.ellipse(L*0.25,-Wd*0.06,L*0.1,Wd*0.18,0,0,7); c.fill();
  // eyes
  c.fillStyle="#2a2320";
  c.beginPath(); c.arc(L*0.36,-Wd*0.17,Wd*0.08,0,7); c.fill();
  c.beginPath(); c.arc(L*0.36, Wd*0.17,Wd*0.08,0,7); c.fill();
  c.restore();
}
function draw(){
  if(!ctx) return;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  // serene garden / koi-pond backdrop (procedural, gently animated)
  drawBackdrop(ctx,W,H,nowMs);
  const so=(BM&&fx)?BM.shakeOffset(fx):{x:0,y:0};
  ctx.save(); ctx.translate(so.x,so.y);
  if(!view.b && tiles.length) layout();
  // paint back-to-front: lower z first, then top rows, so covers read correctly
  const order=tiles.filter(t=>!t.gone).sort((a,b)=> a.z-b.z || a.y-b.y || a.x-b.x );
  for(const t of order) drawTile(t);
  drawMatchAnims();
  ctx.restore();
  if(BM){ BM.draw(ctx,fx,{W:W,H:H}); }
  if(trayMode() && state!=="menu") drawTray();
  if(demo && state==="play") drawDemo();
  if(MJ_DEMO && state==="play" && mjBot && mjBot.hand && BR && BR.hand){
    const _hs=Math.max(0.95,(view.tileW||46)/46);
    try{ BR.hand(ctx, mjBot.hand.x, mjBot.hand.y+26*_hs+mjBot.dip*7, _hs); }catch(e){}
  }
  if(state==="win"&&!MJ_DEMO) drawWin();
  if(state==="lose"&&!MJ_DEMO) drawLose();
  return "ok";
}

// ---------- HIT TEST (front-most free tile under the point) ----------
function pick(mx,my){
  const order=tiles.filter(t=>!t.gone).sort((a,b)=> b.z-a.z || b.y-a.y || b.x-a.x ); // front first
  for(const t of order){ const p=tilePx(t);
    if(mx>=p.x && mx<=p.x+view.tileW && my>=p.y && my<=p.y+view.tileH) return t; }
  return null;
}

function flameIcon(n){ // draw n flames → dataURL (no emoji, on-brand)

    const c=document.createElement("canvas"); c.width=180; c.height=150; const x=c.getContext("2d");

function flameShape(x,cx,cy,w,h){ x.beginPath(); x.moveTo(cx,cy-h);

  cv.width=W*DPR; cv.height=H*DPR; if(state==="play") layout(); }
let _last=0;
function frame(ts){ if(!_last)_last=ts; let dt=(ts-_last)/1000; _last=ts; if(dt>0.05)dt=0.05;
  nowMs+=dt*1000; if(BM)BM.update(fx,dt); if(demo) demo.t+=dt; if(trayShake>0)trayShake=Math.max(0,trayShake-dt*1.5);

    star:"/fx/star_07.png", ring:"/fx/circle_01.png", smoke:"/fx/smoke_05.png", magic:"/fx/magic_05.png" });
  if(MJ_DEMO){ if(BA)BA.muted=true;                                    // 7I attract: small board, silent, no menus
    PREFS.lvlIdx=0; document.getElementById("start").classList.add("hide"); build(); }
  else if(MJ_LEVEL!=null){                                             // 7I deep-link: same as tapping that level card
    PREFS.lvlIdx=Math.max(0,Math.min(GAME_CONFIG.levels.length-1,MJ_LEVEL));
    document.getElementById("start").classList.add("hide"); build(); }
  else showMenu();
  requestAnimationFrame(frame);
}

// ---------- Session 7I attract bot: the Hint brain picks a free matching pair,
// the tutorial hand GLIDES to one tile (capped per-frame step -- never teleports),
// taps it, pauses, then glides to its match. Quiet restart ~1.2s after a clear. ----
let mjBot={ phase:"pick", a:-1, b:-1, wait:0.8, hand:null, dip:0, restart:0 };
function mjDemoTick(dt){
  if(state==="win"||state==="lose"){ mjBot.restart+=dt;
    if(mjBot.restart>=1.2){ mjBot.restart=0; mjBot.phase="pick"; mjBot.wait=0.6; build(); }
    return; }
  if(state!=="play"||!tiles.length||!view.b) return;
  if(!mjBot.hand) mjBot.hand={x:W/2,y:H+40};
  mjBot.dip=Math.max(0,mjBot.dip-dt*4);
  if(mjBot.wait>0){ mjBot.wait-=dt; return; }
  if(mjBot.phase==="pick"){
    const m=availableMatch();                 // same free-pair logic Hint uses
    if(!m){ mjBot.wait=0.5; return; }         // engine auto-mixes; try again shortly
    mjBot.a=m[0]; mjBot.b=m[1]; mjBot.phase="goA";
    hintPair=m; hintUntil=nowMs+2600;         // green glow = the pair the "player" spotted
  }
  const glide=(id,next)=>{
    const t=tileById(id);
    if(!t||t.gone||!isFree(t,tiles)){ mjBot.phase="pick"; return; }
    const c=tileCenter(t);
    const dx=c.x-mjBot.hand.x, dy=c.y-mjBot.hand.y, d=Math.hypot(dx,dy);
    const STEP=Math.max(6,Math.min(W,H)*0.018);   // capped step -- glide, never teleport
    if(d>STEP){ mjBot.hand.x+=dx/d*STEP; mjBot.hand.y+=dy/d*STEP; return; }
    mjBot.hand.x=c.x; mjBot.hand.y=c.y; mjBot.dip=1;
    const hp=hintPair; tapTile(t); hintPair=hp;    // keep the pair glow through the first tap
    mjBot.phase=next; mjBot.wait=(next==="pick")?1.0:0.7;
    if(next==="pick") hintPair=null;
  };
  if(mjBot.phase==="goA") glide(mjBot.a,"goB");
  else if(mjBot.phase==="goB") glide(mjBot.b,"pick");
}

// ---------- QA / SIM HOOKS ----------
function headlessBegin(opts){ headless=true; opts=opts||{};
  PREFS.setIdx=opts.setIdx||0; PREFS.lvlIdx=opts.lvlIdx!=null?opts.lvlIdx:0; build(); }
// Replay the guaranteed solution, VALIDATING each pair is actually free at removal
// time (this exercises the free-tile rules, not just the generator).
function simSolution(opts){
  headlessBegin(opts);
  let moves=0, bad=0;
  for(const pr of solution){ const a=tileById(pr[0]), b=tileById(pr[1]);
    if(!isFree(a,tiles)||!isFree(b,tiles)||a.face!==b.face) bad++;
    a.gone=true; b.gone=true; moves++; }
  return { result: remaining()===0?"win":"stuck", cleared: remaining()===0, moves, illegal:bad,
           tiles: tiles.length };
}
// A greedy player that only removes currently-available free matches, and mixes when
// stuck — proves the "never stuck" guarantee holds under real play.
function simGreedy(opts){
  headlessBegin(opts);
  let moves=0, mixes=0, guard=0;
  while(remaining()>0){ if(++guard>tiles.length*20) break;
    const m=availableMatch();
    if(m){ tileById(m[0]).gone=true; tileById(m[1]).gone=true; moves++; }
    else { const present=tiles.filter(t=>!t.gone); let o=null;
      for(let n=0;n<8&&!o;n++) o=assignSolvable(present,curSet().count); mixes++;
      if(mixes>60) break; }
  }
  return { result: remaining()===0?"win":"stuck", cleared: remaining()===0, moves, mixes };
}
// Prove HARD tray mode is winnable with good play: playing the guaranteed solution
// order (park a, then match b) keeps the tray tiny and always clears without a loss.
function simTray(opts){
  headlessBegin(Object.assign({}, opts||{}, {lvlIdx:2}));   // force 3 Fire (tray) level
  let maxTray=0, moves=0;
  for(const pr of solution){
    const a=tileById(pr[0]), b=tileById(pr[1]);
    tapTray(a); maxTray=Math.max(maxTray,tray.length);
    tapTray(b); maxTray=Math.max(maxTray,tray.length); moves+=2;
    if(state==="lose") break;
  }
  return { result:(remaining()===0&&tray.length===0)?"win":"stuck", cleared:remaining()===0,
           maxTray, cap:TRAY_CAP, moves, lost:state==="lose" };
}
window.MAHJONG_GAME = {
  state:()=>state,
  begin:(o)=>headlessBegin(o),
  sim:(o)=>simSolution(o),
  simGreedy:(o)=>simGreedy(o),
  simTray:(o)=>simTray(o),
  campaign:()=>{ const out=[];
    GAME_CONFIG.levels.forEach((lv,li)=>{ GAME_CONFIG.sets.forEach((st,si)=>{
      const r=simSolution({lvlIdx:li,setIdx:si}); const gr=simGreedy({lvlIdx:li,setIdx:si});
      out.push({ level:lv.name, set:st.name, tiles:r.tiles, cleared:r.cleared, illegal:r.illegal,
                 greedyCleared:gr.cleared, mixes:gr.mixes }); }); });
    return out; },
  _draw:()=>{ try{ return draw(); }catch(e){ return "ERR:"+(e&&e.message||e); } },
  _cfg:()=>GAME_CONFIG, _prefs:()=>PREFS, _remaining:()=>remaining(),
  _win:()=>{ if(state==="play") winGame(); return {elapsedMs, score, isNewBest, wonBest}; },   // QA: force the win overlay
  _score:()=>({score, combo}),
  _demo:()=>{ startDemo(); return !!demo; },   // QA: force the first-play demo
};
window.BUILDABLE_GAME = window.MAHJONG_GAME;
</script>
