<style>
  html,body{margin:0;height:100%;background:#101a2e;overflow:hidden;font-family:'Nunito',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
  #wrap{position:fixed;inset:0}

  .cbtn{width:48px;height:48px;border-radius:50%;border:1px solid rgba(255,255,255,.22);background:rgba(16,26,46,.62);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;padding:0}

  /* customize (tile-set picker) */

  .csheet{width:100%;max-width:440px;background:#16223c;border:1px solid rgba(255,255,255,.09);border-radius:22px;padding:20px;color:#fff}

</style>

<body>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="banner" class="hide"><span id="bLeft">Tiles left: 0</span><span id="bTime" style="opacity:.85">0:00</span></div>
  <div id="ctrls" class="hide">
    <button class="cbtn" id="soundBtn" aria-label="Sound"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9v6h4l5 4V5L9 9z"/><path d="M17 8a5 5 0 0 1 0 8"/></svg></button>
    <button class="cbtn" id="undoBtn" aria-label="Recall last move"><span>Recall</span><b id="undoN">3</b></button>
    <button class="cbtn" id="hintBtn" aria-label="Hint"><span>Hint</span><b id="hintN">3</b></button>
    <button class="cbtn" id="shufBtn" aria-label="Scramble"><span>Mix</span><b id="mixN">3</b></button>
  </div>
  <div id="start" class="ov"></div>
  <div id="cust" class="hide"><div class="csheet">
    <p class="ctitle">Pick your tiles</p>
    <p class="csub">Choose the pictures you want to match</p>
    <div class="cgrid" id="setGrid"></div>
    <button class="cdone" id="custDone">Done</button>
  </div></div>
</div>

<script src="buildable-renders.js"></script>
<script src="buildable-audio.js"></script>
<script src="buildable-mechanics.js"></script>
<script src="buildable-startscreen.js"></script>
<script>
//  Buildable Mahjong (Solitaire) — hand-authored Track B engine.
//  A game = this FIXED engine + GAME_CONFIG (data). Solo tile-matching puzzle.
//  Shared libs: BR (art fallback), BA (sound), BM (juice), BS (start screen).
//  ALWAYS-WINNABLE: boards are generated solvable (reverse "peel" builder), and the
//  game auto-reshuffles (still solvable) whenever no move is left, so a kid can never
//  get stuck. QA hook: window.MAHJONG_GAME (sim replays the guaranteed solution).
const BA=(typeof window!=="undefined"&&window.BuildableAudio)||globalThis.BuildableAudio;
const BM=(typeof window!=="undefined"&&window.BuildableMechanics)||globalThis.BuildableMechanics;
const BS=(typeof window!=="undefined"&&window.BuildableStartScreen)||globalThis.BuildableStartScreen;

// ---------- DATA ----------
const GAME_CONFIG = (typeof window!=="undefined"&&window.GAME_CONFIG) || {
  title:"Mahjong",
  base:"/game-assets/mahjong-tiles/",
  // tile-face sets the kid can pick — CC0 Kenney art (see LICENSE.txt in that folder)
  sets:[
    {key:"animals",  name:"Animals",  count:24},
    {key:"cards",    name:"Cards",    count:24},
    {key:"candy",    name:"Candy",    count:20},
    {key:"shapes",   name:"Shapes",   count:24},
    {key:"stickers", name:"Stickers", count:20},
  ],
  // 1 / 2 / 3 fire difficulty = board size (concentric stacked rectangles; all peelable)
  levels:[
    {key:"one",   name:"1 Fire", flames:1, foot:"Small board",  layers:[[6,4],[4,3]]},                 // 36 tiles
    {key:"two",   name:"2 Fire", flames:2, foot:"Medium board", layers:[[8,5],[6,4],[4,2]]},           // 72 tiles
    {key:"three", name:"3 Fire", flames:3, foot:"Big board",    layers:[[10,6],[8,4],[6,3],[4,1]]},    // 114 tiles
  ],
};

// ---------- STATE ----------
let state="menu";                 // menu | play | win
let tiles=[];                     // {x,y,z,id,face,gone}
let solution=[];                  // recorded guaranteed-solvable pair order [[idA,idB],...]
let selId=-1;                     // currently selected free tile id
let hintPair=null, hintUntil=0;
let history=[];                   // stack of removed [idA,idB] pairs (for Recall/undo)
const CAP=3;                      // each helper (Recall / Hint / Mix) is capped at 3 per game
let undosLeft=CAP, hintsLeft=CAP, mixesLeft=CAP;
let nowMs=0, headless=false;
let PREFS={ setIdx:0, lvlIdx:0 };
let startedAt=0, elapsedMs=0, isNewBest=false, wonBest=0;   // clear timer + personal best

// ---------- BEST TIME (per difficulty+set, saved on this device) ----------
function fmtTime(ms){ const s=Math.max(0,Math.round(ms/1000)); const m=(s/60)|0; const r=s%60; return m+":"+(r<10?"0":"")+r; }
function bestKey(){ return "L"+PREFS.lvlIdx+"S"+PREFS.setIdx; }
function allBest(){ try{ return JSON.parse(localStorage.getItem("bk_mahjong_best")||"{}")||{}; }catch(e){ return (window.__mjBest=window.__mjBest||{}); } }
function getBest(li,si){ const b=allBest(); return b["L"+li+"S"+si]||0; }
function saveBest(ms){ const b=allBest(); b[bestKey()]=ms; try{ localStorage.setItem("bk_mahjong_best",JSON.stringify(b)); }catch(e){ window.__mjBest=b; } }
const FACE_IMG=[];                // index -> HTMLImageElement for current set (optional; drawn fallback)
let fx = BM?BM.makeFx():{parts:[],pops:[],shake:0,flash:0,flashCol:"#fff"};
let cv, ctx, W=0, H=0, DPR=1;
let view={tileW:44,tileH:58,ox:0,oy:0,lx:6,ly:6};

function curSet(){ return GAME_CONFIG.sets[PREFS.setIdx]||GAME_CONFIG.sets[0]; }
function curLevel(){ return GAME_CONFIG.levels[PREFS.lvlIdx]||GAME_CONFIG.levels[0]; }
function shuffleArr(a){ for(let i=a.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; const t=a[i];a[i]=a[j];a[j]=t; } return a; }

// ---------- LAYOUT (concentric stacked rectangles → classic look, always peelable) ----------
function buildLayout(level){
  const out=[]; let id=0;
  level.layers.forEach((rc,z)=>{
    const cols=rc[0], rows=rc[1];
    const x0=z, y0=z;               // each higher layer inset by 1 half-unit (the pretty stack)
    for(let j=0;j<rows;j++) for(let i=0;i<cols;i++){
      out.push({x:x0+2*i, y:y0+2*j, z:z, id:id++, face:-1, gone:false});
    }
  });
  return out;
}

// ---------- FREE-TILE RULES (standard mahjong solitaire) ----------
function covered(t,arr){
  for(const u of arr){ if(u.gone||u===t) continue;
    if(u.z===t.z+1 && Math.abs(u.x-t.x)<2 && Math.abs(u.y-t.y)<2) return true; }
  return false;
}
function sideBlocked(t,arr,dir){ // dir -2 (left) or +2 (right)
  for(const u of arr){ if(u.gone||u===t) continue;
    if(u.z===t.z && u.x===t.x+dir && Math.abs(u.y-t.y)<2) return true; }
  return false;
}
function isFree(t,arr){
  if(t.gone) return false;
  if(covered(t,arr)) return false;
  return !sideBlocked(t,arr,-2) || !sideBlocked(t,arr,2);
}
function freeTiles(arr){ const f=[]; for(const t of arr){ if(isFree(t,arr)) f.push(t); } return f; }

// ---------- SOLVABLE GENERATOR (reverse "peel": remove free pairs from the full board) ----------
// Playing back the recorded pair order (a1,b1)..(am,bm) from the FULL board is always valid,
// because right before pair k is played the board equals the state pair k was free in.
function assignSolvable(arr, faceCount){
  arr.forEach(t=>{ t.gone=false; t.face=-1; });
  const order=[]; let remaining=arr.length, guard=0;
  while(remaining>0){
    if(++guard>arr.length*4) return null;
    const free=freeTiles(arr);
    if(free.length<2) return null;                 // not peelable (never happens for these layouts)
    shuffleArr(free);
    const a=free[0], b=free[1];
    a.gone=true; b.gone=true; order.push([a.id,b.id]); remaining-=2;
  }
  // hand out faces: balanced bag, shuffled, so the board LOOKS random (each pair shares a face)
  const P=order.length, bag=[];
  for(let k=0;k<P;k++) bag.push(k%faceCount);
  shuffleArr(bag);
  const byId={}; arr.forEach(t=>{ t.gone=false; byId[t.id]=t; });
  order.forEach((pr,k)=>{ byId[pr[0]].face=bag[k]; byId[pr[1]].face=bag[k]; });
  return order;
}

// ---------- BUILD A GAME ----------
function build(){
  const lvl=curLevel(), set=curSet();
  tiles=buildLayout(lvl);
  let ord=null;
  for(let tryN=0; tryN<8 && !ord; tryN++) ord=assignSolvable(tiles, set.count);
  solution=ord||[];
  selId=-1; hintPair=null; state="play";
  history=[]; undosLeft=CAP; hintsLeft=CAP; mixesLeft=CAP;
  startedAt=Date.now(); elapsedMs=0; isNewBest=false; wonBest=0;
  if(!headless){ loadSetArt(set); layout(); showChrome(true); updateBanner(); updateChrome(); }
}

// ---------- MOVES ----------
function tileById(id){ for(const t of tiles) if(t.id===id) return t; return null; }
function remaining(){ let n=0; for(const t of tiles) if(!t.gone) n++; return n; }
function availableMatch(){ // a free matching pair among present tiles, or null
  const f=freeTiles(tiles);
  for(let i=0;i<f.length;i++) for(let j=i+1;j<f.length;j++) if(f[i].face===f[j].face) return [f[i].id,f[j].id];
  return null;
}
function tapTile(t){
  if(state!=="play"||!t||!isFree(t,tiles)) return;
  if(BA)BA.unlock();
  hintPair=null;
  if(selId===t.id){ selId=-1; return; }              // tap again = deselect
  if(selId<0){ selId=t.id; if(BA)BA.sfx("select"); return; }
  const a=tileById(selId), b=t;
  if(a && a.face===b.face){
    a.gone=true; b.gone=true; selId=-1; history.push([a.id,b.id]);
    if(BA)BA.sfx("match");
    if(BM && !headless){ const p=tileCenter(a),q=tileCenter(b);
      BM.burst(fx.parts,p.x,p.y,"#7CF6B0",10); BM.burst(fx.parts,q.x,q.y,"#FFD23F",10); }
    updateBanner(); updateChrome();
    if(remaining()===0){ winGame(); }
    else if(!availableMatch()){ autoShuffle(); }     // safety net (uncapped): never let a kid get stuck
  } else {
    // wrong pair — keep the newly tapped one selected (friendly), tiny nudge
    selId=b.id; if(BA)BA.sfx("nomatch"); if(BM&&!headless) BM.shake(fx,0.18);
  }
}
function autoShuffle(){
  const present=tiles.filter(t=>!t.gone);
  // re-run the peel generator on just the remaining tiles → solvable from here on
  let ord=null; for(let n=0;n<8 && !ord;n++) ord=assignSolvable(present, curSet().count);
  selId=-1; hintPair=null; history=[]; if(BA)BA.sfx("shuffle");   // scramble is an undo reset point
  if(BM&&!headless){ BM.flash(fx,"#67E8F9",0.4); updateChrome(); }
}
// Recall: put the last matched pair back on the board.
function doUndo(){
  if(!history.length) return false;
  const pr=history.pop(); const a=tileById(pr[0]), b=tileById(pr[1]);
  if(a) a.gone=false; if(b) b.gone=false; selId=-1; hintPair=null;
  if(BA)BA.sfx("select"); updateBanner();
  if(!availableMatch()) autoShuffle();   // safety net
  return true;
}
// Hint: highlight an available pair. Returns true only if one was actually shown
// (so a wasted tap on a stuck board doesn't burn a charge — it just safety-mixes).
function doHint(){
  const m=availableMatch();
  if(m){ hintPair=m; hintUntil=nowMs+1400; if(BA)BA.sfx("select"); return true; }
  autoShuffle(); return false;
}
function winGame(){
  elapsedMs=Date.now()-startedAt;
  const prev=getBest(PREFS.lvlIdx,PREFS.setIdx);
  if(!headless){ isNewBest=(!prev || elapsedMs<prev); if(isNewBest) saveBest(elapsedMs); wonBest=isNewBest?elapsedMs:prev; }
  state="win"; showChrome(false);
  if(BA)BA.sfx("win");
  if(BM&&!headless){ for(let i=0;i<5;i++) BM.explode(fx, W*(0.15+0.175*i), H*0.4, i%2?"#FFD23F":"#7CF6B0", {n:16, pop:i===2?"You cleared it!":""}); }
  try{ if(window.parent) window.parent.postMessage({source:"buildable",kind:"win"},"*"); }catch(e){}
}

// ---------- ART ----------
function loadSetArt(set){
  FACE_IMG.length=0;
  if(headless||typeof Image==="undefined") return;
  for(let i=0;i<set.count;i++){
    const im=new Image(); im.decoding="async";
    im.src=GAME_CONFIG.base+set.key+"/"+String(i+1).padStart(2,"0")+".png";
    FACE_IMG[i]=im;
  }
}

// ---------- VIEW / DRAW ----------
function bounds(){
  let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9,maxZ=0;
  for(const t of tiles){ minX=Math.min(minX,t.x); maxX=Math.max(maxX,t.x+2);
    minY=Math.min(minY,t.y); maxY=Math.max(maxY,t.y+2); maxZ=Math.max(maxZ,t.z); }
  return {minX,maxX,minY,maxY,maxZ};
}
function layout(){
  if(!tiles.length) return;
  const vw=(W&&isFinite(W)&&W>0)?W:900, vh=(H&&isFinite(H)&&H>0)?H:600;
  const b=bounds();
  const cols=(b.maxX-b.minX)/2, rows=(b.maxY-b.minY)/2;
  const availW=vw*0.94, availH=(vh-70)*0.96;
  // tile aspect ~ 1.3 tall; reserve room for the layer lift (maxZ)
  let tw=Math.min(availW/(cols+0.9), availH/((rows*1.3)+0.9));
  tw=Math.max(20,Math.min(tw,86));
  view.tileW=tw; view.tileH=tw*1.3; view.lx=tw*0.14; view.ly=tw*0.14;
  // pixel extents (include lift) to center
  let pminX=1e9,pmaxX=-1e9,pminY=1e9,pmaxY=-1e9;
  for(const t of tiles){ const px=(t.x-b.minX)/2*view.tileW - t.z*view.lx;
    const py=(t.y-b.minY)/2*view.tileH - t.z*view.ly;
    pminX=Math.min(pminX,px); pmaxX=Math.max(pmaxX,px+view.tileW);
    pminY=Math.min(pminY,py); pmaxY=Math.max(pmaxY,py+view.tileH); }
  view.b=b;
  view.ox=(vw-(pmaxX-pminX))/2 - pminX;
  view.oy=(vh+50-(pmaxY-pminY))/2 - pminY;
}
function tilePx(t){ return { x:view.ox+(t.x-view.b.minX)/2*view.tileW - t.z*view.lx,
                             y:view.oy+(t.y-view.b.minY)/2*view.tileH - t.z*view.ly }; }
function tileCenter(t){ const p=tilePx(t); return {x:p.x+view.tileW/2, y:p.y+view.tileH/2}; }
function rr(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
function drawTile(t){
  const p=tilePx(t), w=view.tileW, h=view.tileH, r=Math.max(5,w*0.14);
  const free=isFree(t,tiles), sel=(t.id===selId);
  const hinted = hintPair && (t.id===hintPair[0]||t.id===hintPair[1]) && nowMs<hintUntil;
  const th=Math.max(3,w*0.11);
  // 3D side/thickness (bottom-right)
  ctx.fillStyle="#b9843e"; rr(ctx,p.x+th,p.y+th,w,h,r); ctx.fill();
  // tile body
  ctx.fillStyle= sel?"#fff7df":"#fdf6e6"; rr(ctx,p.x,p.y,w,h,r); ctx.fill();
  ctx.lineWidth=Math.max(1.5,w*0.03); ctx.strokeStyle= sel?"#F5A623":(hinted?"#33d17a":"rgba(120,90,40,.35)"); ctx.stroke();
  // inset face panel
  const pad=w*0.12, iw=w-pad*2, ih=h-pad*2;
  const im=FACE_IMG[t.face];
  if(im && im.complete && im.naturalWidth){
    const s=Math.min(iw/im.naturalWidth, ih/im.naturalHeight);
    const dw=im.naturalWidth*s, dh=im.naturalHeight*s;
    try{ ctx.drawImage(im, p.x+w/2-dw/2, p.y+h/2-dh/2, dw, dh); }catch(e){}
  } else {
    // drawn fallback: a colored pip with the face number (never breaks if art missing)
    const cols=["#E8636F","#F5A623","#3AA655","#3B82F6","#9B7BFF","#EC4899","#14B8A6","#F97316"];
    ctx.fillStyle=cols[t.face%cols.length]; ctx.beginPath();
    ctx.arc(p.x+w/2,p.y+h/2,iw*0.32,0,7); ctx.fill();
    ctx.fillStyle="#fff"; ctx.font="800 "+(w*0.34)+"px Nunito,sans-serif"; ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillText(String(t.face+1), p.x+w/2, p.y+h/2+1);
  }
  // dim blocked tiles so free ones read as tappable
  if(!free){ ctx.fillStyle="rgba(10,18,34,.34)"; rr(ctx,p.x,p.y,w,h,r); ctx.fill(); }
  if(hinted){ ctx.lineWidth=w*0.06; ctx.strokeStyle="#33d17a"; rr(ctx,p.x-2,p.y-2,w+4,h+4,r+2); ctx.stroke(); }
}
function drawWin(){
  const vw=(W&&isFinite(W)&&W>0)?W:900, vh=(H&&isFinite(H)&&H>0)?H:600;
  ctx.save();
  ctx.fillStyle="rgba(8,12,24,.55)"; ctx.fillRect(0,0,vw,vh);
  const pw=Math.min(360,vw*0.86), ph=210, px=(vw-pw)/2, py=(vh-ph)/2;
  ctx.fillStyle="#16223c"; ctx.strokeStyle="rgba(255,255,255,.12)"; ctx.lineWidth=2;
  rr(ctx,px,py,pw,ph,22); ctx.fill(); ctx.stroke();
  ctx.textAlign="center"; ctx.textBaseline="alphabetic"; ctx.fillStyle="#fff";
  ctx.font="900 26px 'Baloo 2',Nunito,sans-serif"; ctx.fillText("You cleared it!", vw/2, py+54);
  ctx.font="800 18px Nunito,sans-serif"; ctx.fillStyle="#cfe3ff";
  ctx.fillText("Time  "+fmtTime(elapsedMs), vw/2, py+94);
  if(isNewBest){ ctx.fillStyle="#7CF6B0"; ctx.font="900 20px 'Baloo 2',Nunito,sans-serif"; ctx.fillText("New best time!", vw/2, py+128); }
  else if(wonBest){ ctx.fillStyle="#a7b6d6"; ctx.font="700 16px Nunito,sans-serif"; ctx.fillText("Best  "+fmtTime(wonBest), vw/2, py+126); }
  ctx.fillStyle="#8fa0c4"; ctx.font="700 15px Nunito,sans-serif"; ctx.fillText("Tap to play again", vw/2, py+ph-24);
  ctx.restore();
}
function draw(){
  if(!ctx) return;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  // soft table backdrop
  const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,"#16233d"); g.addColorStop(1,"#101a2e");
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  const so=(BM&&fx)?BM.shakeOffset(fx):{x:0,y:0};
  ctx.save(); ctx.translate(so.x,so.y);
  if(!view.b && tiles.length) layout();
  // paint back-to-front: lower z first, then top rows, so covers read correctly
  const order=tiles.filter(t=>!t.gone).sort((a,b)=> a.z-b.z || a.y-b.y || a.x-b.x );
  for(const t of order) drawTile(t);
  ctx.restore();
  if(BM){ BM.draw(ctx,fx,{W:W,H:H}); }
  if(state==="win") drawWin();
  return "ok";
}

// ---------- HIT TEST (front-most free tile under the point) ----------
function pick(mx,my){
  const order=tiles.filter(t=>!t.gone).sort((a,b)=> b.z-a.z || b.y-a.y || b.x-a.x ); // front first
  for(const t of order){ const p=tilePx(t);
    if(mx>=p.x && mx<=p.x+view.tileW && my>=p.y && my<=p.y+view.tileH) return t; }
  return null;
}

// ---------- CHROME / BANNER ----------
function showChrome(on){ const c=document.getElementById("ctrls"),b=document.getElementById("banner");
  if(c) c.classList.toggle("hide",!on); if(b) b.classList.toggle("hide",!on); }
function updateBanner(){ const el=document.getElementById("bLeft"); if(el) el.textContent="Tiles left: "+remaining(); }
function updateChrome(){
  const upd=(nId,n,btnId,off)=>{ const el=document.getElementById(nId); if(el) el.textContent=n;
    const b=document.getElementById(btnId); if(b) b.classList.toggle("off", !!off); };
  upd("undoN",undosLeft,"undoBtn", undosLeft<=0 || history.length===0);
  upd("hintN",hintsLeft,"hintBtn", hintsLeft<=0);
  upd("mixN", mixesLeft,"shufBtn", mixesLeft<=0);
}

// ---------- START SCREEN (BS) ----------
let startScreen=null;
function flameIcon(n){ // draw n flames → dataURL (no emoji, on-brand)
  if(typeof document==="undefined") return "";
  try{
    const c=document.createElement("canvas"); c.width=180; c.height=150; const x=c.getContext("2d");
    for(let i=0;i<n;i++){ const cx=90+(i-(n-1)/2)*46, cy=95, s=1;
      x.fillStyle="#FF7A2F"; flameShape(x,cx,cy,26*s,52*s);
      x.fillStyle="#FFC24B"; flameShape(x,cx,cy+8,15*s,32*s); }
    return c.toDataURL();
  }catch(e){ return ""; }
}
function flameShape(x,cx,cy,w,h){ x.beginPath(); x.moveTo(cx,cy-h);
  x.bezierCurveTo(cx+w,cy-h*0.4,cx+w,cy+h*0.35,cx,cy+h*0.5);
  x.bezierCurveTo(cx-w,cy+h*0.35,cx-w,cy-h*0.4,cx,cy-h); x.closePath(); x.fill(); }
function buildStartCfg(){
  return {
    title:GAME_CONFIG.title, subtitle:"Match free tiles in pairs to clear the board",
    sound: BA?!BA.muted:true, showBack:false,
    levels: GAME_CONFIG.levels.map((lv,i)=>{ const bt=getBest(i,PREFS.setIdx);
      return { n:i+1, name:lv.name, state:"ready", img: flameIcon(lv.flames),
        foot: lv.foot+" · "+curSet().name+(bt?" · Best "+fmtTime(bt):"") }; }),
    customizeLabel:"Pick your tiles",
  };
}
function showMenu(){ state="menu"; showChrome(false); mountStart(); }
function mountStart(){
  const host=document.getElementById("start"); if(!host) return;
  host.classList.remove("hide");
  const cb={
    onPlay:(n)=>{ PREFS.lvlIdx=Math.max(0,Math.min(GAME_CONFIG.levels.length-1,n-1));
      host.classList.add("hide"); if(BA)BA.unlock(); build(); },
    onCustomize:()=>openCustomize(),
    onSound:()=>{ if(BA)BA.toggleMute(); },
    onBack:()=>{ try{ if(window.parent) window.parent.postMessage("nav:exit","*"); }catch(e){} },
  };
  if(BS&&BS.mount) startScreen=BS.mount(host, buildStartCfg(), cb);
}

// ---------- CUSTOMIZE (tile-set picker) ----------
function openCustomize(){
  const el=document.getElementById("cust"); if(!el) return;
  const g=document.getElementById("setGrid"); g.innerHTML="";
  GAME_CONFIG.sets.forEach((s,i)=>{ const b=document.createElement("button");
    b.className="setbtn"+(i===PREFS.setIdx?" on":"");
    b.innerHTML='<img src="'+GAME_CONFIG.base+s.key+'/01.png" alt=""><span>'+s.name+'</span>';
    b.onclick=()=>{ PREFS.setIdx=i; openCustomize(); }; g.appendChild(b); });
  el.classList.remove("hide");
}

// ---------- LOOP / BOOT ----------
function resize(){ if(!cv) return; DPR=Math.min(2,(window.devicePixelRatio||1));
  W=cv.clientWidth||window.innerWidth; H=cv.clientHeight||window.innerHeight;
  cv.width=W*DPR; cv.height=H*DPR; if(state==="play") layout(); }
let _last=0;
function frame(ts){ if(!_last)_last=ts; let dt=(ts-_last)/1000; _last=ts; if(dt>0.05)dt=0.05;
  nowMs+=dt*1000; if(BM)BM.update(fx,dt);
  if(state==="play"){ elapsedMs=Date.now()-startedAt; const bt=document.getElementById("bTime"); if(bt) bt.textContent=fmtTime(elapsedMs); }
  try{ draw(); }catch(e){ if(typeof console!=="undefined") console.error("draw",e); }
  requestAnimationFrame(frame);
}
if(typeof document!=="undefined" && document.getElementById("cv")){
  cv=document.getElementById("cv"); ctx=cv.getContext("2d");
  resize(); window.addEventListener("resize",resize);
  const onTap=(e)=>{ if(state==="win"){ if(BA)BA.unlock(); showMenu(); return; } if(state!=="play") return;
    const t=e.touches?e.touches[0]:e;
    const rb=cv.getBoundingClientRect(); const hit=pick(t.clientX-rb.left, t.clientY-rb.top);
    if(hit) tapTile(hit); };
  cv.addEventListener("mousedown",onTap);
  cv.addEventListener("touchstart",(e)=>{ e.preventDefault(); onTap(e); },{passive:false});
  document.getElementById("custDone").onclick=()=>{ document.getElementById("cust").classList.add("hide");
    if(startScreen&&startScreen.update) startScreen.update(buildStartCfg()); else mountStart(); };
  document.getElementById("soundBtn").onclick=()=>{ if(BA){BA.toggleMute();} };
  document.getElementById("undoBtn").onclick=()=>{ if(state!=="play"||undosLeft<=0||!history.length) return; if(doUndo()){ undosLeft--; updateChrome(); } };
  document.getElementById("hintBtn").onclick=()=>{ if(state!=="play"||hintsLeft<=0) return; if(doHint()){ hintsLeft--; updateChrome(); } };
  document.getElementById("shufBtn").onclick=()=>{ if(state!=="play"||mixesLeft<=0) return; mixesLeft--; autoShuffle(); updateChrome(); };
  // bespoke created sounds (BA synth is the silent fallback only)
  if(BA&&BA.configure){ BA.configure({ sfxBase:"/api/sfx?s=", map:{
    select:"mahjong_pick", match:"mahjong_match", nomatch:"mahjong_nope",
    shuffle:"mahjong_shuffle", win:"mahjong_win" } }); }
  showMenu(); requestAnimationFrame(frame);
}

// ---------- QA / SIM HOOKS ----------
function headlessBegin(opts){ headless=true; opts=opts||{};
  PREFS.setIdx=opts.setIdx||0; PREFS.lvlIdx=opts.lvlIdx!=null?opts.lvlIdx:0; build(); }
// Replay the guaranteed solution, VALIDATING each pair is actually free at removal
// time (this exercises the free-tile rules, not just the generator).
function simSolution(opts){
  headlessBegin(opts);
  let moves=0, bad=0;
  for(const pr of solution){ const a=tileById(pr[0]), b=tileById(pr[1]);
    if(!isFree(a,tiles)||!isFree(b,tiles)||a.face!==b.face) bad++;
    a.gone=true; b.gone=true; moves++; }
  return { result: remaining()===0?"win":"stuck", cleared: remaining()===0, moves, illegal:bad,
           tiles: tiles.length };
}
// A greedy player that only removes currently-available free matches, and mixes when
// stuck — proves the "never stuck" guarantee holds under real play.
function simGreedy(opts){
  headlessBegin(opts);
  let moves=0, mixes=0, guard=0;
  while(remaining()>0){ if(++guard>tiles.length*20) break;
    const m=availableMatch();
    if(m){ tileById(m[0]).gone=true; tileById(m[1]).gone=true; moves++; }
    else { const present=tiles.filter(t=>!t.gone); let o=null;
      for(let n=0;n<8&&!o;n++) o=assignSolvable(present,curSet().count); mixes++;
      if(mixes>60) break; }
  }
  return { result: remaining()===0?"win":"stuck", cleared: remaining()===0, moves, mixes };
}
window.MAHJONG_GAME = {
  state:()=>state,
  begin:(o)=>headlessBegin(o),
  sim:(o)=>simSolution(o),
  simGreedy:(o)=>simGreedy(o),
  campaign:()=>{ const out=[];
    GAME_CONFIG.levels.forEach((lv,li)=>{ GAME_CONFIG.sets.forEach((st,si)=>{
      const r=simSolution({lvlIdx:li,setIdx:si}); const gr=simGreedy({lvlIdx:li,setIdx:si});
      out.push({ level:lv.name, set:st.name, tiles:r.tiles, cleared:r.cleared, illegal:r.illegal,
                 greedyCleared:gr.cleared, mixes:gr.mixes }); }); });
    return out; },
  _draw:()=>{ try{ return draw(); }catch(e){ return "ERR:"+(e&&e.message||e); } },
  _cfg:()=>GAME_CONFIG, _prefs:()=>PREFS, _remaining:()=>remaining(),
  _win:()=>{ if(state==="play") winGame(); return {elapsedMs, isNewBest, wonBest}; },   // QA: force the win overlay
};
window.BUILDABLE_GAME = window.MAHJONG_GAME;
</script>
