<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Sunny Town Drive — 3D engine</title>
<style>
  html,body{margin:0;height:100%;background:#0a1030;overflow:hidden;touch-action:none;font-family:'Fredoka',-apple-system,sans-serif}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  /* a fixed-aspect stage so the 3D canvas and the HUD canvas always coincide exactly */
  #stage{position:relative;width:540px;height:820px;max-width:100%;max-height:100%;aspect-ratio:540 / 820}
  canvas.layer{position:absolute;inset:0;width:100%;height:100%;image-rendering:auto;border-radius:14px}
  #c{background:#bfe9ff}
  #hud{pointer-events:none}
  #start{position:fixed;inset:0;z-index:10;display:none}
  #muteBtn{position:fixed;left:12px;bottom:12px;z-index:30;display:none;font-family:inherit;font-weight:700;font-size:14px;
           color:#cdd0ff;background:rgba(26,20,64,.7);border:1px solid #3a2c6e;border-radius:10px;padding:7px 12px;cursor:pointer}
  #helpBtn{position:fixed;right:12px;top:12px;z-index:30;display:none;font-family:inherit;font-weight:800;font-size:18px;
           color:#1a0f3a;background:#ffd86b;border:none;border-radius:50%;width:38px;height:38px;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.3)}
  #backBtn{position:fixed;left:12px;top:12px;z-index:30;display:none;font-family:inherit;font-weight:800;font-size:14px;
           color:#fff;background:rgba(26,20,64,.78);border:1px solid #3a2c6e;border-radius:12px;padding:8px 14px;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.3)}
  .toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:20;background:#ffd86b;color:#1a0f3a;
         font-weight:700;padding:12px 22px;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.35);display:none}
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="c" class="layer" width="540" height="820"></canvas>
    <canvas id="hud" class="layer" width="540" height="820"></canvas>
  </div>
</div>

<!-- shared start screen mounts here -->
<div id="start"></div>

<div id="toast" class="toast"></div>
<button id="backBtn" title="Back to menu">‹ Menu</button>
<button id="muteBtn">Sound: On</button>
<button id="helpBtn" title="How to play">?</button>

<!-- Three.js is hosted on our OWN site (not a CDN) so it always loads, even on
     school/work networks that block cdnjs. This was the "never starts" cause. -->
<script src="three.min.js?v=r128"></script>
<script src="buildable-audio.js"></script>
<script src="buildable-startscreen.js"></script>
<script>
// ============================================================================
//  SUNNY TOWN DRIVE — 3D FIXED ENGINE (never regenerated).
//  A cute blocky/LEGO-style "drive through town, dodge stuff, collect treats"
//  runner. Camera sits behind the car; the road runs off into the distance.
//
//  KEY DESIGN: the GAMEPLAY LOGIC is identical to the 2D version and stays a
//  pure track-position model (lane + p, where p is progress along the road in
//  the same 0..H units as before). Only the DRAWING changed: a Three.js scene
//  maps p -> world Z and lane -> world X. So the always-winnable guarantee and
//  the headless QA bot (window.BUILDABLE_GAME.sim/campaign) work unchanged —
//  no WebGL is needed to prove every town is beatable.
//
//  Always-winnable: each obstacle row leaves >=1 open lane, and ROW_GAP keeps
//  only ONE row inside the car's collision band, so a perfect driver finishes
//  untouched. (See botThink + the spawn rules.)
// ============================================================================
const W=540, H=820;                       // logic/HUD space (unchanged from 2D)
const THREE = (typeof window!=="undefined") ? window.THREE : undefined;
const BA=(typeof window!=="undefined"&&window.BuildableAudio)||(typeof globalThis!=="undefined"&&globalThis.BuildableAudio);
const BS=(typeof window!=="undefined"&&window.BuildableStartScreen)||(typeof globalThis!=="undefined"&&globalThis.BuildableStartScreen);
const hud=(typeof document!=="undefined")?document.getElementById('hud'):null;
const hctx=(hud&&hud.getContext)?hud.getContext('2d'):null;
function sfx(n,o){ if(BA)BA.sfx(n,o); }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function mulberry(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

// ---- data: the game recipe (safe to tweak freely; no code changes needed) ----
//   dist=how far to drive · speed=road speed · density=chance of a 2nd blocked
//   lane (never all 3) · treat=chance a treat drops · sky/grass=town colors
const GAME_CONFIG = window.GAME_CONFIG || {
  name: "Sunny Town Drive",
  hearts: 3,
  // speeds tuned GENTLE for ages 4-8 (was 3.6→6.1; kids found it too fast). Each town
  // ramps up a little; dist tuned so a run is a comfy ~18-22 seconds.
  levels: [
    { name:"Maple Street",    skyId:"maple",    sky:0xbfe9ff, grass:0x8fd98f, dist:2500, speed:2.2, density:0.00, treat:0.55 },
    { name:"Market Square",   skyId:"market",   sky:0xffe3bf, grass:0x9bd98a, dist:2900, speed:2.6, density:0.10, treat:0.55 },
    { name:"Sunny Beach Road",skyId:"beach",    sky:0xbff0ec, grass:0xffe39c, dist:3400, speed:3.0, density:0.20, treat:0.50 },
    { name:"Petal Park",      skyId:"petal",    sky:0xffd6ec, grass:0x86d68f, dist:3900, speed:3.4, density:0.30, treat:0.50 },
    { name:"Downtown Dash",   skyId:"downtown", sky:0xcdd6ff, grass:0x8fbf8f, dist:4400, speed:3.8, density:0.40, treat:0.45 },
    { name:"Rainbow Bridge",  skyId:"rainbow",  sky:0xe6d6ff, grass:0x9be0c0, dist:5000, speed:4.2, density:0.50, treat:0.45 },
  ],
  treatColors: ["#ffd23f","#ff8fce","#7ee0a0","#62d0ff","#ff7aa8"],
};
function levelColor(i){ const c=GAME_CONFIG.treatColors; return c[i%c.length]; }

const OBSTACLES = ["cone","car","hay","barrel"];
const TREATS    = ["coin","gift","star","icecream"];

// ---- track geometry (logic, in pixel-space p) ----
const LANES = 3;
const CAR_Y = H-150;          // the car's fixed position along the track
const OBS_H = 70;
const ROW_GAP = 290;          // spacing between rows -> one row in the band + comfy reaction time
const START_CLEAR = 360;      // clear road at the start of each town
const HIT_BAND = 34;          // |obstacle p - CAR_Y| within this (same lane) = crash
const SAFE_BAND = 64;         // wider zone the bot treats as dangerous (must exceed HIT_BAND)

// ---- 3D mapping: p (0..H) -> world Z, lane -> world X ----
const NEAR_Z = 4, FAR_Z = -170, ZPP = (NEAR_Z-FAR_Z)/CAR_Y;
const LANE_WORLD = 3.0;
function zForP(p){ return NEAR_Z - (CAR_Y-p)*ZPP; }
function xForLane(l){ return (l-1)*LANE_WORLD; }

// ---- saved profile: progress + stars ----
function defaultPrefs(){ return { unlocked:0, bestLevel:0, totalWins:0, stars:{}, coins:0 }; }
function mergePrefs(d){ const p=defaultPrefs(); if(!d||typeof d!=="object")return p;
  p.unlocked=Math.max(0,d.unlocked||0); p.bestLevel=d.bestLevel||0; p.totalWins=d.totalWins||0; p.coins=d.coins||0;
  if(d.stars&&typeof d.stars==="object")p.stars=Object.assign({},d.stars); return p; }
let PREFS=defaultPrefs();
function activeKidId(){ try{ const k=JSON.parse(localStorage.getItem("bk_active_kid_v1")||"null"); return k&&k.id?k.id:null; }catch{ return null; } }
function prefsKey(){ const k=activeKidId(); return "bk_runner_prefs"+(k?("_"+k):""); }
function loadPrefs(){ try{ const s=localStorage.getItem(prefsKey()); if(s)PREFS=mergePrefs(JSON.parse(s)); }catch{} }
function savePrefs(){ try{ localStorage.setItem(prefsKey(), JSON.stringify(PREFS)); }catch{} }

// ---- live game state ----
let G=null, level=0, L=null, state="title", started=false, botMode=false, helpOpen=false;

function startLevel(i){
  level=clamp(i,0,GAME_CONFIG.levels.length-1); L=GAME_CONFIG.levels[level];
  const rng=mulberry(9090+level*257);
  G={ lane:1, carX:xForLane(1), speed:L.speed, dist:0, nextRow:START_CLEAR,
      hearts:GAME_CONFIG.hearts, hurtsTaken:0, invuln:0, score:0, treatsGot:0,
      obstacles:[], treats:[], gc:[], rng, scrollZ:0, bob:0, shake:0 };
  if(THREE && sceneReady){ applyTownColors(); applyTownScenery(L.skyId); }
  state="play"; started=false;
}

// spawn one row of obstacles (+ maybe a treat). Pure logic — no THREE here.
function spawnRow(){
  const lanesArr=[0,1,2];
  let blockCount = 1; if(G.rng() < L.density) blockCount = 2;   // never 3 -> always an open lane
  for(let k=lanesArr.length-1;k>0;k--){ const j=Math.floor(G.rng()*(k+1)); const t=lanesArr[k];lanesArr[k]=lanesArr[j];lanesArr[j]=t; }
  const blocked=lanesArr.slice(0,blockCount), open=lanesArr.slice(blockCount);
  for(const ln of blocked){ const type=OBSTACLES[Math.floor(G.rng()*OBSTACLES.length)];
    G.obstacles.push({ lane:ln, y:-OBS_H, type, passed:false, hit:false }); }
  if(open.length && G.rng() < L.treat){ const ln=open[Math.floor(G.rng()*open.length)];
    const type=TREATS[Math.floor(G.rng()*TREATS.length)];
    G.treats.push({ lane:ln, y:-30, type, got:false }); }
}

// ---------- input ----------
function setLane(n){ if(!G)return; G.lane=clamp(n,0,LANES-1); }
function moveLeft(){ if(!G)return; if(!started){started=true;} setLane(G.lane-1); sfx("select"); }
function moveRight(){ if(!G)return; if(!started){started=true;} setLane(G.lane+1); sfx("select"); }
function canvasPt(e){ const r=hud.getBoundingClientRect(); return { x:(e.clientX-r.left)*(W/r.width), y:(e.clientY-r.top)*(H/r.height) }; }
let downX=null;
function onDown(e){ e.preventDefault(); if(BA)BA.unlock();
  if(helpOpen){ helpOpen=false; return; }
  if(state==="play"){ downX=canvasPt(e).x; return; }
  if(state==="win"||state==="lose"){ advanceAfterEnd(); return; } }
function onUp(e){ if(state!=="play"||downX==null)return; const x=canvasPt(e).x; const dx=x-downX;
  if(Math.abs(dx)>24){ dx<0?moveLeft():moveRight(); } else { x<W/2?moveLeft():moveRight(); }
  downX=null; }
if(typeof document!=="undefined" && document.getElementById('c')){
  const cc=document.getElementById('c');
  cc.addEventListener('pointerdown',onDown); cc.addEventListener('pointerup',onUp); cc.addEventListener('pointercancel',()=>{downX=null;});
  addEventListener('keydown',e=>{ const k=e.key;
    if(k==='b'){ botMode=!botMode; started=true; return; }
    if(state==="win"||state==="lose"){ advanceAfterEnd(); return; }
    if(["ArrowLeft","Left","a","A"].includes(k)){ moveLeft(); e.preventDefault(); }
    if(["ArrowRight","Right","d","D"].includes(k)){ moveRight(); e.preventDefault(); }
  });
}

// ---------- QA bot: a perfect driver (proves every town is winnable) ----------
function botThink(){ if(!G)return; started=true;
  const bandBlocked=new Set();
  for(const o of G.obstacles){ if(o.passed)continue; if(Math.abs(o.y-CAR_Y)<SAFE_BAND) bandBlocked.add(o.lane); }
  if(bandBlocked.size){
    if(bandBlocked.has(G.lane)){ for(const ln of [1,0,2]){ if(!bandBlocked.has(ln)){ setLane(ln); return; } } }
    return;
  }
  let nearY=-1; for(const o of G.obstacles){ if(o.passed)continue; if(o.y<CAR_Y && o.y>nearY) nearY=o.y; }
  if(nearY<0) return;
  const inc=new Set(); for(const o of G.obstacles){ if(o.passed)continue; if(Math.abs(o.y-nearY)<OBS_H) inc.add(o.lane); }
  if(!inc.has(G.lane)) return;
  for(const ln of [1,0,2]){ if(!inc.has(ln)){ setLane(ln); return; } }
}

// ---------- update (pure logic; headless-safe — NO THREE) ----------
function update(){
  if(state!=="play"||helpOpen||!G) return;
  if(botMode) botThink();
  const targetX=xForLane(G.lane); G.carX += (targetX-G.carX)*0.30;
  if(G.shake>0) G.shake*=0.86;
  if(!started) return;
  G.bob += 0.18;
  G.dist += G.speed; G.scrollZ += G.speed*ZPP;
  if(G.invuln>0) G.invuln--;

  while(G.dist >= G.nextRow){ spawnRow(); G.nextRow += ROW_GAP; }

  const keepO=[];
  for(const o of G.obstacles){ o.y += G.speed;
    if(!o.passed && !o.hit && o.lane===G.lane && Math.abs(o.y-CAR_Y) < HIT_BAND){ o.hit=true; hitCar(o); }
    if(o.y>CAR_Y+SAFE_BAND){ o.passed=true; }
    if(o.y<H+OBS_H) keepO.push(o); else G.gc.push(o); }
  G.obstacles=keepO;

  const keepT=[];
  for(const t of G.treats){ t.y += G.speed;
    if(!t.got && t.lane===G.lane && Math.abs(t.y-CAR_Y) < (HIT_BAND+24)){
      t.got=true; G.treatsGot++; G.score+=10; PREFS.coins++; sfx("coin",{tier:2}); }
    if(!t.got && t.y<H+30) keepT.push(t); else G.gc.push(t); }
  G.treats=keepT;

  if(G.dist>=L.dist){ winLevel(); }
}

function hitCar(o){ if(G.invuln>0) return;
  G.hearts--; G.hurtsTaken++; G.invuln=70; G.shake=1.0; sfx("hurt");
  if(G.hearts<=0){ state="lose"; sfx("lose"); }
}
function winLevel(){ state="win"; sfx("win"); PREFS.totalWins++;
  const earned = G.hurtsTaken<=0?3 : (G.hurtsTaken===1?2:1);
  PREFS.stars[level]=Math.max(PREFS.stars[level]||0, earned);
  const u=Math.min(GAME_CONFIG.levels.length-1, level+1); if(u>(PREFS.unlocked||0)){ PREFS.unlocked=u; }
  PREFS.bestLevel=Math.max(PREFS.bestLevel||0, level+1); savePrefs();
}
function advanceAfterEnd(){
  if(state==="win"){ if(level<GAME_CONFIG.levels.length-1){ startLevel(level+1); } else { showMenu(); toast("You drove through every town!"); } }
  else { showMenu(); }
}

// ============================================================================
//  3D SCENE (Three.js) — only built in the browser; skipped headlessly.
// ============================================================================
let renderer=null, scene=null, camera=null, sceneReady=false;
let carGroup=null, dashPool=[], scenePool=[], groundMesh=null, roadMesh=null;
let cloudPool=[], balloonPool=[], cloudTex=null;
const matCache={};
function mat(color){ if(!matCache[color]) matCache[color]=new THREE.MeshLambertMaterial({color}); return matCache[color]; }
const geoCache={};
function box(w,h,d){ const k="b"+w+"_"+h+"_"+d; if(!geoCache[k])geoCache[k]=new THREE.BoxGeometry(w,h,d); return geoCache[k]; }
function cyl(rt,rb,h,s){ const k="c"+rt+"_"+rb+"_"+h+"_"+s; if(!geoCache[k])geoCache[k]=new THREE.CylinderGeometry(rt,rb,h,s); return geoCache[k]; }
function meshOf(geo,color){ return new THREE.Mesh(geo, mat(color)); }

function studs(group, color, w, d, topY){ // little LEGO studs on top
  for(let sx=-1;sx<=1;sx+=2){ for(let sz=-1;sz<=1;sz+=2){
    const s=meshOf(cyl(0.22,0.22,0.16,12), color); s.position.set(sx*w*0.26, topY, sz*d*0.26); group.add(s); } }
}
// ---- shared AI billboard art for the cars / obstacles / treats (3D fallback) ----
const OBJ_DIM={ hero_car:{w:3.2,h:3.0,y:1.3}, ob_car:{w:2.8,h:2.7,y:1.25},
  cone:{w:1.7,h:1.9,y:0.95}, hay:{w:2.0,h:1.9,y:0.95}, barrel:{w:1.7,h:2.0,y:1.0},
  coin:{w:1.5,h:1.5,y:0}, gift:{w:1.5,h:1.5,y:0}, star:{w:1.6,h:1.6,y:0}, icecream:{w:1.4,h:1.8,y:0} };
const objTexCache={};
function loadObjTex(piece, cb){ if(objTexCache[piece]===false) return; if(objTexCache[piece]){ cb(objTexCache[piece]); return; }
  try{ new THREE.TextureLoader().load("/api/images?kind=runnerobj&piece="+encodeURIComponent(piece),
    (t)=>{ objTexCache[piece]=t; cb(t); }, undefined, ()=>{ objTexCache[piece]=false; }); }catch(e){} }
function addBillboard(parent, fb, piece){ const d=OBJ_DIM[piece]||{w:2,h:2,y:1};
  const m=new THREE.MeshBasicMaterial({transparent:true,alphaTest:0.4,side:THREE.DoubleSide});
  const plane=new THREE.Mesh(new THREE.PlaneGeometry(d.w,d.h), m); plane.position.y=d.y; plane.visible=false;
  parent.add(plane);
  loadObjTex(piece, (t)=>{ m.map=t; m.needsUpdate=true; plane.visible=true; if(fb)fb.visible=false; });
  return plane;
}
function makeCar(bodyColor, cabinColor){
  const g=new THREE.Group(); const fb=new THREE.Group(); g.add(fb);
  const body=meshOf(box(2.0,0.9,2.8), bodyColor); body.position.y=0.55; fb.add(body);
  const cabin=meshOf(box(1.5,0.8,1.4), cabinColor); cabin.position.set(0,1.25,-0.15); fb.add(cabin);
  const glass=meshOf(box(1.45,0.55,0.12), 0xbfe9ff); glass.position.set(0,1.25,0.56); fb.add(glass);
  const head=meshOf(cyl(0.26,0.26,0.3,12), 0xffe0b8); head.position.set(0,1.55,-0.15); fb.add(head);
  for(const sx of [-1,1]){ for(const sz of [-1,1]){
    const w=meshOf(cyl(0.42,0.42,0.32,16), 0x222831); w.rotation.z=Math.PI/2; w.position.set(sx*0.95, 0.18, sz*0.95); fb.add(w); } }
  for(const sx of [-1,1]){ const hl=meshOf(box(0.28,0.2,0.12), 0xfff4b0); hl.position.set(sx*0.55,0.55,1.42); fb.add(hl); }
  studs(fb, bodyColor, 2.0, 2.8, 1.06);
  addBillboard(g, fb, "hero_car");
  return g;
}
const OBSTACLE_PIECE={ car:"ob_car", cone:"cone", hay:"hay", barrel:"barrel" };
function makeObstacle(type){
  const g=new THREE.Group(); const fb=new THREE.Group(); g.add(fb);
  if(type==="cone"){ const c=meshOf(cyl(0.05,0.7,1.5,16), 0xff7a2c); c.position.y=0.75; fb.add(c);
    const ring=meshOf(cyl(0.45,0.55,0.28,16), 0xffffff); ring.position.y=0.6; fb.add(ring);
    const base=meshOf(box(1.3,0.18,1.3), 0x3a2a1a); base.position.y=0.09; fb.add(base); }
  else if(type==="car"){ const b=meshOf(box(1.9,0.85,2.6), 0x5aa0ff); b.position.y=0.5; fb.add(b);
    const cab=meshOf(box(1.45,0.7,1.3), 0x9cc8ff); cab.position.set(0,1.1,-0.1); fb.add(cab);
    for(const sx of [-1,1]){ for(const sz of [-1,1]){ const w=meshOf(cyl(0.38,0.38,0.3,14),0x222831); w.rotation.z=Math.PI/2; w.position.set(sx*0.9,0.16,sz*0.85); fb.add(w);} }
    studs(fb,0x5aa0ff,1.9,2.6,0.96); }
  else if(type==="hay"){ const b=meshOf(box(1.7,1.5,1.7), 0xe0b85a); b.position.y=0.75; fb.add(b);
    const top=meshOf(box(1.72,0.2,1.72), 0xc99a3c); top.position.y=1.5; fb.add(top); }
  else { const b=meshOf(cyl(0.75,0.75,1.6,16), 0xe0524a); b.position.y=0.8; fb.add(b);
    const s1=meshOf(cyl(0.77,0.77,0.18,16), 0xffffff); s1.position.y=1.05; fb.add(s1);
    const s2=meshOf(cyl(0.77,0.77,0.18,16), 0xffffff); s2.position.y=0.55; fb.add(s2); }
  addBillboard(g, fb, OBSTACLE_PIECE[type]||"cone");
  return g;
}
function makeTreat(type){
  const g=new THREE.Group(); const fb=new THREE.Group(); g.add(fb);
  if(type==="coin"){ const c=meshOf(cyl(0.62,0.62,0.16,22), 0xffd23f); c.rotation.x=Math.PI/2; fb.add(c);
    const i=meshOf(cyl(0.4,0.4,0.18,22), 0xffe88a); i.rotation.x=Math.PI/2; fb.add(i); }
  else if(type==="gift"){ const b=meshOf(box(0.95,0.95,0.95), 0x62d0ff); fb.add(b);
    const r1=meshOf(box(1.0,0.18,0.18), 0xffd23f); fb.add(r1); const r2=meshOf(box(0.18,1.0,0.18), 0xffd23f); fb.add(r2); }
  else if(type==="star"){ const s=new THREE.Mesh(new THREE.OctahedronGeometry(0.62), mat(0xffe27a)); s.scale.y=1.3; fb.add(s); }
  else { const cone=meshOf(cyl(0.05,0.42,0.9,14), 0xffb84d); cone.position.y=-0.1; fb.add(cone);
    const scoop=meshOf(new THREE.SphereGeometry(0.45,14,12), 0xff8fce); scoop.position.y=0.45; fb.add(scoop); }
  addBillboard(g, fb, type); g.userData.type=type; g.userData.fb=fb; return g;
}

// soft fluffy cloud drawn to a canvas (no external asset) -> a floating sky sprite
function makeCloudTexture(){
  const cv=document.createElement('canvas'); cv.width=256; cv.height=140; const x=cv.getContext('2d');
  function blob(cx,cy,r){ const g=x.createRadialGradient(cx,cy,0,cx,cy,r); g.addColorStop(0,"rgba(255,255,255,0.96)"); g.addColorStop(0.7,"rgba(255,255,255,0.78)"); g.addColorStop(1,"rgba(255,255,255,0)"); x.fillStyle=g; x.beginPath();x.arc(cx,cy,r,0,7);x.fill(); }
  blob(86,86,42); blob(128,72,54); blob(172,86,44); blob(110,96,52); blob(150,96,48);
  return new THREE.CanvasTexture(cv);
}
function makeCloud(){ if(!cloudTex)cloudTex=makeCloudTexture();
  const m=new THREE.MeshBasicMaterial({map:cloudTex,transparent:true,depthWrite:false,fog:false,opacity:0.95});
  const w=26+Math.random()*22; const mesh=new THREE.Mesh(new THREE.PlaneGeometry(w,w*0.5), m);
  mesh.userData.vx=0.06+Math.random()*0.07; return mesh;   // clearly visible drift
}
function makeBalloon(color){ const g=new THREE.Group();
  const balloon=new THREE.Mesh(new THREE.SphereGeometry(1.6,16,14), new THREE.MeshBasicMaterial({color,fog:false}));
  balloon.scale.y=1.25; balloon.position.y=2.2; g.add(balloon);
  const basket=new THREE.Mesh(box(0.7,0.6,0.7), new THREE.MeshBasicMaterial({color:0x8a5a3c,fog:false})); basket.position.y=0.1; g.add(basket);
  g.userData.vx=0.01+Math.random()*0.02; g.userData.phase=Math.random()*6.28; return g;
}

// ---- per-town roadside scenery: AI billboards with a blocky fallback ----
const SCENERY_PIECES=["bld_a","bld_b","tree"];
const PIECE_DIM={ bld_a:{w:5.4,h:6.2}, bld_b:{w:5.0,h:5.2}, tree:{w:4.6,h:5.6} };
const propTexCache={};   // "town:piece" -> THREE.Texture, or false if it failed
function makeFallbackProp(piece){ const g=new THREE.Group();
  if(piece==="tree"){ const tr=meshOf(cyl(0.2,0.26,1.1,10),0x8a5a3c); tr.position.y=0.55; g.add(tr);
    const lv=meshOf(new THREE.SphereGeometry(1.0,12,10),0x4fae5a); lv.position.y=1.7; g.add(lv); }
  else { const col=piece==="bld_a"?0xffb3a7:0xbfd7ff; const h=meshOf(box(1.9,2.4,1.9),col); h.position.y=1.2; g.add(h);
    const roof=meshOf(cyl(0.05,1.6,1.05,4),0xb5524a); roof.position.y=2.9; roof.rotation.y=Math.PI/4; g.add(roof); }
  return g;
}
function makeScenerySlot(piece){ const grp=new THREE.Group();
  const fb=makeFallbackProp(piece); grp.add(fb);
  const planeMat=new THREE.MeshBasicMaterial({transparent:true,alphaTest:0.4,side:THREE.DoubleSide});
  const dim=PIECE_DIM[piece]||{w:5,h:5.5};
  const plane=new THREE.Mesh(new THREE.PlaneGeometry(dim.w,dim.h), planeMat);
  plane.position.y=dim.h/2; plane.visible=false; grp.add(plane);
  grp.userData={ piece, plane, fb }; return grp;
}
function applyTownScenery(town){ if(!scene)return;
  for(const slot of scenePool){ const piece=slot.userData.piece, key=town+":"+piece;
    const plane=slot.userData.plane, fb=slot.userData.fb;
    if(propTexCache[key] && propTexCache[key]!==false){ plane.material.map=propTexCache[key]; plane.material.needsUpdate=true; plane.visible=true; fb.visible=false; continue; }
    plane.visible=false; fb.visible=true;     // show blocky fallback until/unless the art loads
    if(propTexCache[key]===false) continue;   // known-missing -> stay blocky
    try{ new THREE.TextureLoader().load(
      "/api/images?kind=runnerprop&town="+encodeURIComponent(town)+"&piece="+encodeURIComponent(piece),
      (tex)=>{ propTexCache[key]=tex; if(!L||L.skyId!==town) return;
        for(const s2 of scenePool){ if(s2.userData.piece===piece){ s2.userData.plane.material.map=tex; s2.userData.plane.material.needsUpdate=true; s2.userData.plane.visible=true; s2.userData.fb.visible=false; } } },
      undefined,
      ()=>{ propTexCache[key]=false; }
    ); }catch(e){}
  }
}

function buildScene(){
  const cv=document.getElementById('c');
  renderer=new THREE.WebGLRenderer({canvas:cv, antialias:true});
  renderer.setPixelRatio(Math.min(2, (window.devicePixelRatio||1)));
  renderer.setSize(W, H, false);
  scene=new THREE.Scene(); scene.background=new THREE.Color(0xbfe9ff); scene.fog=new THREE.Fog(0xbfe9ff, 60, 165);
  camera=new THREE.PerspectiveCamera(55, W/H, 0.1, 320);
  camera.position.set(0, 8, NEAR_Z+11); camera.lookAt(0, 1.0, -12);
  scene.add(new THREE.AmbientLight(0xffffff, 0.72));
  const sun=new THREE.DirectionalLight(0xffffff, 0.78); sun.position.set(-8, 18, 6); scene.add(sun);
  // ground (grass) + road
  groundMesh=meshOf(box(200,0.4,460), 0x8fd98f); groundMesh.position.set(0,-0.3,-180); scene.add(groundMesh);
  roadMesh=meshOf(box(11,0.4,460), 0x5b5b6b); roadMesh.position.set(0,-0.08,-180); scene.add(roadMesh);
  for(const sx of [-1,1]){ const curb=meshOf(box(0.4,0.5,460), 0xf2f2f2); curb.position.set(sx*5.2,0.05,-180); scene.add(curb); }
  // lane dashes (recycled)
  for(let i=0;i<26;i++){ for(const lx of [-1.5,1.5]){ const d=meshOf(box(0.22,0.06,2.2), 0xffffff);
    d.position.set(lx, 0.16, NEAR_Z - i*7); scene.add(d); dashPool.push(d); } }
  // roadside scenery slots (AI billboards w/ blocky fallback), 2 depth rows for layering
  let si=0;
  for(let i=0;i<16;i++){ for(const sx of [-1,1]){
    const piece=SCENERY_PIECES[si%SCENERY_PIECES.length]; si++;
    const slot=makeScenerySlot(piece);
    const farRow=(i%3===0); const xoff=farRow?(11+(i%3)*0.7):(6.7+(i%3)*0.6);
    slot.position.set(sx*xoff, 0, NEAR_Z - i*12);
    scene.add(slot); scenePool.push(slot); } }
  // floating clouds (drift across the sky, in front of the AI backdrop) — big & close enough to read
  for(let i=0;i<12;i++){ const cl=makeCloud();
    cl.position.set(-65+Math.random()*130, 10+Math.random()*15, -38 - Math.random()*70);
    scene.add(cl); cloudPool.push(cl); }
  // hot-air balloons drifting for life
  const balloonCols=[0xff7aa8,0x62d0ff,0xffd23f];
  for(let i=0;i<3;i++){ const b=makeBalloon(balloonCols[i%balloonCols.length]);
    b.position.set((i%2?1:-1)*(12+Math.random()*16), 11+Math.random()*7, -55 - i*22);
    scene.add(b); balloonPool.push(b); }
  carGroup=makeCar(0xff5d8f, 0xff86ac); carGroup.position.set(0,0,zForP(CAR_Y)); scene.add(carGroup);
  sceneReady=true;
}
const skyTexCache={};
function applyTownColors(){ if(!scene)return; const sky=new THREE.Color(L.sky);
  // solid-color fallback first (always works); fog fades distant road to this color
  scene.background=sky; scene.fog.color=sky; if(groundMesh) groundMesh.material=mat(L.grass);
  const cv=document.getElementById('c'); if(cv) cv.style.background="#"+sky.getHexString();
  // then try the AI sky/skyline backdrop (cached forever after first gen); on any
  // failure we silently keep the solid color, so a missing image can't break the game.
  const id=L.skyId; if(!id || !THREE.TextureLoader) return;
  if(skyTexCache[id]){ scene.background=skyTexCache[id]; return; }
  try{ new THREE.TextureLoader().load(
    "/api/images?kind=runnersky&town="+encodeURIComponent(id),
    (tex)=>{ skyTexCache[id]=tex; if(L && L.skyId===id && scene) scene.background=tex; },
    undefined,
    ()=>{ /* keep solid color */ }
  ); }catch(e){}
}

// sync logic arrays -> meshes, then render
function renderScene(){
  if(!renderer) return;
  const now=Date.now()/1000;
  // clouds + balloons drift ALWAYS (even on the menu) so the sky feels alive
  for(const cl of cloudPool){ cl.position.x += cl.userData.vx; if(cl.position.x>72) cl.position.x=-72; }
  for(const b of balloonPool){ b.position.x += b.userData.vx; if(b.position.x>40) b.position.x=-40;
    if(b.userData.baseY==null) b.userData.baseY=b.position.y;
    b.position.y = b.userData.baseY + Math.sin(now*0.8+b.userData.phase)*0.5; }
  if(!G){ renderer.render(scene,camera); return; }
  // recycle dashes + scenery to fake forward motion
  const adv = (state==="play"&&started)?G.speed*ZPP:0;
  for(const d of dashPool){ d.position.z+=adv; if(d.position.z>NEAR_Z+4) d.position.z=FAR_Z; }
  for(const s of scenePool){ s.position.z+=adv; if(s.position.z>NEAR_Z+8) s.position.z-=16*12; }
  // car
  carGroup.position.x = G.carX; carGroup.position.z = zForP(CAR_Y);
  carGroup.position.y = Math.sin(G.bob)*0.06;
  carGroup.rotation.y = clamp((xForLane(G.lane)-G.carX)*0.16, -0.3, 0.3);   // gentle bank (billboard-friendly)
  carGroup.visible = !(G.invuln>0 && Math.floor(G.invuln/5)%2===0);
  // obstacles
  for(const o of G.obstacles){ if(!o._mesh){ o._mesh=makeObstacle(o.type); scene.add(o._mesh); }
    o._mesh.position.set(xForLane(o.lane), 0, zForP(o.y)); }
  // treats
  for(const t of G.treats){ if(!t._mesh){ t._mesh=makeTreat(t.type); scene.add(t._mesh); }
    t._mesh.position.set(xForLane(t.lane), 1.15+Math.sin(G.bob+t.y*0.05)*0.18, zForP(t.y)); }
  // cleanup removed
  if(G.gc.length){ for(const o of G.gc){ if(o._mesh){ scene.remove(o._mesh); o._mesh=null; } } G.gc.length=0; }
  // camera shake on crash
  const sh=G.shake||0; camera.position.x = (Math.random()*2-1)*sh*0.6; camera.position.y = 8 + (Math.random()*2-1)*sh*0.4;
  renderer.render(scene, camera);
}

// ============================================================================
//  HUD (2D overlay canvas on top of the 3D scene) — hearts, town, progress.
// ============================================================================
function rrect(x,y,w,h,r){ hctx.beginPath(); hctx.moveTo(x+r,y); hctx.arcTo(x+w,y,x+w,y+h,r); hctx.arcTo(x+w,y+h,x,y+h,r); hctx.arcTo(x,y+h,x,y,r); hctx.arcTo(x,y,x+w,y,r); hctx.closePath(); }
function heart(cx,cy,s,col){ hctx.fillStyle=col; hctx.beginPath();
  hctx.moveTo(cx,cy+s*0.3); hctx.bezierCurveTo(cx,cy,cx-s,cy-s*0.1,cx-s,cy-s*0.55);
  hctx.bezierCurveTo(cx-s,cy-s*1.0,cx-s*0.3,cy-s*1.0,cx,cy-s*0.55);
  hctx.bezierCurveTo(cx+s*0.3,cy-s*1.0,cx+s,cy-s*1.0,cx+s,cy-s*0.55);
  hctx.bezierCurveTo(cx+s,cy-s*0.1,cx,cy,cx,cy+s*0.3); hctx.fill(); }
function star5(cx,cy,r,filled){ hctx.beginPath();
  for(let i=0;i<10;i++){ const ang=-Math.PI/2+i*Math.PI/5, rad=(i%2===0)?r:r*0.45; const x=cx+Math.cos(ang)*rad, y=cy+Math.sin(ang)*rad; i?hctx.lineTo(x,y):hctx.moveTo(x,y); }
  hctx.closePath(); if(filled){ hctx.fillStyle="#ffd54a"; hctx.fill(); hctx.strokeStyle="#caa42a"; hctx.lineWidth=2; hctx.stroke(); } else { hctx.fillStyle="rgba(255,255,255,.14)"; hctx.fill(); hctx.strokeStyle="rgba(255,255,255,.5)"; hctx.lineWidth=2; hctx.stroke(); } }
function banner(t,s){ hctx.fillStyle="rgba(10,12,40,.55)";hctx.fillRect(0,0,W,H); hctx.textAlign="center"; hctx.fillStyle="#fff";hctx.font="bold 40px Fredoka,sans-serif";hctx.fillText(t,W/2,H/2-6); hctx.font="20px Fredoka,sans-serif";hctx.fillText(s,W/2,H/2+34); }
function drawTutorial(){ const tt=Date.now()/1000;
  hctx.fillStyle="rgba(10,12,40,.45)"; hctx.fillRect(0,0,W,H);
  hctx.fillStyle="#fff"; hctx.textAlign="center"; hctx.font="bold 26px Fredoka,sans-serif"; hctx.fillText("Tap a side or swipe to move!", W/2, 110);
  hctx.font="18px Fredoka,sans-serif"; hctx.fillStyle="#cdd0ff"; hctx.fillText("Dodge the road and grab the treats", W/2, 142);
  const swing=Math.sin(tt*1.6); const lx=W/2-90, rx=W/2+90, ay=185;
  hctx.fillStyle=swing<0?"#ffd86b":"rgba(255,255,255,.4)"; hctx.beginPath();hctx.moveTo(lx+10,ay-12);hctx.lineTo(lx-12,ay);hctx.lineTo(lx+10,ay+12);hctx.closePath();hctx.fill();
  hctx.fillStyle=swing>0?"#ffd86b":"rgba(255,255,255,.4)"; hctx.beginPath();hctx.moveTo(rx-10,ay-12);hctx.lineTo(rx+12,ay);hctx.lineTo(rx-10,ay+12);hctx.closePath();hctx.fill();
}
function drawHUD(){ if(!hctx||!G) return; hctx.clearRect(0,0,W,H);
  // top bar
  hctx.textAlign="left"; hctx.fillStyle="#1a0f3a"; hctx.font="bold 20px Fredoka,sans-serif";
  hctx.fillText((L?L.name:"")+"  ·  "+(level+1)+"/"+GAME_CONFIG.levels.length, 16, 30);
  for(let i=0;i<G.hearts;i++){ heart(W-22-i*30, 26, 9, "#ff5d8f"); }
  hctx.fillStyle="#3a2c0a"; hctx.font="bold 16px Fredoka,sans-serif"; hctx.fillText("Treats: "+G.treatsGot, 16, 52);
  // progress bar
  const pct=clamp(G.dist/L.dist,0,1), bw=W-120, bx=60, by=H-26;
  hctx.fillStyle="rgba(0,0,0,.20)"; rrect(bx,by,bw,12,6); hctx.fill();
  hctx.fillStyle="#7ee0a0"; rrect(bx,by,bw*pct,12,6); hctx.fill();
  hctx.fillStyle="#1a0f3a"; hctx.beginPath();hctx.arc(bx+bw*pct,by+6,9,0,7);hctx.fill();
  // overlays
  if(state==="play" && (!started||helpOpen)) drawTutorial();
  if(state==="win"){ banner(level<GAME_CONFIG.levels.length-1?"Town Cleared!":"You Win!", level<GAME_CONFIG.levels.length-1?"Next town unlocked - tap to drive on":"Tap to finish");
    const earned=PREFS.stars[level]||0, r=24, gap=64, y=H/2-78; const xs=[W/2-gap,W/2,W/2+gap]; for(let i=0;i<3;i++) star5(xs[i],y,r,i<earned); }
  if(state==="lose"){ banner("Crashed out!","Tap to try again"); }
}

function draw(){ if(!renderer) return; renderScene(); drawHUD(); }

// ---------- shared start screen (BS) ----------
function el(id){ const e=document.getElementById(id); return (e&&e.style)?e:null; }
function toast(msg){ const e=el("toast"); if(!e)return; e.textContent=msg; e.style.display="block"; clearTimeout(toast._t); toast._t=setTimeout(()=>{e.style.display="none";},2600); }
function showHelpBtn(on){ const hb=el("helpBtn"); if(hb)hb.style.display=on?"block":"none"; }
function showInGameMute(on){ const mb=el("muteBtn"); if(mb)mb.style.display=on?"block":"none"; }
function showInGameBack(on){ const bb=el("backBtn"); if(bb)bb.style.display=on?"block":"none"; }
function clearHUD(){ if(hctx) hctx.clearRect(0,0,W,H); }

let startScreen=null;
function totalStars(){ let t=0; for(const k in PREFS.stars) t+=(PREFS.stars[k]||0); return t; }
function maxStars(){ return GAME_CONFIG.levels.length*3; }
function buildStartCfg(){
  const unlocked=PREFS.unlocked||0;
  const levels = GAME_CONFIG.levels.map((l,i)=>{ const st = i<unlocked ? "done" : (i===unlocked ? "next" : "locked");
    return { n:i+1, name:l.name, color:levelColor(i), maxStars:3, stars: st==="done"?(PREFS.stars[i]||0):undefined, state:st }; });
  return { title:"Sunny Town Drive", subtitle:"Stars: "+totalStars()+" of "+maxStars(),
    coins: totalStars(), sound: !(BA&&BA.muted), showBack:false, levels };
}
function showMenu(){ state="title"; G=null; clearHUD(); showHelpBtn(false); showInGameMute(false); showInGameBack(false);
  if(renderer){ renderer.render(scene,camera); }
  const host=document.getElementById("start"); if(host)host.style.display="block";
  if(!BS||!host){ return; }
  const cb={
    onPlay:(n)=>{ if(BA)BA.unlock(); startLevel(n-1); hideMenu(); },
    onSound:(on)=>{ if(BA){ BA.unlock(); BA.toggleMute(); } },
    onBack:()=>{},
  };
  if(!startScreen) startScreen=BS.mount(host, buildStartCfg(), cb);
  else startScreen.update(buildStartCfg());
}
function hideMenu(){ const host=document.getElementById("start"); if(host)host.style.display="none"; showHelpBtn(true); showInGameMute(true); showInGameBack(true); }

function wireMenus(){
  const mb=el("muteBtn"); if(mb){ const upd=()=>{ mb.textContent="Sound: "+(BA&&BA.muted?"Off":"On"); }; upd(); mb.onclick=()=>{ if(BA){ BA.unlock(); BA.toggleMute(); } upd(); }; }
  const hb=el("helpBtn"); if(hb)hb.onclick=()=>{ helpOpen=true; };
  const bb=el("backBtn"); if(bb)bb.onclick=()=>{ helpOpen=false; showMenu(); };
}

function drawNo3D(){ if(!hctx)return; hctx.clearRect(0,0,W,H);
  hctx.fillStyle="#1a1546"; hctx.fillRect(0,0,W,H);
  hctx.textAlign="center"; hctx.fillStyle="#fff"; hctx.font="bold 24px Fredoka,sans-serif";
  hctx.fillText("Couldn't load the 3D engine", W/2, H/2-10);
  hctx.font="18px Fredoka,sans-serif"; hctx.fillStyle="#cdd0ff";
  hctx.fillText("Please check your connection and refresh.", W/2, H/2+24); }
function frame(){ update();
  if(renderer){ draw(); }
  else if(state!=="title" && hctx){ drawNo3D(); }   // never silently blank
  requestAnimationFrame(frame); }
// boot
if(typeof document!=="undefined" && document.getElementById("start")){
  loadPrefs(); wireMenus();
  if(THREE){ try{ buildScene(); }catch(e){ console.error("3D init failed:", e); } }
  showMenu();
}
requestAnimationFrame(frame);

// ---------- QA / picker hooks (standardized name; alias kept) ----------
window.BUILDABLE_GAME = {
  startLevel:(i)=>{ startLevel(i); },
  setBot:(b)=>{ botMode=b; started=true; },
  state:()=>state,
  dbg:()=>({ level, lane:G&&G.lane, hearts:G&&G.hearts, dist:G&&Math.round(G.dist), need:L&&L.dist, obs:G&&G.obstacles.length, treats:G&&G.treatsGot, state }),
  sim:(idx, maxFrames)=>{ startLevel(idx); state="play"; botMode=true; started=true; let f=0; const cap=maxFrames||60000;
    while(state!=="win" && state!=="lose" && f<cap){ update(); f++; }
    return { level:idx, result:state, frames:f, heartsLeft:G?G.hearts:0, hurts:G?G.hurtsTaken:0, treats:G?G.treatsGot:0, stars:PREFS.stars[idx]||0 }; },
  campaign:(cap)=>{ const out=[]; cap=cap||60000;
    for(let lvl=0; lvl<GAME_CONFIG.levels.length; lvl++){ startLevel(lvl); state="play"; botMode=true; started=true;
      let f=0; while(state!=="win" && state!=="lose" && f<cap){ update(); f++; }
      out.push({ level:lvl+1, result:state, frames:f, heartsLeft:G?G.hearts:0 }); if(state==="lose")break; }
    return out; },
  _begin:(i)=>{ startLevel(i||0); state="play"; botMode=true; started=true; },
  _step:(n)=>{ for(let i=0;i<(n||1);i++) update(); },
  _draw:()=>{ try{ if(renderer)draw(); return "ok"; }catch(e){ return "ERR: "+(e&&e.message||e); } },
  _prefs:()=>PREFS, _cfg:()=>GAME_CONFIG, _is3D:()=>!!renderer,
};
window.RUNNER_GAME = window.BUILDABLE_GAME;   // back-compat alias
</script>
