<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Buildable Sound Machine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body {
    font-family:'Nunito',sans-serif;
    background:
      radial-gradient(900px 500px at 15% -10%, #FFE7B8 0%, rgba(255,231,184,0) 60%),
      radial-gradient(900px 600px at 110% 10%, #D8C8FF 0%, rgba(216,200,255,0) 55%),
      #FBF6EC;
    color:#2B2240;
    min-height:100%;
    padding:18px 16px calc(28px + env(safe-area-inset-bottom));
    overflow-x:hidden;
  }
  .wrap { max-width:1040px; margin:0 auto; }

  .topbar { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:6px; }
  .title { font-size:30px; font-weight:900; letter-spacing:-0.5px; color:#3B2C66; }
  .title small { display:block; font-size:14px; font-weight:800; color:#9A8FB8; letter-spacing:0; margin-top:2px; }
  .mute {
    flex-shrink:0; border:none; cursor:pointer; font-family:inherit; font-weight:800; font-size:14px;
    color:#5B4A8A; background:#fff; border:2px solid #EBE3F5; border-radius:999px;
    padding:9px 16px; display:inline-flex; align-items:center; gap:8px;
  }
  .mute.off { background:#3B2C66; color:#fff; border-color:#3B2C66; }

  .grid {
    margin-top:18px;
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(132px, 1fr));
    gap:14px;
  }
  @media (max-width:520px){ .grid { grid-template-columns:repeat(2, 1fr); gap:12px; } }

  .pad {
    position:relative;
    border:none; cursor:pointer; font-family:inherit;
    border-radius:24px;
    aspect-ratio:1 / 1;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
    color:#fff;
    box-shadow:0 8px 0 rgba(0,0,0,0.12), 0 12px 22px rgba(60,40,110,0.18);
    transition:transform .07s ease, box-shadow .07s ease;
    overflow:hidden;
  }
  .pad::after { content:""; position:absolute; inset:0; background:linear-gradient(180deg, rgba(255,255,255,0.22), rgba(255,255,255,0)); }
  .pad svg { width:46px; height:46px; position:relative; z-index:1; filter:drop-shadow(0 2px 3px rgba(0,0,0,0.18)); }
  .pad span { position:relative; z-index:1; font-weight:900; font-size:15px; letter-spacing:0.2px; text-shadow:0 2px 4px rgba(0,0,0,0.18); }
  .pad:active { transform:translateY(6px); box-shadow:0 2px 0 rgba(0,0,0,0.12), 0 4px 10px rgba(60,40,110,0.18); }
  .pad.pop { animation:pop .32s ease; }
  @keyframes pop { 0%{transform:scale(1)} 35%{transform:scale(1.08)} 100%{transform:scale(1)} }

  .hint { text-align:center; color:#A89CC4; font-weight:800; font-size:14px; margin-top:22px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="title">Sound Machine<small>Tap a button to make a sound!</small></div>
    <button class="mute" id="muteBtn" aria-label="Mute"><span id="muteLabel">Sound on</span></button>
  </div>
  <div class="grid" id="grid"></div>
  <div class="hint">Tap fast for a silly mix!</div>
</div>

<script>
// ---- glyphs (white line art, no emoji) ----
var G = {
  burst:'<svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M24 6v7M24 35v7M6 24h7M35 24h7M11 11l5 5M32 32l5 5M37 11l-5 5M16 32l-5 5"/><circle cx="24" cy="24" r="6" fill="#fff" stroke="none"/></svg>',
  star:'<svg viewBox="0 0 48 48" fill="#fff"><path d="M24 5l5.3 12.6L43 18.8l-10 8.8L36.3 41 24 33.7 11.7 41 15 27.6l-10-8.8 13.7-1.2z"/></svg>',
  spring:'<svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 38c0-6 28-6 28-12s-28-6-28-12"/><path d="M12 8h24"/></svg>',
  wave:'<svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round"><path d="M5 24c4-9 7 9 10 0s7 9 9 0 7 9 9 0 6-9 10 0"/></svg>',
  bolt:'<svg viewBox="0 0 48 48" fill="#fff"><path d="M27 4L11 27h9l-3 17 19-25h-10z"/></svg>',
  check:'<svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 25l9 9 21-22"/></svg>',
  cross:'<svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"><path d="M13 13l22 22M35 13L13 35"/></svg>',
  horn:'<svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="3.2" stroke-linejoin="round"><path d="M7 19v10h7l13 8V11l-13 8z" fill="#fff"/><path d="M33 18c3 2.5 3 9.5 0 12M37 13c5 4 5 17 0 21" stroke-linecap="round"/></svg>',
  frown:'<svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round"><circle cx="24" cy="24" r="18"/><circle cx="17" cy="20" r="2.2" fill="#fff" stroke="none"/><circle cx="31" cy="20" r="2.2" fill="#fff" stroke="none"/><path d="M16 33c4-5 12-5 16 0"/></svg>',
  paw:'<svg viewBox="0 0 48 48" fill="#fff"><ellipse cx="24" cy="31" rx="9" ry="7.5"/><circle cx="13" cy="22" r="4"/><circle cx="35" cy="22" r="4"/><circle cx="19" cy="14" r="3.6"/><circle cx="29" cy="14" r="3.6"/></svg>',
  duck:'<svg viewBox="0 0 48 48" fill="#fff"><path d="M30 14a7 7 0 10-9 6.6c-6 1-11 5.6-11 12.4 0 1 .8 1.6 2 1.6h20c6 0 10-4 10-10 0-5-3.5-9-8-10.2z"/><path d="M30 16l9-2-7 5z"/><circle cx="27" cy="13" r="1.5" fill="#3B2C66"/></svg>',
  music:'<svg viewBox="0 0 48 48" fill="#fff"><path d="M19 9l20-4v22a6 6 0 11-4-5.6V12L23 14.4V31a6 6 0 11-4-5.6z"/></svg>',
  bubble:'<svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="3.4"><circle cx="20" cy="26" r="11"/><circle cx="34" cy="16" r="5"/><circle cx="16" cy="22" r="3" fill="#fff" stroke="none"/></svg>',
  smile:'<svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round"><circle cx="24" cy="24" r="18"/><circle cx="17" cy="20" r="2.4" fill="#fff" stroke="none"/><circle cx="31" cy="20" r="2.4" fill="#fff" stroke="none"/><path d="M16 28c4 5 12 5 16 0"/></svg>',
  blob:'<svg viewBox="0 0 48 48" fill="#fff"><path d="M24 7c7 0 9 6 13 9s4 10-1 14-9 2-12 5-9 3-13-2-3-11-1-15 7-11 14-11z"/></svg>',
  coin:'<svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="3.2"><circle cx="24" cy="24" r="16"/><path d="M24 14v20M19 18.5c0-2.5 2.2-3.5 5-3.5s5 1 5 3.3c0 4.7-10 2.7-10 7.4 0 2.4 2.2 3.3 5 3.3s5-1 5-3.5" stroke-linecap="round"/></svg>',
  drum:'<svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="24" cy="18" rx="13" ry="5" fill="#fff" stroke="none"/><path d="M11 18v9c0 2.8 5.8 5 13 5s13-2.2 13-5v-9"/><path d="M11 27c0 2.8 5.8 5 13 5s13-2.2 13-5"/><path d="M30 7l6 9M18 7l-6 9"/></svg>',
  gong:'<svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="3.2"><path d="M24 6v6" stroke-linecap="round"/><circle cx="24" cy="27" r="15"/><circle cx="24" cy="27" r="6" fill="#fff" stroke="none"/></svg>',
  car:'<svg viewBox="0 0 48 48" fill="#fff"><path d="M7 30l3-9c.6-1.8 2.3-3 4.2-3h19.6c1.9 0 3.6 1.2 4.2 3l3 9v6a2 2 0 0 1-2 2h-3a4 4 0 0 1-8 0H20a4 4 0 0 1-8 0H9a2 2 0 0 1-2-2z"/><circle cx="16" cy="36" r="3.2" fill="#2B2240"/><circle cx="32" cy="36" r="3.2" fill="#2B2240"/></svg>',
  robot:'<svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"><path d="M24 7v5" stroke-linecap="round"/><circle cx="24" cy="6" r="2" fill="#fff" stroke="none"/><rect x="11" y="14" width="26" height="22" rx="5"/><circle cx="19" cy="24" r="2.6" fill="#fff" stroke="none"/><circle cx="29" cy="24" r="2.6" fill="#fff" stroke="none"/><path d="M19 30h10" stroke-linecap="round"/></svg>'
};

// ---- sounds: key, label, gradient, glyph ----
var SOUNDS = [
  ["fart","Whoopee","linear-gradient(160deg,#FF8FB1,#F0577E)","wave"],
  ["boom","Explosion","linear-gradient(160deg,#FF9F45,#F0622A)","burst"],
  ["boing","Boing","linear-gradient(160deg,#5FD0F0,#2F8FD6)","spring"],
  ["burp","Burp","linear-gradient(160deg,#7CD98E,#39A85B)","wave"],
  ["honk","Honk","linear-gradient(160deg,#FFC75A,#F0972A)","horn"],
  ["tada","Ta-da!","linear-gradient(160deg,#B68BFF,#7C4FE0)","star"],
  ["laser","Laser","linear-gradient(160deg,#67E8F9,#2BB6D6)","bolt"],
  ["ding","Ding!","linear-gradient(160deg,#86E8B6,#23B57E)","check"],
  ["buzzer","Buzzer","linear-gradient(160deg,#FF7C7C,#E0414F)","cross"],
  ["sadtrombone","Womp Womp","linear-gradient(160deg,#9AA6C4,#5E6B8F)","frown"],
  ["squeak","Squeak","linear-gradient(160deg,#FFD166,#F0A93A)","bubble"],
  ["airhorn","Air Horn","linear-gradient(160deg,#FF6FA5,#E03C8A)","horn"],
  ["bonk","Bonk","linear-gradient(160deg,#FFB14E,#E07A2A)","burst"],
  ["slidewhistle","Whistle","linear-gradient(160deg,#8AD6FF,#4F9FE0)","wave"],
  ["meow","Meow","linear-gradient(160deg,#C9A7FF,#9466E0)","paw"],
  ["woof","Woof","linear-gradient(160deg,#FFB36B,#E0823A)","paw"],
  ["quack","Quack","linear-gradient(160deg,#FFDE5A,#F0B72A)","duck"],
  ["cheer","Cheer!","linear-gradient(160deg,#7BE0C4,#1FA897)","music"],
  ["giggle","Giggle","linear-gradient(160deg,#FFD66B,#F0B23A)","smile"],
  ["roar","Dino Roar","linear-gradient(160deg,#7CD98E,#2BA85B)","blob"],
  ["robot","Robot","linear-gradient(160deg,#9FB4C9,#5E7A99)","robot"],
  ["splat","Splat","linear-gradient(160deg,#A7E05A,#74B12A)","blob"],
  ["cash","Cha-Ching","linear-gradient(160deg,#5BD98E,#1FA85F)","coin"],
  ["drumroll","Drum Roll","linear-gradient(160deg,#B68BFF,#7C4FE0)","drum"],
  ["gong","Gong","linear-gradient(160deg,#FFC75A,#E0922A)","gong"],
  ["frog","Frog","linear-gradient(160deg,#6FD98E,#2BA86B)","paw"],
  ["moo","Cow Moo","linear-gradient(160deg,#FFB36B,#E0823A)","paw"],
  ["rooster","Rooster","linear-gradient(160deg,#FF9F6B,#E0623A)","paw"],
  ["vroom","Vroom","linear-gradient(160deg,#FF7C7C,#E0414F)","car"],
  ["sneeze","Achoo!","linear-gradient(160deg,#8AD6FF,#4F9FE0)","wave"],
  ["partypop","Party Pop","linear-gradient(160deg,#FF8FD1,#E03CA0)","star"]
];

var muted = false;
try { muted = localStorage.getItem("bk_muted") === "1"; } catch(e){}
var cache = {};

function playSound(key){
  if (muted) return;
  var base = cache[key];
  if (!base){ base = new Audio("/api/sfx?s=" + key + "&v=1"); base.preload = "auto"; cache[key] = base; }
  // clone so rapid taps overlap (same cached URL, no refetch)
  var a = base.cloneNode();
  a.play().catch(function(){});
  if (navigator.vibrate) { try { navigator.vibrate(18); } catch(e){} }
}

function buildGrid(){
  var grid = document.getElementById("grid");
  SOUNDS.forEach(function(s){
    var key=s[0], label=s[1], grad=s[2], glyph=s[3];
    var b = document.createElement("button");
    b.className = "pad";
    b.style.background = grad;
    b.innerHTML = G[glyph] + '<span>' + label + '</span>';
    var fire = function(ev){
      ev.preventDefault();
      playSound(key);
      b.classList.remove("pop"); void b.offsetWidth; b.classList.add("pop");
    };
    b.addEventListener("pointerdown", fire);
    grid.appendChild(b);
    // warm the cache so first tap is instant
    cache[key] = new Audio("/api/sfx?s=" + key + "&v=1");
  });
}

function setMute(on){
  muted = on;
  try { localStorage.setItem("bk_muted", on ? "1" : "0"); } catch(e){}
  var btn=document.getElementById("muteBtn"), lab=document.getElementById("muteLabel");
  lab.textContent = on ? "Sound off" : "Sound on";
  btn.classList.toggle("off", on);
}
document.getElementById("muteBtn").addEventListener("click", function(){ setMute(!muted); });

buildGrid();
setMute(muted);
</script>
</body>
</html>
