<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Buildable Sound Machine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body {
    font-family:'Nunito',sans-serif;
    background:
      radial-gradient(900px 500px at 15% -10%, #FFE7B8 0%, rgba(255,231,184,0) 60%),
      radial-gradient(900px 600px at 110% 8%, #D8C8FF 0%, rgba(216,200,255,0) 55%),
      #FBF6EC;
    color:#2B2240; min-height:100%;
    padding:16px 14px calc(28px + env(safe-area-inset-bottom));
  }
  .wrap { max-width:1060px; margin:0 auto; }
  .topbar { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .title { font-size:27px; font-weight:900; letter-spacing:-0.5px; color:#3B2C66; }
  .title small { display:block; font-size:13px; font-weight:800; color:#9A8FB8; margin-top:2px; }
  .mute { flex-shrink:0; border:2px solid #EBE3F5; cursor:pointer; font-family:inherit; font-weight:800; font-size:14px;
    color:#5B4A8A; background:#fff; border-radius:999px; padding:9px 16px; }
  .mute.off { background:#3B2C66; color:#fff; border-color:#3B2C66; }

  .tabs { display:flex; gap:5px; overflow-x:auto; padding:12px 2px 8px; scrollbar-width:none; -ms-overflow-style:none; }
  .tabs::-webkit-scrollbar { display:none; }
  .tab { flex:0 0 auto; border:none; background:transparent; cursor:pointer; font-family:inherit;
    font-weight:800; font-size:12px; color:#7A6FA0; padding:4px 3px 2px; display:flex; flex-direction:column;
    align-items:center; gap:6px; width:72px; transition:transform .06s; }
  .tab:active { transform:scale(0.93); }
  .tab-ic { width:54px; height:54px; border-radius:17px; display:flex; align-items:center; justify-content:center;
    overflow:hidden; box-shadow:0 5px 12px rgba(60,40,110,0.18); border:3px solid transparent;
    transition:border-color .12s, transform .12s; position:relative; }
  .tab-ic::after { content:""; position:absolute; inset:0; background:linear-gradient(180deg, rgba(255,255,255,0.25), rgba(255,255,255,0) 60%); pointer-events:none; }
  .tab-ic img { width:100%; height:100%; object-fit:cover; position:relative; z-index:1; }
  .tab-ic svg { width:33px; height:33px; position:relative; z-index:1; filter:drop-shadow(0 1px 2px rgba(0,0,0,0.18)); }
  .tab-lbl { white-space:nowrap; }
  .tab.active { color:#3B2C66; }
  .tab.active .tab-ic { border-color:#3B2C66; transform:translateY(-2px); }

  .grid { margin-top:8px; display:grid; grid-template-columns:repeat(auto-fill, minmax(128px, 1fr)); gap:13px; }
  @media (max-width:520px){ .grid { grid-template-columns:repeat(3, 1fr); gap:10px; } .title{font-size:23px;} }
  @media (max-width:360px){ .grid { grid-template-columns:repeat(2, 1fr); } }

  .pad { position:relative; border:none; cursor:pointer; font-family:inherit; border-radius:22px; aspect-ratio:1/1;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:9px; color:#fff;
    box-shadow:0 7px 0 rgba(0,0,0,0.12), 0 11px 20px rgba(60,40,110,0.18);
    transition:transform .07s ease, box-shadow .07s ease; overflow:hidden; }
  .pad::after { content:""; position:absolute; inset:0; background:linear-gradient(180deg, rgba(255,255,255,0.22), rgba(255,255,255,0)); }
  .pad svg { width:42px; height:42px; position:relative; z-index:1; filter:drop-shadow(0 2px 3px rgba(0,0,0,0.18)); }
  .pad span { position:relative; z-index:1; font-weight:900; font-size:14px; letter-spacing:0.2px; text-align:center; padding:0 4px; text-shadow:0 2px 4px rgba(0,0,0,0.18); }
  .pad:active { transform:translateY(5px); box-shadow:0 2px 0 rgba(0,0,0,0.12), 0 4px 10px rgba(60,40,110,0.18); }
  .pad.pop { animation:pop .32s ease; }
  @keyframes pop { 0%{transform:scale(1)} 35%{transform:scale(1.08)} 100%{transform:scale(1)} }
  .hint { text-align:center; color:#A89CC4; font-weight:800; font-size:13.5px; margin-top:20px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="title">Sound Machine<small id="sub">Pick a pack and tap to play!</small></div>
    <button class="mute" id="muteBtn"><span id="muteLabel">Sound on</span></button>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="grid" id="grid"></div>
  <div class="hint">Tap fast for a silly mix!</div>
</div>

var muted=false; try{ muted=localStorage.getItem("bk_muted")==="1"; }catch(e){}
var cache={};
function play(key){
  if(muted) return;
  var base=cache[key];
  if(!base){ base=new Audio("/api/sfx?s="+key+"&v=1"); base.preload="auto"; cache[key]=base; }
  var a=base.cloneNode(); a.play().catch(function(){});
  if(navigator.vibrate){ try{navigator.vibrate(16);}catch(e){} }
}
function warm(pack){ pack.sounds.forEach(function(s){ if(!cache[s[0]]) cache[s[0]]=new Audio("/api/sfx?s="+s[0]+"&v=1"); }); }

var activeId=null;
try{ activeId=localStorage.getItem("bk_sfx_pack"); }catch(e){}
if(!activeId || !PACKS.some(function(p){return p.id===activeId;})) activeId=PACKS[0].id;

var PACK_META = {
  silly:{glyph:'smile',grad:'linear-gradient(160deg,#FF8FB1,#F0577E)'},
  animals:{glyph:'paw',grad:'linear-gradient(160deg,#7CD98E,#2BA85B)'},
  instruments:{glyph:'music',grad:'linear-gradient(160deg,#B68BFF,#7C4FE0)'},
  space:{glyph:'rocket',grad:'linear-gradient(160deg,#7C8BFF,#4F4FE0)'},
  spooky:{glyph:'ghost',grad:'linear-gradient(160deg,#9A7BD0,#5E3F9F)'},
  vehicles:{glyph:'car',grad:'linear-gradient(160deg,#5FD0F0,#2F8FD6)'},
  magic:{glyph:'wand',grad:'linear-gradient(160deg,#C9A7FF,#7C4FE0)'},
  nature:{glyph:'leaf',grad:'linear-gradient(160deg,#5FBFE0,#2F8FB6)'},
  food:{glyph:'fork',grad:'linear-gradient(160deg,#FF9F45,#F0622A)'},
  sports:{glyph:'trophy',grad:'linear-gradient(160deg,#3DD06A,#2BB14F)'},
};
function renderTabs(){
  var t=document.getElementById("tabs"); t.innerHTML="";
  PACKS.forEach(function(p){
    var meta=PACK_META[p.id]||{glyph:'star',grad:'linear-gradient(160deg,#B68BFF,#7C4FE0)'};
    var b=document.createElement("button");
    b.className="tab"+(p.id===activeId?" active":"");
    var ic=document.createElement("div"); ic.className="tab-ic"; ic.style.background=meta.grad;
    var img=document.createElement("img"); img.alt=p.name; img.loading="lazy";
    img.onerror=function(){ ic.innerHTML=(G[meta.glyph]||G.star); };
    img.src="/api/images?kind=soundpack&id="+encodeURIComponent(p.id);
    ic.appendChild(img);
    var lbl=document.createElement("span"); lbl.className="tab-lbl"; lbl.textContent=p.name;
    b.appendChild(ic); b.appendChild(lbl);
    b.addEventListener("click", function(){ activeId=p.id; try{localStorage.setItem("bk_sfx_pack",p.id);}catch(e){}
      renderTabs(); renderGrid(); });
    t.appendChild(b);
  });
}
function renderGrid(){
  var pack=PACKS.filter(function(p){return p.id===activeId;})[0];
  warm(pack);
  var g=document.getElementById("grid"); g.innerHTML="";
  pack.sounds.forEach(function(s){
    var key=s[0],label=s[1],glyph=s[2],grad=s[3];
    var b=document.createElement("button"); b.className="pad"; b.style.background=grad;
    b.innerHTML=(G[glyph]||G.star)+'<span>'+label+'</span>';
    b.addEventListener("pointerdown", function(ev){ ev.preventDefault(); play(key);
      b.classList.remove("pop"); void b.offsetWidth; b.classList.add("pop"); });
    g.appendChild(b);
  });
}
function setMute(on){ muted=on; try{localStorage.setItem("bk_muted",on?"1":"0");}catch(e){}
  var btn=document.getElementById("muteBtn"), lab=document.getElementById("muteLabel");
  lab.textContent=on?"Sound off":"Sound on"; btn.classList.toggle("off",on); }
document.getElementById("muteBtn").addEventListener("click", function(){ setMute(!muted); });

renderTabs(); renderGrid(); setMute(muted);
