<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FDFAF5">
<title>Lessons - Buildable Kids</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  /* Session LS1 - the lesson player. Cream brand tokens, same family as
     weather.html / dive.html. No emojis anywhere: every icon is drawn SVG
     geometry, every picture is real painted art from /lessons/art. */
  :root{
    --ink:#0F0E17; --cream:#FDFAF5; --gold:#FFC542; --mint:#2FAE68; --sky:#37B6F5;
    --card:#FFFFFF; --sub:#6E6684; --line:#EDE5D6; --purple:#7C5CFC; --coral:#FF6B6B;
    --grad:linear-gradient(90deg,#7C5CFC 0%,#FF6B6B 100%);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:var(--cream);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;
       font-weight:800;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  .wrap{max-width:460px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
        padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}

  /* top bar */
  .top{display:flex;align-items:center;gap:10px;padding:12px 16px 6px}
  .top h1{font-family:'Fredoka',sans-serif;font-weight:600;font-size:21px;margin:0;flex:1;
          white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #back{width:40px;height:40px;flex:none;border-radius:13px;background:#fff;border:2px solid var(--line);
        display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
  body.in-app #back{display:none}
  body.in-app .top{padding-left:96px}
  .coins{background:#fff;border:2px solid var(--line);border-radius:999px;padding:6px 13px;font-size:15px;
         display:flex;align-items:center;gap:7px;flex:none}
  .coindot{width:17px;height:17px;border-radius:50%;background:radial-gradient(circle at 34% 32%,#FFE39A,#FFC542);
           border:2px solid #D99B12;display:inline-block}

  /* step bar */
  .steps{display:flex;gap:6px;padding:6px 16px 12px}
  .steps i{flex:1;height:8px;border-radius:5px;background:#EBE3D3;transition:background .25s}
  .steps i.done{background:var(--grad)}
  .steps.hide{visibility:hidden}

  main{flex:1;padding:0 16px 30px}

  /* buddy */
  .buddyrow{display:flex;gap:11px;align-items:flex-end;margin:2px 0 15px}
  .buddyart{width:74px;height:74px;flex:none;object-fit:contain;
            filter:drop-shadow(0 5px 10px rgba(15,14,23,.16))}
  .bubble{background:#fff;border:2px solid var(--line);border-radius:19px;border-bottom-left-radius:5px;
          padding:12px 14px;font-size:16px;line-height:1.35;flex:1}

  /* card */
  .card{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:20px 18px;text-align:center;
        box-shadow:0 6px 18px rgba(15,14,23,.05)}
  .stepname{font-size:11.5px;font-weight:900;letter-spacing:.09em;text-transform:uppercase;color:var(--purple);margin-bottom:7px}
  .card h2{font-family:'Fredoka',sans-serif;font-weight:600;font-size:22px;margin:0 0 8px;line-height:1.2}
  .card p{font-size:16px;line-height:1.45;margin:8px 0;font-weight:700}
  .sub{color:var(--sub);font-size:13.5px;font-weight:800;margin-top:11px}

  /* ten frame with painted counters */
  .frames{display:flex;flex-direction:column;gap:9px;align-items:center;margin:15px 0 6px}
  .frame{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;background:#FFFDF8;border:3px solid #E3D8C2;
         border-radius:16px;padding:7px;width:100%;max-width:330px}
  .slot{aspect-ratio:1/1;border-radius:11px;background:#F6EFE1;display:flex;align-items:center;justify-content:center;
        overflow:hidden}
  .slot img{width:88%;height:88%;object-fit:contain;animation:drop .3s cubic-bezier(.34,1.4,.64,1) both}
  @keyframes drop{from{opacity:0;transform:translateY(-14px) scale(.6)}to{opacity:1;transform:none}}
  .count{font-family:'Fredoka',sans-serif;font-weight:600;font-size:16px;color:var(--sub)}

  /* answers */
  .ans{display:grid;gap:10px;margin-top:15px}
  .ans.c2{grid-template-columns:1fr 1fr}
  .ans.c3{grid-template-columns:1fr 1fr 1fr}
  .ans.c4{grid-template-columns:1fr 1fr}
  .ans button{border:2px solid var(--line);background:var(--cream);border-radius:17px;padding:17px 8px;min-height:62px;
              font-family:'Fredoka',sans-serif;font-weight:600;font-size:23px;cursor:pointer;color:var(--ink);
              transition:transform .08s, background .15s}
  .ans button:active{transform:scale(.96)}
  .ans button.right{background:#E3F6EA;border-color:var(--mint);color:#1C7A45}
  .ans button.wrong{background:#FFF3E2;border-color:var(--gold);color:#9A6A00}
  .ans button[disabled]{cursor:default}
  .ans.words button{font-size:18px;font-family:'Nunito',sans-serif;font-weight:800}

  .big{width:100%;border:none;border-radius:18px;padding:16px;background:var(--grad);color:#fff;
       font-family:'Fredoka',sans-serif;font-weight:600;font-size:18px;cursor:pointer;margin-top:16px}
  .big:active{transform:scale(.985)}
  .big.ghost{background:#fff;color:var(--purple);border:2px solid var(--line);margin-top:9px}

  .speak{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:900;color:var(--purple);
         border:2px solid var(--line);border-radius:999px;padding:7px 14px;background:#fff;cursor:pointer;margin-top:10px}
  .speak.on{background:#F1ECFF;border-color:#CFC2FF}

  .hint{margin-top:12px;font-size:15px;font-weight:800;color:#5C4A18;background:#FFF7E3;border:2px solid #F3E2B6;
        border-radius:15px;padding:12px;text-align:left;display:none}
  .hint.show{display:block;animation:drop .25s ease both}

  .starbig{width:130px;height:130px;object-fit:contain;animation:pop .75s cubic-bezier(.2,1.5,.5,1) both;
           filter:drop-shadow(0 8px 16px rgba(255,197,66,.5))}
  @keyframes pop{from{opacity:0;transform:scale(.25) rotate(-25deg)}to{opacity:1;transform:none}}
  .won{font-family:'Fredoka',sans-serif;font-weight:600;font-size:25px;line-height:1.2;
       background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin:8px 0}
  .reward{display:inline-flex;align-items:center;gap:8px;background:#FFF7E3;border:2px solid #F3E2B6;border-radius:999px;
          padding:8px 16px;font-size:16px;font-weight:900;color:#9A6A00;margin-top:6px}

  .loading{text-align:center;color:var(--sub);padding:60px 0;font-weight:800}
  @media (min-width:520px){ .wrap{max-width:520px} .card{padding:26px 24px} }
  @media (prefers-reduced-motion:reduce){ *{animation:none !important} }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <button id="back" aria-label="Back">
      <svg width="19" height="19" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M15 5 L8 12 L15 19" fill="none" stroke="#6E6684" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <h1 id="title">Lessons</h1>
    <div class="coins"><span class="coindot"></span><span id="coinN">0</span></div>
  </div>
  <div class="steps hide" id="stepbar"><i></i><i></i><i></i><i></i><i></i></div>
  <main id="stage"><div class="loading">Getting your lesson ready...</div></main>
</div>

<script src="/buildable-wallet.js"></script>
<script>
(function(){
"use strict";

/* ---------------------------------------------------------------
   Session LS1 - the lesson player.
   Five steps: Hello (buddy names the skill) -> Learn (teach cards with
   read-aloud) -> Try it together (hints, cannot fail) -> On your own
   (approved question bank, that exact skill) -> Star check (4 of 5 to master).
   Every single answer goes to the 8B learning ledger. A missed star check is a
   gentle re-teach and another go, never a shame screen.
--------------------------------------------------------------- */

var ART = "/lessons/art/";
var DEFAULT_LESSON = "g1-making-ten";

/* ---- shell awareness (weather.html pattern) ---- */
function iframed(){ try{ return window.parent && window.parent !== window; }catch(e){ return false; } }
var IN_SHELL = iframed();
function postToShell(msg){ if(IN_SHELL){ try{ window.parent.postMessage(msg,"*"); }catch(e){} } }
if(IN_SHELL) document.body.classList.add("in-app");

/* ---- who is playing ---- */
function activeKid(){
  try{ var k=JSON.parse(localStorage.getItem("bk_active_kid_v1")||"null"); return (k&&k.id)?k:null; }
  catch(e){ return null; }
}
var KID = activeKid();
var KID_ID = KID ? KID.id : null;
var KID_GRADE = (KID && KID.grade) ? String(KID.grade) : null;

/* ---- lesson progress (LS2's path map reads this) ---- */
var PROG_KEY = "bk_lessons_v1:" + (KID_ID || "_");
function readProgress(){ try{ return JSON.parse(localStorage.getItem(PROG_KEY)||"{}")||{}; }catch(e){ return {}; } }
function writeProgress(p){ try{ localStorage.setItem(PROG_KEY, JSON.stringify(p)); }catch(e){} }
function recordAttempt(lesson, score, mastered){
  var p = readProgress();
  var row = p[lesson.id] || { attempts:0, best:0, mastered:false };
  row.attempts += 1;
  if(score > row.best) row.best = score;
  if(mastered){ row.mastered = true; row.masteredAt = new Date().toISOString(); }
  row.skill = lesson.skill; row.subject = lesson.subject; row.grade = lesson.grade;
  p[lesson.id] = row; writeProgress(p);
  return row;
}

/* ---- the learning ledger (Session 8B) -----------------------------------
   In the shell: send the cartridge `skill` message up and let the shell relay
   it with the active kid attached (one writer, contract-shaped). Standalone:
   POST the same answer straight to the ledger API so a kid opening /lessons
   directly still counts. Never both -- no double-logging. Fire and forget:
   a logging hiccup must never interrupt a lesson.                            */
function logAnswer(lesson, correct, opts){
  opts = opts || {};
  var msg = {
    source:"buildable", kind:"skill",
    subject: lesson.subject || "math",
    skill: lesson.skill || null,
    correct: !!correct,
    quizType: opts.quizType || "lesson",
    questionId: opts.questionId || null,
    game: "lessons"
  };
  if(IN_SHELL){ postToShell(msg); return; }
  try{
    fetch("/api/log-learning-event", {
      method:"POST", headers:{"Content-Type":"application/json"}, keepalive:true,
      body: JSON.stringify({
        kidProfileId: KID_ID, grade: KID_GRADE || lesson.grade || null,
        subject: msg.subject, skill: msg.skill, quizType: msg.quizType,
        correct: msg.correct, questionId: msg.questionId, game: "lessons"
      })
    }).catch(function(){});
  }catch(e){}
}

/* ---- coins ---- */
function wallet(){ return window.BuildableWallet || null; }
function paintCoins(){
  var w = wallet(); if(!w) return;
  try{ document.getElementById("coinN").textContent = w.balance(); }catch(e){}
}
window.addEventListener("bk-wallet", paintCoins);
paintCoins();

/* ---- read aloud -------------------------------------------------------
   /api/say gives the warm recorded voice but caps at 60 safe characters, so
   lesson copy is authored as short spoken lines ("say"), word-form so that
   "7 + 3" is read as "seven plus three". Anything it cannot serve falls back
   to the browser voice, exactly like weather.html.                          */
var sayToken = 0, sayAudio = null, speaking = false;
function stopSpeech(){
  sayToken++;
  if(sayAudio){ try{ sayAudio.pause(); }catch(e){} sayAudio = null; }
  try{ if(window.speechSynthesis) window.speechSynthesis.cancel(); }catch(e){}
  speaking = false; paintSpeakBtn();
}
function paintSpeakBtn(){
  var b = document.getElementById("speakBtn");
  if(b){ b.classList.toggle("on", speaking); b.querySelector("span").textContent = speaking ? "Stop" : "Read to me"; }
}
function browserSay(text, token, done){
  try{
    if(!window.speechSynthesis || !window.SpeechSynthesisUtterance) return done();
    var u = new SpeechSynthesisUtterance(text);
    u.rate = 0.92; u.pitch = 1.05;
    u.onend = function(){ if(token === sayToken) done(); };
    u.onerror = function(){ if(token === sayToken) done(); };
    window.speechSynthesis.speak(u);
  }catch(e){ done(); }
}
function sayLine(text, token, done){
  var clean = String(text||"").replace(/[^A-Za-z0-9 ,.!?'-]/g,"").trim();
  if(!clean) return done();
  if(clean.length > 60) return browserSay(text, token, done);
  var a = new Audio();
  sayAudio = a;
  var fell = false;
  function fallback(){ if(fell) return; fell = true; if(token===sayToken) browserSay(text, token, done); }
  a.onerror = fallback;
  a.onended = function(){ if(token === sayToken) done(); };
  a.src = "/api/say?t=" + encodeURIComponent(clean);
  var p = a.play(); if(p && p.catch) p.catch(fallback);
}
function readAloud(lines){
  if(speaking){ stopSpeech(); return; }
  var list = (lines||[]).filter(Boolean);
  if(!list.length) return;
  stopSpeech();
  var token = ++sayToken, i = 0;
  speaking = true; paintSpeakBtn();
  (function next(){
    if(token !== sayToken) return;
    if(i >= list.length){ speaking = false; paintSpeakBtn(); return; }
    var line = list[i++];
    sayLine(line, token, next);
  })();
}
var pendingSay = null;
function speakBtn(lines){
  pendingSay = lines || [];
  return '<div><button class="speak" id="speakBtn" type="button" onclick="window.__lessonRead()">' +
    '<svg width="13" height="13" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 1 L11 6 L2 11 Z" fill="#7C5CFC"/></svg>' +
    '<span>Read to me</span></button></div>';
}
window.__lessonRead = function(){ readAloud(pendingSay); };

/* ---- painted ten frames ---- */
function counterImg(name, alt){
  return '<picture><source srcset="'+ART+name+'.webp" type="image/webp">' +
         '<img src="'+ART+name+'.png" alt="'+(alt||"")+'" loading="lazy"></picture>';
}
function frames(a, b, art){
  var per = (art && art.frame) || 10;
  var total = a + b, rows = Math.max(1, Math.ceil(total / per)), html = "";
  for(var r=0; r<rows; r++){
    html += '<div class="frame">';
    for(var s=0; s<per; s++){
      var idx = r*per + s;
      var fill = "";
      if(idx < a) fill = counterImg(art.counterA, "");
      else if(idx < total) fill = counterImg(art.counterB, "");
      html += '<div class="slot">'+fill+'</div>';
    }
    html += '</div>';
  }
  var label = b > 0 ? (a + " and " + b + " makes " + total) : (a + " in the frame");
  return '<div class="frames">'+html+'<div class="count">'+label+'</div></div>';
}

/* ---- tiny helpers ---- */
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
var stage = document.getElementById("stage");
function render(html, sayLines){
  stopSpeech();
  stage.innerHTML = html;
  pendingSay = sayLines || [];
  window.scrollTo(0,0);
}
function bar(n){
  var el = document.getElementById("stepbar");
  el.classList.toggle("hide", n < 0);
  var kids = el.querySelectorAll("i");
  for(var i=0;i<kids.length;i++) kids[i].className = (i < n) ? "done" : "";
}
function ansClass(n){ return n===3 ? "ans c3" : (n>=4 ? "ans c4" : "ans c2"); }
function looksLikeWords(choices){
  for(var i=0;i<choices.length;i++){ if(String(choices[i]).length > 3) return true; }
  return false;
}
function answerGrid(choices, handler){
  var wordy = looksLikeWords(choices);
  var h = '<div class="'+ansClass(choices.length)+(wordy?" words":"")+'">';
  for(var i=0;i<choices.length;i++){
    h += '<button type="button" data-i="'+i+'" onclick="'+handler+'('+i+',this)">'+esc(choices[i])+'</button>';
  }
  return h + '</div>';
}
function lockGrid(el){
  var p = el.parentNode, b = p.querySelectorAll("button");
  for(var i=0;i<b.length;i++) b[i].disabled = true;
}
function markCorrect(el, correctIndex){
  var p = el.parentNode, b = p.querySelectorAll("button");
  if(b[correctIndex]) b[correctIndex].classList.add("right");
}

/* =========================================================================
   THE LESSON
   ========================================================================= */
var L = null;              // the lesson JSON
var soloQs = [];           // approved-bank questions for THIS exact skill
var state = { solo:0, soloScore:0, check:0, checkScore:0, attempt:0 };

function buddy(text){
  return '<div class="buddyrow"><img class="buddyart" src="'+ART+(L.art.buddy)+'.png" alt="Your lesson buddy">' +
         '<div class="bubble">'+esc(text)+'</div></div>';
}

/* ---- Step 1: Hello. The buddy names the skill. ---- */
function stepHello(){
  bar(0);
  var i = L.intro;
  render(
    buddy(i.buddy) +
    '<div class="card">' +
      '<div class="stepname">Step 1 of 5 - Hello</div>' +
      '<h2>'+esc(L.title)+'</h2>' +
      '<p>'+esc(i.body)+'</p>' +
      speakBtn(i.say) +
      '<button class="big" type="button" onclick="window.__go(\'teach\',0)">'+esc(i.cta||"Let's learn")+'</button>' +
    '</div>', i.say);
}

/* ---- Step 2: Learn. 3 to 5 teach cards, each readable aloud. ---- */
function stepTeach(i){
  bar(1);
  i = Math.max(0, Math.min(L.teach.length-1, i|0));
  var c = L.teach[i], last = (i === L.teach.length-1);
  render(
    '<div class="card">' +
      '<div class="stepname">Step 2 of 5 - Learn - card '+(i+1)+' of '+L.teach.length+'</div>' +
      '<h2>'+esc(c.headline)+'</h2>' +
      (c.show ? frames(c.show.a||0, c.show.b||0, L.art) : "") +
      '<p>'+esc(c.body)+'</p>' +
      speakBtn(c.say) +
      '<button class="big" type="button" onclick="window.__go(\''+(last?"guided":"teach")+'\','+(last?0:i+1)+')">' +
        (last ? "Try it with me" : "Next") + '</button>' +
      (i>0 ? '<button class="big ghost" type="button" onclick="window.__go(\'teach\','+(i-1)+')">Back</button>' : "") +
    '</div>', c.say);
}

/* ---- Step 3: Try it together. Hints on tap, a wrong tap just opens the
       hint and waits. There is no way to fail this step. ---- */
function stepGuided(i){
  bar(2);
  i = i|0;
  var q = L.guided[i];
  render(
    '<div class="card">' +
      '<div class="stepname">Step 3 of 5 - Try it together</div>' +
      '<h2>'+esc(q.question)+'</h2>' +
      (q.show ? frames(q.show.a||0, q.show.b||0, L.art) : "") +
      answerGrid(q.choices, "window.__guidedAns") +
      '<div class="hint" id="hint">'+esc(q.hint)+'</div>' +
      '<button class="big ghost" type="button" onclick="window.__hint()">Give me a hint</button>' +
      '<div class="sub">No wrong turns here - we work it out together.</div>' +
    '</div>', q.say);
  window.__guidedIx = i;
}
window.__hint = function(){ var h=document.getElementById("hint"); if(h) h.classList.add("show"); };
window.__guidedAns = function(ix, el){
  var i = window.__guidedIx, q = L.guided[i], ok = (ix === q.correctIndex);
  logAnswer(L, ok, { quizType:"lesson-guided" });
  if(ok){
    el.classList.add("right"); lockGrid(el);
    setTimeout(function(){
      if(i < L.guided.length-1) stepGuided(i+1); else startSolo();
    }, 620);
  } else {
    el.classList.add("wrong"); el.disabled = true;
    window.__hint();
  }
};

/* ---- Step 4: On your own. Questions come from the APPROVED question bank
       for this exact skill, topped up locally so a kid is never blocked. ---- */
function lessonOwnQuestions(){
  return ((L.solo && L.solo.fallback) || []).map(function(q){
    return { question:q.question, choices:q.choices, correctIndex:q.correctIndex,
             skill:L.skill, source:"lesson" };
  });
}
function startSolo(){
  state.solo = 0; state.soloScore = 0;
  // The bank request was fired at boot. If it has not landed yet (slow network),
  // wait a beat on a friendly screen rather than skipping the step, then fall
  // back to the lesson's own reviewed questions. Step 4 never gets skipped.
  if(soloQs.length){ stepSolo(); return; }
  bar(3);
  render('<div class="card"><div class="stepname">Step 4 of 5 - On your own</div>' +
         '<h2>Picking your questions</h2><p>One moment.</p></div>');
  var waited = 0;
  (function poll(){
    if(soloQs.length) return stepSolo();
    waited += 250;
    if(waited >= 4000){ soloQs = lessonOwnQuestions(); return soloQs.length ? stepSolo() : startCheck(); }
    setTimeout(poll, 250);
  })();
}
function stepSolo(){
  bar(3);
  var i = state.solo, q = soloQs[i];
  if(!q){ startCheck(); return; }
  var srcNote = q.source === "bank" ? "From your approved question bank" : "Practice question";
  render(
    '<div class="card">' +
      '<div class="stepname">Step 4 of 5 - On your own</div>' +
      (q.story ? '<p>'+esc(q.story)+'</p>' : "") +
      '<h2>'+esc(q.question)+'</h2>' +
      (q.clue ? '<p class="sub">'+esc(q.clue)+'</p>' : "") +
      answerGrid(q.choices, "window.__soloAns") +
      '<div class="sub">Question '+(i+1)+' of '+soloQs.length+' - '+srcNote+'</div>' +
    '</div>');
}
window.__soloAns = function(ix, el){
  var q = soloQs[state.solo], ok = (ix === q.correctIndex);
  logAnswer(L, ok, { quizType:"lesson-practice", questionId: q.id || null });
  el.classList.add(ok ? "right" : "wrong");
  lockGrid(el);
  if(!ok) markCorrect(el, q.correctIndex);
  if(ok) state.soloScore++;
  setTimeout(function(){
    state.solo++;
    if(state.solo < soloQs.length) stepSolo(); else startCheck();
  }, ok ? 620 : 1150);
};

/* ---- Step 5: Star check. 4 of 5 earns the star and the coins. ---- */
function startCheck(){ state.check = 0; state.checkScore = 0; stepCheck(); }
function stepCheck(){
  bar(4);
  var i = state.check, q = L.check[i];
  render(
    '<div class="card">' +
      '<div class="stepname">Step 5 of 5 - Star check</div>' +
      '<h2>'+esc(q.question)+'</h2>' +
      answerGrid(q.choices, "window.__checkAns") +
      '<div class="sub">Get '+L.mastery.need+' of '+L.mastery.of+' to earn your star - question '+(i+1)+' of '+L.check.length+'</div>' +
    '</div>');
}
window.__checkAns = function(ix, el){
  var q = L.check[state.check], ok = (ix === q.correctIndex);
  logAnswer(L, ok, { quizType:"lesson-check" });
  el.classList.add(ok ? "right" : "wrong");
  lockGrid(el);
  if(!ok) markCorrect(el, q.correctIndex);
  if(ok) state.checkScore++;
  setTimeout(function(){
    state.check++;
    if(state.check < L.check.length) stepCheck(); else finish(state.checkScore);
  }, ok ? 560 : 1000);
};

/* ---- The ending. Mastered, or a gentle re-teach. Never a shame screen. ---- */
function finish(score){
  bar(5);
  state.attempt++;
  var mastered = score >= L.mastery.need;
  var row = recordAttempt(L, score, mastered);
  var coins = 0;

  if(mastered){
    var w = wallet();
    if(w && L.reward && L.reward.coins){
      try{ coins = w.awardOnce("lesson:"+L.id+":"+(KID_ID||"_"), L.reward.coins) || 0; }catch(e){ coins = 0; }
    }
    paintCoins();
    postToShell({ source:"buildable", kind:"levelComplete", text:L.title });
    postToShell({ source:"buildable", kind:"cheer", text:(L.mastered && L.mastered.headline) || "Lesson mastered" });
    var m = L.mastered || {};
    render(
      '<div class="card">' +
        '<img class="starbig" src="'+ART+L.art.star+'.png" alt="Gold star">' +
        '<div class="won">'+esc(m.headline || ("You mastered " + L.title + "!"))+'</div>' +
        '<p>'+score+' of '+L.check.length+' right on the star check.</p>' +
        (coins > 0 ? '<div class="reward"><span class="coindot"></span>'+coins+' coins</div>'
                   : '<div class="sub">You already earned the coins for this lesson - the star is yours for keeps.</div>') +
        '<button class="big" type="button" onclick="window.__exit()">Back to my lessons</button>' +
        '<button class="big ghost" type="button" onclick="window.__go(\'teach\',0)">Do it again</button>' +
      '</div>', m.say);
    return;
  }

  var r = L.reteach || {};
  render(
    buddy(r.body || "Making this one stick takes a couple of goes. Let's look again.") +
    '<div class="card">' +
      '<h2>'+esc(r.headline || "So close!")+'</h2>' +
      '<p>You got '+score+' of '+L.check.length+'. The star is still waiting for you - it does not go anywhere.</p>' +
      speakBtn(r.say) +
      '<button class="big" type="button" onclick="window.__go(\'teach\',0)">'+esc(r.cta || "Show me again")+'</button>' +
      '<button class="big ghost" type="button" onclick="window.__go(\'check\',0)">Try the star check again</button>' +
      '<button class="big ghost" type="button" onclick="window.__exit()">Come back later</button>' +
    '</div>', r.say);
}

/* ---- routing ---- */
window.__go = function(where, i){
  if(where === "teach") return stepTeach(i);
  if(where === "guided") return stepGuided(i||0);
  if(where === "solo") return startSolo();
  if(where === "check") return startCheck();
  return stepHello();
};
window.__exit = function(){
  stopSpeech();
  postToShell("nav:exit");
  if(!IN_SHELL){ if(history.length > 1) history.back(); else location.href = "/app"; }
};
document.getElementById("back").addEventListener("click", window.__exit);

/* shell pause contract: stop the voice when the shell backgrounds us */
window.addEventListener("message", function(e){
  var d = e && e.data;
  var t = (typeof d === "string") ? d : (d && d.type);
  if(t === "pause" || t === "hidden") stopSpeech();
});
document.addEventListener("visibilitychange", function(){ if(document.hidden) stopSpeech(); });

/* ---- boot ---- */
function lessonIdFromUrl(){
  var m = /[?&](?:id|lesson)=([A-Za-z0-9_-]{1,64})/.exec(location.search);
  return m ? m[1] : DEFAULT_LESSON;
}
function fatal(msg){
  render('<div class="card"><h2>That lesson is not ready yet</h2><p>'+esc(msg)+'</p>' +
         '<button class="big" type="button" onclick="window.__exit()">Go back</button></div>');
  bar(-1);
}

(function boot(){
  var id = lessonIdFromUrl();
  fetch("/lessons/"+id+".json", { cache:"no-cache" })
    .then(function(r){ if(!r.ok) throw new Error("missing"); return r.json(); })
    .then(function(json){
      L = json;
      if(!L || !L.check || !L.teach || !L.mastery) throw new Error("bad lesson");
      document.getElementById("title").textContent = L.title || "Lesson";
      // Ask for this lesson's practice questions while the kid reads step 1.
      var n = (L.solo && L.solo.count) || 6;
      var url = "/api/lesson-questions?subject="+encodeURIComponent(L.subject)+
                "&grade="+encodeURIComponent(L.grade||"")+
                "&skill="+encodeURIComponent(L.skill)+"&n="+n;
      fetch(url).then(function(r){ return r.ok ? r.json() : null; }).then(function(d){
        if(d && d.ok && d.questions && d.questions.length) soloQs = d.questions;
      }).catch(function(){}).then(function(){
        // Last resort: the reviewed questions written into the lesson itself.
        if(!soloQs.length) soloQs = lessonOwnQuestions();
      });
      stepHello();
    })
    .catch(function(){ fatal("We could not load this lesson. Try again in a moment."); });
})();

})();
</script>
