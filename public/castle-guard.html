   Defenders (Archer) fire soft arrows at silly goblins walking a path.
   A bonked goblin POOFS into smoke and goes home (no health bars, no harsh
   loss). Goblins that slip into the castle cost a heart; at zero hearts you
   simply replay the wave — never a game-over screen.

   Content is data (GAME_CONFIG): path, waves, defender stats, goblin stats.
   Adding a level/world = editing data, never engine code.
   Art = Tiny Swords (Pixel Frog) curated sprites, with BR drawn fallbacks.
   Sound = created ElevenLabs one-shots via BA (synth is silent fallback only).
   ===================================================================== */

/* ---------- logical design resolution (all gameplay math uses these) ----------
   Responsive: anchor the SHORTER side to REF (keeps sprites the same size on every
   device) and grow the longer side to match the screen shape, so the field fills the
   whole screen on phone/tablet with no letterbox bars. */
let LW = 960, LH = 600;
const REF = 600;
function computeDims() {
  let cw = 960, ch = 600;
  try { if (cv) { const r = cv.getBoundingClientRect(); if (r.width > 0 && r.height > 0) { cw = r.width; ch = r.height; } } } catch (e) {}
  let aspect = cw / ch;
  aspect = Math.max(0.42, Math.min(2.6, aspect));   // clamp extreme shapes
  if (aspect >= 1) { LH = REF; LW = Math.round(REF * aspect); }
  else { LW = REF; LH = Math.round(REF / aspect); }
}

/* Session 7B: level names can come from /castleguard/manifest.json, FULL fallback. */
(function loadCastleManifest(){
  try{
    if(!window.BuildableManifest || typeof window.BuildableManifest.load!=="function") return;
    window.BuildableManifest.load("castleguard", function(cfg){
      try{
        if(cfg && cfg.stages && cfg.stages.length){
          for(var i=0;i<GAME_CONFIG.levels.length && i<cfg.stages.length;i++){ if(cfg.stages[i].name) GAME_CONFIG.levels[i].name = cfg.stages[i].name; }
          try{ if(typeof state!=="undefined" && state==="menu" && typeof showMenu==="function") showMenu(); }catch(e){}
        }
      }catch(e){}
    }, function(){ /* missing/invalid -> keep built-in levels */ });
  }catch(e){}
})();

/* ---------- image loading + frame slicing (with graceful fallback) ---------- */
const IMG = {};            // name -> HTMLImageElement (or stub)
let imagesReady = false;
function mkImg(src) {
  const im = (typeof Image !== "undefined") ? new Image() : {};
  try { im.crossOrigin = "anonymous"; } catch (e) {}
  if (src && "src" in im) im.src = src;
  return im;
}
function loadSprites() {
  const S = GAME_CONFIG.sprites, base = GAME_CONFIG.spriteBase;
  for (const k in S) IMG[k] = mkImg(base + S[k].file);
  imagesReady = true;
  // once the castle art arrives, rebuild level thumbnails so cards aren't flat
  try { if (IMG.castle && IMG.castle.addEventListener) IMG.castle.addEventListener("load", () => { for (const k in THUMB) delete THUMB[k]; if (state === "menu") showMenu(); }); } catch (e) {}
}
// tinted-sheet cache: recolor a whole sprite sheet once (source-atop keeps shading),
// so one goblin art can read as several enemy kinds (scout / brute / boss).
const TINT = {};
function tintedSheet(name, tint, a) {
  const key = name + "|" + tint + "|" + (a == null ? 0.5 : a);
  if (key in TINT) return TINT[key];
  const im = IMG[name];
  if (!im || !im.complete || !(im.naturalWidth || im.width)) return null;  // not ready yet — retry later
  try {
    const cvs = document.createElement("canvas");
    const iw = im.naturalWidth || im.width, ih = im.naturalHeight || im.height;
    cvs.width = iw; cvs.height = ih;
    const c = cvs.getContext("2d");
    c.drawImage(im, 0, 0);
    c.globalCompositeOperation = "source-atop";
    c.globalAlpha = (a == null ? 0.5 : a);
    c.fillStyle = tint; c.fillRect(0, 0, iw, ih);
    c.globalAlpha = 1; c.globalCompositeOperation = "source-over";
    if (!cvs.width) return null;                 // headless / unsupported — skip tint
    TINT[key] = cvs; return cvs;
  } catch (e) { return null; }
}
// draw one animation frame of a sheet sprite, centered at cx,cy, scaled to height h.
function drawSprite(ctx, name, cx, cy, h, t, opt) {
  opt = opt || {};
  const meta = GAME_CONFIG.sprites[name], im = IMG[name];
  const ok = im && im.complete && (im.naturalWidth || im.width);
  if (!ok || !meta) return false;
  let src = im;
  if (opt.tint) { const ts = tintedSheet(name, opt.tint, opt.tintA); if (ts) src = ts; }
  const fw = meta.fw, fh = meta.fh, n = meta.n || 1;
  let f = 0;
  if (n > 1) f = (meta.fps ? Math.floor((t || 0) * meta.fps) : 0) % n;
  if (opt.frame != null) f = opt.frame % n;
  const sx = f * fw, w = h * (fw / fh);
  ctx.save();
  if (opt.alpha != null) ctx.globalAlpha = opt.alpha;
  ctx.translate(cx, cy);
  if (opt.scale && opt.scale !== 1) ctx.scale(opt.scale, opt.scale);
  if (opt.flip) ctx.scale(-1, 1);
  try { ctx.drawImage(src, sx, 0, fw, fh, -w / 2, -h / 2, w, h); } catch (e) { ctx.restore(); return false; }
  ctx.restore();
  return true;
}

/* ---------- prefs (unlock + stars), localStorage with safe fallback ---------- */
const PREFS = { unlocked: 0, stars: {} };
function loadPrefs() { try { const d = JSON.parse(localStorage.getItem("castleguard") || "{}");
  PREFS.unlocked = d.unlocked || 0; PREFS.stars = d.stars || {}; } catch (e) {} }

/* ===================================================================== */
/*  GAME STATE + PURE SIMULATION (no canvas) — drives both play and QA   */
/* ===================================================================== */
let S = null;                 // active game state
let state = "menu";           // "menu" | "play" | "wavebreak" | "retry" | "win"
let fx = BM ? BM.makeFx() : { parts: [], pops: [], shake: 0, flash: 0, flashCol: "#fff" };
let toastMsg = "", toastT = 0;
let selDef = "archer";        // currently-selected defender to build
let defChips = [];            // bottom-bar picker hit-rects (logical coords)
function toast(m) { if (DEMO) return; toastMsg = m; toastT = 2.2; }

function mulberry(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

/* build path geometry in logical coords; compute slot positions */
function buildLevel(idx) {
  const L = GAME_CONFIG.levels[idx];
  const pts = L.path.map(p => ({ x: p[0] * LW, y: p[1] * LH }));
  const segs = [];
  let total = 0;
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], b = pts[i + 1];
    const len = Math.hypot(b.x - a.x, b.y - a.y);
    segs.push({ a, b, len, start: total }); total += len;
  }
  // derive build slots: walk the path, drop a slot offset perpendicular, alternating sides
  const slots = [];
  const every = GAME_CONFIG.build.slotEvery, off = GAME_CONFIG.build.slotOffset;
  const MINPATH = 46;   // a build pad must sit clear of the road, never on it
  let d = every * 0.55, side = 1;
  while (d < total - 12) {
    const p = pointAtRaw(segs, total, d);
    const nx = -p.dy, ny = p.dx;                 // unit normal
    let placed = null;
    // step the pad further out (and try either side) until it's on-screen AND off the path
    for (const o of [off, off + 22, off + 44]) {
      for (const sgn of [side, -side]) {
        const sx = p.x + nx * o * sgn, sy = p.y + ny * o * sgn;
        if (sx < 46 || sx > LW - 46 || sy < 64 || sy > LH - 42) continue;   // off-screen
        if (distToPath(segs, total, sx, sy) < MINPATH) continue;            // still over the road
        placed = { x: sx, y: sy, occupied: false }; break;
      }
      if (placed) break;
    }
    if (placed) slots.push(placed);
    d += every; side *= -1;
  }
  // decorative scatter (separate RNG; never affects gameplay)
  const rng = mulberry(1000 + idx * 7);
  const decor = [];
  const kinds = ["tree", "tree", "bush1", "bush2", "rock1", "rock2"];
  const castlePt = pts[pts.length - 1];
  const MX = 74;                                   // side margin so full-width trees never clip the edge
  for (let i = 0; i < 22; i++) {
    const x = MX + rng() * (LW - MX * 2);
    const y = 132 + rng() * (LH - 214);            // top clear of the HUD, bottom clear of the guard bar
    // keep decor off the path, off slots, and away from the castle
    if (distToPath(segs, total, x, y) < 58) continue;
    if (Math.hypot(castlePt.x - x, castlePt.y - y) < 130) continue;
    let nearSlot = false;
    for (const s of slots) if (Math.hypot(s.x - x, s.y - y) < 62) { nearSlot = true; break; }
    if (nearSlot) continue;
    const kind = kinds[(rng() * kinds.length) | 0];
    decor.push({ kind, x, y, h: kind === "tree" ? 120 : kind.startsWith("bush") ? 60 : 40, ph: rng() * 6.28 });
  }
  decor.sort((a, b) => a.y - b.y);
  return { L, idx, pts, segs, total, slots, decor, castle: pts[pts.length - 1], spawn: pts[0] };
}
// position + tangent at distance d along the path
function pointAtRaw(segs, total, d) {
  d = Math.max(0, Math.min(total, d));
  for (const s of segs) {
    if (d <= s.start + s.len || s === segs[segs.length - 1]) {
      const u = s.len ? (d - s.start) / s.len : 0;
      const dx = (s.b.x - s.a.x) / (s.len || 1), dy = (s.b.y - s.a.y) / (s.len || 1);
      return { x: s.a.x + (s.b.x - s.a.x) * u, y: s.a.y + (s.b.y - s.a.y) * u, dx, dy };
    }
  }
  const last = segs[segs.length - 1].b; return { x: last.x, y: last.y, dx: 1, dy: 0 };
}
function distToPath(segs, total, x, y) {
  let best = 1e9;
  for (const s of segs) {
    const vx = s.b.x - s.a.x, vy = s.b.y - s.a.y, l2 = vx * vx + vy * vy || 1;
    let t = ((x - s.a.x) * vx + (y - s.a.y) * vy) / l2; t = Math.max(0, Math.min(1, t));
    const px = s.a.x + vx * t, py = s.a.y + vy * t;
    best = Math.min(best, Math.hypot(x - px, y - py));
  }
  return best;
}

/* start a fresh level */
function startLevel(idx) {
  const W = buildLevel(idx);
  S = {
    W, idx, hearts: W.L.hearts, maxHearts: W.L.hearts,
    coins: W.L.startCoins != null ? W.L.startCoins : GAME_CONFIG.econ.startCoins,
    waveIdx: 0, baddies: [], arrows: [], bombs: [], defenders: [],
    spawnQueue: [], spawnTimer: 0, betweenT: 0, t: 0, perfect: true,
  };
  beginWave(0);
  // tutorial target: the empty slot nearest the goblins' entrance (taught with a hand, no words)
  let bi = -1, bd = 1e9;
  S.W.slots.forEach((s, i) => { const d = Math.hypot(s.x - S.W.spawn.x, s.y - S.W.spawn.y); if (!s.occupied && d < bd) { bd = d; bi = i; } });
  S.tutSlot = bi;
  state = "play";
  toast("Tap a glowing spot!");
  sayVoice("Tap a glowing spot to place a guard!");
}
function beginWave(wi) {
  const wv = S.W.L.waves[wi];
  S.waveIdx = wi;
  const q = [];
  // a wave is either a single {baddie,count,...} or a set of mixed {groups:[...]}
  const groups = wv.groups || [{ baddie: wv.baddie, count: wv.count, spacingMs: wv.spacingMs, speed: wv.speed, hits: wv.hits }];
  for (const grp of groups) {
    for (let i = 0; i < (grp.count || 0); i++) {
      q.push({ baddie: grp.baddie, gap: grp.spacingMs || wv.spacingMs || 1500, speed: grp.speed, hits: grp.hits });
    }
  }
  S.spawnQueue = q;
  S.spawnTimer = 1.0;          // small grace so the kid can place a tower first
}

/* place a defender at a slot (returns true on success) */
function placeDefender(slotIdx, defId) {
  const slot = S.W.slots[slotIdx]; if (!slot || slot.occupied) return false;
  const def = GAME_CONFIG.defenders.find(d => d.id === (defId || "archer")) || GAME_CONFIG.defenders[0];
  if ((def.unlockAt || 0) > (PREFS.unlocked || 0)) return false;   // not recruited yet
  if (S.coins < def.cost) { toast("Need more coins!"); sfx("heart", { vol: 0.3 }); return false; }
  S.coins -= def.cost; slot.occupied = true;
  S.defenders.push({ x: slot.x, y: slot.y, def, cool: 0, anim: 0, shootT: 0, face: 1, ring: 1.6 });
  sfx("place");
  if (BM) BM.burst(fx.parts, slot.x, slot.y, "#ffe08a", 10);
  return true;
}

/* core simulation step — dt in seconds. NO canvas access (headless-safe). */
function step(dt) {
  if (state !== "play") return;
  S.t += dt;
  const econ = GAME_CONFIG.econ;

  // spawn from queue
  if (S.spawnQueue.length) {
    S.spawnTimer -= dt;
    if (S.spawnTimer <= 0) {
      const it = S.spawnQueue.shift();
      const kind = GAME_CONFIG.baddies[it.baddie] || GAME_CONFIG.baddies.pawn;
      const hits = it.hits || kind.hits, speed = it.speed || kind.speed;
      S.baddies.push({ dist: 0, hp: hits, max: hits,
        speed, kind, r: kind.r || 26, poof: 0, hit: 0, gone: false, bob: Math.random() * 6 });
      S.spawnTimer = (S.spawnQueue[0] ? S.spawnQueue[0].gap : 0) / 1000;
    }
  }

  // defenders fire
  for (const g of S.defenders) {
    g.anim += dt; if (g.shootT > 0) g.shootT -= dt; if (g.ring > 0) g.ring -= dt;
    g.cool -= dt;
    if (g.cool <= 0) {
      // nearest live baddie within range
      let best = null, bd = 1e9;
      for (const b of S.baddies) {
        if (b.poof || b.gone) continue;
        const p = pointAtRaw(S.W.segs, S.W.total, b.dist);
        const d = Math.hypot(p.x - g.x, p.y - g.y);
        if (d <= g.def.range && d < bd) { bd = d; best = b; best._p = p; }
      }
      if (best) {
        g.cool = g.def.fireMs / 1000; g.shootT = 0.22; g.face = (best._p.x >= g.x) ? 1 : -1;
        if (g.def.melee) {
          // gentle melee bonk — no projectile, damage the nearby goblin directly
          best.hp -= g.def.dmg; best.hit = 0.18;
          if (BM) { BM.burst(fx.parts, best._p.x, best._p.y - 14, "#ffe9b0", 8); BM.shake(fx, 0.10); }
          sfx("bonk", { vol: 0.5 });
          if (best.hp <= 0) poofBaddie(best, best._p);
        } else if (g.def.lob) {
          // Bomber: lob a bomb to where the target is now; it POOFs an area on landing
          S.bombs.push({ x0: g.x, y0: g.y - 30, x: g.x, y: g.y - 30,
            tx: best._p.x, ty: best._p.y, t: 0, dur: 0.72, dmg: g.def.dmg, splash: g.def.splash });
          sfx("shoot", { vol: 0.4 });
        } else {
          const ang = Math.atan2(best._p.y - (g.y - 30), best._p.x - g.x);
          S.arrows.push({ x: g.x + g.face * 8, y: g.y - 30, vx: Math.cos(ang) * 560, vy: Math.sin(ang) * 560,
            target: best, dmg: g.def.dmg, life: 1.4 });
          sfx("shoot", { vol: 0.5 });
        }
      }
    }
  }

  // arrows
  for (const a of S.arrows) {
    a.life -= dt; if (a.life <= 0) { a.dead = true; continue; }
    // gentle homing toward the (still-live) target's current position
    const b = a.target;
    if (b && !b.poof && !b.gone) {
      const p = pointAtRaw(S.W.segs, S.W.total, b.dist);
      const ang = Math.atan2(p.y - a.y, p.x - a.x), sp = 600;
      a.vx += (Math.cos(ang) * sp - a.vx) * Math.min(1, dt * 9);
      a.vy += (Math.sin(ang) * sp - a.vy) * Math.min(1, dt * 9);
      if (Math.hypot(p.x - a.x, p.y - a.y) < (b.r || 24)) {
        a.dead = true; b.hp -= a.dmg; b.hit = 0.18;
        if (BM) BM.burst(fx.parts, a.x, a.y, "#fff2c8", 6);
        if (b.hp <= 0) poofBaddie(b, p);
      }
    }
    a.x += a.vx * dt; a.y += a.vy * dt;
    if (a.x < -40 || a.x > LW + 40 || a.y < -40 || a.y > LH + 40) a.dead = true;
  }
  S.arrows = S.arrows.filter(a => !a.dead);

  // bombs (Bomber): arc to the landing spot, then a gentle area POOF
  for (const bo of S.bombs) {
    bo.t += dt;
    const u = Math.min(1, bo.t / bo.dur);
    bo.x = bo.x0 + (bo.tx - bo.x0) * u;
    bo.y = bo.y0 + (bo.ty - bo.y0) * u - Math.sin(u * Math.PI) * 76;   // parabolic lob
    if (u >= 1) {
      bo.dead = true;
      if (BM) { BM.explode(fx, bo.tx, bo.ty, "#ffe0a0", { n: 18, pop: "POOF!" }); BM.shake(fx, 0.12); }
      sfx("poof");
      for (const b of S.baddies) {
        if (b.poof || b.gone) continue;
        const p = pointAtRaw(S.W.segs, S.W.total, b.dist);
        if (Math.hypot(p.x - bo.tx, p.y - bo.ty) <= bo.splash + (b.r || 24) * 0.4) {
          b.hp -= bo.dmg; b.hit = 0.18;
          if (BM) BM.burst(fx.parts, p.x, p.y - 12, "#fff2c8", 5);
          if (b.hp <= 0) poofBaddie(b, p);
        }
      }
    }
  }
  S.bombs = S.bombs.filter(bo => !bo.dead);

  // baddies walk / poof
  for (const b of S.baddies) {
    if (b.hit > 0) b.hit -= dt;
    if (b.poof > 0) { b.poof -= dt; if (b.poof <= 0) b.gone = true; continue; }
    b.dist += b.speed * dt;
    if (b.dist >= S.W.total) {            // slipped into the castle
      b.gone = true; S.hearts = Math.max(0, S.hearts - 1); S.perfect = false;
      sfx("heart"); if (BM) { BM.flash(fx, "#ff9a6b", 0.18); BM.shake(fx, 0.18); }
      if (S.hearts <= 0) { enterRetry(); return; }
    }
  }
  S.baddies = S.baddies.filter(b => !b.gone);

  // wave / level completion
  if (state === "play" && S.spawnQueue.length === 0 && S.baddies.length === 0) {
    if (S.waveIdx < S.W.L.waves.length - 1) {
      S.coins += econ.waveBonus; toast("Wave clear!  +" + econ.waveBonus + " coins");
      sfx("win", { vol: 0.5 }); state = "wavebreak"; S.betweenT = 5.0;
    } else {
      winLevel();
    }
  }

  if (BM) BM.update(fx, dt);
}
function poofBaddie(b, p) {
  b.poof = 0.45;
  S.coins += (b.kind.reward != null ? b.kind.reward : GAME_CONFIG.econ.perPoof);
  if (BM) { BM.explode(fx, p.x, p.y, "#cfd8c0", { n: 16, pop: "poof!" }); }
  if (BM) BM.pop(fx.pops, p.x, p.y - 18, "+" + (b.kind.reward || GAME_CONFIG.econ.perPoof), "#ffe08a");
  sfx("poof"); sfx("coin", { vol: 0.6 });
}
function enterRetry() {
  state = "retry";
  toast("");
}
function retryWave() {
  S.hearts = S.maxHearts; S.baddies = []; S.arrows = []; S.bombs = [];
  beginWave(S.waveIdx); state = "play";
  toast("Here they come again — you've got this!");
}
function winLevel() {
  state = "win";
  if (DEMO) return;   // attract mode: no stars, no saves, no win signal — the quiet loop restarts
  const stars = S.hearts >= S.maxHearts ? 3 : S.hearts >= Math.ceil(S.maxHearts * 0.6) ? 2 : 1;
  PREFS.stars[S.idx] = Math.max(PREFS.stars[S.idx] || 0, stars);
  const prevUnlocked = PREFS.unlocked || 0;
  if (S.idx + 1 > PREFS.unlocked) PREFS.unlocked = Math.min(GAME_CONFIG.levels.length - 1, S.idx + 1);
  // a guard whose unlock threshold we just crossed "joins the team"
  S._newGuard = null;
  for (const d of GAME_CONFIG.defenders) {
    if ((d.unlockAt || 0) > 0 && prevUnlocked < d.unlockAt && (PREFS.unlocked || 0) >= d.unlockAt) S._newGuard = d.name;
  }

  sfx("win"); if (BM) BM.explode(fx, LW / 2, LH * 0.4, "#ffd86b", { n: 30, pop: "You win!" });
  try { window.parent.postMessage({ source: "buildable", kind: "win" }, "*"); } catch (e) {}
  S._stars = stars;
}

/* between-wave timer advances outside step() so it still ticks in "wavebreak" */
function tickNonPlay(dt) {
  if (state === "wavebreak") { S.betweenT -= dt; if (S.betweenT <= 0) { state = "play"; beginWave(S.waveIdx + 1); } }
  if (BM && state !== "play") BM.update(fx, dt);
}

/* ===================================================================== */
/*  RENDER (skipped headless)                                            */
/* ===================================================================== */
const cv = (typeof document !== "undefined") ? document.getElementById("game") : null;
const ctx = cv ? cv.getContext("2d") : null;
let VIEW = { scale: 1, ox: 0, oy: 0, cw: LW, ch: LH };
function resize() {
  if (!cv) return;
  const r = cv.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.max(1, r.width * dpr); cv.height = Math.max(1, r.height * dpr);
  const oldLW = LW, oldLH = LH;
  computeDims();
  // orientation / big shape change mid-level: rebuild the field but keep towers + progress
  if (S && (Math.abs(LW - oldLW) > 1 || Math.abs(LH - oldLH) > 1)) rescaleLevel(oldLW, oldLH);
  const scale = Math.min(cv.width / LW, cv.height / LH);
  VIEW = { scale, ox: (cv.width - LW * scale) / 2, oy: (cv.height - LH * scale) / 2, cw: cv.width, ch: cv.height };
}
// rebuild path/slots/decor at the new LW/LH, preserving placed towers + enemy progress
function rescaleLevel(oldLW, oldLH) {
  try {
    const defs = S.defenders.map(d => ({ def: d.def, cool: d.cool, x: d.x / (oldLW || 1), y: d.y / (oldLH || 1) }));
    const oldTotal = S.W.total || 1;
    const badFr = S.baddies.map(b => ({ b, fr: b.dist / oldTotal }));
    const W = buildLevel(S.idx); S.W = W;
    S.defenders = [];
    for (const d of defs) {
      const tx = d.x * LW, ty = d.y * LH;
      let bi = -1, bd = 1e9;
      W.slots.forEach((s, i) => { if (!s.occupied) { const dd = Math.hypot(s.x - tx, s.y - ty); if (dd < bd) { bd = dd; bi = i; } } });
      if (bi >= 0) { W.slots[bi].occupied = true; S.defenders.push({ x: W.slots[bi].x, y: W.slots[bi].y, def: d.def, cool: d.cool, anim: 0, shootT: 0, face: 1, ring: 0 }); }
    }
    for (const bf of badFr) bf.b.dist = bf.fr * W.total;
    S.arrows = [];
    let bi = -1, bd = 1e9;
    W.slots.forEach((s, i) => { const dd = Math.hypot(s.x - W.spawn.x, s.y - W.spawn.y); if (!s.occupied && dd < bd) { bd = dd; bi = i; } });
    S.tutSlot = bi;
  } catch (e) {}
}
if (cv) { window.addEventListener("resize", resize); window.addEventListener("orientationchange", () => setTimeout(resize, 120)); }

function render() {
  if (!ctx) return;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, VIEW.cw, VIEW.ch);
  // letterbox bg
  ctx.fillStyle = "#3a7d2f"; ctx.fillRect(0, 0, VIEW.cw, VIEW.ch);
  ctx.setTransform(VIEW.scale, 0, 0, VIEW.scale, VIEW.ox, VIEW.oy);
  const sh = BM ? BM.shakeOffset(fx) : { x: 0, y: 0 };
  ctx.translate(sh.x, sh.y);

  drawWorld();
  if (S) {
    drawSlots();
    drawCastle();
    // sort drawables by y for depth
    const draws = [];
    for (const d of S.W.decor) draws.push({ y: d.y, fn: () => drawDecor(d) });
    for (const g of S.defenders) draws.push({ y: g.y, fn: () => drawDefender(g) });
    for (const b of S.baddies) { const p = pointAtRaw(S.W.segs, S.W.total, b.dist); b._p = p; draws.push({ y: p.y, fn: () => drawBaddie(b, p) }); }
    draws.sort((a, b) => a.y - b.y);
    for (const d of draws) d.fn();
    for (const a of S.arrows) drawArrow(a);
    for (const bo of S.bombs) drawBomb(bo);
    if (state === "play" && S.defenders.length === 0 && S.tutSlot >= 0 && !DEMO) drawTutorialHand();
    const _w = curWorld(); if (_w && _w.wash) { ctx.save(); ctx.fillStyle = _w.wash; ctx.fillRect(0, 0, LW, LH); ctx.restore(); }
  }
  if (BM) BM.draw(ctx, fx, { W: LW, H: LH });
  if (S) drawHUD();
  drawToast();
  if (state === "retry" && !DEMO) drawRetry();
  if (state === "win" && !DEMO) drawWin();
  if (DEMO) cgDemoDrawHand();
}

function curWorld() { return (S && S.W && S.W.L && S.W.L.world) ? S.W.L.world : GAME_CONFIG.world; }
function drawWorld() {
  const w = curWorld();
  const g = ctx.createLinearGradient(0, 0, 0, LH);
  g.addColorStop(0, w.grassTop); g.addColorStop(1, w.grassBot);
  ctx.fillStyle = g; ctx.fillRect(0, 0, LW, LH);
  // soft texture stripes
  ctx.globalAlpha = 0.06; ctx.fillStyle = "#1f5a18";
  for (let y = 24; y < LH; y += 48) ctx.fillRect(0, y, LW, 18);
  ctx.globalAlpha = 1;
  if (S) drawPath();
}
function drawPath() {
  const pts = S.W.pts, wc = curWorld();
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.strokeStyle = wc.pathEdge; ctx.lineWidth = 56;

function toLogical(clientX, clientY) {
  const r = cv.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
  const px = (clientX - r.left) * dpr, py = (clientY - r.top) * dpr;

}
function onTap(clientX, clientY) {

  if (BA) BA.unlock();
  if (state === "retry") { retryWave(); return; }
  if (state === "win") { if (CG_LVL != null) { exitGame(); } else { showMenu(); } return; }  // 7J: opened from the Journey -> go back to it (not the engine's own grid)
  if (state !== "play" && state !== "wavebreak") return;
  const p = toLogical(clientX, clientY);
  // 1) did we tap a defender picker chip? (select, don't place)
  for (const c of defChips) {
    if (p.x >= c.x && p.x <= c.x + c.w && p.y >= c.y && p.y <= c.y + c.h) {
      if (c.locked) { toast("Keep going to unlock!"); sfx("heart", { vol: 0.2 }); return; }
      selDef = c.id; sfx("place", { vol: 0.3 }); return;
    }
  }
  // 2) otherwise place the selected defender on the nearest empty slot within reach
  let bi = -1, bd = 44;
  S.W.slots.forEach((s, i) => { if (!s.occupied) { const d = Math.hypot(s.x - p.x, s.y - p.y); if (d < bd) { bd = d; bi = i; } } });
  if (bi >= 0) placeDefender(bi, selDef);
}

    onMenu: () => { if (state !== "menu") showMenu(); },
    soundOn: () => !(BA && BA.muted),
    inGame: () => state !== "menu",
  });
} catch (e) {}

/* ===================================================================== */
/*  MAIN LOOP                                                            */
/* ===================================================================== */
let last = 0;
function frame(ts) {
  const dt = last ? Math.min(0.05, (ts - last) / 1000) : 0; last = ts;
  if (toastT > 0) toastT -= dt;
  if (DEMO) cgDemoTick(dt);
  if (state === "play") step(dt); else tickNonPlay(dt);
  render();
  requestAnimationFrame(frame);
}

/* ---------- boot ---------- */
var cgHand = { x: 0, y: 0, init: false, target: -1, timer: 0.8, press: 0 };   // declared before boot: the demo path uses it right away
if (typeof document !== "undefined" && cv) {
  loadPrefs(); loadSprites(); resize();
  /* Session 7I: the castleguard manifest only renames the levels (count is fixed),
     so starting by index immediately is exactly what tapping that level card does. */
  if (DEMO) { cgDemoStart(); }
  else if (CG_LVL != null) { cgHideStart(); startLevel(Math.max(0, Math.min(GAME_CONFIG.levels.length - 1, Math.floor(CG_LVL)))); }
  else { showMenu(); }
  requestAnimationFrame(frame);
}

/* ===================================================================== */
/*  Session 7I: attract mode (?screen=demo)                              */
/*  The game plays itself for the landing demo box: the shared hand      */
/*  GLIDES (capped step, never teleports — Breaker ea01edf) to the best  */
/*  open slot every few seconds, presses, and an archer appears. Never   */
/*  game-over: lost waves quietly retry, wins quietly restart level 1.   */
/* ===================================================================== */
function cgHideStart() { const host = document.getElementById("start"); if (host) host.style.display = "none"; }
function cgDemoStart() {
  cgHideStart();
  startLevel(0);
  cgHand.target = -1; cgHand.timer = 0.8; cgHand.press = 0;
}
function cgBestSlot() {
  let bi = -1, bd = 1e9;
  S.W.slots.forEach((sl, i) => { if (!sl.occupied) { const d = distToPath(S.W.segs, S.W.total, sl.x, sl.y); if (d < bd) { bd = d; bi = i; } } });
  return bi;
}

/* ===================================================================== */
/*  QA / HEADLESS HOOK (standardized name + alias)                       */
/* ===================================================================== */
function cgDemoTick(dt) {
  if (!S) return;
  if (state === "retry") {   // never-game-over: quietly replay the wave
    if (!cgDemoTick._r) cgDemoTick._r = setTimeout(() => { cgDemoTick._r = null; retryWave(); }, 1200);
    return;
  }
  if (state === "win") {     // quiet loop: back to level 1
    if (!cgDemoTick._w) cgDemoTick._w = setTimeout(() => { cgDemoTick._w = null; cgDemoStart(); }, 1200);
    return;
  }
  if (state !== "play" && state !== "wavebreak") return;
  if (cgHand.target < 0) {
    cgHand.timer -= dt;
    if (cgHand.timer <= 0) {
      const cost = (GAME_CONFIG.defenders.find(d => d.id === "archer") || GAME_CONFIG.defenders[0]).cost;
      if (S.coins >= cost) { const bi = cgBestSlot(); if (bi >= 0) cgHand.target = bi; else cgHand.timer = 2.5; }
      else cgHand.timer = 1.0;
    }
  } else {
    const slot = S.W.slots[cgHand.target];
    if (!slot || slot.occupied) { cgHand.target = -1; cgHand.timer = 2.5; return; }
    if (!cgHand.init) { cgHand.x = LW / 2; cgHand.y = LH + 40; cgHand.init = true; }
    const dx = slot.x - cgHand.x, dy = slot.y - cgHand.y, d = Math.hypot(dx, dy), cap = 260 * dt;
    if (d > cap) { cgHand.x += dx / d * cap; cgHand.y += dy / d * cap; }   // glide, capped step
    else {
      cgHand.x = slot.x; cgHand.y = slot.y;
      cgHand.press += dt;                       // small press dip, then place
      if (cgHand.press > 0.28) { placeDefender(cgHand.target, "archer"); cgHand.target = -1; cgHand.timer = 2.6; cgHand.press = 0; }
    }
  }
}
function cgDemoDrawHand() {
  if (!cgHand.init || !(BR && BR.hand)) return;
  const dip = (cgHand.target >= 0 && cgHand.press > 0) ? 7 : Math.max(0, Math.sin((S ? S.t : 0) * 3)) * 6;
  ctx.save(); ctx.globalAlpha = 0.95; BR.hand(ctx, cgHand.x + 20, cgHand.y + 12 + dip, 1.1); ctx.restore();
}
function _simBot(idx, maxFrames, defId) {
  defId = defId || "archer";
  // "sensible placement" bot: build the cheapest covering set, then top up as
  // coins allow, preferring slots that sit closest to the path.
  startLevel(idx);
  // rank slots by closeness to the path (best coverage first)
  const ranked = S.W.slots.map((s, i) => ({ i, d: distToPath(S.W.segs, S.W.total, s.x, s.y) }))
    .sort((a, b) => a.d - b.d);
  const dt = 1 / 60; const cap = maxFrames || 60000; let f = 0;
  let retries = 0;
  const buyNext = () => { for (const r of ranked) { if (!S.W.slots[r.i].occupied) { if (placeDefender(r.i, defId)) return true; return false; } } return false; };
  while (f < cap) {
    if (state === "play") {
      // greedily build whenever affordable
      const _cost = (GAME_CONFIG.defenders.find(d => d.id === defId) || GAME_CONFIG.defenders[0]).cost;
      let guard = 0; while (S.coins >= _cost && guard++ < 8) { if (!buyNext()) break; }
      step(dt);
    } else if (state === "wavebreak") { tickNonPlay(dt); }
    else if (state === "retry") { retries++; if (retries > 6) break; retryWave(); }
    else if (state === "win") break;
    f++;
  }
  return { level: idx, result: state, frames: f, hearts: S ? S.hearts : 0, stars: (S && S._stars) || PREFS.stars[idx] || 0, retries, defenders: S ? S.defenders.length : 0 };
}
const API = {
  _cfg: () => GAME_CONFIG,
  _S: () => S,
  _place: (slotIdx, defId) => placeDefender(slotIdx, defId),
  _rankSlots: () => S.W.slots.map((s, i) => ({ i, d: distToPath(S.W.segs, S.W.total, s.x, s.y) })).sort((a, b) => a.d - b.d).map(r => r.i),
  startLevel: (i) => startLevel(i),
  state: () => state,
  sim: (idx, maxFrames) => _simBot(idx, maxFrames),
  simWith: (idx, defId, maxFrames) => _simBot(idx, maxFrames, defId),
  campaign: (cap) => GAME_CONFIG.levels.map((_, i) => _simBot(i, cap || 60000)),
  _begin: (i) => startLevel(i || 0),
  _step: (frames) => { for (let k = 0; k < (frames || 1); k++) { if (state === "play") step(1 / 60); else tickNonPlay(1 / 60); } },
  _draw: () => { try { render(); return "ok"; } catch (e) { return "ERR:" + e.message; } },
};
if (typeof window !== "undefined") { window.BUILDABLE_GAME = API; window.CASTLEGUARD_GAME = API; }
</script>
