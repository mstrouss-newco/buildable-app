  // ======================================================================
  //  drawAnt(x, y, angle, scale, t, opts) — ONE ant, and the only place its
  //  LOOK is decided. Swap this function and the whole colony changes style
  //  without a single line of movement code moving.
  //    x, y    the middle of the body, in screen pixels
  //    angle   the direction it is travelling, in radians
  //    scale   its unit: the body runs about 2.7 units long and 0.95 tall,
  //            which is the three-times-longer-than-tall an ant has to be
  //            before it stops reading as a hermit crab
  //    t       the colony clock, for the small living wobbles
  //    opts    { body, mirror, soldier, queen, edge, hello, carry, job, dot }
  //  THE LOOK, locked Sep 8: the GLOSSY ant. Warm brown, a soft shine along the
  //  gaster, and NO hard comic outline once it is big. It keeps a thin dark edge
  //  only while it is small, and that edge fades out as it grows, which is what
  //  lets a ten-pixel ant stay readable without the crowd looking like scribble.
  // ======================================================================
  function drawAnt(x, y, angle, s, t, o){
    o = o || {};
    var col = o.body || "#c9853c", big = s > 4.6, edge = o.edge == null ? 0.6 : o.edge;
    X.save(); X.translate(x, y); X.rotate(angle);
    // NEVER PAST VERTICAL. Rotating by heading alone turns an ant walking left
    // upside down, eye underneath and its berry hanging below its head.
    if(o.mirror) X.scale(1, -1);
    if(o.queen) s *= 1.55;
    // the shadow it casts on the dirt
    X.fillStyle = "rgba(0,0,0,.16)";
    X.beginPath(); X.ellipse(-s*0.2, s*1.02, s*1.35, s*0.28, 0, 0, 7); X.fill();
    // an ant drawn on its own — the queen in her chamber — has no world-planted
    // feet to stand on, so it gets a still set of six here instead of no legs
    if(o.still){
      X.strokeStyle = "rgba(46,28,10,.72)"; X.lineWidth = Math.max(1, s*0.115); X.lineCap = "round";
      for(var li=0;li<6;li++){
        var hp = HIPX[li]*s, fr2 = (li > 2) ? 0.60 : 1, wob = Math.sin(t*1.6 + li)*s*0.04;
        X.beginPath(); X.moveTo(hp, s*0.20*fr2);
        X.lineTo(hp + (HIPX[li]*1.9 - HIPX[li])*s*0.5*fr2 + wob, s*0.60*fr2);
        X.lineTo(hp + (HIPX[li]*1.9 - HIPX[li])*s*fr2 + wob, s*0.94*fr2); X.stroke();
      }
    }
    if(edge > 0.02){
      X.strokeStyle = "rgba(26,15,5," + (0.85*edge).toFixed(3) + ")";
      X.lineWidth = Math.max(0.8, s*0.15);
    }
    var grad = null;
    if(big){                                      // the shine, only where it can be seen
      grad = X.createLinearGradient(0, -s*0.7, 0, s*0.6);
      grad.addColorStop(0, "#f0c58a"); grad.addColorStop(0.45, col); grad.addColorStop(1, "#7d4d1c");
    }
    // gaster (the fat rear), waist, thorax, head — four pieces, nose to tail
    X.fillStyle = grad || col;
    X.beginPath(); X.ellipse(-s*1.02, -s*0.03, s*0.64, s*0.47, 0.10, 0, 7); X.fill(); if(edge > 0.02) X.stroke();
    X.fillStyle = col;
    X.beginPath(); X.ellipse(-s*0.45, s*0.02, s*0.16, s*0.14, 0, 0, 7); X.fill();
    X.fillStyle = grad || col;
    X.beginPath(); X.ellipse(-s*0.06, -s*0.01, s*0.44, s*0.33, 0, 0, 7); X.fill(); if(edge > 0.02) X.stroke();
    X.beginPath(); X.ellipse(s*0.63, -s*0.06, s*0.42, s*0.37, 0, 0, 7); X.fill(); if(edge > 0.02) X.stroke();
    if(big){                                      // the soft shine on the gaster
      X.globalAlpha = 0.35; X.fillStyle = "#fff1d2";
      X.beginPath(); X.ellipse(-s*1.14, -s*0.20, s*0.26, s*0.13, 0.2, 0, 7); X.fill(); X.globalAlpha = 1;
    }
    // a soldier's helmet and the bigger jaws real soldier ants carry
    if(o.soldier){
      X.strokeStyle = "rgba(30,18,7,.9)"; X.lineWidth = Math.max(1, s*0.17);
      X.beginPath(); X.moveTo(s*0.98, -s*0.02); X.quadraticCurveTo(s*1.50, -s*0.16, s*1.30, -s*0.44); X.stroke();
      X.beginPath(); X.moveTo(s*0.98, s*0.16); X.quadraticCurveTo(s*1.46, s*0.20, s*1.24, s*0.46); X.stroke();
      X.fillStyle = "#e2685f";
      X.beginPath(); X.arc(s*0.63, -s*0.16, s*0.44, Math.PI, 0); X.closePath(); X.fill();
    }
    // ANTENNAE. They never thin below one screen pixel, because they are the
    // strongest sign that this is an ant and not a beetle.
    var cast = Math.sin(t*3.4 + x*0.05) * s*0.08, up = o.hello ? s*0.42 : 0;
    X.strokeStyle = "rgba(48,29,11,.80)"; X.lineWidth = Math.max(1, s*0.085); X.lineCap = "round";
    X.beginPath(); X.moveTo(s*0.84, -s*0.28); X.quadraticCurveTo(s*1.02, -s*0.60 - up, s*1.14 + cast, -s*0.82 - up); X.stroke();
    X.beginPath(); X.moveTo(s*0.92, -s*0.12); X.quadraticCurveTo(s*1.14, -s*0.32 - up*0.7, s*1.28 + cast, -s*0.48 - up*0.8); X.stroke();
    // the eye, and the jaws. Only drawn when there is room for them: at swarm
    // size a white eye is a smudge, so it becomes one plain dark dot.
    if(big){
      X.fillStyle = "#fff8ec"; X.beginPath(); X.arc(s*0.78, -s*0.12, s*0.15, 0, 7); X.fill();
      X.fillStyle = "#241505"; X.beginPath(); X.arc(s*0.83, -s*0.12, s*0.08, 0, 7); X.fill();
      if(!o.soldier){
        X.strokeStyle = "rgba(38,22,8,.9)"; X.lineWidth = Math.max(1, s*0.10);
        X.beginPath(); X.moveTo(s*0.98, s*0.02); X.quadraticCurveTo(s*1.22, s*0.06, s*1.16, s*0.24); X.stroke();
      }
    } else {
      X.fillStyle = "#241505"; X.beginPath(); X.arc(s*0.80, -s*0.10, Math.max(0.7, s*0.13), 0, 7); X.fill();
    }
    X.restore();
    // what it is hauling, held ABOVE THE HEAD at the front, and the job dot.
    // Both live outside the turned frame so a berry never hangs upside down.
    var fx = Math.cos(angle), fy = Math.sin(angle);
    var dxn = o.mirror ? Math.sin(angle) : -Math.sin(angle);
    var dyn = o.mirror ? -Math.cos(angle) : Math.cos(angle);
    if(o.carry) drawItem(o.carry, x + fx*s*0.95 - dxn*s*0.95, y + fy*s*0.95 - dyn*s*0.95, s*1.7);
    if(o.dot){
      var jy = y - s*1.35;                       // always straight up the SCREEN, so a
      X.fillStyle = "rgba(28,17,7,.40)";         // dot never floats off sideways from an
      X.beginPath(); X.arc(x, jy, Math.max(1.3, s*0.30), 0, 7); X.fill();   // ant in a shaft
      X.fillStyle = o.dot; X.beginPath(); X.arc(x, jy, Math.max(0.9, s*0.20), 0, 7); X.fill();
    }
  }
  // the queen, and anything else that wants one ant at a fixed size
  function drawAntShape(x, y, r, col, flip, idle, soldier){
    drawAnt(x, y, flip ? Math.PI : 0, r*0.62, C.t, { body:col, mirror:!!flip, soldier:!!soldier, edge:0.35, queen:true, still:true });
  }
  // ======================================================================
  //  AC9: the visitor. Drawn art first, and a hand-drawn fallback behind every
  //  one of them, so a missing file can never leave a bug invisible while the
  //  colony is telling the kid to go and deal with it. Silly, never scary: round
  //  bodies, big white eyes and a small smile, and it only ever ambles.
  // ======================================================================
  function drawBugShape(kind, x, y, r){
    var line = "rgba(28,40,10,.85)", i;
    X.save(); X.translate(x, y);
    X.lineCap = "round"; X.lineJoin = "round";
    X.fillStyle = "rgba(0,0,0,.18)"; X.beginPath(); X.ellipse(0, r*0.92, r*1.05, r*0.26, 0, 0, 7); X.fill();
    X.strokeStyle = line;
    if(kind === "caterpillar"){
      X.lineWidth = Math.max(1, r*0.13);
      for(i=0;i<3;i++){ X.beginPath(); X.moveTo(-r*0.55 + i*r*0.5, r*0.35); X.lineTo(-r*0.62 + i*r*0.5, r*0.80); X.stroke(); }
      X.lineWidth = Math.max(1, r*0.15);
      for(i=0;i<3;i++){
        X.fillStyle = i%2 ? "#9fce5c" : "#8fc44f";
        X.beginPath(); X.arc(-r*0.75 + i*r*0.5, r*0.05, r*0.34, 0, 7); X.fill(); X.stroke();
      }
      X.fillStyle = "#a8d768"; X.beginPath(); X.arc(r*0.60, -r*0.06, r*0.42, 0, 7); X.fill(); X.stroke();
      X.lineWidth = Math.max(1, r*0.12);
      X.beginPath(); X.moveTo(r*0.45, -r*0.42); X.lineTo(r*0.30, -r*0.86); X.stroke();
      X.beginPath(); X.moveTo(r*0.78, -r*0.40); X.lineTo(r*0.96, -r*0.84); X.stroke();
      bugFace(r*0.60, -r*0.06, r*0.42, line);
      X.restore(); return;
    }
    if(kind === "grasshopper"){
      X.lineWidth = Math.max(1, r*0.16);
      X.beginPath(); X.moveTo(-r*0.10, r*0.10); X.quadraticCurveTo(r*0.55, -r*0.55, r*0.30, r*0.20);
      X.quadraticCurveTo(r*0.20, r*0.70, -r*0.20, r*0.86); X.stroke();
      X.lineWidth = Math.max(1, r*0.12);
      X.beginPath(); X.moveTo(-r*0.20, r*0.20); X.lineTo(-r*0.34, r*0.82); X.stroke();
      X.fillStyle = "#8ed05a";
      X.beginPath(); X.ellipse(-r*0.10, 0, r*0.86, r*0.36, -0.12, 0, 7); X.fill();
      X.lineWidth = Math.max(1, r*0.15); X.stroke();
      X.fillStyle = "#9fdc68"; X.beginPath(); X.arc(-r*0.86, -r*0.14, r*0.40, 0, 7); X.fill(); X.stroke();
      X.lineWidth = Math.max(1, r*0.12);
      X.beginPath(); X.moveTo(-r*1.02, -r*0.46); X.lineTo(-r*1.36, -r*0.96); X.stroke();
      X.beginPath(); X.moveTo(-r*0.72, -r*0.48); X.lineTo(-r*0.60, -r*1.00); X.stroke();

    }

    X.lineWidth = Math.max(1, r*0.13);
    for(i=-1;i<=1;i++){
      X.beginPath(); X.moveTo(i*r*0.34, r*0.20); X.lineTo(i*r*0.42 - r*0.16, r*0.86); X.stroke();
      X.beginPath(); X.moveTo(i*r*0.34, -r*0.10); X.lineTo(i*r*0.50 + r*0.10, -r*0.62); X.stroke();
    }
    X.fillStyle = "#7d8f45"; X.lineWidth = Math.max(1, r*0.16);
    X.beginPath(); X.ellipse(0, r*0.10, r*0.86, r*0.62, 0, 0, 7); X.fill(); X.stroke();
    X.lineWidth = Math.max(1, r*0.12);
    X.beginPath(); X.moveTo(0, -r*0.50); X.lineTo(0, r*0.70); X.stroke();
    X.fillStyle = "#6a7a3a"; X.lineWidth = Math.max(1, r*0.15);
    X.beginPath(); X.arc(0, -r*0.70, r*0.38, 0, 7); X.fill(); X.stroke();
    X.lineWidth = Math.max(1, r*0.12);
    X.beginPath(); X.moveTo(-r*0.22, -r*1.00); X.lineTo(-r*0.50, -r*1.42); X.stroke();
    X.beginPath(); X.moveTo(r*0.22, -r*1.00); X.lineTo(r*0.50, -r*1.42); X.stroke();

  }
  // two big friendly eyes and a small smile: the whole reason it reads as silly
  function bugFace(cx, cy, r, line){
    X.fillStyle = "#fff8ec";
    X.beginPath(); X.arc(cx - r*0.38, cy - r*0.08, r*0.34, 0, 7); X.fill();
    X.beginPath(); X.arc(cx + r*0.38, cy - r*0.08, r*0.34, 0, 7); X.fill();
    X.fillStyle = "#241505";
    X.beginPath(); X.arc(cx - r*0.30, cy, r*0.17, 0, 7); X.fill();
    X.beginPath(); X.arc(cx + r*0.46, cy, r*0.17, 0, 7); X.fill();
    X.strokeStyle = line; X.lineWidth = Math.max(1, r*0.16);
    X.beginPath(); X.arc(cx, cy + r*0.34, r*0.34, 0.35, Math.PI - 0.35); X.stroke();
  }
  function drawBug(){
    var b = C && C.bug; if(!b) return;
    var x = fcToX(b.fc), y = frToY(b.fr);
    if(!isFinite(x) || !isFinite(y)) return;
    var amble = Math.sin(C.t*4 + b.hop) * CS*0.05;
    if(b.state === "flee"){
      var f = Math.max(0, Math.min(1, b.t / Math.max(0.01, GAME_CONFIG.bug.fleeSecs)));
      X.globalAlpha = 1 - f;
      y -= Math.sin(f * Math.PI) * CS*1.1;                 // the comic hop away
      amble = 0;
    }
    // the red ring: the same "this needs you" language the low meters speak
    if(b.state !== "flee"){
      X.globalAlpha = 0.35 + 0.25*Math.sin(C.t*4);
      X.strokeStyle = "#e24b4b"; X.lineWidth = 3;
      X.beginPath(); X.arc(x, y + amble, CS*0.62, 0, 7); X.stroke();
      X.globalAlpha = 1;
    }
    var img = IMG["bug_" + b.kind];
    X.save(); X.translate(x, y + amble); if(b.flip) X.scale(-1, 1);
    var size = (b.r == null) ? CS*1.3 : CS*1.05;      // a bug up on the grass has room to be seen
    if(img) drawImg(img, 0, 0, size);
    else drawBugShape(b.kind, 0, 0, size*0.38);
    X.restore();
    // napping: it is not gone, it is just having a lie down on the spot it is blocking
    if(b.state === "nap"){
      X.strokeStyle = "#fff8ec"; X.lineWidth = 2.4; X.lineCap = "round";
      for(var z=0; z<2; z++){
        var zs = CS*(0.16 + z*0.10), zx = x + CS*0.48 + z*CS*0.26;
        var zy = y - CS*0.55 - z*CS*0.30 - Math.sin(C.t*1.6 + z)*CS*0.06;
        X.globalAlpha = 0.85 - z*0.25;
        X.beginPath(); X.moveTo(zx, zy); X.lineTo(zx + zs, zy);
        X.lineTo(zx, zy + zs); X.lineTo(zx + zs, zy + zs); X.stroke();
      }
      X.globalAlpha = 1;
    }
  }
  // the attention marker: a bouncing red badge at the edge of the screen that says
  // WHERE, without a word, and takes the kid there when it is tapped.
  var bugMark = null;
  function drawBugMark(){
    bugMark = null;
    var b = C && C.bug; if(!b || b.state === "flee") return;
    var bx = fcToX(b.fc), by = frToY(b.fr);
    if(!isFinite(bx) || !isFinite(by)) return;
    var bottom = H - PANEL - 22, top = 30;
    var x = Math.max(28, Math.min(W - 28, bx));
    var y = by < top ? top : (by > bottom ? bottom : by - CS*1.1);
    y = Math.max(top, Math.min(bottom, y));
    var r = 17, bounce = Math.sin(C.t*5) * 4;
    y += bounce;
    X.fillStyle = "rgba(0,0,0,.28)"; X.beginPath(); X.arc(x, y + 3, r, 0, 7); X.fill();
    X.fillStyle = "#e24b4b"; X.beginPath(); X.arc(x, y, r, 0, 7); X.fill();
    X.strokeStyle = "#fff8ec"; X.lineWidth = 2.4; X.beginPath(); X.arc(x, y, r, 0, 7); X.stroke();

    if(BR) BR.rrect(X, x - 2.4, y - 8.5, 4.8, 10, 2.4); else X.fillRect(x - 2.4, y - 8.5, 4.8, 10);

  // AC6 pillar 2: the readouts have to trend HONESTLY, or the job slider is just
  // a slider. Food says which way it is going; the line over the bar says what the
  // mix the kid chose is actually doing to the colony, in kid words.
  var _foodWas = -1, _foodTrend = "", _trendT = 0;
  function foodTrend(dt){
    _trendT += dt || 0;
    if(_trendT < 0.8) return _foodTrend;
    _trendT = 0;
    if(_foodWas >= 0){
      var d = C.food - _foodWas;
      _foodTrend = d > 0.4 ? " up" : (d < -0.4 ? " down" : "");
    }
    _foodWas = C.food;

  function mixLine(){
    if(bugHere() && !jobCount("soldier")) return "A bug is visiting and nobody is shooing it";
    var t = Math.max(1, C.ants), dig = (C.jobs.digger|0)/t, fo = (C.jobs.forager|0)/t,
        nu = (C.jobs.nursery|0)/t, bu = (C.jobs.builder|0)/t;
    var falling = _foodTrend === " down";
    if(floodCount() && bu < 0.15) return "Nobody is clearing the water";
    if(dig >= 0.5)  return falling ? "Tunnels are flying, food is dropping" : "Tunnels are flying";
    if(fo  >= 0.5)  return "Food is piling up, little else is moving";
    if(nu  >= 0.5)  return gardenShare() ? "Eggs and mushrooms are being tended" : "The nursery is busy";

  // ======================================================================

  function coachText(){

  // ======================================================================
  //  The jobs strip (AC7). It used to be a permanent slab over the bottom half of

  var jobsOpen = false;
  function setJobsOpen(on){

  var jobBtns = {};
  function buildJobsUI(){
    var host = $("jobs"); if(!host || host.childElementCount) return;
    for(var i=0;i<JOBS.length;i++){
      (function(j){
        // built as real elements, not an innerHTML blob, so every button is a thing
        // the game (and the QA robot) can reach and press
        var card = document.createElement("div");
        card.className = "job" + (j.locked ? " locked" : "");
        card.id = "jobcard_" + j.id;
        var nm = document.createElement("div"); nm.className = "nm";
        nm.textContent = j.name; if(nm.style) nm.style.color = j.color;
        var ct = document.createElement("div"); ct.className = "ct"; ct.id = "ct_"+j.id; ct.textContent = "0";
        var btns = document.createElement("div"); btns.className = "btns";
        [["-1","−"],["1","+"]].forEach(function(pair){

          b.type = "button"; b.id = "job_"+j.id+"_"+(pair[0] === "1" ? "up" : "down");
          b.textContent = pair[1];

  // move one ant into (+1) or out of (-1) a job; the foragers are the pool it comes from
  function moveAnt(job, d){
    if(DEMO) return;
    if(job === "soldier" && !soldiersUnlocked()) return;    // not met yet: the card is not even there
    if(d > 0){
      var from = null, i;
      for(i=JOBS.length-1;i>=0;i--){ var o=JOBS[i].id; if(o!==job && (C.jobs[o]|0) > 0){ if(o==="forager"){ from=o; break; } if(!from) from=o; } }
      if(!from){ hint("Grow the colony first"); return; }

    } else {

      var to = (job === "forager") ? "digger" : "forager";

    }

    if(k === _jobsKey) return;                 // called every frame: only redraw on a real change
    _jobsKey = k;
    for(var i=0;i<JOBS.length;i++){ var el = $("ct_"+JOBS[i].id); if(el) el.textContent = C.jobs[JOBS[i].id]|0; }
    // AC9: the fifth card appears the moment soldiers unlock, and the row tightens
    // up to hold five without any of them getting too small to tap.

    var jh = $("jobs"); if(jh && jh.classList) jh.classList[on ? "add" : "remove"]("five");

  // the colour bar: it SHOWS the mix, and dragging it moves ants between two jobs
  function drawBar(){
    var bar = $("bar"); if(!bar) return;
    var AJ = activeJobs();
    var total = Math.max(1, C.ants), acc = 0, html = "", cum = [];
    for(var i=0;i<AJ.length;i++){
      var n = C.jobs[AJ[i].id]|0, w = (n/total)*100;
      html += '<div class="seg" style="left:'+acc+'%;width:'+w+'%;background:'+AJ[i].color+'"></div>';
      acc += w; if(i < AJ.length-1) cum.push(acc);
    }

  // AC7: dragging the bar used to need a press within a whisker of a divider, which
  // on a mouse felt like nothing happening at all. A press anywhere on the bar now
  // takes hold of the NEAREST divider, and both mouse and touch go through the same
  // path. The +/- buttons stay the taught way in, because a tap cannot miss.
  (function wireBar(){
    var bar = $("bar"); if(!bar) return;
    var dragging = -1;
    function pct(ev){
      var r = bar.getBoundingClientRect ? bar.getBoundingClientRect() : { left:0, width:1 };
      var cx = (ev.clientX != null) ? ev.clientX : ((ev.touches && ev.touches[0]) ? ev.touches[0].clientX : 0);
      return Math.max(0, Math.min(1, (cx - (r.left||0)) / Math.max(1, r.width||1)));
    }
    function cumFor(i){ var A = activeJobs(), t = Math.max(1, C.ants), s2 = 0; for(var j=0;j<=i && j<A.length;j++) s2 += C.jobs[A[j].id]|0; return s2/t; }
    function grab(ev){
      if(DEMO) return;
      BA.unlock(); bumpIdle();
      var p = pct(ev), best = 0, bd = 9, AJ = activeJobs();
      for(var i=0;i<AJ.length-1;i++){ var d = Math.abs(cumFor(i) - p); if(d < bd){ bd = d; best = i; } }

      if(want !== (C.jobs[a2]|0)){ C.jobs[a2] = want; C.jobs[b2] = pair - want; guide.moved = true; bumpIdle(); syncJobsUI(); saveSoon(); }
    }

    bar.addEventListener("pointermove", move);
    bar.addEventListener("pointerup", end);
    bar.addEventListener("pointercancel", end);

    bar.addEventListener("touchmove", move);

  // ======================================================================
  //  What is in your hand (AC8). AC7 had three word buttons and a fourth verb

  //  stated. There is one big button now and it IS the tool: its picture is the
  //  tool, its two words say what to do with it, and the round button beside it
  //  opens a sheet of picture cards to swap. Nothing is a hidden mode any more.
  // ======================================================================
  var TOOLS = {
    dig:   { name:"Dig",   hint:"drag in the dirt" },
    food:  { name:"Food",  hint:"tap the grass" },
    water: { name:"Water", hint:"tap the grass" },
    build: { name:"Build", hint:"tap to choose" }
  };
  var TOOL_ORDER = ["dig","food","water","build"];
  var TOOL = "dig";                       // a new colony starts with the shovel out
  function setTool(t, quiet){
    if(!TOOLS[t]) t = "dig";

    var main = $("actMain");
    if(main){
      if(main.classList){ TOOL_ORDER.forEach(function(k){ main.classList.remove("t-"+k); }); main.classList.add("t-"+t); }
      var nm = $("actName"), hn = $("actHint");
      if(nm) nm.textContent = TOOLS[t].name;
      if(hn) hn.textContent = TOOLS[t].hint;
    }
    TOOL_ORDER.forEach(function(k){
      var c = $("tool_"+k); if(c && c.classList) c.classList[k === t ? "add" : "remove"]("on");

  $("actMain").addEventListener("click", function(){

  // ======================================================================

  // ======================================================================
  var drag = null;

  function evY(ev){ return ev.clientY != null ? ev.clientY : ((ev.touches && ev.touches[0]) ? ev.touches[0].clientY : 0); }
  function cellFromEvent(ev){
    var r = CV.getBoundingClientRect ? CV.getBoundingClientRect() : { left:0, top:0 };
    var x = evX(ev) - (r.left||0), y = evY(ev) - (r.top||0);
    if(y < SKY - 20) return { surface:true, x:x, y:y };
    var c = Math.floor((x - OX)/CS), rr = Math.floor((y - SKY + camY)/CS);

    return { surface:false, c:c, r:rr, x:x, y:y };

  function planCell(c, r){
    if(cellAt(c,r)) return false;
    var last = C.plan.length ? C.cells[C.plan[C.plan.length-1]] : null;
    var okFromLast = last && Math.abs(last.c-c) + Math.abs(last.r-r) === 1;
    if(!hasOpenNeighbour(c,r) && !okFromLast) return false;
    C.cells[key(c,r)] = { c:c, r:r, kind:"plan", dig:0 };

  }
  // AC8: the tool in your hand decides what a tap means, and the big button has been
  // saying which tool that is the whole time. A tap in the wrong place is never

  function eventPoint(ev){
    var r = CV.getBoundingClientRect ? CV.getBoundingClientRect() : { left:0, top:0 };

    if(!m || typeof m !== "object") return;
    try{
      if(m.color) ACCENT = m.color;
      var lv = (m.levels && m.levels[0]) || null, parts = (lv && lv.parts) || {};
      if(parts.ant)  ART_IDS.ant  = parts.ant;
      if(parts.soil) ART_IDS.soil = parts.soil;
      if(parts.surface) ART_IDS.surface = parts.surface;
      if(m.art && m.art.loadingScreen) ART_IDS.loading = m.art.loadingScreen;
      if(m.art && m.art.hero) ART_IDS.queen = m.art.hero;
      // AC6: rooms and the chain milestones are recipe, not engine. The manifest may
      // add or retune either; anything it does not mention keeps the built-in value.
      if(m.rooms && typeof m.rooms === "object"){
        for(var rk in m.rooms){
          var rd = m.rooms[rk] || {};
          GAME_CONFIG.rooms[rk] = GAME_CONFIG.rooms[rk] || { name:rk, desc:"", food:8, color:"#e9c46a" };
          if(rd.name) GAME_CONFIG.rooms[rk].name = rd.name;
          if(rd.desc) GAME_CONFIG.rooms[rk].desc = rd.desc;
          if(typeof rd.food === "number") GAME_CONFIG.rooms[rk].food = rd.food;
          if(rd.color) GAME_CONFIG.rooms[rk].color = rd.color;
          if(rd.asset) ART_IDS["room_"+rk] = rd.asset;
        }
      }
      if(m.milestones && m.milestones.length){
        var have = {}, mi;
        for(mi=0;mi<GAME_CONFIG.milestones.length;mi++) have[GAME_CONFIG.milestones[mi].id] = mi;
        m.milestones.forEach(function(ml){
          if(!ml || !ml.id) return;
          if(have[ml.id] != null){                       // the manifest wins on the numbers
            var cur = GAME_CONFIG.milestones[have[ml.id]];
            for(var f in ml) cur[f] = ml[f];
          } else GAME_CONFIG.milestones.push(ml);
        });
      }
      // AC9: the bad bugs are recipe too. The manifest may retune how often one calls,
      // what it pays and every word it says; anything it leaves out keeps the engine's.
      if(m.bugs && typeof m.bugs === "object"){
        var bg = GAME_CONFIG.bug;
        if(typeof m.bugs.everySec === "number") bg.everySec = m.bugs.everySec;
        if(typeof m.bugs.coins === "number") bg.coins = m.bugs.coins;
        if(m.bugs.kinds && typeof m.bugs.kinds === "object"){
          for(var bk in m.bugs.kinds){
            var bd0 = m.bugs.kinds[bk] || {};
            bg.kinds[bk] = bg.kinds[bk] || { name:bk, color:"#7d8f45", where:"door" };
            for(var bf in bd0) bg.kinds[bk][bf] = bd0[bf];
            if(bd0.art) ART_IDS["bug_"+bk] = bd0.art;
          }
        }
      }
      if(m.levels && m.levels.length){
        MISSIONS = m.levels.map(function(l){ return { id:l.id, name:l.name, layout:l.layout, coins:l.coins || 10, difficulty:l.difficulty }; });
      }
      // the kid's equipped look wins over the level default
      var looks = equippedLooks();
      (m.customization||[]).forEach(function(slot){
        var nm = String(slot.slot||"").toLowerCase();
        var want = looks[nm]; if(want == null) return;
        var o = (slot.options||[])[want]; if(!o || !o.asset) return;
        if(nm === "ant")    ART_IDS.ant     = o.asset;
        if(nm === "dirt")   ART_IDS.soil    = o.asset;
        if(nm === "meadow") ART_IDS.surface = o.asset;
      });
      if(Feel) Feel.configure({ accent:ACCENT, feel:m.feel || { pace:"chill", celebration:"calm", haptics:"on" }, sfxBase:SFX_BASE, sfxMap:SFX_MAP });
      if(window.BuildableHUD && window.BuildableHUD.setAccent) window.BuildableHUD.setAccent(ACCENT);
    }catch(e){}
  }
  function loadAllArt(){ for(var slot in ART_IDS) loadArt(slot, ART_IDS[slot]); }

  var booted = false;
  function bootScreen(){
    if(booted) return; booted = true;
    loadAllArt();
    if(DEMO) newColony(3);
    startPlay();                       // AC7: straight into the colony, no picker
  }
  function boot(){
    resize();
    if(Feel){ try{ Feel.configure({ accent:ACCENT, feel:{ pace:"chill", celebration:"calm", haptics:"on" }, sfxBase:SFX_BASE, sfxMap:SFX_MAP }); }catch(e){} }
    if(!C) C = (DEMO ? null : loadSaved()) || freshColony(3);
    if(!C.surface) C.surface = []; if(!C.sample){ C.sample = []; walkSample(0); }
    try{
      if(window.BuildableManifest && window.BuildableManifest.rawManifest){
        window.BuildableManifest.rawManifest("antcity", function(m){ applyManifest(m); bootScreen(); });
        setTimeout(bootScreen, 1800);          // safety net if the manifest never answers
      } else bootScreen();
    }catch(e){ bootScreen(); }
  }
  boot();
  requestAnimationFrame(frame);

  // ======================================================================
  //  The platform game handle. The QA robot (qa-antcity.mjs, card AC2) and
  //  the shell drive the colony only through this.
  // ======================================================================
  window.ANTCITY_GAME = {
    state: function(){ return state; },
    play: function(diff){ if(diff) { newColony(diff); } startPlay(); },
    newColony: function(diff){ newColony(diff||3); },
    setDifficulty: function(d){ C.difficulty = Math.max(1, Math.min(5, d|0)); },
    step: function(n){ n = n||1; for(var i=0;i<n;i++) step(); return this.dbg(); },
    seconds: function(s){ var n = Math.round((s||1)/STEP); for(var i=0;i<n;i++) step(); return this.dbg(); },
    dig: function(c, r){ return planCell(c, r); },
    digDown: function(n){ var made = 0; for(var i=0;i<(n||1);i++){ if(planCell(C.queen.c, C.deepest + 1 + i)) made++; } return made; },
    drop: function(kind, x){ dropSurface(kind === "water" ? "water" : "food", x != null ? x : W/2, true); return C.surface.length; },
    assign: function(job, n){ if(!(job in C.jobs)) return null; var d = (n|0) - (C.jobs[job]|0); for(var i=0;i<Math.abs(d);i++) moveAnt(job, d > 0 ? 1 : -1); return C.jobs[job]; },
    build: function(c, r, room){ var cell = cellAt(c, r); if(!cell || cell.kind !== "tunnel") return false;
      var def = GAME_CONFIG.rooms[room]; if(!def || C.food < def.food) return false;
      C.food -= def.food; cell.kind = "room"; cell.room = room; cell.build = 0; cell.done = false;
      cell.good = goodSpot(room, c, r); return true; },
    rooms: function(){ var o = {}; for(var k in GAME_CONFIG.rooms) o[k] = roomCount(k); return o; },
    // --- missions (AC2), for the robot and the shell ---
    missions: function(){ return MISSIONS.map(function(m){ return { id:m.id, name:m.name, layout:m.layout, coins:m.coins, done:!!C.done[m.id] }; }); },
    mission: function(){ var m = currentMission(); if(!m) return { free:true, line:missionLine() };
      var g = goalFor(m); return { index:C.mission, id:m.id, name:m.name, layout:m.layout, coins:m.coins,
        goal:g, have:Math.max(0, haveFor(g)), line:missionLine(), free:false }; },
    freeBuild: function(){ return !!C.freeBuild; },
    unlocked: function(id){ return roomUnlocked(id); },
    rain: function(){ var c = rain(); return c ? { c:c.c, r:c.r } : null; },
    // the first plain tunnel a room could go in (the robot builds there)
    openTunnel: function(){ for(var k in C.cells){ var x = C.cells[k];
      if(x.kind === "tunnel" && !x.flooded && !(x.c === C.queen.c && x.r <= C.queen.r)) return { c:x.c, r:x.r }; } return null; },
    floods: function(){ return floodCount(); },
    setback: function(){ return setbackNow(); },
    find: function(){ return C.find ? { c:C.find.c, r:C.find.r, gone:!!C.find.gone } : null; },
    how: function(){ return how.on; },
    showHow: showHow,
    // --- AC5: the visible ants, the guide and the goal line ---
    crowd: function(){ return C.sample.map(function(a){
      return { fc:Math.round(a.fc*100)/100, fr:Math.round(a.fr*100)/100, job:a.job, state:a.state,
               task:a.task ? a.task.kind : null, phase:(a.task && a.task.phase) || null,
               carry:a.carry ? a.carry.kind : null, idle:(a.state === "idle"),
               post:a.post ? (a.post.c + "," + a.post.r) : null,
               at:Math.round(a.fc) + "," + Math.round(a.fr),
               // AC13: where it is really DRAWN, which way its head is pointing,
               // how fast it is going, and where its six feet are planted.
               dx:Math.round((a.dx == null ? a.fc : a.dx)*1000)/1000,
               dy:Math.round((a.dy == null ? a.fr : a.dy)*1000)/1000,
               head:Math.round((a.head||0)*1000)/1000, mir:!!a.mir,
               spd:Math.round((a.spd||0)*1000)/1000, gait:Math.round((a.gait||0)*1000)/1000,
               feet:(a.ft || []).map(function(v){ return Math.round(v*1000)/1000; }),
               inDirt:(a.fr > -0.2 && !isOpen(Math.round(a.fc), Math.round(a.fr))) }; }); },
    // AC13: the painting budget and the ant's size, so the robot can prove the
    // crowd tracks the colony and never goes over what the device can paint.
    motion: function(){ return { cap:drawCap(), drawn:C.sample.length, ants:C.ants,
                                 unit:antU(), scale:GAME_CONFIG.antScale, detail:antDetail(C.sample.length),
                                 stride:MOT.stride, reach:MOT.reach }; },
    // --- AC7: the one hint line, the needs meters, the meadow and the build flow ---
    // hints() is the whole point of the AC7 hint rework: there is ONE surface, so
    // this can never return two, and the QA robot asserts exactly that.
    hints: function(){
      var out = [], el = $("coachText"), host = $("coach");
      var hidden = !!(host && host.className && host.className.indexOf("gone") >= 0);
      var panel = $("panel"), off = !!(panel && panel.className === "hidden");
      if(el && el.textContent && !hidden && !off) out.push(el.textContent);
      return out;
    },
    coach: function(){ return syncCoach(); },
    needs: function(){
      var o = {};
      for(var i=0;i<NEEDS.length;i++){
        var n = NEEDS[i], v = Math.max(0, Math.min(1, n.val() || 0));
        o[n.id] = { v:Math.round(v*100)/100, low:(n.low >= 0 && v < n.low) };
      }
      return o;
    },
    items: function(){ return C.surface.map(function(it){
      return { kind:it.kind, x:Math.round(itemX(it)), n:it.n, give:it.give, held:!!it.held, claimed:!!it.claim }; }); },
    spots: function(){ return buildSpots(); },
    tool: function(){ return TOOL; },
    sheetOpen: function(){ return sheetOpen; },
    tools: function(){ return TOOL_ORDER.slice(); },
    setToolByName: function(t){ setTool(t, true); return TOOL; },
    queen: function(){ return { c:C.queen.c, r:C.queen.r }; },
    geom: function(){ layout(); return { cs:CS, ox:OX, sky:SKY, panel:PANEL, w:W, h:H, camY:Math.round(camY) }; },
    placing: function(){ return placing ? placing.room : null; },
    buildOpen: function(){ return buildOpen; },
    jobsOpen: function(){ return jobsOpen; },
    panelH: function(){ layout(); return PANEL; },
    lesson: function(){ return { on:guide.on, name:guide.lesson, step:guide.step, steps:lessonLen() }; },
    guide: function(){ return { on:guide.on, lesson:guide.lesson, step:guide.step, steps:lessonLen(),
                                text:(stepNow() || {}).text || "" }; },
    goal: function(){ return syncCoach(); },
    antScale: function(){ return GAME_CONFIG.antScale; },
    // --- AC6: layout bonuses, the felt job mix, and the production chains ---
    spot: function(id, c, r){ return { good:goodSpot(id, c, r), line:spotLine(id, c, r) }; },
    bonus: function(id){ return roomMul(id); },
    mix: function(){ return mixLine(); },
    trend: function(){ return (_foodTrend || "").replace(" ", "") || "steady"; },
    chain: function(){
      var r1 = function(n){ return Math.round(n*100)/100; };
      return { leaves:r1(C.leaves), ready:r1(C.leafReady), cut:r1(C.leavesCut), mush:r1(C.mush),
               aphids:!!C.aphids, dew:r1(C.dew), dewGot:r1(C.dewGot), gardens:roomCount("fungus"), nurseryOnMushrooms:gardenShare(),
               hauling:countTask(function(t){ return t && t.kind === "haul" && t.it && (t.it.kind === "leaf" || t.it.kind === "dew"); }) };
    },
    setAphids: function(on){ C.aphids = !!on; return C.aphids; },
    // --- AC9: soldiers and the bad bug visits ---
    soldiersOn: function(){ return soldiersUnlocked(); },
    jobsList: function(){ return activeJobs().map(function(j){ return j.id; }); },
    jobColor: function(id){ return jobColor(id); },
    bug: function(){
      var b = C.bug; if(!b) return null;
      var def = bugDef(b.kind);
      return { kind:b.kind, state:b.state, scare:Math.round(b.scare*100)/100,
               fc:Math.round(b.fc*100)/100, fr:Math.round(b.fr*100)/100,
               c:b.c, r:b.r, surface:(b.r == null), t:Math.round(b.t*10)/10,
               name:def.name, line:def.call };
    },
    sendBug: function(kind){ var b = sendBug(kind); return b ? this.bug() : null; },
    bugsSeen: function(){ return C.bugsSeen|0; },
    bugsScared: function(){ return C.bugsScared|0; },
    bugMark: function(){ return bugMark ? { x:Math.round(bugMark.x), y:Math.round(bugMark.y), r:Math.round(bugMark.r) } : null; },
    looking: function(){ return (camLook != null && C.t < camLookT) ? camLook : null; },
    guards: function(){ return countTask(function(t){ return t && t.kind === "scare"; }); },
    dbg: function(){ return { ants:C.ants, eggs:C.eggs, food:Math.round(C.food*10)/10, water:Math.round(C.water*10)/10,
                              jobs:JSON.parse(JSON.stringify(C.jobs)), deepest:C.deepest, planned:C.plan.length,
                              dug:C.dug, rooms:this.rooms(), born:C.born, state:state, paused:paused,
                              mission:C.mission, free:!!C.freeBuild, carried:Math.round(C.carried*10)/10,
                              floods:C.floods, flooded:floodCount(), found:C.found, rest:Math.round(C.rest*100)/100,
                              leaves:Math.round(C.leaves*10)/10, mush:Math.round(C.mush*10)/10, aphids:!!C.aphids,
                              surface:C.surface.length, tapped:C.tapped|0, guided:!!C.guided,
                              coins:coinsAwarded.slice() }; },
    _cfg: function(){ return GAME_CONFIG; },
    _applyManifest: function(m){ applyManifest(m); loadAllArt(); },
    _art: function(){ var o = {}; for(var s in ART_IDS) o[s] = artUrl(ART_IDS[s]); return o; },
    _draw: function(){ try{ draw(); return "ok"; }catch(e){ return "ERR: " + (e && e.message || e); } },
    _save: saveNow,
    // robot only: skip to free build. It also closes the lesson, because a colony in
    // free build is one that has been played, and a lesson running is one of the two
    // things that hold a bad bug back.
    _openAll: function(){ C.freeBuild = true; C.guided = true; if(how.on) endHow(); return true; },
    _reset: function(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} newColony(3); }
  };
  try{ window.BUILDABLE_GAME = window.ANTCITY_GAME; }catch(e){}
})();
</script>
