<!DOCTYPE html>
<html>
<head>
<link rel="icon" href="/favicon.ico?v=4" sizes="any" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=4" />
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=4" />
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=4" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=4" />
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ant City">
<meta name="application-name" content="Ant City">
<meta name="theme-color" content="#E9A23B">
<title>Ant City</title>
<style id="no-longpress">/* Buildable: disable iOS long-press magnifier + Look Up/Translate popup app-wide; keep inputs selectable */
*{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;}
input,textarea{-webkit-user-select:text;user-select:text;}
</style>
<style>
  html,body{margin:0;padding:0;height:100%;background:#2b1d10;overflow:hidden;font-family:'Baloo 2','Nunito',system-ui,sans-serif;}
  #wrap{position:fixed;inset:0;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;}
  #start{position:absolute;inset:0;display:none;z-index:20;overflow:auto;}

  /* ---- the bottom panel (AC7). It is SLIM: one coach line, the needs meters,
         the three actions, and a jobs strip that opens on a tap. Nothing here may
         cover the dirt the kid is drawing in, so the engine measures its real
         height every frame and keeps the camera and the guide clear of it. ---- */
  #panel{position:absolute;left:0;right:0;bottom:0;z-index:8;padding:6px 8px calc(6px + env(safe-area-inset-bottom));
         background:linear-gradient(180deg,rgba(43,29,16,0) 0%,rgba(43,29,16,.72) 22%,rgba(43,29,16,.94) 100%);}
  #panel.hidden{display:none;}

  /* ---- ONE hint surface (AC7). Every message the game has -- the lesson step, a
         nudge, a queen fact, the mission goal -- comes out here and nowhere else,
         so two of them can never contradict each other on screen. ---- */
  #coach{display:flex;align-items:center;gap:8px;margin:0 2px 5px;color:#ffe9c2;font-size:13px;font-weight:800;
         line-height:1.25;text-shadow:0 1px 3px rgba(0,0,0,.65);min-height:22px;}
  #coach .qd{flex:0 0 22px;width:22px;height:22px;border-radius:50%;background:#b0553f;position:relative;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18),0 1px 3px rgba(0,0,0,.45);}
  #coach .qd:after{content:"";position:absolute;left:5px;top:8px;width:4px;height:4px;border-radius:50%;background:#fff8ec;box-shadow:8px 0 0 #fff8ec;}
  #coach.teach{color:#fff6e0;}
  #coachText{flex:1 1 auto;}

  /* ---- AC8: ONE smart bar. Meters, what is in your hand, the toolbox. ----
         Every part of it is a picture: the meters are bars with icons, the middle
         button IS the tool you are holding, and the round button opens a sheet of
         picture cards. Words are tiny labels on top of pictures, never the message. */
  #smart{display:flex;align-items:stretch;gap:8px;margin:0 2px 6px;}

  /* the meter cluster: four little vertical bars. A low one wiggles and flags itself. */
  #meters{flex:0 0 auto;display:flex;gap:5px;align-items:flex-end;}
  .mt{position:relative;width:16px;display:flex;flex-direction:column;align-items:center;gap:2px;}
  .mt .bar{position:relative;display:block;width:11px;height:28px;border-radius:6px;background:rgba(0,0,0,.42);
           box-shadow:inset 0 1px 2px rgba(0,0,0,.5);overflow:hidden;}
  .mt .bar i{position:absolute;left:0;right:0;bottom:0;height:0%;border-radius:6px;transition:height .3s;}
  #mtr_food .bar i{background:#63b34a;}
  #mtr_water .bar i{background:#62b6f2;}
  #mtr_rest .bar i{background:#f2a2c0;}
  #mtr_eggs .bar i{background:#e9c46a;}
  .mt .mic{width:15px;height:15px;display:block;}
  .mt .tag{display:none;position:absolute;top:-6px;right:-4px;min-width:13px;height:13px;line-height:13px;
           border-radius:7px;background:#e24b4b;color:#fff;font-size:10px;font-weight:800;text-align:center;
           box-shadow:0 1px 3px rgba(0,0,0,.45);}
  .mt.low .tag{display:block;}
  .mt.low{animation:wig .9s ease-in-out infinite;}
  @keyframes wig{0%,100%{transform:translateX(0);}25%{transform:translateX(-2px);}75%{transform:translateX(2px);}}

  /* the middle: what is in your hand right now, and in two or three words what to do with it */
  #actMain{flex:1 1 auto;display:flex;align-items:center;gap:9px;border:none;border-radius:14px;
           padding:7px 10px;background:#ffd166;box-shadow:0 2px 0 rgba(0,0,0,.18);
           font-family:inherit;color:#4a2f10;cursor:pointer;text-align:left;min-width:0;}
  #actMain .ic{display:none;flex:0 0 30px;width:30px;height:30px;}
  #actMain.t-dig .ic-dig,#actMain.t-food .ic-food,#actMain.t-water .ic-water,#actMain.t-build .ic-build{display:block;}
  #actMain .at{min-width:0;display:flex;flex-direction:column;line-height:1.15;}
  #actName{font-size:15px;font-weight:800;}
  #actHint{font-size:11px;font-weight:700;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #actMain.pulse{animation:tpulse 1s ease-in-out infinite;}

  /* the toolbox button, and the sheet of picture cards it opens */
  #actSwap{flex:0 0 46px;width:46px;height:46px;align-self:center;border:none;border-radius:50%;
           background:#f3d9a8;box-shadow:0 2px 0 rgba(0,0,0,.18);cursor:pointer;padding:0;
           display:flex;align-items:center;justify-content:center;}
  #actSwap svg{width:26px;height:26px;display:block;}
  #actSwap.pulse{animation:tpulse 1s ease-in-out infinite;}
  /* the toolbox sits in the bottom stack, above the bar it changes, so the one hint
     line is never covered and the measured panel height still keeps the dirt clear */
  #sheet{display:none;margin:0 2px 6px;}
  #sheet.open{display:block;}
  #sheetCard{padding:8px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;
             background:#fff8ec;border-radius:18px;box-shadow:0 6px 20px rgba(0,0,0,.35);}
  .toolcard{border:none;border-radius:16px;background:#f0e0c6;padding:9px 4px 7px;cursor:pointer;font-family:inherit;
            display:flex;flex-direction:column;align-items:center;gap:4px;}
  .toolcard .tic{width:34px;height:34px;display:block;}
  .toolcard span{font-size:12px;font-weight:800;color:#4a2f10;}
  .toolcard.on{background:#ffd166;box-shadow:0 0 0 3px rgba(233,162,59,.5);}
  .toolcard.pulse{animation:tpulse 1s ease-in-out infinite;}

  @keyframes tpulse{0%,100%{box-shadow:0 0 0 0 rgba(255,209,102,0);}50%{box-shadow:0 0 0 4px rgba(255,209,102,.9);}}

  /* ---- the jobs strip: slim by default, opens on a tap ---- */
  #stripRow{display:flex;align-items:center;gap:8px;margin:0 2px;}
  #jobsToggle{flex:0 0 auto;border:none;border-radius:11px;background:rgba(255,255,255,.14);color:#ffe9c2;
              font-family:inherit;font-size:11px;font-weight:800;padding:5px 9px;cursor:pointer;display:flex;align-items:center;gap:6px;}
  #jobsToggle .chev{display:inline-block;width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-bottom:5px solid #ffe9c2;}
  #jobsToggle.open .chev{border-bottom:none;border-top:5px solid #ffe9c2;}
  #bar{position:relative;flex:1 1 auto;height:22px;border-radius:11px;overflow:hidden;background:#3a2716;box-shadow:inset 0 2px 6px rgba(0,0,0,.35);touch-action:none;cursor:ew-resize;}
  #bar .seg{position:absolute;top:0;bottom:0;}
  #bar .gr{position:absolute;top:0;bottom:0;width:12px;margin-left:-6px;background:rgba(255,255,255,.9);border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,.4);}
  #bar.pulse{box-shadow:0 0 0 3px rgba(255,209,102,.9),inset 0 2px 6px rgba(0,0,0,.35);}
  #jobsBody{overflow:hidden;}
  #jobsBody.closed{display:none;}
  #barMix{margin:5px 4px 0;color:#ffe9c2;font-size:11px;font-weight:700;opacity:.9;text-align:center;
          overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  #jobs{display:flex;gap:6px;margin-top:5px;}
  .job{flex:1 1 0;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.14);border-radius:13px;padding:4px 4px 5px;text-align:center;color:#fff;}
  .job .nm{font-size:11px;font-weight:800;letter-spacing:.2px;opacity:.92;white-space:nowrap;}
  .job .ct{font-size:18px;font-weight:800;line-height:1.1;}
  .job .btns{display:flex;gap:4px;justify-content:center;margin-top:2px;}
  .job button{width:28px;height:26px;border:none;border-radius:8px;background:rgba(255,255,255,.20);color:#fff;font-size:15px;font-weight:800;line-height:1;cursor:pointer;}
  .job button:active{background:rgba(255,255,255,.34);}
  .job button.pulse{animation:tpulse 1s ease-in-out infinite;}
  /* AC9: the fifth job. Until the colony has met soldiers the card is simply not
     there, and when it arrives the row tightens so five still fit a phone. */
  .job.locked{display:none;}
  #jobs.five{gap:4px;}
  #jobs.five .job{padding:4px 2px 5px;}
  #jobs.five .nm{font-size:10px;letter-spacing:0;}
  #jobs.five .ct{font-size:16px;}
  #jobs.five .job button{width:25px;height:25px;font-size:14px;}


  /* ---- build a room popup ---- */
  /* ---- AC8: the build menu is PICTURES. Each card shows what the room does, and
         what it costs is a row of apples you can count, not a number to read. ---- */
  #build{position:absolute;inset:0;z-index:12;display:none;align-items:center;justify-content:center;background:rgba(20,12,4,.5);}
  #buildCard{background:#fff8ec;border-radius:22px;padding:12px;width:min(360px,92vw);box-shadow:0 14px 40px rgba(0,0,0,.4);}
  #buildTop{display:flex;align-items:center;gap:10px;margin:0 2px 10px;}
  #buildCard h2{margin:0;flex:1 1 auto;font-size:19px;color:#4a2f10;}
  #buildCancel{flex:0 0 44px;width:44px;height:44px;border:none;border-radius:50%;background:#e9a23b;cursor:pointer;
               padding:0;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 0 rgba(0,0,0,.18);}
  #buildCancel svg{width:26px;height:26px;display:block;}
  #roomList{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
  .room{display:flex;flex-direction:column;align-items:center;gap:5px;border:none;background:#f0e0c6;border-radius:16px;
        padding:9px 6px 8px;cursor:pointer;font-family:inherit;text-align:center;}
  .room .pic{display:block;width:100%;}
  .room .pic svg{width:76px;height:60px;display:block;margin:0 auto;}
  .room .rn{display:block;font-size:13px;font-weight:800;color:#4a2f10;line-height:1.1;}
  .room .cost{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;max-width:104px;}
  .room .cost svg{width:11px;height:11px;display:block;}
  .room .sp{display:block;font-size:10px;font-weight:800;line-height:1.15;color:#3f7a3a;}
  .room .sp.meh{color:#8a7350;font-weight:700;}
  .room.cant{opacity:.55;}
  .room.cant .cost{animation:apflash 1s ease-in-out infinite;}
  @keyframes apflash{0%,100%{opacity:1;}50%{opacity:.25;}}

  /* the engine's own standalone buttons — the shared nav bridge hides these in-app */
  .selfbtn{position:absolute;z-index:9;border:none;border-radius:999px;background:rgba(20,12,4,.55);color:#fff;font-family:inherit;font-weight:800;font-size:13px;padding:8px 14px;cursor:pointer;}
  #backBtn{top:58px;left:14px;}
  #muteBtn{top:58px;right:14px;}
  #helpBtn{top:100px;right:14px;}
  .bk-inshell .selfbtn{display:none;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>
  <button id="backBtn" class="selfbtn">Home</button>
  <button id="muteBtn" class="selfbtn">Sound</button>
  <button id="helpBtn" class="selfbtn">?</button>
  <div id="panel" class="hidden">
    <div id="coach" data-hint="1"><span class="qd"></span><span id="coachText">Grow your colony</span></div>
    <!-- the toolbox: four picture cards, and it hides the moment one is picked.
         It lives INSIDE the bottom stack, so it can never cover the one hint line. -->
    <div id="sheet"><div id="sheetCard">
      <button class="toolcard" id="tool_dig" type="button"><svg class="tic" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 2h2v9h-2z" fill="#b07a3c" stroke="#6b431c" stroke-width="1.4"/><path d="M8.5 2h7v2.6h-7z" fill="#8a5a2b"/><path d="M7.6 11h8.8v4.4a4.4 4.4 0 0 1-8.8 0z" fill="#cfd6dc" stroke="#5b6874" stroke-width="1.5"/></svg><span>Dig</span></button>
      <button class="toolcard" id="tool_food" type="button"><svg class="tic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7.4c2-2 6.6-1.6 6.6 3.6 0 5-3.2 9.4-6.6 9.4S5.4 16 5.4 11c0-5.2 4.6-5.6 6.6-3.6z" fill="#63b34a" stroke="#2f6b26" stroke-width="1.6"/><path d="M12 7.4V4" stroke="#6b431c" stroke-width="1.8" stroke-linecap="round"/><path d="M12.4 5.2c1.6-1.6 3.4-1.4 3.4-1.4s.2 1.8-1.4 3.4c-1.2 1-2 .6-2 .6s-.4-1 0-2.6z" fill="#8ed36f"/></svg><span>Food</span></button>
      <button class="toolcard" id="tool_water" type="button"><svg class="tic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.2c4.2 6 6.6 9.1 6.6 12.1a6.6 6.6 0 0 1-13.2 0c0-3 2.4-6.1 6.6-12.1z" fill="#62b6f2" stroke="#2f6f9c" stroke-width="1.6"/><circle cx="9.4" cy="15.4" r="2" fill="#bfe6ff"/></svg><span>Water</span></button>
      <button class="toolcard" id="tool_build" type="button"><svg class="tic" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.6 9.6l3.8 3.8-6.1 6.1a2.7 2.7 0 0 1-3.8-3.8z" fill="#b07a3c" stroke="#6b431c" stroke-width="1.5"/><path d="M12.4 3.2l8.4 4.2-2.6 4.2-8.4-4.2z" fill="#cfd6dc" stroke="#5b6874" stroke-width="1.5"/></svg><span>Build</span></button>
    </div></div>
    <!-- AC8: ONE smart bar. Meters on the left, what is in your hand in the middle,
         the toolbox on the right. Everything here is a picture first: a player who
         cannot read a word still knows what the colony has and what a tap will do. -->
    <div id="smart">
      <div id="meters">
        <div class="mt" id="mtr_food"><span class="bar"><i id="fill_food"></i></span><svg class="mic" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 5c1.3-1.4 4.4-1.1 4.4 2.4 0 3.3-2.1 6.3-4.4 6.3S3.6 10.7 3.6 7.4C3.6 3.9 6.7 3.6 8 5z" fill="#63b34a"/><path d="M8 5V2.6" stroke="#3f7a2f" stroke-width="1.3" stroke-linecap="round"/></svg><span class="tag">!</span></div>
        <div class="mt" id="mtr_water"><span class="bar"><i id="fill_water"></i></span><svg class="mic" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.6c2.8 4 4.4 6.1 4.4 8.1a4.4 4.4 0 0 1-8.8 0c0-2 1.6-4.1 4.4-8.1z" fill="#62b6f2"/></svg><span class="tag">!</span></div>
        <div class="mt" id="mtr_rest"><span class="bar"><i id="fill_rest"></i></span><svg class="mic" viewBox="0 0 16 16" aria-hidden="true"><path d="M12.6 9.8A5.4 5.4 0 0 1 6.2 3.4a5.4 5.4 0 1 0 6.4 6.4z" fill="#f2a2c0"/></svg><span class="tag">!</span></div>
        <div class="mt" id="mtr_eggs"><span class="bar"><i id="fill_eggs"></i></span><svg class="mic" viewBox="0 0 16 16" aria-hidden="true"><ellipse cx="8" cy="9" rx="4.2" ry="5.4" fill="#e9c46a"/></svg><span class="tag">!</span></div>
      </div>
      <button id="actMain" class="t-dig" type="button"><svg class="ic ic-dig" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 2h2v9h-2z" fill="#b07a3c" stroke="#6b431c" stroke-width="1.4"/><path d="M8.5 2h7v2.6h-7z" fill="#8a5a2b"/><path d="M7.6 11h8.8v4.4a4.4 4.4 0 0 1-8.8 0z" fill="#cfd6dc" stroke="#5b6874" stroke-width="1.5"/></svg><svg class="ic ic-food" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7.4c2-2 6.6-1.6 6.6 3.6 0 5-3.2 9.4-6.6 9.4S5.4 16 5.4 11c0-5.2 4.6-5.6 6.6-3.6z" fill="#63b34a" stroke="#2f6b26" stroke-width="1.6"/><path d="M12 7.4V4" stroke="#6b431c" stroke-width="1.8" stroke-linecap="round"/><path d="M12.4 5.2c1.6-1.6 3.4-1.4 3.4-1.4s.2 1.8-1.4 3.4c-1.2 1-2 .6-2 .6s-.4-1 0-2.6z" fill="#8ed36f"/></svg><svg class="ic ic-water" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.2c4.2 6 6.6 9.1 6.6 12.1a6.6 6.6 0 0 1-13.2 0c0-3 2.4-6.1 6.6-12.1z" fill="#62b6f2" stroke="#2f6f9c" stroke-width="1.6"/><circle cx="9.4" cy="15.4" r="2" fill="#bfe6ff"/></svg><svg class="ic ic-build" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.6 9.6l3.8 3.8-6.1 6.1a2.7 2.7 0 0 1-3.8-3.8z" fill="#b07a3c" stroke="#6b431c" stroke-width="1.5"/><path d="M12.4 3.2l8.4 4.2-2.6 4.2-8.4-4.2z" fill="#cfd6dc" stroke="#5b6874" stroke-width="1.5"/></svg><span class="at"><span id="actName">Dig</span><span id="actHint">drag in the dirt</span></span></button>
      <button id="actSwap" type="button" aria-label="Change tool"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="2.5" fill="#8a5a2b"/><rect x="13" y="3" width="8" height="8" rx="2.5" fill="#63b34a"/><rect x="3" y="13" width="8" height="8" rx="2.5" fill="#62b6f2"/><rect x="13" y="13" width="8" height="8" rx="2.5" fill="#cfd6dc"/></svg></button>
    </div>
    <div id="jobsStrip">
      <div id="stripRow">
        <button id="jobsToggle" type="button"><span>Jobs</span><span id="barAnts">6 ants</span><span class="chev"></span></button>
        <div id="bar"></div>
      </div>
      <div id="jobsBody" class="closed">
        <div id="barMix">A steady, balanced crew</div>
        <div id="jobs"></div>
      </div>
    </div>
  </div>
  <div id="build"><div id="buildCard"><div id="buildTop"><h2 id="buildHead">Build a room</h2><button id="buildCancel" type="button" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="#3a2600" stroke-width="4" stroke-linecap="round"/></svg></button></div><div id="roomList"></div></div></div>
  <div id="start"></div>
</div>

<script src="buildable-renders.js"></script>
<script src="buildable-mechanics.js"></script>
<script src="buildable-audio.js"></script>
<script src="buildable-startscreen.js"></script>
<script src="buildable-manifest.js"></script>
<script src="buildable-hud.js?v=1"></script>
<script src="buildable-gamenav.js"></script>
<script src="buildable-wallet.js"></script>
<script src="buildable-feel.js"></script>
<script src="buildable-wincard.js"></script>
<script>
"use strict";
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var BA = window.BuildableAudio || { unlock:function(){}, sfx:function(){}, toggleMute:function(){return false;}, muted:false };
  var BR = window.BuildableRenders || null;
  var BS = window.BuildableStartScreen;
  var BW = window.BuildableWallet;
  var Feel = window.Feel;

  var ACCENT = "#E9A23B";              // kept in sync with /antcity/manifest.json "color"

  // ======================================================================
  //  Sound (AC4). Every sound Ant City makes is one WE created, named in
  //  api/sfx.js and served from /api/sfx. The shared synth in buildable-audio
  //  is a silent fallback only: a clip that is not generated yet is simply not
  //  heard. The music is one shared library loop, so any game can reuse it.
  // ======================================================================
  var SFX_BASE = "/api/sfx?s=";
  //  The left column is the name the ENGINE (or the shared Feel kit) asks for —
  //  Feel.tap plays "select", Feel.coinBurst plays "coin", Feel.celebrate plays
  //  "win" — and the right column is the clip in api/sfx.js that answers it.
  var SFX_MAP = {
    dig:     "antcity_dig",      // a digger opens a cell
    select:  "antcity_march",    // a tap: ants marching to a new job
    munch:   "antcity_munch",    // a crumb reaches the colony
    hatch:   "antcity_hatch",    // an egg opens
    coin:    "antcity_hatch",    // the coin burst on a finished mission
    rain:    "antcity_rain",     // a tunnel floods
    win:     "antcity_hatch",    // Feel.celebrate
    levelup: "antcity_hatch",
    hurt:    "antcity_rain",     // Feel.miss — a setback, never a buzzer
    // AC9: a bad bug turning up is a setback cue, and shooing it off is a march.
    // Both reuse clips Ant City already owns, so nothing goes silently missing.
    bug:     "antcity_rain",
    scare:   "antcity_march"
  };
  var MUSIC_URL = "/api/library-music?name=meadow_busy_bright";
  function sfx(name){ try{ if(BA && BA.sfx && !DEMO) BA.sfx(name); }catch(e){} }
  var _music = null;
  function ensureMusic(){
    if(DEMO || !BA || !BA.setMusic || _music === MUSIC_URL) return;
    try{ if(BA.stopMusic) BA.stopMusic(); BA.setMusic(MUSIC_URL); _music = MUSIC_URL; if(BA.playMusic) BA.playMusic(); }catch(e){}
  }

  // ======================================================================
  //  GAME_CONFIG — the recipe. Every number the colony runs on lives here,
  //  so tuning Ant City never means rewriting it. The manifest may replace

    OX = Math.floor((W - CS*GAME_CONFIG.cols) / 2);
    SKY = Math.max(96, Math.min(170, Math.round(H * 0.20)));

    // the thing on screen was far taller, which is how the tutorial ended up
    // pointing at dirt that was hidden behind it.
    PANEL = 0;
    if(state === "play"){
      var el = $("panel"), h = (el && el.offsetHeight) || 0;

  // ---------- deterministic randomness (the world is scripted; the QA robot must repeat it) ----------
  var _seed = 20260906;

  //  The colony. Cells are stored sparsely: solid dirt is simply absent.
  //    tunnel  { c, r, kind:"tunnel" }
  //    plan    { c, r, kind:"plan", dig:0..1 }        a path the kid drew
  //    room    { c, r, kind:"room", room:"nursery", build:0..1, done:bool }
  // ======================================================================
  var C = null;                 // the colony state
  function key(c,r){ return c+","+r; }
  function cellAt(c,r){ return C.cells[key(c,r)] || null; }
  function isOpen(c,r){ var x = cellAt(c,r); return !!(x && !x.flooded && (x.kind === "tunnel" || (x.kind === "room"))); }

  function freshColony(diff){
    var g = GAME_CONFIG, col = {
      cells:{}, plan:[], ants:g.startAnts, eggs:0, food:g.startFood, water:g.startWater,
      jobs:{ digger:2, forager:2, nursery:1, builder:1, soldier:0 },
      surface:[], sample:[],
      layProg:0, hatchProg:0, deepest:g.startRow, difficulty:diff||3,
      queen:{ c:Math.floor(g.cols/2), r:g.startRow }, born:0, dug:0, rooms:0, t:0,

  function tune(){ return GAME_CONFIG.difficulty[Math.max(0,Math.min(4,(C.difficulty|0)-1))] || GAME_CONFIG.difficulty[2]; }

  //  AC6 pillar 1: WHERE a room is dug changes how well it works. Every rule
  //  is a BONUS. A plain spot earns nothing and costs nothing, so a colony
  //  built before any of this existed carries on exactly as it did.
  // ======================================================================
  function goodSpot(id, c, r){
    var p = GAME_CONFIG.placement[id]; if(!p) return false;
    if(p.test === "shallow") return r <= p.n;
    if(p.test === "deep")    return r >= p.n;
    if(p.test === "queen")   return (Math.abs(c - C.queen.c) + Math.abs(r - C.queen.r)) <= p.n;
    return false;
  }

    return goodSpot(id, c, r) ? p.yes : p.no;
  }

  function roomMul(id){

      var x = C.cells[k];

  function eggCap(){ return GAME_CONFIG.capacity.eggBase + roomCount("nursery")*GAME_CONFIG.capacity.eggPerNursery; }

    var wet = (floodCount() && C.food < GAME_CONFIG.setback.stockedFood) ? GAME_CONFIG.setback.floodRate : 1;

  // what is slowing the colony right now, in the kid's words. Never a failure,

    var bug = bugHere();

      if(jobCount("soldier") > 0) return bd.busy;
      return bug.state === "nap" ? bd.nap : bd.call;

  // ======================================================================
  //  AC9: soldiers, and the bad bugs they see off.
  //
  //  A visit is a RARE TREAT, not a punishment. Every rule below follows the
  //  same law the rest of Ant City follows: a setback PAUSES one thing you can
  //  see, and never takes anything away. Nothing is destroyed, no ant is lost,
  //  no store goes down, and there is no timer to beat. With nobody on Soldiers

  //  kid moves one ant across — and ONE soldier always ends it, provably.
  // ======================================================================
  function soldiersUnlocked(){
    // the milestone is what really unlocks it; free-build and a big colony are
    // there so a colony saved before AC9 existed is never left without its guards
    return !!(C && (C.soldiers || C.freeBuild || C.ants >= (GAME_CONFIG.soldier.unlockAnts||15)));
