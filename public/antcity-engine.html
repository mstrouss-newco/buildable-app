  function chooseRoom(id){
    closeBuild();
    if(pickCell){ startRoom(id, pickCell.c, pickCell.r); pickCell = null; return; }
    placing = { room:id };
    // only ONE action is lit at a time: while a room is looking for its spot, a tap
    // means "put it here", not "leave a crumb"
    var tb = $("toolBuild"); if(tb && tb.classList) tb.classList.add("on");
    ["toolFood","toolWater"].forEach(function(k){ var e = $(k); if(e && e.classList) e.classList.remove("on"); });
    var nm = (GAME_CONFIG.rooms[id] || {}).name || "room";
    hint(buildSpots().length
      ? ("Tap a glowing spot to put your " + nm.toLowerCase() + " there")

    if(jobCount("builder") <= 0) hint("Tap plus on Builders so somebody puts it up");

  // ======================================================================

        jobs:C.jobs, deepest:C.deepest, difficulty:C.difficulty, queen:C.queen,
        born:C.born, dug:C.dug, rooms:C.rooms, surface:C.surface,

  }
  // a colony saved before AC7 has crumbs of the old shape sitting on its meadow.
  // They come forward as real items rather than being thrown away.
  function reviveSurface(list){
    var out = [], i;

    for(i=0;i<list.length;i++){
      var o = list[i]; if(!o || (o.x == null && o.fx == null)) continue;
      var kind = o.kind === "water" ? "water" : (GAME_CONFIG.items[o.kind] ? o.kind : "crumb");
      var def = itemDef(kind);
      var fx = o.fx != null ? o.fx : Math.max(0.02, Math.min(0.98, o.x / Math.max(1, W)));
      out.push({ kind:kind, fx:fx, n:(o.n || def.n), give:def.give, pri:def.pri,
                 held:false, gone:false, claim:null, t:0 });
    }
    return out;
  }
  function loadSaved(){
    try{
      var raw = localStorage.getItem(SAVE_KEY); if(!raw) return null;
      var s = JSON.parse(raw); if(!s || s.v !== 1 || !s.cells) return null;
      var col = freshColony(s.difficulty || 3);
      col.cells = s.cells; col.plan = s.plan || []; col.ants = s.ants || col.ants; col.eggs = s.eggs || 0;
      col.food = s.food || 0; col.water = s.water || 0; col.jobs = s.jobs || col.jobs;

      col.born = s.born||0; col.dug = s.dug||0; col.rooms = s.rooms||0;
      col.surface = reviveSurface(s.surface);
      col.mission = s.mission||0; col.done = s.done||{}; col.mBase = s.mBase||{};
      col.freeBuild = !!s.freeBuild; col.hit = s.hit||{}; col.carried = s.carried||0; col.mFlood = s.mFlood||null;
      col.found = s.found||0; col.floods = s.floods||0; col.rest = (s.rest==null?1:s.rest);
      col.find = s.find || col.find; col.seen = !!s.seen; col.guided = !!s.guided;
      col.leaves = s.leaves||0; col.leavesCut = s.leavesCut||0; col.leafReady = (s.leafReady==null?3:s.leafReady);
      col.aphids = !!s.aphids; col.dew = s.dew||0; col.dewGot = s.dewGot||0; col.mush = s.mush||0;

  if(DEMO){ BA = { unlock:function(){}, sfx:function(){}, toggleMute:function(){return false;}, muted:true }; }

  function newColony(diff){

    walkSample(0);
  }
  function startPlay(){
    if(!C){ var saved = DEMO ? null : loadSaved(); C = saved || freshColony(3); }
    if(!C.surface) C.surface = [];

    if(!C.sample){ C.sample = []; walkSample(0); }

    $("panel").className = "";

  }
  // AC7: there is no level picker any more. Ant City has ONE colony that is always
  // yours, so a page with a single card on it was a door for the sake of a door:
  // the tile in the app opens straight into the anthill. Home exits to the hub.
  function leaveGame(){
    try{ if(window.parent && window.parent !== window) window.parent.postMessage({ type:"nav:exit" }, "*"); }catch(e){}
  }

  function frame(now){
    requestAnimationFrame(frame);
    if(!last) last = now;
    var dt = Math.min(0.25, (now - last)/1000); last = now;
    if(state === "play" && !paused){
      acc += dt;
      var guard = 0;
      while(acc >= STEP && guard < 12){ step(); acc -= STEP; guard++; }
      if(acc > 0.5) acc = 0;
      tickHint(dt); tickParty(dt); tickPulse(dt);
      if(saveT > 0 && !DEMO){ saveT -= dt; if(saveT <= 0) saveNow(); }
      if(DEMO) demoStep(dt);
      syncHud(); syncJobsUI(); syncNeeds(); syncCoach();
    }

  }
  // attract mode: the colony plays itself, silent, input ignored (used by the picker)
  function demoStep(dt){
    demoT += dt;

      var c = C.queen.c + (Math.floor(srand()*3) - 1), r = C.deepest + 1;
      c = Math.max(0, Math.min(GAME_CONFIG.cols-1, c));
      if(!planCell(c, r)) planCell(C.queen.c, r);

    }
  }

  // ======================================================================
  //  The lessons (AC5, reworked in AC7). The first minute teaches the three
  //  things the colony is made of; the moment rooms unlock, a second short lesson
  //  teaches Build. Three rules hold for every step: it WAITS for the real action,
  //  it only ever teaches a gesture that really works, and its words come out of
  //  the ONE hint line, so nothing else on screen can contradict it.
  // ======================================================================
  var LESSONS = {
    intro: [
      { text:"Drag down in the brown dirt to dig a tunnel", hi:null,
        spot:function(){ return digSpot(); },
        done:function(){ return C.plan.length > 0 || (C.dug - guide.base.dug) > 0; } },
      { text:"Now tap the green grass to drop some food", hi:"toolFood",
        spot:function(){ return { fc:GAME_CONFIG.cols*0.26, fr:SURF_R }; },
        done:function(){ return (C.tapped|0) > (guide.base.tapped|0); } },
      // AC7: the old step three taught sliding the colour bar, which did nothing on
      // a mouse. A tap on the plus button cannot miss, on any device.
      { text:"Tap the plus on Foragers to give an ant that job", hi:"job_forager_up", open:true,
        spot:null,
        done:function(){ return guide.moved; } }
    ],
    build: [
      { text:"Your ants can have rooms now. Tap Build.", hi:"toolBuild", spot:null,
        done:function(){ return guide.opened; } },
      { text:"Pick a room, then tap a glowing spot to put it there", hi:null, spot:null,
        done:function(){ return guide.built; } }
    ]
  };
  // where to point for "dig here": just under the dig face when that is on screen,
  // otherwise out sideways from a tunnel that is. The ? button gets used most on a
  // colony that has already grown, and it must never point off the bottom of the world.
  function digSpot(){
    // "on screen" means clear of the HUD at the top and of the panel at the bottom,
    // not merely inside the canvas
    var down = { fc:C.queen.c, fr:C.deepest + 1, down:true }, y = frToY(down.fr);
    if(!isFinite(y) || (y > SKY + CS && y < H - PANEL - CS*1.2)) return down;
    var b = viewBand(), r, c, d, yy, lim = Math.min(b.hi, C.deepest);
    for(r = b.lo; r <= lim; r++){
      if(!isOpen(C.queen.c, r)) continue;
      yy = frToY(r);
      if(isFinite(yy) && (yy < SKY + CS || yy > H - PANEL - CS*1.2)) continue;
      for(d = 0; d < 2; d++){
        c = C.queen.c + (d ? -1 : 1);
        if(c < 0 || c >= GAME_CONFIG.cols) continue;
        if(!cellAt(c, r)) return { fc:c, fr:r, down:false };
      }
    }
    return down;
  }
  var guide = { on:false, lesson:"intro", step:0, t:0, base:{ dug:0, tapped:0 },
                moved:false, opened:false, built:false };
  var openedForLesson = false;      // the job cards were opened BY a lesson, not by the kid
  var how = { on:false };            // the shell and the QA robot still ask for it by this name
  function stepNow(){ var L = LESSONS[guide.lesson]; return L ? L[guide.step] : null; }
  function lessonLen(name){ var L = LESSONS[name || guide.lesson]; return L ? L.length : 0; }

  function startLesson(name){
    if(!LESSONS[name]) return;
    guide.on = true; guide.lesson = name; guide.step = 0; guide.t = 0;
    guide.moved = false; guide.opened = false; guide.built = false;
    guide.base = { dug:C.dug, tapped:C.tapped|0 };
    how.on = true;
    clearMsg();                       // one surface: the lesson owns it while it runs
    setGuideHi(); bumpIdle(); syncCoach();
  }
  function showHow(){ startLesson("intro"); }
  function endHow(){ guide.on = false; how.on = false; teachCool = 8; setGuideHi(); syncCoach(); }
  // the build lesson fires the moment a room is really available, and only once
  var teachCool = 0;
  function maybeTeachBuild(){
    if(DEMO || guide.on || !C.guided) return;
    if(teachCool > 0) return;                    // let the last lesson's words be read first
    if(setbackNow()) return;                     // a hungry colony comes before a new idea
    if(!C.taught) C.taught = {};
    if(C.taught.build || !anyRoomUnlocked()) return;
    C.taught.build = true;
    startLesson("build");
    saveSoon();
  }
  function tickHow(dt){
    if(teachCool > 0) teachCool = Math.max(0, teachCool - dt);
    if(!guide.on){ maybeTeachBuild(); return; }
    guide.t += dt;
    var st = stepNow();
    if(!st){ endHow(); return; }
    if(guide.t < 0.5 || !st.done()) return;
    guide.step++; guide.t = 0; guide.moved = false; guide.opened = false; guide.built = false;
    guide.base = { dug:C.dug, tapped:C.tapped|0 };
    if(Feel){ try{ Feel.tap(); }catch(e){} }
    if(guide.step >= lessonLen()){
      var was = guide.lesson;
      endHow();
      if(openedForLesson){ setJobsOpen(false); openedForLesson = false; }
      if(was === "intro"){
        C.guided = true; saveSoon();
        hint("You have got it. Now keep growing your colony.");
      } else hint("Nice. Your ants will walk over and put it up.");
    } else { setGuideHi(); syncCoach(); }
  }
  // the one control this step is about gets a soft pulse; everything else is left alone
  function setGuideHi(){
    var ids = ["toolBuild","toolFood","toolWater","bar","jobsToggle","job_forager_up","job_digger_up","job_nursery_up","job_builder_up"], i;
    for(i=0;i<ids.length;i++){ var e = $(ids[i]); if(e && e.classList) e.classList.remove("pulse"); }
    if(!guide.on) return;
    var st = stepNow(); if(!st) return;
    if(st.open && !jobsOpen){ setJobsOpen(true); openedForLesson = true; }   // a step about the job cards opens them
    if(st.hi){ var e2 = $(st.hi); if(e2 && e2.classList) e2.classList.add("pulse"); }
  }
  function drawHow(){
    if(!guide.on) return;
    var st = stepNow(); if(!st || !st.spot) return;
    var p = st.spot(), x = fcToX(p.fc), y = frToY(p.fr);
    if(guide.lesson === "intro" && guide.step === 0 && p.down){
      // where the tunnel is headed, so the shape of the idea is on screen at once
      X.strokeStyle = "rgba(255,240,200,.5)"; X.lineWidth = 2.5; X.setLineDash([5,5]);
      for(var i=0;i<4;i++){
        var cxp = cellX(C.queen.c), cyp = cellY(C.deepest + 1 + i);
        if(BR){ BR.rrect(X, cxp+4, cyp+4, CS-8, CS-8, 8); X.stroke(); } else X.strokeRect(cxp+4, cyp+4, CS-8, CS-8);
      }

      y = frToY(C.deepest + 1 + slide*3);

    // on every touchscreen. Drawn, so it needs no art and says nothing in words.
    handDot(x, y);
  }
  function handDot(x,y){
    var p2 = 0.75 + 0.25*Math.sin(guide.t*6);
    X.strokeStyle = "rgba(255,255,255,.55)"; X.lineWidth = 3;
    X.beginPath(); X.arc(x, y, CS*0.42*p2, 0, 7); X.stroke();
    X.fillStyle = "rgba(255,255,255,.92)"; X.beginPath(); X.arc(x, y, CS*0.2, 0, 7); X.fill();
  }

  // ---------- shared nav bridge (Home exits, Sound, Help) ----------
  if(window.BuildableGameNav){
    window.BuildableGameNav.register({
      hide:["backBtn","muteBtn","helpBtn"],

  $("muteBtn").addEventListener("click", function(){ BA.unlock(); BA.toggleMute(); });
  $("helpBtn").addEventListener("click", function(){ showHow(); });
  $("backBtn").addEventListener("click", function(){ leaveGame(); });

  // ---------- cartridge contract: shell -> game ----------

    var d = ev && ev.data; if(!d || !d.type) return;
    if(d.type === "pause"){ paused = true; return; }                  // freeze NOW
    if(d.type === "resume"){ paused = false; last = 0; acc = 0; return; }

  // ======================================================================
  //  Boot: read the manifest for art + feel, keep every built-in fallback
  // ======================================================================
  var ART_IDS = {
    // AC7: the ant slot is a LOOK, not a picture. The ants are drawn (see drawAntShape)
    // because an AI sprite reads as an orange blob at three tenths of a cell; the id
    // still comes from the manifest and still picks the body colour, and the art file
    // behind it is untouched, so putting a sprite back is a one-line change.
    ant:"antcity/ant/classic-v1", queen:"antcity/hero/queen-v1", soil:"antcity/soil/sandy-v1",
    egg:"antcity/prop/egg-v1", crumb:"antcity/prop/crumb-v1", find:"antcity/prop/buried-find-v1",
    surface:"antcity/surface/meadow-v1", rainSurface:"antcity/surface/meadow-rain-v1",
    flood:"antcity/prop/flood-v1", colony:"antcity/prop/colony-v1", loading:"antcity/loading/v1",
    room_nursery:"antcity/prop/nursery-v1", room_storage:"antcity/prop/storage-v1", room_den:"antcity/prop/den-v1",
    room_fungus:"antcity/prop/fungus-v1", leaf:"antcity/prop/leaf-v1",
    aphid:"antcity/prop/aphid-plant-v1", honeydew:"antcity/prop/honeydew-v1"
  };
  // The shell owns the kid's picks and hands the engine the option INDEX per slot
  // (?ant=1&meadow=0&dirt=1), the same tiny-param handoff Breaker and Sky Flyer use.
  function equippedLooks(){
    var out = {};
    try{
      var q2 = new URLSearchParams(location.search);
      ["ant","meadow","dirt"].forEach(function(k){ var v = q2.get(k); if(v != null && v !== "" && !isNaN(+v)) out[k] = +v; });
    }catch(e){}
    return out;
  }
  function applyManifest(m){
    if(!m || typeof m !== "object") return;
    try{
      if(m.color) ACCENT = m.color;
      var lv = (m.levels && m.levels[0]) || null, parts = (lv && lv.parts) || {};
      if(parts.ant)  ART_IDS.ant  = parts.ant;
      if(parts.soil) ART_IDS.soil = parts.soil;
      if(parts.surface) ART_IDS.surface = parts.surface;
      if(m.art && m.art.loadingScreen) ART_IDS.loading = m.art.loadingScreen;
      if(m.art && m.art.hero) ART_IDS.queen = m.art.hero;
      // AC6: rooms and the chain milestones are recipe, not engine. The manifest may
      // add or retune either; anything it does not mention keeps the built-in value.
      if(m.rooms && typeof m.rooms === "object"){
        for(var rk in m.rooms){
          var rd = m.rooms[rk] || {};
          GAME_CONFIG.rooms[rk] = GAME_CONFIG.rooms[rk] || { name:rk, desc:"", food:8, color:"#e9c46a" };
          if(rd.name) GAME_CONFIG.rooms[rk].name = rd.name;
          if(rd.desc) GAME_CONFIG.rooms[rk].desc = rd.desc;
          if(typeof rd.food === "number") GAME_CONFIG.rooms[rk].food = rd.food;
          if(rd.color) GAME_CONFIG.rooms[rk].color = rd.color;
          if(rd.asset) ART_IDS["room_"+rk] = rd.asset;
        }
      }
      if(m.milestones && m.milestones.length){
        var have = {}, mi;
        for(mi=0;mi<GAME_CONFIG.milestones.length;mi++) have[GAME_CONFIG.milestones[mi].id] = mi;
        m.milestones.forEach(function(ml){
          if(!ml || !ml.id) return;
          if(have[ml.id] != null){                       // the manifest wins on the numbers
            var cur = GAME_CONFIG.milestones[have[ml.id]];
            for(var f in ml) cur[f] = ml[f];
          } else GAME_CONFIG.milestones.push(ml);
        });
      }
      if(m.levels && m.levels.length){
        MISSIONS = m.levels.map(function(l){ return { id:l.id, name:l.name, layout:l.layout, coins:l.coins || 10, difficulty:l.difficulty }; });
      }
      // the kid's equipped look wins over the level default
      var looks = equippedLooks();
      (m.customization||[]).forEach(function(slot){
        var nm = String(slot.slot||"").toLowerCase();
        var want = looks[nm]; if(want == null) return;
        var o = (slot.options||[])[want]; if(!o || !o.asset) return;
        if(nm === "ant")    ART_IDS.ant     = o.asset;
        if(nm === "dirt")   ART_IDS.soil    = o.asset;
        if(nm === "meadow") ART_IDS.surface = o.asset;
      });
      if(Feel) Feel.configure({ accent:ACCENT, feel:m.feel || { pace:"chill", celebration:"calm", haptics:"on" }, sfxBase:SFX_BASE, sfxMap:SFX_MAP });
      if(window.BuildableHUD && window.BuildableHUD.setAccent) window.BuildableHUD.setAccent(ACCENT);
    }catch(e){}
  }
  function loadAllArt(){ for(var slot in ART_IDS) loadArt(slot, ART_IDS[slot]); }

  var booted = false;
  function bootScreen(){
    if(booted) return; booted = true;
    loadAllArt();
    if(DEMO) newColony(3);
    startPlay();                       // AC7: straight into the colony, no picker
  }
  function boot(){
    resize();
    if(Feel){ try{ Feel.configure({ accent:ACCENT, feel:{ pace:"chill", celebration:"calm", haptics:"on" }, sfxBase:SFX_BASE, sfxMap:SFX_MAP }); }catch(e){} }
    if(!C) C = (DEMO ? null : loadSaved()) || freshColony(3);
    if(!C.surface) C.surface = []; if(!C.sample){ C.sample = []; walkSample(0); }
    try{
      if(window.BuildableManifest && window.BuildableManifest.rawManifest){
        window.BuildableManifest.rawManifest("antcity", function(m){ applyManifest(m); bootScreen(); });
        setTimeout(bootScreen, 1800);          // safety net if the manifest never answers
      } else bootScreen();
    }catch(e){ bootScreen(); }
  }
  boot();
  requestAnimationFrame(frame);

  // ======================================================================
  //  The platform game handle. The QA robot (qa-antcity.mjs, card AC2) and
  //  the shell drive the colony only through this.
  // ======================================================================
  window.ANTCITY_GAME = {
    state: function(){ return state; },
    play: function(diff){ if(diff) { newColony(diff); } startPlay(); },
    newColony: function(diff){ newColony(diff||3); },
    setDifficulty: function(d){ C.difficulty = Math.max(1, Math.min(5, d|0)); },
    step: function(n){ n = n||1; for(var i=0;i<n;i++) step(); return this.dbg(); },
    seconds: function(s){ var n = Math.round((s||1)/STEP); for(var i=0;i<n;i++) step(); return this.dbg(); },
    dig: function(c, r){ return planCell(c, r); },
    digDown: function(n){ var made = 0; for(var i=0;i<(n||1);i++){ if(planCell(C.queen.c, C.deepest + 1 + i)) made++; } return made; },
    drop: function(kind, x){ dropSurface(kind === "water" ? "water" : "food", x != null ? x : W/2, true); return C.surface.length; },
    assign: function(job, n){ if(!(job in C.jobs)) return null; var d = (n|0) - (C.jobs[job]|0); for(var i=0;i<Math.abs(d);i++) moveAnt(job, d > 0 ? 1 : -1); return C.jobs[job]; },
    build: function(c, r, room){ var cell = cellAt(c, r); if(!cell || cell.kind !== "tunnel") return false;
      var def = GAME_CONFIG.rooms[room]; if(!def || C.food < def.food) return false;
      C.food -= def.food; cell.kind = "room"; cell.room = room; cell.build = 0; cell.done = false;
      cell.good = goodSpot(room, c, r); return true; },
    rooms: function(){ var o = {}; for(var k in GAME_CONFIG.rooms) o[k] = roomCount(k); return o; },
    // --- missions (AC2), for the robot and the shell ---
    missions: function(){ return MISSIONS.map(function(m){ return { id:m.id, name:m.name, layout:m.layout, coins:m.coins, done:!!C.done[m.id] }; }); },
    mission: function(){ var m = currentMission(); if(!m) return { free:true, line:missionLine() };
      var g = goalFor(m); return { index:C.mission, id:m.id, name:m.name, layout:m.layout, coins:m.coins,
        goal:g, have:Math.max(0, haveFor(g)), line:missionLine(), free:false }; },
    freeBuild: function(){ return !!C.freeBuild; },
    unlocked: function(id){ return roomUnlocked(id); },
    rain: function(){ var c = rain(); return c ? { c:c.c, r:c.r } : null; },
    // the first plain tunnel a room could go in (the robot builds there)
    openTunnel: function(){ for(var k in C.cells){ var x = C.cells[k];
      if(x.kind === "tunnel" && !x.flooded && !(x.c === C.queen.c && x.r <= C.queen.r)) return { c:x.c, r:x.r }; } return null; },
    floods: function(){ return floodCount(); },
    setback: function(){ return setbackNow(); },
    find: function(){ return C.find ? { c:C.find.c, r:C.find.r, gone:!!C.find.gone } : null; },
    how: function(){ return how.on; },
    showHow: showHow,
    // --- AC5: the visible ants, the guide and the goal line ---
    crowd: function(){ return C.sample.map(function(a){
      return { fc:Math.round(a.fc*100)/100, fr:Math.round(a.fr*100)/100, job:a.job, state:a.state,
               task:a.task ? a.task.kind : null, phase:(a.task && a.task.phase) || null,
               carry:a.carry ? a.carry.kind : null, idle:(a.state === "idle"),
               post:a.post ? (a.post.c + "," + a.post.r) : null,
               at:Math.round(a.fc) + "," + Math.round(a.fr),
               inDirt:(a.fr > -0.2 && !isOpen(Math.round(a.fc), Math.round(a.fr))) }; }); },
    // --- AC7: the one hint line, the needs meters, the meadow and the build flow ---
    // hints() is the whole point of the AC7 hint rework: there is ONE surface, so
    // this can never return two, and the QA robot asserts exactly that.
    hints: function(){
      var out = [], el = $("coachText"), host = $("coach");
      var hidden = !!(host && host.className && host.className.indexOf("gone") >= 0);
      var panel = $("panel"), off = !!(panel && panel.className === "hidden");
      if(el && el.textContent && !hidden && !off) out.push(el.textContent);
      return out;
    },
    coach: function(){ return syncCoach(); },
    needs: function(){
      var o = {};
      for(var i=0;i<NEEDS.length;i++){
        var n = NEEDS[i], v = Math.max(0, Math.min(1, n.val() || 0));
        o[n.id] = { v:Math.round(v*100)/100, low:(n.low >= 0 && v < n.low) };
      }
      return o;
    },
    items: function(){ return C.surface.map(function(it){
      return { kind:it.kind, x:Math.round(itemX(it)), n:it.n, give:it.give, held:!!it.held, claimed:!!it.claim }; }); },
    spots: function(){ return buildSpots(); },
    queen: function(){ return { c:C.queen.c, r:C.queen.r }; },
    geom: function(){ layout(); return { cs:CS, ox:OX, sky:SKY, panel:PANEL, w:W, h:H, camY:Math.round(camY) }; },
    placing: function(){ return placing ? placing.room : null; },
    buildOpen: function(){ return buildOpen; },
    jobsOpen: function(){ return jobsOpen; },
    panelH: function(){ layout(); return PANEL; },
    lesson: function(){ return { on:guide.on, name:guide.lesson, step:guide.step, steps:lessonLen() }; },
    guide: function(){ return { on:guide.on, lesson:guide.lesson, step:guide.step, steps:lessonLen(),
                                text:(stepNow() || {}).text || "" }; },
    goal: function(){ return syncCoach(); },
    antScale: function(){ return GAME_CONFIG.antScale; },
    // --- AC6: layout bonuses, the felt job mix, and the production chains ---
    spot: function(id, c, r){ return { good:goodSpot(id, c, r), line:spotLine(id, c, r) }; },
    bonus: function(id){ return roomMul(id); },
    mix: function(){ return mixLine(); },
    trend: function(){ return (_foodTrend || "").replace(" ", "") || "steady"; },
    chain: function(){
      var r1 = function(n){ return Math.round(n*100)/100; };
      return { leaves:r1(C.leaves), ready:r1(C.leafReady), cut:r1(C.leavesCut), mush:r1(C.mush),
               aphids:!!C.aphids, dew:r1(C.dew), dewGot:r1(C.dewGot), gardens:roomCount("fungus"), nurseryOnMushrooms:gardenShare(),
               hauling:countTask(function(t){ return t && t.kind === "haul" && t.it && (t.it.kind === "leaf" || t.it.kind === "dew"); }) };
    },
    setAphids: function(on){ C.aphids = !!on; return C.aphids; },
    dbg: function(){ return { ants:C.ants, eggs:C.eggs, food:Math.round(C.food*10)/10, water:Math.round(C.water*10)/10,
                              jobs:JSON.parse(JSON.stringify(C.jobs)), deepest:C.deepest, planned:C.plan.length,
                              dug:C.dug, rooms:this.rooms(), born:C.born, state:state, paused:paused,
                              mission:C.mission, free:!!C.freeBuild, carried:Math.round(C.carried*10)/10,
                              floods:C.floods, flooded:floodCount(), found:C.found, rest:Math.round(C.rest*100)/100,
                              leaves:Math.round(C.leaves*10)/10, mush:Math.round(C.mush*10)/10, aphids:!!C.aphids,
                              surface:C.surface.length, tapped:C.tapped|0, guided:!!C.guided,
                              coins:coinsAwarded.slice() }; },
    _cfg: function(){ return GAME_CONFIG; },
    _applyManifest: function(m){ applyManifest(m); loadAllArt(); },
    _art: function(){ var o = {}; for(var s in ART_IDS) o[s] = artUrl(ART_IDS[s]); return o; },
    _draw: function(){ try{ draw(); return "ok"; }catch(e){ return "ERR: " + (e && e.message || e); } },
    _save: saveNow,
    _openAll: function(){ C.freeBuild = true; return true; },   // robot only: skip to free build
    _reset: function(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} newColony(3); }
  };
  try{ window.BUILDABLE_GAME = window.ANTCITY_GAME; }catch(e){}
})();
</script>
</body>
