<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="/favicon.ico?v=4" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=4" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=4" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=4" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=4" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#7C5CFC" />

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Buildable Tennis</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet" />
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; background:#0F0E17; font-family:'Nunito',sans-serif; }
  #wrap { position:fixed; inset:0; }
  canvas { display:block; width:100%; height:100%; touch-action:none; }
  /* start menu mount (BS renders into here) */
  /* TN-FIX: pointer-events:none so an EMPTY menu never eats the taps meant for the
     court. In-app the shell launches Tennis with ?mode=..., so mountStart() never
     runs and this full-screen div sat transparent on top of the canvas, swallowing
     every tap: the game played itself and the kid could not control it. The mounted
     start screen takes its taps back through the child rule. */
  #menu { position:absolute; inset:0; z-index:5; pointer-events:none; }
  #menu > * { pointer-events:auto; }
  /* canned-reaction bar (online only) */
  /* compact: a small "Say..." button bottom-right; phrases pop up on demand so they never cover the court */
  #reactToggle { position:absolute; right:14px; bottom:14px; z-index:6; display:none;
    font-family:'Fredoka',sans-serif; font-weight:600; font-size:13px; color:#fff;
    background:rgba(255,255,255,0.16); border:1px solid rgba(255,255,255,0.28); border-radius:999px; padding:8px 14px; cursor:pointer; }
  #reactToggle.on { display:block; }
  #reactPop { position:absolute; right:14px; bottom:54px; z-index:7; display:none; flex-direction:column; gap:6px;
    max-width:200px; max-height:46vh; overflow-y:auto; background:rgba(18,12,34,0.94);
    border:1px solid rgba(255,255,255,0.18); border-radius:14px; padding:8px; }
  #reactPop.on { display:flex; }
  #reactPop button { font-family:'Fredoka',sans-serif; font-weight:600; font-size:13px; color:#fff; text-align:left;
    background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.22); border-radius:10px; padding:7px 12px; cursor:pointer; }
  #reactPop button:active { background:rgba(255,255,255,0.30); }
  /* "Choose your court" picker overlay */
  .ov { position:absolute; inset:0; z-index:8; display:none; flex-direction:column; align-items:center;
    background:linear-gradient(180deg,#0b1230,#241152); color:#fff; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  .ov.show { display:flex; }
  .ov h1 { font-family:'Fredoka',sans-serif; font-weight:700; font-size:30px; margin:32px 0 4px; }
  .ov .sub { opacity:.8; margin:0 0 18px; font-size:15px; }
  .ov .btn { font-family:'Fredoka',sans-serif; font-weight:600; font-size:16px; color:#1a0f3a; background:#9b7bff;
    border:none; border-radius:14px; padding:12px 28px; margin:6px 0 28px; cursor:pointer; }
  #courtGrid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; width:100%;
    max-width:680px; padding:0 18px 24px; }
  .court-card { border-radius:16px; overflow:hidden; cursor:pointer; border:3px solid transparent;
    background:#1a1444; text-align:center; }
  .court-card.on { border-color:#7ee0a0; box-shadow:0 0 0 2px rgba(126,224,160,.4); }
  .court-card .thumb { width:100%; aspect-ratio:4/3; background-size:cover; background-position:center; display:block; }
  .court-card .nm { font-weight:800; font-size:14px; padding:8px 4px; }
</style>
<style id="no-longpress">/* Buildable: disable iOS long-press magnifier + Look Up/Translate popup app-wide; keep inputs selectable */
html,body{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
input,textarea,select,[contenteditable]{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="menu"></div>
  <button id="reactToggle" aria-label="Say something">Say…</button>
  <div id="reactPop"></div>
  <div id="court" class="ov">
    <h1>Choose your court</h1>
    <div class="sub">Where do you want to play?</div>
    <div id="courtGrid"></div>
    <button class="btn" id="courtBack">Back</button>
  </div>
</div>

<!-- shared engine libraries (drawn art, sound, juice, start screen) -->
<script src="buildable-renders.js"></script>
<script src="buildable-audio.js"></script>
<script src="buildable-wincard.js"></script>
<script src="buildable-mechanics.js"></script>
<script src="buildable-startscreen.js?v=2"></script>
<script src="buildable-levelthumb.js?v=8"></script>
<script src="buildable-manifest.js"></script>
<script src="buildable-worlds.js"></script>
<script src="buildable-gamenav.js"></script>

<script>
/* =====================================================================
   Buildable Tennis — a 1- and 2-player paddle game.
   Track B hand-authored engine. Network-agnostic: it knows nothing about
   Supabase. For cross-device family play it speaks ONLY the frozen `mp:`
   postMessage contract (see MULTIPLAYER.md) — host owns the ball, every kid
   broadcasts positions (not commands), guest renders what the host sends.
   ===================================================================== */
"use strict";
var BR = window.BuildableRenders, BA = window.BuildableAudio, BM = window.BuildableMechanics, BS = window.BuildableStartScreen;

/* ---------- 1) CONTENT AS DATA (worlds + difficulty levels) ---------- */
var GAME_CONFIG = window.GAME_CONFIG || {
  name: "Buildable Tennis",
  target: 7,                 // first to 7 points wins
  paddleW: 0.22,             // generous paddle (kid-friendly)
  ballR: 0.018,
  // difficulty "levels" shown on the start screen (all unlocked)
  levels: [
    { name: "Gentle",  start: 0.42, max: 0.78, gain: 1.035, bot: 0.18 },
    { name: "Normal",  start: 0.52, max: 0.95, gain: 1.045, bot: 0.26 },
    { name: "Speedy",  start: 0.62, max: 1.12, gain: 1.055, bot: 0.34 },
  ],
  // world -> smooth AI nature backdrop (img:1 => /api/images?kind=tennis&id=<key>) + accent colors
  // + ambient particle style `p`. Drawn gradient `bg` (sampled from each scene's
  // sky & ground) is the always-safe fallback.
  worlds: {
    beach:   { name: "Seaside",         bg: ["#d8eff5", "#73914e"], net: "#fff6cf", me: "#7ee0a0", opp: "#ff9ec4", ball: "#ffe27a", img: 1, p: "clouds" },
    space:   { name: "Northern Lights", bg: ["#002d49", "#02213c"], net: "#c9b8ff", me: "#7ee0a0", opp: "#ff9ec4", ball: "#fff1a8", img: 1, p: "stars" },
    jungle:  { name: "Big Tree",        bg: ["#23a8b0", "#6bb65c"], net: "#a8f0b8", me: "#ffe27a", opp: "#7ad6ff", ball: "#ffd23f", img: 1, p: "leaves" },
    ocean:   { name: "Pine Forest",     bg: ["#90b7c6", "#314d34"], net: "#bdeaff", me: "#ffe27a", opp: "#ff9ec4", ball: "#fff1a8", img: 1, p: "leaves" },
    candy:   { name: "Sunny Meadow",    bg: ["#14709a", "#449851"], net: "#ffd0ec", me: "#aef0c0", opp: "#9fd0ff", ball: "#fff1a8", img: 1, p: "clouds" },
    snow:    { name: "Snowy Peak",      bg: ["#7bbce4", "#30401e"], net: "#eaf6ff", me: "#ffd23f", opp: "#ff9ec4", ball: "#ffffff", img: 1, p: "snow" },
    volcano: { name: "Stone Cliffs",    bg: ["#92c7e5", "#465619"], net: "#ffd0a0", me: "#7ee0a0", opp: "#ffd23f", ball: "#ffcaa0", img: 1, p: "clouds" },
    city:    { name: "Green Hills",     bg: ["#7ac4e6", "#4eab5b"], net: "#ffd6e6", me: "#7ee0a0", opp: "#ffd23f", ball: "#fff1a8", img: 1, p: "clouds" },
  },
};
/* Session 7B: difficulty-tier names can come from /tennis/manifest.json, FULL fallback. */
(function loadTennisManifest(){
  try{
    if(!window.BuildableManifest || typeof window.BuildableManifest.load!=="function") return;
    window.BuildableManifest.load("tennis", function(cfg){
      try{
        if(cfg && cfg.stages && cfg.stages.length){
          for(var i=0;i<GAME_CONFIG.levels.length && i<cfg.stages.length;i++){ if(cfg.stages[i].name) GAME_CONFIG.levels[i].name = cfg.stages[i].name; }
          try{ refreshStart(); }catch(e){}
        }
      }catch(e){}
    }, function(){ /* missing/invalid -> keep built-in tiers */ });
  }catch(e){}
})();
function worldTheme(k) { return GAME_CONFIG.worlds[k] || GAME_CONFIG.worlds.beach; }
function mapWorld(k) { return GAME_CONFIG.worlds[k] ? k : "beach"; }   // online lobby may send unknown keys

/* ---------- 2) STATE ---------- */
var canvas = document.getElementById("c");
var ctx = canvas ? canvas.getContext("2d") : null;
var DPR = (window.devicePixelRatio || 1);
var VW = 900, VH = 1200;       // CSS pixel size of the canvas (set in resize)

// the play field is normalized 0..1 in both axes; it renders into a centered
// court rectangle that keeps a 3:4 portrait aspect so paddles sit top & bottom.
var court = { x: 0, y: 0, w: 0, h: 0 };

var fx = BM ? BM.makeFx() : { parts: [], pops: [], shake: 0, flash: 0, flashCol: "#fff" };

var G = null;          // live game object
var state = "title";   // title | play | over
var mode = "solo";     // solo | two | online
var diff = 0;          // index into GAME_CONFIG.levels
var worldKey = "beach";
var paused = false;    // online: opponent left
var started = false;
var demoOn = false, demoT = 0;   // wordless self-playing intro demo
var DEMO_MAX = 6;                // seconds: demo auto-starts play if untouched

// online bits
var online = (function () { try { return new URLSearchParams(location.search).get("online") === "1"; } catch (e) { return false; } })();
// Session 7F: the shell's shared landing hands us mode + equipped court, so Tennis
// skips its own start screen and court picker in the normal kid flow. No params
// (or online) -> the built-in menu still mounts, so opening it directly still works.
var shellMode = (function () { try { var m = new URLSearchParams(location.search).get("mode"); return (m === "solo" || m === "two") ? m : null; } catch (e) { return null; } })();
var shellWorld = (function () { try { return new URLSearchParams(location.search).get("world") || null; } catch (e) { return null; } })();
var _now = function () { try { return performance.now(); } catch (e) { return Date.now(); } };
var role = "host";     // host owns the ball
var flip = false;      // guest renders the field upside-down (self at bottom)
var meKid = null, oppKid = null, meName = "You", oppName = "Friend";
var lastSentPaddle = 0, lastSentBall = 0;

/* ---------- WORLD BACKDROP (AI art) + AMBIENT PARTICLES + SMACK TALK ---------- */
var bgImg = null, bgKey = null, TEN_PACK = null;
function tenBg(key){ try{ if(TEN_PACK&&TEN_PACK.hasWorld&&TEN_PACK.hasWorld(key)){ var l=TEN_PACK.list("background",key); if(l[0]&&l[0].img) return l[0].img; } }catch(e){} return null; }
try{ if(window.BuildableWorlds) BuildableWorlds.load("tennis", function(p){ TEN_PACK=p; try{ if(bgKey){ var k=bgKey; bgKey=null; loadBg(k); } }catch(e){} }); }catch(e){}
function loadBg(key) {
  key = mapWorld(key);
  if (bgKey === key) return;
  bgKey = key; bgImg = null;
  var lib = tenBg(key); if(lib){ bgImg = lib; refreshStart(); return; }   // drop-in art wins, else the AI world
  var th = worldTheme(key); if (!th.img) { refreshStart(); return; }
  try {
    var im = new Image();
    im.onload = function () { if (bgKey === key) { bgImg = im; refreshStart(); } };
    im.onerror = function () { if (bgKey === key) { bgImg = null; refreshStart(); } };
    im.src = "/api/images?kind=tennis&id=" + key + "&v=2";   // smooth AI nature world (cached)
  } catch (e) {}
}

var parts = [];
function initParticles() { parts = []; for (var i = 0; i < 34; i++) parts.push(spawnPart(true)); }
function spawnPart(initial) {
  var t = worldTheme(worldKey).p || "stars";
  var p = { type: t, x: Math.random(), y: Math.random(), r: 2 + Math.random() * 4, a: 0.5 + Math.random() * 0.5, ph: Math.random() * 6.28 };
  if (!initial) {   // respawn at the entry edge for its motion type
    if (t === "snow" || t === "leaves" || t === "sweets") { p.y = -0.05; p.x = Math.random(); }
    else if (t === "bubbles" || t === "embers" || t === "sun") { p.y = 1.05; p.x = Math.random(); }
    else { p.x = Math.random(); p.y = Math.random(); }
  }
  return p;
}
function updateParticles(dt) {
  for (var i = 0; i < parts.length; i++) {
    var p = parts[i]; p.ph += dt * 2;
    switch (p.type) {
      case "snow":    p.y += dt * 0.06; p.x += Math.sin(p.ph) * 0.0006; break;
      case "leaves":  p.y += dt * 0.05; p.x += dt * 0.03 + Math.sin(p.ph) * 0.001; break;
      case "sweets":  p.y += dt * 0.045; p.x += Math.sin(p.ph) * 0.0008; break;
      case "bubbles": p.y -= dt * 0.07; p.x += Math.sin(p.ph) * 0.0008; break;
      case "embers":  p.y -= dt * 0.09; p.x += Math.sin(p.ph) * 0.0012; p.a = 0.4 + 0.4 * Math.abs(Math.sin(p.ph)); break;
      case "sun":     p.y -= dt * 0.03; p.x += Math.sin(p.ph) * 0.0006; p.a = 0.4 + 0.4 * Math.abs(Math.sin(p.ph)); break;
      case "clouds":  p.x += dt * 0.02; break;
      default:        p.x += dt * 0.008; p.a = 0.4 + 0.4 * Math.abs(Math.sin(p.ph)); break; // stars twinkle
    }
    if (p.y < -0.08 || p.y > 1.08 || p.x < -0.08 || p.x > 1.08) parts[i] = spawnPart(false);
  }
}
function drawParticles() {
  var col = partColor(worldTheme(worldKey).p);
  for (var i = 0; i < parts.length; i++) {
    var p = parts[i];
    ctx.globalAlpha = p.a * 0.8; ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(p.x * VW, p.y * VH, p.r, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function partColor(t) {
  return t === "embers" ? "#ff9a3c" : t === "leaves" ? "#9be86a" : t === "bubbles" ? "#bfeaff"
    : t === "sweets" ? "#ffb3e0" : t === "snow" ? "#ffffff" : t === "sun" ? "#ffe9a8"
    : t === "clouds" ? "#ffffff" : "#fff6cf";
}

// SMACK TALK — playful, child-safe. The bot talks freely (it's the computer); kid-vs-kid
// stays canned reactions only (the bar). Bubbles fade after ~2.2s.
var TAUNTS = {
  botPoint: ["Too slow!", "Is that all?", "Gotcha!", "Boop!", "Hehe!", "Wibble wobble!", "Bonk!"],
  youPoint: ["Nice shot!", "Wow!", "You got this!", "Wheee!", "Boom!"],
  botWin:   ["I win! Good game!", "Gotcha! Rematch?", "So fun! Again?"],
  youWin:   ["You win! Amazing!", "Wow, you got me!", "Great game!"],
};
function pick(a) { return a[(Math.random() * a.length) | 0]; }
var bubbleTop = null, bubbleBot = null;   // {text, t} — top=opponent, bottom=you
function sayTop(text) { bubbleTop = { text: text, t: 2.2 }; }
function sayBot(text) { bubbleBot = { text: text, t: 2.2 }; }

/* ---------- 3) NEW GAME ---------- */
function newGame() {
  var lv = GAME_CONFIG.levels[diff] || GAME_CONFIG.levels[1];
  G = {
    lv: lv,
    botX: 0.5, topX: 0.5, bottomX: 0.5,   // paddle centers (normalized x)
    botTargetX: 0.5, oppTargetX: 0.5,     // smoothing targets for remote/bot
    bx: 0.5, by: 0.5, vx: 0, vy: 0,       // ball
    bxT: 0.5, byT: 0.5,                   // ball smoothing target (guest)
    sBottom: 0, sTop: 0,                  // scores (canonical: bottom vs top)
    serveTo: Math.random() < 0.5 ? 1 : -1,
    cool: 0,                              // serve countdown (seconds)
    winner: null,
  };
  serve(G.serveTo);
  bubbleTop = bubbleBot = null;
  loadBg(worldKey); initParticles(); playMusic();
  state = "play"; started = true; paused = false;
  demoOn = (mode !== "online"); demoT = 0;   // show the how-to-play demo first
}

function serve(dir) {
  var lv = G.lv;
  G.bx = 0.5; G.by = 0.5; G.bxT = 0.5; G.byT = 0.5;
  var ang = (Math.random() * 0.5 - 0.25);     // small sideways spread
  G.vx = Math.sin(ang) * lv.start;
  G.vy = dir * Math.cos(ang) * lv.start;
  G.cool = 0.7;                                // brief pause before it flies
}

/* ---------- 4) INPUT ---------- */
var keys = {};
function setMyPaddleX(nx) {
  if (!G) return;
  nx = Math.max(GAME_CONFIG.paddleW / 2, Math.min(1 - GAME_CONFIG.paddleW / 2, nx));
  if (mode === "online") { if (role === "host") G.bottomX = nx; else G.topX = nx; }
  else G.bottomX = nx;
}
function setTopHumanX(nx) {
  if (!G) return;
  G.topX = Math.max(GAME_CONFIG.paddleW / 2, Math.min(1 - GAME_CONFIG.paddleW / 2, nx));
}
// pointer -> normalized court coords (account for guest flip)
function pointerToCourt(clientX, clientY) {
  var r = canvas.getBoundingClientRect();
  var nx = (clientX - r.left - court.x) / court.w;
  var ny = (clientY - r.top - court.y) / court.h;
  if (flip) ny = 1 - ny;            // guest sees field flipped
  return { nx: nx, ny: ny };
}
function onPointer(clientX, clientY) {
  if (state !== "play" || !G) return;
  var p = pointerToCourt(clientX, clientY);
  if (mode === "two") {
    // top half drives the top paddle, bottom half drives the bottom paddle
    if (p.ny < 0.5) setTopHumanX(p.nx); else G.bottomX = clamp(p.nx);
  } else {
    setMyPaddleX(p.nx);
  }
}
function clamp(nx) { return Math.max(GAME_CONFIG.paddleW / 2, Math.min(1 - GAME_CONFIG.paddleW / 2, nx)); }

if (canvas) {
  canvas.addEventListener("pointermove", function (e) { onPointer(e.clientX, e.clientY); }, { passive: true });
  canvas.addEventListener("pointerdown", function (e) { if (BA) BA.unlock(); playMusic(); if (demoOn && demoT > 0.25) demoOn = false; onPointer(e.clientX, e.clientY); }, { passive: true });
  canvas.addEventListener("touchmove", function (e) {
    if (demoOn && demoT > 0.25) demoOn = false;
    for (var i = 0; i < e.touches.length; i++) onPointer(e.touches[i].clientX, e.touches[i].clientY);
  }, { passive: true });
}
window.addEventListener("keydown", function (e) { keys[e.key] = true; if (demoOn && demoT > 0.2 && (e.key === " " || e.key.indexOf("Arrow") === 0 || e.key.length === 1)) demoOn = false; if (BA && (e.key === " " || e.key.indexOf("Arrow") === 0)) { BA.unlock(); playMusic(); } });
window.addEventListener("keyup", function (e) { keys[e.key] = false; });

/* ---------- 5) UPDATE (physics) ---------- */
function update(dt) {
  if (!G || state !== "play" || paused) return;
  if (demoOn) {                                    // how-to demo overlay
    demoT += dt;                                   // advance here so play works headlessly too
    if (demoT > DEMO_MAX) demoOn = false;          // auto-start if the kid never taps
    else return;                                   // frozen behind the how-to demo
  }
  dt = Math.min(dt, 0.05);                       // clamp big frames

  // ---- keyboard paddle control ----
  var step = 1.4 * dt;
  if (mode !== "online") {
    if (keys["ArrowLeft"]) G.bottomX = clamp(G.bottomX - step);
    if (keys["ArrowRight"]) G.bottomX = clamp(G.bottomX + step);
    if (mode === "two") {
      if (keys["a"] || keys["A"]) setTopHumanX(G.topX - step);
      if (keys["d"] || keys["D"]) setTopHumanX(G.topX + step);
    }
  } else {
    var myKey = (role === "host") ? "bottomX" : "topX";
    if (keys["ArrowLeft"]) G[myKey] = clamp(G[myKey] - step);
    if (keys["ArrowRight"]) G[myKey] = clamp(G[myKey] + step);
  }

  // ---- bot AI (solo: bot is the TOP paddle) ----
  if (mode === "solo") {
    var aim = G.bx;                                // chase the ball's x
    var maxV = G.lv.bot * dt;
    var d = aim - G.topX;
    if (Math.abs(d) > maxV) d = (d > 0 ? maxV : -maxV);
    G.topX = clamp(G.topX + d);
  }

  // ---- GUEST: dead-reckon the ball so it never stalls between host packets ----
  // The host owns the ball and broadcasts {pos, vel} ~36x/s. Instead of chasing a
  // stale position (which looks laggy), we advance a predicted target along the
  // host's velocity every frame and quickly render toward it. When a fresh packet
  // arrives, applyPeer() resets the target to the truth, correcting any drift.
  if (mode === "online" && role === "guest") {
    var gr = GAME_CONFIG.ballR;
    // predict: move the authoritative target forward along its velocity
    G.bxT += G.vx * dt; G.byT += G.vy * dt;
    // bounce the predicted target off the side walls so it stays in-court
    if (G.bxT < gr) { G.bxT = gr; G.vx = Math.abs(G.vx); }
    if (G.bxT > 1 - gr) { G.bxT = 1 - gr; G.vx = -Math.abs(G.vx); }
    // render the ball quickly toward the prediction (smooth, no visible lag)
    G.bx += (G.bxT - G.bx) * Math.min(1, 24 * dt);
    G.by += (G.byT - G.by) * Math.min(1, 24 * dt);
    G.bottomX += (G.oppTargetX - G.bottomX) * Math.min(1, 18 * dt);   // host's paddle
    return;
  }

  // ---- HOST / SOLO / TWO simulate the ball ----
  // smooth a remote opponent paddle (online host smooths guest's paddle)
  if (mode === "online" && role === "host") {
    G.topX += (G.oppTargetX - G.topX) * Math.min(1, 18 * dt);
  }

  if (G.cool > 0) { G.cool -= dt; return; }

  var r = GAME_CONFIG.ballR, hw = GAME_CONFIG.paddleW / 2, pInset = 0.045, pTh = 0.022;
  G.bx += G.vx * dt; G.by += G.vy * dt;

  // side walls
  if (G.bx < r) { G.bx = r; G.vx = Math.abs(G.vx); ping("tennis_wall", "select"); }
  if (G.bx > 1 - r) { G.bx = 1 - r; G.vx = -Math.abs(G.vx); ping("tennis_wall", "select"); }

  // bottom paddle (canonical bottom defends by≈1)
  var byPaddle = 1 - pInset;
  if (G.vy > 0 && G.by + r >= byPaddle - pTh && G.by + r <= byPaddle + pTh + 0.04) {
    if (Math.abs(G.bx - G.bottomX) <= hw + r) { bounce(-1, G.bottomX); }
  }
  // top paddle defends by≈0
  var tyPaddle = pInset;
  if (G.vy < 0 && G.by - r <= tyPaddle + pTh && G.by - r >= tyPaddle - pTh - 0.04) {
    if (Math.abs(G.bx - G.topX) <= hw + r) { bounce(1, G.topX); }
  }

  // scoring
  if (G.by > 1 + 0.04) { point("top"); }
  else if (G.by < -0.04) { point("bottom"); }

  // host broadcasts ball + own paddle every frame
  if (mode === "online" && role === "host") {
    sendPaddle(G.bottomX);
    sendBall();
  } else if (mode === "online" && role === "guest") {
    sendPaddle(G.topX);
  }
}

function bounce(dir, paddleX) {
  var lv = G.lv;
  // reflect, steer by where it hit the paddle, and speed up a touch (capped)
  var off = (G.bx - paddleX) / (GAME_CONFIG.paddleW / 2);   // -1..1
  var speed = Math.min(lv.max, Math.hypot(G.vx, G.vy) * lv.gain);
  // always impart some sideways angle so no shot is ever dead-straight
  var mag = Math.max(0.16, Math.abs(off) * 0.9);
  var sgn = off === 0 ? (Math.random() < 0.5 ? -1 : 1) : (off > 0 ? 1 : -1);
  var ang = sgn * Math.min(0.95, mag);                      // up to ~54deg
  G.vx = Math.sin(ang) * speed;
  G.vy = dir * Math.abs(Math.cos(ang)) * speed;
  G.by = dir < 0 ? Math.min(G.by, 1 - 0.045 - 0.022 - GAME_CONFIG.ballR)
                 : Math.max(G.by, 0.045 + 0.022 + GAME_CONFIG.ballR);
  ping("tennis_hit", "coin");
  if (BM) { BM.burst(fx.parts, c2x(G.bx), c2y(G.by), worldTheme(worldKey).ball, 10); BM.shake(fx, 0.12); }
}

function point(side) {
  if (side === "top") G.sTop++; else G.sBottom++;
  // EXPLOSION where the ball blew past the goal line
  var ex = c2x(G.bx), ey = c2y(side === "top" ? 0.97 : 0.03);
  if (BM) {
    if (BM.explode) BM.explode(fx, ex, ey, worldTheme(worldKey).ball, { n: 26, shake: 0.5, flash: 0.5, flashCol: "#fff" });
    else { BM.burst(fx.parts, ex, ey, "#fff", 24); BM.shake(fx, 0.5); BM.flash(fx, "#fff", 0.5); }
    BM.pop(fx.pops, c2x(0.5), c2y(0.5), "Point!", "#fff");
  }
  ping("tennis_boom", "boss"); ping("tennis_point", "hurt");

  // smack talk (solo only — bot talks freely; kid-vs-kid uses the canned bar)
  if (mode === "solo") {
    if (side === "top") sayTop(pick(TAUNTS.botPoint));   // bot scored on you
    else sayBot(pick(TAUNTS.youPoint));                  // you scored
  }

  var tgt = GAME_CONFIG.target;
  if (G.sBottom >= tgt || G.sTop >= tgt) { finish(); return; }
  // host owns score in online — push it out, then serve toward the loser
  G.serveTo = (side === "top") ? 1 : -1;   // serve toward whoever was scored on
  serve(G.serveTo);
  if (mode === "online" && role === "host") sendBall();
}

function finish() {
  state = "over"; G.winner = G.sBottom > G.sTop ? "bottom" : "top";
  var iWon;
  if (mode === "online") iWon = (role === "host") ? (G.winner === "bottom") : (G.winner === "top");
  else iWon = (G.winner === "bottom");           // solo/two: bottom is "you"/P1
  ping(iWon ? "tennis_win" : "tennis_lose", iWon ? "win" : "lose");
  ping("tennis_cheer", "win");
  // celebratory fireworks across the court
  if (BM) {
    BM.flash(fx, iWon ? "#7ee0a0" : "#ff9ec4", 0.6); BM.shake(fx, 0.5);
    for (var k = 0; k < 5; k++) {
      var fxx = court.x + court.w * (0.2 + 0.6 * Math.random());
      var fxy = court.y + court.h * (0.2 + 0.6 * Math.random());
      var cols = ["#ffe27a", "#7ee0a0", "#ff9ec4", "#9fd0ff", "#ffd23f"];
      if (BM.explode) BM.explode(fx, fxx, fxy, cols[k % cols.length], { n: 22 });
      else BM.burst(fx.parts, fxx, fxy, cols[k % cols.length], 22);
    }
  }
  // winner/loser smack talk (solo only)
  if (mode === "solo") sayBot(pick(iWon ? TAUNTS.youWin : TAUNTS.botWin));

  // online: only the host writes the official result through the pipes
  if (mode === "online" && role === "host") {
    var winnerKid = (G.winner === "bottom") ? meKid : oppKid;
    mp("mp:result", { winner: winnerKid, score: { host: G.sBottom, guest: G.sTop } });
  }
}

/* ---------- 6) RENDER ---------- */
function c2x(nx) { return court.x + nx * court.w; }
function c2y(ny) { var y = flip ? (1 - ny) : ny; return court.y + y * court.h; }

function draw() {
  if (!ctx) return;
  var th = worldTheme(worldKey);
  var sh = BM ? BM.shakeOffset(fx) : { x: 0, y: 0 };
  ctx.save();
  ctx.translate(sh.x || 0, sh.y || 0);

  // backdrop — the world's sky->ground gradient fills the whole court (safe fallback),
  // then the smooth AI nature scene is drawn COVER-FIT to fill the whole canvas.
  var g = ctx.createLinearGradient(0, 0, 0, VH);
  g.addColorStop(0, th.bg[0]); g.addColorStop(1, th.bg[1]);
  ctx.fillStyle = g; ctx.fillRect(-40, -40, VW + 80, VH + 80);
  var drewImg = false;
  if (bgImg) {
    var iw = bgImg.naturalWidth || bgImg.width, ih = bgImg.naturalHeight || bgImg.height;
    if (iw && ih) {
      var s = Math.max(VW / iw, VH / ih);          // cover-fit: fill the canvas
      var bw = iw * s, bh = ih * s;
      var sm = ctx.imageSmoothingEnabled;
      ctx.imageSmoothingEnabled = true;            // smooth (NOT pixelated)
      try { ctx.drawImage(bgImg, (VW - bw) / 2, (VH - bh) / 2, bw, bh); drewImg = true; } catch (e) {}
      ctx.imageSmoothingEnabled = sm;
    }
  }
  if (drewImg) {
    // gentle darkening scrim so the ball, paddles and score stay readable over art
    ctx.fillStyle = "rgba(8,10,24,0.34)"; ctx.fillRect(-40, -40, VW + 80, VH + 80);
  }

  // ambient world particles (snow, bubbles, embers, stars...) drifting behind the court
  drawParticles();

  // court frame
  ctx.fillStyle = "rgba(255,255,255,0.04)";
  rrect(court.x, court.y, court.w, court.h, 18); ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,0.12)"; ctx.lineWidth = 3;
  rrect(court.x, court.y, court.w, court.h, 18); ctx.stroke();

  // center net (dashed)
  ctx.strokeStyle = th.net; ctx.globalAlpha = 0.5; ctx.lineWidth = 4;
  ctx.setLineDash([14, 12]); ctx.beginPath();
  ctx.moveTo(court.x + 12, c2y(0.5)); ctx.lineTo(court.x + court.w - 12, c2y(0.5));
  ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;

  // paddles — "my" color is whichever paddle the local player drives
  var myIsBottom = !(mode === "online" && role === "guest");
  paddle(G.bottomX, 1 - 0.045, myIsBottom ? th.me : th.opp);
  paddle(G.topX, 0.045, myIsBottom ? th.opp : th.me);

  // ball
  if (!(G.cool > 0 && state === "play") || true) {
    var bx = c2x(G.bx), by = c2y(G.by), r = GAME_CONFIG.ballR * court.w;
    var rg = ctx.createRadialGradient(bx - r * 0.3, by - r * 0.3, r * 0.2, bx, by, r);
    rg.addColorStop(0, "#fff"); rg.addColorStop(1, th.ball);
    ctx.fillStyle = rg; ctx.shadowColor = th.ball; ctx.shadowBlur = 18;
    ctx.beginPath(); ctx.arc(bx, by, r, 0, 7); ctx.fill(); ctx.shadowBlur = 0;
  }

  // scores (top-of-screen for the opponent, bottom for me)
  var topScore = myIsBottom ? G.sTop : G.sBottom;
  var botScore = myIsBottom ? G.sBottom : G.sTop;
  ctx.font = "900 30px Nunito, sans-serif"; ctx.textAlign = "left";
  ctx.fillStyle = "rgba(255,255,255,0.85)";
  ctx.fillText(String(topScore), court.x + 16, court.y + 40);
  ctx.fillText(String(botScore), court.x + 16, court.y + court.h - 18);

  // FX layer (particle bursts, explosions, screen flash, "Point!" pops)
  if (BM) BM.draw(ctx, fx, { font: "900 26px Nunito, sans-serif" });

  // smack-talk speech bubbles (top = opponent/bot, bottom = you)
  if (bubbleTop) bubble(bubbleTop, c2x(0.5), court.y + court.h * 0.16);
  if (bubbleBot) bubble(bubbleBot, c2x(0.5), court.y + court.h * 0.84);

  // how-to-play demo (wordless, plays itself until the kid takes over)
  if (demoOn && state === "play" && mode !== "online") drawTennisDemo();

  // overlays
  if (paused) banner("Waiting for " + oppName + "…", "");
  else if (state === "over") {
    var myIsBottom2 = !(mode === "online" && role === "guest");
    var iWon = (G.winner === "bottom") === myIsBottom2;
    banner(iWon ? "You win! 🎉".replace(" 🎉", "") : (mode === "solo" ? "Try again!" : "So close!"),
           mode === "online" ? "Tap to play again" : "Tap for the menu");
  } else if (state === "play" && G.cool > 0 && !demoOn) {
    ctx.font = "800 22px Nunito, sans-serif"; ctx.textAlign = "center";
    ctx.fillStyle = "rgba(255,255,255,0.8)";
    ctx.fillText("Get ready!", c2x(0.5), c2y(0.5) - 30);
  }
  ctx.restore();
}

function drawTennisDemo() {
  var tt = Date.now() / 1000;
  var th = worldTheme(worldKey);
  // freeze scrim over the court
  ctx.fillStyle = "rgba(10,12,40,0.72)";
  rrect(court.x, court.y, court.w, court.h, 18); ctx.fill();
  // caption
  ctx.textAlign = "center"; ctx.fillStyle = "#fff";
  ctx.font = "900 34px Nunito, sans-serif";
  ctx.fillText("Slide to move!", c2x(0.5), court.y + court.h * 0.20);
  ctx.font = "700 20px Nunito, sans-serif"; ctx.fillStyle = "rgba(255,255,255,0.85)";
  ctx.fillText("Bounce the ball back", c2x(0.5), court.y + court.h * 0.20 + 34);
  // cosmetic demo paddle sliding side to side
  var swing = Math.sin(tt * 1.4) * 0.26, pnx = 0.5 + swing, pny = 0.72;
  // demo ball bouncing just above the paddle, tracking it a beat behind
  var bnx = 0.5 + Math.sin((tt - 0.25) * 1.4) * 0.26;
  var bny = pny - 0.06 - Math.abs(Math.sin(tt * 3)) * 0.14;
  var bx = c2x(bnx), by = c2y(bny), br = GAME_CONFIG.ballR * court.w;
  ctx.fillStyle = "#fff"; ctx.shadowColor = th.ball; ctx.shadowBlur = 16;
  ctx.beginPath(); ctx.arc(bx, by, br, 0, 7); ctx.fill(); ctx.shadowBlur = 0;
  paddle(pnx, pny, th.me);
  // 3D hand under the demo paddle, fingertip touching it, sliding along
  var ph = 0.022 * court.h * 1.6, padBottom = c2y(pny) + ph / 2;
  var s = Math.max(0.9, Math.min(1.7, court.w / 620));
  if (BR && BR.hand) BR.hand(ctx, c2x(pnx), padBottom + 30 * s, s);
  // gentle tap-to-start hint
  ctx.fillStyle = "rgba(255,255,255,0.7)"; ctx.font = "800 18px Nunito, sans-serif";
  ctx.fillText("Tap to play", c2x(0.5), court.y + court.h - 26);
}

function bubble(b, cx, cy) {
  var fade = Math.min(1, b.t / 0.4);
  ctx.font = "800 18px Nunito, sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  var w = ctx.measureText(b.text).width + 30, h = 34;
  ctx.globalAlpha = fade;
  ctx.fillStyle = "rgba(255,255,255,0.95)";
  rrect(cx - w / 2, cy - h / 2, w, h, 16); ctx.fill();
  ctx.fillStyle = "#1a1330"; ctx.fillText(b.text, cx, cy + 1);
  ctx.globalAlpha = 1; ctx.textBaseline = "alphabetic";
}
function paddle(nx, ny, col) {
  var w = GAME_CONFIG.paddleW * court.w, h = 0.022 * court.h * 1.6;
  var x = c2x(nx) - w / 2, y = c2y(ny) - h / 2;
  var g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, "#ffffff"); g.addColorStop(1, col);
  ctx.fillStyle = g; ctx.shadowColor = col; ctx.shadowBlur = 14;
  rrect(x, y, w, h, h / 2); ctx.fill(); ctx.shadowBlur = 0;
}
function rrect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function banner(title, sub) {
  BuildableWin.card(ctx, court.w, court.h, [{t:title,s:32,w:900,c:"#fff"}].concat(sub?[{t:sub,s:18,w:700,c:"#cfd3ff"}]:[]), { cx:c2x(0.5), cy:c2y(0.5) });
}

/* ---------- 7) AUDIO: bespoke ElevenLabs one-shots (synth fallback) ---------- */
var _sndCache = {};
function ping(name, fallback) {
  if (!BA || BA.muted) return;
  try {
    if (!BA._unlocked) { if (fallback) BA.sfx(fallback); return; }
    var a = _sndCache[name];
    if (!a) { a = new Audio("/api/sfx?s=" + name); a.volume = 0.5; _sndCache[name] = a; }
    a.currentTime = 0;
    var pr = a.play();
    if (pr && pr.catch) pr.catch(function () { if (fallback) BA.sfx(fallback); });
  } catch (e) { if (fallback) BA.sfx(fallback); }
}

// per-world background music (real ElevenLabs tracks via /api/tennis-music, cached).
// Own a single looping <audio> element, like chess; respects the mute toggle.
var musicEl = null, musicWorld = null;
function playMusic() {
  if (!BA || BA.muted || !BA._unlocked) return;
  var key = mapWorld(worldKey);
  if (!musicEl) { musicEl = new Audio(); musicEl.loop = true; musicEl.volume = 0.32; }
  if (musicWorld !== key) { musicEl.src = "/api/tennis-music?world=" + key; musicWorld = key; }
  var pr = musicEl.play(); if (pr && pr.catch) pr.catch(function () {});
}
function stopMusic() { if (musicEl) { try { musicEl.pause(); } catch (e) {} } }

/* ---------- 8) ONLINE: the frozen mp: contract ---------- */
function mp(type, extra) {
  var msg = Object.assign({ type: type }, extra || {});
  try { if (window.parent && window.parent !== window) window.parent.postMessage(msg, "*"); } catch (e) {}
}
function sendPaddle(nx) {
  var now = _now();
  if (now - lastSentPaddle < 28) return;        // ~36/s
  lastSentPaddle = now;
  mp("mp:send", { event: "paddle", data: { x: nx } });
}
function sendBall() {
  var now = _now();
  if (now - lastSentBall < 28) return;          // ~36/s
  lastSentBall = now;
  mp("mp:send", { event: "ball", data: { x: G.bx, y: G.by, vx: G.vx, vy: G.vy, sB: G.sBottom, sT: G.sTop } });
}
function applyPeer(event, data) {
  if (!G || !data) return;
  if (event === "paddle") {
    // opponent's own paddle: host receives guest's TOP paddle; guest receives host's BOTTOM paddle
    if (role === "host") G.oppTargetX = data.x;      // guest paddle (top)
    else G.oppTargetX = data.x;                       // host paddle (bottom)
  } else if (event === "ball") {
    G.bxT = data.x; G.byT = data.y; G.vx = data.vx; G.vy = data.vy;
    if (typeof data.sB === "number") { G.sBottom = data.sB; G.sTop = data.sT; }
    G.cool = 0;
  } else if (event === "result") {
    if (state !== "over") { G.winner = (data.winner === meKid) ? (role === "host" ? "bottom" : "top")
                                                               : (role === "host" ? "top" : "bottom");
      state = "over"; var iWon = data.winner === meKid;
      ping(iWon ? "tennis_win" : "tennis_lose", iWon ? "win" : "lose"); }
  }
}

if (online) {
  // hide the local menu — the React lobby drives this match
  var mEl = document.getElementById("menu"); if (mEl) mEl.style.display = "none";
  window.addEventListener("message", function (e) {
    var d = e.data || {}; if (!d.type || String(d.type).indexOf("mp:") !== 0) return;
    if (d.type === "mp:init") {
      role = d.role || "host"; flip = (role === "guest");
      worldKey = mapWorld(d.world); loadBg(worldKey);
      meKid = d.you && d.you.kidId; meName = (d.you && d.you.name) || "You";
      oppKid = d.opp && d.opp.kidId; oppName = (d.opp && d.opp.name) || "Friend";
      mode = "online"; diff = 1;                       // family games play at "Normal"
      showReactBar(true);
    } else if (d.type === "mp:start") {
      mode = "online"; newGame();
    } else if (d.type === "mp:peer") {
      if (paused) paused = false;
      applyPeer(d.event, d.data);
    } else if (d.type === "mp:reaction") {
      if (d.text && BM) BM.pop(fx.pops, c2x(0.5), c2y(0.28), d.text, "#fff");
    } else if (d.type === "mp:peerLeft") {
      paused = true;
    }
  });
  // tell the pipes we're loaded and ready
  mp("mp:ready", {});
}

// canned-reaction bar (online only) — child-safe fixed phrases, no free text.
// MUST stay a subset of the ALLOWED list enforced in src/FamilyRealtime.jsx.
var REACTIONS = ["Nice shot!", "Too slow!", "So close!", "Let's go!", "Is that all?", "You got this!", "Boop!", "Wibble wobble!", "Bonk!", "Wheee!", "Great game!", "Haha!"];
function showReactBar(on) {
  var t = document.getElementById("reactToggle"), pop = document.getElementById("reactPop");
  if (!t || !pop) return;
  if (on && !pop._built) {
    REACTIONS.forEach(function (txt) {
      var b = document.createElement("button"); b.textContent = txt;
      b.onclick = function () { mp("mp:reaction", { text: txt }); if (BM) BM.pop(fx.pops, c2x(0.5), c2y(0.72), txt, "#fff"); pop.className = ""; };
      pop.appendChild(b);
    });
    pop._built = true;
    t.onclick = function () { pop.className = (pop.className === "on") ? "" : "on"; };
  }
  t.className = on ? "on" : "";
  if (!on) pop.className = "";
}

/* ---------- 9) START SCREEN (shared BS) for solo / two-player ---------- */
var startUI = null;
function refreshStart() { try { if (startUI && startUI.update) startUI.update(startConfig()); } catch (e) {} }
/* LP4: a difficulty card shows the court you are about to play on, not a flat
   colour — drawn by the one shared helper (buildable-levelthumb.js) from the
   equipped world's own palette, over the world scene the game has already
   loaded once that arrives. The three cards share a court, so the ball's
   streak length is what tells the tiers apart. */
function courtThumb(i) {
  var BLT = window.BuildableLevelThumb; if (!BLT) return undefined;
  var th = worldTheme(worldKey);
  var photo = (bgImg && (bgImg.naturalWidth || bgImg.width)) ? bgImg : null;
  return BLT.make("court",
    { bg: th.bg, net: th.net, me: th.me, opp: th.opp, ball: th.ball, tier: i, photo: photo },
    "tn_" + mapWorld(worldKey) + "_" + i + (photo ? "_p" : "_c")) || undefined;
}
function startConfig() {
  return {
    title: GAME_CONFIG.name,
    subtitle: mode === "two" ? "Two players — one each end of the screen!" : "Bounce it past your opponent to score!",
    sound: !(BA && BA.muted), showBack:false,
    modes: ["solo", "two", "family"], mode: mode,
    levels: GAME_CONFIG.levels.map(function (lv, i) {
      return { n: i + 1, name: lv.name, color: ["#2b6f5c", "#4a3b8c", "#6b2f4a"][i % 3],
               img: courtThumb(i),
               state: "ready", foot: ["Easy", "Normal", "Tricky"][i] };   // difficulty picker (all playable)
    }),
    customizeLabel: "Choose your court",
  };
}
function mountStart() {
  if (online) return;
  var m = document.getElementById("menu"); if (!m || !BS) return;
  var cbs = {
    onPlay: function (n) { if (BA) BA.unlock(); diff = (n || 1) - 1; m.style.display = "none"; newGame(); },
    onMode: function (mo) { if (mo === "family") { try { window.parent.postMessage({ type: "tennisPlayFriend" }, "*"); } catch (e) {} return; } mode = (mo === "two") ? "two" : "solo"; if (startUI) startUI.update(startConfig()); },
    onSound: function () { if (BA) { BA.unlock(); BA.toggleMute(); if (BA.muted) stopMusic(); else playMusic(); } if (startUI) startUI.update(startConfig()); },
    onCustomize: showCourtPicker,
    onBack: function () {},
  };
  if (!startUI) startUI = BS.mount(m, startConfig(), cbs); else startUI.update(startConfig());
}

/* ---------- "Choose your court" picker (AI art worlds) ---------- */
function showCourtPicker() {
  var ov = document.getElementById("court"); if (!ov) return;
  buildCourtGrid();
  var m = document.getElementById("menu"); if (m) m.style.display = "none";
  ov.classList.add("show");
}
function hideCourtPicker() {
  var ov = document.getElementById("court"); if (ov) ov.classList.remove("show");
  var m = document.getElementById("menu"); if (m) m.style.display = "block";
}
function buildCourtGrid() {
  var grid = document.getElementById("courtGrid"); if (!grid) return;
  grid.innerHTML = "";
  Object.keys(GAME_CONFIG.worlds).forEach(function (key) {
    var w = GAME_CONFIG.worlds[key];
    var card = document.createElement("div");
    card.className = "court-card" + (key === worldKey ? " on" : "");
    var thumb = document.createElement("div"); thumb.className = "thumb";
    thumb.style.background = "linear-gradient(160deg," + w.bg[0] + "," + w.bg[1] + ")";
    // overlay the smooth AI nature scene; if it isn't ready yet, the gradient shows through
    var imgURL = "/api/images?kind=tennis&id=" + key + "&v=2";
    var im = new Image();
    im.onload = function () { thumb.style.backgroundImage = "url('" + imgURL + "')"; };
    im.src = imgURL;
    var nm = document.createElement("div"); nm.className = "nm"; nm.textContent = w.name;
    card.appendChild(thumb); card.appendChild(nm);
    card.onclick = function () {
      worldKey = key; loadBg(worldKey); initParticles();
      if (BA) BA.unlock(); playMusic();   // preview the chosen world's music
      refreshStart();                     // the difficulty cards now show the new court
      hideCourtPicker();
    };
    grid.appendChild(card);
  });
}
(function () {
  var back = document.getElementById("courtBack");
  if (back) back.onclick = hideCourtPicker;
})();
function backToMenu() {
  if (online) { newGame(); return; }              // online: tap restarts
  state = "title"; var m = document.getElementById("menu"); if (m) m.style.display = "block"; mountStart();
}

// tap on the end screen
if (canvas) canvas.addEventListener("pointerdown", function () {
  if (state === "over") { if (mode === "online") { if (role === "host") newGame(); } else if (shellMode) { newGame(); } else backToMenu(); }
});

/* ---------- 10) RESIZE + MAIN LOOP ---------- */
function resize() {
  if (!canvas) return;
  VW = window.innerWidth; VH = window.innerHeight;
  DPR = window.devicePixelRatio || 1;
  canvas.width = VW * DPR; canvas.height = VH * DPR;
  canvas.style.width = VW + "px"; canvas.style.height = VH + "px";
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  // fit a 3:4 portrait court centered, with margins
  var maxW = VW * 0.96, maxH = VH * 0.92, aspect = 3 / 4;
  var w = maxW, h = w / aspect;
  if (h > maxH) { h = maxH; w = h * aspect; }
  court.w = w; court.h = h; court.x = (VW - w) / 2; court.y = (VH - h) / 2;
}
window.addEventListener("resize", resize);

var last = 0;
function frame(ts) {
  var dt = last ? (ts - last) / 1000 : 0.016; last = ts;
  if (BM) BM.update(fx, dt);
  if (parts.length) updateParticles(dt);
  if (bubbleTop) { bubbleTop.t -= dt; if (bubbleTop.t <= 0) bubbleTop = null; }
  if (bubbleBot) { bubbleBot.t -= dt; if (bubbleBot.t <= 0) bubbleBot = null; }
  update(dt);
  if (G) draw();
  requestAnimationFrame(frame);
}

// boot
if (typeof document !== "undefined" && canvas) {
  resize();
  if (shellWorld) worldKey = mapWorld(shellWorld);   // Session 7F: shell-equipped court
  newGame(); state = "title";       // have a field to draw behind the menu
  if (online) { /* online: the lobby drives start */ }
  else if (shellMode) { mode = shellMode; var m0 = document.getElementById("menu"); if (m0) m0.style.display = "none"; newGame(); }   // Session 7F: launch straight into the chosen mode, no start screen
  else mountStart();
  requestAnimationFrame(frame);
}

/* ---------- 10b) SHARED NAV BRIDGE (HUD-AND-NAV-RULES.md) ----------
   Tennis was the one interactive engine that never loaded buildable-gamenav.js.
   That script also installs the iOS Home catcher: on iPhone a touch on the
   shell's Home button (which floats OVER our iframe) is routed into the iframe,
   so Home "did nothing" on a phone while working fine with a desktop mouse. */
if (window.BuildableGameNav) {
  window.BuildableGameNav.register({
    onSound: function () { if (BA) { BA.unlock(); BA.toggleMute(); if (BA.muted) stopMusic(); else playMusic(); } if (startUI) startUI.update(startConfig()); },
    soundOn: function () { return !(BA && BA.muted); },
    inGame:  function () { return state === "play"; },
  });
}

/* ---------- 11) QA / HEADLESS HOOK ---------- */
// A perfect player (bottom paddle tracks the ball) must beat the bot on every
// difficulty. qa-tennis.mjs drives this in Node with stubbed browser globals.
window.TENNIS_GAME = {
  _cfg: function () { return GAME_CONFIG; },
  _begin: function (i) { mode = "solo"; diff = i || 0; newGame(); },
  _step: function (n) { for (var k = 0; k < (n || 1); k++) update(0.016); },
  _draw: function () { try { draw(); return "ok"; } catch (e) { return "ERR: " + (e && e.message || e); } },
  // simulate one difficulty to a finish with a flawless bottom player
  sim: function (idx, maxFrames) {
    mode = "solo"; diff = idx || 0; newGame();
    var cap = maxFrames || 40000, f = 0;
    while (state !== "over" && f < cap) {
      // flawless player: aim each return to the corner away from the bot,
      // by offsetting the paddle so the contact angle steers the ball there
      var aim = G.topX < 0.5 ? 0.84 : 0.16;
      var desiredOff = (aim > G.bx) ? 0.8 : -0.8;
      G.bottomX = clamp(G.bx - desiredOff * (GAME_CONFIG.paddleW / 2));
      update(0.016); f++;
    }
    return { level: idx, result: (G.winner === "bottom" ? "win" : "lose"),
             frames: f, sB: G.sBottom, sT: G.sTop };
  },
  campaign: function (cap) {
    var out = []; for (var i = 0; i < GAME_CONFIG.levels.length; i++) out.push(this.sim(i, cap || 40000));
    return out;
  },
};
</script>
