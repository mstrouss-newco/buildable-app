<!doctype html>
<html lang="en">
<head>
    <link rel="icon" href="/favicon.ico?v=4" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=4" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=4" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=4" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=4" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#7C5CFC" />

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buildable — Make a Game (quiz mockup)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --fred:'Fredoka',sans-serif; --nun:'Nunito',sans-serif; }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:var(--nun); color:#fff; min-height:100vh;
    background:
      radial-gradient(circle at 12% -10%, rgba(155,126,221,0.28), transparent 42%),
      radial-gradient(circle at 88% 112%, rgba(214,90,123,0.24), transparent 42%),
      #0a0a14;
  }
  .grad{background:linear-gradient(135deg,#9b7edd 0%,#c06b99 50%,#d65a7b 100%);}
  .wrap{max-width:820px;margin:0 auto;padding:18px 16px 70px;display:flex;flex-direction:column;align-items:center;}
  .topbar{width:100%;max-width:760px;display:flex;justify-content:space-between;gap:8px;margin-bottom:8px;}
  .nav{padding:10px 18px;background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.16);border-radius:14px;font-weight:700;font-family:var(--nun);cursor:pointer;}

  /* landing */
  .logo{font-family:var(--fred);font-size:clamp(30px,8vw,48px);margin:26px 0 6px;
    background:linear-gradient(135deg,#9b7edd,#c06b99,#d65a7b);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
  .tag{opacity:.82;margin:0 0 26px;font-size:16px;}
  .start{padding:16px 34px;border-radius:18px;border:none;color:#fff;font-size:19px;font-weight:800;font-family:var(--fred);cursor:pointer;box-shadow:0 10px 30px rgba(155,126,221,.5);}
  .surprise{margin-top:14px;padding:12px 26px;border-radius:16px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;font-size:16px;font-weight:800;font-family:var(--fred);cursor:pointer;}

  /* dots */
  .dots{display:flex;gap:6px;margin:6px 0 14px;flex-wrap:wrap;justify-content:center;max-width:320px;}
  .dot{width:9px;height:9px;border-radius:50%;background:#39406e;}
  .dot.on{background:#c06b99;} .dot.done{background:#7aa2ff;}

  /* buddy */
  .buddy{display:flex;align-items:center;gap:12px;max-width:600px;margin:2px 0 16px;}
  .buddy img{width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.06);object-fit:contain;flex:0 0 auto;border:2px solid rgba(255,255,255,.14);}
  .bubble{position:relative;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);border-radius:16px;padding:12px 16px;font-family:var(--fred);font-size:20px;}
  .bubble:before{content:"";position:absolute;left:-9px;top:22px;border:7px solid transparent;border-right-color:rgba(255,255,255,.12);}
  .snd{font-size:12px;opacity:.6;margin-left:6px;font-family:var(--nun);font-weight:700;}

  .hint{opacity:.7;font-size:13px;margin:-6px 0 12px;text-align:center;}

  /* tile grid */
  .grid{width:100%;max-width:760px;display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:12px;}
  .tile{position:relative;border-radius:16px;border:2px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);color:#fff;cursor:pointer;padding:8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-family:var(--nun);}
  .tile:hover{border-color:rgba(255,255,255,.3);}
  .tile.on{border-color:#ffe08a;box-shadow:0 0 0 3px rgba(255,224,138,.3);}
  .tile img{width:100%;aspect-ratio:1/1;object-fit:contain;border-radius:12px;background:rgba(255,255,255,.05);}
  .tile.world img{object-fit:cover;}
  .lbl{font-size:13px;font-weight:700;text-align:center;}
  .rankbadge{position:absolute;top:6px;left:6px;width:26px;height:26px;border-radius:50%;background:#ffb454;color:#3a2400;font-family:var(--fred);font-weight:700;display:none;align-items:center;justify-content:center;font-size:15px;border:2px solid #fff;}
  .tile.on .rankbadge{display:flex;}

  .wiznav{display:flex;gap:12px;justify-content:center;align-items:center;margin-top:18px;}
  .skip{padding:12px 20px;border-radius:14px;border:1px solid rgba(255,255,255,.2);background:transparent;color:#cdd3ff;font-weight:700;font-family:var(--fred);cursor:pointer;}
  .next{padding:12px 30px;border-radius:14px;border:none;color:#fff;font-weight:800;font-family:var(--fred);font-size:16px;cursor:pointer;}
  .next[disabled]{opacity:.4;cursor:not-allowed;}

  /* finish */
  .finish{width:100%;max-width:520px;display:flex;flex-direction:column;align-items:center;}
  .fieldlbl{font-size:14px;opacity:.85;margin-bottom:6px;font-family:var(--fred);}
  .bigin{width:100%;box-sizing:border-box;padding:13px 16px;border-radius:14px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);color:#fff;font-size:16px;font-family:var(--nun);margin-bottom:12px;}
  .sparkgrid{width:100%;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:12px;}
  .spark{border-radius:14px;border:2px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);color:#fff;cursor:pointer;padding:13px 12px;font-family:var(--fred);font-size:14px;text-align:center;}
  .spark.on{border-color:#ffe08a;box-shadow:0 0 0 3px rgba(255,224,138,.3);}
  .make{margin-top:8px;padding:16px 34px;border-radius:18px;border:none;color:#fff;font-size:19px;font-weight:800;font-family:var(--fred);cursor:pointer;box-shadow:0 10px 30px rgba(155,126,221,.5);}

  /* so-far chip strip */
  .sofar{width:100%;max-width:760px;margin-top:30px;}
  .sofarhead{font-size:13px;color:#b9b9d0;margin-bottom:8px;font-weight:700;text-align:center;}
  .chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;}
  .chip{display:flex;flex-direction:column;align-items:center;gap:2px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:6px 8px;min-width:74px;}
  .chev{background:transparent;border:none;color:#9aa0c7;cursor:pointer;padding:0;line-height:0;height:16px;font-size:14px;}
  .chip img{width:38px;height:38px;object-fit:contain;border-radius:8px;}
  .chipval{font-size:11px;font-weight:700;text-align:center;max-width:84px;}
  .crewmini{display:flex;gap:3px;}
  .crewmini .cm{position:relative;}
  .crewmini img{width:30px;height:30px;}
  .crewmini .r{position:absolute;top:-6px;left:-3px;width:15px;height:15px;border-radius:50%;background:#ffb454;color:#3a2400;font-family:var(--fred);font-weight:700;font-size:10px;display:flex;align-items:center;justify-content:center;}

  .seg{display:inline-block;font-size:11px;font-weight:800;border-radius:999px;padding:2px 9px;margin-left:8px;font-family:var(--nun);vertical-align:middle;}
  .seg.core{background:rgba(122,162,255,.22);color:#bcd0ff;}
  .seg.action{background:rgba(255,180,84,.22);color:#ffce8f;}

  .savedwrap{width:100%;max-width:760px;margin-top:30px;}
  .savedrow{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;}
  .savedcard{width:150px;text-align:center;}
  .savedcover{width:150px;height:96px;border-radius:14px;overflow:hidden;position:relative;border:1px solid rgba(255,255,255,.12);}
  .savedcover img{width:100%;height:100%;object-fit:cover;}
  .savedcover .h{position:absolute;right:4px;bottom:-4px;width:44px;height:44px;object-fit:contain;}
  .savedname{font-size:13px;font-weight:700;margin-top:6px;}
</style>
<style id="no-longpress">/* Buildable: disable iOS long-press magnifier + Look Up/Translate popup app-wide; keep inputs selectable */
html,body{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
input,textarea,select,[contenteditable]{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
const SL="https://www.buildablekids.com/api/story-library";
const GA="https://www.buildablekids.com/api/game-art";
const char=s=>`${SL}?img=character:${s}&style=watercolor`;
const ga=(w,p)=>`${GA}?img=${w}:${p}&style=watercolor`;

const CHARS=[["fox","Pip Fox"],["bunny","Bramble Bunny"],["dragon","Ember Dragon"],["owl","Professor Owl"],["robot","Bolt Robot"],["unicorn","Sparkle Unicorn"],["fairy","Petal Fairy"],["penguin","Waddle Penguin"],["otter","Ollie Otter"],["hedgehog","Quill Hedgehog"]];
const ENEMIES=[["candy-land","Gumdrop"],["snowy-village","Snowball"],["coral-reef","Snippy Crab"],["dino-jungle","Baby Dino"],["desert-oasis","Armadillo"],["enchanted-forest","Forest Sprite"],["space-station","Bloop"],["dragon-mountain","Dragonling"]];
const BOSSES=[["coral-reef","Crab King"],["dragon-mountain","Dragon King"],["candy-land","Gummy King"],["space-station","Robo King"],["dino-jungle","Dino King"],["enchanted-forest","Forest Giant"],["snowy-village","Snow King"],["desert-oasis","Dust King"]];
const WORLDS=[["coral-reef","Coral Reef","Reef"],["enchanted-forest","Enchanted Forest","Forest"],["snowy-village","Snowy Village","Snow"],["dragon-mountain","Dragon Mountain","Mountain"],["dino-jungle","Dino Jungle","Jungle"],["space-station","Starlight Space","Space"],["desert-oasis","Desert Oasis","Desert"],["candy-land","Candy Land","Candy"]];
const SPARKS=["A race to the flag","Rescue the lost coins","Beat the boss","A spooky night run","Collect every star","My birthday adventure"];

const STEPS=[
  {key:"hero", seg:"core",   q:"Who's your hero?",   opts:CHARS,   img:s=>char(s), kind:"char"},
  {key:"side", seg:"core",   q:"Pick a sidekick",    opts:CHARS,   img:s=>char(s), kind:"char"},
  {key:"crew", seg:"action", q:"Make the bad guys",  opts:ENEMIES, img:s=>ga(s,'critter'), kind:"crew"},
  {key:"boss", seg:"action", q:"Build a boss",       opts:BOSSES,  img:s=>ga(s,'boss'), kind:"boss"},
  {key:"world",seg:"core",   q:"Pick the world",     opts:WORLDS,  img:s=>ga(s,'far'), kind:"world"},
];
const TOTAL=STEPS.length;
const nameOf=(opts,id)=>{const o=opts.find(x=>x[0]===id);return o?o[1]:"";};

const st={view:"landing", step:0, hero:"fox", side:"fairy", crew:["candy-land","snowy-village","coral-reef","dino-jungle"], boss:"coral-reef", world:"coral-reef", name:"", spark:""};
const buddy=()=>st.side||"owl";
function gameName(){const w=WORLDS.find(x=>x[0]===st.world);const h=nameOf(CHARS,st.hero).split(" ")[0];return st.name||`${h}'s ${w?w[2]:''} Dash`;}

const app=document.getElementById('app');
function el(html){const d=document.createElement('div');d.innerHTML=html.trim();return d.firstChild;}

function render(){
  app.innerHTML="";
  if(st.view==="landing")return renderLanding();
  return renderQuiz();
}

function renderLanding(){
  app.appendChild(el(`<div class="topbar"><button class="nav" data-act="home">Back</button><button class="nav" data-act="home">Home</button></div>`));
  app.appendChild(el(`<h1 class="logo">Games</h1>`));
  app.appendChild(el(`<p class="tag">Build your own game — just tap!</p>`));
  app.appendChild(el(`<button class="start grad" data-act="start">Make a new game</button>`));
  app.appendChild(el(`<button class="surprise" data-act="surprise">Surprise me!</button>`));
  app.appendChild(el(`<div class="savedwrap"><div class="sofarhead" style="font-family:var(--fred);font-size:20px;color:#fff;margin-bottom:12px;text-align:left">My games</div>
    <div class="savedrow">
      <div class="savedcard"><div class="savedcover"><img src="${ga('coral-reef','far')}"><img class="h" src="${char('fox')}"></div><div class="savedname">Pip's Reef Dash</div></div>
      <div class="savedcard"><div class="savedcover"><img src="${ga('candy-land','far')}"><img class="h" src="${char('unicorn')}"></div><div class="savedname">Sparkle's Candy Dash</div></div>
      <div class="savedcard"><div class="savedcover"><img src="${ga('space-station','far')}"><img class="h" src="${char('robot')}"></div><div class="savedname">Bolt's Space Dash</div></div>
    </div></div>`));
}

function renderQuiz(){
  const atEnd=st.step>=TOTAL;
  const cur=STEPS[st.step];
  app.appendChild(el(`<div class="topbar"><button class="nav" data-act="back">Back</button><button class="nav">Sound on</button><button class="nav" data-act="home">Home</button></div>`));
  // dots
  let dots=`<div class="dots">`;
  for(let i=0;i<TOTAL;i++)dots+=`<span class="dot ${i===st.step?'on':(i<st.step?'done':'')}"></span>`;
  dots+=`<span class="dot ${atEnd?'on':''}"></span></div>`;
  app.appendChild(el(dots));

  // buddy + question
  const qtext=atEnd?"One last thing! Name your game.":cur.q;
  const seg=atEnd?"":`<span class="seg ${cur.seg}">${cur.seg==='core'?'core':'action pack'}</span>`;
  app.appendChild(el(`<div class="buddy"><img src="${char(buddy())}"><div class="bubble">${qtext}${seg}<span class="snd">▸ read aloud</span></div></div>`));

  if(!atEnd){
    if(cur.kind==="crew"){
      app.appendChild(el(`<div class="hint">Pick 3 to 5 — tap in order from easiest (1) to hardest. Tap again to remove.</div>`));
      let g=`<div class="grid">`;
      cur.opts.forEach(([id,label])=>{
        const idx=st.crew.indexOf(id);const on=idx>=0;
        g+=`<button class="tile ${on?'on':''}" data-crew="${id}"><span class="rankbadge">${on?idx+1:''}</span><img src="${cur.img(id)}" alt="${label}"><span class="lbl">${label}</span></button>`;
      });
      g+=`</div>`;
      app.appendChild(el(g));
    } else {
      const cls=cur.kind==="world"?"tile world":"tile";
      const val=st[cur.key];
      let g=`<div class="grid">`;
      cur.opts.forEach(([id,label])=>{
        g+=`<button class="${cls} ${val===id?'on':''}" data-pick="${id}"><img src="${cur.img(id)}" alt="${label}"><span class="lbl">${label}</span></button>`;
      });
      g+=`</div>`;
      app.appendChild(el(g));
    }
    const crewOk = cur.kind!=="crew" || st.crew.length>=3;
    app.appendChild(el(`<div class="wiznav"><button class="skip" data-act="skipend">Skip to the end</button><button class="next grad" data-act="next" ${crewOk?'':'disabled'}>Next</button></div>`));
  } else {
    const fin=el(`<div class="finish">
      <label class="fieldlbl">Name your game</label>
      <input class="bigin" id="gname" maxlength="28" placeholder="${gameName()}" value="${st.name}" style="text-align:center;font-family:var(--fred);font-size:20px">
      <label class="fieldlbl" style="margin-top:8px">What happens? (optional)</label>
      <div class="sparkgrid">${SPARKS.map(t=>`<button class="spark ${st.spark===t?'on':''}" data-spark="${t}">${t}</button>`).join('')}</div>
      <button class="make grad" data-act="make">Make my game!</button>
    </div>`);
    app.appendChild(fin);
  }

  // your game so far
  const passed=[];
  STEPS.forEach((s2,i)=>{ if(i<st.step||atEnd) passed.push(s2); });
  if(passed.length){
    let strip=`<div class="sofar"><div class="sofarhead">Your game so far — change anything</div><div class="chips">`;
    passed.forEach(s2=>{
      if(s2.kind==="crew"){
        const mini=st.crew.map((id,i)=>`<span class="cm"><span class="r">${i+1}</span><img src="${ga(id,'critter')}"></span>`).join('');
        strip+=`<div class="chip"><div class="chipval" style="margin-bottom:3px">Bad guys</div><div class="crewmini">${mini}</div></div>`;
      } else {
        const val=st[s2.key];
        strip+=`<div class="chip"><button class="chev" data-cyc="${s2.key}|-1">▲</button><img src="${s2.img(val)}"><div class="chipval">${nameOf(s2.opts,val)}</div><button class="chev" data-cyc="${s2.key}|1">▼</button></div>`;
      }
    });
    strip+=`</div></div>`;
    app.appendChild(el(strip));
  }
}

function cycle(key,dir){
  const sdef=STEPS.find(x=>x.key===key);const opts=sdef.opts;
  let i=opts.findIndex(o=>o[0]===st[key]); i=((i<0?0:i)+dir+opts.length)%opts.length; st[key]=opts[i][0]; render();
}

app.addEventListener('click',e=>{
  const b=e.target.closest('[data-act],[data-pick],[data-crew],[data-cyc],[data-spark]');
  if(!b)return;
  if(b.dataset.act){
    const a=b.dataset.act;
    if(a==="start"){st.view="quiz";st.step=0;render();}
    else if(a==="surprise"){st.view="quiz";st.step=TOTAL;render();}
    else if(a==="home"){st.view="landing";render();}
    else if(a==="back"){ if(st.step>=TOTAL)st.step=TOTAL-1; else if(st.step>0)st.step--; else st.view="landing"; render(); }
    else if(a==="next"){ st.step=Math.min(TOTAL,st.step+1); render(); }
    else if(a==="skipend"){ st.step=TOTAL; render(); }
    else if(a==="make"){ const gn=document.getElementById('gname'); alert("(mockup) Building “"+((gn&&gn.value)||gameName())+"” — same recipe every game!"); }
    return;
  }
  if(b.dataset.pick){ const cur=STEPS[st.step]; st[cur.key]=b.dataset.pick; render(); return; }
  if(b.dataset.crew){ const id=b.dataset.crew; const i=st.crew.indexOf(id);
    if(i>=0)st.crew.splice(i,1); else if(st.crew.length<5)st.crew.push(id); render(); return; }
  if(b.dataset.cyc){ const [k,d]=b.dataset.cyc.split('|'); cycle(k,parseInt(d,10)); return; }
  if(b.dataset.spark){ st.spark = st.spark===b.dataset.spark?"":b.dataset.spark; render(); return; }
});
app.addEventListener('input',e=>{ if(e.target.id==="gname")st.name=e.target.value; });

render();
</script>
</body>
</html>
