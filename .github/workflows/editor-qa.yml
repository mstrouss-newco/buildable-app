# Session 9E — the editor's async QA gate.
#
# Saving in the game editor publishes immediately (that stays true — the owner should
# never wait on a robot). A moment later this Action play-tests what he just published
# and tells the editor whether every level is still beatable. If it is not, the editor
# shows a red banner with a one-click "Put it back", and GitHub's own failure email
# lands in the owner's inbox.
#
# Three ways in:
#   1. repository_dispatch  — fired by /api/manifest.js the instant a save goes live.
#   2. workflow_dispatch    — run it by hand from the Actions tab for one game or all.
#   3. schedule             — a nightly sweep of every game that has an editor save,
#                             so a change is never left un-play-tested just because the
#                             dispatch did not fire.
#
# Setup the owner does once (see SESSION-LOG.md for the plain-language version):
#   - repo secret   QA_REPORT_SECRET  — any long random string; the same value goes in
#                                       Vercel so the site trusts this Action's verdict.
#   - repo variable QA_SITE_URL       — optional; defaults to the live site.

name: Editor QA gate

on:
  # QA-FIX 2026-08-30: the release gate. Every push to main runs the WHOLE suite
  # (qa-all.mjs) including the serving check, so a file that is not routed can never
  # reach kids silently again. This is the trigger that was missing when Practice
  # shipped dead.
  push:
    branches: [main]
  repository_dispatch:
    types: [editor-qa]
  workflow_dispatch:
    inputs:
      game:
        description: 'Game id to play-test (leave blank to sweep every edited game)'
        required: false
        default: ''
  schedule:
    # 03:20 UTC nightly — quiet hours, and well clear of the existing Vercel crons.
    - cron: '20 3 * * *'

# Two saves in a row should not race each other onto the same game.
concurrency:
  group: editor-qa-${{ github.event.client_payload.game || inputs.game || 'sweep' }}
  cancel-in-progress: false

jobs:
  # ---- The whole-repo gate (QA-FIX 2026-08-30) --------------------------------
  # Runs on every push to main. Separate from play-test on purpose: this one needs no
  # secrets, touches nothing, and must go red the moment anything in the repo breaks.
  gate:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run every harness and the serving check
        run: node qa-all.mjs
      - name: Check the live site really serves what it should
        # Runs after the deploy that this push triggers, so give Vercel a moment.
        # Never fails the build on its own: a wobble on the live site is not a reason
        # to call the code broken, but the owner should still see it in the log.
        continue-on-error: true
        env:
          QA_SITE_URL: ${{ vars.QA_SITE_URL || 'https://buildablekids.com' }}
        run: |
          sleep 90
          node qa-all.mjs --live --only NOSUCHHARNESS

  play-test:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Play-test the live manifest
        env:
          QA_SITE_URL: ${{ vars.QA_SITE_URL || 'https://buildablekids.com' }}
          QA_REPORT_SECRET: ${{ secrets.QA_REPORT_SECRET }}
          QA_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GAME: ${{ github.event.client_payload.game || inputs.game }}
          SAVE_ID: ${{ github.event.client_payload.saveId }}
        run: |
          set -o pipefail
          if [ -n "$GAME" ]; then
            if [ -n "$SAVE_ID" ]; then
              node scripts/editor-qa-run.mjs --game "$GAME" --save-id "$SAVE_ID"
            else
              node scripts/editor-qa-run.mjs --game "$GAME"
            fi
          else
            node scripts/editor-qa-run.mjs --all
          fi
